<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config/supabase.js"></script>
<script src="shared/pwa.js" defer></script>
<style>
  body { margin:0; font-family:'Inter',system-ui,sans-serif; background:#f5f0e6; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:white; border-radius:20px; padding:40px; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,.08); max-width:320px; width:100%; }
  .logo { width:72px; height:72px; background:#1a3a5c; border-radius:16px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:32px; }
  h1 { color:#1a3a5c; font-size:20px; font-weight:700; margin:0 0 4px; }
  p  { color:#3c4f5c99; font-size:13px; margin:0 0 24px; }
  .spinner { width:32px; height:32px; border:3px solid #e2e8f0; border-top-color:#1a3a5c; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .status { font-size:12px; color:#3c4f5c80; }
  .btn { display:inline-block; margin-top:16px; background:#1a3a5c; color:white; text-decoration:none; padding:10px 24px; border-radius:10px; font-size:14px; font-weight:600; }
  #error-box { display:none; margin-top:16px; background:#fee2e2; color:#7f1d1d; border-radius:10px; padding:12px; font-size:12px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🏥</div>
  <h1>Ibnu Sina Wellness</h1>
  <p>Psychotherapy System</p>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Menyemak sesi...</div>
  <div id="error-box"></div>
  <a href="auth/login.html" class="btn" id="login-btn" style="display:none">Log Masuk →</a>
</div>

<script>
(async () => {
  const setStatus = t => document.getElementById('status').textContent = t;
  const showError = msg => {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('error-box').style.display = 'block';
    document.getElementById('error-box').textContent = msg;
    document.getElementById('login-btn').style.display = 'inline-block';
    document.getElementById('status').style.display = 'none';
  };

  try {
    // Detect invite/recovery tokens in hash
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const type = params.get('type');
    if (params.get('access_token') && (type === 'invite' || type === 'recovery')) {
      setStatus('Mengesahkan jemputan...');
      window.location.href = 'auth/set-password.html' + window.location.hash;
      return;
    }

    setStatus('Menyemak sesi...');
    const { data: { session }, error: sessionErr } = await window.db.auth.getSession();
    if (sessionErr) throw sessionErr;

    if (session) {
      setStatus('Memuatkan profil...');
      const { data: profile, error: profileErr } = await window.db
        .from('psy_profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (profileErr) throw profileErr;

      if (profile?.role) {
        setStatus('Mengalih ke dashboard...');
        window.location.href = `roles/${profile.role}/dashboard.html`;
        return;
      }
    }

    setStatus('Mengalih ke halaman log masuk...');
    window.location.href = 'auth/login.html';

  } catch (err) {
    console.error('Boot error:', err);
    showError('Ralat sambungan: ' + (err.message || 'Sila semak internet anda.'));
  }
})();
</script>
</body>
</html>
