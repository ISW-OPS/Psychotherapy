<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Surat Rasmi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📄</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-4">

        <!-- Tabs -->
        <div class="flex gap-2 border-b border-ink/10 flex-wrap">
          <button onclick="setTab('templates')" id="tab-templates" class="tab-btn active">Templat</button>
          <button onclick="setTab('pending')"   id="tab-pending"   class="tab-btn">Permohonan <span id="cnt-pending" class="badge">0</span></button>
          <button onclick="setTab('issued')"    id="tab-issued"    class="tab-btn">Telah Dikeluarkan <span id="cnt-issued" class="badge">0</span></button>
        </div>

        <!-- TEMPLATES -->
        <div id="pane-templates" class="space-y-3">
          <div class="bg-white rounded-xl border border-ink/10 p-5">
            <div class="flex items-center justify-between gap-3 mb-3 flex-wrap">
              <div>
                <h3 class="font-semibold text-sm">Senarai Templat Surat</h3>
                <p class="text-xs text-ink/60 mt-0.5">Format surat tetap (letterhead, signature, footer). Admin define isi & field yang staff perlu isi.</p>
              </div>
              <a id="btn-new-tpl" href="surat-edit.html" class="hidden bg-navy text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark">+ Tambah Templat</a>
            </div>
            <div class="mb-6">
              <div class="text-[11px] font-semibold text-ink/45 uppercase tracking-wider mb-2 pb-1.5 border-b border-ink/10">Surat Untuk Pesakit</div>
              <ul id="templates-patient" class="divide-y divide-ink/8"></ul>
              <div id="pager-patient" class="flex items-center justify-end gap-1 mt-3"></div>
            </div>
            <div>
              <div class="text-[11px] font-semibold text-ink/45 uppercase tracking-wider mb-2 pb-1.5 border-b border-ink/10">Kegunaan Dalaman</div>
              <ul id="templates-internal" class="divide-y divide-ink/8"></ul>
              <div id="pager-internal" class="flex items-center justify-end gap-1 mt-3"></div>
            </div>
          </div>
        </div>

        <!-- PENDING -->
        <div id="pane-pending" class="hidden space-y-3">
          <div id="pending-list"></div>
        </div>

        <!-- ISSUED -->
        <div id="pane-issued" class="hidden space-y-3">
          <div class="flex items-center justify-end">
            <a href="surat-issue.html" class="bg-navy text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark">+ Keluarkan Surat Baru</a>
          </div>
          <div id="issued-list"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<style>
.tab-btn { padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 500; color: rgba(0,0,0,0.5); border-bottom: 2px solid transparent; background: transparent; }
.tab-btn.active { color: #1e3a5f; border-bottom-color: #1e3a5f; font-weight: 600; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; background: rgba(0,0,0,0.08); border-radius: 9999px; font-size: 10px; font-weight: 600; margin-left: 4px; }
.tab-btn.active .badge { background: #1e3a5f; color: white; }
.chip { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 9999px; font-weight: 600; }
.palette-btn { width: 100%; text-align: left; padding: 5px 8px; background: white; border: 1px solid rgba(0,0,0,0.08); border-radius: 6px; font-size: 11px; cursor: pointer; transition: all .12s; }
.palette-btn:hover { background: #1e3a5f; color: white; border-color: #1e3a5f; }
.palette-btn .tag { display: block; font-family: monospace; font-size: 10px; opacity: 0.6; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/letterTemplates.js"></script>
<script src="_shared.js"></script>
<script>
const LOGO_URL = '../../image/Logo_ISW.png';

let allTemplates = [];
let allRequests = [];
let allIssued = [];
let allPatients = [];
let currentTab = 'templates';

function isAdmin() { return window.currentUser?.staff_role === 'admin'; }

function setTab(t) {
  currentTab = t;
  ['templates','pending','issued'].forEach(k => {
    document.getElementById('pane-' + k).classList.toggle('hidden', k !== t);
    document.getElementById('tab-' + k).classList.toggle('active', k === t);
  });
}

async function loadData() {
  const [tplRes, reqRes, issuedRes, patRes] = await Promise.all([
    window.db.from('psy_letter_templates').select('*').order('created_at', { ascending: false }),
    window.db.from('psy_letter_requests').select('*').order('created_at', { ascending: false }),
    window.db.from('psy_letter_issued').select('*').order('created_at', { ascending: false }),
    window.db.from('psy_patients').select('id, full_name, ic_number, user_id, phone, active_package_name, profile:psy_profiles!user_id(full_name)').eq('status', 'active'),
  ]);
  allTemplates = tplRes.data || [];
  allRequests  = reqRes.data || [];
  allIssued    = issuedRes.data || [];
  allPatients  = (patRes.data || []).map(p => ({
    ...p,
    full_name: p.full_name || p.profile?.full_name || null,
  }));

  document.getElementById('cnt-pending').textContent = allRequests.filter(r => r.status === 'pending').length;
  document.getElementById('cnt-issued').textContent  = allIssued.length;
  document.getElementById('btn-new-tpl').classList.toggle('hidden', !isAdmin());

  renderTemplates();
  renderPending();
  renderIssued();
}

const TPL_PAGE_SIZE = 15;
let tplPage = { patient: 1, internal: 1 };

function renderTemplates() {
  const tplRowHtml = t => {
    const adminBtns = isAdmin()
      ? `<a href="surat-edit.html?id=${t.id}" class="text-ink/50 hover:text-navy text-xs">Edit</a>
         <span class="text-ink/15">·</span>
         <button onclick="deleteTpl('${t.id}')" class="text-ink/50 hover:text-terracotta text-xs">Buang</button>`
      : '';
    return `<li class="flex items-center gap-3 py-2.5 px-1 hover:bg-ink/[0.02] transition-colors">
      <div class="flex-1 min-w-0 text-sm text-ink truncate">${(t.name || '').replace(/</g,'&lt;')}</div>
      <button onclick="previewTpl('${t.id}')" class="text-ink/50 hover:text-navy text-xs">Preview</button>
      <span class="text-ink/15">·</span>
      <a href="surat-issue.html?tpl=${t.id}" class="text-navy font-semibold text-xs hover:underline">Guna</a>
      ${adminBtns ? `<span class="text-ink/15">·</span>${adminBtns}` : ''}
    </li>`;
  };

  const emptyMsg = isAdmin() ? 'Belum ada templat. Klik "+ Tambah Templat" untuk tambah.' : 'Tiada templat dalam kategori ini.';

  const renderSection = (cat) => {
    const items = allTemplates.filter(t => (t.category || 'patient') === cat);
    const containerId = `templates-${cat}`;
    const pagerId     = `pager-${cat}`;
    if (!items.length) {
      document.getElementById(containerId).innerHTML = `<li class="text-center text-ink/40 text-xs py-4 list-none">${emptyMsg}</li>`;
      document.getElementById(pagerId).innerHTML = '';
      return;
    }
    const total = items.length;
    const totalPages = Math.ceil(total / TPL_PAGE_SIZE);
    if (tplPage[cat] > totalPages) tplPage[cat] = totalPages;
    const start = (tplPage[cat] - 1) * TPL_PAGE_SIZE;
    const slice = items.slice(start, start + TPL_PAGE_SIZE);
    document.getElementById(containerId).innerHTML = slice.map(tplRowHtml).join('');

    if (totalPages <= 1) {
      document.getElementById(pagerId).innerHTML = '';
    } else {
      let pgHtml = `<span class="text-[10px] text-ink/50 mr-2">${total} templat</span>`;
      for (let p = 1; p <= totalPages; p++) {
        pgHtml += `<button onclick="setTplPage('${cat}',${p})" class="w-7 h-7 rounded text-xs font-semibold ${p === tplPage[cat] ? 'bg-navy text-white' : 'bg-ink/8 text-ink/60 hover:bg-ink/15'}">${p}</button>`;
      }
      document.getElementById(pagerId).innerHTML = pgHtml;
    }
  };

  renderSection('patient');
  renderSection('internal');
}

function setTplPage(cat, p) {
  tplPage[cat] = p;
  renderTemplates();
}

function renderPending() {
  const list = document.getElementById('pending-list');
  const items = allRequests.filter(r => r.status === 'pending');
  if (!items.length) { list.innerHTML = '<div class="text-center text-ink/40 text-sm py-10">Tiada permohonan menunggu</div>'; return; }
  list.innerHTML = items.map(r => `
    <div class="bg-white rounded-xl border border-ink/10 p-4">
      <div class="font-semibold text-sm">${(r.template_name || 'Permohonan Surat').replace(/</g,'&lt;')}</div>
      <div class="text-[11px] text-ink/50 mt-0.5">Pesakit: <span class="font-semibold">${r.patient_name}</span> · ${new Date(r.created_at).toLocaleString('ms-MY',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
      <p class="text-sm text-ink mt-2 italic">"${(r.reason || '').replace(/</g,'&lt;')}"</p>
      <div class="flex gap-2 mt-3 pt-3 border-t border-ink/10 flex-wrap">
        <a href="surat-issue.html?req=${r.id}" class="bg-navy text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-navy-dark">Keluarkan Surat</a>
        <button onclick="rejectReq('${r.id}')" class="border border-terracotta/30 text-terracotta px-4 py-2 rounded-lg text-xs font-semibold hover:bg-terracotta/10">Tolak</button>
      </div>
    </div>`).join('');
}

function renderIssued() {
  const list = document.getElementById('issued-list');
  if (!allIssued.length) { list.innerHTML = '<div class="text-center text-ink/40 text-sm py-10">Belum ada surat dikeluarkan</div>'; return; }
  list.innerHTML = allIssued.map(l => {
    const recipient = l.patient_id ? l.patient_name : '<span class="text-navy">Internal document</span>';
    return `<div class="bg-white rounded-xl border border-ink/10 p-4 flex items-center gap-3 flex-wrap">
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-sm">${(l.template_name || '').replace(/</g,'&lt;')}</div>
        <div class="text-[11px] text-ink/50">Ruj: <span class="font-mono">${l.ref_number || '—'}</span> · ${recipient} · oleh ${l.signed_by_name} pada ${new Date(l.signed_at).toLocaleDateString('ms-MY',{day:'2-digit',month:'short',year:'numeric'})}</div>
      </div>
      <button onclick="viewIssued('${l.id}')" class="bg-navy text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-navy-dark">Buka / Cetak</button>
      ${isAdmin() ? `<button onclick="deleteIssued('${l.id}')" class="text-terracotta border border-terracotta/30 px-3 py-2 rounded text-xs font-semibold hover:bg-terracotta/10">Buang</button>` : ''}
    </div>`;
  }).join('');
}

async function deleteTpl(id) {
  if (!isAdmin()) return;
  if (!confirm('Buang templat ini?')) return;
  try {
    await window.db.from('psy_letter_templates').delete().eq('id', id);
    banner('Templat dibuang');
    loadData();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

function previewTpl(id) {
  const tpl = allTemplates.find(t => t.id === id);
  if (!tpl) return;
  const dummyValues = {};
  AUTO_FIELDS.forEach(f => dummyValues[f.key] = '[' + f.label + ']');
  (tpl.fields || []).forEach(f => dummyValues[f.key] = '[' + (f.label || f.key) + ']');
  const html = renderLetterFull({
    logoUrl: LOGO_URL, template: tpl, values: dummyValues,
    refNumber: 'ISW/PREVIEW/0001',
    signerName: '[Nama Staff]', signerRole: '[Jawatan]', signatureDataUrl: null,
  });
  openLetterTab(html, 'Preview — ' + tpl.name);
}

// ─── Issued view ───────────────────────────────────────────────
function viewIssued(id) {
  const l = allIssued.find(x => x.id === id);
  if (!l) return;
  // Reconstruct template (snapshot kalau template dah delete)
  const tpl = allTemplates.find(t => t.name === l.template_name)
    || { name: l.template_name, body: '', recipient: '', title: l.template_name };
  const html = renderLetterFull({
    logoUrl: LOGO_URL, template: tpl, values: l.field_values || {},
    refNumber: l.ref_number,
    signerName: l.signed_by_name,
    signerRole: l.signed_by_role || '',
    signatureDataUrl: l.signature_url || null,
    todayStr: new Date(l.signed_at).toLocaleDateString('ms-MY', { day: '2-digit', month: 'long', year: 'numeric' }),
  });
  openLetterTab(html, l.template_name + ' — ' + l.ref_number);
}

async function rejectReq(id) {
  const reason = prompt('Alasan tolak:');
  if (!reason || !reason.trim()) return;
  try {
    await window.db.from('psy_letter_requests').update({
      status: 'rejected', reject_reason: reason.trim(), updated_at: new Date().toISOString(),
    }).eq('id', id);
    const req = allRequests.find(r => r.id === id);
    const patient = allPatients.find(p => p.id === req?.patient_id);
    if (patient?.user_id) {
      await notify(patient.user_id, 'system', 'Permohonan Surat Ditolak', `Alasan: ${reason.trim()}`, 'surat.html');
    }
    banner('Permohonan ditolak');
    loadData();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

async function deleteIssued(id) {
  if (!isAdmin()) return;
  if (!confirm('Buang surat ini?')) return;
  try {
    await window.db.from('psy_letter_issued').delete().eq('id', id);
    banner('Surat dibuang');
    loadData();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

(async () => {
  const user = await initStaff('surat', 'Repositori surat rasmi');
  if (!user) return;
  loadData();
})();
</script>
</body>
</html>
