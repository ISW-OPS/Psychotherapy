<style>
  .dt-step-wrap { display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; min-width:76px; }
  .dt-step-circ { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; background:#e5e1d8; color:#9c9690; transition:all .15s; }
  .dt-step-label { font-size:10.5px; font-weight:600; color:#9c9690; text-align:center; white-space:nowrap; }
  .dt-step-wrap.current .dt-step-circ { background:#1a3a5c; color:#fff; box-shadow:0 0 0 4px rgba(26,58,92,.15); }
  .dt-step-wrap.current .dt-step-label { color:#1a3a5c; }
  .dt-step-wrap.done .dt-step-circ { background:#3f7a57; color:#fff; }
  .dt-step-wrap.done .dt-step-label { color:#3f7a57; }
  .dt-step-wrap.clickable { cursor:pointer; }
  .dt-step-line { flex:1; height:2px; background:#e5e1d8; margin:17px 2px 0; min-width:16px; }
  .dt-step-line.done { background:#3f7a57; }

  /* Checklist rows (kad + ikon + badge) */
  .dt-check-row { display:flex; align-items:center; gap:.7rem; padding:.65rem .25rem; border-bottom:1px solid rgba(0,0,0,.05); }
  .dt-check-row:last-child { border:none; }
  .dt-check-row input[type=checkbox] { width:18px; height:18px; accent-color:#1a3a5c; cursor:pointer; flex-shrink:0; }
  .dt-chk-icon { width:30px; height:30px; border-radius:9px; background:#eef1f5; display:flex; align-items:center;
    justify-content:center; font-size:14px; flex-shrink:0; }
  .dt-badge-req { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    background:#eef1f5; color:#6b7280; padding:3px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0; }

  /* Info / peringatan box */
  .dt-info-box { background:#eff6ff; border:1px solid #bfdbfe; border-radius:14px; padding:14px 16px; }
  .dt-info-box b { color:#1e3a5f; }

  /* Kad tujuan (2 kotak berwarna) */
  .dt-purpose-card { border-radius:16px; padding:16px; }

  /* Ilustrasi langkah bernombor + anak panah */
  .dt-illust-row { display:flex; align-items:flex-start; flex-wrap:wrap; gap:14px 10px; padding-bottom:4px; }
  .dt-illust-item { display:flex; flex-direction:column; align-items:center; gap:8px; width:112px; flex-shrink:0; text-align:center; }
  .dt-illust-arrow-wrap { display:flex; align-items:center; flex-shrink:0; }
  .dt-illust-circle { width:72px; height:72px; border-radius:50%; background:#eef1f5; display:flex; align-items:center;
    justify-content:center; font-size:28px; position:relative; overflow:hidden; }
  .dt-illust-num { position:absolute; top:-3px; right:-3px; width:18px; height:18px; border-radius:50%; background:#1a3a5c;
    color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .dt-illust-arrow { color:#c7c2b8; font-size:16px; margin-top:26px; }
  .dt-illust-cap { font-size:11px; color:#6b7280; line-height:1.3; }

  /* Langkah bernombor menegak (Barcode/Activate) */
  .dt-vstep { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid rgba(0,0,0,.05); }
  .dt-vstep:last-child { border:none; }
  .dt-vstep-num { width:30px; height:30px; border-radius:50%; background:#1a3a5c; color:#fff; font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .dt-vstep-icon { width:44px; height:44px; border-radius:12px; background:#eef1f5; display:flex; align-items:center;
    justify-content:center; font-size:20px; flex-shrink:0; }
  .dt-vstep-icon-lg { width:64px; height:64px; border-radius:14px; background:#eef1f5; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; }

  .dt-section-title { font-weight:700; color:#111; display:flex; align-items:center; gap:6px; margin-bottom:10px; }

  /* Scan Barcode modal — bingkai + garis imbas */
  .dt-scan-frame { position:absolute; inset:12%; border:2px solid rgba(255,255,255,.85); border-radius:10px; pointer-events:none; }
  .dt-scan-frame::before, .dt-scan-frame::after { content:''; position:absolute; width:22px; height:22px; border-color:#4ade80; }
  .dt-scan-line { position:absolute; left:4%; right:4%; height:2px; background:linear-gradient(90deg,transparent,#4ade80,transparent);

  @keyframes dt-scan-move { 0%,100% { top:6%; } 50% { top:94%; } }
  .dt-scan-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#4ade80; margin-right:5px;
    animation:dt-scan-pulse 1s ease-in-out infinite; }
  @keyframes dt-scan-pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }

<script>
    function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
const STEP_LABELS = ['', 'Sample Collection', 'Barcode & Packaging', 'Activate Kit (ATGC)', 'Muat Naik Laporan', 'Consultation', 'Selesai'];

const SAMPLE_CHECKLIST = [
  { k: 'makan_2jam', icon: '🍽️', lbl: 'Pesakit makan sekurang-kurangnya 2 jam sebelum ujian' },
  { k: 'tidak_makan_30min', icon: '🥤', lbl: 'Pesakit tidak makan/minum 30 minit sebelum ujian' },
  { k: 'terang_tujuan', icon: '🧬', lbl: 'Terangkan tujuan DNA Test (Nutrigenomic & Genetik Keturunan)' },
  { k: 'swab_kanan', icon: '👄', lbl: 'Swab pipi kanan (10 kali atas & bawah)' },
  { k: 'swab_kiri', icon: '👄', lbl: 'Swab pipi kiri (10 kali atas & bawah)' },
  { k: 'masuk_tiub', icon: '🧪', lbl: 'Masukkan swab ke dalam tiub' },
  { k: 'tutup_tiub', icon: '🔒', lbl: 'Tutup tiub dengan ketat' },
  { k: 'goncang', icon: '🌀', lbl: 'Goncangkan tiub 15 kali' },
];

// Ilustrasi langkah swab (Step 1) — checklist tertanam terus pada setiap langkah
// (elak duplicate teks dengan kad checklist berasingan). Key sepadan dgn SAMPLE_CHECKLIST.
const SWAB_ILLUST = [
  ['../../icon/Swab 1.png', 'Sapu hujung swab di bahagian dalam pipi kanan (10 kali atas & bawah).', 'swab_kanan'],
  ['../../icon/Swab 1.png', 'Ulang langkah yang sama di pipi kiri menggunakan swab yang sama.', 'swab_kiri'],
  ['../../icon/3.png', 'Buka penutup tiub dan masukkan hujung swab ke dalam tiub.', 'masuk_tiub'],
  ['../../icon/4.png', 'Tutup tiub dengan ketat.', 'tutup_tiub'],
  ['../../icon/5.png', 'Goncangkan tiub sebanyak 15 kali supaya swab diselaputi larutan.', 'goncang'],
];

// Langkah Barcode & Packaging (Step 2) — panduan menegak
const PACKAGING_STEPS = [
  ['../../icon/barcode 1.png', 'Sticker 1 (Botol Tiub)', 'Tampal barcode secara menegak bermula dari mulut botol.', 'sticker1'],
  ['../../icon/barcode 2.png', 'Sticker 2 (Sampul Putih)', 'Tampal barcode pada sampul putih dan isi maklumat pesakit.', 'sticker2'],
  ['../../icon/barcode 3.png', 'Masukkan ke Packaging Coklat', 'Masukkan tiub ke dalam packaging coklat.', 'masuk_packaging'],
  ['../../icon/barcode 4.png', 'Seal Packaging Coklat', 'Seal packaging coklat dengan kemas.', 'seal_packaging'],
  ['../../icon/barcode 5.png', 'Masukkan ke Sampul Putih', 'Masukkan packaging coklat ke dalam sampul putih.', 'masuk_sampul'],
  ['📸', 'Ambil Gambar & Upload', 'Ambil gambar bahagian depan sampul putih (dengan barcode jelas).', 'ambil_gambar'],
  ['../../icon/whatsapp.png', 'Hantar Gambar', 'Hantar gambar melalui WhatsApp kepada penyelaras.', 'hantar_gambar'],
];

// Langkah Aktivasi ATGC (Step 3) — panduan menegak
const ATGC_STEPS = [
  ['../../icon/ATGC 1.png', 'Log Masuk ATGC', 'Log masuk portal ATGC menggunakan e-mel & kata laluan yang diberi oleh penyelaras makmal.'],
  ['../../icon/ATGC 2.png', 'Klik "Activate Kit"', 'Pada dashboard ATGC, klik butang Activate Kit.'],
  ['../../icon/ATGC 3.png', 'Masukkan Barcode Kit', 'Masukkan Barcode Number (ATGC Kit) yang sama seperti Step 2, klik Next.'],
  ['../../icon/ATGC 4.png', 'Isi Maklumat Pesakit', 'Isi nama, tarikh lahir & jantina pesakit.'],
  ['../../icon/ATGC 5.png', 'Terms of Service', 'Semak & terima terma perkhidmatan pada portal.'],
  ['../../icon/ATGC 6.png', 'Review & Aktifkan', 'Semak semua maklumat dan klik Activate untuk selesaikan di portal ATGC.'],
];

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// Terima emoji ATAU path gambar (.png) — papar <img> kalau path, emoji kalau tidak
function iconHtml(v, cls) { return v && v.endsWith('.png') ? `<img src="${v}" alt="" class="${cls || 'w-6 h-6'} object-contain">` : v; }
function fmtDate(d) { if (!d) return '—'; const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString(LCALE(), { day:'2-digit', month:'short', year:'numeric' }); }
function fmtDT(ts) { if (!ts) return '—'; const dt = new Date(ts); return dt.toLocaleString(LCALE(), { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
function ageOf(dob) { if (!dob) return null; const d = new Date(dob); const diff = Date.now() - d.getTime(); return Math.floor(diff / (365.25*24*3600*1000)); }
function qs(k) { return new URLSearchParams(location.search).get(k); }

let PATIENT_ID = null;
let PROCESS_ID = null;
let FROM = null;
let PATIENT = null;
let COACHES = [];
let ALL_STAFF = [];
let ACTIVE_PLAN = null;
let PROC = null;      // baris psy_dna_test_process semasa
let VIEW_STEP = 1;    // step yg sedang dipaparkan (boleh < current_step utk semak semula)

// pending files (belum dimuat naik)
let pendingSamplePhoto = null;

function checklistObj(items) { const o = {}; items.forEach(it => o[it.k] = false); return o; }

// ── Muatkan pesakit + proses DNA test ─────────────────────
async function loadPatient() {
  const { data, error } = await window.db.from('psy_patients')
    .select('id, full_name, mrn, phone, gender, date_of_birth, coach_id, user_id, psy_profiles!psy_patients_user_id_fkey(full_name, phone)')
    .eq('id', PATIENT_ID).single();
  if (error || !data) { banner('Pesakit tidak dijumpai', 'error'); return null; }
  return data;
}

async function loadCoaches() {
  const { data } = await window.db.from('psy_profiles')
    .select('id, full_name, staff_role').eq('role', 'staff')
    .in('staff_role', ['coach', 'doctor']).order('full_name');
  COACHES = data || [];
}

async function loadAllStaff() {
  const { data } = await window.db.from('psy_profiles')
    .select('id, full_name').eq('role', 'staff').order('full_name');
  ALL_STAFF = data || [];
}

async function loadActivePlan() {
  const { data } = await window.db.from('psy_treatment_plans')
    .select('id, name, template, current_week, status').eq('patient_id', PATIENT_ID)
    .order('created_at', { ascending: false });
  const plans = data || [];
  return plans.find(p => p.status === 'active') || plans[0] || null;
}

async function loadOrCreateProcess() {
  if (PROCESS_ID) {
    const { data, error } = await window.db.from('psy_dna_test_process')
      .select('*').eq('id', PROCESS_ID).eq('patient_id', PATIENT_ID).maybeSingle();
    if (error) { banner('Ralat memuatkan proses: ' + error.message, 'error'); return null; }
    if (data) return data;
    banner('Proses DNA Test tidak dijumpai', 'error');
  }
  const { data } = await window.db.from('psy_dna_test_process')
    .select('*').eq('patient_id', PATIENT_ID).eq('status', 'in_progress')
    .order('created_at', { ascending: false }).limit(1).maybeSingle();
  if (data) return data;
  const row = {
    patient_id: PATIENT_ID,
    coach_id: PATIENT.coach_id || window.currentUser.id,
    created_by: window.currentUser.id,
    sample_checklist: checklistObj(SAMPLE_CHECKLIST),
  };
  const { data: created, error } = await window.db.from('psy_dna_test_process').insert(row).select('*').single();
  if (error) { banner('Ralat mencipta proses DNA Test: ' + error.message, 'error'); return null; }
  return created;
}

async function saveProc(patch) {
  const { data, error } = await window.db.from('psy_dna_test_process')
    .update(patch).eq('id', PROC.id).select('*').single();
  if (error) { banner('Ralat menyimpan: ' + error.message, 'error'); return false; }
  PROC = data;
  return true;
}

// ── Render: bar maklumat pesakit (macam Patient Workspace header) ──
function renderPatientSummary() {
  const p = PATIENT;
  const name = iswPatientName(p) || p.mrn || 'Pesakit';
  const age = ageOf(p.date_of_birth);
  const coach = COACHES.find(c => c.id === PROC?.coach_id) || COACHES.find(c => c.id === p.coach_id);
  const backLink = document.getElementById('dt-back');
  if (FROM === 'list') {
    document.getElementById('dt-patient-crumb').textContent = `DNA Test › ${name}`;
    backLink.href = 'dna-test-list.html';
    backLink.textContent = '← Kembali ke Senarai DNA Test';
  } else {
    document.getElementById('dt-patient-crumb').textContent = `Patient Workspace › ${name}`;
    backLink.href = 'patient-hub.html?id=' + PATIENT_ID;
    backLink.textContent = '← Kembali ke Patient Hub';
  }

  const statusBadge = p.status === 'active'
    ? '<span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-green-light text-green-dark">Active Patient</span>'
    : `<span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-ink/10 text-ink/60">${esc(p.status || '—')}</span>`;

  const miniStat = (icon, lbl, val) => `<div>
    <div class="text-[10px] uppercase tracking-wide text-ink/40 font-semibold mb-0.5">${lbl}</div>
    <div class="text-sm font-semibold text-ink flex items-center gap-1">${icon} ${esc(val || '—')}</div>
  </div>`;

  document.getElementById('dt-patient-bar').innerHTML = `
    <div class="flex items-center justify-between gap-4 flex-wrap">
      <div class="flex items-center gap-4 flex-wrap">
        <div class="w-14 h-14 rounded-full bg-navy text-white text-xl font-bold flex items-center justify-center flex-shrink-0">${esc(name.slice(0,1).toUpperCase())}</div>
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-bold text-ink text-lg">${esc(name)}</span>${statusBadge}
          </div>
          <div class="flex gap-4 mt-1 text-xs text-ink/55 flex-wrap">
            <span>🆔 ${esc(p.mrn || '—')}</span>
            <span>📞 ${esc(iswPatientPhone(p) || '—')}</span>
            <span>🎂 ${age ? age + ' Years Old' : '—'}${p.gender === 'M' ? ' · Lelaki' : p.gender === 'F' ? ' · Perempuan' : ''}</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-6 flex-wrap">
        ${miniStat('📅', 'Treatment Week', ACTIVE_PLAN?.current_week ? 'Week ' + ACTIVE_PLAN.current_week : '—')}
        ${miniStat('📦', 'Package', ACTIVE_PLAN?.name)}
        ${miniStat('🧑‍🏫', 'Coach', coach?.full_name)}
      </div>
    </div>`;
}

// ── Stepper ────────────────────────────────────────────────
function renderStepper() {
  const reached = PROC.current_step;
  let html = '';
  for (let i = 1; i <= 6; i++) {
    const done = i < reached || (i === 6 && PROC.status === 'completed');
    const current = i === VIEW_STEP;
    const clickable = i <= reached;
    html += `<div class="dt-step-wrap ${current ? 'current' : ''} ${done ? 'done' : ''} ${clickable ? 'clickable' : ''}"
        ${clickable ? `onclick="goStep(${i})"` : ''}>
      <div class="dt-step-circ">${done && !current ? '✓' : i}</div>
      <span class="dt-step-label">${STEP_LABELS[i]}</span>
    </div>`;
    if (i < 6) html += `<div class="dt-step-line ${i < reached ? 'done' : ''}"></div>`;
  }
  document.getElementById('dt-stepper').innerHTML = html;
}

function goStep(n) {
  if (n > PROC.current_step) return;
  VIEW_STEP = n;
  renderStepper();
  renderStepContent();
}
window.goStep = goStep;

// ── Checklist renderer (generik) ──────────────────────────
function renderChecklist(containerId, items, savedObj, badgeLabel) {
  document.getElementById(containerId).innerHTML = items.map(it => `
    <label class="dt-check-row">
      <input type="checkbox" data-k="${it.k}" ${savedObj?.[it.k] ? 'checked' : ''}>
      <span class="text-sm text-ink flex-1">${esc(it.lbl)}</span>
      ${badgeLabel ? `<span class="dt-badge-req">${esc(badgeLabel)}</span>` : ''}
    </label>`).join('');
}
function readChecklist(containerId, items) {
  const el = document.getElementById(containerId);
  const o = {};
  items.forEach(it => { o[it.k] = !!el.querySelector(`input[data-k="${it.k}"]`)?.checked; });
  return o;
}
function checklistAllChecked(o, items) { return items.every(it => o?.[it.k]); }

// ── STEP 1: Sample Collection ──────────────────────────────
function renderStep1() {
  const sc = PROC.sample_checklist || {};
  const chk = k => sc[k] ? 'checked' : '';
  document.getElementById('dt-step-content').innerHTML = `
    <h2 class="font-bold text-ink mb-1 flex items-center gap-2">🧪 Step 1: Sample Collection</h2>

    <div class="rounded-2xl border border-navy/15 bg-navy/5 p-4 mb-4">
      <div class="dt-section-title text-sm mb-2">📅 Jadual Pengambilan Sampel</div>
      <p class="text-[11px] text-ink/50 mb-2">Tetapkan tarikh pesakit datang ambil sampel. Sistem akan hantar peringatan WhatsApp sehari sebelum, lengkap dengan syarat persediaan.</p>

        </div>
        <div>
          <label class="block text-[11px] font-semibold text-ink/60 mb-1">Masa</label>
          <input id="dt-s1-appt-time" type="time" class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm bg-white outline-none">
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-ink/60 mb-1">Dengan</label>
          <select id="dt-s1-appt-with" class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm bg-white outline-none">
            ${COACHES.map(c => `<option value="${c.id}">${esc(c.full_name)}</option>`).join('')}
          </select>
        </div>
        <div class="flex items-end">
          <button onclick="saveSampleAppointment()" class="w-full text-sm font-semibold px-3 py-2 rounded-lg bg-navy text-white hover:bg-navy/90">💾 ${PROC.sample_appointment_id ? 'Simpan Perubahan' : 'Jadualkan'}</button>
        </div>
      </div>
      <div id="dt-s1-appt-status" class="text-[11px] text-ink/45 mt-2"></div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Kiri: Peringatan + Tujuan -->

async function saveStep1(advance) {
  const checklist = readStep1Checklist();
  const notes = document.getElementById('dt-s1-notes').value.trim() || null;
  if (advance && !checklistAllChecked(checklist, SAMPLE_CHECKLIST)) {
    banner('Sila tandakan semua langkah sebelum teruskan', 'error');
    return;
  }
  const patch = { sample_checklist: checklist, sample_notes: notes };
  if (advance && !PROC.kit_received_at) patch.kit_received_at = new Date().toISOString().slice(0, 10);
  if (advance) {
    patch.sample_collected_at = new Date().toISOString();
    patch.sample_collected_by = window.currentUser.id;
    patch.current_step = Math.max(PROC.current_step, 2);
  }
  const ok = await saveProc(patch);
  if (!ok) return;
  banner(advance ? 'Sample Collection selesai ✅' : 'Draf disimpan');

async function loadSampleAppointmentIntoForm() {

async function saveSampleAppointment() {
  const date = document.getElementById('dt-s1-appt-date').value;
  const time = document.getElementById('dt-s1-appt-time').value;
  const withId = document.getElementById('dt-s1-appt-with').value;
  if (!date || !time) { banner('Sila isi tarikh & masa pengambilan sampel', 'error'); return; }
  if (date < new Date().toISOString().slice(0, 10)) { banner('Tarikh tidak boleh tarikh yang telah lepas', 'error'); return; }

  let appointmentId = PROC.sample_appointment_id;
  const withStaff = COACHES.find(c => c.id === withId);
  const newIso = new Date(`${date}T${time}:00`).toISOString();
  const dateChanged = !CURRENT_SAMPLE_APPT || CURRENT_SAMPLE_APPT.appointment_time !== newIso;
  const apptRow = {
    patient_id: PATIENT_ID, staff_id: withId || null, patient_name: iswPatientName(PATIENT),
    staff_name: withStaff?.full_name || null, service: 'DNA Test Sample Collection',
    appointment_time: newIso, duration_min: 30, room: iswGetSetting('clinic_name', '') || null,
  };
  if (appointmentId) {
    await window.db.from('psy_appointments').update(apptRow).eq('id', appointmentId);
  } else {
    const { data: created, error } = await window.db.from('psy_appointments').insert(apptRow).select('id').single();
    if (error) { banner('Ralat menjadualkan: ' + error.message, 'error'); return; }
    appointmentId = created.id;
  }
  const patch = { sample_appointment_id: appointmentId };
  if (dateChanged) patch.sample_reminder_sent_at = null;   // tarikh baru → benarkan peringatan hantar semula
  const ok = await saveProc(patch);
  if (!ok) return;
  banner('Jadual pengambilan sampel disimpan ✅');
  renderStepContent();
}

// ── Scan Barcode (kamera) — guna ZXing (library JS, berfungsi di semua browser termasuk Safari/iOS) ──
let _zxingReader = null;
let _dtScanNoResultTimer = null;

async function openScanModal() {
  if (typeof ZXing === 'undefined') {
    banner('Library scan gagal dimuatkan — sila taip barcode secara manual', 'error');
    return;
  }
  document.getElementById('dt-scan-modal').classList.remove('hidden');
  document.getElementById('dt-scan-torch-btn').classList.add('hidden');
  const statusEl = document.getElementById('dt-scan-status');
  statusEl.innerHTML = '<span class="dt-scan-dot"></span>Halakan kamera ke barcode — dekatkan sehingga barcode penuhi bingkai';
  const onResult = (result, err) => {
    if (result) {
      document.getElementById('dt-s2-barcode').value = result.getText();
      banner('Barcode dikesan: ' + result.getText());
      closeScanModal();
    }
  };
  // Cuba dapatkan resolusi lebih tinggi + minta kamera fokus rapat (macro/continuous) —
  // barcode kecil pada kit ATGC perlukan fokus jarak dekat, bukan default fokus jauh.
  const constraints = {
    video: {
      facingMode: 'environment',
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      advanced: [{ focusMode: 'continuous' }]
    }
  };
  try {
    // hints: TRY_HARDER buat ZXing analisa lebih teliti (frame lebih perlahan tapi kesan lebih tepat)
    const hints = new Map();
    if (ZXing.DecodeHintType) hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    _zxingReader = new ZXing.BrowserMultiFormatReader(hints, 150);
    if (typeof _zxingReader.decodeFromConstraints === 'function') {
      await _zxingReader.decodeFromConstraints(constraints, 'dt-scan-video', onResult);
    } else {
      await _zxingReader.decodeFromVideoDevice(undefined, 'dt-scan-video', onResult);
    }
    setupScanTrackControls();
    clearTimeout(_dtScanNoResultTimer);
    _dtScanNoResultTimer = setTimeout(() => {
      if (!document.getElementById('dt-scan-modal').classList.contains('hidden')) {
        statusEl.innerHTML = '<span class="dt-scan-dot"></span>Masih mencari… cuba dekat/jauhkan sikit, elak bayang & pastikan cukup cahaya';
      }
    }, 6000);
  } catch (e) {
    statusEl.textContent = 'Gagal akses kamera: ' + e.message;
  }
}
window.openScanModal = openScanModal;

// Dedah kawalan track (autofocus + torch) — sokongan berbeza ikut peranti/browser, jadi semua dibalut try/catch senyap.
function setupScanTrackControls() {
  const video = document.getElementById('dt-scan-video');
  const track = video.srcObject && video.srcObject.getVideoTracks ? video.srcObject.getVideoTracks()[0] : null;
  if (!track || !track.getCapabilities) return;
  let caps = {};
  try { caps = track.getCapabilities(); } catch (e) { return; }
  if (caps.focusMode && caps.focusMode.includes('continuous')) {
    track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
  }
  if (caps.torch) {
    document.getElementById('dt-scan-torch-btn').classList.remove('hidden');
  }
}

async function toggleScanTorch() {
  const video = document.getElementById('dt-scan-video');
  const track = video.srcObject && video.srcObject.getVideoTracks ? video.srcObject.getVideoTracks()[0] : null;
  if (!track) return;
  const btn = document.getElementById('dt-scan-torch-btn');
  const on = btn.dataset.on === '1';
  try {
    await track.applyConstraints({ advanced: [{ torch: !on }] });
    btn.dataset.on = on ? '0' : '1';
    btn.classList.toggle('bg-amber-100', !on);
  } catch (e) { /* torch tak disokong walau capability wujud — abaikan senyap */ }
}
window.toggleScanTorch = toggleScanTorch;

  if (pendingSamplePhoto) {

    const { error: upErr } = await window.db.storage.from('dna-test').upload(path, pendingSamplePhoto, { upsert: true });

];

const REPORT_ICONS = { plant_based: '🌿', health_risk: '⚠️', carrier_drug: '🧫', summary: '📋' };

function reportFilesFor(key) { return (PROC.report_files || {})[key] || []; }

// Upload terus (immediate) — boleh >1 fail sekali gus, digunakan Step 4 & Step 5.
// Auto-maju current_step sebaik sahaja 3 kategori wajib (IB-LIFE/IB-HRCD/IB-CANC)
// dah dimuat naik — TAK perlu staf klik butang "confirm"/"next step" berasingan
// lepas upload (dulu 2 langkah: upload, lepas tu klik confirm; sekarang 1 langkah).
async function addReportFiles(key, code, fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const current = { ...(PROC.report_files || {}) };
  const arr = [...(current[key] || [])];
  const patientName = (iswPatientName(PATIENT) || 'Pesakit').replace(/[\/\\?#%]/g, '').trim();
  for (const file of files) {
    const idx = arr.length + 1;
    const fileName = `${code} - ${patientName}${idx > 1 ? ' (' + idx + ')' : ''}.pdf`;
    const path = `${PATIENT_ID}/${PROC.id}/${fileName}`;
    const { error } = await window.db.storage.from('dna-test').upload(path, file, { upsert: true });
    if (error) { banner(`Gagal muat naik: ${error.message}`, 'error'); continue; }
    arr.push(path);
  }
  current[key] = arr;
  const patch = { report_files: current };
  const nowAllUploaded = REQUIRED_REPORT_KEYS.every(k => (current[k] || []).length > 0);
  if (nowAllUploaded && PROC.current_step < 5) {
    patch.reports_uploaded_at = PROC.reports_uploaded_at || new Date().toISOString();
    patch.current_step = 5;
  }
  const ok = await saveProc(patch);
  if (!ok) return;
  banner(nowAllUploaded && patch.current_step ? 'Semua laporan wajib dimuat naik — Step 4 selesai ✅' : 'Laporan dimuat naik ✅');
  renderStepper();
  renderStepContent();
}
window.addReportFiles = addReportFiles;

async function removeReportFile(key, path) {
  if (!confirm('Padam fail ini?')) return;
  await window.db.storage.from('dna-test').remove([path]);
  const current = { ...(PROC.report_files || {}) };
  current[key] = (current[key] || []).filter(p => p !== path);
  const ok = await saveProc({ report_files: current });
  if (!ok) return;
  renderStepContent();
}

async function emailReportsToPatient() {
  const allUploaded = REQUIRED_REPORT_KEYS.every(key => reportFilesFor(key).length > 0);

  const { data, error } = await window.db.functions.invoke('dna-test-email-report', { body: { process_id: PROC.id } });
  if (error) {
    let msg = error.message;
    try { const c = await error.context?.json(); if (c?.error) msg = c.error; } catch (_) {}
    banner('Gagal hantar emel: ' + msg, 'error');
    return;
  }
  PROC.reports_emailed_at = new Date().toISOString();
  document.getElementById('dt-s4-email-status').textContent = `Dihantar pada ${fmtDT(PROC.reports_emailed_at)} (${data.sent_to})`;

    </div>`;
  document.getElementById('dt-s5-with').value = PROC.coach_id || PATIENT.coach_id || (COACHES[0]?.id || '');
  document.getElementById('dt-s5-notes').value = PROC.consultation_notes || '';
  loadAppointmentIntoForm();
}

async function loadAppointmentIntoForm() {
  if (!PROC.appointment_id) { CURRENT_APPT = null; return; }
  const { data: appt } = await window.db.from('psy_appointments').select('*').eq('id', PROC.appointment_id).maybeSingle();
  CURRENT_APPT = appt || null;
  if (!appt) return;
  const dt = new Date(appt.appointment_time);
  document.getElementById('dt-s5-date').value = dt.toISOString().slice(0, 10);
  document.getElementById('dt-s5-time').value = dt.toTimeString().slice(0, 5);
  document.getElementById('dt-s5-with').value = appt.staff_id || document.getElementById('dt-s5-with').value;
  document.getElementById('dt-s5-mode').value = (appt.room || '').toLowerCase().includes('online') ? 'online' : 'physical';
}

async function markAttendedAndComplete() {
  if (!PROC.appointment_id) return;
  if (!confirm('Sahkan pesakit telah hadir ke konsultasi dan proses DNA Test ini boleh diselesaikan?')) return;
  await window.db.from('psy_appointments').update({ status: 'completed' }).eq('id', PROC.appointment_id);
  const notes = document.getElementById('dt-s5-notes').value.trim() || null;
  const ok = await saveProc({
    consultation_notes: notes,
    current_step: 6,
    status: 'completed',
    completed_at: new Date().toISOString(),
    completed_by: window.currentUser.id,
  });
  if (!ok) return;
  banner('Proses DNA Test selesai ✅');
  VIEW_STEP = 6; renderStepper(); renderStepContent();
}
window.markAttendedAndComplete = markAttendedAndComplete;

async function saveStep5() {
  const date = document.getElementById('dt-s5-date').value;
  const time = document.getElementById('dt-s5-time').value;
  const mode = document.getElementById('dt-s5-mode').value;
  const withId = document.getElementById('dt-s5-with').value;

  if (!date || !time) { banner('Sila isi tarikh & masa konsultasi', 'error'); return; }
  if (date < new Date().toISOString().slice(0, 10)) { banner('Tarikh konsultasi tidak boleh tarikh yang telah lepas', 'error'); return; }

  let appointmentId = PROC.appointment_id;
  const withStaff = COACHES.find(c => c.id === withId);
  const apptRow = {
    patient_id: PATIENT_ID,
    staff_id: withId || null,
    patient_name: iswPatientName(PATIENT),
    staff_name: withStaff?.full_name || null,
    service: 'DNA Test Consultation',
    appointment_time: new Date(`${date}T${time}:00`).toISOString(),
    duration_min: 60,
    room: mode === 'online' ? 'Online' : (iswGetSetting('clinic_name', '') || null),
  };
  if (appointmentId) {
    await window.db.from('psy_appointments').update(apptRow).eq('id', appointmentId);
  } else {
    const { data: created, error } = await window.db.from('psy_appointments').insert(apptRow).select('id').single();
    if (error) { banner('Ralat menjadualkan appointment: ' + error.message, 'error'); return; }
    appointmentId = created.id;
  }

  const notes = document.getElementById('dt-s5-notes').value.trim() || null;
  const patch = { appointment_id: appointmentId, consultation_notes: notes, consultation_marked_ready_at: new Date().toISOString() };
  const ok = await saveProc(patch);
  if (!ok) return;
  banner('Konsultasi dijadualkan ✅');
  renderStepContent();
}
window.saveStep5 = saveStep5;

// ── STEP 6: Completed ─────────────────────────────────────────
async function renderStep6() {
  let appt = null;
  if (PROC.appointment_id) {
    const { data } = await window.db.from('psy_appointments').select('*').eq('id', PROC.appointment_id).maybeSingle();
    appt = data;
  }
  const docRow = (icon, key, code) => {
    const files = reportFilesFor(key);
    if (!files.length) return '';
    return files.map(p => `<div class="flex items-center justify-between gap-3 py-2.5 border-b border-ink/5 last:border-0">
         <span class="text-sm text-ink">${icon} ${esc(code)} <span class="text-ink/40 text-xs">${esc(p.split('/').pop())}</span></span>
         <button onclick="downloadReport('${p}')" class="text-xs font-semibold text-navy hover:underline">⬇️ Muat Turun</button>
       </div>`).join('');
  };
  const timeline = [
    ['🧪', 'Sample Collection', PROC.sample_collected_at],
    ['🏷️', 'Barcode & Packaging', PROC.packaging_completed_at],
    ['🧬', 'Activate Kit (ATGC)', PROC.atgc_activated_at],
    ['📄', 'Muat Naik Laporan', PROC.reports_uploaded_at],
    ['👥', 'Consultation', appt?.appointment_time],
    ['✅', 'Selesai', PROC.completed_at],
  ];
  document.getElementById('dt-step-content').innerHTML = `
    <div class="text-center py-6 mb-2 rounded-2xl bg-green-light/20 border border-green/20">
      <div class="text-4xl mb-2">✅</div>
      <h2 class="font-bold text-green-dark text-lg">DNA Test Process Completed!</h2>
      <p class="text-xs text-ink/50 mt-1">Semua langkah telah selesai direkodkan bagi pesakit ini.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-4 items-stretch">
      <div class="border border-ink/10 rounded-2xl p-4">
        <div class="dt-section-title text-sm">Process Summary</div>
        <div class="space-y-0.5">
          ${timeline.map(([icon, lbl, ts], i) => `
            <div class="flex items-center gap-3 py-2 ${i < timeline.length - 1 ? 'border-b border-ink/5' : ''}">
              <span class="w-6 h-6 rounded-full bg-green text-white text-xs font-bold flex items-center justify-center flex-shrink-0">✓</span>
              <span class="text-sm text-ink flex-1">${i + 1}. ${esc(lbl)}</span>
              <span class="text-[11px] text-ink/45">${fmtDT(ts)}</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="border border-ink/10 rounded-2xl p-4">
        <div class="dt-section-title text-sm">Consultation Summary</div>
        ${appt ? `<div class="grid grid-cols-2 gap-3 text-xs">
          <div><div class="text-ink/45 mb-0.5">Consultation Date</div><div class="font-semibold text-ink">${fmtDate(appt.appointment_time.slice(0, 10))}</div></div>
          <div><div class="text-ink/45 mb-0.5">Consultation Time</div><div class="font-semibold text-ink">${new Date(appt.appointment_time).toLocaleTimeString(LCALE(), { hour: '2-digit', minute: '2-digit' })}</div></div>
          <div><div class="text-ink/45 mb-0.5">Consultation With</div><div class="font-semibold text-ink">${esc(appt.staff_name || '—')}</div></div>
          <div><div class="text-ink/45 mb-0.5">Mode</div><span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-navy/10 text-navy">${(appt.room || '').toLowerCase() === 'online' ? 'Online' : 'Physical'}</span></div>
          <div class="col-span-2"><div class="text-ink/45 mb-0.5">Location</div><div class="font-semibold text-ink">${esc(appt.room || '—')}</div></div>
          <div class="col-span-2"><div class="text-ink/45 mb-0.5">Outcome</div><span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-green-light text-green-dark">Completed</span></div>
          ${PROC.consultation_notes ? `<div class="col-span-2"><div class="text-ink/45 mb-0.5">Notes</div><div class="text-ink whitespace-pre-wrap">${esc(PROC.consultation_notes)}</div></div>` : ''}
        </div>` : '<div class="text-xs text-ink/40">Tiada konsultasi dijadualkan.</div>'}
      </div>

      <div class="border border-ink/10 rounded-2xl p-4">
        <div class="dt-section-title text-sm">Reports & Documents</div>
        ${REPORT_SLOTS.map(([key, , , code]) => docRow(REPORT_ICONS[key], key, code)).join('')}
      </div>
    </div>`;
}

async function downloadReport(path) {
  const { data, error } = await window.db.storage.from('dna-test').createSignedUrl(path, 300);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  window.open(data.signedUrl, '_blank');
}
window.downloadReport = downloadReport;

async function addConsultationAttachments(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const arr = [...(PROC.consultation_attachments || [])];
  for (const file of files) {
    const path = `${PATIENT_ID}/${PROC.id}/${file.name}`;
    const { error } = await window.db.storage.from('dna-test').upload(path, file, { upsert: true });
    if (error) { banner(`Gagal muat naik: ${error.message}`, 'error'); continue; }
    if (!arr.includes(path)) arr.push(path);
  }
  const ok = await saveProc({ consultation_attachments: arr });
  if (!ok) return;
  banner('Lampiran dimuat naik ✅');
  renderStepContent();
}
window.addConsultationAttachments = addConsultationAttachments;

async function removeConsultationAttachment(path) {
  if (!confirm('Padam lampiran ini?')) return;
  await window.db.storage.from('dna-test').remove([path]);
  const arr = (PROC.consultation_attachments || []).filter(p => p !== path);
  const ok = await saveProc({ consultation_attachments: arr });
  if (!ok) return;
  renderStepContent();
}
window.removeConsultationAttachment = removeConsultationAttachment;

// ── Router ─────────────────────────────────────────────────
function renderStepContent() {
  if (VIEW_STEP === 1) renderStep1();
  else if (VIEW_STEP === 2) renderStep2();
  else if (VIEW_STEP === 3) renderStep3();
  else if (VIEW_STEP === 4) renderStep4();
  else if (VIEW_STEP === 5) renderStep5();
  else renderStep6();
}

(async () => {
  const user = await initStaff('dna_test', 'Proses ujian DNA pesakit');
  if (!user) return;
  await iswLoadSettings();
  PATIENT_ID = qs('patient_id') || qs('id');
  PROCESS_ID = qs('process_id');
  FROM = qs('from');
  if (!PATIENT_ID) { banner('Tiada pesakit dipilih', 'error'); return; }
  PATIENT = await loadPatient();
  if (!PATIENT) return;
  await loadCoaches();
  await loadAllStaff();
  ACTIVE_PLAN = await loadActivePlan();
  PROC = await loadOrCreateProcess();
  if (!PROC) return;
  VIEW_STEP = PROC.current_step;
  renderPatientSummary();
  renderStepper();
  renderStepContent();
})();
</script>
</body>
