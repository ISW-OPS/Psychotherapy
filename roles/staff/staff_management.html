<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Manage Staff</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">👨‍⚕️</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-6">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <h3 class="font-bold text-lg">Senarai Staff</h3>
          <button onclick="openCreateModal()" class="bg-navy text-white text-sm px-4 py-2 rounded-lg font-semibold">+ Daftar Staff Baru</button>
        </div>

        <div class="bg-white rounded-xl border border-ink/10 overflow-x-auto">
          <table class="data">
            <thead><tr><th>Nama</th><th>Email</th><th>Bidang</th><th>Reg. No.</th><th>Status</th><th></th></tr></thead>
            <tbody id="staff-body"></tbody>
          </table>
        </div>

        <div class="bg-gold-light rounded-xl p-4 text-xs text-ink/70">
          <strong>ℹ️ Nota:</strong> Akaun staff dicipta oleh admin sahaja. Staff baru akan terima email pengesahan untuk set kata laluan.
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Create Staff Modal -->
<div id="create-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" onclick="closeCreateModal()"></div>
  <div class="relative bg-white rounded-2xl max-w-md w-full overflow-hidden">
    <div class="p-5 border-b border-ink/10 flex items-center justify-between">
      <h3 class="font-bold text-lg">Daftar Staff Baru</h3>
      <button onclick="closeCreateModal()" class="text-ink/60 text-xl">×</button>
    </div>
    <div class="p-5 space-y-3">
      <div>
        <label class="text-xs font-semibold">Nama Penuh</label>
        <input id="new-name" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="Dr. Hamzah Yusof">
      </div>
      <div>
        <label class="text-xs font-semibold">Email</label>
        <input id="new-email" type="email" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="email@ibnusinawellness.com">
      </div>
      <div>
        <label class="text-xs font-semibold">Kaedah Onboarding</label>
        <div class="flex gap-3 mt-1">
          <label class="flex-1 border border-ink/20 rounded-lg p-2 text-xs cursor-pointer has-[:checked]:border-navy has-[:checked]:bg-navy-light">
            <input type="radio" name="method" value="invite" checked class="mr-2">📧 Email Invite (auto)
          </label>
          <label class="flex-1 border border-ink/20 rounded-lg p-2 text-xs cursor-pointer has-[:checked]:border-navy has-[:checked]:bg-navy-light">
            <input type="radio" name="method" value="password" class="mr-2">🔑 Set password
          </label>
        </div>
      </div>
      <div id="password-row" class="hidden">
        <label class="text-xs font-semibold">Kata Laluan Sementara</label>
        <input id="new-password" type="text" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="Min 6 aksara">
        <p class="text-[10px] text-ink/50 mt-1">Staff boleh tukar kata laluan dari Profile.</p>
      </div>
      <div>
        <label class="text-xs font-semibold">Bidang / Spesialisasi</label>
        <select id="new-spec" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
          <option value="">— Pilih —</option>
          <option value="Doctor · Family Medicine">Doctor · Family Medicine</option>
          <option value="Doctor · Lifestyle Medicine">Doctor · Lifestyle Medicine</option>
          <option value="Doctor · Psychiatrist">Doctor · Psychiatrist</option>
          <option value="Nurse · Senior">Nurse · Senior</option>
          <option value="Nurse · Junior">Nurse · Junior</option>
          <option value="Coach · Wellness">Coach · Wellness</option>
          <option value="Coach · Spiritual">Coach · Spiritual</option>
          <option value="Coach · Nutrition">Coach · Nutrition</option>
          <option value="Admin · Operations">Admin · Operations</option>
          <option value="Admin · Finance">Admin · Finance</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold">No. Pendaftaran (MMC / APC / dll)</label>
        <input id="new-regno" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="Optional">
      </div>
      <div>
        <label class="text-xs font-semibold">No. Telefon</label>
        <input id="new-phone" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
      </div>
      <div id="create-error" class="hidden text-xs text-terracotta bg-terracotta-light rounded-lg p-3 text-center"></div>
    </div>
    <div class="p-5 border-t border-ink/10 flex justify-end gap-2">
      <button onclick="closeCreateModal()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm">Batal</button>
      <button onclick="createStaff()" id="create-btn" class="bg-navy text-white px-4 py-2 rounded-lg text-sm font-semibold">Daftar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function openCreateModal() {
  document.getElementById('create-modal').classList.remove('hidden');
  document.getElementById('create-error').classList.add('hidden');
}
function closeCreateModal() {
  document.getElementById('create-modal').classList.add('hidden');
  document.querySelectorAll('#create-modal input, #create-modal select').forEach(i => i.value = '');
}

// Toggle password field based on method
document.addEventListener('change', (e) => {
  if (e.target.name === 'method') {
    document.getElementById('password-row').classList.toggle('hidden', e.target.value !== 'password');
  }
});

async function createStaff() {
  const name = document.getElementById('new-name').value.trim();
  const email = document.getElementById('new-email').value.trim();
  const method = document.querySelector('input[name="method"]:checked')?.value || 'invite';
  const password = document.getElementById('new-password').value;
  const spec = document.getElementById('new-spec').value;
  const regno = document.getElementById('new-regno').value.trim();
  const phone = document.getElementById('new-phone').value.trim();
  const errEl = document.getElementById('create-error');
  errEl.classList.add('hidden');

  if (!name || !email) {
    errEl.textContent = 'Nama dan email wajib diisi';
    errEl.classList.remove('hidden');
    return;
  }
  if (method === 'password' && (!password || password.length < 6)) {
    errEl.textContent = 'Kata laluan mestilah min 6 aksara';
    errEl.classList.remove('hidden');
    return;
  }

  const btn = document.getElementById('create-btn');
  btn.disabled = true;
  btn.textContent = 'Mendaftar...';

  try {
    // Get session token for Edge Function auth
    const { data: { session } } = await window.db.auth.getSession();
    if (!session) throw new Error('Sila log masuk semula');

    // Call Edge Function
    const { data, error } = await window.db.functions.invoke('invite-staff', {
      body: {
        email,
        full_name: name,
        specialization: spec || null,
        registration_no: regno || null,
        phone: phone || null,
        send_invite: method === 'invite',
        temp_password: method === 'password' ? password : undefined,
      }
    });

    if (error) throw new Error(error.message || 'Gagal cipta staff');
    if (data?.error) throw new Error(data.error);

    banner(`Staff ${name} berjaya didaftar — ${data?.message || ''}`);
    closeCreateModal();
    setTimeout(loadStaff, 1000);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Daftar';
  }
}

async function loadStaff() {
  const data = await dbQuery('profiles', { eq: { role: 'staff' }, order: { col: 'created_at' } });
  document.getElementById('staff-body').innerHTML = data.length
    ? data.map(s => `<tr>
        <td><strong>${s.full_name}</strong></td>
        <td class="text-xs">${s.email || '—'}</td>
        <td class="text-xs">${s.specialization || '—'}</td>
        <td class="text-xs">${s.registration_no || '—'}</td>
        <td>${s.is_active ? '<span class="chip bg-green-light text-green-dark">Aktif</span>' : '<span class="chip bg-ink/10 text-ink/60">Tidak aktif</span>'}</td>
        <td><button onclick="toggleStaff('${s.id}',${s.is_active})" class="text-xs text-navy font-semibold">${s.is_active ? 'Nyahaktif' : 'Aktifkan'}</button></td>
      </tr>`).join('')
    : '<tr><td colspan="6" class="text-center text-ink/40 py-8">Tiada staff didaftarkan</td></tr>';
}

async function toggleStaff(id, isActive) {
  await dbUpdate('profiles', id, { is_active: !isActive });
  await auditLog('staff.' + (isActive ? 'deactivated' : 'activated'), id);
  banner('Status staff dikemaskini');
  loadStaff();
}

(async () => {
  const user = await initStaff('staff_mgmt', 'Daftar & urus akaun staff');
  if (!user) return;
  loadStaff();
})();
</script>
</body>
</html>
