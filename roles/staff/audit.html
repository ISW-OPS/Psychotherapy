<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Audit Log</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🔒</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-6">

        <!-- Page Header -->
        <div class="flex items-center justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-xl font-bold text-ink">Audit Log</h1>
            <p class="text-sm text-ink/45 mt-0.5">Rekod semua tindakan dalam sistem — siapa buat apa dan bila</p>
          </div>
          <button onclick="exportCsv()" class="flex items-center gap-2 border border-ink/15 text-ink/60 hover:text-ink hover:border-ink/30 px-4 py-2 rounded-xl text-sm font-medium transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Export CSV
          </button>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-4 flex flex-wrap gap-3 items-end">
          <div class="flex-1 min-w-[160px]">
            <label class="text-[11px] font-semibold text-ink/50 uppercase tracking-wide block mb-1.5">Tindakan</label>
            <select id="filter-action" onchange="applyFilters()" class="w-full text-sm border border-ink/15 rounded-lg px-3 py-2 bg-white text-ink focus:outline-none focus:ring-2 focus:ring-navy/20">
              <option value="">Semua</option>
              <option value="patient.created">Pesakit Baharu</option>
              <option value="kyc.submitted">KYC Dihantar</option>
              <option value="kyc.approved">KYC Disahkan</option>
              <option value="session.hadir">Sesi Hadir</option>
              <option value="inventory.request">Permohonan Inventori</option>
              <option value="inventory.adjust">Laras Stok</option>
              <option value="surat.generated">Surat Dijana</option>
              <option value="issue.reported">Isu Dilaporkan</option>
              <option value="issue.closed">Isu Ditutup</option>
              <option value="adherence.alert">Amaran Kepatuhan</option>
            </select>
          </div>
          <div class="flex-1 min-w-[140px]">
            <label class="text-[11px] font-semibold text-ink/50 uppercase tracking-wide block mb-1.5">Peranan</label>
            <select id="filter-role" onchange="applyFilters()" class="w-full text-sm border border-ink/15 rounded-lg px-3 py-2 bg-white text-ink focus:outline-none focus:ring-2 focus:ring-navy/20">
              <option value="">Semua</option>
              <option value="admin">Admin</option>
              <option value="manager">Manager</option>
              <option value="doctor">Doktor</option>
              <option value="coach">Coach</option>
              <option value="patient">Pesakit</option>
            </select>
          </div>
          <div class="flex-1 min-w-[150px]">
            <label class="text-[11px] font-semibold text-ink/50 uppercase tracking-wide block mb-1.5">Dari Tarikh</label>
            <input type="date" id="filter-from" onchange="applyFilters()" class="w-full text-sm border border-ink/15 rounded-lg px-3 py-2 bg-white text-ink focus:outline-none focus:ring-2 focus:ring-navy/20">
          </div>
          <div class="flex-1 min-w-[150px]">
            <label class="text-[11px] font-semibold text-ink/50 uppercase tracking-wide block mb-1.5">Hingga Tarikh</label>
            <input type="date" id="filter-to" onchange="applyFilters()" class="w-full text-sm border border-ink/15 rounded-lg px-3 py-2 bg-white text-ink focus:outline-none focus:ring-2 focus:ring-navy/20">
          </div>
          <div class="flex-1 min-w-[180px]">
            <label class="text-[11px] font-semibold text-ink/50 uppercase tracking-wide block mb-1.5">Cari</label>
            <input type="text" id="filter-search" oninput="applyFilters()" placeholder="Nama, target, tindakan..." class="w-full text-sm border border-ink/15 rounded-lg px-3 py-2 bg-white text-ink focus:outline-none focus:ring-2 focus:ring-navy/20">
          </div>
          <button onclick="resetFilters()" class="text-sm text-ink/40 hover:text-ink transition-colors px-3 py-2 rounded-lg hover:bg-ink/5 whitespace-nowrap">Reset</button>
        </div>

        <!-- Result count -->
        <div id="filter-summary" class="hidden flex items-center gap-2">
          <span class="text-xs text-ink/50">Menunjukkan</span>
          <span id="result-count" class="text-xs font-semibold text-navy bg-navy/10 px-2.5 py-1 rounded-full"></span>
          <span class="text-xs text-ink/50">rekod</span>
        </div>

        <!-- Log Table -->
        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
          <div class="px-5 py-3 border-b border-ink/8 grid gap-4 items-center" style="grid-template-columns:1fr 90px 130px 160px">
            <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider">Tindakan / Butiran</span>
            <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider">Peranan</span>
            <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider">Oleh</span>
            <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider text-right">Masa</span>
          </div>
          <div id="log-loading" class="px-5 py-10 text-center text-sm text-ink/40">Memuatkan log...</div>
          <div id="log-list" class="divide-y divide-ink/5"></div>
          <div id="log-empty" class="hidden px-5 py-16 text-center">
            <div class="text-4xl mb-3 opacity-20">🔍</div>
            <p class="text-sm text-ink/40 font-medium">Tiada rekod ditemui</p>
            <p class="text-xs text-ink/30 mt-1">Cuba tukar atau reset penapis</p>
          </div>
        </div>

        <!-- Load more -->
        <div id="load-more-wrap" class="hidden text-center">
          <button onclick="loadMore()" class="border border-ink/15 hover:border-ink/30 text-sm font-medium text-ink/60 hover:text-ink px-6 py-2.5 rounded-xl transition-colors">
            Muatkan lebih banyak
          </button>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const PAGE_SIZE = 50;
let allLogs   = [];
let filtered  = [];
let displayed = 0;

const ACTION_META = {
  'patient.created':    { label: 'Pesakit Baharu Didaftarkan',      dot: 'bg-green-500' },
  'kyc.submitted':      { label: 'KYC Dihantar',                    dot: 'bg-blue-400' },
  'kyc.approved':       { label: 'KYC Disahkan',                    dot: 'bg-green-400' },
  'kyc.rejected':       { label: 'KYC Ditolak',                     dot: 'bg-red-400' },
  'session.hadir':      { label: 'Sesi Hadir Ditanda',              dot: 'bg-teal-400' },
  'session.reschedule': { label: 'Sesi Dijadual Semula',            dot: 'bg-amber-400' },
  'inventory.request':  { label: 'Permohonan Inventori Dihantar',   dot: 'bg-purple-400' },
  'inventory.adjust':   { label: 'Stok Dikemas Kini',               dot: 'bg-amber-400' },
  'inventory.approve':  { label: 'Permohonan Inventori Diluluskan', dot: 'bg-green-400' },
  'surat.generated':    { label: 'Surat Rawatan Dijana',            dot: 'bg-indigo-400' },
  'issue.reported':     { label: 'Isu Dilaporkan',                  dot: 'bg-amber-500' },
  'issue.closed':       { label: 'Isu Ditutup',                     dot: 'bg-green-500' },
  'adherence.alert':    { label: 'Amaran Kepatuhan Dikeluarkan',    dot: 'bg-red-400' },
  'package.activated':  { label: 'Pakej Diaktifkan',                dot: 'bg-teal-500' },
  'agreement.signed':   { label: 'Perjanjian Ditandatangani',       dot: 'bg-green-500' },
};

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function relativeTime(iso) {
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60)    return 'Baru sahaja';
  if (diff < 3600)  return `${Math.floor(diff/60)} min lalu`;
  if (diff < 86400) return `${Math.floor(diff/3600)} jam lalu`;
  const d = new Date(iso);
  return d.toLocaleDateString('ms-MY',{day:'2-digit',month:'short',year:'numeric'})
    + ', ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function roleChip(role) {
  const map = {
    admin:   'bg-[#6366f1]/10 text-[#6366f1]',
    manager: 'bg-teal/10 text-teal',
    doctor:  'bg-blue-100 text-blue-700',
    coach:   'bg-green-100 text-green-700',
    patient: 'bg-amber-100 text-amber-700',
  };
  const cls = map[(role||'').toLowerCase()] || 'bg-ink/10 text-ink/50';
  return `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${cls} capitalize">${escHtml(role||'Sistem')}</span>`;
}

function renderRow(log) {
  const info   = ACTION_META[log.action] || { label: log.action, dot: 'bg-ink/30' };
  const detail = log.target || log.meta?.patient_name || log.meta?.item_name || '';
  const metaStr = log.meta
    ? Object.entries(log.meta)
        .filter(([k]) => !['patient_name','item_name'].includes(k))
        .slice(0, 4)
        .map(([k,v]) => `${k}: ${v}`)
        .join(' · ')
    : '';

  return `<div class="grid gap-4 items-start px-5 py-3.5 hover:bg-ink/[0.015] transition-colors" style="grid-template-columns:1fr 90px 130px 160px">
    <div class="min-w-0">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full flex-shrink-0 ${info.dot}"></span>
        <span class="text-sm font-semibold text-ink">${info.label}</span>
      </div>
      ${detail ? `<div class="text-[11px] text-ink/50 mt-0.5 pl-4 truncate">${escHtml(detail)}</div>` : ''}
      ${metaStr ? `<div class="text-[10px] text-ink/35 mt-0.5 pl-4 truncate">${escHtml(metaStr)}</div>` : ''}
    </div>
    <div class="pt-0.5">${roleChip(log.actor_role)}</div>
    <div class="pt-0.5 min-w-0">
      <div class="text-xs text-ink/65 font-medium truncate">${escHtml(log.actor_name||'Sistem')}</div>
    </div>
    <div class="pt-0.5 text-right">
      <div class="text-xs text-ink/45 leading-snug">${relativeTime(log.created_at)}</div>
    </div>
  </div>`;
}

function renderList() {
  const slice  = filtered.slice(0, displayed);
  const listEl  = document.getElementById('log-list');
  const emptyEl = document.getElementById('log-empty');
  const moreEl  = document.getElementById('load-more-wrap');
  const summEl  = document.getElementById('filter-summary');
  const countEl = document.getElementById('result-count');

  if (!filtered.length) {
    listEl.innerHTML = '';
    emptyEl.classList.remove('hidden');
    moreEl.classList.add('hidden');
  } else {
    emptyEl.classList.add('hidden');
    listEl.innerHTML = slice.map(renderRow).join('');
    moreEl.classList.toggle('hidden', displayed >= filtered.length);
  }

  summEl.classList.toggle('hidden', filtered.length === allLogs.length);
  countEl.textContent = filtered.length;
}

function applyFilters() {
  const action = document.getElementById('filter-action').value;
  const role   = document.getElementById('filter-role').value;
  const from   = document.getElementById('filter-from').value;
  const to     = document.getElementById('filter-to').value;
  const search = document.getElementById('filter-search').value.toLowerCase().trim();

  filtered = allLogs.filter(log => {
    if (action && log.action !== action) return false;
    if (role   && (log.actor_role||'').toLowerCase() !== role) return false;
    if (from   && log.created_at < from) return false;
    if (to     && log.created_at > to + 'T23:59:59') return false;
    if (search) {
      const hay = [log.actor_name, log.action, log.target,
        JSON.stringify(log.meta||{})].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  displayed = PAGE_SIZE;
  renderList();
}

function resetFilters() {
  const d30 = new Date(); d30.setDate(d30.getDate() - 30);
  document.getElementById('filter-action').value = '';
  document.getElementById('filter-role').value   = '';
  document.getElementById('filter-from').value   = d30.toISOString().split('T')[0];
  document.getElementById('filter-to').value     = '';
  document.getElementById('filter-search').value = '';
  filtered  = [...allLogs];
  displayed = PAGE_SIZE;
  renderList();
}

function loadMore() {
  displayed += PAGE_SIZE;
  renderList();
}

function exportCsv() {
  const rows = [['Masa','Tindakan','Butiran','Oleh','Peranan']];
  filtered.forEach(log => {
    const info   = ACTION_META[log.action] || { label: log.action };
    const detail = log.target || log.meta?.patient_name || log.meta?.item_name || '—';
    rows.push([
      new Date(log.created_at).toLocaleString('ms-MY'),
      info.label,
      detail,
      log.actor_name || 'Sistem',
      log.actor_role || '—',
    ]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a   = document.createElement('a');
  a.href    = 'data:text/csv;charset=utf-8,﻿' + encodeURIComponent(csv);
  a.download= `audit_log_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
}

async function init() {
  const user = await initStaff('audit', 'Audit Log');
  if (!user) return;

  const d30 = new Date(); d30.setDate(d30.getDate() - 30);
  document.getElementById('filter-from').value = d30.toISOString().split('T')[0];

  const { data, error } = await window.db
    .from('psy_audit_log')
    .select('*')
    .gte('created_at', d30.toISOString())
    .order('created_at', { ascending: false })
    .limit(500);

  document.getElementById('log-loading').classList.add('hidden');

  if (error) { banner('Ralat: ' + error.message, 'error'); return; }

  allLogs   = data || [];
  filtered  = [...allLogs];
  displayed = PAGE_SIZE;
  renderList();
}

init();
</script>
</body>
</html>
