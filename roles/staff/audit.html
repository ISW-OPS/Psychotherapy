<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Audit Log</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
  .log-table { border-collapse: separate; border-spacing: 0; }
  .log-table thead th {
    background: transparent;
    text-align: left;
    font-size: 11px;
    color: rgba(0,0,0,0.55);
    font-weight: 600;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .log-table tbody td {
    padding: 16px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    font-size: 13px;
    vertical-align: top;
  }
  .log-table tbody tr:hover td { background: #fcfaf5; }
  .avatar-sm { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; color: white; flex-shrink: 0; }
  .chip-action { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
</style>
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🔒</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <!-- Title -->
        <div>
          <h1 class="text-2xl font-bold text-ink">Audit Log</h1>
          <p class="text-sm text-ink/55 mt-1">Log aktiviti perubahan, peranan dan kebenaran dalam sistem.</p>
        </div>

        <!-- Filter bar -->
        <div class="bg-white rounded-2xl border border-ink/10 p-4 flex items-center gap-3 flex-wrap">
          <div class="flex items-center gap-2 text-sm">
            <span class="text-ink/55 text-xs">📅</span>
            <input id="f-from" type="date" class="border border-ink/15 rounded-lg px-3 py-2 text-sm outline-none focus:border-navy">
            <span class="text-ink/40">—</span>
            <input id="f-to" type="date" class="border border-ink/15 rounded-lg px-3 py-2 text-sm outline-none focus:border-navy">
          </div>
          <select id="f-action" class="border border-ink/15 rounded-lg px-3 py-2 text-sm bg-white outline-none focus:border-navy">
            <option value="">Semua Aktiviti</option>
          </select>
          <select id="f-actor" class="border border-ink/15 rounded-lg px-3 py-2 text-sm bg-white outline-none focus:border-navy">
            <option value="">Semua Pengguna</option>
            <option value="staff">Hanya Staff</option>
            <option value="patient">Hanya Pesakit</option>
          </select>
          <button onclick="loadLog()" class="bg-navy text-white text-sm px-4 py-2 rounded-lg font-semibold hover:bg-navy-dark">🔍 Tapis</button>
          <button onclick="resetFilters()" class="text-sm px-4 py-2 border border-ink/20 rounded-lg hover:bg-cream">↻ Reset</button>
          <span id="log-count" class="ml-auto text-xs text-ink/55">—</span>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl border border-ink/10 overflow-x-auto">
          <table class="log-table w-full">
            <thead>
              <tr>
                <th>Tarikh & Masa</th>
                <th>Pengguna</th>
                <th>Aktiviti</th>
                <th>Butiran</th>
                <th>IP Address</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="log-body"></tbody>
          </table>
          <div class="px-5 py-3 border-t border-ink/8 flex items-center justify-between text-xs text-ink/55">
            <span id="log-pagination">—</span>
            <div class="flex gap-2">
              <button id="page-prev" onclick="changePage(-1)" class="px-3 py-1.5 border border-ink/15 rounded-lg text-xs hover:bg-cream disabled:opacity-40" disabled>←</button>
              <button id="page-next" onclick="changePage(1)" class="px-3 py-1.5 border border-ink/15 rounded-lg text-xs hover:bg-cream disabled:opacity-40" disabled>→</button>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const PAGE_SIZE = 25;
let currentPage = 0;
let allRows = [];
let totalCount = 0;

// Map action code → label + colour for chip
const ACTION_MAP = {
  // Staff
  'staff.invited':      { label: 'Daftar Staff',        cls: 'bg-teal/15 text-teal' },
  'staff.updated':      { label: 'Update Profile',      cls: 'bg-navy-light text-navy' },
  'staff.deleted':      { label: 'Padam Staff',         cls: 'bg-terracotta-light text-terracotta' },
  // Patient
  'patient.assigned':   { label: 'Assign Coach',        cls: 'bg-teal/15 text-teal' },
  'patient.unassigned': { label: 'Unassign Coach',      cls: 'bg-ink/10 text-ink/65' },
  // Issue / feedback
  'issue.created':      { label: 'Cipta Aduan',         cls: 'bg-gold/30 text-gold-dark' },
  'issue.followup':     { label: 'Follow-up Aduan',     cls: 'bg-gold/20 text-gold-dark' },
  'issue.responded':    { label: 'Balas Aduan',         cls: 'bg-navy-light text-navy' },
  'feedback.submitted': { label: 'Hantar Feedback',     cls: 'bg-green-light text-green-dark' },
  // KYC
  'kyc.submitted':      { label: 'Hantar KYC',          cls: 'bg-gold/30 text-gold-dark' },
  'kyc.approved':       { label: 'Lulus KYC',           cls: 'bg-green-light text-green-dark' },
  'kyc.rejected':       { label: 'Tolak KYC',           cls: 'bg-terracotta-light text-terracotta' },
  // Surat
  'letter.issued':            { label: 'Surat Dikeluarkan', cls: 'bg-green-light text-green-dark' },
  'letter.request_rejected':  { label: 'Tolak Permohonan Surat', cls: 'bg-terracotta-light text-terracotta' },
  'letter.template_deleted':  { label: 'Padam Templat Surat',    cls: 'bg-terracotta-light text-terracotta' },
  'letter.issued_deleted':    { label: 'Padam Surat Issued',     cls: 'bg-terracotta-light text-terracotta' },
  // Generic fallback handled in renderRow
};

const ROLE_AVATAR_CLS = {
  staff:   'bg-navy',
  patient: 'bg-teal',
};

(async function init() {
  const user = await initStaff('audit', 'Jejak semua aktiviti penting dalam sistem');
  if (!user) return;

  // Default: last 30 days
  const to   = new Date();
  const from = new Date(); from.setDate(from.getDate() - 30);
  document.getElementById('f-from').value = from.toISOString().split('T')[0];
  document.getElementById('f-to').value   = to.toISOString().split('T')[0];

  await loadActionOptions();
  await loadLog();
})();

async function loadActionOptions() {
  // Distinct actions from psy_audit_log (last 90 days untuk reduce)
  const { data } = await window.db.from('psy_audit_log')
    .select('action').order('action').limit(500);
  const seen = new Set();
  (data || []).forEach(r => seen.add(r.action));
  const sel = document.getElementById('f-action');
  sel.innerHTML = '<option value="">Semua Aktiviti</option>' +
    [...seen].sort().map(a => {
      const lbl = ACTION_MAP[a]?.label || a;
      return `<option value="${a}">${lbl}</option>`;
    }).join('');
}

async function loadLog() {
  currentPage = 0;
  const fFrom   = document.getElementById('f-from').value;
  const fTo     = document.getElementById('f-to').value;
  const fAction = document.getElementById('f-action').value;
  const fActor  = document.getElementById('f-actor').value;

  let q = window.db.from('psy_audit_log').select('*', { count: 'exact' }).order('created_at', { ascending: false });
  if (fFrom)   q = q.gte('created_at', fFrom + 'T00:00:00');
  if (fTo)     q = q.lte('created_at', fTo   + 'T23:59:59');
  if (fAction) q = q.eq('action', fAction);
  if (fActor)  q = q.eq('actor_role', fActor);

  const { data, count } = await q.range(0, PAGE_SIZE * 5 - 1); // grab 5 pages worth
  allRows = data || [];
  totalCount = count || 0;
  document.getElementById('log-count').textContent = `${totalCount.toLocaleString()} rekod`;
  renderPage();
}

function renderPage() {
  const start = currentPage * PAGE_SIZE;
  const end   = start + PAGE_SIZE;
  const rows  = allRows.slice(start, end);

  if (!rows.length) {
    document.getElementById('log-body').innerHTML =
      `<tr><td colspan="6" class="text-center py-10 text-ink/40">Tiada aktiviti dijumpai untuk filter ini.</td></tr>`;
    document.getElementById('log-pagination').textContent = '0 rekod';
    document.getElementById('page-prev').disabled = true;
    document.getElementById('page-next').disabled = true;
    return;
  }

  document.getElementById('log-body').innerHTML = rows.map(renderRow).join('');
  document.getElementById('log-pagination').textContent =
    `Memaparkan ${start + 1}–${Math.min(end, allRows.length)} daripada ${totalCount.toLocaleString()} log`;
  document.getElementById('page-prev').disabled = currentPage === 0;
  document.getElementById('page-next').disabled = end >= allRows.length;
}

function renderRow(r) {
  const dt = new Date(r.created_at);
  const date = dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  const time = dt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

  const actorName = r.actor_name || '(Sistem)';
  const initial   = (actorName).split(' ').map(s => s[0]).join('').slice(0,2).toUpperCase() || '?';
  const avatarCls = ROLE_AVATAR_CLS[r.actor_role] || 'bg-ink/50';

  const ac     = ACTION_MAP[r.action] || { label: r.action, cls: 'bg-ink/10 text-ink/65' };
  const detail = formatDetail(r);
  const ip     = r.meta?.ip || '—';

  return `<tr>
    <td>
      <div class="font-medium text-ink">${date},</div>
      <div class="text-ink/60 text-xs mt-0.5">${time}</div>
    </td>
    <td>
      <div class="flex items-center gap-3">
        <span class="avatar-sm ${avatarCls}">${initial}</span>
        <div>
          <div class="font-medium text-ink">${actorName}</div>
          <div class="text-[10px] text-ink/50 capitalize">${r.actor_role || ''}</div>
        </div>
      </div>
    </td>
    <td><span class="chip-action ${ac.cls}">${ac.label}</span></td>
    <td class="text-ink/75">${detail}</td>
    <td class="text-ink/60 text-xs">${ip}</td>
    <td class="text-right">
      <button onclick='showRaw(${JSON.stringify(JSON.stringify(r))})' class="text-ink/40 hover:text-ink text-lg leading-none" title="Lihat data mentah">⋮</button>
    </td>
  </tr>`;
}

function formatDetail(r) {
  const meta = r.meta || {};
  // Hand-crafted summaries per action
  switch (r.action) {
    case 'staff.invited':
      return `Daftar staff <b>${meta.name || ''}</b> (${meta.email || ''}) sebagai ${meta.staff_role || ''}`;
    case 'staff.updated':
      return `Kemas kini profil staff${meta.full_name ? ` ${meta.full_name}` : ''}`;
    case 'staff.deleted':
      return `Padam akaun staff`;
    case 'patient.assigned':
      return `Assign coach kepada pesakit`;
    case 'patient.unassigned':
      return `Buang assignment coach`;
    case 'kyc.submitted':
      return `Hantar borang KYC`;
    case 'kyc.approved':
      return `Lulus KYC pesakit`;
    case 'kyc.rejected':
      return `Tolak KYC: ${meta.reason || '—'}`;
    case 'feedback.submitted':
      return `Hantar feedback rating ${meta.rating || ''}`;
    case 'issue.created':
      return `Cipta aduan: ${meta.title || meta.subject || '—'}`;
    case 'issue.followup':
      return `Follow-up aduan`;
    case 'issue.responded':
      return `Balas aduan pesakit`;
    case 'letter.issued':
      return `Keluar surat <b>${meta.template || ''}</b> (${meta.ref || '—'}) ${meta.patient_name ? `kepada ${meta.patient_name}` : ''}`;
    case 'letter.request_rejected':
      return `Tolak permohonan: ${meta.template || '—'} — alasan: ${truncate(meta.reason || '—', 60)}`;
    case 'letter.template_deleted':
      return `Padam templat: ${meta.name || '—'}`;
    case 'letter.issued_deleted':
      return `Padam surat ${meta.ref || ''} (${meta.template || ''}) milik ${meta.patient || '—'}`;
    default:
      // Best-effort generic
      const keys = Object.keys(meta);
      if (!keys.length) return '—';
      const main = keys.slice(0, 2).map(k => `${k}: ${truncate(JSON.stringify(meta[k]), 30)}`).join(', ');
      return main;
  }
}

function truncate(s, n) {
  s = String(s);
  return s.length > n ? s.slice(0, n) + '…' : s;
}

function changePage(delta) {
  currentPage = Math.max(0, currentPage + delta);
  renderPage();
}

function resetFilters() {
  const to   = new Date();
  const from = new Date(); from.setDate(from.getDate() - 30);
  document.getElementById('f-from').value = from.toISOString().split('T')[0];
  document.getElementById('f-to').value   = to.toISOString().split('T')[0];
  document.getElementById('f-action').value = '';
  document.getElementById('f-actor').value = '';
  loadLog();
}

function showRaw(jsonStr) {
  try {
    const r = JSON.parse(jsonStr);
    alert(JSON.stringify(r, null, 2));
  } catch {
    alert(jsonStr);
  }
}
</script>
</body>
</html>
