<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Audit Log</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
  .row-log:hover td { background:#fafbfc; }
  .module-pill { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:10px; font-weight:600; }
  .action-icon { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
</style>
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🔒</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <!-- Title -->
        <div>
          <h1 class="text-2xl font-bold text-ink">Audit Log</h1>
          <p class="text-sm text-ink/55 mt-0.5">Jejak semua aktiviti penting dalam sistem.</p>
        </div>

        <!-- 4 Stat cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="bg-white rounded-2xl border border-ink/10 p-5 flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-navy-light flex items-center justify-center text-xl">📋</div>
            <div class="min-w-0">
              <div class="text-[11px] text-ink/55 font-semibold">Jumlah Aktiviti</div>
              <div id="stat-total" class="text-2xl font-bold text-ink leading-none mt-1">0</div>
              <div class="text-[10px] text-ink/50 mt-1">Semua aktiviti direkodkan</div>
            </div>
          </div>
          <div class="bg-white rounded-2xl border border-ink/10 p-5 flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-green-light flex items-center justify-center text-xl">✅</div>
            <div class="min-w-0">
              <div class="text-[11px] text-ink/55 font-semibold">Aktiviti Berjaya</div>
              <div id="stat-success" class="text-2xl font-bold text-ink leading-none mt-1">0</div>
              <div id="stat-success-pct" class="text-[10px] text-ink/50 mt-1">— daripada jumlah</div>
            </div>
          </div>
          <div class="bg-white rounded-2xl border border-ink/10 p-5 flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-gold/30 flex items-center justify-center text-xl">⚠️</div>
            <div class="min-w-0">
              <div class="text-[11px] text-ink/55 font-semibold">Aktiviti Gagal</div>
              <div id="stat-fail" class="text-2xl font-bold text-ink leading-none mt-1">0</div>
              <div id="stat-fail-pct" class="text-[10px] text-ink/50 mt-1">— daripada jumlah</div>
            </div>
          </div>
          <div class="bg-white rounded-2xl border border-ink/10 p-5 flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-teal/10 flex items-center justify-center text-xl">👤</div>
            <div class="min-w-0">
              <div class="text-[11px] text-ink/55 font-semibold">Pengguna Aktif</div>
              <div id="stat-users" class="text-2xl font-bold text-ink leading-none mt-1">0</div>
              <div class="text-[10px] text-ink/50 mt-1">Hari ini</div>
            </div>
          </div>
        </div>

        <!-- Filter card -->
        <div class="bg-white rounded-2xl border border-ink/10 p-4 space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/30 text-sm pointer-events-none">🔍</span>
              <input id="f-search" oninput="renderTable()" placeholder="Cari nama pengguna, tindakan, modul..."
                class="w-full border border-ink/15 rounded-lg pl-9 pr-3 py-2.5 text-sm outline-none focus:border-navy">
            </div>
            <input id="f-daterange" type="text" readonly placeholder="01/05/2024 - 21/05/2024"
              class="w-full border border-ink/15 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-navy bg-white cursor-not-allowed text-ink/40" title="Filter tarikh akan datang">
            <select id="f-module" onchange="renderTable()" class="border border-ink/15 rounded-lg px-3 py-2.5 text-sm bg-white outline-none focus:border-navy">
              <option value="">Semua Modul</option>
            </select>
            <select id="f-action" onchange="renderTable()" class="border border-ink/15 rounded-lg px-3 py-2.5 text-sm bg-white outline-none focus:border-navy">
              <option value="">Semua Tindakan</option>
            </select>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
            <select id="f-status" onchange="renderTable()" class="border border-ink/15 rounded-lg px-3 py-2.5 text-sm bg-white outline-none focus:border-navy">
              <option value="">Semua Status</option>
              <option value="success">Berjaya</option>
              <option value="fail">Gagal</option>
            </select>
            <select id="f-user" onchange="renderTable()" class="border border-ink/15 rounded-lg px-3 py-2.5 text-sm bg-white outline-none focus:border-navy">
              <option value="">Semua Pengguna</option>
            </select>
            <div></div>
          </div>

          <!-- Action bar -->
          <div class="flex items-center gap-2 flex-wrap pt-1">
            <div class="flex-1"></div>
            <button onclick="resetFilters()" class="inline-flex items-center gap-1.5 border border-ink/15 text-ink/70 px-3 py-2 rounded-lg text-xs font-semibold hover:bg-cream">
              ↺ Reset
            </button>
            <button onclick="exportCsv()" class="inline-flex items-center gap-1.5 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:opacity-90" style="background-color:#1D6F42">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
              Export Excel
            </button>
            <button onclick="window.print()" class="inline-flex items-center gap-1.5 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:opacity-90" style="background-color:#7C3AED">
              🖨️ Print
            </button>
          </div>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl border border-ink/10 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-cream/40 text-[10px] uppercase tracking-wide text-ink/50">
                <tr>
                  <th class="text-left py-3 px-4">Masa & Tarikh <span class="ml-1">↑</span></th>
                  <th class="text-left py-3 px-3">Pengguna</th>
                  <th class="text-left py-3 px-3">Modul</th>
                  <th class="text-left py-3 px-3">Tindakan</th>
                  <th class="text-left py-3 px-3">Butiran</th>
                  <th class="text-left py-3 px-3">Status</th>
                </tr>
              </thead>
              <tbody id="log-body"></tbody>
            </table>
          </div>
          <div id="pagination" class="flex items-center justify-between px-5 py-3 border-t border-ink/8 text-xs"></div>
        </div>

      </div>
    </main>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// ── Action mapping ───────────────────────────────────
// action key (cth: "patient.created") → { module: "Pesakit", verb: "Cipta", icon, bg }
const ACTION_MAP = {
  'patient.created':    { module: 'Pesakit',  verb: 'Cipta',    icon: '👤', bg: '#e0e7ff', fg: '#3730a3', mPill:{bg:'#ede9fe',fg:'#5b21b6'} },
  'patient.updated':    { module: 'Pesakit',  verb: 'Kemaskini',icon: '✏️', bg: '#dbeafe', fg: '#1e40af', mPill:{bg:'#ede9fe',fg:'#5b21b6'} },
  'patient.deleted':    { module: 'Pesakit',  verb: 'Padam',    icon: '🗑️', bg: '#fee2e2', fg: '#991b1b', mPill:{bg:'#ede9fe',fg:'#5b21b6'} },
  'patient.access_denied':{ module:'Pesakit', verb: 'Akses Ditolak', icon:'⚠️', bg:'#fed7aa', fg:'#9a3412', mPill:{bg:'#ede9fe',fg:'#5b21b6'} },
  'kyc.submitted':      { module: 'KYC',      verb: 'Hantar',   icon: '🔒', bg: '#fce7f3', fg: '#9d174d', mPill:{bg:'#fce7f3',fg:'#9d174d'} },
  'kyc.approved':       { module: 'KYC',      verb: 'Lulus',    icon: '🔒', bg: '#d1fae5', fg: '#065f46', mPill:{bg:'#fce7f3',fg:'#9d174d'} },
  'kyc.rejected':       { module: 'KYC',      verb: 'Tolak',    icon: '🔒', bg: '#fee2e2', fg: '#991b1b', mPill:{bg:'#fce7f3',fg:'#9d174d'} },
  'session.hadir':      { module: 'Kalendar', verb: 'Hadir',    icon: '✅', bg: '#d1fae5', fg: '#065f46', mPill:{bg:'#d1fae5',fg:'#065f46'} },
  'session.created':    { module: 'Kalendar', verb: 'Cipta',    icon: '➕', bg: '#d1fae5', fg: '#065f46', mPill:{bg:'#d1fae5',fg:'#065f46'} },
  'session.reschedule': { module: 'Kalendar', verb: 'Jadual Semula', icon: '🔄', bg: '#fef3c7', fg: '#92400e', mPill:{bg:'#d1fae5',fg:'#065f46'} },
  'session.cancel':     { module: 'Kalendar', verb: 'Batal',    icon: '❌', bg: '#fee2e2', fg: '#991b1b', mPill:{bg:'#d1fae5',fg:'#065f46'} },
  'plan.week_updated':  { module: 'Pelan',    verb: 'Kemaskini',icon: '📋', bg: '#dbeafe', fg: '#1e40af', mPill:{bg:'#dbeafe',fg:'#1e40af'} },
  'package.activated':  { module: 'Pakej',    verb: 'Cipta',    icon: '📦', bg: '#d1fae5', fg: '#065f46', mPill:{bg:'#ccfbf1',fg:'#115e59'} },
  'package.created':    { module: 'Pakej',    verb: 'Cipta',    icon: '📦', bg: '#d1fae5', fg: '#065f46', mPill:{bg:'#ccfbf1',fg:'#115e59'} },
  'product.updated':    { module: 'Produk',   verb: 'Kemaskini',icon: '✏️', bg: '#fef3c7', fg: '#92400e', mPill:{bg:'#fef3c7',fg:'#92400e'} },
  'product.created':    { module: 'Produk',   verb: 'Cipta',    icon: '🛍️', bg: '#fef3c7', fg: '#92400e', mPill:{bg:'#fef3c7',fg:'#92400e'} },
  'inventory.delete':   { module: 'Inventori',verb: 'Padam',    icon: '🗑️', bg: '#fee2e2', fg: '#991b1b', mPill:{bg:'#dbeafe',fg:'#1e40af'} },
  'inventory.adjust':   { module: 'Inventori',verb: 'Laras',    icon: '📊', bg: '#fef3c7', fg: '#92400e', mPill:{bg:'#dbeafe',fg:'#1e40af'} },
  'inventory.request':  { module: 'Inventori',verb: 'Mohon',    icon: '📋', bg: '#ede9fe', fg: '#5b21b6', mPill:{bg:'#dbeafe',fg:'#1e40af'} },
  'inventory.approve':  { module: 'Inventori',verb: 'Lulus',    icon: '✅', bg: '#d1fae5', fg: '#065f46', mPill:{bg:'#dbeafe',fg:'#1e40af'} },
  'surat.generated':    { module: 'Surat',    verb: 'Jana',     icon: '📜', bg: '#e0e7ff', fg: '#3730a3', mPill:{bg:'#e0e7ff',fg:'#3730a3'} },
  'issue.reported':     { module: 'Sistem',   verb: 'Lapor',    icon: '⚠️', bg: '#fef3c7', fg: '#92400e', mPill:{bg:'#fed7aa',fg:'#9a3412'} },
  'issue.closed':       { module: 'Sistem',   verb: 'Tutup',    icon: '✅', bg: '#d1fae5', fg: '#065f46', mPill:{bg:'#fed7aa',fg:'#9a3412'} },
  'auth.login':         { module: 'Sistem',   verb: 'Log Masuk',icon: '↪️', bg: '#dbeafe', fg: '#1e40af', mPill:{bg:'#fed7aa',fg:'#9a3412'} },
  'auth.logout':        { module: 'Sistem',   verb: 'Log Keluar',icon: '↩️',bg: '#dbeafe', fg: '#1e40af', mPill:{bg:'#fed7aa',fg:'#9a3412'} },
};

function getActionMeta(action) {
  if (ACTION_MAP[action]) return ACTION_MAP[action];
  const [mod, verb] = (action || '').split('.');
  return {
    module: (mod || 'Lain').replace(/^\w/, c => c.toUpperCase()),
    verb: (verb || 'Aktiviti').replace(/^\w/, c => c.toUpperCase()).replace(/_/g, ' '),
    icon: '•',
    bg: '#f3f4f6', fg: '#6b7280',
    mPill: { bg: '#f3f4f6', fg: '#6b7280' },
  };
}

function getStatus(log) {
  // Convention: meta.status = 'fail' OR action contains 'denied'/'rejected'/'failed'
  const a = log.action || '';
  if (log.meta?.status === 'fail') return 'fail';
  if (log.meta?.success === false) return 'fail';
  if (a.includes('denied') || a.includes('rejected') || a.includes('failed')) return 'fail';
  return 'success';
}

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── State ────────────────────────────────────────────
let _allLogs = [];
let _resolveMap = {}; // { uuid: "Human Readable Name" }
const PAGE_SIZE = 10;
let currentPage = 1;

// ── UUID resolver ────────────────────────────────────
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

// Map action prefix → table + select fields + label builder
// IMPORTANT: psy_patients tiada column full_name — name via psy_profiles join
const TARGET_TABLES = [
  { prefix: ['patient', 'kyc', 'assign', 'unassign'], table: 'psy_patients',
    select: 'id, mrn, psy_profiles!psy_patients_user_id_fkey(full_name)',
    label: r => r.psy_profiles?.full_name || (r.mrn ? `Pesakit ${r.mrn}` : null),
    typeLabel: 'Pesakit' },
  { prefix: ['plan', 'session'], table: 'psy_plan_weekly_progress',
    select: 'id, week_number, plan_id, psy_patients(mrn, psy_profiles(full_name))',
    label: r => {
      const p = r.psy_patients?.psy_profiles?.full_name || r.psy_patients?.mrn || 'Pesakit';
      return `${p} · M${r.week_number || '?'}`;
    },
    typeLabel: 'Sesi' },
  { prefix: ['plan'], table: 'psy_treatment_plans', select: 'id, name', label: r => r.name, typeLabel: 'Pelan' },
  { prefix: ['kob'], table: 'psy_kob_sessions',
    select: 'id, psy_patients(mrn, psy_profiles(full_name))',
    label: r => r.psy_patients?.psy_profiles?.full_name || r.psy_patients?.mrn || null,
    typeLabel: 'KOB' },
  { prefix: ['inventory'], table: 'psy_inventory_items', select: 'id, name', label: r => r.name, typeLabel: 'Item' },
  { prefix: ['product'], table: 'psy_products', select: 'id, name', label: r => r.name, typeLabel: 'Produk' },
  { prefix: ['package', 'pakej'], table: 'psy_packages', select: 'id, name', label: r => r.name, typeLabel: 'Pakej' },
  { prefix: ['service'], table: 'psy_services', select: 'id, name', label: r => r.name, typeLabel: 'Service' },
  { prefix: ['library'], table: 'psy_library', select: 'id, title', label: r => r.title, typeLabel: 'Library' },
  { prefix: ['risk'], table: 'psy_risk_alerts',
    select: 'id, description, psy_patients(mrn, psy_profiles(full_name))',
    label: r => r.psy_patients?.psy_profiles?.full_name || r.description || null,
    typeLabel: 'Risk' },
  { prefix: ['vitals', 'soap'], table: 'psy_patients',
    select: 'id, mrn, psy_profiles!psy_patients_user_id_fkey(full_name)',
    label: r => r.psy_profiles?.full_name || r.mrn || null,
    typeLabel: 'Pesakit' },
  { prefix: ['kit'], table: 'psy_procedure_kits', select: 'id, name', label: r => r.name, typeLabel: 'Kit' },
  { prefix: ['order'], table: 'psy_orders', select: 'id', label: r => r.id?.slice(0,8), typeLabel: 'Order' },
  { prefix: ['clinic_slot', 'slot_override'], table: 'psy_clinic_slots', select: 'id, slot_date, start_time',
    label: r => r.slot_date ? `Slot ${r.slot_date}` : null, typeLabel: 'Slot' },
];

// Fallback labels for unresolved UUIDs ikut prefix
const PREFIX_LABELS = {
  patient: 'Pesakit', kyc: 'Pesakit', assign: 'Pesakit', unassign: 'Pesakit',
  plan: 'Sesi/Pelan', session: 'Sesi',
  kob: 'KOB', inventory: 'Item', product: 'Produk',
  package: 'Pakej', pakej: 'Pakej', service: 'Service',
  library: 'Library', risk: 'Risk', vitals: 'Pesakit', soap: 'Pesakit',
  kit: 'Kit', order: 'Order', clinic_slot: 'Slot', slot_override: 'Slot',
  clinic_closure: 'Cuti', closure: 'Cuti',
  issue: 'Isu', surat: 'Surat', payment: 'Bayaran',
  agreement: 'Perjanjian',
};

function actionPrefix(action) {
  return (action || '').split('.')[0].toLowerCase();
}

async function resolveTargets() {
  _resolveMap = {};

  // Group UUID targets by which table they likely belong to (ikut action prefix)
  const buckets = {}; // { tableIdx: Set(uuid) }
  _allLogs.forEach(log => {
    const t = log.target;
    if (!t || !UUID_RE.test(t)) return;
    const prefix = actionPrefix(log.action);
    TARGET_TABLES.forEach((spec, idx) => {
      if (spec.prefix.includes(prefix)) {
        if (!buckets[idx]) buckets[idx] = new Set();
        buckets[idx].add(t);
      }
    });
  });

  // Batch fetch each table sekali sahaja
  await Promise.all(Object.entries(buckets).map(async ([idx, set]) => {
    const spec = TARGET_TABLES[idx];
    const ids = [...set];
    if (!ids.length) return;
    try {
      const { data, error } = await window.db.from(spec.table).select(spec.select).in('id', ids);
      if (error) { console.warn(`[audit-resolve] ${spec.table}:`, error.message); return; }
      (data || []).forEach(row => {
        const name = spec.label(row);
        if (name && !_resolveMap[row.id]) _resolveMap[row.id] = name;
      });
    } catch (e) { console.warn(`[audit-resolve] ${spec.table} exception:`, e.message); }
  }));
}

// Build fallback label for unresolved UUID — guna prefix action utk teka jenis
function fallbackLabel(action, uuid) {
  const prefix = actionPrefix(action);
  const typeLabel = PREFIX_LABELS[prefix] || 'Rekod';
  const shortId = (uuid || '').slice(0, 8);
  return `${typeLabel} (${shortId}…)`;
}

function getFiltered() {
  const q   = document.getElementById('f-search').value.toLowerCase().trim();
  const mod = document.getElementById('f-module').value;
  const act = document.getElementById('f-action').value;
  const st  = document.getElementById('f-status').value;
  const usr = document.getElementById('f-user').value;

  return _allLogs.filter(log => {
    const meta = getActionMeta(log.action);
    if (q) {
      const blob = `${log.actor_name||''} ${log.action||''} ${log.target||''} ${meta.module} ${meta.verb} ${JSON.stringify(log.meta||{})}`.toLowerCase();
      if (!blob.includes(q)) return false;
    }
    if (mod && meta.module !== mod) return false;
    if (act && log.action !== act) return false;
    if (usr && log.actor_id !== usr) return false;
    if (st  && getStatus(log) !== st) return false;
    return true;
  });
}

function resetFilters() {
  ['f-search','f-module','f-action','f-status','f-user'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  currentPage = 1;
  renderTable();
}

function renderTable() {
  const list = getFiltered();
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const slice = list.slice(start, start + PAGE_SIZE);

  const body = document.getElementById('log-body');
  if (!slice.length) {
    body.innerHTML = '<tr><td colspan="6" class="text-center text-ink/40 py-12 italic">Tiada rekod ditemui</td></tr>';
  } else {
    body.innerHTML = slice.map(log => {
      const m = getActionMeta(log.action);
      const dt = new Date(log.created_at);
      const dateStr = dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
      const timeStr = dt.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
      const detail = log.target || log.meta?.patient_name || log.meta?.item_name || '';
      const detailExtra = log.meta?.patient_id ? `ID: ${log.meta.patient_id}` : '';
      const status = getStatus(log);
      const statusBadge = status === 'success'
        ? '<span class="inline-flex items-center gap-1.5 text-xs text-green-dark font-medium px-2.5 py-1 rounded-full bg-green-light"><span class="w-1.5 h-1.5 rounded-full bg-green"></span>Berjaya</span>'
        : '<span class="inline-flex items-center gap-1.5 text-xs text-terracotta font-medium px-2.5 py-1 rounded-full bg-terracotta-light"><span class="w-1.5 h-1.5 rounded-full bg-terracotta"></span>Gagal</span>';
      // Resolve UUID target → human-readable nama
      const isUuid = log.target && UUID_RE.test(log.target);
      const resolved = _resolveMap[log.target];
      let displayDetail = log.meta?.patient_name || log.meta?.item_name || resolved;
      if (!displayDetail) {
        displayDetail = isUuid ? fallbackLabel(log.action, log.target) : detail;
      }
      const subDetail = isUuid ? `ID: ${log.target.slice(0,8)}…` : detailExtra;

      return `<tr class="row-log border-b border-ink/5 last:border-0">
        <td class="py-3 px-4 align-top">
          <div class="flex items-start gap-3">
            <div class="action-icon" style="background:${m.bg};color:${m.fg}"><span>${m.icon}</span></div>
            <div class="min-w-0">
              <div class="text-xs font-semibold text-ink">${dateStr}</div>
              <div class="text-[11px] text-ink/55">${timeStr}</div>
            </div>
          </div>
        </td>
        <td class="py-3 px-3 align-top">
          <div class="text-sm font-semibold text-ink">${escHtml(log.actor_name || 'Sistem')}</div>
          <div class="text-[11px] text-ink/55 capitalize">${escHtml(log.actor_role || '—')}</div>
        </td>
        <td class="py-3 px-3 align-top">
          <span class="module-pill" style="background:${m.mPill.bg};color:${m.mPill.fg}">${m.module}</span>
        </td>
        <td class="py-3 px-3 align-top text-sm text-ink/80">${m.verb}</td>
        <td class="py-3 px-3 align-top">
          <div class="text-sm text-ink">${escHtml(displayDetail) || '<span class="text-ink/30">—</span>'}</div>
          ${subDetail ? `<div class="text-[10px] text-ink/45 mt-0.5 font-mono">${escHtml(subDetail)}</div>` : ''}
        </td>
        <td class="py-3 px-3 align-top">${statusBadge}</td>
      </tr>`;
    }).join('');
  }

  renderPagination(list.length, totalPages);
}

function renderPagination(total, totalPages) {
  const host = document.getElementById('pagination');
  const start = total === 0 ? 0 : (currentPage - 1) * PAGE_SIZE + 1;
  const end = Math.min(currentPage * PAGE_SIZE, total);

  const maxBtn = 5;
  let pages = [];
  if (totalPages <= maxBtn + 2) {
    pages = Array.from({ length: totalPages }, (_, i) => i + 1);
  } else {
    pages = [1, 2, 3];
    if (currentPage > 4) pages.push('…');
    if (currentPage >= 4 && currentPage <= totalPages - 3) pages.push(currentPage);
    if (currentPage < totalPages - 3) pages.push('…');
    pages.push(totalPages);
  }
  const pagesHtml = pages.map(p => p === '…'
    ? '<span class="px-2 text-ink/30">…</span>'
    : `<button onclick="gotoPage(${p})" class="w-8 h-8 rounded-lg text-xs font-semibold ${p === currentPage ? 'text-white' : 'text-ink/60 hover:bg-cream'}" ${p === currentPage ? 'style="background-color:#7C3AED"' : ''}>${p}</button>`
  ).join('');

  host.innerHTML = `
    <span class="text-ink/55">Memaparkan ${start} hingga ${end} daripada ${total} rekod</span>
    <div class="flex items-center gap-1.5">
      <button onclick="gotoPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''} class="w-8 h-8 rounded-lg border border-ink/15 disabled:opacity-30 hover:bg-cream">‹</button>
      ${pagesHtml}
      <button onclick="gotoPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''} class="w-8 h-8 rounded-lg border border-ink/15 disabled:opacity-30 hover:bg-cream">›</button>
      <select class="ml-2 border border-ink/15 rounded-lg px-2 py-1 text-xs bg-white"><option>10 / page</option></select>
    </div>`;
}

function gotoPage(p) {
  if (p < 1) return;
  currentPage = p;
  renderTable();
}

// ── Stats ────────────────────────────────────────────
function renderStats() {
  const total = _allLogs.length;
  const success = _allLogs.filter(l => getStatus(l) === 'success').length;
  const fail = total - success;
  const today = new Date().toISOString().slice(0,10);
  const usersToday = new Set(_allLogs.filter(l => l.created_at && l.created_at.slice(0,10) === today).map(l => l.actor_id).filter(Boolean)).size;
  const pct = (n) => total ? `${((n/total)*100).toFixed(1)}% daripada jumlah` : '— daripada jumlah';
  document.getElementById('stat-total').textContent = total.toLocaleString();
  document.getElementById('stat-success').textContent = success.toLocaleString();
  document.getElementById('stat-success-pct').textContent = pct(success);
  document.getElementById('stat-fail').textContent = fail.toLocaleString();
  document.getElementById('stat-fail-pct').textContent = pct(fail);
  document.getElementById('stat-users').textContent = usersToday;
}

function populateFilters() {
  // Modules
  const modules = [...new Set(_allLogs.map(l => getActionMeta(l.action).module))].sort();
  const fMod = document.getElementById('f-module');
  fMod.innerHTML = '<option value="">Semua Modul</option>' +
    modules.map(m => `<option value="${escHtml(m)}">${escHtml(m)}</option>`).join('');

  // Actions
  const actions = [...new Set(_allLogs.map(l => l.action).filter(Boolean))].sort();
  const fAct = document.getElementById('f-action');
  fAct.innerHTML = '<option value="">Semua Tindakan</option>' +
    actions.map(a => `<option value="${escHtml(a)}">${escHtml(getActionMeta(a).verb)}</option>`).join('');

  // Users
  const users = {};
  _allLogs.forEach(l => { if (l.actor_id) users[l.actor_id] = l.actor_name || l.actor_id; });
  const fUsr = document.getElementById('f-user');
  fUsr.innerHTML = '<option value="">Semua Pengguna</option>' +
    Object.entries(users).sort((a,b) => (a[1]||'').localeCompare(b[1]||''))
      .map(([id, name]) => `<option value="${escHtml(id)}">${escHtml(name)}</option>`).join('');

  const today = new Date();
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  document.getElementById('f-daterange').value =
    `${monthStart.toLocaleDateString('en-GB')} - ${today.toLocaleDateString('en-GB')}`;
}

// ── Export CSV ───────────────────────────────────────
function exportCsv() {
  const rows = [['Masa & Tarikh','Pengguna','Peranan','Modul','Tindakan','Butiran','Status']];
  getFiltered().forEach(log => {
    const m = getActionMeta(log.action);
    const isUuid = log.target && UUID_RE.test(log.target);
    const resolved = _resolveMap[log.target];
    const detail = log.meta?.patient_name || log.meta?.item_name || resolved
      || (isUuid ? fallbackLabel(log.action, log.target) : log.target) || '';
    rows.push([
      new Date(log.created_at).toLocaleString('en-GB'),
      log.actor_name || 'Sistem',
      log.actor_role || '',
      m.module,
      m.verb,
      detail,
      getStatus(log) === 'success' ? 'Berjaya' : 'Gagal',
    ]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `audit_log_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// ── Init ─────────────────────────────────────────────
async function init() {
  const user = await initStaff('audit', 'Jejak aktiviti sistem');
  if (!user) return;

  const { data, error } = await window.db
    .from('psy_audit_log')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(2000);

  if (error) { banner('Ralat: ' + error.message, 'error'); return; }

  _allLogs = data || [];
  await resolveTargets();
  populateFilters();
  renderStats();
  renderTable();
}

init();
</script>
