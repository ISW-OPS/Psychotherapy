<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Sejarah Versi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.kb-card{background:#fff;border:1px solid rgba(60,79,92,.10);border-radius:1rem;}
.tl-dot{width:.7rem;height:.7rem;border-radius:9999px;flex-shrink:0;margin-top:.3rem;}
</style>
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📖</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
<div class="flex min-h-screen">
<aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
<main class="main-content flex-1 min-w-0">
<header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

<div class="p-4 md:p-8">
  <div class="flex items-center justify-between gap-3 mb-4">
    <div>
      <div class="text-xs text-ink/40 mb-1"><a href="kb-dashboard.html" class="hover:underline">Knowledge Hub</a> › <span class="text-navy font-semibold">Sejarah Versi</span></div>
      <h1 class="text-2xl font-bold text-ink">Sejarah Versi</h1>
      <p class="text-sm text-ink/55 mt-1">Jejak & bandingkan semua versi sumber ini.</p>
    </div>
    <a id="back-link" href="kb-resources.html" class="px-4 py-2.5 rounded-xl text-sm font-semibold border border-ink/15 text-ink/70 hover:bg-ink/5">‹ Kembali ke Sumber</a>
  </div>

  <div id="wrap"><div class="text-center text-xs text-ink/35 py-16">Memuatkan...</div></div>
</div>
</main>
</div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script src="_kb.js"></script>
<script>
let RES = null, VERS = [];

function render() {
  const r = RES, t = kbType(r.res_type);
  const canEdit = kbCanAuthor();
  document.getElementById('wrap').innerHTML = `
  <div class="kb-card p-5 mb-5 flex flex-col md:flex-row md:items-center gap-4 justify-between">
    <div class="flex items-center gap-3">
      <span class="text-3xl">${t.icon}</span>
      <div><div class="flex items-center gap-2"><h2 class="text-lg font-bold text-ink">${kbEsc(r.title)}</h2>
        <span class="chip bg-green-light text-green-dark text-[10px]">${kbEsc(r.version || 'v1.0')} Terkini</span></div>
        <div class="text-xs text-ink/50 mt-0.5">${t.ext} • ${kbFileSize(r.file_size)} • oleh ${kbEsc(r.uploader?.full_name || 'Staf')}</div></div>
    </div>
    <a href="kb-detail.html?id=${r.id}" class="text-sm text-navy font-semibold hover:underline whitespace-nowrap">Lihat Sumber →</a>
  </div>

  <div class="grid grid-cols-1 xl:grid-cols-[1fr_300px] gap-6 items-start">
    <div class="kb-card overflow-hidden">
      <div class="px-5 py-4 border-b border-ink/8"><h3 class="font-semibold text-ink">Semua Versi</h3></div>
      <div class="overflow-x-auto"><table class="w-full text-sm">
        <thead><tr class="text-left text-[11px] uppercase text-ink/50 border-b border-ink/10 bg-ink/[0.015]">
          <th class="px-4 py-3 font-semibold">Versi</th><th class="px-3 py-3 font-semibold">Oleh</th>
          <th class="px-3 py-3 font-semibold hidden md:table-cell">Tarikh</th>
          <th class="px-3 py-3 font-semibold hidden lg:table-cell">Ringkasan</th>
          <th class="px-3 py-3 font-semibold text-right">Tindakan</th></tr></thead>
        <tbody>${VERS.length ? VERS.map((v, i) => `
          <tr class="border-b border-ink/5 ${i === 0 ? 'bg-green-light/30' : ''}">
            <td class="px-4 py-3"><span class="font-bold text-ink">${kbEsc(v.version)}</span>${i === 0 ? ' <span class="chip bg-green-light text-green-dark text-[9px]">Terkini</span>' : ''}</td>
            <td class="px-3 py-3 text-ink/70">${kbEsc(v.uploader?.full_name || 'Staf')}</td>
            <td class="px-3 py-3 text-xs text-ink/55 hidden md:table-cell whitespace-nowrap">${formatDateTime(v.created_at)}</td>
            <td class="px-3 py-3 text-xs text-ink/60 hidden lg:table-cell">${kbEsc(v.changes_summary || '—')}</td>
            <td class="px-3 py-3 text-right whitespace-nowrap">
              ${v.file_url || v.external_url ? `<a href="${kbEsc(v.file_url || v.external_url)}" target="_blank" class="text-xs font-semibold text-navy hover:underline">Pratonton</a>` : ''}
              ${canEdit && i !== 0 ? `<button data-rbac="kb.edit" onclick="restore('${v.id}')" class="ml-2 text-xs font-semibold text-terracotta hover:underline">Pulih</button>` : ''}
            </td>
          </tr>`).join('') : `<tr><td colspan="5" class="text-center text-xs text-ink/35 py-8">Hanya satu versi.</td></tr>`}
        </tbody></table></div>
    </div>

    <div class="kb-card p-5">
      <h3 class="font-semibold text-sm text-ink mb-3">Garis Masa Versi</h3>
      <div class="space-y-4">
        ${(VERS.length ? VERS : [{ version: r.version, created_at: r.created_at, uploader: r.uploader }]).map((v, i) => `
          <div class="flex gap-3">
            <div class="tl-dot ${i === 0 ? 'bg-green' : 'bg-ink/25'}"></div>
            <div class="min-w-0"><div class="text-[13px] font-semibold text-ink">${kbEsc(v.version)}${i === 0 ? ' <span class="text-[9px] text-green-dark">(Terkini)</span>' : ''}</div>
            <div class="text-[11px] text-ink/50">${kbEsc(v.uploader?.full_name || 'Staf')}</div>
            <div class="text-[11px] text-ink/40">${formatDateTime(v.created_at)}</div></div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

window.restore = async function (verId) {
  const v = VERS.find(x => x.id === verId);
  if (!v || !confirm(`Pulihkan versi ${v.version}? Versi ini akan jadi versi semasa sumber.`)) return;
  try {
    await dbUpdate('psy_kb_resources', RES.id, {
      version: v.version, file_url: v.file_url, external_url: v.external_url, file_size: v.file_size,
    });
    await window.db.from('psy_kb_versions').update({ is_current: false }).eq('resource_id', RES.id);
    await dbUpdate('psy_kb_versions', verId, { is_current: true });
    banner('Versi dipulihkan.');
    setTimeout(() => location.reload(), 700);
  } catch (_) { banner('Gagal pulih', 'error'); }
};

async function boot() {
  const u = await initStaff('kb_version', 'Sejarah Versi', 'kb');
  if (!u) return;
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { document.getElementById('wrap').innerHTML = '<p class="text-center text-sm text-ink/50 py-10">Sumber tidak dijumpai.</p>'; return; }
  document.getElementById('back-link').href = 'kb-detail.html?id=' + id;

  const [{ data: r }, { data: vers }] = await Promise.all([
    window.db.from('psy_kb_resources').select('*, uploader:uploaded_by(full_name)').eq('id', id).single(),
    window.db.from('psy_kb_versions').select('*, uploader:uploaded_by(full_name)').eq('resource_id', id).order('created_at', { ascending: false }),
  ]);
  if (!r) { document.getElementById('wrap').innerHTML = '<p class="text-center text-sm text-ink/50 py-10">Sumber tidak dijumpai.</p>'; return; }
  RES = r; VERS = vers || [];
  render();
}
boot();
</script>
</body>
</html>
