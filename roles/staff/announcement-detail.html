<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Detail Pengumuman</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📢</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 max-w-2xl mx-auto space-y-4">

        <!-- Action bar -->
        <div class="flex items-center justify-between gap-3">
          <div id="view-status"></div>
          <!-- View mode buttons -->
          <div id="btn-bar-view" class="flex gap-2">
            <button id="btn-toggle-status" onclick="toggleStatus()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5"></button>
            <button onclick="enterEdit()" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark flex items-center gap-2">✏️ Edit Pengumuman</button>
          </div>
          <!-- Edit mode buttons -->
          <div id="btn-bar-edit" class="hidden flex gap-2">
            <button onclick="exitEdit()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5">Batal</button>
            <button id="btn-save" onclick="saveAnnouncement()" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark">Simpan</button>
          </div>
        </div>

        <!-- Announcement card -->
        <div id="view-card" class="bg-white rounded-2xl border border-ink/10 overflow-hidden">

          <!-- VIEW content -->
          <div id="view-content" class="p-6 space-y-5">

            <!-- Announcement preview as patients see it -->
            <div class="text-[10px] font-semibold text-ink/40 uppercase tracking-widest mb-2">Preview Pesakit</div>
            <div id="ann-preview" class="rounded-2xl overflow-hidden min-h-[130px] relative flex items-center">
              <!-- rendered by renderView() -->
            </div>

            <!-- Metadata -->
            <div class="border-t border-ink/10 pt-4 grid grid-cols-2 gap-x-6 gap-y-3 text-sm">
              <div>
                <div class="text-[10px] font-semibold text-ink/40 uppercase tracking-wide mb-0.5">Turutan</div>
                <div id="view-order" class="font-semibold"></div>
              </div>
              <div>
                <div class="text-[10px] font-semibold text-ink/40 uppercase tracking-wide mb-0.5">Tag</div>
                <div id="view-tag"></div>
              </div>
              <div>
                <div class="text-[10px] font-semibold text-ink/40 uppercase tracking-wide mb-0.5">Label Butang CTA</div>
                <div id="view-cta-label" class="font-medium"></div>
              </div>
              <div>
                <div class="text-[10px] font-semibold text-ink/40 uppercase tracking-wide mb-0.5">URL CTA</div>
                <div id="view-cta-url" class="font-medium text-navy break-all"></div>
              </div>
              <div class="col-span-2">
                <div class="text-[10px] font-semibold text-ink/40 uppercase tracking-wide mb-0.5">Status</div>
                <div id="view-active-meta"></div>
              </div>
            </div>
          </div>

        </div>

        <!-- EDIT content -->
        <div id="edit-content" class="hidden space-y-4">
          <input id="edit-id" type="hidden">

            <div>
              <label class="text-xs font-semibold text-ink/60">Tajuk <span class="text-terracotta">*</span></label>
              <input id="f-title" type="text" maxlength="100" placeholder="Cth: Promosi Pakej Bulan Ini"
                class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
            </div>

            <div>
              <label class="text-xs font-semibold text-ink/60">Badan Teks</label>
              <textarea id="f-body" rows="3" placeholder="Teks penerangan (optional)..."
                class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none resize-none"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold text-ink/60">Tag / Label</label>
                <input id="f-tag" type="text" placeholder="Cth: Promosi, Info, Baru"
                  class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/60">Turutan</label>
                <input id="f-order" type="number" value="0" min="0"
                  class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold text-ink/60">Label Butang CTA</label>
                <input id="f-cta-label" type="text" placeholder="Cth: Lihat Pakej →"
                  class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/60">URL CTA</label>
                <input id="f-cta-url" type="text" placeholder="pakej.html"
                  class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
              </div>
            </div>

            <!-- Banner Image -->
            <div>
              <label class="text-xs font-semibold text-ink/60 block mb-1.5">Gambar Banner <span class="text-ink/40 font-normal">(gantikan warna latar)</span></label>
              <div class="w-full h-40 rounded-xl border-2 border-dashed border-ink/20 bg-cream/50 overflow-hidden mb-2 cursor-pointer hover:border-navy transition-colors"
                id="ann-img-preview" onclick="document.getElementById('f-ann-image').click()" title="Klik untuk pilih gambar">
                <!-- image or placeholder rendered by enterEdit() -->
              </div>
              <input id="f-ann-image" type="file" accept="image/*" onchange="previewAnnImage(this)" class="hidden">
              <input id="f-ann-image-url" type="hidden">
              <div class="flex gap-2 flex-wrap">
                <button type="button" onclick="document.getElementById('f-ann-image').click()"
                  class="px-3 py-1.5 bg-ink/5 border border-ink/20 rounded-lg text-xs font-semibold hover:border-navy hover:text-navy transition-colors">
                  Pilih Gambar
                </button>
                <button type="button" id="btn-remove-img" onclick="removeAnnImage()"
                  class="hidden px-3 py-1.5 border border-terracotta/30 text-terracotta rounded-lg text-xs font-semibold hover:bg-terracotta hover:text-white transition-colors">
                  Buang Gambar
                </button>
              </div>
              <p class="text-[10px] text-ink/40 mt-1.5">JPG, PNG · maks 5MB · nisbah 16:9 disyorkan</p>
            </div>

            <!-- Warna Latar -->
            <div>
              <label class="text-xs font-semibold text-ink/60 mb-1.5 block">Warna Latar <span class="text-ink/40 font-normal">(digunakan jika tiada gambar)</span></label>
              <div class="grid grid-cols-3 gap-2">
                <label id="bg-opt-1" class="cursor-pointer" onclick="selectBg('from-navy to-green-dark')">
                  <input type="radio" name="bg" value="from-navy to-green-dark" class="sr-only">
                  <div class="h-9 rounded-lg bg-gradient-to-r from-navy to-green-dark flex items-center justify-center text-white text-[11px] font-semibold">Navy–Green</div>
                </label>
                <label id="bg-opt-2" class="cursor-pointer" onclick="selectBg('from-gold to-gold-dark')">
                  <input type="radio" name="bg" value="from-gold to-gold-dark" class="sr-only">
                  <div class="h-9 rounded-lg bg-gradient-to-r from-yellow-400 to-yellow-600 flex items-center justify-center text-white text-[11px] font-semibold">Gold</div>
                </label>
                <label id="bg-opt-3" class="cursor-pointer" onclick="selectBg('from-terracotta to-terracotta/80')">
                  <input type="radio" name="bg" value="from-terracotta to-terracotta/80" class="sr-only">
                  <div class="h-9 rounded-lg bg-gradient-to-r from-orange-600 to-orange-500 flex items-center justify-center text-white text-[11px] font-semibold">Terracotta</div>
                </label>
                <label id="bg-opt-4" class="cursor-pointer" onclick="selectBg('from-green to-green-dark')">
                  <input type="radio" name="bg" value="from-green to-green-dark" class="sr-only">
                  <div class="h-9 rounded-lg bg-gradient-to-r from-green-500 to-green-700 flex items-center justify-center text-white text-[11px] font-semibold">Green</div>
                </label>
                <label id="bg-opt-5" class="cursor-pointer" onclick="selectBg('from-teal to-navy')">
                  <input type="radio" name="bg" value="from-teal to-navy" class="sr-only">
                  <div class="h-9 rounded-lg bg-gradient-to-r from-teal-500 to-blue-800 flex items-center justify-center text-white text-[11px] font-semibold">Teal–Navy</div>
                </label>
                <label id="bg-opt-6" class="cursor-pointer" onclick="selectBg('from-slate-700 to-slate-900')">
                  <input type="radio" name="bg" value="from-slate-700 to-slate-900" class="sr-only">
                  <div class="h-9 rounded-lg bg-gradient-to-r from-slate-700 to-slate-900 flex items-center justify-center text-white text-[11px] font-semibold">Dark</div>
                </label>
              </div>
            </div>

          <div class="flex items-center gap-3 pt-1">
            <input id="f-active" type="checkbox" class="w-4 h-4 accent-navy">
            <label for="f-active" class="text-sm font-medium cursor-pointer">Aktifkan pengumuman ini</label>
          </div>

        </div>

      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let currentAnn = null;
let selectedBg  = 'from-navy to-green-dark';

// ── Gradient utility ──────────────────────────────
// Maps Tailwind gradient class string → inline CSS gradient for preview
const BG_GRADIENT_CSS = {
  'from-navy to-green-dark':        'linear-gradient(to right, #1a3a5c, #2d6a4f)',
  'from-gold to-gold-dark':         'linear-gradient(to right, #facc15, #ca8a04)',
  'from-terracotta to-terracotta/80': 'linear-gradient(to right, #c2410c, #ea580c)',
  'from-green to-green-dark':       'linear-gradient(to right, #22c55e, #15803d)',
  'from-teal to-navy':              'linear-gradient(to right, #14b8a6, #1e40af)',
  'from-slate-700 to-slate-900':    'linear-gradient(to right, #334155, #0f172a)',
};

function bgCss(val) {
  return BG_GRADIENT_CSS[val] || BG_GRADIENT_CSS['from-navy to-green-dark'];
}

// ── Bg selector ───────────────────────────────────
function selectBg(val) {
  selectedBg = val;
  document.querySelectorAll('[id^="bg-opt-"]').forEach(el => {
    const inner = el.querySelector('div');
    const radio = el.querySelector('input');
    inner.style.outline      = radio.value === val ? '2px solid #1a3a5c' : 'none';
    inner.style.outlineOffset = '2px';
  });
}

// ── View / Edit toggle ────────────────────────────
function enterEdit() {
  const a = currentAnn;
  document.getElementById('edit-id').value      = a.id;
  document.getElementById('f-title').value       = a.title       || '';
  document.getElementById('f-body').value        = a.body        || '';
  document.getElementById('f-tag').value         = a.tag         || '';
  document.getElementById('f-order').value       = a.sort_order  ?? 0;
  document.getElementById('f-cta-label').value   = a.cta_label   || '';
  document.getElementById('f-cta-url').value     = a.cta_url     || '';
  document.getElementById('f-active').checked    = !!a.is_active;
  document.getElementById('f-ann-image-url').value = a.image_url || '';
  document.getElementById('f-ann-image').value   = '';

  const prev = document.getElementById('ann-img-preview');
  if (a.image_url) {
    prev.innerHTML = `<img src="${a.image_url}" class="w-full h-full object-cover">`;
    document.getElementById('btn-remove-img').classList.remove('hidden');
  } else {
    prev.innerHTML = '<div class="w-full h-full flex items-center justify-center text-3xl text-ink/25">🖼</div>';
    document.getElementById('btn-remove-img').classList.add('hidden');
  }

  selectedBg = a.bg || 'from-navy to-green-dark';
  selectBg(selectedBg);

  document.getElementById('view-card').classList.add('hidden');
  document.getElementById('edit-content').classList.remove('hidden');
  document.getElementById('btn-bar-view').classList.add('hidden');
  document.getElementById('btn-bar-edit').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function exitEdit() {
  document.getElementById('edit-content').classList.add('hidden');
  document.getElementById('view-card').classList.remove('hidden');
  document.getElementById('btn-bar-edit').classList.add('hidden');
  document.getElementById('btn-bar-view').classList.remove('hidden');
}

// ── Render view ───────────────────────────────────
function renderView(a) {
  currentAnn = a;

  // Action bar status chip + toggle button
  document.getElementById('view-status').innerHTML = a.is_active
    ? '<span class="chip bg-green-light text-green-dark">✓ Aktif</span>'
    : '<span class="chip bg-ink/10 text-ink/60">Tidak Aktif</span>';

  const togBtn = document.getElementById('btn-toggle-status');
  if (a.is_active) {
    togBtn.textContent  = 'Nyahaktifkan';
    togBtn.className    = 'px-4 py-2 border rounded-lg text-sm font-semibold border-gold/40 text-gold-dark hover:bg-gold/10';
  } else {
    togBtn.textContent  = 'Aktifkan';
    togBtn.className    = 'px-4 py-2 border rounded-lg text-sm font-semibold border-green/40 text-green-dark hover:bg-green-light';
  }

  // Preview card
  const preview = document.getElementById('ann-preview');
  if (a.image_url) {
    preview.style.backgroundImage    = `url('${a.image_url}')`;
    preview.style.backgroundSize     = 'cover';
    preview.style.backgroundPosition = 'center';
    preview.style.background         = '';
    preview.innerHTML = `
      <div class="absolute inset-0" style="background:linear-gradient(to right,rgba(0,0,0,.65),rgba(0,0,0,.25))"></div>
      <div class="relative z-10 p-6 text-white flex items-center justify-between gap-4 flex-wrap w-full">
        <div>
          ${a.tag ? `<div class="text-[10px] font-semibold uppercase tracking-widest opacity-70 mb-1">${escHtml(a.tag)}</div>` : ''}
          <div class="text-lg font-bold leading-snug drop-shadow">${escHtml(a.title)}</div>
          ${a.body ? `<div class="text-sm opacity-85 mt-1 max-w-sm">${escHtml(a.body)}</div>` : ''}
        </div>
        ${a.cta_label && a.cta_url ? `<a href="${escAttr(a.cta_url)}" class="bg-white/20 hover:bg-white/30 text-white text-sm font-semibold px-4 py-2 rounded-lg whitespace-nowrap backdrop-blur-sm">${escHtml(a.cta_label)}</a>` : ''}
      </div>`;
    // set bg-image via style attribute directly
    preview.setAttribute('style',
      `background-image:url('${a.image_url}');background-size:cover;background-position:center;`);
  } else {
    preview.removeAttribute('style');
    preview.style.background = bgCss(a.bg || 'from-navy to-green-dark');
    preview.innerHTML = `
      <div class="relative z-10 p-6 text-white flex items-center justify-between gap-4 flex-wrap w-full">
        <div>
          ${a.tag ? `<div class="text-[10px] font-semibold uppercase tracking-widest opacity-70 mb-1">${escHtml(a.tag)}</div>` : ''}
          <div class="text-lg font-bold leading-snug drop-shadow">${escHtml(a.title)}</div>
          ${a.body ? `<div class="text-sm opacity-85 mt-1 max-w-sm">${escHtml(a.body)}</div>` : ''}
        </div>
        ${a.cta_label && a.cta_url ? `<a href="${escAttr(a.cta_url)}" class="bg-white/20 hover:bg-white/30 text-white text-sm font-semibold px-4 py-2 rounded-lg whitespace-nowrap backdrop-blur-sm">${escHtml(a.cta_label)}</a>` : ''}
      </div>`;
  }

  // Metadata
  document.getElementById('view-order').textContent     = a.sort_order ?? '—';
  document.getElementById('view-tag').innerHTML         = a.tag
    ? `<span class="chip bg-navy-light text-navy text-[10px]">${escHtml(a.tag)}</span>` : '—';
  document.getElementById('view-cta-label').textContent = a.cta_label || '—';
  document.getElementById('view-cta-url').textContent   = a.cta_url   || '—';
  document.getElementById('view-active-meta').innerHTML = a.is_active
    ? '<span class="chip bg-green-light text-green-dark">Aktif</span>'
    : '<span class="chip bg-ink/10 text-ink/60">Tidak Aktif</span>';
}

// ── Toggle active ─────────────────────────────────
async function toggleStatus() {
  if (!currentAnn) return;
  const newVal = !currentAnn.is_active;
  const { error } = await window.db.from('psy_announcements').update({ is_active: newVal }).eq('id', currentAnn.id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  currentAnn.is_active = newVal;
  renderView(currentAnn);
  banner(newVal ? 'Pengumuman diaktifkan' : 'Pengumuman dinyahaktifkan');
}

// ── Image helpers ─────────────────────────────────
function previewAnnImage(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { banner('Gambar melebihi 5MB', 'error'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('f-ann-image-url').value = e.target.result;
    document.getElementById('ann-img-preview').innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
    document.getElementById('btn-remove-img').classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

function removeAnnImage() {
  document.getElementById('f-ann-image-url').value = '';
  document.getElementById('f-ann-image').value     = '';
  document.getElementById('ann-img-preview').innerHTML = '<div class="w-full h-full flex items-center justify-center text-3xl text-ink/25">🖼</div>';
  document.getElementById('btn-remove-img').classList.add('hidden');
}

// ── Save ──────────────────────────────────────────
async function saveAnnouncement() {
  const editId = document.getElementById('edit-id').value;
  const title  = document.getElementById('f-title').value.trim();
  if (!title) { banner('Tajuk pengumuman wajib diisi', 'error'); return; }

  const payload = {
    title,
    body:        document.getElementById('f-body').value.trim()      || null,
    tag:         document.getElementById('f-tag').value.trim()       || null,
    sort_order:  parseInt(document.getElementById('f-order').value)  || 0,
    cta_label:   document.getElementById('f-cta-label').value.trim() || null,
    cta_url:     document.getElementById('f-cta-url').value.trim()   || null,
    bg:          selectedBg,
    image_url:   document.getElementById('f-ann-image-url').value    || null,
    is_active:   document.getElementById('f-active').checked,
    updated_at:  new Date().toISOString(),
  };

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    const { error } = await window.db.from('psy_announcements').update(payload).eq('id', editId);
    if (error) throw error;
    Object.assign(currentAnn, payload);
    banner('Pengumuman dikemaskini ✓');
    exitEdit();
    renderView(currentAnn);
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan';
  }
}

// ── Tiny HTML escape helpers ──────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return escHtml(s); }

// ── Bootstrap ─────────────────────────────────────
(async () => {
  const user = await initStaff('announcements', '');
  if (!user) return;
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { banner('ID tidak ditemui', 'error'); return; }
  setHeaderBack('announcements.html', 'Kembali ke Pengumuman');
  const { data: a } = await window.db.from('psy_announcements').select('*').eq('id', id).single();
  if (!a) { banner('Pengumuman tidak ditemui', 'error'); return; }
  setPageTitle(a.title, 'Detail pengumuman');
  renderView(a);
})();
</script>
</body>
</html>
