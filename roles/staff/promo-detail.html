<style>
.purple-btn { background: #6366f1; color: white; transition: background .15s; }
.purple-btn:hover { background: #4f46e5; }
.tab-btn { padding: .6rem .9rem; font-size: .85rem; font-weight: 600; color: rgba(15,23,42,.5); border-bottom: 2px solid transparent; }
.tab-btn.active { color: #4338ca; border-bottom-color: #6366f1; }
.bar { height: 6px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: #6366f1; }
.card { background: white; border: 1px solid rgba(15,23,42,.1); border-radius: 1rem; padding: 1.25rem; }
.kv { display: flex; justify-content: space-between; gap: .75rem; padding: .55rem 0; border-bottom: 1px solid rgba(15,23,42,.05); font-size: .85rem; }
.kv dt { color: rgba(15,23,42,.55); }
.kv dd { font-weight: 600; color: #0f172a; text-align: right; }
.donut { width: 150px; height: 150px; border-radius: 50%; position: relative; }
.donut::after { content: ''; position: absolute; inset: 30px; background: white; border-radius: 50%; }
</style>
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🏷️</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-5">
        <button type="button" onclick="history.back()" class="text-sm text-indigo-600 hover:underline">← Kembali ke Kod Promo</button>

        <div id="detail-error" class="hidden card text-center text-sm text-ink/50">Promosi tidak dijumpai.</div>

        <div id="detail-body" class="hidden space-y-5">
          <!-- Header -->
          <div class="flex justify-end gap-2">
            <div class="flex flex-wrap justify-end gap-2">
              <button data-rbac="products.edit" onclick="goEdit()" class="px-4 py-2 rounded-xl text-sm font-semibold border border-ink/15 hover:bg-ink/5">✏️ Edit</button>
              <button data-rbac="products.create" onclick="duplicate()" class="px-4 py-2 rounded-xl text-sm font-semibold border border-ink/15 hover:bg-ink/5">⧉ Duplikat</button>
              <button data-rbac="products.edit" onclick="deletePromo()" class="px-4 py-2 rounded-xl text-sm font-semibold border border-red-200 text-red-600 hover:bg-red-50">Padam</button>
              <button data-rbac="products.edit" onclick="toggleActive()" id="d-toggle" class="px-4 py-2 rounded-xl text-sm font-semibold border border-ink/15 hover:bg-ink/5">Nyahaktif</button>
            </div>
          </div>
          <div class="card flex items-start justify-between gap-5 flex-wrap">
            <div class="flex items-start gap-4 flex-1 min-w-0">
            <div class="w-20 h-20 rounded-2xl bg-pink-50 p-2 shrink-0"><svg viewBox="0 0 64 64" class="w-full h-full" aria-hidden="true"><rect x="10" y="26" width="44" height="30" rx="3" fill="#c084fc"/><rect x="8" y="18" width="48" height="10" rx="3" fill="#a855f7"/><rect x="29" y="18" width="6" height="38" fill="#fbcfe8"/><path d="M32 18 C24 6 14 10 20 18 Z M32 18 C40 6 50 10 44 18 Z" fill="#f472b6"/></svg></div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-3 flex-wrap">
                <h1 id="d-code" class="text-2xl font-bold text-ink"></h1>
                <span id="d-status"></span>
              </div>
              <div id="d-name" class="text-sm text-ink/60 mt-1"></div>
              <div id="d-wallet-count" class="text-xs text-indigo-600 font-semibold mt-1"></div>
              <div id="d-chips" class="flex flex-wrap gap-2 mt-3"></div>
            </div>
            </div>
            <div class="rounded-xl bg-gradient-to-br from-pink-50 to-white border border-pink-100 p-5 w-full md:w-[380px] shrink-0">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 shrink-0"><svg viewBox="0 0 64 64" class="w-full h-full" aria-hidden="true"><rect x="10" y="26" width="44" height="30" rx="3" fill="#c084fc"/><rect x="8" y="18" width="48" height="10" rx="3" fill="#a855f7"/><rect x="29" y="18" width="6" height="38" fill="#fbcfe8"/><path d="M32 18 C24 6 14 10 20 18 Z M32 18 C40 6 50 10 44 18 Z" fill="#f472b6"/></svg></div>
                <div id="dp-big" class="text-xl font-bold text-pink-600">—</div>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-pink-500 text-white">BARU</span>
              </div>
              <div id="dp-for" class="text-xs text-ink/70 mt-0.5"></div>
              <div class="mt-2 inline-block bg-white rounded-lg px-2.5 py-1 text-xs">Guna kod <b id="dp-code">—</b></div>
              <div id="dp-min" class="text-[11px] text-ink/60 mt-2"></div>
              <div id="dp-valid" class="text-[11px] text-ink/60"></div>
            </div>
            
          </div>

          <div class="grid grid-cols-1 xl:grid-cols-3 gap-5">
            <div id="main-col" class="xl:col-span-3 space-y-5">
              <!-- Tab -->
              <div class="card !p-0">
                <div id="detail-tabs" class="flex gap-1 px-4 border-b border-ink/8 overflow-x-auto"></div>
              </div>
              <div id="tab-content" class="space-y-5"></div>
            </div>

            
          </div>
        </div>
      </div>
    </main>
  </div>

<!-- Panel butiran penggunaan (slide-in) -->

  <div class="absolute inset-0 bg-black/30" onclick="closeRedPanel()"></div>
  <aside class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-xl overflow-y-auto p-6 space-y-4">

      <h3 class="font-bold text-lg text-ink">Butiran Penggunaan</h3>
      <button onclick="closeRedPanel()" class="text-ink/50 text-xl">×</button>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
if (typeof window.iswL !== "function") window.iswL = function (ms) { return ms; };

function waitI18n() {
  return new Promise(res => {
    if (window.__iswI18n) return res();
    let done = false;
    const fin = () => { if (!done) { done = true; res(); } };
    document.addEventListener('isw:langchange', fin, { once: true });
    setTimeout(fin, 1500);
  });
}
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtRM(n) { return 'RM ' + Number(n||0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDay(d) { return d ? new Date(d + 'T00:00:00').toLocaleDateString('ms-MY', { day: '2-digit', month: 'short', year: 'numeric' }) : '—'; }
function fmtDT(d) { return d ? new Date(d).toLocaleString('ms-MY', { dateStyle: 'medium', timeStyle: 'short' }) : '—'; }
function todayStr() { return new Date().toISOString().slice(0, 10); }

const promoId = new URLSearchParams(location.search).get('id');
let promo = null;
let redemptions = [];      // { id, created_at, discount_amount, patient, receipt_ref, pay_status, subtotal, total, method, lines[] }
let activeTab = 'overview';
const PALETTE = ['#6366f1', '#22c55e', '#f59e0b', '#ec4899', '#0ea5e9', '#a855f7'];

function promoStatus(p) {
  const today = todayStr();
  if (!p.is_active) return 'inactive';
  if (p.valid_from && p.valid_from > today) return 'scheduled';
  if (p.valid_until && p.valid_until < today) return 'expired';
  if (p.max_uses != null && (p.used_count || 0) >= p.max_uses) return 'fullyused';
  return 'active';
}
const STATUS_META = {
  active:    { label: () => iswL('Aktif', 'Active'),          cls: 'bg-emerald-50 text-emerald-700' },
  scheduled: { label: () => iswL('Dijadualkan', 'Scheduled'), cls: 'bg-sky-50 text-sky-700' },
  inactive:  { label: () => iswL('Tidak Aktif', 'Inactive'),  cls: 'bg-ink/8 text-ink/55' },
  expired:   { label: () => iswL('Luput', 'Expired'),         cls: 'bg-red-50 text-red-600' },
  fullyused: { label: () => iswL('Habis Guna', 'Fully Used'), cls: 'bg-amber-50 text-amber-700' },
};

function goEdit() { location.href = `promo-form.html?id=${promoId}`; }

function applies() {
  return { all: iswL('Semua produk', 'All products'), product: iswL('Produk tertentu', 'Selected products'), category: iswL('Kategori tertentu', 'Selected categories'), package: iswL('Pakej tertentu', 'Selected packages') }[promo.applies_to || 'all'];
}
function eligKey() { return promo.customer_eligibility || (promo.new_customer_only ? 'new' : 'all'); }
function eligLabel() {
  return { all: iswL('Semua pesakit', 'All patients'), new: iswL('Pesakit baharu sahaja', 'New patients only'), existing: iswL('Pesakit sedia ada sahaja', 'Existing patients only'), selected: `${(promo.selected_patient_ids || []).length} ${iswL('pesakit tertentu', 'selected patients')}` }[eligKey()];
}
function discountLabel() {
  return promo.discount_type === 'percent' ? `${Number(promo.discount_value)}% OFF` : `${fmtRM(promo.discount_value)} OFF`;
}

async function loadPromo() {
  if (!promoId) return showError();
  const { data, error } = await window.db.from('psy_promo_codes').select('*').eq('id', promoId).maybeSingle();
  if (error || !data) return showError();
  promo = data;
  const st = promoStatus(promo);
  const m = STATUS_META[st];
  document.getElementById('d-code').textContent = promo.code;
  document.getElementById('d-name').textContent = promo.name || promo.description || '';
  document.getElementById('d-status').innerHTML = `<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${m.cls}">● ${m.label()}</span>`;
  document.getElementById('dp-big').textContent = discountLabel();
  document.getElementById('dp-for').textContent = eligLabel();
  document.getElementById('dp-code').textContent = promo.code;
  document.getElementById('dp-min').textContent = promo.min_subtotal > 0 ? `${iswL('Min. belanja', 'Min. spend')} ${fmtRM(promo.min_subtotal)}` : iswL('Tiada min. belanja', 'No min. spend');
  document.getElementById('dp-valid').textContent = (promo.valid_from || promo.valid_until) ? `${iswL('Sah', 'Valid')} ${fmtDay(promo.valid_from)} ${iswL('hingga', 'until')} ${fmtDay(promo.valid_until)}` : iswL('Tiada tempoh', 'No period');
  document.getElementById('d-toggle').textContent = promo.is_active ? iswL('Nyahaktif', 'Deactivate') : iswL('Aktifkan', 'Activate');
  if (promo.promotion_type === 'voucher') loadWalletCount();
  document.getElementById('d-chips').innerHTML = [
    `<span class="chip-s">${promo.promotion_type === 'voucher' ? iswL('Voucher', 'Voucher') : iswL('Kod Promo', 'Promo Code')}</span>`,
    `<span class="chip-s">${discountLabel()}</span>`,
    `<span class="chip-s">${applies()}</span>`,
    `<span class="chip-s">${fmtDay(promo.valid_from)} – ${fmtDay(promo.valid_until)}</span>`,
  ].join('');
  document.querySelectorAll('.chip-s').forEach(c => c.className = 'chip-s inline-block text-xs bg-ink/[0.04] border border-ink/10 rounded-lg px-2.5 py-1 text-ink/70');

  const used = promo.used_count || 0;

  document.getElementById('detail-body').classList.remove('hidden');
  document.getElementById('app-loading').classList.add('hidden');
  await loadRedemptions();
  renderTab();
}

function showError() {
  document.getElementById('app-loading').classList.add('hidden');
  document.getElementById('detail-error').classList.remove('hidden');
}

// Muat penggunaan + pesanan + kategori produk untuk carta & jadual
async function loadRedemptions() {
  const { data, error } = await window.db.from('psy_promo_redemptions')
    .select('id, discount_amount, created_at, psy_patients(full_name, mrn), psy_payments(receipt_ref, status, subtotal, total, payment_method, intent)')
    .eq('promo_id', promoId).order('created_at', { ascending: false }).limit(500);
  if (error) { banner(iswL('Gagal muat penggunaan: ', 'Failed to load redemptions: ') + error.message, 'error'); return; }
  const rows = data || [];
  const productIds = new Set();
  rows.forEach(r => (linesOf(r.psy_payments?.intent)).forEach(l => l.id && productIds.add(String(l.id))));
  const catMap = new Map();
  if (productIds.size) {
    const { data: prods } = await window.db.from('psy_products').select('product_id, name, category').in('product_id', [...productIds]);
    (prods || []).forEach(p => catMap.set(p.product_id, p));
  }
  redemptions = rows.map(r => {
    const lines = linesOf(r.psy_payments?.intent).map(l => ({ ...l, name: catMap.get(String(l.id))?.name || l.name || l.id, category: catMap.get(String(l.id))?.category || iswL('Lain-lain', 'Others') }));
    return {
      id: r.id, created_at: r.created_at, discount: Number(r.discount_amount || 0),
      patient: r.psy_patients?.full_name || '—', mrn: r.psy_patients?.mrn || '',
      receipt: r.psy_payments?.receipt_ref || '—', pay_status: r.psy_payments?.status || '—',
      subtotal: Number(r.psy_payments?.subtotal || 0), total: Number(r.psy_payments?.total || 0),
      method: r.psy_payments?.payment_method || '—', lines,
    };
  });
}

function linesOf(intent) {
  const items = Array.isArray(intent?.items) ? intent.items : [];
  return items.filter(i => i.type === 'shop_order' && Array.isArray(i.items)).flatMap(i => i.items.map(l => ({ id: l.id, qty: Number(l.qty || 1), price: Number(l.price || 0), name: l.name })));
}


function renderTabBar() {
  const items = [
    ['overview', iswL('Ikhtisar', 'Overview')],
    ['rules', iswL('Peraturan & Syarat', 'Rules & Conditions')],
    ['redemptions', iswL('Penggunaan', 'Redemptions')],
    ['activity', iswL('Log Aktiviti', 'Activity Log')],
  ];
  document.getElementById('detail-tabs').innerHTML = items.map(([k, label]) =>
    '<button class="tab-btn' + (activeTab === k ? ' active' : '') + '" data-tab="' + k + '" onclick="setTab(\'' + k + '\')">' + label + '</button>'
  ).join('');
}

function setTab(t) {
  activeTab = t;
  renderTabBar();
  renderTab();
}

function renderTab() {
  const box = document.getElementById('tab-content');
  if (activeTab === 'overview') return renderOverview(box);
  if (activeTab === 'rules') return renderRules(box);
  if (activeTab === 'redemptions') return renderRedemptions(box);
  if (activeTab === 'activity') return renderActivity(box);
}

// ── Ikhtisar ──
function renderOverview(box) {
  const total = redemptions.reduce((s, r) => s + r.discount, 0);
  const orders = redemptions.length;
  const avg = orders ? total / orders : 0;
  const used = promo.used_count || 0;
  const pct = promo.max_uses ? Math.min(100, Math.round(used / promo.max_uses * 100)) : 0;

  // Carta harian (30 hari terakhir)
  const days = {};
  redemptions.forEach(r => { const d = (r.created_at || '').slice(0, 10); days[d] = (days[d] || 0) + 1; });
  const dayKeys = Object.keys(days).sort();
  const maxDay = Math.max(1, ...Object.values(days));

  // Kategori
  const catTotals = {};
  redemptions.forEach(r => r.lines.forEach(l => { catTotals[l.category] = (catTotals[l.category] || 0) + l.qty; }));
  const catEntries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
  const catSum = catEntries.reduce((s, [, v]) => s + v, 0) || 1;
  let acc = 0;
  const conic = catEntries.length
    ? catEntries.map(([, v], i) => { const from = acc / catSum * 360; acc += v; return `${PALETTE[i % PALETTE.length]} ${from}deg ${acc / catSum * 360}deg`; }).join(', ')
    : '#e2e8f0 0deg 360deg';

  box.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="card"><div class="text-[11px] font-semibold text-ink/45 uppercase">${iswL('Jumlah Penggunaan', 'Total Redemptions')}</div>
        <div class="text-2xl font-bold text-ink mt-1">${used}${promo.max_uses ? ` / ${promo.max_uses}` : ''}</div>
        ${promo.max_uses ? `<div class="bar mt-2"><span style="width:${pct}%"></span></div><div class="text-[11px] text-ink/50 mt-1">${pct}% ${iswL('digunakan', 'used')}</div>` : ''}</div>
      <div class="card"><div class="text-[11px] font-semibold text-ink/45 uppercase">${iswL('Jumlah Diskaun Diberi', 'Total Discount Given')}</div><div class="text-2xl font-bold text-red-600 mt-1">${fmtRM(total)}</div></div>
      <div class="card"><div class="text-[11px] font-semibold text-ink/45 uppercase">${iswL('Jumlah Pesanan', 'Total Orders')}</div><div class="text-2xl font-bold text-ink mt-1">${orders}</div></div>
      <div class="card"><div class="text-[11px] font-semibold text-ink/45 uppercase">${iswL('Purata Diskaun / Pesanan', 'Average Discount per Order')}</div><div class="text-2xl font-bold text-ink mt-1">${fmtRM(avg)}</div></div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-5">
      <div class="card lg:col-span-3">
        <h3 class="font-bold text-ink mb-3">${iswL('Penggunaan Mengikut Hari', 'Redemptions Over Time')}</h3>
        ${dayKeys.length ? `<div class="flex items-end gap-1.5 h-40">${dayKeys.map(d => `<div class="flex-1 flex flex-col items-center justify-end h-full"><div title="${d}: ${days[d]}" class="w-full bg-indigo-500 rounded-t" style="height:${Math.max(6, days[d] / maxDay * 100)}%"></div><div class="text-[9px] text-ink/45 mt-1">${d.slice(8)}</div></div>`).join('')}</div>`
          : `<p class="text-sm text-ink/40 py-10 text-center">${iswL('Belum ada data penggunaan', 'No redemption data yet')}</p>`}
      </div>
      <div class="card lg:col-span-2">
        <h3 class="font-bold text-ink mb-3">${iswL('Penggunaan Mengikut Kategori Produk', 'Redemptions by Product Category')}</h3>
        ${catEntries.length ? `<div class="flex items-center gap-5">
          <div class="donut" style="background: conic-gradient(${conic});"><div class="absolute inset-0 z-10 flex flex-col items-center justify-center"><div class="text-2xl font-bold text-ink">${redemptions.length}</div><div class="text-[11px] text-ink/50">${iswL('Pesanan', 'Orders')}</div></div></div>
          <ul class="text-xs space-y-1.5">${catEntries.map(([c, v], i) => `<li class="flex items-center gap-2"><span class="inline-block w-2.5 h-2.5 rounded-full" style="background:${PALETTE[i % PALETTE.length]}"></span>${escHtml(c)} <span class="text-ink/45">${Math.round(v / catSum * 100)}% (${v})</span></li>`).join('')}</ul>
        </div>` : `<p class="text-sm text-ink/40 py-10 text-center">${iswL('Tiada data kategori', 'No category data')}</p>`}
      </div>
    </div>

    <div class="card">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-ink">${iswL('Penggunaan Terkini', 'Recent Redemptions')}</h3>
        <button onclick="setTab('redemptions')" class="text-xs text-indigo-600 hover:underline">${iswL('Lihat semua', 'View All')}</button>
      </div>
      ${tableRedemptions(redemptions.slice(0, 5))}
    </div>`;
}

function tableRedemptions(rows) {
  if (!rows.length) return `<p class="text-sm text-ink/40 py-6 text-center">${iswL('Tiada penggunaan', 'No redemptions')}</p>`;
  return `<div class="overflow-x-auto"><table class="w-full text-sm">
    <thead><tr class="border-b border-ink/8 text-left text-[10px] font-bold text-ink/45 uppercase">
      <th class="py-2 pr-3">No.</th><th class="py-2 pr-3">${iswL('Tarikh & Masa', 'Date & Time')}</th><th class="py-2 pr-3">${iswL('Pesakit', 'Patient')}</th><th class="py-2 pr-3">${iswL('No. Pesanan', 'Order No.')}</th><th class="py-2 pr-3">${iswL('Item', 'Items')}</th><th class="py-2 pr-3">${iswL('Jumlah Asal', 'Order Amount')}</th><th class="py-2 pr-3">${iswL('Diskaun', 'Discount')}</th><th class="py-2 pr-3">${iswL('Jumlah Akhir', 'Final Amount')}</th><th class="py-2"></th></tr></thead>
    <tbody class="divide-y divide-ink/5">${rows.map((r, i) => `<tr class="hover:bg-ink/[0.02]">
      <td class="py-2.5 pr-3 text-xs text-ink/50">${i + 1}</td>
      <td class="py-2.5 pr-3 text-xs">${fmtDT(r.created_at)}</td>
      <td class="py-2.5 pr-3">${escHtml(r.patient)} <span class="text-xs text-ink/40">${escHtml(r.mrn)}</span></td>
      <td class="py-2.5 pr-3 font-mono text-xs text-indigo-600">${escHtml(r.receipt)}</td>
      <td class="py-2.5 pr-3 text-xs max-w-[200px] truncate">${r.lines.length ? r.lines.map(l => `${escHtml(l.name)} x${l.qty}`).join(', ') : '—'}</td>
      <td class="py-2.5 pr-3">${fmtRM(r.subtotal)}</td>
      <td class="py-2.5 pr-3 text-red-600">-${fmtRM(r.discount)}</td>
      <td class="py-2.5 pr-3">${fmtRM(r.total)}</td>
      <td class="py-2.5 text-right"><button onclick="openRed('${r.id}')" class="px-2.5 py-1 border border-ink/15 rounded-lg text-xs hover:bg-ink/5">${iswL('Lihat', 'View')}</button></td>
    </tr>`).join('')}</tbody></table></div>`;
}

// ── Peraturan & Syarat ──
function renderRules(box) {
  const p = promo;
  const m = STATUS_META[promoStatus(p)];
  const used = p.used_count || 0;
  const remaining = p.max_uses != null ? Math.max(0, p.max_uses - used) : null;
  const section = (title, body) => '<div class="py-4 border-b border-ink/8 last:border-0"><div class="font-bold text-ink mb-1">' + title + '</div>' + body + '</div>';
  const kv = (k, v) => '<div class="flex justify-between gap-3 py-1.5 text-sm"><span class="text-ink/55">' + k + '</span><span class="font-semibold text-ink text-right">' + escHtml(String(v)) + '</span></div>';
  const applyBody = '<div class="text-sm text-ink/70">' + applies() + '</div>'
    + (p.applies_to && p.applies_to !== 'all' ? '<div id="items-list" class="mt-2 text-sm text-ink/50">' + iswL('Memuatkan…', 'Loading…') + '</div>' : '');
  const usageBody = kv(iswL('Had keseluruhan', 'Total limit'), p.max_uses ?? iswL('Tiada had', 'No limit'))
    + kv(iswL('Digunakan', 'Used'), used)
    + (remaining != null ? kv(iswL('Berbaki', 'Remaining'), remaining) : '')
    + kv(iswL('Had setiap pesakit', 'Limit per patient'), p.max_uses_per_patient ?? iswL('Tiada had', 'No limit'));

  box.innerHTML = '<div class="card">'
    + section(iswL('Status', 'Status'), '<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold ' + m.cls + '">● ' + m.label() + '</span>')
    + section(iswL('Tempoh Sah', 'Validity Period'), '<div class="text-sm text-ink/70">' + fmtDay(p.valid_from) + ' – ' + fmtDay(p.valid_until) + '</div>')
    + section(iswL('Had Penggunaan', 'Usage Limits'), usageBody)
    + section(iswL('Pelanggan Layak', 'Customer Eligibility'), '<div class="text-sm text-ink/70">' + eligLabel() + '</div>')
    + section(iswL('Terpakai Untuk', 'Applicable To'), applyBody)
    + section(iswL('Min. Belanja', 'Min. Spend'), '<div class="text-sm text-ink/70">' + fmtRM(p.min_subtotal) + '</div>')
    + section(iswL('Boleh Gabung', 'Can Combine'), p.stackable
        ? '<span class="text-xs font-semibold px-2 py-0.5 rounded bg-emerald-50 text-emerald-700">' + iswL('Ya', 'Yes') + '</span>'
        : '<span class="text-xs font-semibold px-2 py-0.5 rounded bg-amber-50 text-amber-700">' + iswL('Tidak', 'No') + '</span> <span class="text-xs text-ink/50">' + iswL('Hanya satu promosi atau baucar setiap pesanan', 'Only one promotion or voucher per order') + '</span>')
    + section(iswL('Diskaun & Kempen', 'Discount & Campaign'),
        kv(iswL('Jenis', 'Type'), p.discount_type === 'percent' ? iswL('Peratus (%)', 'Percentage (%)') : iswL('Tetap (RM)', 'Fixed Amount (RM)'))
        + kv(iswL('Nilai Diskaun', 'Discount Value'), discountLabel())
        + kv(iswL('Kempen', 'Campaign'), p.campaign || '—'))
    + '</div>';
  if (p.applies_to && p.applies_to !== 'all') loadItems();
}

async function loadItems() {
  const vals = promo.applies_to_values || [];
  let names = vals;
  if (promo.applies_to === 'product') {
    const { data } = await window.db.from('psy_products').select('product_id, name').in('product_id', vals);
    names = (data || []).map(x => x.name);
  } else if (promo.applies_to === 'package') {
    const { data } = await window.db.from('psy_packages').select('package_id, name').in('package_id', vals);
    names = (data || []).map(x => x.name);
  }
  const el = document.getElementById('items-list');
  if (el) el.innerHTML = `<ul class="space-y-1.5">${names.map(n => `<li class="bg-ink/[0.03] rounded-lg px-3 py-2 text-ink">${escHtml(n)}</li>`).join('')}</ul>`;
}

// ── Penggunaan (jadual + panel) ──
let redSearch = '';
function renderRedemptions(box) {
  box.innerHTML = `<div class="card space-y-3">
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <input id="rs" type="text" value="${escHtml(redSearch)}" oninput="redSearch=this.value; renderRedemptionTable()" placeholder="${iswL('Cari pesakit, MRN atau no. resit…', 'Search patient, MRN or receipt no…')}" class="flex-1 min-w-[220px] border border-ink/15 rounded-lg px-3 py-2 text-sm">
      <button onclick="exportCsv()" class="px-4 py-2 rounded-xl text-sm font-semibold border border-ink/15 hover:bg-ink/5">⬇ ${iswL('Eksport', 'Export')}</button>
    </div>
    <div id="red-table"></div>
  </div>`;
  renderRedemptionTable();
}

function renderRedemptionTable() {
  const q = redSearch.trim().toLowerCase();
  const rows = redemptions.filter(r => !q || `${r.patient} ${r.mrn} ${r.receipt}`.toLowerCase().includes(q));
  const el = document.getElementById('red-table');
  if (el) el.innerHTML = tableRedemptions(rows);
}

function openRed(id) {
  const r = redemptions.find(x => x.id === id);
  if (!r) return;
  const lines = r.lines.map(l => `<div class="flex justify-between text-sm py-1"><span>${escHtml(l.name)} × ${l.qty}</span><span>${fmtRM(l.price * l.qty)}</span></div>`).join('') || `<p class="text-ink/40">${iswL('Tiada item', 'No items')}</p>`;
  document.getElementById('red-panel-body').innerHTML = `
    <div class="kv"><dt>${iswL('No. Resit', 'Receipt No.')}</dt><dd class="font-mono">${escHtml(r.receipt)}</dd></div>
    <div class="kv"><dt>${iswL('Tarikh', 'Date')}</dt><dd>${fmtDT(r.created_at)}</dd></div>
    <div class="kv"><dt>${iswL('Pesakit', 'Patient')}</dt><dd>${escHtml(r.patient)} <span class="text-xs text-ink/40">${escHtml(r.mrn)}</span></dd></div>
    <div><div class="font-semibold text-ink mb-1">${iswL('Item', 'Items')}</div>${lines}</div>
    <div class="kv"><dt>${iswL('Jumlah Asal', 'Subtotal')}</dt><dd>${fmtRM(r.subtotal)}</dd></div>
    <div class="kv"><dt>${iswL('Diskaun', 'Discount')} (${escHtml(promo.code)})</dt><dd class="text-red-600">-${fmtRM(r.discount)}</dd></div>
    <div class="kv"><dt>${iswL('Jumlah Akhir', 'Final Amount')}</dt><dd>${fmtRM(r.total)}</dd></div>
    <div class="kv"><dt>${iswL('Kaedah Bayaran', 'Payment Method')}</dt><dd>${escHtml(r.method)}</dd></div>
    <div class="kv"><dt>${iswL('Status Bayaran', 'Payment Status')}</dt><dd>${escHtml(r.pay_status)}</dd></div>`;
  document.getElementById('red-panel').classList.remove('hidden');
}
function closeRedPanel() { document.getElementById('red-panel').classList.add('hidden'); }

function exportCsv() {
  const q = redSearch.trim().toLowerCase();
  const rows = redemptions.filter(r => !q || `${r.patient} ${r.mrn} ${r.receipt}`.toLowerCase().includes(q));
  if (!rows.length) { banner(iswL('Tiada data untuk dieksport', 'No data to export'), 'error'); return; }
  const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [['Tarikh', 'Pesakit', 'MRN', 'No Resit', 'Jumlah Asal', 'Diskaun', 'Akhir', 'Status Bayaran'].join(',')]
    .concat(rows.map(r => [r.created_at, r.patient, r.mrn, r.receipt, r.subtotal.toFixed(2), r.discount.toFixed(2), r.total.toFixed(2), r.pay_status].map(esc).join(',')));
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `penggunaan-${promo.code}-${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Log Aktiviti ──
async function renderActivity(box) {
  box.innerHTML = `<div class="card"><p class="text-sm text-ink/40">${iswL('Memuatkan…', 'Loading…')}</p></div>`;
  const { data } = await window.db.from('psy_audit_log').select('action, actor_name, created_at').eq('target', promoId).like('action', 'promo.%').order('created_at', { ascending: false }).limit(100);
  const LABEL = { 'promo.create': iswL('Dicipta', 'Created'), 'promo.update': iswL('Dikemaskini', 'Updated'), 'promo.activate': iswL('Diaktifkan', 'Activated'), 'promo.deactivate': iswL('Dinyahaktifkan', 'Deactivated'), 'promo.duplicate': iswL('Diduplikat', 'Duplicated') };
  const rows = data || [];
  box.innerHTML = `<div class="card">${rows.length ? `<ul class="space-y-2">${rows.map(r => `<li class="flex justify-between gap-4 text-sm border-b border-ink/5 pb-2">
    <span><b>${LABEL[r.action] || escHtml(r.action)}</b> <span class="text-ink/50">${iswL('oleh', 'by')} ${escHtml(r.actor_name || '—')}</span></span>
    <span class="text-xs text-ink/45 whitespace-nowrap">${fmtDT(r.created_at)}</span></li>`).join('')}</ul>` : `<p class="text-sm text-ink/40 py-6 text-center">${iswL('Tiada log aktiviti', 'No activity log')}</p>`}</div>`;
}

// ── Tindakan ──
// Voucher: dihantar AUTOMATIK oleh trigger DB bila promosi Aktif (tiada butang manual).
// Ini cuma baca jumlah yang dah sampai, utk makluman staff — bukan punca ganjaran sebenar.
async function loadWalletCount() {
  const { count } = await window.db.from('psy_promo_claims').select('id', { count: 'exact', head: true }).eq('promo_id', promoId);
  const el = document.getElementById('d-wallet-count');
  if (el) el.textContent = iswL(`Dihantar ke ${count || 0} pesakit`, `Sent to ${count || 0} patients`);
}

async function toggleActive() {
  const next = !promo.is_active;
  const { error } = await window.db.from('psy_promo_codes').update({ is_active: next, updated_at: new Date().toISOString() }).eq('id', promoId);
  if (error) return banner(iswL('Ralat: ', 'Error: ') + error.message, 'error');
  if (typeof auditLog === 'function') await auditLog(next ? 'promo.activate' : 'promo.deactivate', promoId, { code: promo.code });
  banner(next ? iswL('Promosi diaktifkan ✅', 'Promotion activated ✅') : iswL('Promosi dinyahaktifkan ⛔', 'Promotion deactivated ⛔'));
  location.reload();
}

// Padam hanya dibenarkan jika kod belum pernah digunakan (elak rekod penggunaan terpadam sekali)
async function deletePromo() {
  const { count } = await window.db.from('psy_promo_redemptions').select('id', { count: 'exact', head: true }).eq('promo_id', promoId);
  if ((count || 0) > 0 || (promo.used_count || 0) > 0) {
    banner(iswL('Tidak boleh dipadam: kod ini sudah digunakan. Nyahaktifkan sahaja.', 'Cannot delete: this code has been used. Deactivate it instead.'), 'error');
    return;
  }
  if (!confirm(iswL('Padam kod promo ini? Tindakan ini tidak boleh dibatalkan.', 'Delete this promo code? This action cannot be undone.'))) return;
  const code = promo.code;
  const { error } = await window.db.from('psy_promo_codes').delete().eq('id', promoId);
  if (error) return banner(iswL('Ralat: ', 'Error: ') + error.message, 'error');
  if (typeof auditLog === 'function') await auditLog('promo.delete', promoId, { code });
  banner(iswL('Promosi dipadam ✅', 'Promotion deleted ✅'));
  location.href = 'promo-codes.html';
}

async function duplicate() {
  const suffix = Math.random().toString(36).slice(2, 5).toUpperCase();
  const uid = (await window.db.auth.getUser()).data.user?.id || null;
  const { id: _i, created_at, updated_at, used_count, ...rest } = promo;
  const payload = { ...rest, code: `${promo.code}-${suffix}`, name: promo.name ? `${promo.name} ${iswL('(salinan)', '(copy)')}` : null, is_active: false, created_by: uid };
  const { data, error } = await window.db.from('psy_promo_codes').insert(payload).select('id').single();
  if (error) return banner(iswL('Ralat: ', 'Error: ') + error.message, 'error');
  if (typeof auditLog === 'function') await auditLog('promo.duplicate', data.id, { from: promoId, code: payload.code });
  location.href = `promo-form.html?id=${data.id}`;
}

document.addEventListener('isw:langchange', () => { try { renderTabBar(); renderTab(); } catch (e) {} });
(async () => {
  await waitI18n();
  const user = await initStaff('promo_codes', 'Butiran promosi', 'psy_products');
  if (!user) return;
  renderTabBar();
  await loadPromo();
})();
</script>
