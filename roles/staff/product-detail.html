<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Detail Produk</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🛒</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <!-- Action bar — always visible -->
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <div id="view-status"></div>
          <div id="btn-bar-view" class="flex gap-2">
            <button id="btn-toggle-status" onclick="toggleStatus()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5"></button>
            <button onclick="enterEdit()" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark flex items-center gap-2">✏️ Edit Produk</button>
          </div>
          <div id="btn-bar-edit" class="hidden flex gap-2">
            <button onclick="exitEdit()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5">Batal</button>
            <button id="btn-save" onclick="saveProduct()" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark">Simpan</button>
          </div>
        </div>

        <!-- ── VIEW SECTION ─────────────────────────────── -->
        <div id="view-section" class="space-y-5">

          <!-- Hero -->
          <div id="prod-hero" class="rounded-2xl overflow-hidden relative min-h-[160px] flex items-end">
            <div id="hero-inner" class="p-6 text-white w-full"></div>
          </div>

          <!-- Stats -->
          <div class="grid grid-cols-3 gap-4">
            <div class="bg-white rounded-xl p-5 border border-ink/10 text-center">
              <div class="text-xs text-ink/50 uppercase font-semibold tracking-wide">Harga</div>
              <div id="stat-price" class="text-2xl font-bold mt-1 text-navy"></div>
            </div>
            <div class="bg-white rounded-xl p-5 border border-ink/10 text-center">
              <div class="text-xs text-ink/50 uppercase font-semibold tracking-wide">Stok</div>
              <div id="stat-stock" class="text-2xl font-bold mt-1 text-navy"></div>
            </div>
            <div class="bg-white rounded-xl p-5 border border-ink/10 text-center">
              <div class="text-xs text-ink/50 uppercase font-semibold tracking-wide">Kategori</div>
              <div id="stat-cat" class="text-sm font-semibold mt-2 text-navy"></div>
            </div>
          </div>

          <!-- Description -->
          <div id="section-desc" class="hidden bg-white rounded-xl p-5 border border-ink/10">
            <h3 class="font-bold mb-2 text-sm">📝 Keterangan Produk</h3>
            <p id="view-desc" class="text-sm text-ink/70 leading-relaxed"></p>
          </div>

        </div>

        <!-- ── EDIT SECTION ─────────────────────────────── -->
        <div id="edit-section" class="hidden max-w-xl mx-auto space-y-4">
          <input id="edit-id" type="hidden">
          <input id="f-image" type="file" accept="image/*" onchange="previewProdImage(this)" class="hidden">
          <input id="f-image-url" type="hidden">
          <input id="f-image-raw" type="hidden">

          <div class="space-y-4">

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold text-ink/60">Product ID</label>
                <input id="f-pid" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm bg-cream/50 text-ink/60 font-mono" readonly>
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/60">Kategori</label>
                <select id="f-cat" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm bg-white focus:border-navy outline-none">
                  <option>Madu</option><option>IV Saline Drip</option><option>Herba</option><option>Buku</option>
                </select>
              </div>
            </div>

            <div>
              <label class="text-xs font-semibold text-ink/60">Nama <span class="text-terracotta">*</span></label>
              <input id="f-name" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
            </div>

            <div>
              <label class="text-xs font-semibold text-ink/60">Description</label>
              <input id="f-desc-edit" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold text-ink/60">Harga (RM)</label>
                <div class="relative mt-1">
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-ink/40">RM</span>
                  <input id="f-price" type="number" step="0.01" class="w-full pl-9 pr-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
                </div>
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/60">Stock</label>
                <input id="f-stock" type="number" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
              </div>
            </div>

            <div>
              <label class="text-xs font-semibold text-ink/60">Gambar Produk</label>
              <div class="flex items-start gap-4 mt-2">
                <div id="prod-img-preview" class="w-20 h-20 rounded-xl border-2 border-dashed border-ink/20 flex items-center justify-center bg-cream/50 overflow-hidden flex-shrink-0 text-2xl text-ink/30 cursor-pointer hover:border-navy transition-colors" onclick="document.getElementById('f-image').click()">📷</div>
                <div class="flex-1 min-w-0">
                  <button type="button" onclick="document.getElementById('f-image').click()" class="px-4 py-2 border border-ink/20 rounded-lg text-xs font-semibold hover:border-navy hover:text-navy transition-colors">Pilih Gambar</button>
                  <p class="text-[10px] text-ink/40 mt-1.5">JPG, PNG · maks 10MB</p>
                </div>
              </div>
              <div id="prod-image-editor" class="hidden mt-3 rounded-xl border border-ink/10 bg-cream/30 p-3 space-y-2.5">
                <div class="aspect-video rounded-lg overflow-hidden bg-white border border-ink/10">
                  <img id="prod-crop-preview" class="w-full h-full object-cover" alt="Preview gambar">
                </div>
                <div class="grid grid-cols-3 gap-3">
                  <label class="text-[10px] font-semibold text-ink/60">Saiz <input id="prod-crop-zoom" type="range" min="1" max="3" step="0.05" value="1" oninput="renderProdImageCrop()" class="w-full mt-1"></label>
                  <label class="text-[10px] font-semibold text-ink/60">Kiri/Kanan <input id="prod-crop-x" type="range" min="-100" max="100" step="1" value="0" oninput="renderProdImageCrop()" class="w-full mt-1"></label>
                  <label class="text-[10px] font-semibold text-ink/60">Atas/Bawah <input id="prod-crop-y" type="range" min="-100" max="100" step="1" value="0" oninput="renderProdImageCrop()" class="w-full mt-1"></label>
                </div>
                <button type="button" onclick="resetProdImageCrop()" class="text-xs text-ink/50 hover:text-navy underline">Reset posisi</button>
              </div>
            </div>

          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const BG_HERO_MAP = {
  'Madu':          'from-yellow-600 to-yellow-800',
  'IV Saline Drip':'from-navy to-teal',
  'Herba':         'from-green-700 to-green-900',
  'Buku':          'from-slate-600 to-slate-800',
};
const BG_MAP = { 'Madu':'bg-gold-light','IV Saline Drip':'bg-navy-light','Herba':'bg-green-light','Buku':'bg-cream' };
let currentProd = null;

// ── Render view ───────────────────────────────────────
function renderView(p) {
  currentProd = p;

  document.getElementById('view-status').innerHTML = p.is_active
    ? '<span class="chip bg-green-light text-green-dark">✓ Aktif</span>'
    : '<span class="chip bg-ink/10 text-ink/60">Tidak Aktif</span>';
  document.getElementById('btn-toggle-status').textContent = p.is_active ? 'Nyahaktifkan' : 'Aktifkan';
  document.getElementById('btn-toggle-status').className = `px-4 py-2 border rounded-lg text-sm font-semibold ${p.is_active ? 'border-gold/40 text-gold-dark hover:bg-gold/10' : 'border-green/40 text-green-dark hover:bg-green-light'}`;

  const hero  = document.getElementById('prod-hero');
  const inner = document.getElementById('hero-inner');
  if (p.image_url) {
    hero.style.backgroundImage    = `url(${p.image_url})`;
    hero.style.backgroundSize     = 'cover';
    hero.style.backgroundPosition = 'center';
    hero.className = 'rounded-2xl overflow-hidden relative min-h-[200px] flex items-end';
    inner.className = 'p-6 text-white w-full bg-gradient-to-t from-black/60 to-transparent';
  } else {
    hero.style.backgroundImage = '';
    hero.className = `rounded-2xl overflow-hidden relative min-h-[160px] flex items-end bg-gradient-to-br ${BG_HERO_MAP[p.category] || 'from-navy to-teal'}`;
    inner.className = 'p-6 text-white w-full';
  }
  inner.innerHTML = `
    <div class="text-4xl mb-2">${p.icon || '📦'}</div>
    <h1 class="text-2xl font-bold drop-shadow">${p.name || ''}</h1>
    ${p.product_id ? `<div class="text-white/50 text-xs mt-1 font-mono">${p.product_id}</div>` : ''}
  `;

  document.getElementById('stat-price').textContent = p.price != null ? `RM ${Number(p.price).toFixed(2)}` : '—';
  document.getElementById('stat-stock').textContent = p.stock != null ? p.stock : '—';
  document.getElementById('stat-cat').textContent   = p.category || '—';

  if (p.description) {
    document.getElementById('view-desc').textContent = p.description;
    document.getElementById('section-desc').classList.remove('hidden');
  } else {
    document.getElementById('section-desc').classList.add('hidden');
  }
}

// ── Toggle active ─────────────────────────────────────
async function toggleStatus() {
  if (!currentProd) return;
  await dbUpdate('psy_products', currentProd.id, { is_active: !currentProd.is_active });
  currentProd.is_active = !currentProd.is_active;
  renderView(currentProd);
  banner(currentProd.is_active ? 'Produk diaktifkan' : 'Produk dinyahaktifkan');
}

// ── View / Edit toggle ────────────────────────────────
function enterEdit() {
  document.getElementById('edit-id').value       = currentProd.id;
  document.getElementById('f-pid').value         = currentProd.product_id || '';
  document.getElementById('f-cat').value         = currentProd.category || 'Madu';
  document.getElementById('f-name').value        = currentProd.name || '';
  document.getElementById('f-desc-edit').value   = currentProd.description || '';
  document.getElementById('f-price').value       = currentProd.price ?? '';
  document.getElementById('f-stock').value       = currentProd.stock ?? '';
  document.getElementById('f-image-url').value   = currentProd.image_url || '';
  document.getElementById('f-image-raw').value   = currentProd.image_url || '';

  const imgPreview = document.getElementById('prod-img-preview');
  imgPreview.innerHTML = currentProd.image_url
    ? `<img src="${currentProd.image_url}" class="w-full h-full object-cover">`
    : '📷';

  document.getElementById('prod-image-editor').classList.toggle('hidden', !currentProd.image_url);
  prodCropImage = null;
  if (currentProd.image_url) {
    document.getElementById('prod-crop-preview').src = currentProd.image_url;
    applyProdImageAdjustment(false);
  }

  document.getElementById('view-section').classList.add('hidden');
  document.getElementById('edit-section').classList.remove('hidden');
  document.getElementById('btn-bar-view').classList.add('hidden');
  document.getElementById('btn-bar-edit').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function exitEdit() {
  document.getElementById('edit-section').classList.add('hidden');
  document.getElementById('view-section').classList.remove('hidden');
  document.getElementById('btn-bar-edit').classList.add('hidden');
  document.getElementById('btn-bar-view').classList.remove('hidden');
}

// ── Image crop ────────────────────────────────────────
let prodCropImage = null;

function previewProdImage(input) {
  const file = input.files[0]; if (!file) return;
  if (file.size > 10 * 1024 * 1024) { banner('Gambar melebihi 10MB', 'error'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = e => { document.getElementById('f-image-raw').value = e.target.result; applyProdImageAdjustment(); };
  reader.readAsDataURL(file);
}

function cropImageDataUrl(img, zoom, ox, oy, w = 1200, h = 675) {
  if (!img) return Promise.resolve('');
  const bs = Math.max(w / img.width, h / img.height), s = bs * zoom;
  const dw = img.width * s, dh = img.height * s;
  const mx = Math.max(0, (dw - w) / 2), my = Math.max(0, (dh - h) / 2);
  const dx = (w - dw) / 2 + (ox / 100) * mx, dy = (h - dh) / 2 + (oy / 100) * my;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, dx, dy, dw, dh);
  return Promise.resolve(c.toDataURL('image/jpeg', 0.9));
}

function loadCropImage(src) { return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = src; }); }

async function applyProdImageAdjustment(reset = true) {
  const raw = document.getElementById('f-image-raw').value; if (!raw) return;
  prodCropImage = await loadCropImage(raw);
  document.getElementById('prod-image-editor').classList.remove('hidden');
  if (reset) { document.getElementById('prod-crop-zoom').value = 1; document.getElementById('prod-crop-x').value = 0; document.getElementById('prod-crop-y').value = 0; }
  renderProdImageCrop();
}

async function renderProdImageCrop() {
  if (!prodCropImage) return;
  const adj = await cropImageDataUrl(prodCropImage,
    parseFloat(document.getElementById('prod-crop-zoom').value) || 1,
    parseInt(document.getElementById('prod-crop-x').value) || 0,
    parseInt(document.getElementById('prod-crop-y').value) || 0
  );
  document.getElementById('f-image-url').value = adj;
  document.getElementById('prod-crop-preview').src = adj;
  document.getElementById('prod-img-preview').innerHTML = `<img src="${adj}" class="w-full h-full object-cover">`;
}

function resetProdImageCrop() {
  document.getElementById('prod-crop-zoom').value = 1;
  document.getElementById('prod-crop-x').value = 0;
  document.getElementById('prod-crop-y').value = 0;
  renderProdImageCrop();
}

// ── Save ──────────────────────────────────────────────
async function saveProduct() {
  const editId = document.getElementById('edit-id').value;
  const cat    = document.getElementById('f-cat').value;
  const data = {
    name:        document.getElementById('f-name').value.trim(),
    description: document.getElementById('f-desc-edit').value.trim(),
    category:    cat,
    price:       parseFloat(document.getElementById('f-price').value) || 0,
    stock:       parseInt(document.getElementById('f-stock').value) || null,
    image_url:   document.getElementById('f-image-url').value || null,
    bg_color:    BG_MAP[cat] || 'bg-cream',
    updated_at:  new Date().toISOString(),
  };
  if (!data.name) { banner('Nama produk wajib diisi', 'error'); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    await dbUpdate('psy_products', editId, data);
    await auditLog('product.updated', editId);
    Object.assign(currentProd, data);
    banner('Produk dikemaskini ✓');
    exitEdit();
    renderView(currentProd);
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan';
  }
}

// ── Bootstrap ─────────────────────────────────────────
(async () => {
  const user = await initStaff('psy_products', '');
  if (!user) return;
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { banner('ID tidak ditemui', 'error'); return; }
  setHeaderBack('products.html', 'Kembali ke Products');
  const { data: p } = await window.db.from('psy_products').select('*').eq('id', id).single();
  if (!p) { banner('Produk tidak ditemui', 'error'); return; }
  setPageTitle(p.name, 'Detail produk shop');
  renderView(p);
})();
</script>
</body>
</html>
