<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Log Penghantaran</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#f7f8fa]">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📨</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <section class="p-4 md:p-6 max-w-[1400px] mx-auto space-y-5">
        <div id="submodnav"></div>
        <div>
          <h1 class="text-2xl font-extrabold text-ink">Log Penghantaran</h1>
          <p class="text-sm text-ink/55 mt-0.5">Rekod semua mesej automatik yang telah dihantar kepada pesakit.</p>
        </div>

        <!-- KPI -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="bg-white rounded-2xl border border-ink/8 shadow-sm p-5"><div class="text-2xl font-extrabold text-ink" id="k-total">—</div><div class="text-xs text-ink/55 font-medium mt-1">Jumlah Dihantar</div></div>
          <div class="bg-white rounded-2xl border border-ink/8 shadow-sm p-5"><div class="text-2xl font-extrabold text-green-dark" id="k-sent">—</div><div class="text-xs text-ink/55 font-medium mt-1">Berjaya Dihantar</div></div>
          <div class="bg-white rounded-2xl border border-ink/8 shadow-sm p-5"><div class="text-2xl font-extrabold text-gold-dark" id="k-pending">—</div><div class="text-xs text-ink/55 font-medium mt-1">Menunggu (Pending)</div></div>
          <div class="bg-white rounded-2xl border border-ink/8 shadow-sm p-5"><div class="text-2xl font-extrabold text-terracotta" id="k-failed">—</div><div class="text-xs text-ink/55 font-medium mt-1">Gagal (Failed)</div></div>
        </div>

        <!-- Filters -->
        <div class="flex flex-wrap items-center gap-2">
          <input id="f-search" oninput="applyFilter()" placeholder="Cari pesakit / automasi / no. telefon…" class="flex-1 min-w-[220px] px-3 py-2.5 border border-ink/15 rounded-xl text-sm outline-none focus:border-navy">
          <select id="f-status" onchange="applyFilter()" class="px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white"><option value="">Semua Status</option><option value="sent">Berjaya</option><option value="pending">Menunggu</option><option value="failed">Gagal</option></select>
          <select id="f-channel" onchange="applyFilter()" class="px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white"><option value="">Semua Saluran</option><option value="whatsapp">WhatsApp</option><option value="inapp">In-App</option><option value="email">Email</option></select>
          <button onclick="resetFilter()" class="px-3 py-2.5 border border-ink/15 rounded-xl text-sm text-ink/55 hover:bg-ink/5">↺ Reset</button>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl border border-ink/8 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-cream/40 text-[11px] uppercase tracking-wide text-ink/45">
                <tr>
                  <th class="text-left px-4 py-2.5 font-bold">Masa</th>
                  <th class="text-left px-4 py-2.5 font-bold">Pesakit</th>
                  <th class="text-left px-4 py-2.5 font-bold">No. Telefon</th>
                  <th class="text-left px-4 py-2.5 font-bold">Automasi / Event</th>
                  <th class="text-left px-4 py-2.5 font-bold">Saluran</th>
                  <th class="text-left px-4 py-2.5 font-bold">Status</th>
                  <th class="text-left px-4 py-2.5 font-bold">Ralat</th>
                </tr>
              </thead>
              <tbody id="body" class="divide-y divide-ink/5"></tbody>
            </table>
          </div>
          <div id="empty" class="hidden px-4 py-16 text-center text-ink/40 text-sm">Tiada log lagi — akan terisi bila automasi mula menghantar.</div>
        </div>
        <div id="count" class="text-[12px] text-ink/45"></div>
      </section>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script src="automation-subnav.js"></script>
<script>
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDT(d){ return d ? new Date(d).toLocaleString('ms-MY',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'; }
const CH_ICON = { whatsapp:'📲', inapp:'🔔', email:'✉️' };
const ST_CLS = { sent:'bg-green-100 text-green-700', pending:'bg-blue-100 text-blue-700', failed:'bg-terracotta/15 text-terracotta', cancelled:'bg-ink/10 text-ink/50' };
const ST_LBL = { sent:'● Berjaya', pending:'○ Menunggu', failed:'● Gagal', cancelled:'⊘ Batal' };

let LOGS = [], AUTOMAP = {}, PHONEMAP = {};

function render(rows){
  const body = document.getElementById('body');
  document.getElementById('empty').classList.toggle('hidden', rows.length>0);
  document.getElementById('count').textContent = `Menunjukkan ${rows.length} daripada ${LOGS.length} rekod`;
  body.innerHTML = rows.map(r => `<tr class="hover:bg-cream/30">
    <td class="px-4 py-2.5 text-[12px] text-ink/60 whitespace-nowrap">${esc(fmtDT(r.created_at))}</td>
    <td class="px-4 py-2.5 text-[13px] text-ink/80">${esc(r.patient_name||'—')}</td>
    <td class="px-4 py-2.5 text-[12px] text-ink/55 whitespace-nowrap">${esc(PHONEMAP[r.patient_id]||'—')}</td>
    <td class="px-4 py-2.5 text-[12px] text-ink/60">${esc(AUTOMAP[r.automation_id]||r.event||'—')}</td>
    <td class="px-4 py-2.5 whitespace-nowrap">${CH_ICON[r.channel]||''} <span class="text-[12px] text-ink/60">${esc(r.channel||'')}</span></td>
    <td class="px-4 py-2.5"><span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${ST_CLS[r.status]||'bg-ink/10 text-ink/50'}">${ST_LBL[r.status]||esc(r.status||'')}</span></td>
    <td class="px-4 py-2.5 text-[11px] text-terracotta max-w-[240px] truncate" title="${esc(r.error||'')}">${esc(r.error||'')}</td>
  </tr>`).join('');
}
function applyFilter(){
  const q = document.getElementById('f-search').value.trim().toLowerCase();
  const st = document.getElementById('f-status').value;
  const ch = document.getElementById('f-channel').value;
  render(LOGS.filter(r => {
    if (st && r.status!==st) return false;
    if (ch && r.channel!==ch) return false;
    if (q){ const hay = `${r.patient_name||''} ${AUTOMAP[r.automation_id]||''} ${r.event||''} ${PHONEMAP[r.patient_id]||''}`.toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }));
}
function resetFilter(){ document.getElementById('f-search').value=''; document.getElementById('f-status').value=''; document.getElementById('f-channel').value=''; applyFilter(); }

async function load(){
  const { data } = await window.db.from('psy_notification_logs').select('*').order('created_at',{ascending:false}).limit(500);
  LOGS = data || [];
  const autoIds = [...new Set(LOGS.map(l=>l.automation_id).filter(Boolean))];
  const patIds = [...new Set(LOGS.map(l=>l.patient_id).filter(Boolean))];
  if (autoIds.length){ const { data:a } = await window.db.from('psy_automations').select('id,name').in('id',autoIds); (a||[]).forEach(x=>AUTOMAP[x.id]=x.name); }
  if (patIds.length){ const { data:p } = await window.db.from('psy_patients').select('id,phone').in('id',patIds); (p||[]).forEach(x=>PHONEMAP[x.id]=x.phone); }

  document.getElementById('k-total').textContent = LOGS.length.toLocaleString();
  document.getElementById('k-sent').textContent = LOGS.filter(l=>l.status==='sent').length.toLocaleString();
  document.getElementById('k-pending').textContent = LOGS.filter(l=>l.status==='pending').length.toLocaleString();
  document.getElementById('k-failed').textContent = LOGS.filter(l=>l.status==='failed').length.toLocaleString();
  render(LOGS);
}

(async () => {
  const user = await initStaff('auto_logs', 'Log Penghantaran', 'auto_messages');
  if (!user) return;
  await load();
})();
</script>
</body>
</html>
