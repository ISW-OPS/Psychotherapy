<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Produk & Bahan</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.purple-btn { background: #6366f1; color: white; transition: background .15s; }
.purple-btn:hover { background: #4f46e5; }
</style>
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🧴</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-5">

        <div class="text-xs text-ink/40">
          <span class="text-ink/70 font-medium">Produk & Bahan</span> <span class="mx-1">›</span> Senarai
        </div>

        <!-- Page header -->
        <div class="flex items-start justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-2xl font-bold text-ink">Produk & Bahan</h1>
            <div class="text-sm text-ink/55 mt-0.5">🧴 Senarai semua produk/bahan luar & cadangan kedai makan untuk pesakit — bukan Produk Shop ISW.</div>
          </div>
          <button data-rbac="produk_bahan.create" id="btn-new" onclick="openNew()" class="hidden purple-btn px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-sm">+ Tambah Produk & Bahan</button>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <input type="text" id="f-search" oninput="renderTable()" placeholder="Cari produk, bahan atau kedai makan..." class="text-xs border border-ink/15 rounded-lg px-3 py-1.5 bg-white w-64">
          <select id="f-type" onchange="renderTable()" class="text-xs border border-ink/15 rounded-lg px-2.5 py-1.5 bg-white">
            <option value="">Kategori: Semua</option>
            <option value="barang">📦 Barang</option>
            <option value="kedai_makan">🍽️ Kedai Makan</option>
          </select>
          <select id="f-level" onchange="renderTable()" class="text-xs border border-ink/15 rounded-lg px-2.5 py-1.5 bg-white">
            <option value="">Tahap Keperluan: Semua</option>
            <option value="wajib">Wajib</option>
            <option value="cadangan">Cadangan</option>
            <option value="opsyenal">Optional</option>
          </select>
          <select id="f-status" onchange="renderTable()" class="text-xs border border-ink/15 rounded-lg px-2.5 py-1.5 bg-white">
            <option value="">Status: Semua</option>
            <option value="active">Aktif</option>
            <option value="inactive">Tidak Aktif</option>
          </select>
          <select id="f-platform" onchange="renderTable()" class="text-xs border border-ink/15 rounded-lg px-2.5 py-1.5 bg-white">
            <option value="">Platform: Semua</option>
          </select>
          <select id="f-package" onchange="renderTable()" class="text-xs border border-ink/15 rounded-lg px-2.5 py-1.5 bg-white">
            <option value="">Pakej: Semua</option>
          </select>
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-ink/8 bg-ink/[0.015]">
                  <th class="text-left px-5 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Gambar</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Nama</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Jenis</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Tahap / Kategori</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Lokasi / Seller</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Status</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Last Updated</th>
                  <th class="text-right px-5 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Tindakan</th>
                </tr>
              </thead>
              <tbody id="product-body" class="divide-y divide-ink/5"></tbody>
            </table>
          </div>
          <div id="product-empty-state" class="hidden px-5 py-12 text-center text-sm text-ink/35">Tiada produk atau bahan lagi</div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('ms-MY', { day:'2-digit', month:'short', year:'numeric' }) : '—'; }
function fmtDateTime(d) { return d ? new Date(d).toLocaleString('ms-MY', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—'; }

const LEVEL_META = {
  wajib:     { label: 'Wajib',     cls: 'bg-terracotta/15 text-terracotta' },
  cadangan:  { label: 'Cadangan',  cls: 'bg-gold/20 text-gold-dark' },
  opsyenal:  { label: 'Optional',  cls: 'bg-ink/8 text-ink/55' },
};

let allProducts = [];
let sellersByProduct = {};   // product_id -> [{..., psy_recommended_sellers:{platform,name}}]
let mapsByProduct = {};      // product_id -> [{package_id,...}]
let allPackages = [];

async function loadAll() {
  const [{ data: prods }, { data: sellers }, { data: maps }, { data: pkgs }] = await Promise.all([
    window.db.from('psy_recommended_products').select('*').order('name', { ascending: true }),
    window.db.from('psy_recommended_product_sellers').select('*, psy_recommended_sellers(name, platform)'),
    window.db.from('psy_package_recommended_products').select('*'),
    window.db.from('psy_packages').select('package_id, name').order('name', { ascending: true }),
  ]);
  allProducts = prods || [];
  allPackages = pkgs || [];

  sellersByProduct = {};
  (sellers || []).forEach(s => { (sellersByProduct[s.product_id] ||= []).push(s); });
  mapsByProduct = {};
  (maps || []).forEach(m => { (mapsByProduct[m.product_id] ||= []).push(m); });

  // Isi pilihan filter Platform & Pakej
  const platforms = [...new Set((sellers || []).map(s => s.psy_recommended_sellers?.platform).filter(Boolean))].sort();
  document.getElementById('f-platform').innerHTML = '<option value="">Platform: Semua</option>' +
    platforms.map(p => `<option value="${escHtml(p)}">${escHtml(p)}</option>`).join('');
  document.getElementById('f-package').innerHTML = '<option value="">Pakej: Semua</option>' +
    allPackages.map(pk => `<option value="${escHtml(pk.package_id)}">${escHtml(pk.name)}</option>`).join('');

  renderTable();
}

function renderTable() {
  const q = (document.getElementById('f-search').value || '').toLowerCase().trim();
  const type = document.getElementById('f-type').value;
  const level = document.getElementById('f-level').value;
  const status = document.getElementById('f-status').value;
  const platform = document.getElementById('f-platform').value;
  const pkg = document.getElementById('f-package').value;
  const tbody = document.getElementById('product-body');
  const empty = document.getElementById('product-empty-state');

  const list = allProducts.filter(p => {
    if (q && !(p.name || '').toLowerCase().includes(q) && !(p.purpose || '').toLowerCase().includes(q) && !(p.address || '').toLowerCase().includes(q)) return false;
    if (type && (p.item_type || 'barang') !== type) return false;
    if (level && p.requirement_level !== level) return false;
    if (status && (status === 'active') !== !!p.is_active) return false;
    const sellers = sellersByProduct[p.id] || [];
    if (platform && !sellers.some(s => s.psy_recommended_sellers?.platform === platform)) return false;
    const maps = mapsByProduct[p.id] || [];
    if (pkg && !maps.some(m => m.package_id === pkg)) return false;
    return true;
  });

  if (!list.length) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  tbody.innerHTML = list.map(p => {
    const isResto = p.item_type === 'kedai_makan';
    const lvl = LEVEL_META[p.requirement_level] || LEVEL_META.cadangan;
    const sellerCount = (sellersByProduct[p.id] || []).length;
    const pkgCount = new Set((mapsByProduct[p.id] || []).map(m => m.package_id)).size;
    const typeBadge = isResto
      ? '<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-700">🍽️ Kedai Makan</span>'
      : '<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-navy-light/50 text-navy">📦 Barang</span>';
    const col3 = isResto ? `<span class="text-xs text-ink/60">${escHtml(p.category || '—')}</span>` : `<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${lvl.cls}">${lvl.label}</span>`;
    const col4 = isResto ? escHtml(p.address || p.area || '—') : (sellerCount ? `${sellerCount} seller` : '—');
    const col5 = isResto ? '—' : `${pkgCount} pakej`;
    return `<tr class="hover:bg-ink/[0.01] cursor-pointer" onclick="window.location.href='produk-bahan-view.html?id=${p.id}'">
      <td class="px-5 py-3">
        ${p.image_url ? `<img src="${escHtml(p.image_url)}" class="w-10 h-10 rounded-lg object-cover border border-ink/10">` : '<div class="w-10 h-10 rounded-lg bg-ink/5"></div>'}
      </td>
      <td class="px-3 py-3 font-bold text-ink">
        ${escHtml(p.name)}${p.purpose ? `<div class="text-[11px] font-normal text-ink/45 mt-0.5 line-clamp-1">${escHtml(p.purpose)}</div>` : ''}
      </td>
      <td class="px-3 py-3">${typeBadge}</td>
      <td class="px-3 py-3 text-xs">${col3}</td>
      <td class="px-3 py-3 text-xs text-ink/60">${col4}${isResto ? '' : (col5 !== '—' ? ` · ${col5}` : '')}</td>
      <td class="px-3 py-3">${p.is_active ? '<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700">● Aktif</span>' : '<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-ink/8 text-ink/55">● Tidak Aktif</span>'}</td>
      <td class="px-3 py-3 text-xs text-ink/50">${fmtDateTime(p.updated_at)}</td>
      <td class="px-5 py-3 text-right whitespace-nowrap" onclick="event.stopPropagation()">
        <button onclick="window.location.href='produk-bahan-view.html?id=${p.id}'" class="w-8 h-8 inline-flex items-center justify-center border border-ink/15 rounded-lg hover:bg-ink/5" title="Lihat">👁️</button>
      </td>
    </tr>`;
  }).join('');
}

function openNew() { window.location.href = 'produk-bahan-form.html'; }
window.openNew = openNew;

(async () => {
  const user = await initStaff('produk_bahan', 'Master produk & bahan luar');
  if (!user) return;
  if (can('produk_bahan','create')) document.getElementById('btn-new').classList.remove('hidden');
  await loadAll();
})();
</script>
</body>
</html>
