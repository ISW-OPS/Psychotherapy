<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Produk & Bahan Luar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.purple-btn { background: #6366f1; color: white; transition: background .15s; }
.purple-btn:hover { background: #4f46e5; }
</style>
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🧴</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-5">

        <!-- Page header -->
        <div class="flex items-start justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-2xl font-bold text-ink">Produk & Bahan Luar</h1>
            <div class="text-sm text-ink/55 mt-0.5">🧴 Master item yang pesakit kena beli SENDIRI di luar (bukan Produk Shop ISW) — dipetakan ke pakej &amp; minggu tertentu.</div>
          </div>
          <button data-rbac="produk_bahan.create" id="btn-new" onclick="openNew()" class="hidden purple-btn px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-sm">+ Tambah Produk</button>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <select id="f-level" onchange="renderTable()" class="text-xs border border-ink/15 rounded-lg px-2.5 py-1.5 bg-white">
            <option value="">Semua Tahap</option>
            <option value="wajib">Wajib</option>
            <option value="cadangan">Cadangan</option>
            <option value="opsyenal">Opsyenal</option>
          </select>
          <input type="text" id="f-search" oninput="renderTable()" placeholder="Cari nama / kategori..." class="text-xs border border-ink/15 rounded-lg px-3 py-1.5 bg-white w-56">
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-ink/8 bg-ink/[0.015]">
                  <th class="text-left px-5 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Nama</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Kategori</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Tahap</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Pembekal</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Pautan Pakej</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Disahkan</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Status</th>
                  <th class="text-right px-5 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Tindakan</th>
                </tr>
              </thead>
              <tbody id="product-body" class="divide-y divide-ink/5"></tbody>
            </table>
          </div>
          <div id="product-empty-state" class="hidden px-5 py-12 text-center text-sm text-ink/35">Tiada produk lagi</div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('ms-MY', { day:'2-digit', month:'short', year:'numeric' }) : '—'; }

const LEVEL_META = {
  wajib:     { label: 'Wajib',     cls: 'bg-terracotta/15 text-terracotta' },
  cadangan:  { label: 'Cadangan',  cls: 'bg-gold/20 text-gold-dark' },
  opsyenal:  { label: 'Opsyenal',  cls: 'bg-ink/8 text-ink/55' },
};

let allProducts = [];
let sellersByProduct = {};
let mapsByProduct = {};

async function loadAll() {
  const [{ data: prods }, { data: sellers }, { data: maps }] = await Promise.all([
    window.db.from('psy_recommended_products').select('*').order('name', { ascending: true }),
    window.db.from('psy_recommended_product_sellers').select('*').order('sort_order', { ascending: true }),
    window.db.from('psy_package_recommended_products').select('*'),
  ]);
  allProducts = prods || [];
  sellersByProduct = {};
  (sellers || []).forEach(s => { (sellersByProduct[s.product_id] ||= []).push(s); });
  mapsByProduct = {};
  (maps || []).forEach(m => { (mapsByProduct[m.product_id] ||= []).push(m); });
  renderTable();
}

function renderTable() {
  const level = document.getElementById('f-level').value;
  const q = (document.getElementById('f-search').value || '').toLowerCase().trim();
  const tbody = document.getElementById('product-body');
  const empty = document.getElementById('product-empty-state');
  const list = allProducts.filter(p => {
    if (level && p.requirement_level !== level) return false;
    if (q && !(p.name || '').toLowerCase().includes(q) && !(p.category || '').toLowerCase().includes(q)) return false;
    return true;
  });
  if (!list.length) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  tbody.innerHTML = list.map(p => {
    const lvl = LEVEL_META[p.requirement_level] || LEVEL_META.cadangan;
    const sellerCount = (sellersByProduct[p.id] || []).length;
    const mapCount = (mapsByProduct[p.id] || []).length;
    return `<tr class="hover:bg-ink/[0.01]">
      <td class="px-5 py-3 font-bold text-ink">
        <div class="flex items-center gap-2.5">
          ${p.image_url ? `<img src="${escHtml(p.image_url)}" class="w-8 h-8 rounded-lg object-cover flex-shrink-0 border border-ink/10">` : '<div class="w-8 h-8 rounded-lg bg-ink/5 flex-shrink-0"></div>'}
          <div class="min-w-0">
            ${escHtml(p.name)}${p.purpose ? `<div class="text-[11px] font-normal text-ink/45 mt-0.5 line-clamp-1">${escHtml(p.purpose)}</div>` : ''}
          </div>
        </div>
      </td>
      <td class="px-3 py-3 text-xs text-ink/60">${escHtml(p.category || '—')}</td>
      <td class="px-3 py-3"><span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${lvl.cls}">${lvl.label}</span></td>
      <td class="px-3 py-3 text-xs">${sellerCount || '—'}</td>
      <td class="px-3 py-3 text-xs">${mapCount || '—'}</td>
      <td class="px-3 py-3 text-xs text-ink/50">${fmtDate(p.last_verified_at)}</td>
      <td class="px-3 py-3">${p.is_active ? '<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700">● Aktif</span>' : '<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-ink/8 text-ink/55">● Tidak Aktif</span>'}</td>
      <td class="px-5 py-3 text-right whitespace-nowrap">
        <button onclick="window.open('produk-bahan-view.html?id=${p.id}','_blank')" class="w-8 h-8 inline-flex items-center justify-center border border-ink/15 rounded-lg hover:bg-ink/5" title="Lihat">👁️</button>
        <button data-rbac="produk_bahan.edit" onclick="window.open('produk-bahan-form.html?id=${p.id}','_blank')" class="w-8 h-8 inline-flex items-center justify-center border border-ink/15 rounded-lg hover:bg-ink/5" title="Edit">✏️</button>
      </td>
    </tr>`;
  }).join('');
}

function openNew() { window.open('produk-bahan-form.html', '_blank'); }
window.openNew = openNew;

// Terima isyarat dari tab produk-bahan-form.html (Tambah/Edit dalam tab baru) — refresh senarai.
window.addEventListener('message', (e) => {
  if (e.data?.type === 'isw-produk-bahan-saved') loadAll();
});

(async () => {
  const user = await initStaff('produk_bahan', 'Master produk & bahan luar');
  if (!user) return;
  if (can('produk_bahan','create')) document.getElementById('btn-new').classList.remove('hidden');
  await loadAll();
})();
</script>
</body>
</html>
