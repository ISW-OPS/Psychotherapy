<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Detail Supplier</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
  .sd-tab { padding: 10px 4px; font-size: 13px; font-weight: 600; color: rgba(43,38,32,0.45); border-bottom: 2px solid transparent; white-space: nowrap; }
  .sd-tab.active { color: #2B2620; border-bottom-color: #50808E; }
</style>
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🏢</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <a href="suppliers.html" class="text-xs text-teal hover:underline">← Back to Suppliers</a>
          <div class="flex items-center gap-2">
            <button id="btn-edit-sup" data-rbac="inventory.edit" onclick="location.href=`supplier-edit.html?id=${supplierId}`" class="hidden px-4 py-2.5 border border-ink/20 rounded-xl text-sm font-semibold bg-white hover:bg-ink/5">✏️ Edit Supplier</button>
          </div>
        </div>

        <!-- Header info bar -->
        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-6">
          <div class="flex items-start gap-4 flex-wrap">
            <div id="sd-avatar" class="w-14 h-14 rounded-2xl bg-navy/10 text-navy flex items-center justify-center text-xl font-bold flex-shrink-0">?</div>
            <div class="flex-1 min-w-[240px]">
              <h1 id="sd-name" class="text-xl font-bold text-ink">—</h1>
              <span id="sd-code" class="block mt-0.5 text-xs font-mono text-ink/35">—</span>
            </div>
            <span id="sd-status-chip" class="flex-shrink-0"></span>
          </div>

          <!-- Tabs -->
          <div class="flex items-center gap-6 mt-5 pt-3 border-t border-ink/8 overflow-x-auto">
            <button class="sd-tab active" data-tab="overview" onclick="setSdTab('overview')">🌐 Overview</button>
            <button class="sd-tab" data-tab="contacts" onclick="setSdTab('contacts')">👤 <span id="sd-tab-contacts-count">Contacts</span></button>
            <button class="sd-tab" data-tab="payments" onclick="setSdTab('payments')">💳 Payments</button>
            <button class="sd-tab" data-tab="notes" onclick="setSdTab('notes')">📝 <span id="sd-tab-notes-count">Notes</span></button>
            <button class="sd-tab" data-tab="activity" onclick="setSdTab('activity')">🕐 Activity Log</button>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-5 items-start">
          <div class="space-y-4 min-w-0">

            <!-- Overview -->
            <div id="sd-view-overview" class="bg-white rounded-2xl border border-ink/10 shadow-sm p-6">
              <div>
                <h3 class="font-bold text-sm text-ink mb-3">About this Supplier</h3>
                <div id="sd-about" class="grid grid-cols-2 gap-x-6 gap-y-3 text-sm"></div>
              </div>
              <div class="pt-5 mt-5 border-t border-ink/8">
                <h3 class="font-bold text-sm text-ink mb-3">Contact & Address</h3>
                <div id="sd-contact-details" class="grid grid-cols-2 gap-x-6 gap-y-3 text-sm"></div>
              </div>
            </div>

            <!-- Contacts -->
            <div id="sd-view-contacts" class="hidden bg-white rounded-2xl border border-ink/10 shadow-sm p-6">
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-sm text-ink">Contact Persons</h3>
                <button data-rbac="inventory.edit" onclick="location.href=`supplier-edit.html?id=${supplierId}`" class="hidden text-xs font-semibold text-navy hover:underline">✏️ Kemaskini di Borang Edit</button>
              </div>
              <div id="sd-contacts-table"></div>
            </div>

            <!-- Payments -->
            <div id="sd-view-payments" class="hidden bg-white rounded-2xl border border-ink/10 shadow-sm p-6">
              <h3 class="font-bold text-sm text-ink mb-3">Payments</h3>
              <div class="text-center text-ink/40 text-sm py-10 italic">Belum ada rekod bayaran.</div>
            </div>

            <!-- Notes -->
            <div id="sd-view-notes" class="hidden bg-white rounded-2xl border border-ink/10 shadow-sm p-6">
              <h3 class="font-bold text-sm text-ink mb-3">Notes</h3>
              <textarea id="sd-notes-text" rows="6" class="w-full px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none resize-none" placeholder="Tiada nota."></textarea>
              <div class="flex justify-end mt-2">
                <button data-rbac="inventory.edit" onclick="saveNotesQuick()" class="hidden bg-navy text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-navy-dark">Simpan Nota</button>
              </div>
            </div>

            <!-- Activity Log -->
            <div id="sd-view-activity" class="hidden bg-white rounded-2xl border border-ink/10 shadow-sm p-6">
              <h3 class="font-bold text-sm text-ink mb-3">Activity Log</h3>
              <div id="sd-activity-list" class="space-y-3"></div>
            </div>
          </div>

          <!-- ═══ SIDEBAR ═══ -->
          <div class="space-y-4">
            <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-5">
              <h3 class="font-bold text-sm text-ink mb-3">Quick Actions</h3>
              <div class="space-y-1">
                <button data-rbac="inventory.create" onclick="location.href='purchase-request-form.html'" class="hidden w-full flex items-center gap-3 px-2 py-2.5 rounded-xl hover:bg-ink/5 text-left">
                  <span class="w-8 h-8 rounded-lg bg-navy/10 flex items-center justify-center text-sm">📋</span>
                  <div><div class="text-sm font-semibold text-ink">Create Purchase Request</div><div class="text-[11px] text-ink/40">Buat permohonan beli</div></div>
                </button>
                <button disabled class="w-full flex items-center gap-3 px-2 py-2.5 rounded-xl text-left opacity-40 cursor-not-allowed">
                  <span class="w-8 h-8 rounded-lg bg-navy/10 flex items-center justify-center text-sm">💳</span>
                  <div><div class="text-sm font-semibold text-ink">Record Payment</div><div class="text-[11px] text-ink/40">Akan datang</div></div>
                </button>
                <button onclick="downloadStatement()" class="w-full flex items-center gap-3 px-2 py-2.5 rounded-xl hover:bg-ink/5 text-left">
                  <span class="w-8 h-8 rounded-lg bg-navy/10 flex items-center justify-center text-sm">⭳</span>
                  <div><div class="text-sm font-semibold text-ink">Download Statement</div><div class="text-[11px] text-ink/40">Muat turun statement</div></div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let supplierId = null;
let sdData = null;

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const SUPPLIER_STATUS_CHIP = {
  active:      '<span class="text-xs font-semibold text-green-dark bg-green-light px-2.5 py-1 rounded-full">Active</span>',
  inactive:    '<span class="text-xs font-semibold text-ink/45 bg-ink/8 px-2.5 py-1 rounded-full">Inactive</span>',
  blacklisted: '<span class="text-xs font-semibold text-terracotta bg-terracotta/10 px-2.5 py-1 rounded-full">Blacklisted</span>',
};

function setSdTab(tab) {
  document.querySelectorAll('.sd-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['overview','contacts','payments','notes','activity'].forEach(t => {
    document.getElementById('sd-view-' + t).classList.toggle('hidden', t !== tab);
  });
}
window.setSdTab = setSdTab;

async function loadSupplier() {
  const [supRes, contactRes, actRes] = await Promise.all([
    window.db.from('psy_suppliers').select('*').eq('id', supplierId).single(),
    window.db.from('psy_supplier_contacts').select('*').eq('supplier_id', supplierId).order('created_at'),
    window.db.from('psy_audit_log').select('*').eq('target', supplierId).order('created_at', { ascending: false }).limit(30),
  ]);
  if (supRes.error || !supRes.data) { banner('Supplier tidak dijumpai', 'error'); setTimeout(() => location.href = 'suppliers.html', 1200); return; }
  sdData = supRes.data;
  renderHeaderInfo(sdData);
  renderOverview(sdData);
  renderContactAddress(sdData);
  renderContactsTab(contactRes.data || []);
  renderNotes(sdData);
  renderActivity(actRes.data || []);
}

function renderHeaderInfo(d) {
  document.getElementById('sd-avatar').textContent = (d.name || '?').charAt(0).toUpperCase();
  document.getElementById('sd-name').textContent = d.name || '—';
  document.getElementById('sd-status-chip').innerHTML = SUPPLIER_STATUS_CHIP[d.status] || d.status;
  document.getElementById('sd-code').textContent = d.supplier_code || '—';
}

function renderOverview(d) {
  const rows = [
    ['Website', d.website ? `<a href="//${escHtml(d.website.replace(/^https?:\/\//,''))}" target="_blank" class="text-navy hover:underline">${escHtml(d.website)}</a>` : '—'],
    ['Status', SUPPLIER_STATUS_CHIP[d.status] || d.status],
    ['Email', escHtml(d.email || '—')],
    ['Phone', escHtml(d.phone || '—')],
    ['Currency', escHtml(d.currency || '—')],
    ['Joined On', d.created_at ? new Date(d.created_at).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—'],
  ];
  document.getElementById('sd-about').innerHTML = rows.map(([k,v]) => `<div><div class="text-ink/40 text-xs">${k}</div><div class="font-medium text-ink mt-0.5">${v}</div></div>`).join('');
}

function renderContactAddress(d) {
  const fullAddr = [d.address, d.city, d.state, d.postcode, d.country].filter(Boolean).join(', ');
  const rows = [
    ['Phone', escHtml(d.phone || '—')],
    ['Mobile', escHtml(d.mobile || '—')],
    ['Email', escHtml(d.email || '—')],
    ['Website', escHtml(d.website || '—')],
    ['Address', escHtml(fullAddr || '—')],
  ];
  document.getElementById('sd-contact-details').innerHTML = rows.map(([k,v]) => `<div><div class="text-ink/40 text-xs">${k}</div><div class="font-medium text-ink mt-0.5">${v}</div></div>`).join('');
}

function renderContactsTab(contacts) {
  document.getElementById('sd-tab-contacts-count').textContent = `Contacts (${contacts.length})`;
  const wrap = document.getElementById('sd-contacts-table');
  if (!contacts.length) { wrap.innerHTML = '<div class="text-center text-ink/40 text-sm py-8 italic">Tiada kenalan direkodkan.</div>'; return; }
  wrap.innerHTML = `<div class="overflow-x-auto"><table class="w-full text-sm">
    <thead><tr class="border-b border-ink/10 text-left text-[10px] uppercase tracking-wider text-ink/45">
      <th class="pb-2">Name</th><th class="pb-2">Position</th><th class="pb-2">Phone</th><th class="pb-2">Email</th><th class="pb-2 text-center">Action</th>
    </tr></thead>
    <tbody>${contacts.map(c => `<tr class="border-b border-ink/5 last:border-0">
      <td class="py-2.5 font-medium">${escHtml(c.name)}</td>
      <td class="py-2.5 text-ink/60">${escHtml(c.position || '—')}</td>
      <td class="py-2.5 text-ink/60">${escHtml(c.phone || '—')}</td>
      <td class="py-2.5 text-ink/60">${escHtml(c.email || '—')}</td>
      <td class="py-2.5 text-center">
        <button data-rbac="inventory.edit" onclick="location.href=\`supplier-edit.html?id=${supplierId}\`" title="Edit" class="hidden w-6 h-6 inline-flex items-center justify-center rounded-full text-navy hover:bg-navy/10">✏️</button>
        <button data-rbac="inventory.edit" onclick="deleteContactQuick('${c.id}')" title="Buang" class="hidden w-6 h-6 inline-flex items-center justify-center rounded-full text-terracotta hover:bg-terracotta/10">🗑</button>
      </td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

async function deleteContactQuick(contactId) {
  if (!confirm('Buang kenalan ini?')) return;
  const { error } = await window.db.from('psy_supplier_contacts').delete().eq('id', contactId);
  if (error) { banner('Gagal buang kenalan: ' + error.message, 'error'); return; }
  banner('Kenalan dibuang');
  await loadSupplier();
}
window.deleteContactQuick = deleteContactQuick;

function renderNotes(d) {
  document.getElementById('sd-tab-notes-count').textContent = `Notes (${d.notes ? 1 : 0})`;
  document.getElementById('sd-notes-text').value = d.notes || '';
}

async function saveNotesQuick() {
  const notes = document.getElementById('sd-notes-text').value.trim() || null;
  const { error } = await window.db.from('psy_suppliers').update({ notes, updated_by: window.currentUser?.id, updated_by_name: window.currentUser?.full_name, updated_at: new Date().toISOString() }).eq('id', supplierId);
  if (error) { banner('Gagal simpan nota: ' + error.message, 'error'); return; }
  document.getElementById('sd-tab-notes-count').textContent = `Notes (${notes ? 1 : 0})`;
  banner('Nota disimpan ✅');
}
window.saveNotesQuick = saveNotesQuick;

const ACTIVITY_LABEL = {
  'supplier.created': 'Supplier dicipta',
  'supplier.updated': 'Maklumat supplier dikemaskini',
};
function renderActivity(logs) {
  const wrap = document.getElementById('sd-activity-list');
  if (!logs.length) { wrap.innerHTML = '<div class="text-center text-ink/40 text-sm py-8 italic">Tiada aktiviti direkodkan lagi.</div>'; return; }
  wrap.innerHTML = logs.map(l => `
    <div class="flex items-start gap-3">
      <div class="w-7 h-7 rounded-full bg-navy/10 flex items-center justify-center text-xs flex-shrink-0 mt-0.5">🕐</div>
      <div class="flex-1 min-w-0">
        <div class="text-sm text-ink">${escHtml(ACTIVITY_LABEL[l.action] || l.action)}</div>
        <div class="text-[11px] text-ink/40">${escHtml(l.actor_name || 'Sistem')} · ${l.created_at ? new Date(l.created_at).toLocaleString('en-GB') : ''}</div>
      </div>
    </div>`).join('');
}

function downloadStatement() {
  const d = sdData;
  const rows = [
    ['Supplier Code', d.supplier_code || ''],
    ['Supplier Name', d.name || ''],
    ['Payment Terms', d.payment_terms || ''],
    ['Credit Limit (RM)', d.credit_limit ?? ''],
    ['Total Outstanding (RM)', '0.00'],
    ['Statement Generated', new Date().toLocaleString('en-GB')],
  ];
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `statement_${d.supplier_code || 'supplier'}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
window.downloadStatement = downloadStatement;

(async () => {
  const user = await initStaff('suppliers', 'Detail Supplier', 'inventory');
  if (!user) return;

  const qs = new URLSearchParams(location.search);
  supplierId = qs.get('id');
  if (!supplierId) { location.href = 'suppliers.html'; return; }

  await loadSupplier();
})();
</script>
</body>
</html>
