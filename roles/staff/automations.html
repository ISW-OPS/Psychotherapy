<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Senarai Automasi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#f7f8fa]">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">⚙️</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <section class="p-4 md:p-8 space-y-5">
        <div class="text-[12px] text-ink/45 font-medium">Mesej Automatik <span class="mx-1">/</span> <span class="text-ink/70">Senarai Automasi</span></div>

        <div class="flex items-start justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-[26px] font-extrabold text-ink tracking-tight">Senarai Automasi</h1>
            <p class="text-sm text-ink/50 mt-1">Lihat, urus dan pantau semua automasi mesej dalam sistem.</p>
          </div>
          <div class="flex items-center gap-2.5 flex-shrink-0">
            <div class="relative">
              <button onclick="toggleRangePop(event)" class="flex items-center gap-2 bg-white border border-ink/12 rounded-xl px-3 py-2.5 text-sm text-ink/70 shadow-sm font-medium hover:border-navy/30"><span>🗓️</span><span id="range-label">—</span><span class="text-ink/40 text-xs">▾</span></button>
              <div id="range-pop" class="hidden absolute right-0 mt-2 w-72 bg-white border border-ink/12 rounded-xl shadow-lg p-3.5 z-30 space-y-3">
                <div class="flex flex-wrap gap-1.5">
                  <button onclick="setPreset(7)" class="text-[11px] font-semibold px-2.5 py-1.5 rounded-lg border border-ink/15 hover:border-navy hover:text-navy">7 hari</button>
                  <button onclick="setPreset(14)" class="text-[11px] font-semibold px-2.5 py-1.5 rounded-lg border border-ink/15 hover:border-navy hover:text-navy">14 hari</button>
                  <button onclick="setPreset(30)" class="text-[11px] font-semibold px-2.5 py-1.5 rounded-lg border border-ink/15 hover:border-navy hover:text-navy">30 hari</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div><label class="text-[10px] font-semibold text-ink/45 uppercase">Dari</label><input id="r-from" type="date" class="w-full mt-1 px-2 py-1.5 border border-ink/15 rounded-lg text-xs outline-none focus:border-navy"></div>
                  <div><label class="text-[10px] font-semibold text-ink/45 uppercase">Hingga</label><input id="r-to" type="date" class="w-full mt-1 px-2 py-1.5 border border-ink/15 rounded-lg text-xs outline-none focus:border-navy"></div>
                </div>
                <button onclick="applyRange()" class="w-full bg-navy hover:bg-navy-dark text-white text-sm font-semibold py-2 rounded-lg">Guna Julat</button>
              </div>
            </div>
            <a href="automation-builder.html" class="bg-navy hover:bg-navy-dark text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-sm whitespace-nowrap flex items-center gap-1.5"><span class="text-base leading-none">+</span> Cipta Automasi</a>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="bg-white rounded-2xl border border-ink/8 shadow-sm p-3 flex flex-wrap items-center gap-2">
          <div class="relative flex-1 min-w-[200px]">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/35 text-sm">🔍</span>
            <input id="f-search" oninput="renderTable()" placeholder="Cari automasi…" class="w-full pl-9 pr-3 py-2.5 border border-ink/15 rounded-xl text-sm outline-none focus:border-navy">
          </div>
          <select id="f-cat" onchange="renderTable()" class="px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white"><option value="">Semua Kategori</option></select>
          <select id="f-status" onchange="renderTable()" class="px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white"><option value="">Semua Status</option><option value="active">Aktif</option><option value="draft">Draf</option><option value="paused">Tidak Aktif</option></select>
          <select id="f-channel" onchange="renderTable()" class="px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white"><option value="">Semua Saluran</option><option value="whatsapp">WhatsApp</option><option value="inapp">In-App</option><option value="email">Email</option></select>
          <button onclick="resetFilters()" class="px-3 py-2.5 border border-ink/15 rounded-xl text-sm text-ink/55 hover:bg-ink/5 flex items-center gap-1.5">↺ Reset</button>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl border border-ink/8 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-cream/40 text-[11px] uppercase tracking-wide text-ink/45">
                <tr>
                  <th class="text-left px-4 py-3 font-bold">Nama Automasi</th>
                  <th class="text-left px-4 py-3 font-bold">Kategori</th>
                  <th class="text-left px-4 py-3 font-bold">Pencetus</th>
                  <th class="text-left px-4 py-3 font-bold">Saluran</th>
                  <th class="text-left px-4 py-3 font-bold">Status</th>
                  <th class="text-right px-4 py-3 font-bold">Dihantar</th>
                  <th class="text-right px-4 py-3 font-bold">Berjaya</th>
                  <th class="text-right px-4 py-3 font-bold">Tindakan</th>
                </tr>
              </thead>
              <tbody id="tbody" class="divide-y divide-ink/5"></tbody>
            </table>
          </div>
          <div id="empty" class="hidden px-4 py-16 text-center text-ink/40 text-sm">Tiada automasi. Tekan "+ Cipta Automasi" untuk mula.</div>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="flex items-center justify-between gap-3 flex-wrap">
          <div id="page-info" class="text-[12px] text-ink/50"></div>
          <div id="page-btns" class="flex items-center gap-1"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const DOWN = {0:'Ahd',1:'Isn',2:'Sel',3:'Rab',4:'Kha',5:'Jum',6:'Sab'};
const CH_ICON = { whatsapp:'📲', inapp:'🔔', email:'✉️' };
const CAT = {
  schedule:{l:'Broadcast', c:'bg-purple-100 text-purple-700'}, appointment:{l:'Sesi', c:'bg-blue-100 text-blue-700'},
  package:{l:'Pakej', c:'bg-teal/10 text-teal'}, checkin:{l:'Catatan Harian', c:'bg-green-100 text-green-700'},
  payment:{l:'Bayaran', c:'bg-amber-100 text-amber-700'}, vitals:{l:'Vitals', c:'bg-terracotta/15 text-terracotta'},
  patient:{l:'Pesakit', c:'bg-ink/10 text-ink/60'},
};
const ST_BADGE = { active:['● Aktif','bg-green/10 text-green-dark'], draft:['○ Draf','bg-blue-100 text-blue-700'], paused:['⏸ Tidak Aktif','bg-ink/10 text-ink/50'] };
function autoStatus(a){ return a.status || (a.is_active ? 'active' : 'draft'); }
function timingText(a){
  const t = a.trigger_timing || {};
  if (t.when==='schedule') return `${(Array.isArray(t.days)?t.days:[]).map(d=>DOWN[d]).join(', ')||'—'} · ${t.time||'—'}`;
  if (t.when==='before') return `${t.value||''} ${t.unit==='day'?'hari':t.unit==='week'?'minggu':'jam'} sebelum`;
  if (t.when==='after') return `${t.value||''} ${t.unit==='day'?'hari':t.unit==='week'?'minggu':'jam'} selepas`;
  return 'Pada masa event';
}

let AUTOS = [], STATS = {}, currentPage = 1;
const PAGE_SIZE = 10;

// ── Range picker ──
let rFrom, rTo;
function ymd(d){ const x=new Date(d.getTime()-d.getTimezoneOffset()*60000); return x.toISOString().slice(0,10); }
function fmtLabel(){ const o={day:'2-digit',month:'short',year:'numeric'}; document.getElementById('range-label').textContent = `${new Date(rFrom+'T00:00:00').toLocaleDateString('ms-MY',o)} - ${new Date(rTo+'T00:00:00').toLocaleDateString('ms-MY',o)}`; }
function toggleRangePop(e){ if(e)e.stopPropagation(); document.getElementById('range-pop').classList.toggle('hidden'); }
function _applyPreset(from,to){ rFrom=ymd(from); rTo=ymd(to); document.getElementById('r-from').value=rFrom; document.getElementById('r-to').value=rTo; fmtLabel(); document.getElementById('range-pop').classList.add('hidden'); loadStats(); }
function setPreset(n){ _applyPreset(new Date(Date.now()-(n-1)*86400000), new Date()); }
function applyRange(){ const f=document.getElementById('r-from').value, t=document.getElementById('r-to').value; if(f)rFrom=f; if(t)rTo=t; if(rFrom>rTo){const x=rFrom;rFrom=rTo;rTo=x;} fmtLabel(); document.getElementById('range-pop').classList.add('hidden'); loadStats(); }
window.toggleRangePop=toggleRangePop; window.setPreset=setPreset; window.applyRange=applyRange;
document.addEventListener('click', e=>{ const pop=document.getElementById('range-pop'); if(!pop)return; if(!pop.contains(e.target) && !e.target.closest('[onclick^="toggleRangePop"]')) pop.classList.add('hidden'); });

function resetFilters(){ document.getElementById('f-search').value=''; document.getElementById('f-cat').value=''; document.getElementById('f-status').value=''; document.getElementById('f-channel').value=''; currentPage=1; renderTable(); }

function fillCatFilter(){
  const cats=[...new Set(AUTOS.map(a=>a.trigger_category))];
  document.getElementById('f-cat').innerHTML = '<option value="">Semua Kategori</option>' + cats.map(c=>`<option value="${c}">${esc(CAT[c]?.l||c)}</option>`).join('');
}

function filtered(){
  const q=(document.getElementById('f-search').value||'').trim().toLowerCase();
  const fc=document.getElementById('f-cat').value, fs=document.getElementById('f-status').value, fch=document.getElementById('f-channel').value;
  return AUTOS.filter(a=>{
    if (fc && a.trigger_category!==fc) return false;
    if (fs && autoStatus(a)!==fs) return false;
    if (fch && !(Array.isArray(a.actions)&&a.actions.includes(fch))) return false;
    if (q && !`${a.name||''} ${a.description||''}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderTable(){
  const rows = filtered();
  const total = rows.length, pages = Math.max(1, Math.ceil(total/PAGE_SIZE));
  if (currentPage>pages) currentPage=pages;
  const page = rows.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);
  document.getElementById('empty').classList.toggle('hidden', total>0);
  document.getElementById('tbody').innerHTML = page.map(a=>{
    const st = autoStatus(a), cat = CAT[a.trigger_category]||{l:a.trigger_category,c:'bg-ink/10 text-ink/60'};
    const chs = (Array.isArray(a.actions)?a.actions:[]).map(c=>`<span title="${c}">${CH_ICON[c]||''}</span>`).join(' ');
    const s = STATS[a.id]||{sent:0,failed:0}; const den=s.sent+s.failed; const pct = den?Math.round(s.sent/den*100)+'%':'—';
    return `<tr class="hover:bg-cream/30">
      <td class="px-4 py-3">
        <div class="flex items-center gap-3">
          <span class="w-9 h-9 rounded-lg bg-navy/8 text-navy flex items-center justify-center text-sm flex-shrink-0">⚙️</span>
          <div class="min-w-0"><a href="automation-detail.html?id=${a.id}" class="text-[13px] font-semibold text-ink hover:text-navy hover:underline truncate block">${esc(a.name)}</a><div class="text-[11px] text-ink/45 truncate max-w-[260px]">${esc(a.description||'')}</div></div>
        </div>
      </td>
      <td class="px-4 py-3"><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${cat.c} whitespace-nowrap">${esc(cat.l)}</span></td>
      <td class="px-4 py-3 text-[12px] text-ink/60 whitespace-nowrap">${esc(timingText(a))}</td>
      <td class="px-4 py-3 whitespace-nowrap text-base">${chs||'—'}</td>
      <td class="px-4 py-3"><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${ST_BADGE[st][1]} whitespace-nowrap">${ST_BADGE[st][0]}</span></td>
      <td class="px-4 py-3 text-right text-[13px] font-semibold text-ink/80">${s.sent.toLocaleString()}</td>
      <td class="px-4 py-3 text-right text-[13px] font-semibold ${den?'text-green-dark':'text-ink/35'}">${pct}</td>
      <td class="px-4 py-3">
        <div class="flex items-center justify-end gap-1">
          <a href="automation-builder.html?id=${a.id}" title="Edit" class="w-8 h-8 rounded-lg flex items-center justify-center text-navy hover:bg-navy/8">✎</a>
          <button onclick="setStatus('${a.id}','${st==='active'?'paused':'active'}')" title="${st==='active'?'Jeda':'Aktifkan'}" class="w-8 h-8 rounded-lg flex items-center justify-center ${st==='active'?'text-gold-dark hover:bg-gold/15':'text-green-dark hover:bg-green/10'}">${st==='active'?'⏸':'▶'}</button>
          <button onclick="delAuto('${a.id}')" title="Padam" class="w-8 h-8 rounded-lg flex items-center justify-center text-terracotta hover:bg-terracotta/10">🗑</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  // Pagination
  const start = total?((currentPage-1)*PAGE_SIZE+1):0, end = Math.min(currentPage*PAGE_SIZE, total);
  document.getElementById('page-info').textContent = `Menunjukkan ${start}–${end} daripada ${total} rekod`;
  let btns = `<button onclick="goPage(${currentPage-1})" ${currentPage<=1?'disabled':''} class="px-2.5 py-1.5 rounded-lg border border-ink/15 text-sm ${currentPage<=1?'text-ink/25':'text-ink/60 hover:bg-ink/5'}">‹</button>`;
  for (let p=1;p<=pages;p++){ btns += `<button onclick="goPage(${p})" class="px-3 py-1.5 rounded-lg border text-sm ${p===currentPage?'border-navy bg-navy text-white':'border-ink/15 text-ink/60 hover:bg-ink/5'}">${p}</button>`; }
  btns += `<button onclick="goPage(${currentPage+1})" ${currentPage>=pages?'disabled':''} class="px-2.5 py-1.5 rounded-lg border border-ink/15 text-sm ${currentPage>=pages?'text-ink/25':'text-ink/60 hover:bg-ink/5'}">›</button>`;
  document.getElementById('page-btns').innerHTML = pages>1 ? btns : '';
}
function goPage(p){ currentPage=p; renderTable(); }
window.goPage=goPage; window.renderTable=renderTable; window.resetFilters=resetFilters;

async function loadStats(){
  const since = rFrom+'T00:00:00.000Z', until = rTo+'T23:59:59.999Z';
  const { data } = await window.db.from('psy_notification_logs').select('automation_id,status,created_at').gte('created_at',since).lte('created_at',until);
  STATS = {};
  (data||[]).forEach(l=>{ if(!l.automation_id)return; (STATS[l.automation_id]||=({sent:0,failed:0})); if(l.status==='sent')STATS[l.automation_id].sent++; else if(l.status==='failed')STATS[l.automation_id].failed++; });
  renderTable();
}

async function loadAutos(){
  const { data } = await window.db.from('psy_automations').select('*').order('created_at',{ascending:false});
  AUTOS = data||[];
  fillCatFilter();
  await loadStats();
}

async function setStatus(id,newStatus){
  const { error } = await window.db.from('psy_automations').update({ status:newStatus, is_active:newStatus==='active', updated_at:new Date().toISOString() }).eq('id',id);
  if (error){ banner('Ralat: '+error.message,'error'); return; }
  banner(newStatus==='active'?'Automasi diaktifkan ✅':'Automasi dijeda (Tidak Aktif)');
  loadAutos();
}
async function delAuto(id){
  const a=AUTOS.find(x=>x.id===id); if(!a)return;
  if (!confirm(`Padam automasi "${a.name}"?\n\nTindakan ini kekal.`)) return;
  const { error } = await window.db.from('psy_automations').delete().eq('id',id);
  if (error){ banner('Ralat padam: '+error.message,'error'); return; }
  banner('Automasi dipadam ✅'); loadAutos();
}
window.setStatus=setStatus; window.delAuto=delAuto;

(async () => {
  const user = await initStaff('auto_list', 'Senarai Automasi', 'auto_messages');
  if (!user) return;
  rFrom = ymd(new Date(Date.now()-6*86400000)); rTo = ymd(new Date());
  document.getElementById('r-from').value=rFrom; document.getElementById('r-to').value=rTo; fmtLabel();
  await loadAutos();
})();
</script>
</body>
</html>
