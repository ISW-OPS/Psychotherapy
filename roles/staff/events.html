<script>
    function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
let allEvents = [];
let regCounts = {};   // event_id -> count of active registrations
let hadirCounts = {}; // event_id -> count hadir
let currentRegs = [];
let currentEventForRegs = null;
let evPage = 1;

const TYPE_EMOJI = { kelas:'🧘', webinar:'🎥', bimbingan_pra_ob:'🌱', komuniti:'🤝', challenge:'🏆', manzil:'🕌' };
const STATUS_CLS = {
  published: 'bg-green-light text-green-dark', draft: 'bg-ink/10 text-ink/60',
  completed: 'bg-navy-light text-navy', cancelled: 'bg-terracotta/15 text-terracotta',
};

function toLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtWhen(s, e) {
  const d = new Date(s);
  const day = d.toLocaleDateString(LCALE(), { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
  const t = d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  const t2 = e ? '–' + new Date(e).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }) : '';
  return `${day} · ${t}${t2}`;
}

const TYPE_LABEL = { kelas:'KELAS', webinar:'WEBINAR', bimbingan_pra_ob:'BIMBINGAN PRA OB', komuniti:'KOMUNITI', manzil:'BACAAN MANZIL', challenge:'CHALLENGE' };
const TYPE_BADGE = { kelas:'bg-green-600', webinar:'bg-navy', bimbingan_pra_ob:'bg-teal', komuniti:'bg-teal', manzil:'bg-purple-600', challenge:'bg-gold-dark', default:'bg-navy' };
const GRAD = { kelas:'from-navy to-teal', webinar:'from-[#2f7fc8] to-[#54b3cf]', bimbingan_pra_ob:'from-green to-green-dark', komuniti:'from-green to-green-dark', manzil:'from-[#0e2a4a] to-[#16604a]', challenge:'from-gold to-gold-dark', default:'from-navy to-navy-dark' };
function evStatusDisplay(ev) {
  if (ev.status === 'draft') return { l:'DRAFT', c:'bg-ink/15 text-ink/60' };
  if (ev.status === 'cancelled') return { l:'DIBATAL', c:'bg-terracotta/15 text-terracotta' };
  if (ev.status === 'completed') return { l:'SELESAI', c:'bg-navy-light text-navy' };
  return new Date(ev.start_at) > new Date() ? { l:'SCHEDULED', c:'bg-[#dbeafe] text-[#1d4ed8]' } : { l:'PUBLISHED', c:'bg-green-light text-green-dark' };
}
function evGoPage(p) { evPage = Math.max(1, p); renderEvents(); }

function renderEvents() {
  const now = new Date();
  const type = document.getElementById('f-type').value;
  const status = document.getElementById('f-status').value;
  const time = document.getElementById('f-time').value;
  const q = (document.getElementById('f-search').value || '').toLowerCase().trim();
  let list = allEvents.filter(ev => {
    if (type && ev.type !== type) return false;
    if (status && ev.status !== status) return false;
    const refPast = new Date(ev.end_at || ev.start_at) < now;
    if (time === 'upcoming' && refPast) return false;
    if (time === 'past' && !refPast) return false;
    if (q && !((ev.title || '') + ' ' + (ev.host || '') + ' ' + (ev.tag || '') + ' ' + (ev.type || '')).toLowerCase().includes(q)) return false;
    return true;
  });
  list.sort((a, b) => time === 'past' ? new Date(b.start_at) - new Date(a.start_at) : new Date(a.start_at) - new Date(b.start_at));

  const pageSize = parseInt(document.getElementById('f-pagesize').value) || 6;
  const pages = Math.max(1, Math.ceil(list.length / pageSize));
  if (evPage > pages) evPage = pages;
  const slice = list.slice((evPage - 1) * pageSize, evPage * pageSize);
  const grid = document.getElementById('events-grid');
  if (!slice.length) { grid.innerHTML = '<div class="col-span-full text-center py-16 text-ink/40 text-sm">Tiada acara ditemui.</div>'; document.getElementById('ev-pager').innerHTML = ''; return; }

  grid.innerHTML = slice.map(ev => {
    const reg = regCounts[ev.id] || 0, had = hadirCounts[ev.id] || 0;
    const cap = ev.capacity ? `${reg}/${ev.capacity}` : `${reg}`;
    const tdk = (new Date(ev.end_at || ev.start_at) < now) ? Math.max(0, reg - had) : 0;
    const sd = evStatusDisplay(ev);
    const cover = ev.cover_image ? `style="background-image:url('${ev.cover_image}');background-size:cover;background-position:center;"` : '';
    return `<div class="bg-white rounded-2xl border border-ink/8 shadow-sm overflow-hidden flex flex-col">
      <div class="relative h-28 ${ev.cover_image ? '' : 'bg-gradient-to-br ' + (GRAD[ev.type] || GRAD.default)}" ${cover}>
        ${ev.cover_image ? '<div class="absolute inset-0 bg-black/10"></div>' : `<div class="absolute inset-0 flex items-center justify-center text-4xl opacity-90">${TYPE_EMOJI[ev.type] || '📅'}</div>`}
        <span class="absolute top-2.5 left-2.5 text-[9px] font-bold uppercase tracking-wide text-white px-2 py-0.5 rounded ${TYPE_BADGE[ev.type] || TYPE_BADGE.default}">${TYPE_LABEL[ev.type] || (ev.type || 'ACARA').toUpperCase()}</span>
        <span class="absolute top-2.5 right-2.5 text-[9px] font-bold uppercase tracking-wide px-2 py-0.5 rounded ${sd.c}">${sd.l}</span>
      </div>
      <div class="p-4 flex-1 flex flex-col">
        <div class="font-bold text-ink text-sm leading-snug">${ev.title}</div>
        <div class="text-[11px] text-ink/55 mt-2 space-y-1">
          <div>🗓️ ${new Date(ev.start_at).toLocaleDateString(LCALE(),{weekday:'short',day:'2-digit',month:'short',year:'numeric'})} · ${new Date(ev.start_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}${ev.end_at?' – '+new Date(ev.end_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):''}</div>
          <div>${ev.mode==='f2f'?'📍 '+(ev.location||'Bersemuka'):'💻 Online (Google Meet)'}${ev.host?' · 👤 '+ev.host:''}</div>
        </div>
        <div class="mt-3 pt-3 border-t border-ink/5 grid grid-cols-3 text-center text-[10px] text-ink/45">
          <div><div class="text-sm font-extrabold text-navy">${cap}</div>Pendaftar</div>
          <div><div class="text-sm font-extrabold text-green-dark">${had}</div>Hadir</div>
          <div><div class="text-sm font-extrabold text-terracotta">${tdk}</div>Tidak Hadir</div>
        </div>
        <div class="mt-3 grid grid-cols-2 gap-2">
          <a href="acara-detail.html?id=${ev.id}" class="text-center text-[12px] font-bold text-navy hover:underline">Lihat Detail ›</a>
          <a href="acara-detail.html?id=${ev.id}#persediaan" data-rbac="events.view" class="text-center text-[12px] font-bold text-teal hover:underline">🧰 Persediaan</a>
        </div>
      </div>
    </div>`;
  }).join('');

  let pg = `<button onclick="evGoPage(${evPage-1})" ${evPage<=1?'disabled':''} class="w-8 h-8 rounded-lg border border-ink/15 text-ink/50 disabled:opacity-30 hover:bg-ink/5">‹</button>`;
  for (let i = 1; i <= pages; i++) {
    if (pages > 7 && i > 2 && i < pages - 1 && Math.abs(i - evPage) > 1) { if (i === 3) pg += '<span class="px-1 text-ink/30">…</span>'; continue; }
    pg += `<button onclick="evGoPage(${i})" class="w-8 h-8 rounded-lg text-sm font-semibold ${i===evPage?'bg-green text-white':'border border-ink/15 text-ink/60 hover:bg-ink/5'}">${i}</button>`;
  }
  pg += `<button onclick="evGoPage(${evPage+1})" ${evPage>=pages?'disabled':''} class="w-8 h-8 rounded-lg border border-ink/15 text-ink/50 disabled:opacity-30 hover:bg-ink/5">›</button>`;
  document.getElementById('ev-pager').innerHTML = pages > 1 ? pg : '';
}

async function openEventModal(id) {
  const ev = id ? allEvents.find(e => e.id === id) : null;
  document.getElementById('ev-modal-title').textContent = ev ? '✏️ Edit Acara' : '📅 Acara Baru';
  const set = (k, v) => document.getElementById('ev-' + k).value = v ?? '';
  document.getElementById('ev-id').value = ev?.id || '';
  set('title', ev?.title); set('type', ev?.type || 'kelas'); set('tag', ev?.tag);
  set('start', toLocalInput(ev?.start_at)); set('end', toLocalInput(ev?.end_at));
  set('mode', ev?.mode || 'online'); set('capacity', ev?.capacity);
  set('meet', ''); set('location', ev?.location); set('host', ev?.host);
  set('price', ev?.price ?? 0); set('desc', ev?.description); set('recording', ev?.recording_url);
  set('status', ev?.status || 'published');
  document.getElementById('ev-error').classList.add('hidden');
  document.getElementById('ev-modal').classList.remove('hidden');
  // Audit #H-36 (Tier 5) — meet_link kini di psy_event_meet_links (staf full access)
  if (ev?.id) {
    const { data: ml } = await window.db.from('psy_event_meet_links').select('meet_link').eq('event_id', ev.id).maybeSingle();
    set('meet', ml?.meet_link || '');
  }
}
function closeEventModal() { document.getElementById('ev-modal').classList.add('hidden'); }

async function saveEvent() {
  const errEl = document.getElementById('ev-error');
  errEl.classList.add('hidden');
  const v = k => document.getElementById('ev-' + k).value.trim();
  const title = v('title'), start = v('start');
  if (!title) { errEl.textContent = 'Tajuk wajib diisi'; errEl.classList.remove('hidden'); return; }
  if (!start) { errEl.textContent = 'Tarikh/masa mula wajib diisi'; errEl.classList.remove('hidden'); return; }
  const payload = {
    title,
    type: v('type'),
    tag: v('tag') || null,
    start_at: new Date(start).toISOString(),
    end_at: v('end') ? new Date(v('end')).toISOString() : null,
    mode: v('mode'),
    capacity: v('capacity') ? parseInt(v('capacity')) : null,
    location: v('location') || null,
    host: v('host') || null,
    price: parseFloat(v('price')) || 0,
    description: v('desc') || null,
    recording_url: v('recording') || null,
    status: v('status'),
    updated_at: new Date().toISOString(),
  };
  const btn = document.getElementById('ev-save-btn');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    const id = document.getElementById('ev-id').value;
    let eventId = id;
    if (id) {
      const prev = allEvents.find(e => e.id === id);
      const { error } = await window.db.from('psy_events').update(payload).eq('id', id);
      if (error) throw error;
      // Maklum pesakit berdaftar bila acara baru dibatalkan
      if (payload.status === 'cancelled' && prev && prev.status !== 'cancelled') notifyCancellation(id, title);
    } else {
      payload.created_by = window.currentUser.id;
      const { data: inserted, error } = await window.db.from('psy_events').insert(payload).select('id').single();
      if (error) throw error;
      eventId = inserted.id;
    }
    // Audit #H-36 (Tier 5) — meet_link disimpan berasingan (psy_event_meet_links)
    await window.db.from('psy_event_meet_links').upsert({ event_id: eventId, meet_link: v('meet') || null, updated_at: new Date().toISOString() });
    banner('Acara disimpan ✅');
    closeEventModal();
    await loadEvents();
  } catch (e) {
    errEl.textContent = 'Ralat: ' + e.message; errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = '💾 Simpan';
  }
}

async function notifyCancellation(eventId, title) {
  try {
    const { data } = await window.db.from('psy_event_registrations')
      .select('psy_patients(user_id)').eq('event_id', eventId).neq('status', 'batal');
    const ids = [...new Set((data || []).map(r => r.psy_patients?.user_id).filter(Boolean))];
    await Promise.all(ids.map(uid => notify(uid, 'system', 'Acara dibatalkan',
      `Acara "${title}" yang anda daftar telah dibatalkan. Maaf atas kesulitan.`, 'events.html')));
  } catch (e) { console.warn('cancel notify failed:', e.message); }
}

async function deleteEvent(id) {
  if (!confirm('Padam acara ini? Pendaftaran berkaitan juga akan dipadam.')) return;
  const { error } = await window.db.from('psy_events').delete().eq('id', id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  banner('Acara dipadam');
  await loadEvents();
}

async function openRegs(eventId) {
  currentEventForRegs = eventId;
  document.getElementById('reg-hadir-only').checked = false;
  document.getElementById('reg-list').innerHTML = '<div class="text-sm text-ink/40 text-center py-8">Memuatkan...</div>';
  document.getElementById('reg-modal').classList.remove('hidden');
  await fetchRegs();
}

async function fetchRegs() {
  const { data } = await window.db.from('psy_event_registrations')
    .select('id, status, registered_at, patient_id, psy_patients(full_name, mrn)')
    .eq('event_id', currentEventForRegs).neq('status', 'batal').order('registered_at', { ascending: true });
  currentRegs = data || [];
  const ev = allEvents.find(e => e.id === currentEventForRegs);
  const had = currentRegs.filter(r => r.status === 'hadir').length;
  document.getElementById('reg-title').textContent = 'Pendaftar — ' + (ev?.title || '');
  document.getElementById('reg-sub').textContent = `${currentRegs.length} pendaftar · ${had} hadir`;
  renderRegs();
}

function renderRegs() {
  const hadirOnly = document.getElementById('reg-hadir-only').checked;
  const rows = hadirOnly ? currentRegs.filter(r => r.status === 'hadir') : currentRegs;
  const list = document.getElementById('reg-list');
  list.innerHTML = rows.length ? rows.map(r => {
    const p = r.psy_patients || {};
    const attended = r.status === 'hadir';
    return `<div class="flex items-center gap-3 py-3">
      <div class="flex-1 min-w-0">
        <div class="text-sm font-semibold text-ink truncate">${p.full_name || 'Pesakit'}</div>
        <div class="text-[10px] text-ink/45">${p.mrn || ''} · daftar ${new Date(r.registered_at).toLocaleDateString(LCALE(),{day:'2-digit',month:'short'})}</div>
      </div>
      <button onclick="markAttend('${r.id}','${attended ? 'registered' : 'hadir'}')" data-rbac="events.edit"
        class="text-[11px] font-bold px-2.5 py-1 rounded-lg ${attended ? 'bg-green text-white' : 'bg-ink/5 text-ink/60 hover:bg-ink/10'}">
        ${attended ? '✓ Hadir' : 'Tanda Hadir'}
      </button>
    </div>`;
  }).join('') : '<div class="text-sm text-ink/40 text-center py-8">Tiada pendaftar.</div>';
}

async function markAttend(regId, newStatus) {
  const { error } = await window.db.from('psy_event_registrations').update({ status: newStatus }).eq('id', regId);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  await fetchRegs();   // refresh senarai + kiraan
  loadEvents();        // kemaskini kiraan pada kad (latar belakang)
}

function exportRegs() {
  const ev = allEvents.find(e => e.id === currentEventForRegs);
  if (!currentRegs.length) { banner('Tiada pendaftar untuk dieksport', 'error'); return; }
  const head = ['Nama', 'MRN', 'Status', 'Tarikh Daftar'];
  const lines = currentRegs.map(r => {
    const p = r.psy_patients || {};
    return [p.full_name || '', p.mrn || '', r.status === 'hadir' ? 'Hadir' : 'Daftar',
      new Date(r.registered_at).toLocaleString(LCALE())];
  });
  const csv = [head, ...lines].map(row => row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pendaftar-${(ev?.title || 'acara').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}.csv`;
  a.click();
}

async function loadEvents() {
  const { data: evs } = await window.db.from('psy_events').select('*').order('start_at', { ascending: false });
  allEvents = evs || [];
  // Count active registrations per event (staff can read all via RLS)
  regCounts = {}; hadirCounts = {};
  const { data: regs } = await window.db.from('psy_event_registrations').select('event_id, status').neq('status', 'batal');
  (regs || []).forEach(r => {
    regCounts[r.event_id] = (regCounts[r.event_id] || 0) + 1;
    if (r.status === 'hadir') hadirCounts[r.event_id] = (hadirCounts[r.event_id] || 0) + 1;
  });
  renderEvents();
}

(async () => {
  const user = await initStaff('events_admin', 'Urus acara & kelas komuniti');
  if (!user) return;
  await loadEvents();
  const qp = new URLSearchParams(location.search);
  const ed = qp.get('edit');
  if (ed && allEvents.some(e => e.id === ed)) openEventModal(ed);
  const rg = qp.get('regs');
  if (rg && allEvents.some(e => e.id === rg)) openRegs(rg);
})();
</script>
