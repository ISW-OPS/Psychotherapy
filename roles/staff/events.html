<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Acara & Kelas</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📅</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">
        <div class="bg-navy-light/50 border border-navy/20 rounded-xl p-4 text-sm text-navy">
          📅 Acara/kelas yang <strong>published</strong> akan dipaparkan di halaman "Acara &amp; Kelas" pesakit. Pesakit boleh mendaftar (RSVP) &amp; sertai melalui pautan.
        </div>

        <div class="flex items-center justify-between gap-3 flex-wrap">
          <select id="f-status" onchange="renderEvents()" class="border border-ink/15 rounded-lg px-3 py-2 text-sm bg-white outline-none">
            <option value="">Semua status</option>
            <option value="published">Published</option>
            <option value="draft">Draft</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <button onclick="openEventModal()" class="bg-navy text-white text-sm px-4 py-2.5 rounded-xl font-semibold hover:bg-navy-dark">+ Acara Baru</button>
        </div>

        <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
      </div>
    </main>
  </div>
</div>

<!-- Create/Edit modal -->
<div id="ev-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="relative bg-white rounded-2xl max-w-lg w-full max-h-[92vh] flex flex-col overflow-hidden">
    <div class="px-5 py-4 border-b border-ink/10 flex items-center justify-between">
      <h3 id="ev-modal-title" class="font-bold text-lg">📅 Acara Baru</h3>
      <button onclick="closeEventModal()" class="text-ink/50 text-xl leading-none">&times;</button>
    </div>
    <div class="p-5 space-y-3 overflow-y-auto">
      <input id="ev-id" type="hidden">
      <div>
        <label class="text-xs font-semibold text-ink/70">Tajuk *</label>
        <input id="ev-title" maxlength="120" placeholder="Cth: Kelas Mindfulness Percuma" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-ink/70">Jenis</label>
          <select id="ev-type" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm bg-white">
            <option value="kelas">Kelas</option>
            <option value="webinar">Webinar</option>
            <option value="komuniti">Komuniti</option>
            <option value="challenge">Challenge</option>
            <option value="manzil">Manzil</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-ink/70">Tag (label kad)</label>
          <input id="ev-tag" placeholder="Cth: Kelas, Webinar" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-ink/70">Mula *</label>
          <input id="ev-start" type="datetime-local" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
        </div>
        <div>
          <label class="text-xs font-semibold text-ink/70">Tamat</label>
          <input id="ev-end" type="datetime-local" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-ink/70">Mod</label>
          <select id="ev-mode" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm bg-white">
            <option value="online">Online</option>
            <option value="f2f">Bersemuka (F2F)</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-ink/70">Had peserta</label>
          <input id="ev-capacity" type="number" min="1" placeholder="(kosong = tiada had)" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/70">Pautan Google Meet / Zoom</label>
        <input id="ev-meet" placeholder="https://meet.google.com/..." class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/70">Lokasi (jika F2F)</label>
        <input id="ev-location" placeholder="Cth: Bilik Rawatan 1, ISW" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-ink/70">Host / Penceramah</label>
          <input id="ev-host" placeholder="Cth: Coach Aisyah" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
        </div>
        <div>
          <label class="text-xs font-semibold text-ink/70">Harga (RM, 0 = percuma)</label>
          <input id="ev-price" type="number" min="0" step="0.01" placeholder="0" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/70">Penerangan</label>
        <textarea id="ev-desc" rows="3" placeholder="Penerangan ringkas acara..." class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm"></textarea>
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/70">Pautan rakaman (selepas acara)</label>
        <input id="ev-recording" placeholder="https://..." class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/70">Status</label>
        <select id="ev-status" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm bg-white">
          <option value="published">Published (papar ke pesakit)</option>
          <option value="draft">Draft (sembunyi)</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div id="ev-error" class="hidden text-xs text-terracotta bg-terracotta/10 rounded-lg px-3 py-2"></div>
    </div>
    <div class="px-5 py-4 border-t border-ink/10 flex gap-2">
      <button onclick="closeEventModal()" class="flex-1 border border-ink/20 text-ink/70 rounded-lg py-2.5 text-sm font-semibold hover:bg-ink/5">Batal</button>
      <button id="ev-save-btn" onclick="saveEvent()" class="flex-1 bg-navy text-white rounded-lg py-2.5 text-sm font-semibold">💾 Simpan</button>
    </div>
  </div>
</div>

<!-- Registrations modal -->
<div id="reg-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="relative bg-white rounded-2xl max-w-md w-full max-h-[88vh] flex flex-col overflow-hidden">
    <div class="px-5 py-4 border-b border-ink/10 flex items-center justify-between">
      <h3 id="reg-title" class="font-bold text-lg">Pendaftar</h3>
      <button onclick="document.getElementById('reg-modal').classList.add('hidden')" class="text-ink/50 text-xl leading-none">&times;</button>
    </div>
    <div id="reg-list" class="p-4 overflow-y-auto divide-y divide-ink/5"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let allEvents = [];
let regCounts = {};   // event_id -> count of active registrations

const TYPE_EMOJI = { kelas:'🧘', webinar:'🎥', komuniti:'🤝', challenge:'🏆', manzil:'🕌' };
const STATUS_CLS = {
  published: 'bg-green-light text-green-dark', draft: 'bg-ink/10 text-ink/60',
  completed: 'bg-navy-light text-navy', cancelled: 'bg-terracotta/15 text-terracotta',
};

function toLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtWhen(s, e) {
  const d = new Date(s);
  const day = d.toLocaleDateString('ms-MY', { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
  const t = d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  const t2 = e ? '–' + new Date(e).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }) : '';
  return `${day} · ${t}${t2}`;
}

function renderEvents() {
  const filter = document.getElementById('f-status').value;
  const list = (filter ? allEvents.filter(e => e.status === filter) : allEvents)
    .slice().sort((a, b) => new Date(b.start_at) - new Date(a.start_at));
  const grid = document.getElementById('events-grid');
  if (!list.length) { grid.innerHTML = '<div class="col-span-full text-center py-16 text-ink/40 text-sm">Tiada acara. Klik "+ Acara Baru".</div>'; return; }
  grid.innerHTML = list.map(ev => {
    const cnt = regCounts[ev.id] || 0;
    const cap = ev.capacity ? `${cnt}/${ev.capacity}` : `${cnt}`;
    return `<div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-4 flex flex-col">
      <div class="flex items-start justify-between gap-2 mb-1">
        <div class="font-bold text-ink text-sm leading-snug">${TYPE_EMOJI[ev.type]||'📅'} ${ev.title}</div>
        <span class="text-[9px] font-bold uppercase px-2 py-0.5 rounded-full whitespace-nowrap ${STATUS_CLS[ev.status]||'bg-ink/10'}">${ev.status}</span>
      </div>
      <div class="text-[11px] text-ink/55">🗓️ ${fmtWhen(ev.start_at, ev.end_at)}</div>
      <div class="text-[11px] text-ink/50 mt-0.5">${ev.mode === 'f2f' ? '🏥 '+(ev.location||'F2F') : '💻 Online'} ${ev.host ? '· 👤 '+ev.host : ''}</div>
      <div class="mt-3 pt-3 border-t border-ink/5 flex items-center justify-between gap-2">
        <button onclick="openRegs('${ev.id}')" class="text-[11px] font-semibold text-navy hover:underline">👥 ${cap} pendaftar</button>
        <div class="flex items-center gap-1.5">
          <button onclick="openEventModal('${ev.id}')" class="text-[11px] font-semibold text-ink/60 border border-ink/20 px-2.5 py-1 rounded-lg hover:bg-ink/5">✏️ Edit</button>
          <button onclick="deleteEvent('${ev.id}')" class="text-[11px] font-semibold text-terracotta border border-terracotta/30 px-2.5 py-1 rounded-lg hover:bg-terracotta/5">🗑️</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openEventModal(id) {
  const ev = id ? allEvents.find(e => e.id === id) : null;
  document.getElementById('ev-modal-title').textContent = ev ? '✏️ Edit Acara' : '📅 Acara Baru';
  const set = (k, v) => document.getElementById('ev-' + k).value = v ?? '';
  document.getElementById('ev-id').value = ev?.id || '';
  set('title', ev?.title); set('type', ev?.type || 'kelas'); set('tag', ev?.tag);
  set('start', toLocalInput(ev?.start_at)); set('end', toLocalInput(ev?.end_at));
  set('mode', ev?.mode || 'online'); set('capacity', ev?.capacity);
  set('meet', ev?.meet_link); set('location', ev?.location); set('host', ev?.host);
  set('price', ev?.price ?? 0); set('desc', ev?.description); set('recording', ev?.recording_url);
  set('status', ev?.status || 'published');
  document.getElementById('ev-error').classList.add('hidden');
  document.getElementById('ev-modal').classList.remove('hidden');
}
function closeEventModal() { document.getElementById('ev-modal').classList.add('hidden'); }

async function saveEvent() {
  const errEl = document.getElementById('ev-error');
  errEl.classList.add('hidden');
  const v = k => document.getElementById('ev-' + k).value.trim();
  const title = v('title'), start = v('start');
  if (!title) { errEl.textContent = 'Tajuk wajib diisi'; errEl.classList.remove('hidden'); return; }
  if (!start) { errEl.textContent = 'Tarikh/masa mula wajib diisi'; errEl.classList.remove('hidden'); return; }
  const payload = {
    title,
    type: v('type'),
    tag: v('tag') || null,
    start_at: new Date(start).toISOString(),
    end_at: v('end') ? new Date(v('end')).toISOString() : null,
    mode: v('mode'),
    capacity: v('capacity') ? parseInt(v('capacity')) : null,
    meet_link: v('meet') || null,
    location: v('location') || null,
    host: v('host') || null,
    price: parseFloat(v('price')) || 0,
    description: v('desc') || null,
    recording_url: v('recording') || null,
    status: v('status'),
    updated_at: new Date().toISOString(),
  };
  const btn = document.getElementById('ev-save-btn');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    const id = document.getElementById('ev-id').value;
    if (id) {
      const { error } = await window.db.from('psy_events').update(payload).eq('id', id);
      if (error) throw error;
    } else {
      payload.created_by = window.currentUser.id;
      const { error } = await window.db.from('psy_events').insert(payload);
      if (error) throw error;
    }
    banner('Acara disimpan ✅');
    closeEventModal();
    await loadEvents();
  } catch (e) {
    errEl.textContent = 'Ralat: ' + e.message; errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = '💾 Simpan';
  }
}

async function deleteEvent(id) {
  if (!confirm('Padam acara ini? Pendaftaran berkaitan juga akan dipadam.')) return;
  const { error } = await window.db.from('psy_events').delete().eq('id', id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  banner('Acara dipadam');
  await loadEvents();
}

async function openRegs(eventId) {
  const ev = allEvents.find(e => e.id === eventId);
  document.getElementById('reg-title').textContent = 'Pendaftar — ' + ev.title;
  const list = document.getElementById('reg-list');
  list.innerHTML = '<div class="text-sm text-ink/40 text-center py-8">Memuatkan...</div>';
  document.getElementById('reg-modal').classList.remove('hidden');
  const { data: regs } = await window.db.from('psy_event_registrations')
    .select('id, status, registered_at, patient_id, psy_patients(full_name, mrn)')
    .eq('event_id', eventId).neq('status', 'batal').order('registered_at', { ascending: true });
  const rows = regs || [];
  list.innerHTML = rows.length ? rows.map(r => {
    const p = r.psy_patients || {};
    const attended = r.status === 'hadir';
    return `<div class="flex items-center gap-3 py-3">
      <div class="flex-1 min-w-0">
        <div class="text-sm font-semibold text-ink truncate">${p.full_name || 'Pesakit'}</div>
        <div class="text-[10px] text-ink/45">${p.mrn || ''} · daftar ${new Date(r.registered_at).toLocaleDateString('ms-MY',{day:'2-digit',month:'short'})}</div>
      </div>
      <button onclick="markAttend('${r.id}','${attended ? 'registered' : 'hadir'}','${eventId}')"
        class="text-[11px] font-bold px-2.5 py-1 rounded-lg ${attended ? 'bg-green text-white' : 'bg-ink/5 text-ink/60 hover:bg-ink/10'}">
        ${attended ? '✓ Hadir' : 'Tanda Hadir'}
      </button>
    </div>`;
  }).join('') : '<div class="text-sm text-ink/40 text-center py-8">Belum ada pendaftar.</div>';
}

async function markAttend(regId, newStatus, eventId) {
  const { error } = await window.db.from('psy_event_registrations').update({ status: newStatus }).eq('id', regId);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  openRegs(eventId);
}

async function loadEvents() {
  const { data: evs } = await window.db.from('psy_events').select('*').order('start_at', { ascending: false });
  allEvents = evs || [];
  // Count active registrations per event (staff can read all via RLS)
  regCounts = {};
  const { data: regs } = await window.db.from('psy_event_registrations').select('event_id, status').neq('status', 'batal');
  (regs || []).forEach(r => { regCounts[r.event_id] = (regCounts[r.event_id] || 0) + 1; });
  renderEvents();
}

(async () => {
  const user = await initStaff('events_admin', 'Urus acara & kelas komuniti');
  if (!user) return;
  await loadEvents();
})();
</script>
</body>
</html>
