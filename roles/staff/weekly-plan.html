<style>
  .day-pill {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-width:56px; padding:8px 6px; border-radius:10px; cursor:pointer;
    border:1.5px solid transparent; transition:all .15s;
  }
  .day-pill:hover { background: rgba(30,30,60,0.04); }
  .day-pill.active { border-color:#1e2b4a; background:#f0f4ff; }
  .day-pill .lbl { font-size:11px; color:rgba(30,30,60,0.55); font-weight:600; }
  .day-pill .num { font-size:18px; font-weight:700; color:#1e2b4a; }

  .col-day { background:white; border:1px solid rgba(30,30,60,0.08); border-radius:12px; padding:12px; min-height:480px; display:flex; flex-direction:column; }
  .col-day.is-active { box-shadow:0 0 0 2px #1e2b4a inset; }
  .col-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .col-title { font-weight:700; font-size:13px; color:#1e2b4a; }
  .col-sub { font-size:11px; color:rgba(30,30,60,0.5); }
  .col-count { background:rgba(30,30,60,0.06); color:#1e2b4a; font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; }

  .sess-card { border-left:3px solid #93c5fd; background:#f8fafc; border-radius:8px; padding:9px 10px; margin-bottom:8px; cursor:pointer; transition:all .15s; }
  .sess-card:hover { transform:translateY(-1px); box-shadow:0 4px 10px rgba(0,0,0,0.06); }
  .sess-card.s-hadir       { border-color:#10b981; }
  .sess-card.s-booked      { border-color:#3b82f6; }
  .sess-card.s-pending     { border-color:#f59e0b; }
  .sess-card.s-reschedule  { border-color:#eab308; }
  .sess-card.s-cancel      { border-color:#ef4444; background:#fef2f2; }
  .sess-time { font-size:11px; font-weight:700; color:#1e2b4a; }
  .sess-name { font-size:13px; font-weight:600; color:#0f172a; margin-top:2px; }
  .sess-type { font-size:11px; color:rgba(30,30,60,0.55); }
  .pill-status { display:inline-block; font-size:10px; font-weight:600; padding:2px 8px; border-radius:999px; margin-top:4px; }
  .ps-hadir      { background:#d1fae5; color:#065f46; }
  .ps-booked     { background:#dbeafe; color:#1e3a8a; }
  .ps-pending    { background:#fef3c7; color:#92400e; }
  .ps-reschedule { background:#fef9c3; color:#713f12; }
  .ps-cancel     { background:#fee2e2; color:#7f1d1d; }

  .filter-btn { padding:7px 14px; border-radius:8px; font-size:12px; font-weight:600; color:rgba(30,30,60,0.6); cursor:pointer; transition:all .15s; }
  .filter-btn.active { background:#1e2b4a; color:white; }
  .filter-btn:not(.active):hover { background:rgba(30,30,60,0.05); color:#1e2b4a; }
</style>
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📅</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>

      <div class="p-4 md:p-8 space-y-5">

        <!-- Coach Profile + Week Navigator -->
        <div class="bg-white rounded-2xl border border-ink/10 p-5 grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Coach Card -->
          <div class="flex items-center gap-4">
            <div id="coach-avatar" class="w-20 h-20 rounded-full bg-ink/5 flex items-center justify-center text-3xl text-ink/40 flex-shrink-0">👤</div>
            <div class="min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <h2 id="coach-name" class="text-lg font-bold text-ink truncate">—</h2>
                <span id="coach-role-badge" class="bg-navy-light text-navy text-[10px] font-bold px-2 py-0.5 rounded-md">Coach</span>

              <p id="coach-email" class="text-[11px] text-ink/60 flex items-center gap-1.5"><span>✉️</span><span class="truncate">—</span></p>
              <p id="coach-phone" class="text-[11px] text-ink/60 flex items-center gap-1.5 mt-0.5"><span>📞</span><span>—</span></p>

        <!-- Schedule -->
        <div class="bg-white rounded-2xl border border-ink/10 p-5">

            <div class="flex items-center gap-2 flex-wrap">

                <button id="vw-week" onclick="setView('week')" class="filter-btn active">Minggu</button>
                <button id="vw-day"  onclick="setView('day')"  class="filter-btn">Hari</button>

              <button onclick="goToday()" class="px-3 py-1.5 border border-ink/15 rounded-lg text-xs font-semibold text-ink/70 hover:bg-cream inline-flex items-center gap-1.5">

                <button id="sc-mine" onclick="setScope('mine')" class="filter-btn active">Saya</button>
                <button id="sc-all"  onclick="setScope('all')"  class="filter-btn">Semua</button>

          <!-- Audit #B2-23 (Tier 4) — reminder task peribadi terlepas tarikh & belum selesai -->
          <button id="task-overdue-banner" onclick="jumpToOverdueTask()" type="button"

      </div>

<script>
    function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
const DAY_SHORT = ['Ahd','Isn','Sel','Rab','Kha','Jum','Sab'];
const DAY_FULL  = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
const MONTHS    = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
const MONTHS_FULL = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];

let weekStart = null;   // Monday 00:00
let viewMode  = 'week'; // 'week' | 'day'
let selectedDayIdx = 0; // 0..4 within Mon..Fri (for day view)
let allSessions = [];   // current week's sessions (after scope filter)
let rawSessions = [];   // before scope filter
let patientMap  = {};   // patient_id → {name, ...}
let myCoachedPatientIds = new Set();
let scope = 'mine';     // 'all' | 'mine' (default to own caseload for coach/doctor)

function startOfWeek(d) {
  const x = new Date(d); x.setHours(0,0,0,0);
  const dow = x.getDay();              // 0 Sun .. 6 Sat
  const diff = (dow === 0 ? -6 : 1 - dow); // shift back to Monday
  x.setDate(x.getDate() + diff);
  return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function sameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

(async () => {
  const user = await initStaff('plan_week', 'Rancang dan urus jadual mingguan anda dengan lebih teratur.');
  if (!user) return;

  // Header buttons (right side of header)
  const header = document.getElementById('page-header');
  if (header && !header.querySelector('#wk-add')) {
    const add = document.createElement('div');
    add.className = 'flex items-center gap-2';
    add.innerHTML = `
      <a id="wk-bell" href="dashboard.html" class="relative w-9 h-9 rounded-lg border border-ink/15 flex items-center justify-center hover:bg-cream text-ink/70">🔔</a>
      <a id="wk-add" href="appointments.html" class="bg-navy text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark inline-flex items-center gap-1.5">＋ Tambah Plan</a>`;
    header.appendChild(add);
  }

  // Profile card
  const roleLbl = ({ coach:'Wellness Coach', doctor:'Pegawai Perubatan' })[user.staff_role] || 'Staff';
  const roleBadge = ({ coach:'Coach', doctor:'Doktor' })[user.staff_role] || 'Staff';
  document.getElementById('coach-name').textContent       = user.full_name || roleBadge;
  document.getElementById('coach-role').textContent       = roleLbl;
  document.getElementById('coach-role-badge').textContent = roleBadge;
  document.getElementById('coach-email').lastElementChild.textContent = user.email || '—';
  document.getElementById('coach-phone').lastElementChild.textContent = user.phone || '—';
  if (user.avatar_url) {
    document.getElementById('coach-avatar').innerHTML = `<img src="${user.avatar_url}" class="w-full h-full rounded-full object-cover">`;
  } else if (user.full_name) {
    const initials = user.full_name.split(/\s+/).slice(0,2).map(s => s[0]).join('').toUpperCase();
    document.getElementById('coach-avatar').innerHTML = `<span class="text-navy font-bold text-2xl">${initials}</span>`;
    document.getElementById('coach-avatar').classList.add('bg-navy-light');
  }

  weekStart = startOfWeek(new Date());
  const todayDow = new Date().getDay();
  selectedDayIdx = todayDow === 0 ? 6 : todayDow - 1;

  await Promise.all([loadCoachedPatients(), buildStaffMap()]);

  // Caseload count (coach only — doctor uses different assignment model)
  const caseloadEl = document.getElementById('coach-caseload');
  if (user.staff_role === 'coach') {
    caseloadEl.lastElementChild.textContent = `${myCoachedPatientIds.size} pesakit di bawah jagaan`;
  } else {
    caseloadEl.classList.add('hidden');
  }

  await loadWeek();
})();

async function loadCoachedPatients() {
  const uid = window.currentUser.id;
  const { data } = await window.db
    .from('psy_patients')
    .select('id, user_id, full_name, mrn, coach_id, psy_profiles!psy_patients_user_id_fkey(full_name)')
    .neq('status', 'deleted');
  (data || []).forEach(p => {
    patientMap[p.id] = {
      name: iswPatientName(p) || p.mrn || 'Pesakit',
      coach_id: p.coach_id,
    };
    if (p.coach_id === uid) myCoachedPatientIds.add(p.id);
  });
}

// Map raw status from each source → canonical status used by UI
function normStatus(src, raw) {
  if (src === 'plan') return raw || 'pending';
  if (src === 'appt') return ({
    scheduled:'booked', checked_in:'booked', in_progress:'booked',
    completed:'hadir', no_show:'cancel', cancelled:'cancel',
  })[raw] || 'pending';
  if (src === 'coach') return ({
    completed:'hadir', no_show:'cancel', cancelled:'cancel',
  })[raw] || 'pending';
  if (src === 'hk1') return ({
    pending:'pending', accepted:'booked', resolved:'hadir', declined:'cancel',
  })[raw] || 'pending';
  return 'pending';
}

const HK1_LABEL = { hakeema: 'Hakeema Session', hakeem: 'Hakeem Session', dr: 'Dr Session', fisioterapi: 'Fisioterapi Session', kaunselor: 'Kaunselor Session', bekam: 'Bekam Session', masseur: 'Masseur Session' };
const HK1_BADGE = { hakeema: '🧑‍💼', hakeem: '🧑', dr: '🩺', fisioterapi: '🏃', kaunselor: '🗣️', bekam: '🩸', masseur: '💆' };

async function loadWeek() {
  const weekEnd = addDays(weekStart, 7);
  const role = window.currentUser.staff_role;

  const [planRes, apptRes, coachRes, hk1Res] = await Promise.all([
    window.db.from('psy_plan_weekly_progress')
      .select('id, plan_id, patient_id, week_number, session_date, status, notes, score, session_type, meet_link, substitute_coach_id, updated_at, updated_by_name')
      .gte('session_date', weekStart.toISOString())
      .lt('session_date',  weekEnd.toISOString())
      .then(r => r.data || [], () => []),
    window.db.from('psy_appointments')
      .select('id, patient_id, staff_id, staff_name, service, appointment_time, duration_min, status, room')
      .gte('appointment_time', weekStart.toISOString())
      .lt('appointment_time',  weekEnd.toISOString())
      .then(r => r.data || [], () => []),
    window.db.from('psy_coaching_sessions')
      .select('id, patient_id, coach_id, pillar, session_date, duration_min, status')
      .gte('session_date', weekStart.toISOString())
      .lt('session_date',  weekEnd.toISOString())
      .then(r => r.data || [], () => []),
    // Sesi 1:1 (Hakeema/Hakeem/Dr) — psy_clinical_referrals source='plan_1on1'.
    // Dulu tak muncul langsung dalam Jadual Mingguan (tiada baris psy_appointments
    // dicipta untuk sesi ni — hk1CheckSlotConflict cuma BACA psy_appointments utk
    // semak konflik, tak pernah tulis ke situ).
    window.db.from('psy_clinical_referrals')
      .select('id, patient_id, target_id, plan_id, week_number, session_type, meet_date, status, consultation')
      .eq('source', 'plan_1on1')
      .gte('meet_date', weekStart.toISOString().slice(0, 10))
      .lt('meet_date',  weekEnd.toISOString().slice(0, 10))
      .then(r => r.data || [], () => []),
  ]);

  // Normalise to one shape, then dedupe by (patient_id + start_time) — plan-week
  // rows that also have a linked psy_appointment shouldn't appear twice.
  const events = [];

  planRes.forEach(s => events.push({
    source:'plan', id:s.id, plan_id:s.plan_id, patient_id:s.patient_id,
    title: iswPeriodLabel(s.week_number), subtitle:'Sesi Coaching',
    start: s.session_date, status: normStatus('plan', s.status),
    updated_at: s.updated_at, week_number: s.week_number,
    notes: s.notes, score: s.score,
    session_type: s.session_type, meet_link: s.meet_link,
    substitute_coach_id: s.substitute_coach_id,
    href: `plan-week.html?plan_id=${s.plan_id}&week=${s.week_number}`,
  }));

  apptRes.forEach(a => events.push({
    source:'appt', id:a.id, patient_id:a.patient_id, staff_id:a.staff_id,
    title:a.service || 'Appointment',
    subtitle: a.room ? `Bilik ${a.room}` : (a.staff_name || ''),
    start: a.appointment_time, status: normStatus('appt', a.status),
    href: `patient-hub.html?patient_id=${a.patient_id}`,
  }));

  coachRes.forEach(c => events.push({
    source:'coach', id:c.id, patient_id:c.patient_id, coach_id:c.coach_id,
    title: c.pillar ? `Coaching · ${c.pillar}` : 'Coaching',
    subtitle:'Sesi Pillar', start: c.session_date,
    status: normStatus('coach', c.status),
    href: `patient-hub.html?patient_id=${c.patient_id}`,
  }));

  hk1Res.forEach(h => {
    const time = h.consultation?.scheduled_time || '00:00';
    events.push({
      source:'hk1', id:h.id, patient_id:h.patient_id, staff_id:h.target_id,
      title: HK1_LABEL[h.session_type] || 'Sesi 1:1',
      subtitle: h.consultation?.scheduled_time ? '' : 'Masa belum ditetapkan',
      start: `${h.meet_date}T${time}:00`, status: normStatus('hk1', h.status),
      session_type: h.session_type,
      href: h.plan_id
        ? `plan-week.html?plan_id=${h.plan_id}&week=${h.week_number}`
        : `sesi-1on1-detail.html?patient_id=${h.patient_id}`,
    });
  });

  // Dedupe: if a `plan` row and an `appt` row share patient_id within ±5 min,
  // prefer the `plan` row (richer link to plan-week.html).
  const dedup = [];
  events.sort((a, b) => new Date(a.start) - new Date(b.start));
  events.forEach(ev => {
    const t = new Date(ev.start).getTime();
    const dup = dedup.find(x =>
      x.patient_id === ev.patient_id && Math.abs(new Date(x.start).getTime() - t) < 5 * 60 * 1000
    );
    if (dup) {
      if (ev.source === 'plan' && dup.source !== 'plan') {
        Object.assign(dup, ev);
      }
      return;
    }
    dedup.push(ev);
  });

  rawSessions = dedup;

  // Show the scope toggle only for roles that have their own caseload
  if (role === 'coach' || role === 'doctor') {
    document.getElementById('scope-toggle').classList.remove('hidden');
    document.getElementById('scope-toggle').classList.add('flex');
  }

  await loadWeekTasks();
  checkOverdueTasks();
  checkDueSoonTasks();
  applyScope();
}

function applyScope() {
  const uid = window.currentUser.id;
  if (scope === 'mine') {
    allSessions = rawSessions.filter(ev =>
      myCoachedPatientIds.has(ev.patient_id) ||
      ev.staff_id === uid || ev.coach_id === uid
    );
  } else {
    allSessions = rawSessions;
  }
  renderWeekHeader();
  renderDayPills();
  renderColumns();
}

function setScope(s) {
  scope = s;
  document.getElementById('sc-all').classList.toggle('active',  s === 'all');
  document.getElementById('sc-mine').classList.toggle('active', s === 'mine');
  applyScope();
}

function renderWeekHeader() {
  const end = addDays(weekStart, 6);
  const sameMonth = weekStart.getMonth() === end.getMonth();
  const label = sameMonth
    ? `${weekStart.getDate()} – ${end.getDate()} ${MONTHS_FULL[end.getMonth()]} ${end.getFullYear()}`
    : `${weekStart.getDate()} ${MONTHS[weekStart.getMonth()]} – ${end.getDate()} ${MONTHS[end.getMonth()]} ${end.getFullYear()}`;
  document.getElementById('week-range').textContent = label;

  const today = new Date();
  const thisWk = startOfWeek(today);
  const diffDays = Math.round((weekStart - thisWk) / 86400000);
  const wkLbl = diffDays === 0 ? 'Minggu Ini' : diffDays === 7 ? 'Minggu Depan' : diffDays === -7 ? 'Minggu Lepas' : (diffDays > 0 ? `+${diffDays/7} mgg` : `${diffDays/7} mgg`);
  document.getElementById('week-label').textContent = wkLbl;

  // Last updated = most recent updated_at among week sessions
  const lastUp = allSessions.reduce((acc, s) => {
    const t = s.updated_at ? new Date(s.updated_at).getTime() : 0;
    return t > acc ? t : acc;
  }, 0);
  document.getElementById('last-updated').textContent = lastUp
    ? `Terakhir dikemaskini: ${new Date(lastUp).toLocaleDateString(LCALE(), { day:'2-digit', month:'short', year:'numeric' })}, ${new Date(lastUp).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })}`
    : 'Terakhir dikemaskini: —';
}

function renderDayPills() {
  const host = document.getElementById('day-pills');
  const today = new Date();
  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(weekStart, i);
    const isToday = sameDay(d, today);
    const isSel   = viewMode === 'day' && i === selectedDayIdx;
    const active  = isSel || (viewMode === 'week' && isToday);
    html += `<div class="day-pill ${active ? 'active' : ''}" onclick="pickDay(${i})">
      <div class="lbl">${DAY_SHORT[d.getDay()]}</div>
      <div class="num">${d.getDate()}</div>
    </div>`;
  }
  host.innerHTML = html;
}

function pickDay(i) {
  selectedDayIdx = i;
  viewMode = 'day';
  document.getElementById('vw-week').classList.remove('active');
  document.getElementById('vw-day').classList.add('active');
  renderDayPills();
  renderColumns();
}

function setView(v) {
  viewMode = v;
  document.getElementById('vw-week').classList.toggle('active', v === 'week');
  document.getElementById('vw-day').classList.toggle('active', v === 'day');
  renderDayPills();
  renderColumns();
}

function goToday() {
  weekStart = startOfWeek(new Date());
  const todayDow = new Date().getDay();
  selectedDayIdx = todayDow === 0 ? 6 : todayDow - 1;
  loadWeek();
}

function goWeek(delta) {
  weekStart = addDays(weekStart, 7 * delta);
  loadWeek();
}

function renderColumns() {
  const host = document.getElementById('schedule-grid');
  const days = viewMode === 'day'
    ? [selectedDayIdx] // single column
    : [0, 1, 2, 3, 4, 5, 6]; // Mon–Sun (full week)

  host.className = viewMode === 'day'
    ? 'grid grid-cols-1 gap-3'
    : 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-3';

  const today = new Date();
  host.innerHTML = days.map(idx => {
    const d = addDays(weekStart, idx);
    const isToday = sameDay(d, today);
    const daySess = allSessions.filter(s => sameDay(new Date(s.start), d));
    daySess.sort((a, b) => new Date(a.start) - new Date(b.start));

    return `<div class="col-day ${isToday ? 'is-active' : ''}">
      <div class="col-head">
        <div>
          <div class="col-title">${DAY_FULL[d.getDay()]}</div>
          <div class="col-sub">${d.getDate()} ${MONTHS[d.getMonth()]}</div>

      </div>
      <div class="flex-1">
        ${daySess.map(renderCard).join('') || '<p class="text-[11px] text-ink/30 italic text-center py-4">Tiada sesi</p>'}
        ${renderDayTasks(localYmd(d))}
      </div>
    </div>`;
  }).join('');
}

  const hh = t.getHours(), mm = t.getMinutes();

  const srcBadge = s.source === 'hk1' ? (HK1_BADGE[s.session_type] || '🧑‍💼') : ({ plan:'📋', appt:'📅', coach:'🎯' }[s.source] || '');

// ── Task Peribadi (psy_coach_tasks) — dipaparkan dalam lajur hari Jadual Mingguan ──
let personalTasksCache = {};   // task (templat) ikut id
let taskOcc = {};              // ds (YYYY-MM-DD) -> [{ t, ds, status }] kejadian hari tu

const TASK_STATUS_LBL = { belum_mula:'To Do', dalam_proses:'In Progress', selesai:'Complete ✓' };
const TASK_STATUS_CLS = { belum_mula:'border-ink/25 bg-white', dalam_proses:'border-gold bg-gold/20', selesai:'border-green bg-green/20' };
const TASK_NEXT = { belum_mula:'dalam_proses', dalam_proses:'selesai', selesai:'belum_mula' };
// Audit #146 (7 Okt 2026) — priority badge, sama styling dgn dashboard.html (pBadge)
const PRIORITY_BADGE = { tinggi:'bg-terracotta/15 text-terracotta', sederhana:'bg-gold/20 text-gold-dark', rendah:'bg-ink/8 text-ink/50' };
const PRIORITY_LABEL = { tinggi:'🔴 Urgent', sederhana:'🟡 Normal', rendah:'⚪ Low' };
const DOW_SHORT = ['Ahd','Isn','Sel','Rab','Kha','Jum','Sab'];

function localYmd(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function taskOccursOn(t, ds) {
  if (t.recur_type === 'none') return t.task_date === ds;
  if (ds < t.task_date) return false;
  if (t.recur_until && ds > t.recur_until) return false;
  if (t.recur_type === 'daily') return true;
  const dow = new Date(ds + 'T00:00:00').getDay();
  return (t.recur_days || []).includes(dow);
}

async function loadWeekTasks() {
  const myId = window.currentUser?.id;
  personalTasksCache = {};
  taskOcc = {};
  if (!myId) return;
  const wkStart = localYmd(weekStart);
  const wkEnd   = localYmd(addDays(weekStart, 6));
  const { data } = await window.db.from('psy_coach_tasks').select('*').eq('coach_id', myId)
    .lte('task_date', wkEnd)
    .or(`recur_type.neq.none,task_date.gte.${wkStart}`)
    .order('created_at', { ascending: true })
    .then(r => r, () => ({ data: [] }));
  const tasks = data || [];
  tasks.forEach(t => { personalTasksCache[t.id] = t; });

  const recIds = tasks.filter(t => t.recur_type !== 'none').map(t => t.id);
  const logMap = {};
  if (recIds.length) {
    const { data: lg } = await window.db.from('psy_coach_task_logs').select('task_id, log_date, status')
      .in('task_id', recIds).gte('log_date', wkStart).lte('log_date', wkEnd)
      .then(r => r, () => ({ data: [] }));
    (lg || []).forEach(l => { logMap[`${l.task_id}|${l.log_date}`] = l.status; });
  }
  for (let i = 0; i < 7; i++) {
    const ds = localYmd(addDays(weekStart, i));
    taskOcc[ds] = tasks.filter(t => taskOccursOn(t, ds)).map(t => ({
      t, ds,
      status: t.recur_type === 'none' ? t.status : (logMap[`${t.id}|${ds}`] || 'belum_mula'),
    }));
  }
}

// Audit #B2-23 (Tier 4) — reminder task peribadi terlepas tarikh & belum selesai
// (task sekali sahaja; task berulang tak ada "terlewat").
let _overdueTaskDates = [];
async function checkOverdueTasks() {
  const banner = document.getElementById('task-overdue-banner');
  if (!banner) return;
  const myId = window.currentUser?.id;
  if (!myId) return;
  const { data } = await window.db.from('psy_coach_tasks')
    .select('id, task_date').eq('coach_id', myId).eq('recur_type', 'none')
    .lt('task_date', localYmd(new Date())).neq('status', 'selesai')
    .order('task_date', { ascending: true })
    .then(r => r, () => ({ data: [] }));
  const overdue = data || [];
  if (!overdue.length) { banner.classList.add('hidden'); _overdueTaskDates = []; return; }
  _overdueTaskDates = [...new Set(overdue.map(t => t.task_date))];
  banner.textContent = `⏰ ${overdue.length} task peribadi terlewat (belum selesai) — klik utk lihat hari terawal`;
  banner.classList.remove('hidden');
}
function jumpToOverdueTask() {
  if (!_overdueTaskDates.length) return;
  weekStart = startOfWeek(new Date(_overdueTaskDates[0] + 'T00:00:00'));
  loadWeek();
}

// Audit #146 (7 Okt 2026) — amaran proaktif: task (sekali sahaja, belum selesai)
// yang akan due dalam DUE_SOON_DAYS hari akan datang (belum lepas tarikh — itu
// kes checkOverdueTasks()). Ambang hari di satu tempat sahaja supaya mudah ubah.
const DUE_SOON_DAYS = 2;
let _dueSoonTaskDates = [];
async function checkDueSoonTasks() {
  const banner = document.getElementById('task-duesoon-banner');
  if (!banner) return;
  const myId = window.currentUser?.id;
  if (!myId) return;
  const todayStr = localYmd(new Date());
  const limitStr = localYmd(addDays(new Date(), DUE_SOON_DAYS));
  const { data } = await window.db.from('psy_coach_tasks')
    .select('id, task_date').eq('coach_id', myId).eq('recur_type', 'none')
    .gte('task_date', todayStr).lte('task_date', limitStr).neq('status', 'selesai')
    .order('task_date', { ascending: true })
    .then(r => r, () => ({ data: [] }));
  const dueSoon = data || [];
  if (!dueSoon.length) { banner.classList.add('hidden'); _dueSoonTaskDates = []; return; }
  _dueSoonTaskDates = [...new Set(dueSoon.map(t => t.task_date))];
  banner.textContent = `📅 ${dueSoon.length} task peribadi due dalam ${DUE_SOON_DAYS} hari — jangan tertinggal (klik utk lihat hari terawal)`;
  banner.classList.remove('hidden');
}
function jumpToDueSoonTask() {
  if (!_dueSoonTaskDates.length) return;
  weekStart = startOfWeek(new Date(_dueSoonTaskDates[0] + 'T00:00:00'));
  loadWeek();
}

function syncRepeatUI() {

  document.getElementById('task-due-wrap').classList.toggle('hidden', r !== 'none');

}

function openTaskModal(taskId, defaultDate) {
  const task = taskId ? personalTasksCache[taskId] : null;
  document.getElementById('task-modal-title').textContent = task ? 'Edit Task' : 'Tambah Task';
  document.getElementById('task-id').value       = task?.id || '';
  document.getElementById('task-title').value    = task?.title || '';
  document.getElementById('task-date').value     = task?.task_date || defaultDate || localYmd(new Date());
  document.getElementById('task-due-date').value = task?.due_date || '';
  document.getElementById('task-notes').value    = task?.notes || '';
  document.getElementById('task-repeat').value   = task?.recur_type || 'none';
  document.getElementById('task-until').value    = task?.recur_until || '';
  document.getElementById('task-priority').value = task?.priority || 'sederhana';
  for (let i = 0; i < 7; i++) {
    document.getElementById('task-day-' + i).checked = (task?.recur_days || []).includes(i);
  }
  syncRepeatUI();

  const patSel = document.getElementById('task-patient');
  const myPatients = Object.entries(patientMap);
  patSel.innerHTML = '<option value="">—</option>' + myPatients
    .sort((a, b) => (a[1].name || '').localeCompare(b[1].name || ''))
    .map(([id, p]) => `<option value="${id}" ${task?.patient_id === id ? 'selected' : ''}>${escHtml(p.name)}</option>`).join('');

  document.getElementById('task-err').classList.add('hidden');
  document.getElementById('task-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('task-title').focus(), 50);
}

function closeTaskModal() {
  document.getElementById('task-modal').classList.add('hidden');
}

async function saveTask() {
  const title     = document.getElementById('task-title').value.trim();
  const date      = document.getElementById('task-date').value;
  const repeatNow = document.getElementById('task-repeat').value;
  const dueDate   = repeatNow === 'none' ? document.getElementById('task-due-date').value : '';
  const patientId = document.getElementById('task-patient').value;
  const notes     = document.getElementById('task-notes').value.trim();
  const taskId    = document.getElementById('task-id').value;
  const repeat    = document.getElementById('task-repeat').value;
  const until     = document.getElementById('task-until').value || null;
  const days      = [0,1,2,3,4,5,6].filter(i => document.getElementById('task-day-' + i).checked);
  const priority  = document.getElementById('task-priority').value || 'sederhana';
  const errEl     = document.getElementById('task-err');
  errEl.classList.add('hidden');

  if (!title) { errEl.textContent = 'Tajuk task diperlukan.'; errEl.classList.remove('hidden'); return; }
  if (!date)  { errEl.textContent = 'Tarikh diperlukan.';    errEl.classList.remove('hidden'); return; }
  if (repeat === 'weekly' && !days.length) { errEl.textContent = 'Pilih sekurang-kurangnya satu hari.'; errEl.classList.remove('hidden'); return; }

  const myId = window.currentUser?.id;
  if (!myId) return;
  const payload = {
    coach_id: myId, title, task_date: date, due_date: dueDate || null,
    patient_id: patientId || null, notes: notes || null,
    recur_type: repeat, recur_days: repeat === 'weekly' ? days : null,
    recur_until: repeat === 'none' ? null : until,
    priority,
    updated_at: new Date().toISOString(),
  };

  let error, savedTask;
  if (taskId) {
    ({ error } = await window.db.from('psy_coach_tasks').update(payload).eq('id', taskId));
    if (!error) {
      savedTask = { ...personalTasksCache[taskId], ...payload, id: taskId };
      await logTaskActivity(taskId, 'edited', {});
      if (typeof auditLog === 'function') { try { await auditLog('coach_task.updated', taskId, { title, priority }); } catch (_) {} }
    }
  } else {
    const ins = await window.db.from('psy_coach_tasks').insert(payload).select('id').single();
    error = ins.error;
    if (!error) {
      savedTask = { ...payload, id: ins.data.id, linked_appointment_id: null };
      await logTaskActivity(ins.data.id, 'created', {});
      if (typeof auditLog === 'function') { try { await auditLog('coach_task.created', ins.data.id, { title, priority }); } catch (_) {} }
    }
  }
  if (error) { errEl.textContent = 'Ralat: ' + (error.message || JSON.stringify(error)); errEl.classList.remove('hidden'); return; }

  // Sync ke Jadual Temujanji (psy_appointments) — SEHALA (task → appointment),
  // hanya utk task sekali sahaja (recur_type='none') sebab satu appointment cuma
  // boleh wakili satu masa, bukan siri ulangan tanpa noktah.
  if (savedTask) {
    if (savedTask.recur_type === 'none') {
      await syncTaskAppointment(savedTask);
    } else if (savedTask.linked_appointment_id) {
      // Task ditukar dari sekali-sahaja → berulang: appointment lama dah tak relevan.
      await cancelTaskAppointment(savedTask.linked_appointment_id);
      await window.db.from('psy_coach_tasks').update({ linked_appointment_id: null }).eq('id', savedTask.id);
    }
  }

  banner(taskId ? 'Task dikemaskini ✅' : 'Task ditambah ✅');
  closeTaskModal();
  await loadWeekTasks();
  renderColumns();
  checkOverdueTasks();
  checkDueSoonTasks();
}

async function deleteTask(taskId) {
  if (!confirm('Padam task ini? (semua kejadian ulangan juga akan dipadam)')) return;
  const t = personalTasksCache[taskId];
  const linkedApptId = t?.linked_appointment_id || null;
  const { error } = await window.db.from('psy_coach_tasks').delete().eq('id', taskId);
  if (error) { banner('Ralat padam: ' + error.message, 'error'); return; }
  // Appointment yang dipautkan (Jadual Temujanji) ditanda cancelled, bukan dipadam
  // terus — ikut polisi sedia ada appointments.html (status-based, bukan hard delete).
  if (linkedApptId) await cancelTaskAppointment(linkedApptId);
  if (typeof auditLog === 'function') { try { await auditLog('coach_task.deleted', taskId, { title: t?.title, linked_appointment_id: linkedApptId }); } catch (_) {} }
  banner('Task dipadam');
  await loadWeekTasks();
  renderColumns();
  checkOverdueTasks();
  checkDueSoonTasks();
}

async function logTaskActivity(taskId, action, detail) {
  const me = window.currentUser || {};
  await window.db.from('psy_coach_task_activity').insert({ task_id: taskId, actor_id: me.id || null, actor_name: me.full_name || null, action, detail });
}

// ── Sync Task Peribadi → Jadual Temujanji (psy_appointments) ──────────────
// Audit #146 (7 Okt 2026). SEHALA sahaja: task → appointment. Appointment yang
// dicipta/dikemaskini di sini TIDAK dibaca balik oleh weekly-plan.html — kalau
// appointment diedit terus di appointments.html, perubahan itu TAK sync balik
// ke task (dua-hala penuh belum dibina — lihat laporan audit).
const TASK_STATUS_TO_APPT = { belum_mula: 'scheduled', dalam_proses: 'scheduled', selesai: 'completed' };
const TASK_DEFAULT_APPT_TIME = '09:00'; // task tiada medan masa sendiri — guna slot pagi lalai

async function syncTaskAppointment(task) {
  if (!task || !task.task_date) return null;
  const coachId = task.coach_id || window.currentUser?.id || null;
  const apptIso = new Date(`${task.task_date}T${TASK_DEFAULT_APPT_TIME}:00`).toISOString();
  const patch = {
    patient_id: task.patient_id || null,
    staff_id: coachId,
    staff_name: coachId ? (staffMap[coachId]?.name || window.currentUser?.full_name || null) : null,
    service: `📌 Task: ${task.title}`,
    appointment_time: apptIso,
    duration_min: 30,
    status: TASK_STATUS_TO_APPT[task.status] || 'scheduled',
    notes: task.notes || null,
  };
  try {
    if (task.linked_appointment_id) {
      await window.db.from('psy_appointments').update(patch).eq('id', task.linked_appointment_id);
      return task.linked_appointment_id;
    }
    const { data: appt, error } = await window.db.from('psy_appointments').insert(patch).select('id').single();
    if (error) throw error;
    if (appt?.id) {
      await window.db.from('psy_coach_tasks').update({ linked_appointment_id: appt.id }).eq('id', task.id);
      if (typeof auditLog === 'function') { try { await auditLog('coach_task.appointment_synced', task.id, { appointment_id: appt.id }); } catch (_) {} }
    }
    return appt?.id || null;
  } catch (e) {
    console.error('[weekly-plan] syncTaskAppointment gagal:', e);
    return null;
  }
}

async function cancelTaskAppointment(appointmentId) {
  if (!appointmentId) return;
  try { await window.db.from('psy_appointments').update({ status: 'cancelled' }).eq('id', appointmentId); }
  catch (e) { console.error('[weekly-plan] cancelTaskAppointment gagal:', e); }
}

async function syncTaskAppointmentStatus(appointmentId, taskStatus) {
  if (!appointmentId) return;
  try { await window.db.from('psy_appointments').update({ status: TASK_STATUS_TO_APPT[taskStatus] || 'scheduled' }).eq('id', appointmentId); }
  catch (e) { console.error('[weekly-plan] syncTaskAppointmentStatus gagal:', e); }
}

async function cycleTaskStatus(taskId, ds, currentStatus) {
  const next = TASK_NEXT[currentStatus] || 'dalam_proses';
  const t = personalTasksCache[taskId];
  let error;
  if (!t || t.recur_type === 'none') {
    ({ error } = await window.db.from('psy_coach_tasks').update({ status: next, updated_at: new Date().toISOString() }).eq('id', taskId));
    if (!error && t?.linked_appointment_id) await syncTaskAppointmentStatus(t.linked_appointment_id, next);
  } else {
    ({ error } = await window.db.from('psy_coach_task_logs').upsert(
      { task_id: taskId, log_date: ds, status: next, updated_at: new Date().toISOString() },
      { onConflict: 'task_id,log_date' }));
  }
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  await logTaskActivity(taskId, 'status', { from: currentStatus, to: next, ...(t && t.recur_type !== 'none' ? { date: ds } : {}) });
  if (typeof auditLog === 'function') { try { await auditLog('coach_task.status_changed', taskId, { from: currentStatus, to: next, date: ds }); } catch (_) {} }
  await loadWeekTasks();
  renderColumns();
  checkOverdueTasks();
  checkDueSoonTasks();
}

// ── Coach Ganti ──────────────────────────────
function openCoachGanti(sessionId, currentSubId) {
  const sel = document.getElementById('ganti-coach-select');
  sel.innerHTML = '<option value="">— Tiada (buang ganti) —</option>';
  Object.entries(staffMap).forEach(([id, info]) => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = info.name + (info.role ? ` (${info.role})` : '');
    if (id === currentSubId) opt.selected = true;
    sel.appendChild(opt);
  });
  document.getElementById('ganti-session-id').value = sessionId;
  document.getElementById('coach-ganti-modal').classList.remove('hidden');
}

async function saveCoachGanti() {
  const sessionId = document.getElementById('ganti-session-id').value;
  const coachId   = document.getElementById('ganti-coach-select').value || null;
  const { error } = await window.db.from('psy_plan_weekly_progress')
    .update({ substitute_coach_id: coachId }).eq('id', sessionId);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  const name = coachId ? (staffMap[coachId]?.name || 'Coach') : null;
  banner(coachId ? `Coach ganti: ${name} ✅` : 'Coach ganti dibuang');
  document.getElementById('coach-ganti-modal').classList.add('hidden');
  await loadWeek();
}


</script>
