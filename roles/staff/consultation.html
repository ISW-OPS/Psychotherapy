<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Consultation</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🩺</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-4">
        <!-- Patient picker -->
        <div id="picker" class="grid md:grid-cols-2 gap-4">
          <div class="bg-white rounded-xl p-4 border border-ink/10">
            <label class="text-xs font-semibold mb-2 block">Tarikh Konsultasi</label>
            <input type="date" id="entry-date" onchange="loadPatientsForDate()" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm outline-none focus:border-navy">
          </div>
          <div class="bg-white rounded-xl p-4 border border-ink/10">
            <label class="text-xs font-semibold mb-2 block">Pilih pesakit untuk konsultasi</label>
            <select id="patient-select" onchange="loadPatientChart()" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm outline-none focus:border-navy">
              <option value="">— Pilih pesakit —</option>
            </select>
          </div>
        </div>

        <!-- SOAP Form -->
        <div id="soap-form" class="hidden space-y-4">
          <div class="bg-gradient-to-r from-navy to-navy-dark rounded-2xl p-5 text-white">
            <div class="text-xs opacity-90">Konsultasi aktif</div>
            <h3 id="patient-info" class="text-xl font-bold mt-1"></h3>
          </div>

          <div class="grid lg:grid-cols-3 gap-4">
            <div class="lg:col-span-2 bg-white rounded-xl p-4 border border-ink/10">
              <div class="flex gap-2 mb-4 flex-wrap">
                <button onclick="setSoap('s')" class="soap-tab active">S · Subjective</button>
                <button onclick="setSoap('o')" class="soap-tab">O · Objective</button>
                <button onclick="setSoap('a')" class="soap-tab">A · Assessment</button>
                <button onclick="setSoap('p')" class="soap-tab">P · Plan</button>
              </div>

              <div id="soap-s" class="soap-pane active space-y-3">
                <label class="text-xs font-semibold">Chief Complaint</label>
                <input id="cc" class="w-full px-3 py-2 border border-ink/20 rounded-lg text-sm">
                <label class="text-xs font-semibold">HPI (History of Present Illness)</label>
                <textarea id="hpi" rows="4" class="w-full px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
              </div>

              <div id="soap-o" class="soap-pane space-y-3">
                <label class="text-xs font-semibold">Latest Vitals</label>
                <div id="latest-vitals" class="grid grid-cols-2 md:grid-cols-4 gap-2"></div>
                <label class="text-xs font-semibold">Examination</label>
                <textarea id="exam" rows="4" class="w-full px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
              </div>

              <div id="soap-a" class="soap-pane space-y-3">
                <label class="text-xs font-semibold">Diagnoses</label>
                <textarea id="dx" rows="3" placeholder="cth: F41.1 — Generalized anxiety disorder" class="w-full px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
                <label class="text-xs font-semibold">Clinical Reasoning</label>
                <textarea id="reasoning" rows="3" class="w-full px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
              </div>

              <div id="soap-p" class="soap-pane space-y-3">
                <label class="text-xs font-semibold">Medications (Rx)</label>
                <textarea id="meds" rows="3" placeholder="Madu Shifa 1tbsp OD&#10;Magnesium 200mg HS" class="w-full px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
                <label class="text-xs font-semibold">Lab Orders</label>
                <textarea id="labs" rows="2" placeholder="Lipid profile&#10;Renal panel" class="w-full px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
                <label class="text-xs font-semibold">Follow-up</label>
                <input id="followup" placeholder="cth: 4 minggu" class="w-full px-3 py-2 border border-ink/20 rounded-lg text-sm">
              </div>

              <div class="flex gap-2 mt-4">
                <button onclick="saveSoap('draft')" class="bg-cream px-4 py-2 rounded-lg text-sm">Simpan Draf</button>
                <button onclick="saveSoap('signed')" class="bg-navy text-white px-4 py-2 rounded-lg text-sm font-semibold">Tandatangan & Simpan</button>
              </div>
            </div>

            <div class="space-y-3">
              <div class="bg-white rounded-xl p-4 border border-ink/10">
                <h4 class="font-bold text-sm mb-2">Patient Info</h4>
                <div id="chart-info" class="text-xs space-y-1"></div>
              </div>
              <div class="bg-white rounded-xl p-4 border border-ink/10">
                <h4 class="font-bold text-sm mb-2">Past SOAP Notes</h4>
                <div id="past-notes" class="text-xs space-y-2"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let currentPatient = null;

function setSoap(k) {
  document.querySelectorAll('.soap-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.soap-pane').forEach(p => p.classList.remove('active'));
  document.querySelector(`.soap-tab[onclick*="'${k}'"]`)?.classList.add('active');
  document.getElementById('soap-' + k)?.classList.add('active');
}

async function loadPatientChart() {
  const patientId = document.getElementById('patient-select').value;
  if (!patientId) { document.getElementById('soap-form').classList.add('hidden'); return; }

  const { data: patData } = await window.db.from('psy_patients')
    .select('*, psy_profiles!psy_patients_user_id_fkey(full_name, phone)')
    .eq('id', patientId).single().then(r => r, r => r);
  currentPatient = patData;
  if (!currentPatient) return;

  const name = currentPatient.psy_profiles?.full_name || currentPatient.mrn;
  const phone = currentPatient.psy_profiles?.phone || currentPatient.emergency_contact_phone || '—';

  document.getElementById('soap-form').classList.remove('hidden');
  document.getElementById('patient-info').textContent = `${name} · ${currentPatient.mrn}`;

  const [vitals, notes] = await Promise.all([
    dbQuery('psy_vitals', { eq: { patient_id: patientId }, order: { col: 'created_at' }, limit: 1 }),
    dbQuery('psy_soap_notes', { eq: { patient_id: patientId }, order: { col: 'created_at' }, limit: 5 }),
  ]);

  document.getElementById('chart-info').innerHTML = `
    <div><strong>Nama:</strong> ${name}</div>
    <div><strong>MRN:</strong> ${currentPatient.mrn}</div>
    <div><strong>IC:</strong> ${currentPatient.ic_number || '—'}</div>
    <div><strong>Jantina:</strong> ${currentPatient.gender === 'M' ? 'Lelaki' : currentPatient.gender === 'F' ? 'Perempuan' : '—'}</div>
    <div><strong>DOB:</strong> ${currentPatient.date_of_birth || '—'}</div>
    <div><strong>Telefon:</strong> ${phone}</div>
    ${currentPatient.active_package_name ? `<div><strong>Pakej:</strong> ${currentPatient.active_package_name}</div>` : ''}
    ${currentPatient.medical_condition ? `<div class="mt-1 pt-1 border-t border-ink/10"><strong>Kondisi:</strong> ${currentPatient.medical_condition}</div>` : ''}`;

  const v = vitals[0];
  document.getElementById('latest-vitals').innerHTML = v ? `
    <div class="vital-input"><div class="text-[10px] text-ink/50">BP</div><div class="text-sm font-bold">${v.bp_systolic}/${v.bp_diastolic}</div></div>
    <div class="vital-input"><div class="text-[10px] text-ink/50">HR</div><div class="text-sm font-bold">${v.heart_rate || '—'}</div></div>
    <div class="vital-input"><div class="text-[10px] text-ink/50">BMI</div><div class="text-sm font-bold">${v.bmi || '—'}</div></div>
    <div class="vital-input"><div class="text-[10px] text-ink/50">SpO2</div><div class="text-sm font-bold">${v.spo2 || '—'}%</div></div>
  ` : '<p class="text-ink/40 text-sm col-span-4">Tiada vitals direkodkan</p>';

  document.getElementById('past-notes').innerHTML = notes.length
    ? notes.map(n => `<div class="p-2 border border-ink/10 rounded">
        <div class="font-semibold">${formatDate(n.created_at)} · ${n.status}</div>
        <div class="text-ink/60 mt-1">${(n.chief_complaint || '').slice(0, 80)}</div>
      </div>`).join('')
    : '<p class="text-ink/40">Tiada notes lepas</p>';
}

async function saveSoap(status) {
  if (!currentPatient) return;
  const note = {
    patient_id: currentPatient.id,
    doctor_id: window.currentUser.id,
    chief_complaint: document.getElementById('cc').value,
    hpi: document.getElementById('hpi').value,
    examination: document.getElementById('exam').value,
    diagnoses: document.getElementById('dx').value.split('\n').filter(Boolean),
    clinical_reasoning: document.getElementById('reasoning').value,
    plan_medications: document.getElementById('meds').value.split('\n').filter(Boolean),
    plan_labs: document.getElementById('labs').value.split('\n').filter(Boolean),
    follow_up: document.getElementById('followup').value,
    status,
    created_at: new Date(`${document.getElementById('entry-date').value}T${new Date().toTimeString().split(' ')[0]}`).toISOString(),
    signed_at: status === 'signed' ? new Date().toISOString() : null,
  };
  try {
    await dbInsert('psy_soap_notes', note);
    await auditLog('soap.' + status, currentPatient.id);
    banner(status === 'signed' ? 'SOAP ditandatangan' : 'Draf disimpan');
    document.querySelectorAll('#soap-form input, #soap-form textarea').forEach(i => i.value = '');
    loadPatientChart();
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  }
}

(async () => {
  const user = await initStaff('consultation', 'SOAP note · clinical chart');
  if (!user) return;
  if (user.staff_role === 'coach') {
    document.querySelectorAll('button[onclick^="saveSoap"]').forEach(b => b.classList.add('hidden'));
  }

  const d = new Date();
  const localToday = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  document.getElementById('entry-date').value = localToday;
  await loadPatientsForDate();

  // Auto-select if URL has ?patient=ID
  const urlPatient = new URLSearchParams(location.search).get('patient');
  if (urlPatient) {
    document.getElementById('patient-select').value = urlPatient;
    loadPatientChart();
  }
})();

async function loadPatientsForDate() {
  const dateStr = document.getElementById('entry-date').value;
  if (!dateStr) return;

  const { data: apps } = await window.db.from('psy_plan_weekly_progress')
    .select('patient_id')
    .gte('session_date', dateStr + 'T00:00:00')
    .lte('session_date', dateStr + 'T23:59:59')
    .in('status', ['booked', 'reschedule', 'hadir']);
  const todayPatientIds = new Set((apps || []).map(a => a.patient_id));

  let { data: patients } = await window.db.from('psy_patients')
    .select('id, mrn, gender, psy_profiles!psy_patients_user_id_fkey(full_name)')
    .eq('status', 'active')
    .order('created_at', { ascending: false })
    .then(r => r, () => ({ data: [] }));
    
  patients = (patients || []).filter(p => todayPatientIds.has(p.id));

  document.getElementById('patient-select').innerHTML = '<option value="">— Pilih pesakit —</option>' +
    patients.map(p => `<option value="${p.id}">${p.psy_profiles?.full_name || p.mrn} · ${p.mrn}</option>`).join('');
    
  document.getElementById('soap-form')?.classList.add('hidden');
}
</script>
</body>
</html>
