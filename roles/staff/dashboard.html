<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Staff Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">⚕</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <!-- Risk banner -->
        <div id="risk-banner" class="hidden bg-gradient-to-r from-terracotta to-terracotta/80 text-white rounded-2xl p-4 flex items-center gap-4">
          <div class="text-3xl">⚠️</div>
          <div class="flex-1">
            <div id="risk-banner-text" class="font-bold"></div>
            <div id="risk-banner-detail" class="text-xs opacity-90 mt-0.5"></div>
          </div>
          <a href="risk.html" class="bg-white text-terracotta font-semibold px-4 py-2 rounded-lg text-sm whitespace-nowrap">Buka Risk Queue →</a>
        </div>

        <!-- KYC pending banner -->
        <div id="kyc-banner" class="hidden bg-gradient-to-r from-gold to-gold-dark text-white rounded-2xl p-4 flex items-center gap-4">
          <div class="text-3xl">🆔</div>
          <div class="flex-1">
            <div id="kyc-banner-text" class="font-bold"></div>
            <div class="text-xs opacity-90 mt-0.5">Semak dan luluskan permohonan KYC pesakit baru.</div>
          </div>
          <a href="kyc-list.html" class="bg-white text-gold-dark font-semibold px-4 py-2 rounded-lg text-sm whitespace-nowrap">Semak KYC →</a>
        </div>

        <!-- KPI row -->
        <div id="kpi-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3"></div>

        <!-- Quick actions -->
        <div class="bg-white rounded-2xl border border-ink/5 shadow-sm p-5">
          <h3 class="font-bold text-navy mb-4 text-sm uppercase tracking-wider">⚡ Tindakan Pantas</h3>
          <div class="flex overflow-x-auto pb-2 gap-4 snap-x" style="scrollbar-width: none;" id="quick-actions"></div>
        </div>

        <!-- Main grid -->
        <div class="grid lg:grid-cols-3 gap-5">

          <!-- Schedule today (col-span-2) -->
          <div class="lg:col-span-2 space-y-5">
            <div class="bg-white rounded-2xl border border-ink/5 shadow-sm p-5">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg">📅 Jadual Sesi Hari Ini</h3>
                <a href="appointments.html" class="text-xs text-navy bg-navy/5 px-3 py-1.5 rounded-lg hover:bg-navy/10 font-semibold transition-colors">Urus Jadual →</a>
              </div>
              <div id="schedule-list" class="space-y-2"></div>
            </div>
          </div>

          <!-- Right column -->
          <div class="space-y-5">

            <!-- Risk alerts -->
            <div class="bg-white rounded-2xl border border-ink/5 shadow-sm p-5">
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-terracotta">⚠️ Risk Alerts</h3>
                <a href="risk.html" class="text-[10px] uppercase font-bold text-terracotta hover:underline tracking-wider">Semua →</a>
              </div>
              <div id="risk-summary" class="space-y-2"></div>
            </div>

            <!-- KYC pending -->
            <div class="bg-white rounded-2xl border border-ink/5 shadow-sm p-5">
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold">🆔 KYC Pending</h3>
                <a href="kyc-list.html" class="text-[10px] uppercase font-bold text-navy hover:underline tracking-wider">Semua →</a>
              </div>
              <div id="kyc-summary" class="space-y-2"></div>
            </div>

            <!-- Pending orders -->
            <div class="bg-white rounded-2xl border border-ink/5 shadow-sm p-5">
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-gold-dark">📦 Orders Tertunggak</h3>
                <a href="orders.html" class="text-[10px] uppercase font-bold text-gold-dark hover:underline tracking-wider">Semua →</a>
              </div>
              <div id="orders-summary" class="space-y-2"></div>
            </div>

          </div>
        </div>

        <!-- My Work Stats -->
        <div id="my-stats-section"></div>

      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
(async () => {
  const user = await initStaff('dashboard',
    new Date().toLocaleDateString('ms-MY', { weekday:'long', day:'2-digit', month:'long', year:'numeric' }));
  if (!user) return;

  const today = new Date().toISOString().split('T')[0];
  const monthStart = today.slice(0, 7) + '-01';

  // Load all data in parallel
  const [
    weeklyAll, risks, kyc, patients, vitalsToday,
    payments, orders, plans, profiles,
  ] = await Promise.all([
    dbQuery('psy_plan_weekly_progress', { order: { col: 'session_date', asc: true } }).catch(() => []),
    dbQuery('psy_risk_alerts', { eq: { status: 'open' } }).catch(() => []),
    window.db.from('psy_kyc_submissions').select('*').in('status', ['pending','rejected']).order('created_at', { ascending: false }).then(r => r.data || [], () => []),
    dbQuery('psy_patients', { eq: { status: 'active' } }).catch(() => []),
    dbQuery('psy_vitals', { order: { col: 'created_at' }, limit: 50 }).catch(() => []),
    window.db.from('psy_payments').select('*').gte('paid_at', monthStart).order('paid_at', { ascending: false }).limit(20).then(r => r.data || [], () => []),
    window.db.from('psy_orders').select('*').not('status', 'in', '("delivered","cancelled")').order('created_at', { ascending: false }).limit(5).then(r => r.data || [], () => []),
    dbQuery('psy_treatment_plans').catch(() => []),
    dbQuery('psy_profiles', { eq: { role: 'patient' } }).catch(() => []),
  ]);

  const todaySessions = weeklyAll.filter(w => w.session_date?.startsWith(today));
  const hadirCount   = todaySessions.filter(w => w.status === 'hadir').length;
  const todayVitals  = vitalsToday.filter(v => v.created_at?.startsWith(today)).length;
  const pendingKyc   = kyc.filter(k => k.status === 'pending');
  const monthRevenue = (payments || []).reduce((s, p) => s + Number(p.total || 0), 0);

  // Build lookup maps
  const patientMap = {};
  patients.forEach(p => { patientMap[p.id] = p; });
  const profileMap = {};
  (profiles || []).forEach(p => { profileMap[p.id] = p; });
  const planMap = {};
  plans.forEach(p => { planMap[p.id] = p; });

  // Banners
  if (risks.length > 0) {
    document.getElementById('risk-banner').classList.remove('hidden');
    document.getElementById('risk-banner-text').textContent = `${risks.length} Risk Alert${risks.length > 1 ? 's' : ''} menunggu triage`;
    document.getElementById('risk-banner-detail').textContent =
      risks.slice(0, 3).map(r => `${r.patient_name || 'Patient'} (${r.severity})`).join(' · ');
  }

  if (pendingKyc.length > 0) {
    document.getElementById('kyc-banner').classList.remove('hidden');
    document.getElementById('kyc-banner-text').textContent =
      `${pendingKyc.length} KYC baru menunggu semakan`;
  }

  // KPI cards
  document.getElementById('kpi-grid').innerHTML = [
    kpiCard('Sesi Hari Ini', todaySessions.length, `${hadirCount} hadir`, 'navy', 'appointments.html'),
    kpiCard('Pesakit Aktif', patients.length, 'Dalam sistem', 'green', 'patients.html'),
    kpiCard('KYC Pending', pendingKyc.length, pendingKyc.length ? 'Perlu review' : 'Clear', 'gold', 'kyc-list.html'),
    kpiCard('Risk Alerts', risks.length, risks.length ? 'Buka queue' : 'Tiada', 'terracotta', 'risk.html'),
    kpiCard('Hasil Bulan Ini', `RM ${monthRevenue.toFixed(0)}`, new Date().toLocaleDateString('ms-MY',{month:'long',year:'numeric'}), 'teal', ''),
  ].join('');

  // Today's schedule
  document.getElementById('schedule-list').innerHTML = todaySessions.length
    ? todaySessions.map(s => {
        const t = new Date(s.session_date);
        const time = t.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
        const patient = patientMap[s.patient_id];
        const patProfile = patient ? profileMap[patient.user_id] : null;
        const name = patient?.full_name || patProfile?.full_name || patient?.mrn || 'Pesakit';
        const plan = planMap[s.plan_id];
        const isDone = s.status === 'hadir';
        const statusMap = {
          booked:      '<span class="chip bg-navy-light text-navy text-[10px]">📅 Ditempah</span>',
          hadir:       '<span class="chip bg-green-light text-green-dark text-[10px]">✅ Hadir</span>',
          cancel:      '<span class="chip bg-terracotta/20 text-terracotta text-[10px]">❌ Cancel</span>',
          reschedule:  '<span class="chip bg-gold/30 text-gold-dark text-[10px]">🔄 Resched</span>',
          tidak_hadir: '<span class="chip bg-ink/10 text-ink/60 text-[10px]">🚫 Tidak Hadir</span>',
        };
        const patientId = patient?.id || '';
        return `<div class="flex items-center gap-3 p-3 border ${isDone ? 'border-green/40 bg-green-light/30' : 'border-ink/5 hover:border-navy/30 hover:shadow-sm'} rounded-xl transition-all">
          <div class="text-center w-14 h-14 rounded-lg bg-navy/5 flex flex-col items-center justify-center flex-shrink-0">
            <div class="text-xs font-semibold text-navy/60">JAM</div>
            <div class="text-sm font-bold ${isDone ? 'text-green-dark' : 'text-navy'}">${time}</div>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-bold text-ink truncate">${name}</div>
            <div class="text-[11px] text-ink/60 mt-0.5">${plan?.name || 'Plan'} · Minggu ${s.week_number || '?'}</div>
          </div>
          ${statusMap[s.status] || ''}
          ${patientId ? `<a href="patient-hub.html?patient_id=${patientId}" class="text-xs font-semibold text-navy bg-navy/5 px-3 py-1.5 rounded-lg hover:bg-navy hover:text-white transition-colors whitespace-nowrap ml-1">Hub →</a>` : ''}
        </div>`;
      }).join('')
    : '<div class="text-ink/40 text-sm py-8 text-center bg-cream/30 rounded-xl border border-dashed border-ink/20">Tiada sesi dijadualkan hari ini</div>';

  // Quick actions
  const isAdmin = ['admin','manager'].includes(user.staff_role);
  const actions = [
    { icon:'👥', label:'Tambah Pesakit', href:'patients.html', show: true },
    { icon:'📅', label:'Jadual Sesi', href:'appointments.html', show: true },
    { icon:'🆔', label:'Semak KYC', href:'kyc-list.html', show: true },
    { icon:'📊', label:'Vitals', href:'vitals.html', show: true },
    { icon:'📋', label:'Treatment Plans', href:'plans.html', show: true },
    { icon:'📦', label:'Orders', href:'orders.html', show: isAdmin },
    { icon:'🛒', label:'Products', href:'products.html', show: isAdmin },
    { icon:'🎁', label:'Pakej Rawatan', href:'pakej.html', show: isAdmin },
    { icon:'👨‍⚕️', label:'Manage Staff', href:'staff_management.html', show: user.staff_role === 'admin' },
  ].filter(a => a.show);

  document.getElementById('quick-actions').innerHTML = actions.slice(0, 10).map(a =>
    `<a href="${a.href}" class="snap-start flex-shrink-0 w-[100px] flex flex-col items-center gap-2 p-3 bg-cream/30 border border-ink/5 rounded-xl hover:bg-white hover:border-navy hover:shadow-md transition-all text-center group">
      <div class="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">${a.icon}</div>
      <span class="text-[10px] font-semibold text-ink/70 leading-tight">${a.label}</span>
    </a>`
  ).join('');

  // KYC summary
  document.getElementById('kyc-summary').innerHTML = pendingKyc.length
    ? pendingKyc.slice(0, 4).map(k => `
        <a href="kyc-review.html?id=${k.id}" class="flex items-center gap-2 p-2 border border-ink/10 rounded-lg hover:border-gold/50 hover:bg-gold/5 transition-colors">
          <div class="w-7 h-7 rounded-full bg-gold/20 flex items-center justify-center text-xs font-bold text-gold-dark flex-shrink-0">${(k.patient_name||'?').slice(0,1)}</div>
          <div class="flex-1 min-w-0">
            <div class="text-xs font-semibold truncate">${k.patient_name || '—'}</div>
            <div class="text-[10px] text-ink/50">${timeAgo(k.created_at)}</div>
          </div>
          <span class="chip bg-gold/20 text-gold-dark text-[9px]">${k.status}</span>
        </a>`).join('')
      + (pendingKyc.length > 4 ? `<a href="kyc-list.html" class="text-xs text-navy text-center block py-1 hover:underline">+ ${pendingKyc.length - 4} lagi →</a>` : '')
    : '<p class="text-ink/40 text-xs py-1">Tiada KYC pending</p>';

  // Orders summary
  document.getElementById('orders-summary').innerHTML = (orders || []).length
    ? (orders || []).map(o => {
        const statusColors = { paid:'bg-navy-light text-navy', processing:'bg-gold/20 text-gold-dark', shipped:'bg-teal/10 text-teal' };
        return `<div class="flex items-center gap-2 py-1.5 border-b border-ink/5 last:border-0">
          <div class="flex-1 min-w-0">
            <div class="text-xs font-semibold truncate">${o.order_ref || o.id?.slice(0,8)}</div>
            <div class="text-[10px] text-ink/50">${new Date(o.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</div>
          </div>
          <span class="chip ${statusColors[o.status] || 'bg-ink/10 text-ink/60'} text-[9px]">${o.status || '—'}</span>
        </div>`;
      }).join('')
    : '<p class="text-ink/40 text-xs py-1">Tiada order tertunggak</p>';

  // Risk summary
  document.getElementById('risk-summary').innerHTML = risks.length
    ? risks.slice(0, 3).map(r => {
        const sev = r.severity;
        const cls = (sev === 'critical' || sev === 'high') ? 'bg-terracotta/10 border-terracotta/30' : 'bg-gold/10 border-gold/30';
        const badge = (sev === 'critical' || sev === 'high') ? 'bg-terracotta/20 text-terracotta' : 'bg-gold/20 text-gold-dark';
        return `<div class="p-2.5 border ${cls} rounded-lg">
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs font-semibold truncate">${r.patient_name || 'Patient'}</span>
            <span class="chip ${badge} text-[9px]">${sev?.toUpperCase()}</span>
          </div>
          <div class="text-[10px] text-ink/60 mt-0.5 line-clamp-1">${r.description || '—'}</div>
        </div>`;
      }).join('')
      + (risks.length > 3 ? `<a href="risk.html" class="text-xs text-navy text-center block py-1 hover:underline">+ ${risks.length - 3} lagi →</a>` : '')
    : '<p class="text-ink/40 text-xs py-1">Tiada risk alerts</p>';

  // ── My Work Stats ─────────────────────────────────────
  const isAdminMgr = ['admin','manager'].includes(user.staff_role);
  const [myPtCount, mySessCount, myVitCount, myKycCount, myPlanCount] = await Promise.all([
    window.db.from('psy_patients').select('*',{count:'exact',head:true}).eq('coach_id',user.id).then(r=>r.count||0,()=>0),
    window.db.from('psy_coaching_sessions').select('*',{count:'exact',head:true}).eq('coach_id',user.id).gte('session_date',monthStart).then(r=>r.count||0,()=>0),
    window.db.from('psy_vitals').select('*',{count:'exact',head:true}).eq('recorded_by',user.id).gte('created_at',monthStart).then(r=>r.count||0,()=>0),
    window.db.from('psy_kyc_submissions').select('*',{count:'exact',head:true}).eq('reviewed_by',user.id).then(r=>r.count||0,()=>0),
    window.db.from('psy_treatment_plans').select('*',{count:'exact',head:true}).eq('doctor_id',user.id).eq('status','active').then(r=>r.count||0,()=>0),
  ]);

  const myStatItems = [];
  if (user.staff_role === 'coach') {
    myStatItems.push(
      { icon:'👥', label:'Pesakit Ditugaskan', value:myPtCount,   color:'text-navy',      href:'assignments.html' },
      { icon:'📝', label:'Sesi Bulan Ini',     value:mySessCount, color:'text-green-dark', href:'appointments.html' },
      { icon:'📊', label:'Vitals Direkod',     value:myVitCount,  color:'text-teal',       href:null },
    );
  } else if (user.staff_role === 'doctor') {
    myStatItems.push(
      { icon:'📋', label:'Plan Aktif',         value:myPlanCount, color:'text-navy',      href:'plans.html' },
      { icon:'🆔', label:'KYC Disemak',        value:myKycCount,  color:'text-gold-dark', href:'kyc-list.html' },
      { icon:'📊', label:'Vitals Bulan Ini',   value:myVitCount,  color:'text-teal',      href:null },
    );
  } else {
    myStatItems.push(
      { icon:'📊', label:'Vitals Direkod', value:myVitCount, color:'text-teal',      href:null },
      { icon:'🆔', label:'KYC Disemak',    value:myKycCount, color:'text-gold-dark', href:'kyc-list.html' },
    );
  }

  const cols = myStatItems.length <= 2 ? 2 : myStatItems.length >= 4 ? 4 : 3;
  document.getElementById('my-stats-section').innerHTML = `
    <div class="bg-white rounded-2xl border border-ink/5 shadow-sm p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-sm">📊 Statistik Kerja Saya — Bulan Ini</h3>
        ${isAdminMgr ? '<a href="staff-stats.html" class="text-xs text-navy hover:underline font-medium">Papan Prestasi Staff →</a>' : ''}
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-${cols} gap-3">
        ${myStatItems.map(s => s.href
          ? `<a href="${s.href}" class="bg-cream/30 rounded-xl p-4 text-center border border-transparent hover:bg-white hover:shadow-sm hover:border-navy/30 transition-all block group">
               <div class="text-2xl mb-2 group-hover:scale-110 transition-transform">${s.icon}</div>
               <div class="text-2xl font-bold ${s.color}">${s.value}</div>
               <div class="text-[11px] font-semibold text-ink/50 mt-1 uppercase tracking-wider">${s.label}</div>
             </a>`
          : `<div class="bg-cream/30 rounded-xl p-4 text-center border border-transparent">
               <div class="text-2xl mb-2">${s.icon}</div>
               <div class="text-2xl font-bold ${s.color}">${s.value}</div>
               <div class="text-[11px] font-semibold text-ink/50 mt-1 uppercase tracking-wider">${s.label}</div>
             </div>`
        ).join('')}
      </div>
    </div>`;

})();

function kpiCard(label, value, sub, color, href) {
  const colors = {
    navy:      'border-navy bg-navy-light/30',
    green:     'border-green bg-green-light/30',
    gold:      'border-gold bg-gold/10',
    terracotta:'border-terracotta bg-terracotta/5',
    teal:      'border-teal bg-teal/5',
  };
  const textColors = {
    navy:'text-navy', green:'text-green-dark', gold:'text-gold-dark', terracotta:'text-terracotta', teal:'text-teal',
  };
  const inner = `
    <div class="text-[10px] uppercase font-semibold text-ink/50 tracking-wide">${label}</div>
    <div class="text-2xl font-bold mt-1 ${textColors[color] || 'text-ink'}">${value}</div>
    <div class="text-[10px] text-ink/50 mt-1.5">${sub || ''}</div>`;
  return href
    ? `<a href="${href}" class="bg-white rounded-xl p-4 border-t-4 ${colors[color] || 'border-navy'} hover:shadow-md transition-shadow block">${inner}</a>`
    : `<div class="bg-white rounded-xl p-4 border-t-4 ${colors[color] || 'border-navy'}">${inner}</div>`;
}
</script>
</body>
</html>
