<script>
let allPatients = [];
let currentTab  = 'pending';
let myRole      = null;
const MAX_CASELOAD = 20;

// ── Tab ───────────────────────────────────────────────
function setTab(t) {
  currentTab = t;
  clearSelection();
  ['pending','mine','all'].forEach(k => {
    document.getElementById('tab-' + k)?.classList.toggle('active', k === t);
  });
  renderTable();
}

// ── Wait time ─────────────────────────────────────────
function waitLabel(purchasedAt) {
  if (!purchasedAt) return { text: '—', cls: 'risk-none' };
  const h = Math.floor((Date.now() - new Date(purchasedAt)) / 3600000);
  if (h < 24) return { text: h + ' hrs',           cls: 'wait-green' };
  const d = Math.floor(h / 24);
  if (d < 3)  return { text: d + (d === 1 ? ' day' : ' days'), cls: 'wait-gold'  };
  return         { text: d + ' days',              cls: 'wait-red'   };
}

// ── Risk badge ────────────────────────────────────────
function riskBadge(p) {
  const txt = ((p.medical_condition || '') + ' ' + (p.medical_notes || '')).toLowerCase();
  if (txt.match(/self.?harm|bahaya diri/))
    return '<span class="risk-badge" style="background:#fee2e2;color:#dc2626">⚠ Self-Harm Risk</span>';
  if (txt.match(/depress|kemurungan/))
    return '<span class="risk-badge" style="background:#fee2e2;color:#dc2626">⚠ Depression</span>';
  if (txt.match(/anxiet|kebimbangan/))
    return '<span class="risk-badge" style="background:#fef9c3;color:#b45309">⚠ Anxiety</span>';
  if (txt.match(/stress|tekanan/))
    return '<span class="risk-badge" style="background:#fef9c3;color:#b45309">⚠ Stress</span>';
  return '<span class="risk-none">None</span>';
}

// ── Render table ──────────────────────────────────────
function renderTable() {
  const uid   = window.currentUser?.id;
  const q     = document.getElementById('search-box').value.toLowerCase().trim();
  const isAdmin = myRole === 'admin' || myRole === 'manager';

  let list = allPatients;
  if      (currentTab === 'pending') list = list.filter(p => !p.coach_id);
  else if (currentTab === 'mine')    list = list.filter(p => p.coach_id === uid);
  // 'all' tab — show everyone, no filter

  if (q) list = list.filter(p =>
    (p.psy_profiles?.full_name || '').toLowerCase().includes(q) ||
    (p.mrn || '').toLowerCase().includes(q)
  );

  const tbody  = document.getElementById('table-body');
  const empty  = document.getElementById('table-empty');
  const footer = document.getElementById('table-footer');

  if (!list.length) {
    tbody.innerHTML = '';
    empty.classList.remove('hidden');
    document.getElementById('empty-icon').textContent = currentTab === 'pending' ? '🎉' : '📭';
    document.getElementById('empty-msg').textContent  = currentTab === 'pending'
      ? 'Semua pesakit sudah ditugaskan!' : 'Tiada rekod ditemui.';
    footer.textContent = 'Showing 0 entries';
    return;
  }
  empty.classList.add('hidden');

  tbody.innerHTML = list.map((p, i) => {
    const name     = p.psy_profiles?.full_name || '—';
    const initials = name.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase() || '?';
    const ageYrs   = p.date_of_birth
      ? Math.floor((Date.now() - new Date(p.date_of_birth)) / 31557600000) + ' yrs' : '';
    const mrn      = p.mrn || '—';
    const pkg      = p.active_package_name || '—';
    const wait     = waitLabel(p.package_purchased_at);
    const risk     = riskBadge(p);
    const isMe         = p.coach_id === uid;
    const isAssigned   = !!p.coach_id && !isMe;
    const coachName    = p.coach?.full_name || null;

    const kycHtml = p.status === 'active'
      ? '<span class="kyc-clear">● KYC Cleared</span>'
      : p.status === 'pending_kyc'
      ? '<span class="kyc-pend">● KYC Pending</span>'
      : p.status === 'unregistered'
      ? '<span class="kyc-other">● Belum Aktif</span>'
      : `<span class="kyc-other">● ${window.STATUS_LABELS?.[p.status] || p.status || '—'}</span>`;

    const coachHtml = isMe
      ? `<span class="text-xs font-semibold text-green-700">Saya</span>`
      : coachName
      ? `<span class="text-xs text-ink">${coachName}</span>`
      : `<span class="text-xs text-gray-400">—</span>`;

    const canUnassign = isAssigned && isAdmin;
    const btnHtml = isMe
      ? `<button class="assign-btn unassign" onclick="event.stopPropagation();doUnassign('${p.id}',this)" title="Tarik balik penugasan">Unassign</button>`
      : canUnassign
      ? `<div class="flex items-center gap-1.5 justify-end">
           <button class="assign-btn view" onclick="event.stopPropagation();location.href='patient-hub.html?patient_id=${p.id}'">👁 Lihat</button>
           <button class="assign-btn unassign" onclick="event.stopPropagation();doUnassign('${p.id}',this)" title="Tarik balik penugasan">✕</button>
         </div>`
      : isAssigned
      ? `<button class="assign-btn view" onclick="event.stopPropagation();location.href='patient-hub.html?patient_id=${p.id}'">👁 Lihat</button>`
      : `<button class="assign-btn" onclick="event.stopPropagation();quickAssign('${p.id}',this)">Assign to me</button>`;

    const since = p.package_purchased_at
      ? new Date(p.package_purchased_at).toLocaleDateString('en-GB', { day:'numeric', month:'short' })
      : '—';

    return `<tr class="patient-row border-b border-gray-100 last:border-0"
        onclick="location.href='patient-hub.html?patient_id=${p.id}'" style="cursor:pointer">
      <td class="py-3.5 px-4">
        <input type="checkbox" class="rounded row-chk" data-id="${p.id}"
          onclick="event.stopPropagation();onRowCheck(this)">
      </td>
      <td class="py-3.5 px-3">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-navy text-white flex items-center justify-center text-xs font-bold flex-shrink-0">${initials}</div>
          <div>
            <div class="font-semibold text-sm text-ink">${name}</div>
            <div class="text-xs text-gray-400">ID: ${mrn}${ageYrs ? ' · ' + ageYrs : ''}</div>
          </div>
        </div>
      </td>
      <td class="py-3.5 px-3">${kycHtml}</td>
      <td class="py-3.5 px-3">
        <div class="font-medium text-sm text-ink leading-snug">${pkg}</div>
        <div class="text-xs text-gray-400">Since ${since}</div>
      </td>
      <td class="py-3.5 px-3">${risk}</td>
      <td class="py-3.5 px-3">
        <div class="${wait.cls}">${wait.text}</div>
        <div class="text-xs text-gray-400">Since approval</div>
      </td>
      <td class="py-3.5 px-3">${coachHtml}</td>
      <td class="py-3.5 px-4 text-right">${btnHtml}</td>
    </tr>`;
  }).join('');

  footer.textContent = `Showing 1 to ${list.length} of ${list.length} entries`;
}

// ── Quick assign (inline) ─────────────────────────────
async function quickAssign(pid, btn) {
  const uid  = window.currentUser.id;
  const name = window.currentUser.full_name;
  const role = window.currentUser.staff_role;
  const patient = allPatients.find(x => x.id === pid);
  // Prevent poaching: only allow assigning unassigned patients, unless admin/manager
  if (patient && patient.coach_id && patient.coach_id !== uid
      && role !== 'admin' && role !== 'manager') {
    banner('Pesakit sudah ditugaskan kepada coach lain', 'error');
    return;
  }
  btn.disabled    = true;
  btn.textContent = '...';

  const { error } = await window.db.from('psy_patients')
    .update({ coach_id: uid, assigned_at: new Date().toISOString() })
    .eq('id', pid);

  if (error) {
    btn.textContent = '⚠ Ralat';
    btn.disabled = false;
    return;
  }

  await window.db.from('psy_audit_log').insert({
    actor_id: uid, actor_name: name,
    actor_role: window.currentUser.role || 'staff',
    action: 'patient.assigned', target: pid,
    meta: { coach_id: uid, coach_name: name },
  });

  const p = allPatients.find(x => x.id === pid);
  if (p) { p.coach_id = uid; p.coach = { full_name: window.currentUser.full_name }; }
  loadStats();
  renderTable();
  banner('Pesakit berjaya ditugaskan kepada anda ✅');
}

// ── Unassign ──────────────────────────────────────────
async function doUnassign(pid, btn) {
  const uid  = window.currentUser.id;
  const name = window.currentUser.full_name;
  const role = window.currentUser.staff_role;
  const patient = allPatients.find(x => x.id === pid);
  const isOwner = patient && patient.coach_id === uid;
  const isAdminOrManager = role === 'admin' || role === 'manager';
  if (!isOwner && !isAdminOrManager) {
    banner('Anda hanya boleh tarik balik penugasan pesakit anda sendiri', 'error');
    return;
  }
  if (!confirm('Tarik balik penugasan pesakit ini?')) return;
  btn.disabled = true;
  btn.textContent = '...';

  const { error } = await window.db.from('psy_patients')
    .update({ coach_id: null, assigned_at: null })
    .eq('id', pid);

  if (error) {
    btn.textContent = '⚠';
    btn.disabled = false;
    return;
  }

  await window.db.from('psy_audit_log').insert({
    actor_id: uid, actor_name: name,
    actor_role: window.currentUser.role || 'staff',
    action: 'patient.unassigned', target: pid,
    meta: { unassigned_by: name },
  });

  const p = allPatients.find(x => x.id === pid);
  if (p) { p.coach_id = null; p.assigned_at = null; p.coach = null; }
  loadStats();
  renderTable();
  banner('Penugasan pesakit telah ditarik balik');
}

// ── Stats ─────────────────────────────────────────────
function loadStats() {
  const uid     = window.currentUser?.id;
  const isAdmin = myRole === 'admin' || myRole === 'manager';
  const pending  = allPatients.filter(p => !p.coach_id);
  const mine     = allPatients.filter(p => p.coach_id === uid);
  const assigned = allPatients.filter(p => p.coach_id);

  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set('c-pending', pending.length);
  set('c-mine',    isAdmin ? assigned.length : mine.length);
  set('c-all',     allPatients.length);
}

// ── Export ────────────────────────────────────────────
function exportList() {
  const uid = window.currentUser?.id;
  let list  = allPatients;
  if (currentTab === 'pending') list = list.filter(p => !p.coach_id);
  else if (currentTab === 'mine') list = list.filter(p => p.coach_id === uid);

  const rows = [
    ['No', 'Patient ID', 'Nama', 'Telefon', 'Status', 'Pakej', 'Coach Ditugaskan', 'Tarikh Daftar'],
    ...list.map((p, i) => [
      i + 1,
      p.mrn || '—',
      p.psy_profiles?.full_name || p.full_name || '—',
      p.phone || p.psy_profiles?.phone || '—',
      p.status || '—',
      p.active_package_name || '—',
      p.coach?.full_name || '—',
      p.created_at ? new Date(p.created_at).toLocaleDateString('ms-MY') : '—',
    ])
  ];

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 5 }, { wch: 14 }, { wch: 30 }, { wch: 16 }, { wch: 12 }, { wch: 20 }, { wch: 25 }, { wch: 16 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pesakit');

  const label = currentTab === 'pending' ? 'belum-ditugaskan' : currentTab === 'mine' ? 'pesakit-saya' : 'semua-pesakit';
  XLSX.writeFile(wb, `senarai-pesakit-${label}-${new Date().toISOString().slice(0,10)}.xlsx`);
}

// ── Bulk Select ───────────────────────────────────────
let selectedIds = new Set();

function onRowCheck(chk) {
  const id = chk.dataset.id;
  if (chk.checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBulkBar();
}

function toggleSelectAll(chkAll) {
  document.querySelectorAll('.row-chk').forEach(chk => {
    chk.checked = chkAll.checked;
    const id = chk.dataset.id;
    if (chkAll.checked) selectedIds.add(id);
    else selectedIds.delete(id);
  });
  updateBulkBar();
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('.row-chk').forEach(c => c.checked = false);
  const chkAll = document.getElementById('chk-all');
  if (chkAll) chkAll.checked = false;
  updateBulkBar();
}

function updateBulkBar() {
  const bar = document.getElementById('bulk-bar');
  const count = selectedIds.size;
  if (count > 0) {
    bar.classList.remove('hidden');
    bar.classList.add('flex');
    document.getElementById('bulk-count').textContent = `${count} pesakit dipilih`;
  } else {
    bar.classList.add('hidden');
    bar.classList.remove('flex');
  }
}

async function bulkAssignToMe() {
  if (!selectedIds.size) return;
  const ids = [...selectedIds];
  const uid  = window.currentUser.id;
  const name = window.currentUser.full_name;
  const btn  = document.getElementById('btn-bulk-assign');
  btn.disabled = true; btn.textContent = 'Menghantar...';

  try {
    const { error } = await window.db.from('psy_patients')
      .update({ coach_id: uid, assigned_at: new Date().toISOString() })
      .in('id', ids)
      .is('coach_id', null); // Only assign unassigned ones

    if (error) throw error;

    await Promise.all(ids.map(pid =>
      window.db.from('psy_audit_log').insert({
        actor_id: uid, actor_name: name,
        actor_role: window.currentUser.role || 'staff',
        action: 'patient.assigned', target: pid,
        meta: { coach_id: uid, coach_name: name, bulk: true },
      }).then(() => {}, () => {})
    ));

    ids.forEach(pid => {
      const p = allPatients.find(x => x.id === pid);
      if (p && !p.coach_id) {
        p.coach_id = uid;
        p.coach = { full_name: name };
      }
    });

    clearSelection();
    loadStats();
    renderTable();
    banner(`${ids.length} pesakit berjaya ditugaskan ✅`);
  } catch (e) {
    banner('Ralat bulk assign: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Assign to Me';
  }
}

// ── Load ──────────────────────────────────────────────
async function loadData() {
  myRole = window.currentUser.staff_role;
  const isAdmin = myRole === 'admin' || myRole === 'manager';
  if (isAdmin || myRole === 'coach') {
    document.getElementById('tab-all').classList.remove('hidden');
  }
  if (myRole === 'coach') {
    document.querySelector('h1').textContent = 'Patients';
    document.querySelector('h1 + p').textContent = 'Senarai semua pesakit — tugaskan pesakit baru atau akses hub pesakit sedia ada.';
    document.getElementById('btn-tambah-wrap').classList.remove('hidden');
    setTab('all');
  }

  const { data } = await window.db
    .from('psy_patients')
    .select('*, psy_profiles!psy_patients_user_id_fkey(full_name, phone, email, role), coach:psy_profiles!psy_patients_coach_id_fkey(full_name)')
    .neq('status', 'deleted')
    .order('created_at', { ascending: false });

  allPatients = data || [];
  loadStats();
  renderTable();
}

(async () => {
  const user = await initStaff('assignments', 'Patient Review & Assignment');
  if (!user) return;
  loadData();
})();
</script>
