<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Sesi Konsultasi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🩺</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>
      <div id="k-content" class="p-4 md:p-6"></div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/utils.js"></script>
<script src="_shared.js"></script>
<script>
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDT(d){ return d ? new Date(d).toLocaleString('ms-MY',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'; }
function ageFrom(dob){ if(!dob) return null; const d=new Date(dob),t=new Date(); let a=t.getFullYear()-d.getFullYear(); if(t<new Date(t.getFullYear(),d.getMonth(),d.getDate()))a--; return a; }

const refId = new URLSearchParams(location.search).get('id');
const BUCKET = 'referral-docs';
let ref = null, me = null, vitals = null, riskCount = 0;
let sarananTemplate = null;   // templat mesej boleh-edit (psy_auto_messages key='referral_saranan')
let sarananTemplateId = null; // id row templat (utk deep-link Edit ke Template Mesej)

const SYMPTOMS = [['pening','Pening'],['cepat_letih','Cepat letih'],['berdebar','Berdebar'],['sukar_tidur','Sukar tidur'],['sakit_kepala','Sakit kepala'],['sakit_perut','Sakit perut'],['mual','Mual'],['kebas','Kebas / Semut-semut'],['sukar_fokus','Sukar fokus']];
const TREAT_CATS = [['ubat','💊','Ubat / Suplemen'],['gaya_hidup','🌿','Gaya Hidup'],['pemakanan','🍎','Pemakanan'],['senaman','🏃','Senaman'],['tindak_lanjut','🔁','Tindakan Lanjut']];
const PRIO_MAP = { tinggi:{lbl:'Tinggi',cls:'bg-terracotta/15 text-terracotta'}, sederhana:{lbl:'Sederhana',cls:'bg-gold/20 text-gold-dark'}, rendah:{lbl:'Rendah',cls:'bg-green-100 text-green-700'} };
const STATUS_MAP = { pending:{lbl:'Pending',cls:'bg-amber-100 text-amber-700'}, accepted:{lbl:'Dijadualkan',cls:'bg-blue-100 text-blue-700'}, resolved:{lbl:'Selesai',cls:'bg-green-100 text-green-700'}, declined:{lbl:'Ditolak',cls:'bg-ink/10 text-ink/50'} };

let treatData = { ubat:[], gaya_hidup:[], pemakanan:[], senaman:[], tindak_lanjut:[] };
let consultAtts = [];

async function loadAll() {
  const { data, error } = await window.db.from('psy_clinical_referrals')
    .select('*, psy_patients(full_name, mrn, date_of_birth, gender, active_package_name, phone)').eq('id', refId).maybeSingle();
  if (error) console.error('[konsultasi]', error);
  ref = data;
  if (!ref) { document.getElementById('k-content').innerHTML = '<div class="bg-white rounded-2xl border border-ink/10 p-10 text-center text-ink/40">Rujukan tidak ditemui.</div>'; return; }
  const c = ref.consultation || {};
  treatData = Object.assign({ ubat:[], gaya_hidup:[], pemakanan:[], senaman:[], tindak_lanjut:[] }, c.treatment || {});
  consultAtts = Array.isArray(c.attachments) ? c.attachments : [];
  const [v, risk, tpl] = await Promise.all([
    window.db.from('psy_vitals').select('bp_systolic, bp_diastolic, heart_rate, temperature, weight, created_at').eq('patient_id', ref.patient_id).order('created_at',{ascending:false}).limit(1).then(r=>r.data?.[0]||null,()=>null),
    window.db.from('psy_risk_alerts').select('id',{count:'exact',head:true}).eq('patient_id', ref.patient_id).neq('status','resolved').then(r=>r.count||0,()=>0),
    window.db.from('psy_auto_messages').select('id,message_template,is_active').eq('key','referral_saranan').maybeSingle().then(r=>r.data,()=>null),
  ]);
  vitals = v; riskCount = risk;
  sarananTemplate = (tpl && tpl.is_active !== false && tpl.message_template) ? tpl.message_template : null;
  sarananTemplateId = tpl?.id || null;
  render();
}

// Reusable section header: navy numbered badge + title + optional subtitle
function secHead(n, icon, title, sub) {
  return `<div class="mb-4">
    <h3 class="font-bold text-ink text-[15px] leading-tight flex items-center gap-2">${icon?`<span class="text-base">${icon}</span>`:''}${title}</h3>
    ${sub?`<p class="text-[11px] text-ink/45 mt-0.5">${sub}</p>`:''}
  </div>`;
}

function followUpSection(c, editable) {
  if (!c.saranan_sent_at && !c.follow_up_date) return '';
  const fu = c.follow_up_date;
  const fuStr = fu ? new Date(fu+'T00:00:00').toLocaleDateString('ms-MY',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}) : '—';
  const due = fu && fu <= todayYmd();
  const res = c.follow_up_result;
  let body;
  if (res) {
    const ok = res === 'ikut';
    body = `<div class="flex items-center gap-2 text-sm font-semibold ${ok?'text-green-700':'text-terracotta'}">${ok?'✅ Pesakit ikut saranan':'❌ Pesakit tidak ikut saranan'}</div>${c.follow_up_note?`<div class="text-xs text-ink/60 mt-1">📝 ${esc(c.follow_up_note)}</div>`:''}<div class="text-[10px] text-ink/40 mt-1">Direkod: ${c.follow_up_done_at?fmtDT(c.follow_up_done_at):''}</div>`;
  } else if (editable) {
    body = `<div class="text-sm ${due?'text-gold-dark font-semibold':'text-ink/60'} mb-3">${due?'⏰ Masa untuk follow-up — mesej pesakit & rekod jawapannya.':'Follow-up dijadualkan pada '+fuStr}</div>
      <div class="flex gap-2 flex-wrap"><button onclick="waFollowUp()" class="bg-green text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-green-dark inline-flex items-center gap-1.5">📱 Mesej pesakit</button></div>
      <div class="mt-3 pt-3 border-t border-ink/8">
        <div class="text-[11px] text-ink/50 mb-2">Selepas pesakit balas, rekod jawapan:</div>
        <div class="flex gap-2 flex-wrap">
          <button onclick="recordFollowUp('ikut')" class="border border-green text-green-dark text-sm font-semibold px-4 py-2 rounded-lg hover:bg-green/5">✅ Pesakit ikut</button>
          <button onclick="recordFollowUp('tak_ikut')" class="border border-terracotta text-terracotta text-sm font-semibold px-4 py-2 rounded-lg hover:bg-terracotta/5">❌ Tak ikut</button>
        </div>
      </div>`;
  } else {
    body = `<div class="text-sm text-ink/60">Follow-up dijadualkan pada ${fuStr}${due?' (matang)':''}</div>`;
  }
  return `<section class="p-5 md:p-6 bg-gold/[0.05] ${due&&!res?'ring-1 ring-inset ring-gold/40':''}" id="followup">
    ${secHead('','🩺','Follow-up Saranan','Semak sama ada pesakit ikut saranan')}
    <div class="text-xs text-ink/55 mb-3">Saranan dihantar: ${c.saranan_sent_at?fmtDT(c.saranan_sent_at):'—'} · Follow-up: ${fuStr}${c.saranan_days?` (${c.saranan_days} hari)`:''}</div>
    ${body}
  </section>`;
}
function waFollowUp() {
  const p = ref.psy_patients || {};
  let phone = (p.phone || '').replace(/\D/g,'');
  if (!phone) { banner('Pesakit tiada nombor telefon.','error'); return; }
  if (phone.startsWith('0')) phone = '60' + phone.slice(1);
  else if (!phone.startsWith('60')) phone = '60' + phone;
  const c = ref.consultation || {};
  const nm = p.full_name || 'Pesakit';
  const days = c.saranan_days ? `${c.saranan_days} hari` : 'tempoh yang disarankan';
  const L = [
    `Salam ${nm}, 👋`,
    `Follow-up daripada ${ref.target_name||'doktor'} (Ibnu Sina Wellness).`,
    ``,
    `Adakah anda telah mengikut saranan yang diberi selama ${days}?`,
    c.saranan ? `\nSaranan: ${c.saranan}` : '',
    ``,
    `Mohon balas: *Ya, saya ikut* atau *Belum / Tidak ikut*. Terima kasih. 🌿`,
  ].filter(x => x !== '');
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(L.join('\n'))}`, '_blank');
}
window.waFollowUp = waFollowUp;
async function recordFollowUp(result) {
  let note = '';
  if (result === 'tak_ikut') { note = prompt('Catatan (kenapa tak ikut / tindakan susulan):') || ''; }
  const c = Object.assign({}, ref.consultation||{}, { follow_up_result: result, follow_up_note: note.trim()||null, follow_up_done_at: new Date().toISOString() });
  const { error } = await window.db.from('psy_clinical_referrals').update({ consultation: c, updated_at: new Date().toISOString() }).eq('id', refId);
  if (error) { banner('Ralat: '+error.message,'error'); return; }
  ref.consultation = c;
  if (typeof auditLog==='function'){ try{ await auditLog('referral.followup_recorded', ref.patient_id, {result}); }catch(_){} }
  banner('Follow-up direkod ✅');
  render();
}
window.recordFollowUp = recordFollowUp;

function render() {
  const c = ref.consultation || {};
  const sym = Array.isArray(c.symptoms) ? c.symptoms : [];
  const p = ref.psy_patients || {};
  const nm = p.full_name || p.mrn || 'Pesakit';
  const age = ageFrom(p.date_of_birth), g = p.gender==='M'?'Lelaki':p.gender==='F'?'Perempuan':'';
  const st = STATUS_MAP[ref.status] || STATUS_MAP.pending;
  const pr = PRIO_MAP[ref.priority] || PRIO_MAP.sederhana;
  // Terbuka: mana-mana staff boleh tulis konsultasi (cth coach isi bagi pihak penerima). Kunci hanya bila resolved/declined.
  const editable = ref.status !== 'resolved' && ref.status !== 'declined';
  const refDocs = Array.isArray(ref.attachments) ? ref.attachments : [];
  const done = { accepted: ['accepted','resolved'].includes(ref.status), resolved: ref.status === 'resolved' };
  const dis = editable ? '' : 'disabled';

  document.getElementById('k-content').innerHTML = `
    <a href="rujukan.html" class="inline-flex items-center gap-1 text-sm text-navy hover:underline">← Kembali ke Rujukan</a>

    <!-- Page title -->
    <div class="mt-3 mb-5">
      <h1 class="text-2xl font-extrabold text-ink">Sesi Konsultasi</h1>
      <p class="text-sm text-ink/45 mt-1 flex items-center gap-2">Lengkapkan maklumat konsultasi &amp; tindakan
        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${st.cls}">${st.lbl}</span></p>
    </div>

    <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
    <div class="grid lg:grid-cols-[290px_1fr]">

      <!-- LEFT: reference column (divided sections) -->
      <div class="divide-y divide-ink/8 lg:border-r border-ink/8 bg-cream/20">
        <!-- Patient identity -->
        <div class="p-5 flex items-center gap-3">
          <div class="w-12 h-12 rounded-full bg-navy/10 flex items-center justify-center font-bold text-navy text-sm flex-shrink-0">${esc(nm.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase())}</div>
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap"><span class="font-bold text-ink text-sm leading-tight">${esc(nm)}</span><span class="text-[10px] font-mono text-ink/40">${esc(p.mrn||'')}</span></div>
            <div class="text-[11px] text-ink/50 mt-0.5">${[age!=null?age+' tahun':'', g, p.active_package_name?'Pakej: '+p.active_package_name:''].filter(Boolean).join(' · ')}</div>
          </div>
        </div>
        <div class="p-5 space-y-3">
          <h3 class="font-bold text-sm text-ink">Ringkasan Rujukan</h3>
          <div><div class="text-[10px] font-bold text-ink/45 uppercase tracking-wider">Sebab Rujukan</div><div class="text-sm text-ink/80 mt-0.5">⚠️ ${esc(ref.reason)}</div></div>
          <div class="flex items-center gap-2 flex-wrap">
            <div class="text-[10px] font-bold text-ink/45 uppercase tracking-wider">Keutamaan</div>
            <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full ${pr.cls}">${pr.lbl}</span>
          </div>
          ${ref.meet_date ? `<div><div class="text-[10px] font-bold text-ink/45 uppercase tracking-wider">Tarikh Rujukan</div><div class="text-sm text-ink/80 mt-0.5">📅 ${new Date(ref.meet_date+'T00:00:00').toLocaleDateString('ms-MY',{day:'2-digit',month:'short',year:'numeric'})}</div></div>` : ''}
          <div><div class="text-[10px] font-bold text-ink/45 uppercase tracking-wider">Dirujuk oleh</div><div class="text-sm text-ink/80 mt-0.5">👤 ${esc(ref.referred_by_name||'Staff')}</div></div>
          ${refDocs.length ? `<div><div class="text-[10px] font-bold text-ink/45 uppercase tracking-wider mb-1">Dokumen Rujukan</div>${refDocs.map(a=>`<button onclick="viewDoc('${esc(a.path)}')" class="w-full flex items-center gap-2 border border-ink/10 rounded-lg px-2 py-1.5 text-xs text-ink/75 hover:bg-cream/50 mt-1"><span>📄</span><span class="truncate flex-1 text-left">${esc(a.name)}</span><span class="text-navy">⬇</span></button>`).join('')}</div>` : ''}
        </div>

        <div class="p-5">
          <h3 class="font-bold text-sm text-ink mb-2">Vitals Terkini ${vitals?`<span class="text-[10px] font-normal text-ink/40">(${new Date(vitals.created_at).toLocaleDateString('ms-MY',{day:'2-digit',month:'short'})})</span>`:''}</h3>
          ${vitals ? `<div class="grid grid-cols-4 gap-2 text-center">
            <div><div class="font-bold text-ink text-sm">${vitals.bp_systolic&&vitals.bp_diastolic?`${vitals.bp_systolic}/${vitals.bp_diastolic}`:'—'}</div><div class="text-[9px] text-ink/40">mmHg</div></div>
            <div><div class="font-bold text-ink text-sm">${vitals.heart_rate||'—'}</div><div class="text-[9px] text-ink/40">bpm</div></div>
            <div><div class="font-bold text-ink text-sm">${vitals.temperature||'—'}</div><div class="text-[9px] text-ink/40">°C</div></div>
            <div><div class="font-bold text-ink text-sm">${vitals.weight||'—'}</div><div class="text-[9px] text-ink/40">kg</div></div>
          </div>` : '<p class="text-xs text-ink/40 italic">Tiada vitals.</p>'}
          <a href="patient-hub.html?patient_id=${ref.patient_id}&tab=vitals" class="block text-xs font-semibold text-navy hover:underline mt-3">Lihat trend vitals →</a>
        </div>

        <div class="p-5">
          <h3 class="font-bold text-sm text-ink mb-3">📎 Lampiran</h3>
          ${editable?`<label class="block border-2 border-dashed border-ink/15 rounded-xl py-6 text-center cursor-pointer hover:border-navy/40 transition-colors"><div class="text-2xl mb-1">☁️</div><div class="text-sm text-ink/60">Klik untuk pilih fail</div><div class="text-[10px] text-ink/40 mt-0.5">PDF, JPG, PNG (Maks. 10MB)</div><input type="file" class="hidden" multiple onchange="uploadConsult(this)"></label>`:''}
          <div id="k-att-list" class="space-y-1.5 mt-2"></div>
        </div>
      </div>

      <!-- RIGHT: consultation form column -->
      <div class="divide-y divide-ink/8">

          <!-- 1. Simptom -->
          <section class="p-5 md:p-6">
            ${secHead(1,'🪧','Simptom / Aduan Utama','Tandakan simptom yang pesakit alami')}
            <div class="grid grid-cols-2 md:grid-cols-3 gap-x-4 gap-y-2.5">
              ${SYMPTOMS.map(([k,l])=>`<label class="flex items-center gap-2 text-sm text-ink/80"><input type="checkbox" class="k-sym accent-navy w-4 h-4" value="${k}" ${sym.includes(k)?'checked':''} ${dis}> ${l}</label>`).join('')}
              <label class="flex items-center gap-2 text-sm text-ink/80"><input type="checkbox" id="k-sym-lain-cb" class="accent-navy w-4 h-4" ${c.symptoms_other?'checked':''} ${dis}> Lain-lain</label>
            </div>
            <input id="k-sym-other" value="${esc(c.symptoms_other||'')}" ${dis} placeholder="Nyatakan simptom lain…" class="w-full mt-3 px-3 py-2.5 border border-ink/15 rounded-lg text-sm outline-none focus:border-navy">
          </section>

          <!-- 2. Penilaian Klinikal (pemeriksaan + diagnosis digabung) -->
          <section class="p-5 md:p-6">
            ${secHead(2,'📝','Nota','Pemeriksaan, penemuan &amp; diagnosis')}
            <div class="grid md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-ink/55 mb-1.5">Pemeriksaan &amp; Penemuan</label>
                <textarea id="k-exam" rows="4" ${dis} class="w-full px-3 py-2.5 border border-ink/15 rounded-lg text-sm outline-none focus:border-navy resize-y" placeholder="Nyatakan penemuan berdasarkan pemeriksaan…">${esc(c.examination||'')}</textarea>
              </div>
              <div>
                <label class="block text-xs font-semibold text-ink/55 mb-1.5">Diagnosis</label>
                <textarea id="k-diag" rows="4" ${dis} class="w-full px-3 py-2.5 border border-ink/15 rounded-lg text-sm outline-none focus:border-navy resize-y" placeholder="Nyatakan diagnosis…">${esc(c.diagnosis||'')}</textarea>
              </div>
            </div>
          </section>

          <!-- 3. Saranan untuk Pesakit (hantar WhatsApp) -->
          <section class="p-5 md:p-6 bg-green-50/60">
            ${secHead(3,'📱','Saranan untuk Pesakit','Mesej ringkas yang akan dihantar ke WhatsApp pesakit')}
            <div class="grid lg:grid-cols-2 gap-5">
              <!-- KIRI: input saranan -->
              <div>
                <label class="block text-xs font-semibold text-ink/55 mb-1.5">Saranan ringkas</label>
                <textarea id="k-saranan" rows="4" ${dis} oninput="updSarananPreview()" class="w-full px-3 py-2.5 border border-green-300 bg-white rounded-lg text-sm outline-none focus:border-green resize-y" placeholder="Cth: Sila ambil ubat 2x sehari selepas makan & elak makanan pedas…">${esc(c.saranan||'')}</textarea>
                <div class="mt-3">
                  <label class="block text-xs font-semibold text-ink/55 mb-1.5">Tempoh ikut (hari)</label>
                  <input id="k-days" type="number" min="1" max="90" value="${c.saranan_days||''}" ${dis} oninput="updFollowUp()" placeholder="cth: 4" class="w-full px-3 py-2.5 border border-ink/15 rounded-lg text-sm outline-none focus:border-navy">
                </div>
                <div class="mt-3">
                  <label class="block text-xs font-semibold text-ink/55 mb-1.5">Tarikh mula</label>
                  <input id="k-start" type="date" value="${c.saranan_start||todayYmd()}" ${dis} onchange="updFollowUp()" class="w-full px-3 py-2.5 border border-ink/15 rounded-lg text-sm outline-none focus:border-navy">
                </div>
                <p id="k-followup-hint" class="text-[11px] text-ink/50 mt-2"></p>
              </div>

              <!-- KANAN: pratonton mesej penuh yang pesakit akan terima -->
              <div class="flex flex-col h-full">
                <div class="flex items-center justify-between mb-1.5">
                  <label class="block text-[11px] font-semibold text-ink/45">👁️ Pratonton mesej WhatsApp</label>
                  <a href="${sarananTemplateId?`auto-mesej.html?edit=${sarananTemplateId}`:'auto-mesej.html'}" title="Edit ayat mesej saranan di Template Mesej" class="text-[11px] font-semibold text-navy hover:underline whitespace-nowrap">✎ Edit ayat mesej</a>
                </div>
                <div class="rounded-2xl overflow-hidden border border-ink/10 flex-1 flex flex-col">
                  <div class="bg-[#075e54] text-white px-3 py-2 flex items-center gap-2 text-[13px]"><span class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center">🏥</span><div><div class="font-semibold leading-tight">Ibnu Sina Wellness</div><div class="text-[10px] text-white/70">Online</div></div></div>
                  <div class="p-3 flex-1 min-h-[120px]" style="background:#e5ddd5">
                    <div id="k-preview" class="bg-[#dcf8c6] rounded-lg rounded-tl-none px-3 py-2 text-[12px] text-ink/85 leading-relaxed whitespace-pre-wrap shadow-sm max-w-[92%]"></div>
                  </div>
                </div>
              </div>
            </div>

            ${editable ? `<div class="flex items-center gap-2 flex-wrap mt-4">
              <button id="k-send-btn" onclick="sendWhatsApp()" class="inline-flex items-center gap-2 bg-green text-white text-sm font-semibold px-4 py-2.5 rounded-xl hover:bg-green-dark disabled:opacity-60">📱 Hantar ke WhatsApp</button>
              <span id="k-wa-sent" class="text-[11px] text-ink/50">${c.saranan_sent_at?('✅ Dihantar '+fmtDT(c.saranan_sent_at)):''}</span>
            </div>` : (c.saranan_sent_at?`<p class="text-[11px] text-ink/50 mt-2">✅ Saranan dihantar ${fmtDT(c.saranan_sent_at)}</p>`:'')}
          </section>

          ${followUpSection(c, editable)}

      </div>
    </div>
    </div>

    <p id="k-error" class="hidden text-xs text-terracotta mt-3"></p>

    ${editable ? `<div class="mt-5 pb-4 flex items-center justify-between gap-3">
      <button onclick="saveConsult(false)" class="px-5 py-2.5 border border-navy/20 rounded-xl text-sm font-semibold text-navy hover:bg-navy/5 bg-white">💾 Simpan Draf</button>
      <button onclick="saveConsult(true)" class="bg-green text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-green-dark inline-flex items-center gap-2 shadow-sm">✓ Selesaikan Konsultasi</button>
    </div>` : '<div class="pb-10"></div>'}`;

  TREAT_CATS.forEach(([k]) => renderTreatChips(k));
  renderConsultAtts(editable);
  updFollowUp();
}

function renderTreatChips(cat) {
  const host = document.getElementById('tr-chips-' + cat);
  if (!host) return;
  // Terbuka: mana-mana staff boleh tulis konsultasi (cth coach isi bagi pihak penerima). Kunci hanya bila resolved/declined.
  const editable = ref.status !== 'resolved' && ref.status !== 'declined';
  host.innerHTML = (treatData[cat]||[]).map((x,i) =>
    `<span class="inline-flex items-center gap-1 bg-cream border border-ink/10 rounded-full px-2 py-0.5 text-[11px]">${esc(x)}${editable?`<button onclick="removeTreat('${cat}',${i})" class="text-terracotta font-bold">×</button>`:''}</span>`).join('');
}
function addTreat(cat) {
  const inp = document.getElementById('tr-in-'+cat);
  const v = (inp.value||'').trim();
  if (!v) return;
  treatData[cat] = treatData[cat] || [];
  treatData[cat].push(v); inp.value = ''; renderTreatChips(cat);
}
window.addTreat = addTreat;
function removeTreat(cat, i) { treatData[cat].splice(i,1); renderTreatChips(cat); }
window.removeTreat = removeTreat;

function renderConsultAtts(editable) {
  const host = document.getElementById('k-att-list');
  if (!host) return;
  host.innerHTML = consultAtts.length ? consultAtts.map((a,i)=>`<div class="flex items-center justify-between gap-2 border border-ink/10 rounded-lg px-2 py-1.5 text-xs"><button onclick="viewDoc('${esc(a.path)}')" class="truncate text-left flex-1">📄 ${esc(a.name)}</button>${editable?`<button onclick="removeConsultAtt(${i})" class="text-terracotta font-bold">×</button>`:''}</div>`).join('') : '<p class="text-[11px] text-ink/35 italic">Tiada fail.</p>';
}
async function uploadConsult(input) {
  for (const f of [...input.files]) {
    const path = `${refId}/consult_${Date.now()}_${f.name.replace(/[^\w.\-]/g,'_')}`;
    const { error } = await window.db.storage.from(BUCKET).upload(path, f, { contentType: f.type||undefined });
    if (!error) consultAtts.push({ name: f.name, path, uploaded_at: new Date().toISOString() });
  }
  input.value = '';
  renderConsultAtts(true);
  banner('Fail dimuat naik ✅');
}
window.uploadConsult = uploadConsult;
async function removeConsultAtt(i) {
  const [rm] = consultAtts.splice(i,1);
  if (rm?.path) { try { await window.db.storage.from(BUCKET).remove([rm.path]); } catch(_){} }
  renderConsultAtts(true);
}
window.removeConsultAtt = removeConsultAtt;
async function viewDoc(path) {
  const { data, error } = await window.db.storage.from(BUCKET).createSignedUrl(path, 3600);
  if (error || !data?.signedUrl) { banner('Gagal buka fail','error'); return; }
  window.open(data.signedUrl, '_blank');
}
window.viewDoc = viewDoc;

function todayYmd(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDaysYmd(ymd, n){ const d=new Date(ymd+'T00:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function prettyYmd(ymd){ return ymd ? new Date(ymd+'T00:00:00').toLocaleDateString('ms-MY',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}) : ''; }
function computeFollowUp(){
  const days = parseInt(document.getElementById('k-days')?.value)||0;
  const start = document.getElementById('k-start')?.value || '';
  if (!days || !start) return null;
  return addDaysYmd(start, days);   // tarikh follow-up = mula + tempoh
}
function updFollowUp(){
  const hint = document.getElementById('k-followup-hint');
  if (hint) {
    const fu = computeFollowUp();
    const days = parseInt(document.getElementById('k-days')?.value)||0;
    hint.textContent = fu ? `📅 Pesakit ikut selama ${days} hari · follow-up pada ${prettyYmd(fu)}` : '';
  }
  updSarananPreview();
}
window.updFollowUp = updFollowUp;

// Pratonton mesej penuh yang akan diterima pesakit (bukan hanya teks saranan).
function updSarananPreview(){
  const box = document.getElementById('k-preview'); if (!box) return;
  const saranan = (document.getElementById('k-saranan')?.value||'').trim();
  if (!saranan) { box.innerHTML = '<span class="italic text-ink/40">Isi saranan di atas untuk lihat pratonton mesej…</span>'; return; }
  box.innerHTML = esc(buildWaMessage()).replace(/\*(.+?)\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
}
window.updSarananPreview = updSarananPreview;

function buildWaMessage(){
  const p = ref.psy_patients || {};
  const nm = p.full_name || 'Pesakit';
  const saranan = (document.getElementById('k-saranan')?.value || '').trim();
  const days = parseInt(document.getElementById('k-days')?.value)||0;
  const start = document.getElementById('k-start')?.value || '';
  const pengesyor = ref.target_name || 'doktor';
  const tarikh = start ? prettyYmd(start) : '';

  // Guna templat boleh-edit (Mesej Automatik) kalau ada — staff edit sendiri via auto-mesej.html.
  if (sarananTemplate) {
    let t = sarananTemplate;
    // Kalau tiada tempoh/tarikh, buang baris yg mengandungi placeholder tempoh/tarikh.
    if (!days || !start) t = t.split('\n').filter(ln => !/\{tempoh\}|\{tarikh\}/.test(ln)).join('\n');
    t = t.replace(/\{nama\}/g, nm)
         .replace(/\{pengesyor\}/g, pengesyor)
         .replace(/\{saranan\}/g, saranan)
         .replace(/\{tempoh\}/g, String(days || ''))
         .replace(/\{tarikh\}/g, tarikh);
    return t.replace(/\n{3,}/g, '\n\n').trim();  // kemas baris kosong berlebihan
  }

  // Fallback hardcoded (kalau templat tiada / tak aktif).
  const L = [];
  L.push(`Salam ${nm}, 👋`);
  L.push(`Berikut saranan daripada ${pengesyor} (Ibnu Sina Wellness):`);
  L.push('');
  if (saranan) { L.push(saranan); L.push(''); }
  if (days && start) { L.push(`⏱️ Sila ikut selama *${days} hari* bermula ${tarikh}.`); L.push(''); }
  L.push('Terima kasih & semoga cepat sihat. 🌿');
  return L.join('\n');
}

async function persistSaranan(extra){
  const c = ref.consultation || {};
  const consultation = Object.assign({}, c, {
    saranan: (document.getElementById('k-saranan')?.value || '').trim(),
    saranan_days: parseInt(document.getElementById('k-days')?.value)||null,
    saranan_start: document.getElementById('k-start')?.value || null,
    follow_up_date: computeFollowUp(),
  }, extra || {});
  const { error } = await window.db.from('psy_clinical_referrals')
    .update({ consultation, updated_at: new Date().toISOString() }).eq('id', refId);
  if (error) { banner('Ralat simpan saranan: '+error.message,'error'); return false; }
  ref.consultation = consultation;
  return true;
}

// Panggil Edge Function GHL (sama seperti inbox) — unwrap data & lempar ralat.
async function ghlInvoke(action, extra = {}) {
  const { data, error } = await window.db.functions.invoke('ghl-inbox', { body: { action, ...extra } });
  if (error) {
    let msg = error.message;
    try { const ctx = await error.context?.json(); if (ctx?.error) msg = ctx.error; } catch(_){}
    throw new Error(msg);
  }
  if (data?.error) throw new Error(data.error);
  return data;
}

async function sendWhatsApp(){
  const p = ref.psy_patients || {};
  let phone = (p.phone || '').replace(/\D/g,'');
  if (!phone) { banner('Pesakit tiada nombor telefon — kemas kini di profil pesakit.','error'); return; }
  if (phone.startsWith('0')) phone = '60' + phone.slice(1);
  else if (!phone.startsWith('60')) phone = '60' + phone;
  const saranan = (document.getElementById('k-saranan')?.value || '').trim();
  if (!saranan) { banner('Isi mesej saranan dahulu.','error'); return; }
  const msg = buildWaMessage();
  // Mesej ke pesakit tak boleh tarik balik — sahkan dulu.
  if (!confirm('Hantar saranan ini ke WhatsApp pesakit sekarang?')) return;

  const btn = document.getElementById('k-send-btn');
  const btnTxt = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Menghantar…'; }
  try {
    // AUTO-HANTAR terus via GHL: 1) pastikan contact wujud, 2) hantar mesej.
    const ec = await ghlInvoke('ensurecontact', { phone, name: p.full_name || '' });
    const contactId = ec?.contact?.contactId;
    if (!contactId) throw new Error('Tak dapat sediakan contact GHL untuk nombor ini.');
    await ghlInvoke('send', { contactId, message: msg });
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = btnTxt || '📱 Hantar ke WhatsApp'; }
    banner('Gagal auto-hantar: ' + (e.message || e) + ' — inbox dibuka untuk hantar manual.', 'error');
    // Fallback supaya saranan tak hilang — buka inbox dgn mesej pra-isi.
    window.open(`inbox.html?phone=${encodeURIComponent(phone)}&name=${encodeURIComponent(p.full_name||'')}&draft=${encodeURIComponent(msg)}`, '_blank');
    return;
  }

  const now = new Date().toISOString();
  await persistSaranan({ saranan_sent_at: now });
  // notif dalam-app untuk pesakit (jika ada akaun)
  if (p && ref.patient_id) {
    try {
      const { data: pt } = await window.db.from('psy_patients').select('user_id').eq('id', ref.patient_id).maybeSingle();
      if (pt?.user_id) await window.db.from('psy_notifications').insert({ user_id: pt.user_id, type:'referral', title:'Saranan Doktor', body: saranan || 'Anda ada saranan baru daripada doktor. Sila semak WhatsApp.', link:'dashboard.html' });
    } catch(_){}
  }
  if (typeof auditLog === 'function') { try { await auditLog('referral.saranan_sent', ref.patient_id, {}); } catch(_){} }
  const el = document.getElementById('k-wa-sent'); if (el) el.textContent = '✅ Dihantar '+fmtDT(now);
  if (btn) { btn.disabled = false; btn.textContent = btnTxt || '📱 Hantar ke WhatsApp'; }
  banner('Saranan dihantar ke WhatsApp pesakit ✅');
}
window.sendWhatsApp = sendWhatsApp;

async function saveConsult(finalize) {
  const sym = [...document.querySelectorAll('.k-sym:checked')].map(x=>x.value);
  const consultation = {
    symptoms: sym,
    symptoms_other: document.getElementById('k-sym-lain-cb').checked ? (document.getElementById('k-sym-other').value.trim()||'') : '',
    examination: document.getElementById('k-exam').value.trim() || '',
    diagnosis: document.getElementById('k-diag').value.trim() || '',
    treatment: treatData,
    summary: (document.getElementById('k-note')?.value.trim()) || '',
    saranan: (document.getElementById('k-saranan')?.value.trim()) || '',
    saranan_days: parseInt(document.getElementById('k-days')?.value)||null,
    saranan_start: document.getElementById('k-start')?.value || null,
    follow_up_date: computeFollowUp(),
    saranan_sent_at: (ref.consultation||{}).saranan_sent_at || null,
    attachments: consultAtts,
  };
  const patch = { consultation, updated_at: new Date().toISOString() };
  if (finalize) { patch.status = 'resolved'; patch.resolved_at = new Date().toISOString(); patch.resolution_note = consultation.diagnosis || consultation.summary || null; }
  const { error } = await window.db.from('psy_clinical_referrals').update(patch).eq('id', refId);
  if (error) { const e=document.getElementById('k-error'); e.textContent='Ralat: '+error.message; e.classList.remove('hidden'); return; }
  Object.assign(ref, patch);
  if (typeof auditLog === 'function') { try { await auditLog(finalize?'referral.resolved':'referral.consult_saved', ref.patient_id, {}); } catch(_){} }
  if (finalize) { banner('Konsultasi selesai ✅'); location.href = 'rujukan.html'; }
  else { banner('Draf disimpan ✅'); }
}
window.saveConsult = saveConsult;

(async () => {
  const user = await initStaff('rujukan', 'Sesi konsultasi rujukan');
  if (!user) return;
  me = window.currentUser?.id || user.id;
  if (!refId) { document.getElementById('k-content').innerHTML = '<div class="text-center text-ink/40 py-10">ID rujukan tiada.</div>'; return; }
  await loadAll();
})();
</script>
