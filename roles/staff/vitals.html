<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Vitals Capture</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📊</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-4">
        <div class="grid md:grid-cols-2 gap-4">
          <div class="bg-white rounded-xl p-4 border border-ink/10">
            <label class="text-xs font-semibold mb-2 block">Tarikh Vitals</label>
            <input type="date" id="entry-date" onchange="loadPatientsForDate()" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm outline-none focus:border-navy">
          </div>
          <div class="bg-white rounded-xl p-4 border border-ink/10">
            <label class="text-xs font-semibold mb-2 block">Pilih pesakit</label>
            <select id="patient-select" onchange="loadPatientVitalsHistory()" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm outline-none focus:border-navy">
              <option value="">— Pilih pesakit —</option>
            </select>
          </div>
        </div>

        <!-- Patient vitals history (shown when patient selected) -->
        <div id="patient-history-section" class="hidden bg-white rounded-xl p-5 border border-ink/10">
          <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
            <h4 class="font-bold text-sm">Sejarah Vitals Pesakit</h4>
            <span id="history-count" class="text-xs text-ink/60"></span>
          </div>
          <div id="patient-history-list" class="space-y-2 max-h-80 overflow-y-auto"></div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
          <div class="vital-input"><div class="text-[10px] text-ink/50 uppercase">BP Systolic</div><input id="v-sys" type="number" placeholder="120"></div>
          <div class="vital-input"><div class="text-[10px] text-ink/50 uppercase">BP Diastolic</div><input id="v-dia" type="number" placeholder="80"></div>
          <div class="vital-input"><div class="text-[10px] text-ink/50 uppercase">Heart Rate</div><input id="v-hr" type="number" placeholder="72"></div>
          <div class="vital-input"><div class="text-[10px] text-ink/50 uppercase">SpO2 (%)</div><input id="v-spo2" type="number" placeholder="98"></div>
          <div class="vital-input"><div class="text-[10px] text-ink/50 uppercase">Suhu (°C)</div><input id="v-temp" type="number" step="0.1" placeholder="36.8"></div>
          <div class="vital-input"><div class="text-[10px] text-ink/50 uppercase">Berat (kg)</div><input id="v-weight" type="number" step="0.1" placeholder="70"></div>
          <div class="vital-input"><div class="text-[10px] text-ink/50 uppercase">Tinggi (cm)</div><input id="v-height" type="number" placeholder="167"></div>
          <div class="vital-input"><div class="text-[10px] text-ink/50 uppercase">Lilitan Perut</div><input id="v-waist" type="number" placeholder="90"></div>
        </div>

        <div class="grid lg:grid-cols-2 gap-4">
          <div class="bg-white rounded-xl p-4 border border-ink/10">
            <h4 class="font-bold mb-2 text-sm">Point-of-Care</h4>
            <div class="grid grid-cols-2 gap-3 text-sm">
              <div><label class="text-xs">RBS (mmol/L)</label><input id="v-rbs" type="number" step="0.1" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></div>
              <div><label class="text-xs">PHQ-2</label><input id="v-phq2" type="number" max="6" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></div>
            </div>
          </div>
          <div class="bg-white rounded-xl p-4 border border-ink/10">
            <h4 class="font-bold mb-2 text-sm">Observasi</h4>
            <textarea id="v-notes" rows="3" placeholder="Nota pemerhatian..." class="w-full px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
          </div>
        </div>

        <div class="flex gap-2">
          <button onclick="saveVitals()" class="bg-green text-white font-semibold px-6 py-2.5 rounded-lg">Simpan Vitals</button>
          <button onclick="resetForm()" class="bg-cream px-6 py-2.5 rounded-lg">Reset</button>
        </div>

        <div class="pt-6 border-t border-ink/10">
          <h3 class="font-bold mb-3">Vitals Terkini · Hari Ini</h3>
          <div class="bg-white rounded-xl border border-ink/10 overflow-x-auto">
            <table class="data">
              <thead><tr><th>Patient</th><th>BP</th><th>HR</th><th>BMI</th><th>Notes</th><th>Time</th></tr></thead>
              <tbody id="recent-vitals-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
async function saveVitals() {
  const patientId = document.getElementById('patient-select').value;
  if (!patientId) { banner('Sila pilih pesakit', 'error'); return; }

  const w = parseFloat(document.getElementById('v-weight').value);
  const h = parseFloat(document.getElementById('v-height').value);
  const bmi = w && h ? parseFloat((w / ((h/100) ** 2)).toFixed(1)) : null;

  const dateVal = document.getElementById('entry-date').value;
  const d = new Date();
  const timeStr = [String(d.getHours()).padStart(2, '0'), String(d.getMinutes()).padStart(2, '0'), String(d.getSeconds()).padStart(2, '0')].join(':');
  const createdAt = new Date(`${dateVal}T${timeStr}`).toISOString();

  await dbInsert('psy_vitals', {
    patient_id: patientId,
    created_at: createdAt,
    recorded_by: window.currentUser.id,
    bp_systolic: parseInt(document.getElementById('v-sys').value) || null,
    bp_diastolic: parseInt(document.getElementById('v-dia').value) || null,
    heart_rate: parseInt(document.getElementById('v-hr').value) || null,
    spo2: parseFloat(document.getElementById('v-spo2').value) || null,
    temperature: parseFloat(document.getElementById('v-temp').value) || null,
    weight: w || null,
    height: h || null,
    bmi,
    waist_cm: parseFloat(document.getElementById('v-waist').value) || null,
    rbs: parseFloat(document.getElementById('v-rbs').value) || null,
    phq2_score: parseInt(document.getElementById('v-phq2').value) || null,
    notes: document.getElementById('v-notes').value,
  });
  await auditLog('vitals.recorded', patientId);
  banner('Vitals disimpan');
  resetForm();
  loadRecent();
  loadPatientVitalsHistory();
}

function resetForm() {
  document.querySelectorAll('input[id^="v-"], #v-notes').forEach(i => i.value = '');
}

async function loadPatientVitalsHistory() {
  const patientId = document.getElementById('patient-select').value;
  const section = document.getElementById('patient-history-section');

  if (!patientId) {
    section.classList.add('hidden');
    return;
  }

  section.classList.remove('hidden');
  const data = await dbQuery('psy_vitals', {
    eq: { patient_id: patientId },
    order: { col: 'created_at' },
  }).catch(() => []);

  document.getElementById('history-count').textContent = `${data.length} bacaan`;

  document.getElementById('patient-history-list').innerHTML = data.length
    ? data.map((v, idx) => `
      <div class="border border-ink/10 rounded-lg p-3">
        <div class="flex items-center justify-between mb-2 flex-wrap gap-1">
          <div class="text-xs text-ink/60">${new Date(v.created_at).toLocaleString('ms-MY')}</div>
          ${idx === 0 ? '<span class="chip bg-green-light text-green-dark">Latest</span>' : ''}
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
          ${v.bp_systolic ? `<div><span class="text-ink/50">BP:</span> <strong>${v.bp_systolic}/${v.bp_diastolic}</strong></div>` : ''}
          ${v.heart_rate ? `<div><span class="text-ink/50">HR:</span> <strong>${v.heart_rate} bpm</strong></div>` : ''}
          ${v.bmi ? `<div><span class="text-ink/50">BMI:</span> <strong>${v.bmi}</strong></div>` : ''}
          ${v.weight ? `<div><span class="text-ink/50">Weight:</span> <strong>${v.weight} kg</strong></div>` : ''}
          ${v.spo2 ? `<div><span class="text-ink/50">SpO2:</span> <strong>${v.spo2}%</strong></div>` : ''}
          ${v.temperature ? `<div><span class="text-ink/50">Temp:</span> <strong>${v.temperature}°C</strong></div>` : ''}
          ${v.waist_cm ? `<div><span class="text-ink/50">Waist:</span> <strong>${v.waist_cm} cm</strong></div>` : ''}
          ${v.rbs ? `<div><span class="text-ink/50">RBS:</span> <strong>${v.rbs}</strong></div>` : ''}
          ${v.phq2_score !== null && v.phq2_score !== undefined ? `<div><span class="text-ink/50">PHQ-2:</span> <strong>${v.phq2_score}</strong></div>` : ''}
        </div>
        ${v.notes ? `<div class="text-xs text-ink/60 mt-2 italic">💬 ${v.notes}</div>` : ''}
      </div>`).join('')
    : '<p class="text-ink/40 text-sm text-center py-4">Tiada sejarah bacaan untuk pesakit ini</p>';
}

async function loadRecent() {
  const today = new Date().toISOString().split('T')[0];
  const data = await dbQuery('psy_vitals', { order: { col: 'created_at' }, limit: 20 });
  const todayData = data.filter(v => v.created_at?.startsWith(today));

  const patientsRes = await window.db.from('psy_patients').select('*, psy_profiles!psy_patients_user_id_fkey(full_name)');
  const patients = patientsRes.data || [];
  const patientMap = {};
  patients.forEach(p => patientMap[p.id] = p.psy_profiles?.full_name || p.mrn);

  document.getElementById('recent-vitals-body').innerHTML = todayData.length
    ? todayData.map(v => `<tr>
        <td><strong>${patientMap[v.patient_id] || '—'}</strong></td>
        <td>${v.bp_systolic ? `${v.bp_systolic}/${v.bp_diastolic}` : '—'}</td>
        <td>${v.heart_rate || '—'}</td>
        <td>${v.bmi || '—'}</td>
        <td class="text-xs">${(v.notes || '').slice(0, 40)}</td>
        <td class="text-xs">${formatTime(v.created_at)}</td>
      </tr>`).join('')
    : '<tr><td colspan="6" class="text-center text-ink/40 py-6">Tiada vitals direkodkan hari ini</td></tr>';
}

(async () => {
  const user = await initStaff('psy_vitals', 'Bacaan klinikal pesakit');
  if (!user) return;

  const d = new Date();
  const localToday = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  document.getElementById('entry-date').value = localToday;
  await loadPatientsForDate();
  
  loadRecent();
})();

async function loadPatientsForDate() {
  const dateStr = document.getElementById('entry-date').value;
  if (!dateStr) return;

  const { data: apps } = await window.db.from('psy_plan_weekly_progress')
    .select('patient_id')
    .gte('session_date', dateStr + 'T00:00:00')
    .lte('session_date', dateStr + 'T23:59:59')
    .in('status', ['booked', 'reschedule', 'hadir']);
  const todayPatientIds = new Set((apps || []).map(a => a.patient_id));

  const res = await window.db.from('psy_patients').select('*, psy_profiles!psy_patients_user_id_fkey(full_name)').eq('status', 'active');
  let patients = res.data || [];
  
  patients = patients.filter(p => todayPatientIds.has(p.id));

  document.getElementById('patient-select').innerHTML = '<option value="">— Pilih pesakit —</option>' +
    patients.map(p => `<option value="${p.id}">${p.psy_profiles?.full_name || p.mrn} · ${p.mrn}</option>`).join('');
  document.getElementById('patient-history-section')?.classList.add('hidden');
}
</script>
</body>
</html>
