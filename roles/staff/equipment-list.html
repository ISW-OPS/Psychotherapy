<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Equipment List</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🛠️</div><p class="text-ink/60 text-sm">Memuatkan Equipment List...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <div class="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h2 class="text-lg font-bold text-navy">Equipment List</h2>
            <p class="text-xs text-ink/50 mt-0.5">Urus dan lihat semua peralatan dalam organisasi.</p>
          </div>
          <div class="flex items-center gap-2">
            <a href="equipment.html" class="px-4 py-2.5 border border-ink/20 rounded-xl text-sm font-semibold bg-white hover:bg-ink/5">🛠️ Maintenance</a>
            <a id="btn-add" href="equipment-add.html" class="hidden px-4 py-2.5 bg-navy text-white rounded-xl text-sm font-semibold hover:bg-navy-dark shadow-sm">+ Add Equipment</a>
          </div>
        </div>

        <!-- Kad ringkasan -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
          <button type="button" data-kpi="" onclick="setKpiFilter('')" class="kpi-card text-left bg-white rounded-2xl border border-ink/10 shadow-sm p-4 hover:shadow-md transition">
            <div class="text-[10px] font-semibold uppercase tracking-wide text-ink/40">Total Equipment</div>
            <div id="kpi-total" class="text-2xl font-bold text-ink mt-1">—</div>
          </button>
          <button type="button" data-kpi="in_use" onclick="setKpiFilter('in_use')" class="kpi-card text-left bg-white rounded-2xl border border-ink/10 shadow-sm p-4 hover:shadow-md transition">
            <div class="text-[10px] font-semibold uppercase tracking-wide text-ink/40">In Use</div>
            <div id="kpi-in-use" class="text-2xl font-bold text-green-dark mt-1">—</div>
          </button>
          <button type="button" data-kpi="available" onclick="setKpiFilter('available')" class="kpi-card text-left bg-white rounded-2xl border border-ink/10 shadow-sm p-4 hover:shadow-md transition">
            <div class="text-[10px] font-semibold uppercase tracking-wide text-ink/40">Available</div>
            <div id="kpi-available" class="text-2xl font-bold text-navy mt-1">—</div>
          </button>
          <button type="button" data-kpi="under_maintenance" onclick="setKpiFilter('under_maintenance')" class="kpi-card text-left bg-white rounded-2xl border border-ink/10 shadow-sm p-4 hover:shadow-md transition">
            <div class="text-[10px] font-semibold uppercase tracking-wide text-ink/40">Under Maintenance</div>
            <div id="kpi-maint" class="text-2xl font-bold text-amber-700 mt-1">—</div>
          </button>
          <button type="button" data-kpi="damaged" onclick="setKpiFilter('damaged')" class="kpi-card text-left bg-white rounded-2xl border border-ink/10 shadow-sm p-4 hover:shadow-md transition">
            <div class="text-[10px] font-semibold uppercase tracking-wide text-ink/40">Damaged</div>
            <div id="kpi-damaged" class="text-2xl font-bold text-terracotta mt-1">—</div>
          </button>
        </div>

        <!-- Carian & penapis -->
        <div class="flex flex-wrap items-center gap-2">
          <input id="f-search" oninput="renderList()" placeholder="Cari nama, ID, serial number..." class="flex-1 min-w-[220px] px-4 py-2.5 border border-ink/20 rounded-xl text-sm bg-white focus:border-navy outline-none">
          <select id="f-category" onchange="renderList()" class="px-3 py-2.5 border border-ink/20 rounded-xl text-sm bg-white"><option value="">Category</option></select>
          <select id="f-status" onchange="renderList()" class="px-3 py-2.5 border border-ink/20 rounded-xl text-sm bg-white">
            <option value="">Status</option>
            <option value="available">Available</option>
            <option value="in_use">In Use</option>
            <option value="under_maintenance">Under Maintenance</option>
            <option value="damaged">Damaged</option>
            <option value="lost">Lost</option>
            <option value="retired">Retired</option>
          </select>
          <button onclick="resetFilters()" class="px-3 py-2.5 text-sm text-ink/50 hover:text-navy">↺ Reset</button>
        </div>

        <!-- Jadual -->
        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-ink/8 bg-ink/[0.02]">
                  <th class="px-5 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">Tarikh Mohon</th>
                  <th class="px-4 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">ID</th>
                  <th class="px-4 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">Peralatan</th>
                  <th class="px-4 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">Kategori</th>
                  <th class="px-4 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">Masalah</th>
                  <th class="px-4 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">Dilapor Oleh</th>
                  <th class="px-4 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">Status</th>
                  <th class="px-4 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">Tarikh Maintenance</th>
                </tr>
              </thead>
              <tbody id="list-tbody">
                <tr><td colspan="8" class="text-center py-12 text-ink/30 text-sm">Memuatkan...</td></tr>
              </tbody>
            </table>
          </div>
          <div id="list-footer" class="px-5 py-3 border-t border-ink/8 text-xs text-ink/40"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const STATUS_CHIP = {
  available:          ['Available',          'bg-navy/10 text-navy'],
  in_use:             ['In Use',             'bg-green-light text-green-dark'],
  under_maintenance:  ['Under Maintenance',  'bg-gold/20 text-gold-dark'],
  damaged:            ['Damaged',            'bg-terracotta/15 text-terracotta'],
  lost:               ['Lost',               'bg-ink/10 text-ink/60'],
  retired:            ['Retired',            'bg-ink/10 text-ink/50'],
};

let equipAll = [];
let maintByEquip = {};

const MAINT_LABEL = {
  baru: ['Menunggu', 'bg-gold/20 text-gold-dark'],
  diluluskan: ['Diluluskan', 'bg-navy/10 text-navy'],
  dalam_servis: ['Dalam Servis', 'bg-teal/15 text-teal'],
  selesai: ['Selesai', 'bg-green-light text-green-dark'],
  ditolak: ['Ditolak', 'bg-terracotta/15 text-terracotta'],
};
function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtDate(d) {
  return d ? new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
}

async function loadAll() {
  const { data, error } = await window.db.from('psy_equipment').select('*').order('code');
  if (error) { banner('Gagal memuatkan peralatan: ' + error.message, 'error'); return; }
  equipAll = data || [];
  const { data: mts } = await window.db.from('psy_equipment_maintenance')
    .select('equipment_id, issue, status, reported_by_name, created_at, handled_at, scheduled_date').order('created_at', { ascending: false });
  maintByEquip = {};
  (mts || []).forEach(m => { if (!maintByEquip[m.equipment_id]) maintByEquip[m.equipment_id] = m; });
  const cats = [...new Set(equipAll.map(e => e.category).filter(Boolean))].sort();
  const sel = document.getElementById('f-category');
  sel.innerHTML = '<option value="">Category</option>' + cats.map(c => `<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('');
  renderKpi();
  renderList();
}

function renderKpi() {
  const count = s => equipAll.filter(e => e.status === s).length;
  document.getElementById('kpi-total').textContent = equipAll.length;
  document.getElementById('kpi-in-use').textContent = count('in_use');
  document.getElementById('kpi-available').textContent = count('available');
  document.getElementById('kpi-maint').textContent = count('under_maintenance');
  document.getElementById('kpi-damaged').textContent = count('damaged');
}

// Lajur Status: kalau ada permintaan maintenance, tunjuk status permintaan terkini; kalau tak, status peralatan
function statusCell(e) {
  const m = maintByEquip[e.id];
  if (m) {
    const [label, cls] = MAINT_LABEL[m.status] || [m.status, 'bg-ink/10 text-ink/60'];
    return `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${cls}">${label}</span>`;
  }
  const [sl, sc] = STATUS_CHIP[e.status] || [e.status, 'bg-ink/10 text-ink/60'];
  return `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${sc}">${sl}</span>`;
}

// Klik kad KPI = tapis jadual ikut status peralatan (sync dengan dropdown Status)
function setKpiFilter(status) {
  document.getElementById('f-status').value = status;
  renderList();
}

function highlightKpi(status) {
  document.querySelectorAll('.kpi-card').forEach(c => {
    const on = c.dataset.kpi === status;
    c.classList.toggle('ring-2', on);
    c.classList.toggle('ring-navy', on);
  });
}

function renderList() {
  const q = document.getElementById('f-search').value.trim().toLowerCase();
  const cat = document.getElementById('f-category').value;
  const st = document.getElementById('f-status').value;
  highlightKpi(st);

  const rows = equipAll.filter(e =>
    (!q || [e.name, e.code, e.serial_no].some(v => (v || '').toLowerCase().includes(q))) &&
    (!cat || e.category === cat) &&
    (!st || e.status === st)
  );

  const tbody = document.getElementById('list-tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="text-center py-12 text-ink/30 text-sm">${equipAll.length ? 'Tiada peralatan sepadan dengan penapis' : 'Tiada peralatan direkod'}</td></tr>`;
  } else {
    tbody.innerHTML = rows.map(e => {
      const [sl, sc] = STATUS_CHIP[e.status] || [e.status, 'bg-ink/10 text-ink/60'];
      return `<tr class="border-b border-ink/5 last:border-0 hover:bg-ink/[0.015] cursor-pointer" onclick="location.href='equipment-detail.html?id=${e.id}'">
        <td class="px-5 py-3.5 text-xs text-ink/60 whitespace-nowrap">${maintByEquip[e.id] ? fmtDate(maintByEquip[e.id].created_at) : '<span class="text-ink/30">—</span>'}</td>
        <td class="px-4 py-3.5 text-xs font-mono text-ink/50">${escHtml(e.code || '—')}</td>
        <td class="px-4 py-3.5 font-semibold text-sm text-ink">${escHtml(e.name)}</td>
        <td class="px-4 py-3.5 text-xs text-ink/60">${escHtml(e.category || '—')}</td>
        <td class="px-4 py-3.5 text-xs text-ink/70 max-w-[220px]">${maintByEquip[e.id] ? escHtml(maintByEquip[e.id].issue) : '<span class="text-ink/30">—</span>'}</td>
        <td class="px-4 py-3.5 text-xs text-ink/60 whitespace-nowrap">${maintByEquip[e.id] ? escHtml(maintByEquip[e.id].reported_by_name || '—') : '<span class="text-ink/30">—</span>'}</td>
        <td class="px-4 py-3.5">${statusCell(e)}</td>
        <td class="px-4 py-3.5 text-xs text-ink/60 whitespace-nowrap">${maintByEquip[e.id] && maintByEquip[e.id].scheduled_date ? fmtDate(maintByEquip[e.id].scheduled_date) : '<span class="text-ink/30">—</span>'}</td>
      </tr>`;
    }).join('');
  }
  document.getElementById('list-footer').textContent = `Showing ${rows.length} of ${equipAll.length} items`;
}

function resetFilters() {
  document.getElementById('f-search').value = '';
  document.getElementById('f-category').value = '';
  document.getElementById('f-status').value = '';
  renderList();
}
window.resetFilters = resetFilters;

(async () => {
  const user = await initStaff('equipment', 'Equipment List', 'equipment');
  if (!user) return;
  if (can('equipment', 'edit')) document.getElementById('btn-add').classList.remove('hidden');
  await loadAll();
})();
</script>
</body>
</html>
