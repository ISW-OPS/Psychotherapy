<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Tambah / Edit Produk</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.purple-btn { background: #6366f1; color: white; transition: background .15s; }
.purple-btn:hover { background: #4f46e5; }
</style>
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🧴</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5 max-w-4xl">
        <div class="text-xs text-ink/40">
          <a href="produk-bahan.html" class="hover:underline">Produk & Bahan Luar</a> <span class="mx-1">›</span>
          <span id="pf-breadcrumb" class="text-ink/70 font-medium">Tambah Produk</span>
        </div>

        <div class="flex items-center justify-between flex-wrap gap-3">
          <h2 id="pf-title" class="text-xl font-bold text-navy">Tambah Produk</h2>
          <div class="flex items-center gap-2">
            <button onclick="cancelForm()" class="px-4 py-2.5 border border-ink/20 rounded-xl text-sm font-semibold bg-white hover:bg-ink/5">✕ Batal</button>
            <button id="pf-save-btn" onclick="saveProduct()" class="purple-btn px-5 py-2.5 rounded-xl text-sm font-semibold">💾 Simpan Produk</button>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-6 space-y-4">
          <input type="hidden" id="pf-id">

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="md:col-span-1">
              <label class="text-sm font-semibold text-ink">Gambar Produk <span class="text-ink/35 font-normal">(Opsyenal)</span></label>
              <input id="pf-image-file" type="file" accept="image/*" class="hidden" onchange="onPfImageSelected(event)">
              <div id="pf-image-drop" onclick="document.getElementById('pf-image-file').click()" class="mt-1.5 border border-dashed border-ink/25 rounded-xl p-3 text-center cursor-pointer hover:bg-ink/[0.02]">
                <img id="pf-image-preview" class="hidden mx-auto max-h-20 rounded-lg mb-1.5 object-cover">
                <p class="text-xs text-ink/50"><span class="text-navy font-semibold">Klik untuk upload</span></p>
                <p class="text-[10px] text-ink/35 mt-0.5">PNG/JPG, maks 2MB</p>
              </div>
            </div>
            <div class="md:col-span-3 grid grid-cols-2 gap-3">
              <div class="col-span-2">
                <label class="text-xs font-semibold text-ink/60">Nama Produk / Bahan</label>
                <input id="pf-name" type="text" placeholder="cth: Minyak Zaitun Extra Virgin" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/60">Kategori</label>
                <input id="pf-category" type="text" placeholder="cth: Suplemen" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/60">Tahap</label>
                <select id="pf-level" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm bg-white">
                  <option value="wajib">Wajib</option>
                  <option value="cadangan" selected>Cadangan</option>
                  <option value="opsyenal">Opsyenal</option>
                </select>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="col-span-2">
              <label class="text-xs font-semibold text-ink/60">Tujuan / Kegunaan</label>
              <textarea id="pf-purpose" rows="2" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm resize-none" placeholder="Kenapa pesakit perlukan item ni..."></textarea>
            </div>
            <div class="col-span-2">
              <label class="text-xs font-semibold text-ink/60">Kuantiti Disyorkan</label>
              <input id="pf-qty" type="text" placeholder="cth: 1 botol/bulan" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
            </div>
            <div class="col-span-2">
              <label class="text-xs font-semibold text-ink/60">Nota</label>
              <textarea id="pf-notes" rows="2" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm resize-none"></textarea>
            </div>
            <div class="flex items-center gap-4">
              <label class="flex items-center gap-2 text-sm"><input id="pf-active" type="checkbox" checked class="accent-[#6366f1]"> Aktif</label>
              <label class="flex items-center gap-2 text-sm"><input id="pf-verify-now" type="checkbox" class="accent-[#6366f1]"> Sahkan sekarang</label>
            </div>
            <div id="pf-last-verified" class="text-[11px] text-ink/45 flex items-end"></div>
          </div>

          <!-- Pembekal -->
          <div class="border-t border-ink/8 pt-3">
            <div class="flex items-center justify-between mb-2">
              <label class="text-xs font-bold text-ink/70">🛒 Tempat Beli (Pembekal)</label>
              <button type="button" onclick="addSellerRow()" class="text-[11px] font-semibold text-navy hover:underline">+ Tambah Pembekal</button>
            </div>
            <div id="seller-rows" class="space-y-2"></div>
          </div>

          <!-- Pautan Pakej -->
          <div class="border-t border-ink/8 pt-3">
            <label class="text-xs font-bold text-ink/70">🗂️ Pautan ke Pakej (pilihan)</label>
            <p class="text-[11px] text-ink/40 mt-0.5">Tandakan pakej berkenaan — isi No. Minggu kalau khusus minggu tertentu (kosong = sepanjang pakej).</p>
            <div id="pkg-map-list" class="mt-2 border border-ink/10 rounded-xl max-h-48 overflow-y-auto p-2 space-y-1.5">
              <div class="text-xs text-ink/40">Memuatkan pakej…</div>
            </div>
          </div>

          <div id="pf-error" class="hidden text-xs text-terracotta bg-terracotta/10 rounded-lg px-3 py-2"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('ms-MY', { day:'2-digit', month:'short', year:'numeric' }) : '—'; }

let editingId = null;
let currentSellerRows = []; // { platform, seller_name, link, price, notes }
let sellersByProduct = {};
let mapsByProduct = {};
let allPackages = [];
let stagedPfImageFile = null;

async function loadPackages() {
  const { data } = await window.db.from('psy_packages').select('package_id, name').order('name', { ascending: true });
  allPackages = data || [];
}

function renderSellerRows() {
  const host = document.getElementById('seller-rows');
  if (!currentSellerRows.length) { host.innerHTML = '<p class="text-[11px] text-ink/35 italic">Tiada pembekal ditambah.</p>'; return; }
  host.innerHTML = currentSellerRows.map((s, i) => `
    <div class="grid grid-cols-12 gap-1.5 items-center">
      <input class="col-span-2 border border-ink/15 rounded-lg px-2 py-1.5 text-xs" placeholder="Platform" value="${escHtml(s.platform)}" onchange="currentSellerRows[${i}].platform=this.value">
      <input class="col-span-3 border border-ink/15 rounded-lg px-2 py-1.5 text-xs" placeholder="Nama Seller" value="${escHtml(s.seller_name)}" onchange="currentSellerRows[${i}].seller_name=this.value">
      <input class="col-span-6 border border-ink/15 rounded-lg px-2 py-1.5 text-xs" placeholder="Link" value="${escHtml(s.link)}" onchange="currentSellerRows[${i}].link=this.value">
      <button type="button" onclick="removeSellerRow(${i})" class="col-span-1 text-terracotta text-xs font-bold">✕</button>
    </div>`).join('');
}
function addSellerRow() { currentSellerRows.push({ platform:'', seller_name:'', link:'', price:null, notes:null }); renderSellerRows(); }
function removeSellerRow(i) { currentSellerRows.splice(i, 1); renderSellerRows(); }
window.addSellerRow = addSellerRow;
window.removeSellerRow = removeSellerRow;

function renderPkgMapList(checkedMap) {
  const host = document.getElementById('pkg-map-list');
  if (!allPackages.length) { host.innerHTML = '<div class="text-xs text-ink/40">Tiada pakej tersedia.</div>'; return; }
  host.innerHTML = allPackages.map(pk => {
    const week = checkedMap[pk.package_id];
    const checked = week !== undefined;
    return `<div class="flex items-center gap-2 text-[13px]">
      <label class="flex items-center gap-2 flex-1 cursor-pointer">
        <input type="checkbox" class="pkg-map-cb accent-[#6366f1]" data-pkg="${escHtml(pk.package_id)}" ${checked ? 'checked' : ''} onchange="onPkgMapToggle(this)">
        ${escHtml(pk.name)}
      </label>
      <input type="number" min="1" placeholder="Minggu (opsyenal)" class="pkg-map-week w-32 border border-ink/15 rounded-lg px-2 py-1 text-xs ${checked ? '' : 'hidden'}" data-pkg="${escHtml(pk.package_id)}" value="${week ?? ''}">
    </div>`;
  }).join('');
}
function onPkgMapToggle(cb) {
  const weekInput = document.querySelector(`.pkg-map-week[data-pkg="${cb.dataset.pkg}"]`);
  if (weekInput) weekInput.classList.toggle('hidden', !cb.checked);
}
window.onPkgMapToggle = onPkgMapToggle;

function onPfImageSelected(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { banner('Saiz gambar mesti bawah 2MB', 'error'); return; }
  stagedPfImageFile = file;
  const preview = document.getElementById('pf-image-preview');
  preview.src = URL.createObjectURL(file);
  preview.classList.remove('hidden');
}
window.onPfImageSelected = onPfImageSelected;

async function loadForEdit(id) {
  const { data: p, error } = await window.db.from('psy_recommended_products').select('*').eq('id', id).single();
  if (error || !p) { banner('Produk tidak dijumpai', 'error'); setTimeout(() => location.href = 'produk-bahan.html', 1200); return; }

  document.getElementById('pf-title').textContent = 'Edit Produk';
  document.getElementById('pf-breadcrumb').textContent = 'Edit Produk';
  document.getElementById('pf-id').value = p.id;
  document.getElementById('pf-name').value = p.name || '';
  document.getElementById('pf-category').value = p.category || '';
  document.getElementById('pf-level').value = p.requirement_level || 'cadangan';
  document.getElementById('pf-purpose').value = p.purpose || '';
  document.getElementById('pf-qty').value = p.qty_note || '';
  document.getElementById('pf-notes').value = p.notes || '';
  document.getElementById('pf-active').checked = !!p.is_active;
  document.getElementById('pf-last-verified').textContent = p.last_verified_at ? `Kali terakhir disahkan: ${fmtDate(p.last_verified_at)}` : 'Belum pernah disahkan';
  if (p.image_url) {
    const preview = document.getElementById('pf-image-preview');
    preview.src = p.image_url;
    preview.classList.remove('hidden');
  }

  const [{ data: sellers }, { data: maps }] = await Promise.all([
    window.db.from('psy_recommended_product_sellers').select('*').eq('product_id', id).order('sort_order', { ascending: true }),
    window.db.from('psy_package_recommended_products').select('*').eq('product_id', id),
  ]);
  currentSellerRows = (sellers || []).map(s => ({ ...s }));
  renderSellerRows();

  const checkedMap = {};
  (maps || []).forEach(m => { checkedMap[m.package_id] = m.week_number; });
  renderPkgMapList(checkedMap);
}

function cancelForm() {
  if (window.opener && !window.opener.closed) window.close();
  else location.href = 'produk-bahan.html';
}
window.cancelForm = cancelForm;

function finishAndClose() {
  try { window.opener?.postMessage({ type: 'isw-produk-bahan-saved', id: editingId }, '*'); } catch (e) {}
  setTimeout(() => {
    if (window.opener && !window.opener.closed) window.close();
    else location.href = 'produk-bahan.html';
  }, 700);
}

async function saveProduct() {
  const id = document.getElementById('pf-id').value || null;
  const name = document.getElementById('pf-name').value.trim();
  const errEl = document.getElementById('pf-error');
  errEl.classList.add('hidden');
  if (!name) { errEl.textContent = 'Sila isi nama produk.'; errEl.classList.remove('hidden'); return; }

  const verifyNow = document.getElementById('pf-verify-now').checked;
  const payload = {
    name,
    category: document.getElementById('pf-category').value.trim() || null,
    requirement_level: document.getElementById('pf-level').value,
    purpose: document.getElementById('pf-purpose').value.trim() || null,
    qty_note: document.getElementById('pf-qty').value.trim() || null,
    notes: document.getElementById('pf-notes').value.trim() || null,
    is_active: document.getElementById('pf-active').checked,
    updated_at: new Date().toISOString(),
  };
  if (verifyNow) payload.last_verified_at = new Date().toISOString();

  const btn = document.getElementById('pf-save-btn');
  btn.disabled = true; btn.textContent = 'Menyimpan…';
  try {
    if (stagedPfImageFile) {
      const ext = stagedPfImageFile.name.split('.').pop();
      const path = `produk-bahan/${(id || 'new-' + Date.now())}-${Date.now()}.${ext}`;
      const { error: upErr } = await window.db.storage.from('inventory-images').upload(path, stagedPfImageFile, { upsert: true });
      if (upErr) throw upErr;
      const { data: pub } = window.db.storage.from('inventory-images').getPublicUrl(path);
      payload.image_url = pub.publicUrl;
    }

    let productId = id;
    if (id) {
      const { error } = await window.db.from('psy_recommended_products').update(payload).eq('id', id);
      if (error) throw error;
    } else {
      const uid = (await window.db.auth.getUser()).data.user?.id || null;
      const { data: row, error } = await window.db.from('psy_recommended_products').insert({ ...payload, created_by: uid }).select('id').single();
      if (error) throw error;
      productId = row.id;
    }

    // Pembekal — padam semua & masuk semula (senang & selamat utk skala kecil)
    await window.db.from('psy_recommended_product_sellers').delete().eq('product_id', productId);
    const sellerRows = currentSellerRows.filter(s => s.platform || s.seller_name || s.link).map((s, i) => ({
      product_id: productId, platform: s.platform || null, seller_name: s.seller_name || null,
      link: s.link || null, price: s.price || null, notes: s.notes || null, sort_order: i,
    }));
    if (sellerRows.length) {
      const { error } = await window.db.from('psy_recommended_product_sellers').insert(sellerRows);
      if (error) throw error;
    }

    // Pautan pakej — padam semua & masuk semula
    await window.db.from('psy_package_recommended_products').delete().eq('product_id', productId);
    const mapRows = [...document.querySelectorAll('.pkg-map-cb:checked')].map(cb => {
      const weekInput = document.querySelector(`.pkg-map-week[data-pkg="${cb.dataset.pkg}"]`);
      const week = weekInput?.value ? parseInt(weekInput.value) : null;
      return { package_id: cb.dataset.pkg, product_id: productId, week_number: week };
    });
    if (mapRows.length) {
      const { error } = await window.db.from('psy_package_recommended_products').insert(mapRows);
      if (error) throw error;
    }

    if (typeof auditLog === 'function') { try { await auditLog(id ? 'produk_bahan.updated' : 'produk_bahan.created', productId, { name }); } catch (_) {} }
    banner('Produk disimpan ✅');
    editingId = productId;
    finishAndClose();
  } catch (e) {
    errEl.textContent = 'Ralat: ' + (e.message || e);
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = '💾 Simpan Produk';
  }
}
window.saveProduct = saveProduct;

(async () => {
  const user = await initStaff('produk_bahan', 'Tambah / Edit Produk');
  if (!user) return;

  const qs = new URLSearchParams(location.search);
  const id = qs.get('id');
  await loadPackages();

  if (id) {
    if (!can('produk_bahan', 'edit')) {
      banner('Akses ditolak. Anda tidak mempunyai kebenaran untuk edit produk.', 'error');
      setTimeout(() => location.href = 'produk-bahan.html', 1200);
      return;
    }
    editingId = id;
    await loadForEdit(id);
  } else {
    if (!can('produk_bahan', 'create')) {
      banner('Akses ditolak. Anda tidak mempunyai kebenaran untuk tambah produk.', 'error');
      setTimeout(() => location.href = 'produk-bahan.html', 1200);
      return;
    }
    renderSellerRows();
    renderPkgMapList({});
  }
})();
</script>
</body>
</html>
