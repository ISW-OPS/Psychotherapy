<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Payment Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📒</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-6">

        <!-- Page Header -->
        <div class="flex items-center justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-xl font-bold text-ink">Payment Management</h1>
            <p class="text-sm text-ink/45 mt-0.5">Gabungan SEMUA bayaran — pembayaran ISW terus + ledger transaksi GHL (Stripe/manual), untuk trace/rekonsiliasi kewangan</p>
          </div>
          <button onclick="exportCsv()" data-rbac="payment.export" class="px-3 py-2 border border-ink/15 rounded-lg text-sm bg-white hover:bg-ink/5 transition-colors flex items-center gap-1.5">
            📥 Export CSV
          </button>
        </div>

        <!-- KPI Row -->
        <div id="kpi-row" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>

        <!-- Filters -->
        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-4 flex flex-wrap items-center gap-3">
          <input id="search-input" type="text" placeholder="Cari nama / rujukan / no. invois..." oninput="onFilterChange()"
            class="flex-1 min-w-[200px] px-3 py-2 border border-ink/15 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-navy/20">
          <select id="source-filter" onchange="onFilterChange()"
            class="px-3 py-2 border border-ink/15 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-navy/20">
            <option value="">Semua Sumber</option>
            <option value="ISW">ISW</option>
            <option value="GHL">GHL</option>
          </select>
          <select id="status-filter" onchange="onFilterChange()"
            class="px-3 py-2 border border-ink/15 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-navy/20">
            <option value="">Semua Status</option>
            <option value="completed">Selesai (ISW)</option>
            <option value="succeeded">Berjaya (GHL)</option>
            <option value="pending">Pending</option>
            <option value="failed">Gagal</option>
            <option value="refunded">Dipulangkan</option>
          </select>
          <select id="period-filter" onchange="loadData()"
            class="px-3 py-2 border border-ink/15 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-navy/20">
            <option value="30">30 Hari</option>
            <option value="90">90 Hari</option>
            <option value="365">1 Tahun</option>
            <option value="all" selected>Semua</option>
          </select>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden overflow-x-auto">
          <div class="min-w-[900px]">
            <div class="px-5 py-2 border-b border-ink/5 grid gap-3 items-center" style="grid-template-columns:70px 1fr 130px 100px 90px 110px 90px">
              <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider">Sumber</span>
              <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider">Nama / Contact</span>
              <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider">Rujukan</span>
              <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider">Kaedah</span>
              <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider text-right">Jumlah</span>
              <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider">Status</span>
              <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider">Tarikh</span>
            </div>
            <div id="ledger-table" class="divide-y divide-ink/5"></div>
            <div id="ledger-empty" class="hidden px-5 py-12 text-center text-sm text-ink/35">Tiada rekod ditemui</div>
          </div>
          <div id="ledger-pagination" class="hidden px-5 py-3 border-t border-ink/5 flex items-center justify-between gap-3 flex-wrap"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
let allRows = [];
const PAGE_SIZE = 10;
let currentPage = 1;

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtRM(n) { return 'RM ' + Number(n||0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString(LCALE(),{day:'2-digit',month:'short',year:'numeric'}) : '—'; }
function fmtTime(d) { return d ? new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : ''; }

const STATUS_META = {
  completed: { label: 'Selesai',    cls: 'bg-green-100 text-green-700' },
  succeeded: { label: 'Berjaya',    cls: 'bg-green-100 text-green-700' },
  paid:      { label: 'Dibayar',    cls: 'bg-green-100 text-green-700' },
  pending:   { label: 'Pending',    cls: 'bg-amber-100 text-amber-700' },
  failed:    { label: 'Gagal',      cls: 'bg-red-100 text-red-600' },
  refunded:  { label: 'Dipulangkan',cls: 'bg-ink/10 text-ink/60' },
};

const SOURCE_META = {
  ISW: { cls: 'bg-navy/10 text-navy' },
  GHL: { cls: 'bg-[#6366f1]/10 text-[#6366f1]' },
};

function renderKpi() {
  // Ikut filter semasa (search/sumber/status/tempoh) — BUKAN allRows
  // mentah, supaya card sentiasa padan dengan apa yang jadual tunjuk.
  const rows = filteredRows();
  const paidRows = rows.filter(r => ['completed','succeeded','paid'].includes(r.status));
  const iswTotal = paidRows.filter(r => r.source === 'ISW').reduce((s,r)=>s+Number(r.amount||0),0);
  const ghlTotal = paidRows.filter(r => r.source === 'GHL').reduce((s,r)=>s+Number(r.amount||0),0);
  const grandTotal = iswTotal + ghlTotal;

  const card = (label, value, sub, bg, clr) => `
    <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-5">
      <div class="text-[11px] text-ink/45 font-medium">${label}</div>
      <div class="text-2xl font-bold text-ink mt-1">${value}</div>
      <div class="text-[11px] text-ink/40 mt-0.5">${sub}</div>
    </div>`;

  document.getElementById('kpi-row').innerHTML = [
    card('Jumlah Keseluruhan', fmtRM(grandTotal), 'ISW + GHL, status berjaya sahaja'),
    card('ISW (Gateway/Manual)', fmtRM(iswTotal), paidRows.filter(r=>r.source==='ISW').length + ' rekod'),
    card('GHL (Stripe/Manual)', fmtRM(ghlTotal), paidRows.filter(r=>r.source==='GHL').length + ' rekod'),
    card('Jumlah Rekod', rows.length, 'termasuk pending/gagal'),
  ].join('');
}

function filteredRows() {
  const search   = (document.getElementById('search-input').value || '').toLowerCase().trim();
  const sourceF  = document.getElementById('source-filter').value;
  const statusF  = document.getElementById('status-filter').value;
  return allRows.filter(r => {
    if (sourceF && r.source !== sourceF) return false;
    if (statusF && r.status !== statusF) return false;
    if (search) {
      const hay = `${r.contact_name || ''} ${r.reference || ''} ${r.invoice_number || ''}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}

function onFilterChange() { currentPage = 1; renderKpi(); renderTable(); }

function renderTable() {
  const filtered = filteredRows();
  const tbody = document.getElementById('ledger-table');
  const empty = document.getElementById('ledger-empty');
  const pager = document.getElementById('ledger-pagination');

  if (!filtered.length) {
    tbody.innerHTML = '';
    empty.classList.remove('hidden');
    pager.classList.add('hidden');
    return;
  }
  empty.classList.add('hidden');

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageRows = filtered.slice(start, start + PAGE_SIZE);

  tbody.innerHTML = pageRows.map(r => {
    const info = STATUS_META[r.status] || { label: r.status || '—', cls: 'bg-ink/10 text-ink/60' };
    const srcInfo = SOURCE_META[r.source] || { cls: 'bg-ink/10 text-ink/60' };
    return `<div class="grid gap-3 items-center px-5 py-3 hover:bg-ink/[0.015] transition-colors" style="grid-template-columns:70px 1fr 130px 100px 90px 110px 90px">
      <div><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${srcInfo.cls}">${r.source}</span></div>
      <div class="min-w-0">
        <div class="text-sm font-semibold text-ink truncate">${escHtml(r.contact_name || '—')}</div>
        ${r.invoice_number ? `<div class="text-[10px] text-ink/40">${escHtml(r.invoice_number)}</div>` : ''}
      </div>
      <div class="text-xs font-mono text-ink/60 truncate">${escHtml(r.reference || '—')}</div>
      <div class="text-xs text-ink/65">${escHtml(r.method || '—')}</div>
      <div class="text-sm font-bold text-ink text-right">${fmtRM(r.amount)}</div>
      <div><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${info.cls}">${info.label}</span></div>
      <div class="text-[11px] text-ink/55">
        <div>${fmtDate(r.tx_date)}</div>
        <div class="text-[10px] text-ink/35">${fmtTime(r.tx_date)}</div>
      </div>
    </div>`;
  }).join('');

  renderPagination(totalPages, filtered.length);
}

function renderPagination(totalPages, totalCount) {
  const pager = document.getElementById('ledger-pagination');
  if (totalPages <= 1) { pager.classList.add('hidden'); return; }
  pager.classList.remove('hidden');

  const btn = (label, page, disabled, active) => `
    <button ${disabled ? 'disabled' : `onclick="goToPage(${page})"`}
      class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition-colors
        ${active ? 'bg-navy text-white border-navy' : disabled ? 'text-ink/25 border-ink/10 cursor-not-allowed' : 'text-ink/65 border-ink/15 bg-white hover:bg-ink/5'}">
      ${label}
    </button>`;

  // Nombor muka surat — tunjuk semua kalau <=7, kalau tak, kelompok sekitar semasa + hujung.
  let pages = [];
  if (totalPages <= 7) {
    pages = Array.from({ length: totalPages }, (_, i) => i + 1);
  } else {
    pages = [1];
    if (currentPage > 3) pages.push('…');
    for (let p = Math.max(2, currentPage - 1); p <= Math.min(totalPages - 1, currentPage + 1); p++) pages.push(p);
    if (currentPage < totalPages - 2) pages.push('…');
    pages.push(totalPages);
  }

  pager.innerHTML = `
    <div class="text-xs text-ink/45">Muka surat ${currentPage} / ${totalPages} — ${totalCount} rekod</div>
    <div class="flex items-center gap-1.5 flex-wrap">
      ${btn('‹ Sebelum', currentPage - 1, currentPage === 1, false)}
      ${pages.map(p => p === '…' ? `<span class="px-2 text-xs text-ink/35">…</span>` : btn(p, p, false, p === currentPage)).join('')}
      ${btn('Lepas ›', currentPage + 1, currentPage === totalPages, false)}
    </div>`;
}

function goToPage(p) { currentPage = p; renderTable(); }

function exportCsv() {
  const rows = [['Sumber','Nama/Contact','Rujukan','No. Invois','Kaedah','Jumlah','Status','Tarikh Transaksi','Tarikh Isu Invois']];
  filteredRows().forEach(r => {
    rows.push([
      r.source, r.contact_name || '', r.reference || '', r.invoice_number || '',
      r.method || '', Number(r.amount||0).toFixed(2), r.status || '',
      r.tx_date ? new Date(r.tx_date).toISOString() : '',
      r.issue_date ? new Date(r.issue_date).toISOString() : '',
    ]);
  });
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ledger-rekonsiliasi-${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

async function loadData() {
  const period = document.getElementById('period-filter').value;
  let query = window.db.from('vw_payment_ledger').select('*').order('tx_date', { ascending: false }).limit(2000);

  if (period !== 'all') {
    const d = new Date(); d.setDate(d.getDate() - Number(period));
    query = query.gte('tx_date', d.toISOString());
  }

  const { data, error } = await query;
  if (error) { banner('Ralat muat ledger: ' + error.message, 'error'); return; }
  allRows = data || [];
  currentPage = 1;
  renderKpi();
  renderTable();
}

async function init() {
  const user = await initStaff('payment_ledger', 'Payment Management');
  if (!user) return;
  await loadData();
}

init();
</script>
</body>
</html>
