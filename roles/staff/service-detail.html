<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Detail Service</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">⚕️</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 max-w-xl mx-auto space-y-4">

        <!-- Action bar -->
        <div class="flex items-center justify-between gap-3">
          <div id="view-status"></div>
          <div id="btn-bar-view" class="flex gap-2">
            <button id="btn-toggle-status" onclick="toggleStatus()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5"></button>
            <button onclick="enterEdit()" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark flex items-center gap-2">✏️ Edit Service</button>
          </div>
          <div id="btn-bar-edit" class="hidden flex gap-2">
            <button onclick="exitEdit()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5">Batal</button>
            <button id="btn-save" onclick="saveService()" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark">Simpan</button>
          </div>
        </div>

        <!-- Card -->
        <div id="view-card" class="bg-white rounded-2xl border border-ink/10 overflow-hidden">

          <!-- Hero -->
          <div id="svc-hero" class="h-36 flex items-center justify-center text-7xl bg-navy-light"></div>

          <!-- VIEW content -->
          <div id="view-content" class="p-6 space-y-4">
            <div>
              <div class="text-xs text-ink/40 font-mono mb-1" id="view-sid"></div>
              <h1 id="view-name" class="text-xl font-bold"></h1>
              <p id="view-desc" class="text-sm text-ink/60 mt-1.5 leading-relaxed"></p>
            </div>
            <div class="grid grid-cols-2 gap-4 pt-2 border-t border-ink/8">
              <div>
                <div class="text-[11px] text-ink/40 uppercase font-semibold tracking-wide">Harga</div>
                <div id="view-price" class="text-xl font-bold text-navy mt-0.5"></div>
              </div>
              <div>
                <div class="text-[11px] text-ink/40 uppercase font-semibold tracking-wide">Tempoh</div>
                <div id="view-duration" class="text-xl font-bold text-navy mt-0.5"></div>
              </div>
            </div>
          </div>

        </div>

        <!-- EDIT content -->
        <div id="edit-content" class="hidden space-y-4">
          <input id="edit-id" type="hidden">

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-ink/60">Service ID <span class="text-terracotta">*</span></label>
              <input id="f-sid" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none font-mono" placeholder="cth: consultation">
            </div>
            <div>
              <label class="text-xs font-semibold text-ink/60">Icon (emoji)</label>
              <input id="f-icon" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none text-2xl text-center" value="⚕️">
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold text-ink/60">Nama <span class="text-terracotta">*</span></label>
            <input id="f-name" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="Nama service">
          </div>

          <div>
            <label class="text-xs font-semibold text-ink/60">Description</label>
            <input id="f-desc" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-ink/60">Harga (RM)</label>
              <div class="relative mt-1">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-ink/40">RM</span>
                <input id="f-price" type="number" step="0.01" class="w-full pl-9 pr-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
              </div>
            </div>
            <div>
              <label class="text-xs font-semibold text-ink/60">Duration (minit)</label>
              <input id="f-duration" type="number" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let currentSvc = null;

function renderView(s) {
  currentSvc = s;

  document.getElementById('view-status').innerHTML = s.is_active
    ? '<span class="chip bg-green-light text-green-dark">✓ Aktif</span>'
    : '<span class="chip bg-ink/10 text-ink/60">Tidak Aktif</span>';
  document.getElementById('btn-toggle-status').textContent = s.is_active ? 'Nyahaktifkan' : 'Aktifkan';
  document.getElementById('btn-toggle-status').className = `px-4 py-2 border rounded-lg text-sm font-semibold ${s.is_active ? 'border-gold/40 text-gold-dark hover:bg-gold/10' : 'border-green/40 text-green-dark hover:bg-green-light'}`;

  const hero = document.getElementById('svc-hero');
  hero.textContent = s.icon || '⚕️';

  document.getElementById('view-sid').textContent      = s.service_id || '';
  document.getElementById('view-name').textContent     = s.name || '';
  document.getElementById('view-desc').textContent     = s.description || '';
  document.getElementById('view-price').textContent    = s.price != null ? `RM ${Number(s.price).toFixed(2)}` : '—';
  document.getElementById('view-duration').textContent = s.duration_min ? `${s.duration_min} min` : '—';
}

async function toggleStatus() {
  if (!currentSvc) return;
  await dbUpdate('psy_services', currentSvc.id, { is_active: !currentSvc.is_active });
  currentSvc.is_active = !currentSvc.is_active;
  renderView(currentSvc);
  banner(currentSvc.is_active ? 'Service diaktifkan' : 'Service dinyahaktifkan');
}

function enterEdit() {
  document.getElementById('edit-id').value    = currentSvc.id;
  document.getElementById('f-sid').value      = currentSvc.service_id || '';
  document.getElementById('f-icon').value     = currentSvc.icon || '⚕️';
  document.getElementById('f-name').value     = currentSvc.name || '';
  document.getElementById('f-desc').value     = currentSvc.description || '';
  document.getElementById('f-price').value    = currentSvc.price ?? '';
  document.getElementById('f-duration').value = currentSvc.duration_min ?? 30;

  document.getElementById('view-card').classList.add('hidden');
  document.getElementById('edit-content').classList.remove('hidden');
  document.getElementById('btn-bar-view').classList.add('hidden');
  document.getElementById('btn-bar-edit').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function exitEdit() {
  document.getElementById('edit-content').classList.add('hidden');
  document.getElementById('view-card').classList.remove('hidden');
  document.getElementById('btn-bar-edit').classList.add('hidden');
  document.getElementById('btn-bar-view').classList.remove('hidden');
}

async function saveService() {
  const editId = document.getElementById('edit-id').value;
  const data = {
    service_id:   document.getElementById('f-sid').value.trim(),
    name:         document.getElementById('f-name').value.trim(),
    description:  document.getElementById('f-desc').value.trim(),
    price:        parseFloat(document.getElementById('f-price').value) || 0,
    duration_min: parseInt(document.getElementById('f-duration').value) || 30,
    icon:         document.getElementById('f-icon').value || '⚕️',
    updated_at:   new Date().toISOString(),
  };
  if (!data.service_id || !data.name) { banner('Service ID dan Nama wajib diisi', 'error'); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    await dbUpdate('psy_services', editId, data);
    await auditLog('service.updated', data.service_id);
    Object.assign(currentSvc, data);
    banner('Service dikemaskini ✓');
    exitEdit();
    renderView(currentSvc);
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan';
  }
}

(async () => {
  const user = await initStaff('services', '');
  if (!user) return;
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { banner('ID tidak ditemui', 'error'); return; }
  setHeaderBack('services.html', 'Kembali ke Services');
  const { data: s } = await window.db.from('psy_services').select('*').eq('id', id).single();
  if (!s) { banner('Service tidak ditemui', 'error'); return; }
  setPageTitle(s.name, 'Detail service');
  renderView(s);
})();
</script>
</body>
</html>
