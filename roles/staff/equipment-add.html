<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Add Equipment</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🛠️</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <div class="flex items-center justify-between flex-wrap gap-3">
          <div>
            <a href="equipment-list.html" class="text-xs font-semibold text-ink/55 hover:text-navy">← Back to List</a>
            <h2 class="text-xl font-bold text-navy mt-1">Add Equipment</h2>
            <p class="text-xs text-ink/50 mt-0.5">Daftar peralatan baharu ke dalam sistem.</p>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-6 space-y-6">

          <section class="space-y-4">
            <h3 class="font-bold text-sm text-ink">Equipment Information</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="text-sm font-semibold text-ink">Asset ID <span class="text-ink/35 font-normal">(Auto)</span></label>
                <input id="f-asset-id" disabled value="—" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-ink/5 text-ink/60 font-mono">
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Equipment Name <span class="text-terracotta">*</span></label>
                <input id="f-name" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="Cth: Dell Latitude 5420">
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Category <span class="text-terracotta">*</span></label>
                <select id="f-category" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white">
                  <option value="">— Pilih —</option>
                  <option>Clinical Equipment</option>
                  <option>General Equipment</option>
                </select>
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Kuantiti</label>
                <input id="f-qty" type="number" min="1" step="1" value="1" oninput="updateAssetIdPreview()" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none">
                <p class="text-[10px] text-ink/40 mt-1">Daftar beberapa unit serupa sekaligus (cth: 5 Toilet Dustbin) — setiap satu dapat kod EQ- &amp; direkod berasingan.</p>
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Brand</label>
                <input id="f-brand" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="Dell">
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Model</label>
                <input id="f-model" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="Latitude 5420">
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Serial Number</label>
                <input id="f-serial" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="DL5420-XXXX">
              </div>
              
              <div>
                <label class="text-sm font-semibold text-ink">Status <span class="text-terracotta">*</span></label>
                <select id="f-status" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white">
                  <option value="available">Available</option><option value="in_use">In Use</option>
                  <option value="under_maintenance">Under Maintenance</option><option value="damaged">Damaged</option>
                  <option value="lost">Lost</option><option value="retired">Retired</option>
                </select>
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Description</label>
                <textarea id="f-description" rows="2" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none resize-none" placeholder="Cth: Business laptop for daily work."></textarea>
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Gambar <span class="text-ink/35 font-normal">(Pilihan)</span></label>
                <label class="mt-1.5 flex items-center gap-3 px-3 py-2 border border-dashed border-ink/25 rounded-xl cursor-pointer hover:bg-ink/[0.02]">
                  <img id="f-photo-preview" class="hidden w-12 h-12 rounded-lg object-cover">
                  <span id="f-photo-label" class="text-sm text-ink/50">📷 Klik untuk pilih gambar (PNG/JPG)</span>
                  <input id="f-photo" type="file" accept="image/*" class="hidden" onchange="onPhotoSelected(event)">
                </label>
              </div>
            </div>
          </section>


          <section class="space-y-4 pt-5 border-t border-ink/8">
            <h3 class="font-bold text-sm text-ink">Purchase</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="text-sm font-semibold text-ink">Purchase Date</label>
                <input id="f-purchase-date" type="date" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none">
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Purchase Cost (RM)</label>
                <input id="f-cost" type="number" min="0" step="0.01" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="0.00">
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Pembekal</label>
                <div class="flex items-center gap-2 mt-1.5">
                  <select id="f-supplier" class="w-full px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white focus:border-navy outline-none">
                    <option value="">— Pilih supplier —</option>
                  </select>
                  <button type="button" onclick="toggleQuickAddSupplier()" class="text-xs font-semibold text-teal hover:underline whitespace-nowrap">+ Add New</button>
                </div>
                <div id="quick-add-supplier" class="hidden space-y-2 mt-3 p-3 border border-ink/10 rounded-xl bg-ink/[0.02]">
                  <input id="qas-name" placeholder="Nama supplier *" class="w-full px-3 py-2 border border-ink/15 rounded-lg text-sm bg-white focus:border-navy outline-none">
                  <input id="qas-phone" placeholder="Telefon" class="w-full px-3 py-2 border border-ink/15 rounded-lg text-sm bg-white focus:border-navy outline-none">
                  <input id="qas-email" placeholder="E-mel" class="w-full px-3 py-2 border border-ink/15 rounded-lg text-sm bg-white focus:border-navy outline-none">
                  <input id="qas-location-url" placeholder="Lokasi (Waze URL)" class="w-full px-3 py-2 border border-ink/15 rounded-lg text-sm bg-white focus:border-navy outline-none">
                  <div class="flex justify-end gap-2">
                    <button type="button" onclick="toggleQuickAddSupplier()" class="px-3 py-1.5 border border-ink/20 rounded-lg text-xs font-semibold bg-white hover:bg-ink/5">Batal</button>
                    <button type="button" onclick="quickAddSupplier()" class="px-3 py-1.5 bg-teal text-white rounded-lg text-xs font-semibold hover:opacity-90">Simpan Supplier</button>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="space-y-4 pt-5 border-t border-ink/8">
            <h3 class="font-bold text-sm text-ink">Maintenance Information <span class="text-ink/35 font-normal">(Pilihan)</span></h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="text-sm font-semibold text-ink">Next Maintenance Date</label>
                <input id="f-next-maint" type="date" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none">
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Maintenance Cycle</label>
                <select id="f-cycle" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white">
                  <option value="">— Tiada —</option><option value="3">3 Months</option><option value="6">6 Months</option><option value="12">12 Months</option>
                </select>
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Maintenance Remarks</label>
                <input id="f-maint-remarks" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="Cth: Cleaning, service berkala">
              </div>
            </div>
          </section>

          <div class="flex justify-end gap-2 pt-5 border-t border-ink/8">
            <a href="equipment-list.html" class="px-4 py-2.5 border border-ink/20 rounded-xl text-sm font-semibold bg-white hover:bg-ink/5">Cancel</a>
            <button id="btn-save" onclick="saveEquipment()" class="bg-navy text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-navy-dark">💾 Save Equipment</button>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const v = id => document.getElementById(id).value.trim();
const orNull = s => s === '' ? null : s;

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

let stagedPhoto = null;
let allSuppliers = [];
let nextCodeNum = 1;

async function loadSuppliers() {
  const { data } = await window.db.from('psy_suppliers').select('*').eq('status', 'active').order('name');
  allSuppliers = data || [];
  document.getElementById('f-supplier').innerHTML = '<option value="">— Pilih supplier —</option>'
    + allSuppliers.map(s => `<option value="${s.id}">${escHtml(s.name)}</option>`).join('');
}

function toggleQuickAddSupplier() {
  const wrap = document.getElementById('quick-add-supplier');
  wrap.classList.toggle('hidden');
  if (!wrap.classList.contains('hidden')) {
    document.getElementById('qas-name').value = '';
    document.getElementById('qas-phone').value = '';
    document.getElementById('qas-email').value = '';
    document.getElementById('qas-location-url').value = '';
    document.getElementById('qas-name').focus();
  }
}
window.toggleQuickAddSupplier = toggleQuickAddSupplier;

async function quickAddSupplier() {
  const name = document.getElementById('qas-name').value.trim();
  if (!name) { banner('Nama supplier diperlukan', 'error'); document.getElementById('qas-name').focus(); return; }
  const phone = document.getElementById('qas-phone').value.trim() || null;
  const email = document.getElementById('qas-email').value.trim() || null;
  const location_url = document.getElementById('qas-location-url').value.trim() || null;
  try {
    const { data, error } = await window.db.from('psy_suppliers').insert({
      name, phone, email, location_url,
      created_by: window.currentUser?.id,
      created_by_name: window.currentUser?.full_name || '',
    }).select('id').single();
    if (error) throw error;
    await loadSuppliers();
    document.getElementById('f-supplier').value = data.id;
    toggleQuickAddSupplier();
    banner('Supplier ditambah');
  } catch (e) {
    banner('Gagal tambah supplier: ' + e.message, 'error');
  }
}
window.quickAddSupplier = quickAddSupplier;

function updateAssetIdPreview() {
  const qty = Math.max(1, Number(document.getElementById('f-qty').value) || 1);
  const first = `EQ-${String(nextCodeNum).padStart(4, '0')}`;
  const last = `EQ-${String(nextCodeNum + qty - 1).padStart(4, '0')}`;
  document.getElementById('f-asset-id').value = qty > 1 ? `${first} – ${last}` : first;
}
window.updateAssetIdPreview = updateAssetIdPreview;

function onPhotoSelected(e) {
  const f = e.target.files?.[0];
  if (!f) return;
  if (f.size > 15 * 1024 * 1024) { banner('Gambar mesti kurang 15MB', 'error'); e.target.value = ''; return; }
  stagedPhoto = f;
  const img = document.getElementById('f-photo-preview');
  img.src = URL.createObjectURL(f);
  img.classList.remove('hidden');
  document.getElementById('f-photo-label').textContent = f.name;
}
window.onPhotoSelected = onPhotoSelected;

async function saveEquipment() {
  const name = v('f-name');
  const category = v('f-category');
  if (!name) { banner('Equipment Name diperlukan', 'error'); document.getElementById('f-name').focus(); return; }
  if (!category) { banner('Sila pilih Category', 'error'); document.getElementById('f-category').focus(); return; }
  const qty = Math.max(1, Number(v('f-qty')) || 1);
  const supplierId = document.getElementById('f-supplier').value || null;
  const supplierName = allSuppliers.find(s => s.id === supplierId)?.name || null;

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    // Kod (EQ-xxxx) dijana DB per-row (sequence) — tak dihantar. Kuantiti > 1 =
    // daftar beberapa unit serupa sekaligus, setiap satu dapat kod EQ- sendiri
    // (bukan 1 row dgn qty — peralatan ditrack per-unit: status/assign/maintenance
    // berasingan utk setiap unit).
    const baseRow = {
      name,
      category,
      brand: orNull(v('f-brand')),
      model: orNull(v('f-model')),
      serial_no: orNull(v('f-serial')),
      description: orNull(v('f-description')),
      purchase_date: orNull(v('f-purchase-date')),
      purchase_cost: orNull(v('f-cost')),
      supplier_id: supplierId,
      supplier: supplierName,
      next_maintenance_date: orNull(v('f-next-maint')),
      maintenance_cycle_months: v('f-cycle') ? Number(v('f-cycle')) : null,
      maintenance_remarks: orNull(v('f-maint-remarks')),
      status: v('f-status'),
    };
    const rows = Array.from({ length: qty }, () => ({ ...baseRow }));
    const { data, error } = await window.db.from('psy_equipment').insert(rows).select('id, code');
    if (error) throw error;

    // Gambar (pilihan) — disimpan dalam bucket inventory-images, URL sama dikongsi
    // ke semua unit yg didaftar sekali (sama produk/foto).
    if (stagedPhoto) {
      const ext = (stagedPhoto.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `equipment/${data[0].id}/${Date.now()}.${ext}`;
      const { error: upErr } = await window.db.storage.from('inventory-images').upload(path, stagedPhoto, { upsert: true });
      if (upErr) banner('Peralatan disimpan, tetapi gambar gagal dimuat naik: ' + upErr.message, 'error');
      else {
        const { data: pub } = window.db.storage.from('inventory-images').getPublicUrl(path);
        await window.db.from('psy_equipment').update({ image_url: pub.publicUrl }).in('id', data.map(r => r.id));
      }
    }
    if (data.length > 1) {
      banner(`${data.length} peralatan ditambah (${data[0].code} – ${data[data.length - 1].code})`);
      location.href = 'equipment-list.html';
    } else {
      banner(`Peralatan ditambah (${data[0].code})`);
      location.href = `equipment-detail.html?id=${data[0].id}`;
    }
  } catch (e) {
    banner('Gagal simpan: ' + e.message, 'error');
    btn.disabled = false; btn.textContent = '💾 Save Equipment';
  }
}
window.saveEquipment = saveEquipment;

(async () => {
  const user = await initStaff('equipment', 'Add Equipment', 'equipment');
  if (!user) return;
  if (!can('equipment', 'edit')) { banner('Anda tiada kebenaran tambah peralatan', 'error'); document.getElementById('btn-save').disabled = true; }

  await loadSuppliers();

  // Papar ID seterusnya (anggaran: kod tertinggi + 1). Kod sebenar dijana DB masa simpan.
  const { data: last } = await window.db.from('psy_equipment').select('code').not('code', 'is', null).order('code', { ascending: false }).limit(1);
  const m = /^EQ-(\d+)$/.exec(last?.[0]?.code || '');
  nextCodeNum = m ? Number(m[1]) + 1 : 1;
  updateAssetIdPreview();
})();
</script>
</body>
</html>
