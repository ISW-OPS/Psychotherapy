<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Pengumuman</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📢</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5 max-w-[1500px] mx-auto">

        <!-- Title -->
        <div class="flex items-start justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-2xl font-extrabold text-ink">Pengurusan Pengumuman</h1>
            <p class="text-sm text-ink/55 mt-0.5">Urus, cipta dan terbitkan pengumuman untuk pesakit &amp; staf.</p>
          </div>
          <a id="btn-ann-new" href="pengumuman-baru.html" class="hidden inline-flex items-center gap-2 bg-navy text-white text-sm px-5 py-2.5 rounded-xl font-semibold hover:bg-navy-dark shadow-sm">+ Tambah Pengumuman</a>
        </div>

        <div class="bg-white rounded-2xl border border-ink/8 shadow-sm p-4 md:p-5 space-y-4">
          <!-- Filter tabs + search -->
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <div id="status-tabs" class="flex items-center gap-1.5 flex-wrap"></div>
            <div class="flex items-center gap-2">
              <div class="relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/35 text-sm">🔍</span>
                <input id="search" oninput="renderTable()" placeholder="Cari pengumuman..." class="pl-9 pr-3 py-2 border border-ink/15 rounded-xl text-sm w-56 outline-none focus:border-navy">
              </div>
              <button id="btn-ann-quick" onclick="openModal()" class="hidden border border-ink/20 text-ink/60 text-sm px-3 py-2 rounded-xl font-semibold hover:bg-ink/5" title="Tambah ringkas (banner sahaja)">⚡</button>
            </div>
          </div>

          <!-- Table -->
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="text-[11px] uppercase tracking-wide text-ink/45 border-b border-ink/10">
                  <th class="text-left font-semibold py-3 pr-3">Pengumuman</th>
                  <th class="text-left font-semibold py-3 px-3">Kategori</th>
                  <th class="text-left font-semibold py-3 px-3">Tarikh</th>
                  <th class="text-left font-semibold py-3 px-3">Sasaran</th>
                  <th class="text-left font-semibold py-3 px-3">Status</th>
                  <th class="text-left font-semibold py-3 px-3">Dikemaskini</th>
                  <th class="text-right font-semibold py-3 pl-3">Tindakan</th>
                </tr>
              </thead>
              <tbody id="ann-body"></tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="flex items-center justify-between gap-3 flex-wrap pt-1">
            <div id="page-info" class="text-xs text-ink/50"></div>
            <div id="pager" class="flex items-center gap-1.5"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal -->
<div id="ann-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" onclick="closeModal()"></div>
  <div class="relative bg-white rounded-2xl max-w-lg w-full max-h-[92vh] flex flex-col overflow-hidden">
    <div class="p-5 border-b border-ink/10 flex items-center justify-between flex-shrink-0">
      <h3 id="modal-title" class="font-bold text-lg">Pengumuman Baru</h3>
      <button onclick="closeModal()" class="text-ink/60 text-xl">×</button>
    </div>
    <div class="p-5 space-y-3 overflow-y-auto flex-1">
      <input id="edit-id" type="hidden">

      <div>
        <label class="text-xs font-semibold">Tajuk <span class="text-terracotta">*</span></label>
        <input id="f-title" type="text" placeholder="Cth: Promosi Pakej Bulan Ini" maxlength="100"
          class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
      </div>

      <div>
        <label class="text-xs font-semibold">Badan Teks</label>
        <textarea id="f-body" rows="3" placeholder="Teks penerangan (optional)..."
          class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none resize-none"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold">Tag / Label</label>
          <input id="f-tag" type="text" placeholder="Cth: Promosi, Info, Baru"
            class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold">Turutan</label>
          <input id="f-order" type="number" value="0" min="0"
            class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold">Tarikh Tamat Papar <span class="text-ink/40 font-normal">(optional — auto-sembunyi selepas tarikh ini)</span></label>
        <input id="f-expires" type="datetime-local"
          class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold">Label Butang CTA</label>
          <input id="f-cta-label" type="text" placeholder="Cth: Lihat Pakej →"
            class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold">URL CTA</label>
          <input id="f-cta-url" type="text" placeholder="pakej.html"
            class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
        </div>
      </div>

      <!-- Banner Image -->
      <div>
        <label class="text-xs font-semibold block mb-1.5">Gambar Banner <span class="text-ink/40 font-normal">(gantikan warna latar)</span></label>
        <div class="flex items-start gap-3">
          <div id="ann-img-preview" class="w-28 h-16 rounded-xl border-2 border-dashed border-ink/20 flex items-center justify-center bg-cream/50 overflow-hidden flex-shrink-0 text-2xl text-ink/30 cursor-pointer hover:border-navy transition-colors"
            onclick="document.getElementById('f-ann-image').click()" title="Klik untuk pilih gambar">🖼</div>
          <div class="flex-1 min-w-0">
            <input id="f-ann-image" type="file" accept="image/*" onchange="previewAnnImage(this)" class="hidden">
            <input id="f-ann-image-url" type="hidden">
            <div class="flex gap-2 flex-wrap">
              <button type="button" onclick="document.getElementById('f-ann-image').click()"
                class="px-3 py-1.5 bg-ink/5 border border-ink/20 rounded-lg text-xs font-semibold hover:border-navy hover:text-navy transition-colors">
                Pilih Gambar
              </button>
              <button type="button" id="btn-remove-img" onclick="removeAnnImage()" class="hidden px-3 py-1.5 border border-terracotta/30 text-terracotta rounded-lg text-xs font-semibold hover:bg-terracotta hover:text-white transition-colors">
                Buang Gambar
              </button>
            </div>
            <p class="text-[10px] text-ink/40 mt-1.5">JPG, PNG · maks 5MB · nisbah 16:9 disyorkan</p>
          </div>
        </div>
      </div>

      <!-- Warna Latar (used if no image) -->
      <div>
        <label class="text-xs font-semibold mb-1.5 block">Warna Latar <span class="text-ink/40 font-normal">(digunakan jika tiada gambar)</span></label>
        <div class="grid grid-cols-3 gap-2">
          <label id="bg-opt-1" class="cursor-pointer" onclick="selectBg('from-navy to-green-dark')">
            <input type="radio" name="bg" value="from-navy to-green-dark" class="sr-only">
            <div class="h-9 rounded-lg bg-gradient-to-r from-navy to-green-dark flex items-center justify-center text-white text-[11px] font-semibold">Navy–Green</div>
          </label>
          <label id="bg-opt-2" class="cursor-pointer" onclick="selectBg('from-gold to-gold-dark')">
            <input type="radio" name="bg" value="from-gold to-gold-dark" class="sr-only">
            <div class="h-9 rounded-lg bg-gradient-to-r from-yellow-400 to-yellow-600 flex items-center justify-center text-white text-[11px] font-semibold">Gold</div>
          </label>
          <label id="bg-opt-3" class="cursor-pointer" onclick="selectBg('from-terracotta to-terracotta/80')">
            <input type="radio" name="bg" value="from-terracotta to-terracotta/80" class="sr-only">
            <div class="h-9 rounded-lg bg-gradient-to-r from-orange-600 to-orange-500 flex items-center justify-center text-white text-[11px] font-semibold">Terracotta</div>
          </label>
          <label id="bg-opt-4" class="cursor-pointer" onclick="selectBg('from-green to-green-dark')">
            <input type="radio" name="bg" value="from-green to-green-dark" class="sr-only">
            <div class="h-9 rounded-lg bg-gradient-to-r from-green-500 to-green-700 flex items-center justify-center text-white text-[11px] font-semibold">Green</div>
          </label>
          <label id="bg-opt-5" class="cursor-pointer" onclick="selectBg('from-teal to-navy')">
            <input type="radio" name="bg" value="from-teal to-navy" class="sr-only">
            <div class="h-9 rounded-lg bg-gradient-to-r from-teal-500 to-blue-800 flex items-center justify-center text-white text-[11px] font-semibold">Teal–Navy</div>
          </label>
          <label id="bg-opt-6" class="cursor-pointer" onclick="selectBg('from-slate-700 to-slate-900')">
            <input type="radio" name="bg" value="from-slate-700 to-slate-900" class="sr-only">
            <div class="h-9 rounded-lg bg-gradient-to-r from-slate-700 to-slate-900 flex items-center justify-center text-white text-[11px] font-semibold">Dark</div>
          </label>
        </div>
      </div>

      <div class="flex items-center gap-3 pt-1">
        <input id="f-active" type="checkbox" checked class="w-4 h-4 accent-navy">
        <label for="f-active" class="text-sm font-medium cursor-pointer">Aktifkan pengumuman ini</label>
      </div>

      <div id="modal-error" class="hidden text-xs text-terracotta bg-terracotta/10 rounded-lg px-3 py-2"></div>
    </div>

    <div class="p-5 border-t border-ink/10 flex gap-3 flex-shrink-0">
      <button onclick="closeModal()" class="flex-1 border border-ink/20 text-ink/60 py-2.5 rounded-xl text-sm">Batal</button>
      <button onclick="saveAnnouncement()" class="flex-1 bg-navy text-white py-2.5 rounded-xl text-sm font-semibold">Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let allAnn = [];
let selectedBg = 'from-navy to-green-dark';

function selectBg(val) {
  selectedBg = val;
  document.querySelectorAll('[id^="bg-opt-"]').forEach(el => {
    const inner = el.querySelector('div');
    const radio = el.querySelector('input');
    inner.style.outline = radio.value === val ? '2px solid #1a3a5c' : 'none';
    inner.style.outlineOffset = '2px';
  });
}

function previewAnnImage(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { banner('Gambar melebihi 5MB', 'error'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('f-ann-image-url').value = e.target.result;
    document.getElementById('ann-img-preview').innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
    document.getElementById('btn-remove-img').classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

function removeAnnImage() {
  document.getElementById('f-ann-image-url').value = '';
  document.getElementById('f-ann-image').value = '';
  document.getElementById('ann-img-preview').innerHTML = '🖼';
  document.getElementById('btn-remove-img').classList.add('hidden');
}

let items = [];          // merged announcements + events
let statusFilter = '';
let page = 1;
const PAGE_SIZE = 8;

const TYPE_EMOJI = { kelas:'🧘', webinar:'🎥', komuniti:'🤝', challenge:'🏆', manzil:'🕌' };
const STATUS_META = {
  aktif:       { l:'Aktif',        c:'bg-green/10 text-green-dark', dot:'bg-green' },
  dijadualkan: { l:'Dijadualkan',  c:'bg-navy/10 text-navy',        dot:'bg-navy' },
  draft:       { l:'Draft',        c:'bg-ink/8 text-ink/55',        dot:'bg-ink/40' },
  tamat:       { l:'Tamat Tempoh', c:'bg-terracotta/10 text-terracotta', dot:'bg-terracotta' },
};
const TABS = [['', 'Semua'], ['aktif', 'Aktif'], ['dijadualkan', 'Dijadualkan'], ['draft', 'Draft'], ['tamat', 'Tamat Tempoh']];
const TAB_ON = 'text-navy';
const TAB_OFF = 'text-ink/45 hover:text-ink/70';
function catStyle(cat) {
  const c = (cat || '').toLowerCase();
  if (/manzil|harian/.test(c))             return 'text-green-dark';
  if (/webinar/.test(c))                   return 'text-purple-700';
  if (/sistem|kemaskini|aplikasi/.test(c)) return 'text-navy';
  if (/komuniti|community/.test(c))        return 'text-amber-600';
  if (/kelas|class|event/.test(c))         return 'text-teal';
  if (/promo/.test(c))                     return 'text-terracotta';
  const pal = ['text-navy', 'text-green-dark', 'text-amber-600', 'text-purple-700', 'text-teal'];
  let h = 0; for (const ch of c) h = (h + ch.charCodeAt(0)) % pal.length;
  return pal[h];
}
const ICON = {
  eye:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px]"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  edit:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px]"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px]"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  kebab: '<svg viewBox="0 0 24 24" fill="currentColor" class="w-[18px] h-[18px]"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>',
};

function statusOf(it) {
  if (it._kind === 'announcement') {
    if (!it.raw.is_active) return 'draft';
    if (it.raw.expires_at && new Date(it.raw.expires_at) < new Date()) return 'tamat';
    return 'aktif';
  }
  const e = it.raw;
  if (e.status === 'draft') return 'draft';
  if (e.status === 'cancelled' || e.status === 'completed') return 'tamat';
  const ref = e.end_at ? new Date(e.end_at) : new Date(e.start_at);
  if (ref < new Date()) return 'tamat';
  return new Date(e.start_at) > new Date() ? 'dijadualkan' : 'aktif';
}
function audLabel(aud) {
  if (!Array.isArray(aud) || !aud.length) return 'Semua Pengguna';
  const map = { patient:'Pesakit', staff:'Staff', doctor:'Doktor', coach:'Coach', admin:'Admin' };
  if (aud.length >= 5) return 'Semua Pengguna';
  if (aud.length === 1) return aud[0] === 'patient' ? 'Semua Pesakit' : aud[0] === 'staff' ? 'Semua Staff' : map[aud[0]] || aud[0];
  return aud.map(x => map[x] || x).join(', ');
}
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('ms-MY', { day:'2-digit', month:'short', year:'numeric' }) : '—'; }
function fmtTime(d) { return d ? new Date(d).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }) : ''; }
function thumbHtml(it) {
  if (it.image) return `<img src="${it.image}" alt="" class="w-14 h-12 rounded-lg object-cover flex-shrink-0">`;
  const emoji = it._kind === 'event' ? (TYPE_EMOJI[it.raw.type] || '📅') : '📢';
  const grad = it._kind === 'event' ? 'from-teal to-navy' : 'from-navy to-green-dark';
  return `<div class="w-14 h-12 rounded-lg bg-gradient-to-br ${grad} flex items-center justify-center text-white text-lg flex-shrink-0">${emoji}</div>`;
}

async function loadAnn() {
  const [annRes, evRes] = await Promise.all([
    window.db.from('psy_announcements').select('*').order('created_at', { ascending: false }),
    window.db.from('psy_events').select('*').order('start_at', { ascending: false }),
  ]);
  allAnn = annRes.data || [];                       // announcements (untuk modal edit cepat)
  const anns = allAnn.map(a => ({
    _kind:'announcement', id:a.id, title:a.title, body:a.body, image:a.image_url,
    category:a.category || a.tag, dateAt:a.created_at, audience:a.audience, updatedAt:a.created_at, raw:a,
  }));
  const evs = (evRes.data || []).map(e => ({
    _kind:'event', id:e.id, title:e.title, body:e.description, image:e.cover_image,
    category:e.tag || e.type, dateAt:e.start_at, audience:e.audience, updatedAt:e.updated_at || e.created_at, raw:e,
  }));
  items = [...anns, ...evs].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  renderTabs();
  renderTable();
}

function renderTabs() {
  document.getElementById('status-tabs').innerHTML = TABS.map(([key, label]) => {
    const on = statusFilter === key;
    return `<button onclick="setFilter('${key}')" class="px-2 py-1.5 text-sm font-semibold transition-colors ${on ? TAB_ON : TAB_OFF}">${label}</button>`;
  }).join('');
}
function setFilter(key) { statusFilter = key; page = 1; renderTabs(); renderTable(); }

function filteredItems() {
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  return items.filter(it => {
    if (statusFilter && statusOf(it) !== statusFilter) return false;
    if (q && !((it.title || '') + ' ' + (it.body || '') + ' ' + (it.category || '')).toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderTable() {
  const list = filteredItems();
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (page > pages) page = pages;
  const slice = list.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  const canEdit = can('announcements', 'edit'), canDel = can('announcements', 'delete');

  document.getElementById('ann-body').innerHTML = slice.length ? slice.map(it => {
    const sk = statusOf(it), sm = STATUS_META[sk];
    return `<tr class="border-b border-ink/5 hover:bg-cream/30 transition-colors align-middle">
      <td class="py-3 pr-3">
        <div class="flex items-center gap-3 min-w-0">
          ${thumbHtml(it)}
          <div class="min-w-0">
            <div class="font-bold text-ink text-sm truncate max-w-[260px]">${it.title}</div>
            ${it.body ? `<div class="text-[11px] text-ink/50 truncate max-w-[260px]">${String(it.body).replace(/<[^>]+>/g,'')}</div>` : ''}
          </div>
        </div>
      </td>
      <td class="px-3">${it.category ? `<span class="text-[12px] font-semibold ${catStyle(it.category)}">${it.category}</span>` : '<span class="text-ink/30">—</span>'}</td>
      <td class="px-3 whitespace-nowrap">
        <div class="text-[12px] text-ink/70">${fmtDate(it.dateAt)}</div>
        ${it._kind === 'event' ? `<div class="text-[10px] text-ink/40 mt-0.5">${fmtTime(it.dateAt)}</div>` : ''}
      </td>
      <td class="px-3 text-[12px] text-ink/65 whitespace-nowrap">${audLabel(it.audience)}</td>
      <td class="px-3"><span class="inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full ${sm.c}"><span class="w-1.5 h-1.5 rounded-full ${sm.dot}"></span>${sm.l}</span></td>
      <td class="px-3 text-[11px] text-ink/45 whitespace-nowrap">${fmtDate(it.updatedAt)}<br><span class="text-ink/30">${fmtTime(it.updatedAt)}</span></td>
      <td class="pl-3">
        <div class="flex items-center justify-end gap-0.5">
          <button onclick="viewItem('${it._kind}','${it.id}')" title="Lihat" class="w-8 h-8 rounded-lg hover:bg-ink/8 text-ink/45 flex items-center justify-center">${ICON.eye}</button>
          ${canEdit ? `<button onclick="editItem('${it._kind}','${it.id}')" title="Edit" class="w-8 h-8 rounded-lg hover:bg-navy/10 text-navy flex items-center justify-center">${ICON.edit}</button>` : ''}
          ${canDel ? `<button onclick="delItem('${it._kind}','${it.id}')" title="Padam" class="w-8 h-8 rounded-lg hover:bg-terracotta/10 text-terracotta flex items-center justify-center">${ICON.trash}</button>` : ''}
          ${canEdit ? `<button onclick="toggleStatus('${it._kind}','${it.id}')" title="Aktif/Nyahaktif" class="w-8 h-8 rounded-lg hover:bg-ink/8 text-ink/40 flex items-center justify-center">${ICON.kebab}</button>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="7" class="text-center text-ink/40 py-12">📭 Tiada pengumuman ditemui</td></tr>`;

  // info + pager
  document.getElementById('page-info').textContent = total
    ? `Menunjukkan ${(page-1)*PAGE_SIZE+1} hingga ${Math.min(page*PAGE_SIZE, total)} daripada ${total} pengumuman` : '';
  let pg = `<button onclick="goPage(${page-1})" ${page<=1?'disabled':''} class="w-8 h-8 rounded-lg border border-ink/15 text-ink/50 disabled:opacity-30 hover:bg-ink/5">‹</button>`;
  for (let i = 1; i <= pages; i++) {
    if (pages > 7 && i > 2 && i < pages - 1 && Math.abs(i - page) > 1) { if (i === 3) pg += `<span class="px-1 text-ink/30">…</span>`; continue; }
    pg += `<button onclick="goPage(${i})" class="w-8 h-8 rounded-lg text-sm font-semibold ${i===page?'bg-green text-white':'border border-ink/15 text-ink/60 hover:bg-ink/5'}">${i}</button>`;
  }
  pg += `<button onclick="goPage(${page+1})" ${page>=pages?'disabled':''} class="w-8 h-8 rounded-lg border border-ink/15 text-ink/50 disabled:opacity-30 hover:bg-ink/5">›</button>`;
  document.getElementById('pager').innerHTML = pages > 1 ? pg : '';
}
function goPage(p) { page = Math.max(1, p); renderTable(); }

function viewItem(kind, id) {
  location.href = kind === 'event' ? ('acara-detail.html?id=' + id) : ('announcement-detail.html?id=' + id);
}
function editItem(kind, id) {
  location.href = 'pengumuman-edit.html?kind=' + kind + '&id=' + id;
}
async function delItem(kind, id) {
  if (!confirm('Padam item ini?')) return;
  const table = kind === 'announcement' ? 'psy_announcements' : 'psy_events';
  const { error } = await window.db.from(table).delete().eq('id', id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  banner('Dipadam');
  await loadAnn();
}
async function toggleStatus(kind, id) {
  const it = items.find(x => x._kind === kind && x.id === id);
  if (!it) return;
  if (kind === 'announcement') {
    const nv = !it.raw.is_active;
    await window.db.from('psy_announcements').update({ is_active: nv }).eq('id', id);
    banner(nv ? 'Diaktifkan' : 'Dinyahaktif');
  } else {
    const nv = it.raw.status === 'published' ? 'draft' : 'published';
    await window.db.from('psy_events').update({ status: nv }).eq('id', id);
    banner(nv === 'published' ? 'Diterbitkan' : 'Dijadikan draf');
  }
  await loadAnn();
}

function openModal(id) {
  document.getElementById('modal-title').textContent = id ? 'Edit Pengumuman' : 'Pengumuman Baru';
  document.getElementById('modal-error').classList.add('hidden');

  const resetImg = (url) => {
    document.getElementById('f-ann-image-url').value = url || '';
    document.getElementById('f-ann-image').value = '';
    const prev = document.getElementById('ann-img-preview');
    prev.innerHTML = url ? `<img src="${url}" class="w-full h-full object-cover">` : '🖼';
    document.getElementById('btn-remove-img').classList.toggle('hidden', !url);
  };

  if (id) {
    const a = allAnn.find(x => x.id === id);
    if (!a) return;
    document.getElementById('edit-id').value = a.id;
    document.getElementById('f-title').value = a.title || '';
    document.getElementById('f-body').value = a.body || '';
    document.getElementById('f-tag').value = a.tag || '';
    document.getElementById('f-order').value = a.sort_order ?? 0;
    document.getElementById('f-cta-label').value = a.cta_label || '';
    document.getElementById('f-cta-url').value = a.cta_url || '';
    document.getElementById('f-expires').value = a.expires_at ? (() => { const d = new Date(a.expires_at), p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; })() : '';
    document.getElementById('f-active').checked = a.is_active;
    selectedBg = a.bg || 'from-navy to-green-dark';
    selectBg(selectedBg);
    resetImg(a.image_url);
  } else {
    document.getElementById('edit-id').value = '';
    document.getElementById('f-title').value = '';
    document.getElementById('f-body').value = '';
    document.getElementById('f-tag').value = '';
    document.getElementById('f-order').value = allAnn.length;
    document.getElementById('f-cta-label').value = '';
    document.getElementById('f-cta-url').value = '';
    document.getElementById('f-expires').value = '';
    document.getElementById('f-active').checked = true;
    selectedBg = 'from-navy to-green-dark';
    selectBg(selectedBg);
    resetImg(null);
  }

  document.getElementById('ann-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('f-title').focus(), 100);
}

function closeModal() {
  document.getElementById('ann-modal').classList.add('hidden');
}

async function saveAnnouncement() {
  const id     = document.getElementById('edit-id').value;
  const title  = document.getElementById('f-title').value.trim();
  const errEl  = document.getElementById('modal-error');
  errEl.classList.add('hidden');

  if (!title) {
    errEl.textContent = 'Tajuk diperlukan.';
    errEl.classList.remove('hidden');
    return;
  }

  const payload = {
    title,
    body:       document.getElementById('f-body').value.trim() || null,
    tag:        document.getElementById('f-tag').value.trim() || null,
    sort_order: parseInt(document.getElementById('f-order').value) || 0,
    cta_label:  document.getElementById('f-cta-label').value.trim() || null,
    cta_url:    document.getElementById('f-cta-url').value.trim() || null,
    bg:         selectedBg,
    image_url:  document.getElementById('f-ann-image-url').value || null,
    expires_at: document.getElementById('f-expires').value ? new Date(document.getElementById('f-expires').value).toISOString() : null,
    is_active:  document.getElementById('f-active').checked,
  };

  try {
    if (id) {
      const { error } = await window.db.from('psy_announcements').update(payload).eq('id', id);
      if (error) throw error;
      banner('Pengumuman dikemaskini ✅');
    } else {
      const { error } = await window.db.from('psy_announcements').insert(payload);
      if (error) throw error;
      banner('Pengumuman ditambah ✅');
    }
    closeModal();
    await loadAnn();
  } catch (err) {
    errEl.textContent = 'Ralat: ' + err.message;
    errEl.classList.remove('hidden');
  }
}

async function toggleActive(id, newVal) {
  const { error } = await window.db.from('psy_announcements').update({ is_active: newVal }).eq('id', id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  banner(newVal ? 'Pengumuman diaktifkan' : 'Pengumuman dinyahaktifkan');
  await loadAnn();
}

async function deleteAnn(id) {
  if (!confirm('Padam pengumuman ini?')) return;
  const { error } = await window.db.from('psy_announcements').delete().eq('id', id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  banner('Pengumuman dipadam');
  await loadAnn();
}

(async () => {
  const user = await initStaff('announcements', 'Urus pengumuman di dashboard pesakit');
  if (!user) return;
  if (can('announcements','create')) {
    document.getElementById('btn-ann-new').classList.remove('hidden');
    document.getElementById('btn-ann-quick').classList.remove('hidden');
  }
  await loadAnn();
  const ed = new URLSearchParams(location.search).get('edit');
  if (ed && allAnn.some(a => a.id === ed)) openModal(ed);
})();
</script>
