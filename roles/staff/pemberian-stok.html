<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Pemberian Stok</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">

<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📦</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">
        <div class="text-xs text-ink/40">
          <a href="inventory-overview.html" class="hover:text-navy hover:underline">Inventory</a> <span class="mx-1">›</span>
          <span class="text-ink/70 font-medium">Pemberian Stok</span>
        </div>

        <div>
          <h2 class="text-xl font-bold text-navy">Pemberian Stok kepada Pesakit</h2>
          <p class="text-xs text-ink/50 mt-0.5">Bekalan yang sudah diberi (auto-potong sesi Hadir + manual "Bagi Bekalan") dan yang masih tertunggak.</p>
        </div>

        <!-- Stat Cards — ikut tapisan semasa (bukan jumlah keseluruhan tanpa tapis). Boleh
             diklik: terus tapis jadual bawah ikut Status (sama konsep dgn dashboard lain). -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <button type="button" onclick="filterByStatCard('')" id="card-total" class="text-left bg-white rounded-2xl border border-ink/10 shadow-sm p-4 hover:shadow-md transition-shadow cursor-pointer">
            <div class="text-[10px] text-ink/40 font-semibold uppercase tracking-wide">Jumlah Item</div>
            <div id="ps-stat-total" class="text-2xl font-bold text-ink">—</div>
            <div id="ps-stat-total-sub" class="text-[10px] text-ink/40 mt-0.5">—</div>
          </button>
          <button type="button" onclick="filterByStatCard('given')" id="card-given" class="text-left bg-white rounded-2xl border border-ink/10 shadow-sm p-4 hover:shadow-md transition-shadow cursor-pointer">
            <div class="text-[10px] text-ink/40 font-semibold uppercase tracking-wide">✅ Dah Bagi</div>
            <div id="ps-stat-given" class="text-2xl font-bold text-green-dark">—</div>
            <div id="ps-stat-given-sub" class="text-[10px] text-ink/40 mt-0.5">—</div>
          </button>
          <button type="button" onclick="filterByStatCard('pending')" id="card-pending" class="text-left bg-white rounded-2xl border border-ink/10 shadow-sm p-4 hover:shadow-md transition-shadow cursor-pointer">
            <div class="text-[10px] text-ink/40 font-semibold uppercase tracking-wide">⏳ Belum Bagi</div>
            <div id="ps-stat-pending" class="text-2xl font-bold text-amber-600">—</div>
            <div id="ps-stat-pending-sub" class="text-[10px] text-ink/40 mt-0.5">—</div>
          </button>
          <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-4">
            <div class="text-[10px] text-ink/40 font-semibold uppercase tracking-wide">Pesakit Terlibat</div>
            <div id="ps-stat-patients" class="text-2xl font-bold text-navy">—</div>
            <div class="text-[10px] text-ink/40 mt-0.5">dalam tapisan semasa</div>
          </div>
        </div>


        <!-- Filters -->
        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-4 grid grid-cols-1 md:grid-cols-5 gap-3">
          <div class="md:col-span-2">
            <label class="block text-[10px] font-semibold text-ink/40 uppercase tracking-wide mb-1">Cari</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/30 text-sm">🔍</span>
              <input id="ps-search" type="text" placeholder="Cari nama pesakit atau produk..." oninput="onFilterChange()"
                class="w-full pl-9 pr-3 py-2.5 border border-ink/20 rounded-xl text-sm focus:outline-none focus:border-navy">
            </div>
          </div>
          <div>
            <label class="block text-[10px] font-semibold text-ink/40 uppercase tracking-wide mb-1">Status</label>
            <select id="ps-status" onchange="onFilterChange()" class="w-full px-3 py-2.5 border border-ink/20 rounded-xl text-sm bg-white focus:outline-none focus:border-navy">
              <option value="">Semua Status</option>
              <option value="given">✅ Dah Bagi</option>
              <option value="pending">⏳ Belum Bagi</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-semibold text-ink/40 uppercase tracking-wide mb-1">Tarikh Dari</label>
            <input id="ps-date-from" type="date" onchange="onDateFilterChange()" class="w-full px-3 py-2.5 border border-ink/20 rounded-xl text-sm focus:outline-none focus:border-navy">
          </div>
          <div>
            <label class="block text-[10px] font-semibold text-ink/40 uppercase tracking-wide mb-1">Tarikh Hingga</label>
            <input id="ps-date-to" type="date" onchange="onDateFilterChange()" class="w-full px-3 py-2.5 border border-ink/20 rounded-xl text-sm focus:outline-none focus:border-navy">
          </div>
          <div class="md:col-span-5 flex justify-end">
            <button onclick="clearFilters()" class="px-3 py-2.5 border border-ink/20 rounded-xl text-sm text-ink/50 hover:bg-ink/5 bg-white flex items-center gap-1.5">✕ Kosongkan Filter</button>
          </div>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl border border-ink/10 overflow-hidden shadow-sm">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="bg-ink/[0.02] border-b border-ink/10 text-left">
                  <th class="px-5 py-3 text-[10px] font-bold text-ink/40 uppercase tracking-widest whitespace-nowrap">Tarikh</th>
                  <th class="px-4 py-3 text-[10px] font-bold text-ink/40 uppercase tracking-widest">Nama Pesakit</th>
                  <th class="px-4 py-3 text-[10px] font-bold text-ink/40 uppercase tracking-widest">Nama Produk</th>
                  <th class="px-4 py-3 text-right text-[10px] font-bold text-ink/40 uppercase tracking-widest">Quantity</th>
                  <th class="px-4 py-3 text-[10px] font-bold text-ink/40 uppercase tracking-widest">Status</th>
                  <th class="px-4 py-3 text-[10px] font-bold text-ink/40 uppercase tracking-widest">Tindakan</th>
                </tr>
              </thead>
              <tbody id="ps-tbody">
                <tr><td colspan="6" class="text-center py-12 text-ink/40 text-sm italic">Memuatkan...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="px-5 py-3 border-t border-ink/8 flex items-center justify-between flex-wrap gap-2">
            <div id="ps-page-info" class="text-xs text-ink/40"></div>
            <div id="ps-page-btns" class="flex items-center gap-1"></div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/inventoryStock.js"></script>
<script src="_shared.js"></script>
<script>
let ALL_ROWS = [];
let psPage = 1;
const PS_PAGE_SIZE = 20;
let PS_ITEM_LOOKUP = {}; // movementId -> {itemId, productName, qty, unit, patientId, patientName}

// ── Pulangkan bekalan "Dah Bagi" (salah bagi / terlebih / tak jadi) — balik ke
// Stok Masuk dengan sebab, pesakit & tarikh direkod terus dalam ledger. Rekod
// asal (Stok Keluar) KEKAL sebagai sejarah — ini tambah pergerakan BAHARU, bukan padam.
const PS_REVERSE_REASONS = [
  { v: 'salah_bagi', lbl: 'Salah bagi (produk/pesakit silap)' },
  { v: 'terlebih',   lbl: 'Terlebih bagi (kuantiti silap)' },
  { v: 'tak_jadi',   lbl: 'Tak jadi / dibatalkan' },
  { v: 'lain',       lbl: 'Lain-lain' },
];
function openReverseModal(movementId) {
  const it = PS_ITEM_LOOKUP[movementId];
  if (!it) return;
  const wrap = document.createElement('div');
  wrap.className = 'fixed inset-0 bg-black/40 z-[80] flex items-center justify-center p-4';
  wrap.innerHTML = `<div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-5">
    <h3 class="font-bold text-navy text-base mb-1">↩ Pulangkan Bekalan</h3>
    <p class="text-xs text-ink/55 mb-3">${escHtml(it.productName)} · ${escHtml(String(it.qty))}${escHtml(it.unit)} — ${escHtml(it.patientName)}. Stok akan ditambah balik (Stok Masuk).</p>
    <label class="block text-xs font-semibold text-ink/60 mb-1">Sebab *</label>
    <select id="pr-reason" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm bg-white mb-3">
      ${PS_REVERSE_REASONS.map(r => `<option value="${r.v}">${escHtml(r.lbl)}</option>`).join('')}
    </select>
    <div id="pr-note-wrap" class="hidden mb-3">
      <label class="block text-xs font-semibold text-ink/60 mb-1">Nota</label>
      <textarea id="pr-note" rows="2" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm" placeholder="Nyatakan sebab..."></textarea>
    </div>
    <div id="pr-err" class="text-xs text-terracotta mb-2 hidden">Sila isi nota untuk "Lain-lain".</div>
    <div class="flex justify-end gap-2 mt-1">
      <button id="pr-cancel" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-ink/15 text-ink/60 hover:bg-cream">Batal</button>
      <button id="pr-ok" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-navy text-white hover:bg-navy-dark">Sahkan Pulangan</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const reasonEl = wrap.querySelector('#pr-reason');
  const noteWrap = wrap.querySelector('#pr-note-wrap');
  reasonEl.onchange = () => noteWrap.classList.toggle('hidden', reasonEl.value !== 'lain');
  wrap.querySelector('#pr-cancel').onclick = () => wrap.remove();
  wrap.querySelector('#pr-ok').onclick = async () => {
    const reasonVal = reasonEl.value;
    const noteVal = wrap.querySelector('#pr-note').value.trim();
    if (reasonVal === 'lain' && !noteVal) { wrap.querySelector('#pr-err').classList.remove('hidden'); return; }
    const reasonLbl = PS_REVERSE_REASONS.find(r => r.v === reasonVal)?.lbl || reasonVal;
    const okBtn = wrap.querySelector('#pr-ok');
    okBtn.disabled = true; okBtn.textContent = 'Menyimpan…';
    await submitReverse(movementId, it, reasonLbl, noteVal);
    wrap.remove();
  };
}
window.openReverseModal = openReverseModal;

async function submitReverse(movementId, it, reasonLbl, noteVal) {
  const note = `Pulangan: ${reasonLbl}${noteVal ? ' — ' + noteVal : ''} (asal: ${movementId.slice(0, 8)})`;
  try {
    await window.addStockToLocation(it.itemId, Math.abs(Number(it.qty)), null, {
      type: 'in', refType: 'patient_package_reversal', refId: it.patientId, note, itemName: it.productName,
    });
    banner(`Pulangan direkod ✅ — ${it.productName} (${it.qty}${it.unit}) ditambah balik ke stok.`);
    await loadAll();
  } catch (e) {
    banner('Ralat: ' + (e.message || e), 'error');
  }
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtDate(d) { return d ? new Date(d).toLocaleDateString(LCALE(), { day: '2-digit', month: 'short', year: 'numeric' }) : '—'; }
function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }

// ── "Dah Bagi" — dari ledger psy_stock_movements (auto-potong sesi Hadir + manual
// "Bagi Bekalan" patient-hub, dua-dua tulis reference_type='patient_package'). ──
// from/to ('YYYY-MM-DD', pilihan) — terikat di SERVER supaya had limit() tak silap
// buang rekod dalam julat yang staff sedang tengok.
async function loadGivenRows(from, to) {
  let q = window.db.from('psy_stock_movements')
    .select('id, item_id, item_name, qty, reference_id, created_at, psy_inventory_items(unit)')
    .eq('reference_type', 'patient_package').eq('movement_type', 'out');
  if (from) q = q.gte('created_at', from + 'T00:00:00');
  if (to) q = q.lte('created_at', to + 'T23:59:59');
  const { data } = await q.order('created_at', { ascending: false }).limit(1000);
  return (data || []).map(r => ({
    movementId: r.id, itemId: r.item_id,
    date: r.created_at, patientId: r.reference_id, productName: r.item_name,
    qty: Math.abs(Number(r.qty)), unit: r.psy_inventory_items?.unit || '', status: 'given',
    // Trace ke Sejarah Bekalan pesakit (tab Bekalan, patient-hub.html) — halaman
    // Stock Movement global dibuang, ni baca ledger psy_stock_movements sama.
    goto: `patient-hub.html?patient_id=${r.reference_id}&tab=supply`,
  }));
}

// ── "Belum Bagi" — sesi F2F yg belum ditandakan Hadir, bekalan dijadualkan ikut
// coaching_schedule pakej (sama logik shared/inventoryDeduct.js / dashboard.html). ──
// Status: SEMUA kecuali 'hadir'/'cancel' — sepadan dgn shared/inventoryForecast.js
// computeForecastForRange() (termasuk 'reschedule', bukan setakat booked/pending), supaya
// jumlah "Belum Bagi" di sini konsisten dgn enjin forecast rasmi (Amaran Stok/dashboard).
async function loadPendingRows(from, to) {
  let q = window.db.from('psy_plan_weekly_progress')
    .select('id, session_date, week_number, session_day, plan_id, patient_id, is_extension')
    .eq('session_type', 'f2f').neq('status', 'hadir').neq('status', 'cancel')
    .not('session_date', 'is', null); // sesi belum dijadualkan (tiada tarikh) — tiada apa-apa nak diberi lagi
  if (from) q = q.gte('session_date', from + 'T00:00:00');
  if (to) q = q.lte('session_date', to + 'T23:59:59');
  const { data: sessions } = await q.order('session_date', { ascending: true }).limit(1000);
  const rows = (sessions || []).filter(s => !s.is_extension); // sesi extension tiada bekalan (shared/inventoryDeduct.js)
  const planIds = [...new Set(rows.map(s => s.plan_id).filter(Boolean))];
  let scheduleByPlan = {};
  if (planIds.length) {
    const { data: plans } = await window.db.from('psy_treatment_plans').select('id, coaching_schedule').in('id', planIds);
    (plans || []).forEach(pl => { scheduleByPlan[pl.id] = Array.isArray(pl.coaching_schedule) ? pl.coaching_schedule : []; });
  }
  const out = [];
  const missingNameIds = new Set();
  rows.forEach(s => {
    const schedule = scheduleByPlan[s.plan_id] || [];
    const weekObj = schedule.find(w => w.week === s.week_number) || schedule[s.week_number - 1];
    if (!weekObj || weekObj.mode === 'online') return;
    // Sesi 2 (session_day=2) guna senarai supplies_2 berasingan — sepadan dgn apa yg
    // deductSessionSupplies() sebenarnya tolak (shared/inventoryDeduct.js).
    const activeDay = s.session_day || 1;
    const suppliesRaw = activeDay === 2 ? weekObj.supplies_2 : weekObj.supplies;
    const supplies = (Array.isArray(suppliesRaw) ? suppliesRaw : [])
      .filter(sup => sup?.auto_stock !== false && Number(sup?.qty || sup?.quantity || 0) > 0);
    supplies.forEach(sup => {
      const name = sup.item_name || sup.name || '';
      if (!name && sup.item_id) missingNameIds.add(sup.item_id);
      out.push({
        date: s.session_date, patientId: s.patient_id,
        productName: name, itemId: sup.item_id, qty: Number(sup.qty || sup.quantity || 0),
        unit: sup.item_unit || sup.unit || '', status: 'pending',
        goto: `plan-week.html?plan_id=${s.plan_id}&week=${s.week_number}`,
      });
    });
  });

  // Sesetengah pakej lama simpan item_id sahaja (tiada item_name terus dalam
  // coaching_schedule) — resolve nama sebenar dari katalog Inventori, sama fallback
  // dgn pakej-edit.html.
  if (missingNameIds.size) {
    const { data: items } = await window.db.from('psy_inventory_items').select('id, name, unit').in('id', [...missingNameIds]);
    const nameById = {}; (items || []).forEach(it => { nameById[it.id] = it; });
    out.forEach(r => {
      if (!r.productName && r.itemId && nameById[r.itemId]) {
        r.productName = nameById[r.itemId].name;
        if (!r.unit) r.unit = nameById[r.itemId].unit || '';
      }
    });
  }
  return out.map(r => ({ ...r, productName: r.productName || '(item tak ditemui)' }));
}

async function resolvePatientNames(rows) {
  const ids = [...new Set(rows.map(r => r.patientId).filter(Boolean))];
  if (!ids.length) return {};
  const { data } = await window.db.from('psy_patients')
    .select('id, full_name, mrn, psy_profiles!psy_patients_user_id_fkey(full_name)').in('id', ids);
  const map = {};
  (data || []).forEach(p => { map[p.id] = iswPatientName(p) || p.mrn || 'Pesakit'; });
  return map;
}

async function loadAll() {
  const from = document.getElementById('ps-date-from').value;
  const to = document.getElementById('ps-date-to').value;
  const [given, pending] = await Promise.all([loadGivenRows(from, to), loadPendingRows(from, to)]);
  const combined = [...pending, ...given]; // belum bagi (akan datang) dulu, dah bagi (lepas) lepas tu
  const nameMap = await resolvePatientNames(combined);
  ALL_ROWS = combined.map(r => ({ ...r, patientName: nameMap[r.patientId] || 'Pesakit' }));
  ALL_ROWS.sort((a, b) => new Date(b.date) - new Date(a.date));
  render();
}

// Stat cards ikut TAPISAN SEMASA (bukan jumlah keseluruhan data dimuatkan) — supaya
// nombor konsisten dgn apa yang staff nampak dalam jadual + ringkasan di bawah.
function renderStats(filteredList) {
  const given = filteredList.filter(r => r.status === 'given');
  const pending = filteredList.filter(r => r.status === 'pending');
  const patientIds = new Set(filteredList.map(r => r.patientId).filter(Boolean));

  document.getElementById('ps-stat-total').textContent = filteredList.length;
  document.getElementById('ps-stat-total-sub').textContent = `${given.length} dah bagi · ${pending.length} belum bagi`;
  document.getElementById('ps-stat-given').textContent = given.length;
  document.getElementById('ps-stat-given-sub').textContent = `${new Set(given.map(r => r.patientId)).size} pesakit`;
  document.getElementById('ps-stat-pending').textContent = pending.length;
  document.getElementById('ps-stat-pending-sub').textContent = `${new Set(pending.map(r => r.patientId)).size} pesakit`;
  document.getElementById('ps-stat-patients').textContent = patientIds.size;

  // Highlight kad yang sepadan dgn tapisan Status semasa
  const curStatus = document.getElementById('ps-status').value;
  const cardByStatus = { '': 'card-total', given: 'card-given', pending: 'card-pending' };
  Object.entries(cardByStatus).forEach(([v, id]) => {
    document.getElementById(id)?.classList.toggle('ring-2', v === curStatus);
    document.getElementById(id)?.classList.toggle('ring-navy/40', v === curStatus);
    document.getElementById(id)?.classList.toggle('border-navy/30', v === curStatus);
  });
}

// Kad stat diklik → terus tapis jadual ikut Status, sama konsep dgn kad dashboard lain.
function filterByStatCard(status) {
  document.getElementById('ps-status').value = status;
  onFilterChange();
}
window.filterByStatCard = filterByStatCard;

// Tarikh dah ditapis di SERVER (loadAll() hantar from/to terus ke query) — ALL_ROWS
// sentiasa dalam julat yang dipilih, jadi di sini cuma tapis status + carian teks.
function getFiltered() {
  const q = document.getElementById('ps-search').value.trim().toLowerCase();
  const status = document.getElementById('ps-status').value;
  return ALL_ROWS.filter(r => {
    if (status && r.status !== status) return false;
    if (q) {
      const hay = `${r.patientName} ${r.productName}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function onFilterChange() { psPage = 1; render(); }
window.onFilterChange = onFilterChange;

// Tarikh diubah — kena tarik semula dari server (bukan setakat render semula) sebab
// ALL_ROWS terikat kepada julat tarikh lama.
function onDateFilterChange() { psPage = 1; loadAll(); }
window.onDateFilterChange = onDateFilterChange;

function clearFilters() {
  document.getElementById('ps-search').value = '';
  document.getElementById('ps-status').value = '';
  document.getElementById('ps-date-from').value = '';
  document.getElementById('ps-date-to').value = '';
  onDateFilterChange(); // tarikh berubah (dikosongkan) — reload dari server
}
window.clearFilters = clearFilters;

const STATUS_CHIP = {
  given:   '<span class="text-xs font-semibold text-green-dark bg-green-light px-2 py-0.5 rounded-full whitespace-nowrap">✅ Dah Bagi</span>',
  pending: '<span class="text-xs font-semibold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full whitespace-nowrap">⏳ Belum Bagi</span>',
};

// Gabung baris tarikh+pesakit+status sama jadi SATU baris (macam widget dashboard) —
// senarai item bernombor dalam satu sel, bukan satu baris jadual per item.
function groupRows(list) {
  const groups = new Map();
  list.forEach(r => {
    const dateKey = r.date ? new Date(r.date).toISOString().slice(0, 10) : 'nodate';
    const key = `${dateKey}|${r.patientId}|${r.status}`;
    if (!groups.has(key)) {
      groups.set(key, { date: r.date, patientId: r.patientId, patientName: r.patientName, status: r.status, goto: r.goto, items: [] });
    }
    groups.get(key).items.push({ productName: r.productName, qty: r.qty, unit: r.unit, movementId: r.movementId, itemId: r.itemId });
  });
  return [...groups.values()];
}

function render() {
  const filtered = getFiltered();
  renderStats(filtered);
  const groups = groupRows(filtered);
  const pages = Math.max(1, Math.ceil(groups.length / PS_PAGE_SIZE));
  if (psPage > pages) psPage = pages;
  const start = (psPage - 1) * PS_PAGE_SIZE;
  const pageGroups = groups.slice(start, start + PS_PAGE_SIZE);

  const tbody = document.getElementById('ps-tbody');
  PS_ITEM_LOOKUP = {};
  tbody.innerHTML = pageGroups.length ? pageGroups.map(g => {
    const itemNames = g.items.map((it, i) => `<div class="${i > 0 ? 'mt-0.5' : ''}">${i + 1}. ${escHtml(it.productName)}</div>`).join('');
    const itemQtys = g.items.map((it, i) => `<div class="${i > 0 ? 'mt-0.5' : ''} text-ink/60">${escHtml(String(it.qty))}${escHtml(it.unit)}</div>`).join('');
    // "🔍 Pergerakan" — buka Detail Item tu terus di Pergerakan Stok, ditapis ikut
    // pesakit ni sahaja (bukan senarai Produk master). "↩ Pulangkan" — salah bagi/
    // terlebih/tak jadi; balik sebagai Stok Masuk dengan sebab, bukan padam sejarah.
    // Dua-dua hanya utk "Dah Bagi" & bekalan yang ada movementId/itemId sebenar.
    const itemActions = g.items.map((it, i) => {
      if (g.status !== 'given' || !it.movementId || !it.itemId) return `<div class="${i > 0 ? 'mt-0.5' : ''} text-ink/20">—</div>`;
      PS_ITEM_LOOKUP[it.movementId] = { itemId: it.itemId, productName: it.productName, qty: it.qty, unit: it.unit, patientId: g.patientId, patientName: g.patientName };
      return `<div class="${i > 0 ? 'mt-0.5' : ''} flex items-center gap-2">
        <a href="inventory-detail.html?id=${it.itemId}&patient=${g.patientId}" onclick="event.stopPropagation()" class="text-[11px] font-semibold text-navy hover:underline whitespace-nowrap">🔍 Pergerakan</a>
        <button type="button" onclick="event.stopPropagation(); openReverseModal('${it.movementId}')" data-rbac="inventory.edit" class="text-[11px] font-semibold text-terracotta hover:underline whitespace-nowrap">↩ Pulangkan</button>
      </div>`;
    }).join('');
    return `<tr class="border-b border-ink/5 last:border-0 hover:bg-ink/[0.015] align-top ${g.goto ? 'cursor-pointer' : ''}" ${g.goto ? `onclick="location.href='${g.goto}'"` : ''}>
      <td class="px-5 py-3 text-xs text-ink/55 whitespace-nowrap">${fmtDate(g.date)}</td>
      <td class="px-4 py-3 text-sm font-medium text-ink">${escHtml(g.patientName)}</td>
      <td class="px-4 py-3 text-sm text-ink/80">${itemNames}</td>
      <td class="px-4 py-3 text-sm text-right font-semibold">${itemQtys}</td>
      <td class="px-4 py-3">${STATUS_CHIP[g.status] || g.status}</td>
      <td class="px-4 py-3">${itemActions}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="6" class="text-center py-12 text-ink/40 text-sm">Tiada rekod sepadan</td></tr>';

  const infoEl = document.getElementById('ps-page-info');
  infoEl.textContent = groups.length ? `Papar ${start + 1}–${Math.min(start + PS_PAGE_SIZE, groups.length)} daripada ${groups.length} rekod (${filtered.length} item)` : '0 rekod';

  let pg = '';
  for (let i = 1; i <= pages; i++) {
    pg += `<button onclick="goPage(${i})" class="w-8 h-8 rounded-lg text-xs font-semibold ${i === psPage ? 'bg-navy text-white' : 'hover:bg-ink/5 text-ink/60'}">${i}</button>`;
  }
  document.getElementById('ps-page-btns').innerHTML = pages > 1 ? pg : '';
}

function goPage(p) { psPage = p; render(); }
window.goPage = goPage;

// Default bila page dibuka: minggu ini (Isnin–Ahad) sahaja — untuk minggu/bulan lepas
// atau julat lain, staff tukar sendiri guna filter Tarikh Dari/Hingga di atas.
function setDefaultWeekFilter() {
  const today = new Date();
  const dow = today.getDay(); // 0=Ahad..6=Sabtu
  const monday = new Date(today); monday.setDate(today.getDate() + (dow === 0 ? -6 : 1 - dow));
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const ymd = d => d.toISOString().slice(0, 10);
  document.getElementById('ps-date-from').value = ymd(monday);
  document.getElementById('ps-date-to').value = ymd(sunday);
}

(async () => {
  const user = await initStaff('pemberian_stok', 'Pemberian Stok', 'inventory');
  if (!user) return;
  setDefaultWeekFilter();
  await loadAll();
})();
</script>
