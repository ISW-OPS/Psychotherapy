<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Knowledge Base</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.kb-card{background:#fff;border:1px solid rgba(60,79,92,.10);border-radius:1rem;}
.kb-catcard{transition:all .15s;cursor:pointer;}
.kb-catcard:hover{border-color:var(--rpm);box-shadow:0 4px 14px rgba(15,46,95,.08);transform:translateY(-1px);}
.kb-row{transition:background .12s;}
.kb-row:hover{background:rgba(60,79,92,.03);}
</style>
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📖</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
<div class="flex min-h-screen">
<aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
<main class="main-content flex-1 min-w-0">
<header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

<div class="p-4 md:p-8 space-y-6">

  <!-- Title + search -->
  <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-ink">Knowledge Hub</h1>
      <p class="text-sm text-ink/55 mt-1">Pusat rujukan dokumen, SOP, latihan dan nota pasukan.</p>
    </div>
    <div class="flex items-center gap-2 w-full lg:w-auto">
      <div class="relative flex-1 lg:w-80">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/40">🔍</span>
        <input id="kb-search" type="text" placeholder="Cari dokumen atau kategori..."
          class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-ink/15 text-sm focus:outline-none focus:border-navy/40 bg-white">
      </div>
      <a href="kb-upload.html" id="btn-upload"
        class="hidden whitespace-nowrap bg-navy text-white px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-navy-dark transition-colors">+ Muat Naik</a>
    </div>
  </div>

  <!-- Stat cards -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3" id="kb-stats"></div>

  <!-- Two-col: categories + recent docs -->
  <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">

    <!-- Categories -->
    <div class="kb-card overflow-hidden">
      <div class="px-6 py-4 border-b border-ink/8 flex items-center justify-between">
        <h3 class="font-semibold text-ink">Kategori</h3>
        <a href="kb-categories.html" class="text-xs text-navy font-semibold hover:underline">Lihat semua →</a>
      </div>
      <div id="kb-cat-grid" class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="col-span-full text-center text-xs text-ink/35 py-8">Memuatkan...</div>
      </div>
    </div>

    <!-- Recent Documents -->
    <div class="kb-card overflow-hidden">
      <div class="px-6 py-4 border-b border-ink/8 flex items-center justify-between">
        <h3 class="font-semibold text-ink">Dokumen Terkini</h3>
        <a href="kb-resources.html" class="text-xs text-navy font-semibold hover:underline">Lihat semua →</a>
      </div>
      <div id="kb-recent" class="divide-y divide-ink/5">
        <div class="text-center text-xs text-ink/35 py-8">Memuatkan...</div>
      </div>
    </div>
  </div>

</div>
</main>
</div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script src="_kb.js"></script>
<script>
function statTile(icon, value, label, color) {
  return `<div class="kb-card p-4 flex items-center gap-3">
    <div class="w-11 h-11 rounded-xl flex items-center justify-center text-xl ${color}">${icon}</div>
    <div><div class="text-2xl font-bold text-ink leading-none">${value}</div>
    <div class="text-[11px] text-ink/55 mt-1">${label}</div></div>
  </div>`;
}

function docRow(r) {
  const t = kbType(r.res_type);
  const cat = r.category;
  const catChip = cat ? `<span class="chip ${kbCatCls(cat.color)} text-[10px]">${kbEsc(cat.name)}</span>` : '';
  const who = r.uploader?.full_name || 'Staf';
  return `<a href="kb-detail.html?id=${r.id}" class="kb-row flex items-center gap-3 px-5 py-3 no-underline">
    <span class="text-xl flex-shrink-0">${t.icon}</span>
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-sm font-semibold text-ink truncate">${kbEsc(r.title)}</span>${catChip}
      </div>
      <div class="text-[11px] text-ink/50 mt-0.5">Dikemaskini oleh ${kbEsc(who)} • ${timeAgo(r.updated_at)}</div>
    </div>
  </a>`;
}

function miniRow(r, right) {
  const t = kbType(r.res_type);
  return `<a href="kb-detail.html?id=${r.id}" class="kb-row flex items-center gap-2.5 px-5 py-2.5 no-underline">
    <span class="text-base flex-shrink-0">${t.icon}</span>
    <span class="text-[13px] font-medium text-ink truncate flex-1">${kbEsc(r.title)}</span>
    <span class="text-[10px] text-ink/45 whitespace-nowrap">${right||''}</span>
  </a>`;
}

async function boot() {
  const u = await initStaff('kb_dashboard', 'Knowledge Base');
  if (!u) return;
  if (kbCanAuthor()) document.getElementById('btn-upload').classList.remove('hidden');

  // Search → resources page
  const s = document.getElementById('kb-search');
  s.addEventListener('keydown', e => {
    if (e.key === 'Enter' && s.value.trim()) location.href = 'kb-resources.html?q=' + encodeURIComponent(s.value.trim());
  });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); s.focus(); }
  });

  const [cats, resources, counts, bm, viewsRaw] = await Promise.all([
    kbCategories().catch(() => []),
    kbResources().catch(() => []),
    kbCategoryCounts().catch(() => ({})),
    kbMyBookmarkIds().catch(() => ({ set: new Set(), pinned: new Set() })),
    window.db.from('psy_kb_views').select('resource_id,viewed_at').eq('user_id', u.id)
      .order('viewed_at', { ascending: false }).limit(6).then(r => r.data || []).catch(() => []),
  ]);

  // Stats
  const newCount = resources.filter(r => (Date.now() - new Date(r.created_at)) < 7 * 864e5).length;
  document.getElementById('kb-stats').innerHTML =
    statTile('📁', resources.length, 'Jumlah Sumber', 'bg-navy-light text-navy') +
    statTile('🕑', viewsRaw.length, 'Baru Dilihat', 'bg-teal/15 text-teal') +
    statTile('🆕', newCount, 'Baru (7 hari)', 'bg-green-light text-green-dark');

  // Categories
  document.getElementById('kb-cat-grid').innerHTML = cats.length
    ? cats.map(c => `<a href="kb-resources.html?cat=${c.id}" class="kb-catcard kb-card p-4 flex items-center gap-3 no-underline">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg ${kbCatCls(c.color)}">${c.icon||'📁'}</div>
        <div class="min-w-0"><div class="text-sm font-semibold text-ink truncate">${kbEsc(c.name)}</div>
        <div class="text-[11px] text-ink/50">${counts[c.id]||0} dokumen</div></div>
      </a>`).join('')
    : '<div class="col-span-full text-center text-xs text-ink/35 py-8">Tiada kategori.</div>';

  // Recent documents (top 6 by updated)
  const recent = resources.slice(0, 6);
  document.getElementById('kb-recent').innerHTML = recent.length
    ? recent.map(docRow).join('')
    : '<div class="text-center text-xs text-ink/35 py-8">Belum ada dokumen. <a href="kb-upload.html" class="text-navy font-semibold">Muat naik →</a></div>';
}
boot();
</script>
</body>
</html>
