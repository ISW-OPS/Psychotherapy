<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Kod Promo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.purple-btn { background: #6366f1; color: white; transition: background .15s; }
.purple-btn:hover { background: #4f46e5; }
</style>
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🏷️</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-5">

        <!-- Page header -->
        <div class="flex items-start justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-2xl font-bold text-ink">Kod Promo</h1>
            <div class="text-sm text-ink/55 mt-0.5">🏷️ Kod diskaun umum untuk kedai — pesakit taip kod ni di cart sebelum bayar.</div>
          </div>
          <button data-rbac="products.create" id="btn-promo-new" onclick="openPromoModal()" class="hidden purple-btn px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-sm">+ Tambah Kod</button>
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-ink/8 bg-ink/[0.015]">
                  <th class="text-left px-5 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Kod</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Diskaun</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Min. Belanja</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Guna</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Tempoh Sah</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Status</th>
                  <th class="text-right px-5 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Tindakan</th>
                </tr>
              </thead>
              <tbody id="promo-body" class="divide-y divide-ink/5"></tbody>
            </table>
          </div>
          <div id="promo-empty-state" class="hidden px-5 py-12 text-center text-sm text-ink/35">Tiada kod promo lagi</div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- ═══ Modal: Tambah/Edit Kod Promo ═══ -->
<div id="promo-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/40" onclick="closePromoModal()"></div>
  <div class="relative bg-white rounded-2xl w-full max-w-md p-6 space-y-4 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between">
      <h3 id="promo-modal-title" class="font-bold text-lg text-ink">Tambah Kod Promo</h3>
      <button onclick="closePromoModal()" class="text-ink/50 text-xl">×</button>
    </div>
    <input type="hidden" id="pf-id">
    <div>
      <label class="text-xs font-semibold text-ink/60">Kod</label>
      <input id="pf-code" type="text" placeholder="RAYA10" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm uppercase">
    </div>
    <div>
      <label class="text-xs font-semibold text-ink/60">Penerangan (opsyenal)</label>
      <input id="pf-desc" type="text" placeholder="Promosi Hari Raya" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs font-semibold text-ink/60">Jenis Diskaun</label>
        <select id="pf-type" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm bg-white">
          <option value="percent">Peratus (%)</option>
          <option value="fixed">Tetap (RM)</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/60">Nilai</label>
        <input id="pf-value" type="number" min="0" step="0.01" placeholder="10" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs font-semibold text-ink/60">Min. Subjumlah (RM)</label>
        <input id="pf-min" type="number" min="0" step="0.01" value="0" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/60">Had Guna Keseluruhan</label>
        <input id="pf-max-uses" type="number" min="1" placeholder="Tiada had" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs font-semibold text-ink/60">Had Guna / Pesakit</label>
        <input id="pf-max-per-patient" type="number" min="1" value="1" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
      </div>
      <div class="flex items-end pb-2">
        <label class="flex items-center gap-2 text-sm">
          <input id="pf-active" type="checkbox" checked class="accent-[#6366f1]"> Aktif
        </label>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs font-semibold text-ink/60">Sah Dari</label>
        <input id="pf-from" type="date" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/60">Sah Hingga</label>
        <input id="pf-until" type="date" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
      </div>
    </div>
    <button onclick="savePromoCode()" class="w-full purple-btn py-2.5 rounded-xl text-sm font-semibold mt-2">Simpan Kod Promo</button>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtRM(n) { return 'RM ' + Number(n||0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

let allPromoCodes = [];

function promoStatusBadge(p) {
  const today = new Date().toISOString().slice(0, 10);
  const expired = p.valid_until && p.valid_until < today;
  const maxedOut = p.max_uses != null && p.used_count >= p.max_uses;
  if (!p.is_active) return `<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-ink/8 text-ink/55">● Tidak Aktif</span>`;
  if (expired) return `<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-red-50 text-red-600">● Luput</span>`;
  if (maxedOut) return `<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-700">● Habis Had</span>`;
  return `<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700">● Aktif</span>`;
}

function renderPromoTable() {
  const tbody = document.getElementById('promo-body');
  const empty = document.getElementById('promo-empty-state');
  if (!allPromoCodes.length) {
    tbody.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  tbody.innerHTML = allPromoCodes.map(p => {
    const discountLabel = p.discount_type === 'percent' ? `${Number(p.discount_value)}%` : fmtRM(p.discount_value);
    const usageLabel = `${p.used_count || 0}${p.max_uses != null ? ' / ' + p.max_uses : ''}`;
    const period = (p.valid_from || p.valid_until)
      ? `${p.valid_from || '—'} → ${p.valid_until || '—'}` : 'Tiada had';
    return `<tr class="hover:bg-ink/[0.01]">
      <td class="px-5 py-3 font-bold text-ink">${escHtml(p.code)}${p.description ? `<div class="text-[11px] font-normal text-ink/45 mt-0.5">${escHtml(p.description)}</div>` : ''}</td>
      <td class="px-3 py-3">${discountLabel}</td>
      <td class="px-3 py-3">${fmtRM(p.min_subtotal)}</td>
      <td class="px-3 py-3">${usageLabel}</td>
      <td class="px-3 py-3 text-xs text-ink/60">${period}</td>
      <td class="px-3 py-3">${promoStatusBadge(p)}</td>
      <td class="px-5 py-3 text-right">
        <div class="inline-flex items-center gap-1">
          <button data-rbac="products.edit" onclick="openPromoModal('${p.id}')" class="w-8 h-8 flex items-center justify-center border border-ink/15 rounded-lg hover:bg-ink/5" title="Edit">✏️</button>
          <button data-rbac="products.edit" onclick="togglePromoActive('${p.id}')" class="w-8 h-8 flex items-center justify-center border border-ink/15 rounded-lg hover:bg-ink/5" title="${p.is_active ? 'Nyahaktif' : 'Aktifkan'}">${p.is_active ? '⏸️' : '▶️'}</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function loadPromoCodes() {
  const { data, error } = await window.db.from('psy_promo_codes').select('*').order('created_at', { ascending: false });
  if (error) { banner('Gagal load kod promo: ' + error.message, 'error'); return; }
  allPromoCodes = data || [];
  renderPromoTable();
}

function openPromoModal(id) {
  const p = id ? allPromoCodes.find(x => x.id === id) : null;
  document.getElementById('promo-modal-title').textContent = p ? 'Edit Kod Promo' : 'Tambah Kod Promo';
  document.getElementById('pf-id').value = p?.id || '';
  document.getElementById('pf-code').value = p?.code || '';
  document.getElementById('pf-desc').value = p?.description || '';
  document.getElementById('pf-type').value = p?.discount_type || 'percent';
  document.getElementById('pf-value').value = p?.discount_value ?? '';
  document.getElementById('pf-min').value = p?.min_subtotal ?? 0;
  document.getElementById('pf-max-uses').value = p?.max_uses ?? '';
  document.getElementById('pf-max-per-patient').value = p?.max_uses_per_patient ?? 1;
  document.getElementById('pf-active').checked = p ? !!p.is_active : true;
  document.getElementById('pf-from').value = p?.valid_from || '';
  document.getElementById('pf-until').value = p?.valid_until || '';
  document.getElementById('promo-modal').classList.remove('hidden');
}

function closePromoModal() { document.getElementById('promo-modal').classList.add('hidden'); }

async function savePromoCode() {
  const id = document.getElementById('pf-id').value || null;
  const code = document.getElementById('pf-code').value.trim().toUpperCase();
  const value = Number(document.getElementById('pf-value').value);
  if (!code) { banner('Sila isi kod promo', 'error'); return; }
  if (!(value > 0)) { banner('Sila isi nilai diskaun', 'error'); return; }

  const payload = {
    code,
    description: document.getElementById('pf-desc').value.trim() || null,
    discount_type: document.getElementById('pf-type').value,
    discount_value: value,
    min_subtotal: Number(document.getElementById('pf-min').value) || 0,
    max_uses: document.getElementById('pf-max-uses').value ? Number(document.getElementById('pf-max-uses').value) : null,
    max_uses_per_patient: document.getElementById('pf-max-per-patient').value ? Number(document.getElementById('pf-max-per-patient').value) : null,
    is_active: document.getElementById('pf-active').checked,
    valid_from: document.getElementById('pf-from').value || null,
    valid_until: document.getElementById('pf-until').value || null,
    updated_at: new Date().toISOString(),
  };

  try {
    if (id) {
      const { error } = await window.db.from('psy_promo_codes').update(payload).eq('id', id);
      if (error) throw error;
      banner('Kod promo dikemaskini ✅');
    } else {
      const uid = (await window.db.auth.getUser()).data.user?.id || null;
      const { error } = await window.db.from('psy_promo_codes').insert({ ...payload, created_by: uid });
      if (error) throw error;
      banner('Kod promo ditambah ✅');
    }
    closePromoModal();
    await loadPromoCodes();
  } catch (e) {
    banner('Ralat: ' + (e.message.includes('duplicate') ? 'Kod ini sudah wujud' : e.message), 'error');
  }
}

async function togglePromoActive(id) {
  const p = allPromoCodes.find(x => x.id === id);
  if (!p) return;
  try {
    const { error } = await window.db.from('psy_promo_codes').update({ is_active: !p.is_active, updated_at: new Date().toISOString() }).eq('id', id);
    if (error) throw error;
    p.is_active = !p.is_active;
    banner(p.is_active ? 'Kod diaktifkan ✅' : 'Kod dinyahaktifkan ⛔');
    renderPromoTable();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

(async () => {
  const user = await initStaff('promo_codes', 'Kod diskaun kedai', 'psy_products');
  if (!user) return;
  if (can('products','create')) document.getElementById('btn-promo-new').classList.remove('hidden');
  await loadPromoCodes();
})();
</script>
</body>
</html>
