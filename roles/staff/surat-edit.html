<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Edit Templat Surat</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📄</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <!-- Sticky action bar with title -->
      <div class="sticky top-[68px] z-10 bg-cream/90 backdrop-blur-sm border-b border-ink/10 px-4 md:px-8 py-3 flex items-center justify-between gap-4">
        <h2 id="page-title-text" class="text-base md:text-lg font-bold text-ink truncate">Tambah Templat Baru</h2>
        <div class="flex items-center gap-2 flex-shrink-0">
          <button onclick="cancelEdit()" class="border border-ink/20 text-ink/60 px-4 py-2 rounded-lg text-sm hover:bg-ink/5">Batal</button>
          <button onclick="previewTpl()" class="border border-ink/20 text-ink/70 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-ink/5">Preview</button>
          <button onclick="saveTpl()" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark">Simpan</button>
        </div>
      </div>

      <div class="p-4 md:p-8 max-w-[1200px] mx-auto">

        <!-- Form -->
        <div class="space-y-8">

          <!-- Section: Meta -->
          <section class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-[1fr_200px] gap-4">
              <div>
                <label class="text-xs font-semibold text-ink/60 mb-1 block">Nama Templat <span class="text-terracotta">*</span></label>
                <input id="tpl-name" type="text" placeholder="cth: Surat Permohonan KWSP" class="w-full bg-white border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none">
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/60 mb-1 block">Kategori <span class="text-terracotta">*</span></label>
                <select id="tpl-category" class="w-full bg-white border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none">
                  <option value="patient">Untuk Pesakit</option>
                  <option value="internal">Kegunaan Dalaman</option>
                </select>
              </div>
            </div>

            <div>
              <label class="text-xs font-semibold text-ink/60 mb-1 block">Description</label>
              <input id="tpl-desc" type="text" placeholder="Penerangan ringkas templat ini" class="w-full bg-white border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none">
            </div>
          </section>

          <hr class="border-ink/10">

          <!-- Section: Recipient + Title -->
          <section class="space-y-4">
            <div>
              <label class="text-xs font-semibold text-ink/60 mb-1 block">Kepada (Recipient)</label>
              <textarea id="tpl-recipient" rows="5" placeholder="cth: Pengurus Besar,&#10;Kumpulan Wang Simpanan Pekerja (KWSP),&#10;Jalan Raja Laut,&#10;Kuala Lumpur." class="w-full bg-white border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none resize-y"></textarea>
            </div>

            <div>
              <label class="text-xs font-semibold text-ink/60 mb-1 block">Tajuk Surat</label>
              <input id="tpl-title" type="text" placeholder="cth: PERMOHONAN PENGELUARAN AHLI KWSP" class="w-full bg-white border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none">
            </div>
          </section>

          <hr class="border-ink/10">

          <!-- Section: Body -->
          <section>
            <label class="text-xs font-semibold text-ink/60 mb-1 block">Isi Surat <span class="text-terracotta">*</span></label>
            <p class="text-[11px] text-ink/50 mb-2">Klik tag di palette kanan untuk insert ke kursor. Atau taip <code class="bg-ink/5 px-1 rounded">[NAMA]</code> manual.</p>

            <div class="grid grid-cols-1 lg:grid-cols-[1fr_280px] gap-4">
              <textarea id="tpl-body" rows="18" placeholder="Pihak kami memohon untuk pesakit [NAMA] dengan No. K/P [IC]..." class="w-full bg-white border border-ink/20 rounded-lg px-3 py-2 text-sm font-mono focus:border-navy outline-none resize-y" style="min-height:380px"></textarea>

              <!-- Insert Palette -->
              <div class="bg-white rounded-lg border border-ink/10 p-3 max-h-[440px] overflow-y-auto">
                <div class="flex items-center gap-1 mb-2">
                  <button onclick="setPalTab('all')"      id="pal-t-all"     class="pal-tab active">Semua</button>
                  <button onclick="setPalTab('patient')"  id="pal-t-patient" class="pal-tab">Patient</button>
                  <button onclick="setPalTab('staff')"    id="pal-t-staff"   class="pal-tab">Staff</button>
                  <button onclick="setPalTab('manual')"   id="pal-t-manual"  class="pal-tab">Manual</button>
                </div>
                <div id="palette-list" class="space-y-1"></div>
              </div>
            </div>
          </section>

          <hr class="border-ink/10">

          <!-- Section: Fields -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <!-- Field Manual -->
            <section>
              <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-ink/10">
                <label class="text-[11px] font-semibold text-ink/45 uppercase tracking-wider">Field Manual <span class="text-ink/40 font-normal normal-case">(staff isi)</span></label>
                <button onclick="addField()" class="text-xs font-semibold text-navy hover:underline">+ Tambah</button>
              </div>
              <p class="text-[11px] text-ink/50 mb-2">Klik <code class="bg-ink/5 px-1 rounded">[KEY]</code> untuk insert ke body.</p>
              <div id="fields-list" class="space-y-1.5 max-h-[340px] overflow-y-auto pr-1 -mr-1"></div>
            </section>

            <!-- Auto Field -->
            <section>
              <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-ink/10 gap-2 flex-wrap">
                <label class="text-[11px] font-semibold text-ink/45 uppercase tracking-wider">Auto Field <span class="text-ink/40 font-normal normal-case">(global)</span></label>
                <div class="flex gap-3">
                  <button onclick="resetAutoFields()" class="text-xs font-semibold text-terracotta hover:underline">Reset</button>
                  <button onclick="openAutoFieldForm()" class="text-xs font-semibold text-navy hover:underline">+ Tambah</button>
                </div>
              </div>
              <p class="text-[11px] text-ink/50 mb-2">Klik tag untuk insert. Auto-isi dari DB semasa generate.</p>

              <div class="flex items-center gap-2 mb-2 flex-wrap">
                <input id="af-search" type="text" oninput="renderAutoFieldsList()" placeholder="Cari..." class="bg-white border border-ink/20 rounded px-2 py-1 text-xs flex-1 min-w-[100px] focus:border-navy outline-none">
                <div class="flex gap-1">
                  <button onclick="setAfFilter('all')"     id="af-f-all"     class="af-filter active">Semua</button>
                  <button onclick="setAfFilter('patient')" id="af-f-patient" class="af-filter">Patient</button>
                  <button onclick="setAfFilter('staff')"   id="af-f-staff"   class="af-filter">Staff</button>
                  <button onclick="setAfFilter('system')"  id="af-f-system"  class="af-filter">Sys</button>
                </div>
              </div>
              <div id="auto-fields-list" class="space-y-1 max-h-[340px] overflow-y-auto pr-1 -mr-1"></div>
            </section>

          </div>

        </div>

      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Auto Field Modal -->
<div id="af-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
    <div class="px-6 py-4 border-b border-ink/10 flex items-center justify-between">
      <h3 id="af-title" class="font-bold text-base">Tambah Auto Field</h3>
      <button onclick="closeAutoFieldForm()" class="text-ink/40 hover:text-ink text-2xl leading-none">&times;</button>
    </div>
    <div class="p-6 space-y-3">
      <div>
        <label class="text-xs font-semibold text-ink/60 mb-1 block">Key (untuk dalam templat) <span class="text-terracotta">*</span></label>
        <input id="af-key" type="text" placeholder="cth: BMI" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm font-mono uppercase focus:border-navy outline-none">
        <p class="text-[10px] text-ink/40 mt-1">Akan jadi <code class="bg-ink/5 px-1 rounded">[KEY]</code> dalam templat. Huruf besar &amp; underscore sahaja.</p>
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/60 mb-1 block">Label (yang muncul dalam palette) <span class="text-terracotta">*</span></label>
        <input id="af-label" type="text" placeholder="cth: BMI Patient" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none">
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/60 mb-1 block">Sumber Data <span class="text-terracotta">*</span></label>
        <select id="af-source" onchange="updateDataPathHint()" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none">
          <option value="patient">Patient</option>
          <option value="staff">Staff (yang sign)</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/60 mb-1 block">Nama Column DB <span class="text-terracotta">*</span></label>
        <input id="af-path" type="text" placeholder="cth: bmi atau address" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm font-mono focus:border-navy outline-none">
        <p id="af-hint" class="text-[10px] text-ink/40 mt-1"></p>
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/60 mb-1 block">Format (optional)</label>
        <select id="af-format" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none">
          <option value="">— Tiada (text biasa) —</option>
          <option value="date">Date (cth: 18 Mei 2026)</option>
          <option value="currency">Currency (cth: RM 100.00)</option>
        </select>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-ink/10 flex gap-3">
      <button onclick="closeAutoFieldForm()" class="flex-1 border border-ink/20 text-ink/60 py-2.5 rounded-xl text-sm">Batal</button>
      <button onclick="saveAutoField()" class="flex-1 bg-navy text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-navy-dark">Simpan</button>
    </div>
  </div>
</div>

<style>
.tag-btn { width: 100%; text-align: left; padding: 6px 10px; background: rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.08); border-radius: 6px; font-size: 12px; cursor: pointer; transition: all .12s; line-height: 1.3; }
.tag-btn:hover { background: #1e3a5f; color: white; border-color: #1e3a5f; }
.tag-btn .code { display: block; font-family: monospace; font-size: 10px; opacity: 0.6; margin-top: 2px; }
.af-filter { padding: 3px 8px; font-size: 11px; font-weight: 600; color: rgba(0,0,0,0.5); border: 1px solid rgba(0,0,0,0.12); border-radius: 9999px; background: white; transition: all .12s; }
.af-filter:hover { background: rgba(0,0,0,0.04); }
.af-filter.active { background: #1e3a5f; color: white; border-color: #1e3a5f; }
.pal-tab { padding: 3px 8px; font-size: 10px; font-weight: 600; color: rgba(0,0,0,0.5); border-radius: 6px; background: transparent; transition: all .12s; flex: 1; }
.pal-tab:hover { background: rgba(0,0,0,0.04); }
.pal-tab.active { background: #1e3a5f; color: white; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/letterTemplates.js"></script>
<script src="_shared.js"></script>
<script>
const LOGO_URL = '../../image/Logo_ISW.png';
const params = new URLSearchParams(location.search);
const editId = params.get('id');

let editingFields = [];

function isAdmin() { return window.currentUser?.staff_role === 'admin'; }

async function loadTemplate() {
  if (!editId) {
    document.getElementById('page-title-text').textContent = 'Tambah Templat Baru';
    editingFields = [];
    renderFieldsList();
    renderPalettes();
    return;
  }
  const { data } = await window.db.from('psy_letter_templates').select('*').eq('id', editId).limit(1);
  const tpl = data?.[0];
  if (!tpl) { banner('Templat tidak ditemui', 'error'); setTimeout(() => location.href = 'surat.html', 1500); return; }
  document.getElementById('page-title-text').textContent = 'Edit: ' + tpl.name;
  document.getElementById('tpl-name').value = tpl.name || '';
  document.getElementById('tpl-category').value = tpl.category || 'patient';
  document.getElementById('tpl-desc').value = tpl.description || '';
  document.getElementById('tpl-recipient').value = tpl.recipient || '';
  document.getElementById('tpl-title').value = tpl.title || '';
  document.getElementById('tpl-body').value = tpl.body || '';
  editingFields = Array.isArray(tpl.fields) ? JSON.parse(JSON.stringify(tpl.fields)) : [];
  renderFieldsList();
  renderPalettes();
}

// ── Insert Palette (di sebelah body editor) ──────────────
let palTab = 'all';
function setPalTab(t) {
  palTab = t;
  ['all','patient','staff','manual'].forEach(k =>
    document.getElementById('pal-t-' + k).classList.toggle('active', k === t));
  renderPalettes();
}

function renderPalettes() {
  const list = document.getElementById('palette-list');
  if (!list) return;
  let items = [];
  if (palTab === 'all') {
    items = [...AUTO_FIELDS, ...editingFields.map(f => ({ ...f, isManual: true }))];
  } else if (palTab === 'manual') {
    items = editingFields.map(f => ({ ...f, isManual: true }));
  } else {
    items = AUTO_FIELDS.filter(f => f.source === palTab);
  }
  if (!items.length) {
    list.innerHTML = '<div class="text-[10px] text-ink/40 italic text-center py-3">Tiada</div>';
    return;
  }
  list.innerHTML = items.map(f => {
    const srcColor = f.isManual ? 'bg-amber-100 text-amber-700'
                   : f.source === 'patient' ? 'bg-blue-100 text-blue-700'
                   : f.source === 'staff'   ? 'bg-purple-100 text-purple-700'
                   :                          'bg-gray-100 text-gray-700';
    const srcLabel = f.isManual ? 'M' : f.source.charAt(0).toUpperCase();
    const label = (f.label || f.key || '').replace(/</g,'&lt;');
    return `<button onclick="insertTag('${f.key}')" class="w-full flex items-center gap-2 px-2 py-1.5 rounded text-left hover:bg-cream/60 transition group">
      <span class="text-[9px] font-mono font-bold ${srcColor} px-1.5 py-0.5 rounded flex-shrink-0">${srcLabel}</span>
      <span class="flex-1 min-w-0 text-xs truncate">${label}</span>
      <span class="text-[9px] font-mono text-ink/40 group-hover:text-navy">[${f.key}]</span>
    </button>`;
  }).join('');
}

function insertTag(key) {
  const ta = document.getElementById('tpl-body');
  const pos = ta.selectionStart;
  const tag = `[${key}]`;
  ta.value = ta.value.slice(0, pos) + tag + ta.value.slice(ta.selectionEnd);
  ta.focus();
  ta.setSelectionRange(pos + tag.length, pos + tag.length);
}

function renderFieldsList() {
  const list = document.getElementById('fields-list');
  if (!editingFields.length) {
    list.innerHTML = '<div class="text-xs text-ink/40 italic p-3 bg-cream/30 rounded-lg">Tiada field manual. Auto-fields (NAMA, IC, dll) boleh terus guna dalam body.</div>';
    return;
  }
  list.innerHTML = editingFields.map((f, i) => `
    <div class="bg-cream/30 px-2 py-1.5 rounded space-y-1">
      <div class="flex items-center gap-1.5">
        <button onclick="insertTag('${f.key}')" title="Insert ke body" class="text-xs font-mono uppercase text-navy hover:bg-navy hover:text-white px-2 py-1 border border-navy/30 rounded transition flex-shrink-0">[${(f.key || '?').replace(/</g,'&lt;')}]</button>
        <input type="text" value="${(f.label || '').replace(/"/g,'&quot;')}" placeholder="Label" oninput="updField(${i},'label',this.value)" class="border border-ink/20 rounded px-2 py-1 text-xs flex-1 min-w-0">
        <select onchange="updField(${i},'type',this.value)" class="border border-ink/20 rounded px-1.5 py-1 text-xs flex-shrink-0">
          <option value="text"     ${f.type==='text'?'selected':''}>Text</option>
          <option value="number"   ${f.type==='number'?'selected':''}>Number</option>
          <option value="date"     ${f.type==='date'?'selected':''}>Date</option>
          <option value="textarea" ${f.type==='textarea'?'selected':''}>Long</option>
        </select>
        <button onclick="rmField(${i})" title="Buang" class="text-ink/50 hover:text-terracotta text-xs flex-shrink-0">Buang</button>
      </div>
      <input type="text" value="${(f.key || '').replace(/"/g,'&quot;')}" placeholder="KEY (uppercase, no spaces)" oninput="updField(${i},'key',this.value)" class="w-full border border-ink/20 rounded px-2 py-1 text-[10px] font-mono uppercase text-ink/60">
    </div>`).join('');
}

function updField(i, prop, val) {
  if (prop === 'key') val = val.replace(/[^A-Z0-9_]/gi, '_').toUpperCase();
  editingFields[i][prop] = val;
  if (prop === 'key' || prop === 'label') renderPalettes();
}
function addField() {
  editingFields.push({ key: 'FIELD_' + (editingFields.length + 1), label: 'Field Baru', type: 'text' });
  renderFieldsList(); renderPalettes();
}
function rmField(i) {
  if (!confirm('Buang field ini?')) return;
  editingFields.splice(i, 1); renderFieldsList(); renderPalettes();
}

// ── Custom Auto-Fields ───────────────────────────────────────
let editingAutoFieldId = null;

const PATIENT_COLS = ['address','dob','gender','race','religion','occupation','email','status','active_package_id','package_purchased_at','package_expires_at','kob_status','weight_kg','height_cm','bmi'];
const STAFF_COLS = ['full_name','staff_role','role','registration_no','specialization','phone','email'];

let afFilter = 'all';
function setAfFilter(f) {
  afFilter = f;
  ['all','patient','staff','system'].forEach(k =>
    document.getElementById('af-f-' + k).classList.toggle('active', k === f));
  renderAutoFieldsList();
}

function renderAutoFieldsList() {
  const list = document.getElementById('auto-fields-list');
  const search = (document.getElementById('af-search')?.value || '').toLowerCase().trim();
  let items = AUTO_FIELDS;
  if (afFilter !== 'all') items = items.filter(f => f.source === afFilter);
  if (search) items = items.filter(f =>
    f.key.toLowerCase().includes(search) ||
    (f.label || '').toLowerCase().includes(search) ||
    (f.data_path || '').toLowerCase().includes(search)
  );

  if (!items.length) {
    list.innerHTML = '<div class="col-span-full text-xs text-ink/40 italic text-center py-6">Tiada auto-field yang sepadan.</div>';
    return;
  }
  list.innerHTML = items.map(f => {
    const srcColor = f.source === 'patient' ? 'bg-blue-100 text-blue-700'
                   : f.source === 'staff'   ? 'bg-purple-100 text-purple-700'
                   :                          'bg-gray-100 text-gray-700';
    return `<div class="flex items-center gap-2 bg-cream/30 hover:bg-cream/50 transition px-2 py-1.5 rounded">
      <div class="text-[10px] font-mono uppercase px-1.5 py-0.5 ${srcColor} rounded flex-shrink-0" title="${f.source}">${f.source.charAt(0).toUpperCase()}</div>
      <button onclick="insertTag('${f.key}')" title="Klik untuk insert ke body" class="flex-1 min-w-0 text-left cursor-pointer">
        <div class="text-xs font-semibold truncate text-ink hover:text-navy transition">${(f.label || '').replace(/</g,'&lt;')}</div>
        <div class="text-[10px] text-ink/45 font-mono truncate">[${f.key}]${f.format_type ? ` · ${f.format_type}` : ''}</div>
      </button>
      <button onclick="editAutoField('${f.custom_id}')" title="Edit" class="text-ink/50 hover:text-navy text-[11px] flex-shrink-0">Edit</button>
      <button onclick="deleteAutoField('${f.custom_id}')" title="Buang" class="text-ink/50 hover:text-terracotta text-[11px] flex-shrink-0">Buang</button>
    </div>`;
  }).join('');
}

function openAutoFieldForm() {
  editingAutoFieldId = null;
  document.getElementById('af-title').textContent = 'Tambah Auto Field';
  document.getElementById('af-key').value = '';
  document.getElementById('af-label').value = '';
  document.getElementById('af-source').value = 'patient';
  document.getElementById('af-path').value = '';
  document.getElementById('af-format').value = '';
  updateDataPathHint();
  document.getElementById('af-modal').classList.remove('hidden');
}

function editAutoField(id) {
  const f = AUTO_FIELDS.find(x => x.custom_id === id);
  if (!f) return;
  editingAutoFieldId = id;
  document.getElementById('af-title').textContent = 'Edit Auto Field';
  document.getElementById('af-key').value = f.key;
  document.getElementById('af-label').value = f.label;
  document.getElementById('af-source').value = f.source;
  document.getElementById('af-path').value = f.data_path;
  document.getElementById('af-format').value = f.format_type || '';
  updateDataPathHint();
  document.getElementById('af-modal').classList.remove('hidden');
}

function closeAutoFieldForm() {
  document.getElementById('af-modal').classList.add('hidden');
  editingAutoFieldId = null;
}

function updateDataPathHint() {
  const src = document.getElementById('af-source').value;
  const cols = src === 'patient' ? PATIENT_COLS : STAFF_COLS;
  document.getElementById('af-hint').innerHTML = 'Cadangan column: <code class="bg-ink/5 px-1 rounded">' + cols.join('</code> <code class="bg-ink/5 px-1 rounded">') + '</code>';
}

async function saveAutoField() {
  const key = document.getElementById('af-key').value.trim().toUpperCase().replace(/[^A-Z0-9_]/g, '_');
  const label = document.getElementById('af-label').value.trim();
  const source = document.getElementById('af-source').value;
  const data_path = document.getElementById('af-path').value.trim();
  const format_type = document.getElementById('af-format').value || null;

  if (!key || !label || !data_path) { banner('Sila isi semua field wajib', 'error'); return; }
  // Check key clash with hardcoded defaults
  const defaultKeys = DEFAULT_AUTO_FIELDS.map(f => f.key);
  if (defaultKeys.includes(key) && !editingAutoFieldId) { banner('Key tu dah ada sebagai default field', 'error'); return; }

  try {
    if (editingAutoFieldId) {
      await window.db.from('psy_letter_auto_fields').update({
        key, label, source, data_path, format_type, updated_at: new Date().toISOString(),
      }).eq('id', editingAutoFieldId);
    } else {
      await window.db.from('psy_letter_auto_fields').insert({
        key, label, source, data_path, format_type,
        created_by: window.currentUser.id,
        created_by_name: window.currentUser.full_name,
      });
    }
    banner('Auto-field disimpan');
    closeAutoFieldForm();
    await loadCustomAutoFields();
    renderAutoFieldsList();
    renderPalettes();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

async function deleteAutoField(id) {
  if (!confirm('Buang auto-field ini? Templat yang guna placeholder ni akan jadi kosong.')) return;
  try {
    await window.db.from('psy_letter_auto_fields').delete().eq('id', id);
    banner('Auto-field dibuang');
    await loadCustomAutoFields();
    renderAutoFieldsList();
    renderPalettes();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

async function resetAutoFields() {
  if (!confirm('Reset Default akan tambah balik auto-field default yang dah dibuang. Custom field anda tak akan terjejas. Teruskan?')) return;
  try {
    // Insert defaults yang tak wujud (ON CONFLICT do nothing)
    const existingKeys = new Set(AUTO_FIELDS.map(f => f.key));
    const toInsert = DEFAULT_AUTO_FIELDS_SEED.filter(f => !existingKeys.has(f.key));
    if (!toInsert.length) { banner('Semua default fields dah ada'); return; }
    const { error } = await window.db.from('psy_letter_auto_fields').insert(toInsert);
    if (error) throw error;
    banner(`${toInsert.length} default field restored`);
    await loadCustomAutoFields();
    renderAutoFieldsList();
    renderPalettes();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

function collect() {
  const name = document.getElementById('tpl-name').value.trim();
  if (!name) { banner('Nama wajib diisi', 'error'); return null; }
  const body = document.getElementById('tpl-body').value;
  if (!body.trim()) { banner('Isi surat wajib diisi', 'error'); return null; }
  const keys = editingFields.map(f => f.key);
  if (keys.some(k => !k)) { banner('Setiap field perlu KEY', 'error'); return null; }
  if (new Set(keys).size !== keys.length) { banner('Field KEY mesti unik', 'error'); return null; }
  return {
    name,
    category:    document.getElementById('tpl-category').value || 'patient',
    description: document.getElementById('tpl-desc').value.trim(),
    recipient:   document.getElementById('tpl-recipient').value.trim(),
    title:       document.getElementById('tpl-title').value.trim(),
    body,
    fields:      editingFields,
  };
}

function previewTpl() {
  const tpl = collect();
  if (!tpl) return;
  const dummyValues = {};
  AUTO_FIELDS.forEach(f => dummyValues[f.key] = '[' + f.label + ']');
  editingFields.forEach(f => dummyValues[f.key] = '[' + (f.label || f.key) + ']');
  const html = renderLetterFull({
    logoUrl: LOGO_URL, template: tpl, values: dummyValues,
    refNumber: 'ISW/PREVIEW/0001',
    signerName: '[Nama Staff]', signerRole: '[Jawatan]', signatureDataUrl: null,
  });
  openLetterTab(html, 'Preview — ' + tpl.name);
}

async function saveTpl() {
  if (!isAdmin()) { banner('Hanya admin', 'error'); return; }
  const tpl = collect();
  if (!tpl) return;
  try {
    if (editId) {
      await window.db.from('psy_letter_templates').update({
        ...tpl, updated_at: new Date().toISOString(),
      }).eq('id', editId);
    } else {
      await window.db.from('psy_letter_templates').insert({
        ...tpl,
        created_by: window.currentUser.id,
        created_by_name: window.currentUser.full_name,
      });
    }
    banner('Templat disimpan');
    setTimeout(() => location.href = 'surat.html', 700);
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

function cancelEdit() {
  if (confirm('Batal & buang perubahan?')) location.href = 'surat.html';
}

(async () => {
  const user = await initStaff('surat', editId ? 'Edit templat surat' : 'Tambah templat surat baru');
  if (!user) return;
  if (!isAdmin()) { banner('Hanya admin boleh edit templat', 'error'); setTimeout(() => location.href = 'surat.html', 1500); return; }
  setHeaderBack('surat.html', 'Kembali ke Senarai Surat');
  await loadCustomAutoFields();
  await loadTemplate();
  renderAutoFieldsList();
})();
