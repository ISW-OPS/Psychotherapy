<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Edit Pakej</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📦</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-5">

        <input id="edit-id" type="hidden">

        <!-- Action bar -->
        <div class="flex items-center justify-end gap-2">
          <button onclick="window.location.href='pakej.html'" class="px-4 py-2 border border-ink/20 rounded-lg text-sm text-ink/70 hover:bg-ink/5 transition-colors">Batal</button>
          <button id="btn-save" onclick="savePackage()" class="bg-navy text-white px-6 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark transition-colors">Simpan Pakej</button>
        </div>

        <!-- Top 2-col: basic info (left) + image & contents (right) -->
        <div class="grid md:grid-cols-2 gap-5">

          <!-- LEFT: basic info -->
          <div class="space-y-3">
            <div class="grid grid-cols-[120px_1fr] gap-3">
              <div>
                <label class="text-xs font-semibold text-ink/70">Package ID</label>
                <input id="f-pkg-id" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm bg-ink/5 text-ink/50 font-mono tracking-wide" readonly>
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/70">Nama Pakej <span class="text-terracotta">*</span></label>
                <input id="f-name" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:outline-none focus:border-navy" placeholder="cth: OBP 1 — Program Holistik 12 Minggu">
              </div>
            </div>
            <div>
              <label class="text-xs font-semibold text-ink/70">Keterangan Ringkas</label>
              <input id="f-desc" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm focus:outline-none focus:border-navy" placeholder="cth: 12 minggu · 6 KG IB + full terapi BPS-S">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold text-ink/70">Harga (RM)</label>
                <div class="mt-1 relative">
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-ink/40">RM</span>
                  <input id="f-price" type="number" step="0.01" class="w-full pl-9 pr-3 py-2 border border-ink/20 rounded-lg text-sm focus:outline-none focus:border-navy" placeholder="0.00">
                </div>
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/70">Tempoh</label>
                <div class="mt-1 grid grid-cols-[1fr_auto] gap-2">
                  <input id="f-weeks" type="number" min="1" class="w-full px-3 py-2 border border-ink/20 rounded-lg text-sm focus:outline-none focus:border-navy" placeholder="12">
                  <select id="f-duration-unit" onchange="renderCoachingScheduleEditor(true)" class="px-3 py-2 border border-ink/20 rounded-lg text-sm bg-white focus:outline-none focus:border-navy">
                    <option value="week">Minggu</option>
                    <option value="day">Hari</option>
                  </select>
                </div>
              </div>
            </div>
            <div>
              <label class="text-xs font-semibold text-ink/70">Jadual Kunjungan</label>
              <div class="mt-1 flex gap-2 items-center flex-wrap">
                <select id="f-sched-type" onchange="updateSchedUI()" class="px-3 py-2 border border-ink/20 rounded-lg text-sm flex-1 min-w-40 bg-white focus:outline-none focus:border-navy">
                  <option value="">— Pilih jenis jadual —</option>
                  <option value="harian">Harian (datang setiap hari)</option>
                  <option value="mingguan">Mingguan</option>
                  <option value="bulanan">Bulanan</option>
                  <option value="x_bulan">Setiap beberapa bulan</option>
                </select>
                <div id="sched-val-wrap" style="display:none" class="items-center gap-2">
                  <input id="f-sched-val" type="number" min="1" max="31" value="1" oninput="updateSchedSummary()" class="w-16 px-3 py-2 border border-ink/20 rounded-lg text-sm text-center focus:outline-none focus:border-navy">
                  <span id="sched-unit-lbl" class="text-xs text-ink/60 whitespace-nowrap"></span>
                </div>
              </div>
              <div id="sched-summary" style="display:none" class="mt-1.5 text-xs text-navy font-semibold bg-navy/5 rounded-lg px-3 py-1.5"></div>
            </div>
            <!-- Gambar -->
            <div>
              <label class="text-xs font-semibold text-ink/70">Gambar Pakej</label>
              <div class="mt-2 flex items-start gap-3">
                <div id="pkg-img-preview" class="w-20 h-20 rounded-xl border-2 border-dashed border-ink/20 flex items-center justify-center bg-cream/50 overflow-hidden flex-shrink-0 text-2xl text-ink/30 cursor-pointer hover:border-navy transition-colors" onclick="document.getElementById('f-image').click()" title="Klik untuk pilih gambar">📷</div>
                <div class="flex-1 min-w-0">
                  <input id="f-image" type="file" accept="image/*" onchange="previewPkgImage(this)" class="hidden">
                  <input id="f-image-url" type="hidden">
                  <input id="f-image-raw" type="hidden">
                  <button type="button" onclick="document.getElementById('f-image').click()" class="px-3 py-1.5 bg-navy/8 border border-navy/20 rounded-lg text-xs font-semibold text-navy hover:bg-navy hover:text-white transition-colors">Pilih Gambar</button>
                  <p class="text-[10px] text-ink/40 mt-1">JPG, PNG · maks 10MB · 16:9 disyorkan</p>
                  <div id="pkg-image-editor" class="hidden mt-2 rounded-xl border border-ink/10 bg-cream/40 p-3 space-y-2">
                    <div class="aspect-video rounded-lg overflow-hidden bg-white border border-ink/10">
                      <img id="pkg-crop-preview" class="w-full h-full object-cover" alt="Preview">
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                      <label class="text-[10px] font-semibold text-ink/60 uppercase tracking-wide">Zum <input id="pkg-crop-zoom" type="range" min="1" max="3" step="0.05" value="1" oninput="renderPkgImageCrop()" class="w-full mt-1"></label>
                      <label class="text-[10px] font-semibold text-ink/60 uppercase tracking-wide">Kiri/Kanan <input id="pkg-crop-x" type="range" min="-100" max="100" step="1" value="0" oninput="renderPkgImageCrop()" class="w-full mt-1"></label>
                      <label class="text-[10px] font-semibold text-ink/60 uppercase tracking-wide">Atas/Bawah <input id="pkg-crop-y" type="range" min="-100" max="100" step="1" value="0" oninput="renderPkgImageCrop()" class="w-full mt-1"></label>
                    </div>
                    <button type="button" onclick="resetPkgImageCrop()" class="text-xs font-semibold text-ink/50 hover:text-navy underline">Reset posisi</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- RIGHT: produk + bimbingan -->
          <div class="space-y-3">
            <div>
              <label class="text-xs font-semibold text-ink/70">🎁 Produk yang diterima</label>
              <p class="text-[10px] text-ink/40 mb-1">1 item per baris</p>
              <textarea id="f-products" rows="8" class="w-full px-3 py-2 border border-ink/20 rounded-lg text-sm focus:outline-none focus:border-navy resize-none" placeholder="6 KG IB&#10;6 KG YHPG&#10;Starter Kit&#10;12 Botol Air Afiyah"></textarea>
            </div>
            <div>
              <label class="text-xs font-semibold text-ink/70">🧘 Bimbingan & Terapi</label>
              <p class="text-[10px] text-ink/40 mb-1">1 item per baris</p>
              <textarea id="f-bimbingan" rows="8" class="w-full px-3 py-2 border border-ink/20 rounded-lg text-sm focus:outline-none focus:border-navy resize-none" placeholder="Bimbingan Terapi Peminuman IB&#10;Bimbingan Terapi Zikir Bersanad"></textarea>
            </div>
          </div>
        </div>

        <!-- Madu Schedule + Online Lock (Sprint 1) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4 bg-cream/40 rounded-xl border border-ink/10">
          <div>
            <label class="text-xs font-semibold text-ink/70">🍯 Madu Frequency / hari</label>
            <input id="f-madu-freq" type="number" min="0" max="20" placeholder="cth: 10"
              class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
            <p class="text-[10px] text-ink/40 mt-1">0 atau kosong = tiada madu schedule</p>
          </div>
          <div>
            <label class="text-xs font-semibold text-ink/70">Label Madu Schedule</label>
            <input id="f-madu-label" type="text" placeholder="cth: 10x sehari (12 minggu)"
              class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
          </div>
          <div>
            <label class="text-xs font-semibold text-ink/70">💻 Online Session Policy</label>
            <div class="mt-1 space-y-1.5">
              <label class="flex items-center gap-2 text-xs">
                <input type="checkbox" id="f-allow-online-full" class="accent-navy">
                <span>Benarkan online sepanjang rawatan</span>
              </label>
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] text-ink/50">Lock dari Minggu</span>
                <input id="f-online-lock-week" type="number" min="1" max="52" value="3"
                  class="w-16 px-2 py-1 border border-ink/20 rounded text-xs">
                <span class="text-[10px] text-ink/50">ke atas</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Coaching — full width -->
        <div>
          <div class="flex items-center justify-between gap-3 flex-wrap mb-3">
            <span class="text-xs font-semibold text-ink/60">📅 Coaching Mingguan</span>
            <button type="button" onclick="renderCoachingScheduleEditor(true)" class="text-xs font-semibold text-navy border border-navy/30 px-3 py-1.5 rounded-lg hover:bg-navy hover:text-white transition-colors">Jana minggu</button>
          </div>
          <div id="weekly-schedule-editor" class="space-y-3"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<script>
function toArray(text) { return text.split('\n').map(s => s.trim()).filter(Boolean); }
function toText(arr) { return (arr || []).join('\n'); }
let coachingSchedule = [];

function nextSequenceId(items, field, prefix) {
  const re = new RegExp(`^${prefix}\\s*(\\d+)$`, 'i');
  const max = (items || []).reduce((highest, item) => {
    const match = String(item[field] || '').trim().match(re);
    return match ? Math.max(highest, parseInt(match[1], 10) || 0) : highest;
  }, 0);
  return `${prefix} ${String(max + 1).padStart(3, '0')}`;
}

async function generateUniquePackageId() {
  const { data } = await window.db.from('psy_packages').select('package_id');
  const base = nextSequenceId(data, 'package_id', 'M');
  const used = new Set((data || []).map(p => p.package_id).filter(Boolean));
  if (!used.has(base)) return base;
  for (let i = 1; i < 10000; i++) {
    const candidate = `M ${String(i).padStart(3, '0')}`;
    if (!used.has(candidate)) return candidate;
  }
  return `M ${Date.now().toString().slice(-6)}`;
}

function previewPkgImage(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { banner('Gambar melebihi 10MB. Sila pilih gambar yang lebih kecil.', 'error'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = e => { document.getElementById('f-image-raw').value = e.target.result; applyPkgImageAdjustment(); };
  reader.readAsDataURL(file);
}

let pkgCropImage = null;

function cropImageDataUrl(img, zoom, offsetX, offsetY, width = 1200, height = 675) {
  if (!img) return Promise.resolve('');
  const baseScale = Math.max(width / img.width, height / img.height);
  const scale = baseScale * zoom;
  const drawW = img.width * scale;
  const drawH = img.height * scale;
  const maxX = Math.max(0, (drawW - width) / 2);
  const maxY = Math.max(0, (drawH - height) / 2);
  const dx = (width - drawW) / 2 + (offsetX / 100) * maxX;
  const dy = (height - drawH) / 2 + (offsetY / 100) * maxY;
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  canvas.getContext('2d').drawImage(img, dx, dy, drawW, drawH);
  return Promise.resolve(canvas.toDataURL('image/jpeg', 0.9));
}

function loadCropImage(src) {
  return new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = reject; img.src = src; });
}

async function applyPkgImageAdjustment(reset = true) {
  const raw = document.getElementById('f-image-raw').value;
  if (!raw) return;
  try {
    pkgCropImage = await loadCropImage(raw);
    document.getElementById('pkg-image-editor').classList.remove('hidden');
    if (reset) resetPkgImageCrop(false);
    else renderPkgImageCrop();
  } catch (err) { banner('Gagal proses gambar: ' + err.message, 'error'); }
}

async function renderPkgImageCrop() {
  if (!pkgCropImage) return;
  const adjusted = await cropImageDataUrl(pkgCropImage,
    parseFloat(document.getElementById('pkg-crop-zoom').value) || 1,
    parseInt(document.getElementById('pkg-crop-x').value) || 0,
    parseInt(document.getElementById('pkg-crop-y').value) || 0);
  document.getElementById('f-image-url').value = adjusted;
  document.getElementById('pkg-crop-preview').src = adjusted;
  document.getElementById('pkg-img-preview').innerHTML = `<img src="${adjusted}" class="w-full h-full object-cover">`;
}

function resetPkgImageCrop(render = true) {
  document.getElementById('pkg-crop-zoom').value = 1;
  document.getElementById('pkg-crop-x').value = 0;
  document.getElementById('pkg-crop-y').value = 0;
  renderPkgImageCrop();
}

const SCHED_UNIT = { harian:'hari berturut-turut', mingguan:'kali seminggu', bulanan:'kali sebulan', x_bulan:'bulan sekali' };

function schedSummaryText(type, val) {
  if (!type) return '';
  const n = parseInt(val) || 1;
  if (type === 'harian')   return `Setiap hari selama ${n} hari`;
  if (type === 'mingguan') return `${n} kali seminggu`;
  if (type === 'bulanan')  return `${n} kali sebulan`;
  if (type === 'x_bulan')  return `Sekali setiap ${n} bulan`;
  return '';
}

function updateSchedUI() {
  const type = document.getElementById('f-sched-type').value;
  const wrap = document.getElementById('sched-val-wrap');
  if (!type) { wrap.style.display = 'none'; document.getElementById('sched-summary').style.display = 'none'; return; }
  document.getElementById('sched-unit-lbl').textContent = SCHED_UNIT[type] || '';
  wrap.style.display = 'flex';
  updateSchedSummary();
}

function updateSchedSummary() {
  const type = document.getElementById('f-sched-type').value;
  const val  = document.getElementById('f-sched-val').value;
  const el   = document.getElementById('sched-summary');
  const text = schedSummaryText(type, val);
  if (text) { el.textContent = '📅 ' + text; el.style.display = 'block'; }
  else { el.style.display = 'none'; }
}

function getDurationUnit() { return document.getElementById('f-duration-unit')?.value || 'week'; }
function getScheduleCount() { return Math.max(1, parseInt(document.getElementById('f-weeks').value) || 12); }

function normalizeCoachingSchedule(schedule, count, unit = getDurationUnit()) {
  const keyName = unit === 'day' ? 'day' : 'week';
  const existing = {};
  (schedule || []).forEach(item => { existing[unit === 'day' ? (item.day || item.week) : (item.week || item.day)] = item; });
  return Array.from({ length: count }, (_, i) => {
    const n = i + 1;
    const item = existing[n] || {};
    return { period: unit, [keyName]: n, guidance: item.guidance || item.bimbingan || [], references: item.references || item.rujukan || [], supplies: item.supplies || item.bekalan || [] };
  });
}

function renderCoachingScheduleEditor(forceRebuild = false) {
  const unit = getDurationUnit();
  const count = getScheduleCount();
  const keyName = unit === 'day' ? 'day' : 'week';
  const prefix = unit === 'day' ? 'D' : 'M';
  if (forceRebuild || coachingSchedule.length !== count || coachingSchedule.some(x => (x.period || 'week') !== unit)) {
    coachingSchedule = normalizeCoachingSchedule(collectCoachingSchedule(), count, unit);
  }
  document.getElementById('weekly-schedule-editor').innerHTML = coachingSchedule.map(item => `
    <div class="rounded-lg border border-ink/10 bg-cream/30 p-3">
      <div class="font-bold text-xs text-navy mb-2">${prefix}${item[keyName]}</div>
      <div class="grid md:grid-cols-3 gap-3">
        <div>
          <label class="text-[11px] font-semibold text-ink/60">Bimbingan / Calling</label>
          <textarea data-index="${item[keyName]}" data-field="guidance" rows="4" class="weekly-field w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-xs" placeholder="Satu item per baris">${toText(item.guidance)}</textarea>
        </div>
        <div>
          <label class="text-[11px] font-semibold text-ink/60">Rujukan</label>
          <textarea data-index="${item[keyName]}" data-field="references" rows="4" class="weekly-field w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-xs" placeholder="Skrip / link / dokumen">${toText(item.references)}</textarea>
        </div>
        <div>
          <label class="text-[11px] font-semibold text-ink/60">Bekalan</label>
          <textarea data-index="${item[keyName]}" data-field="supplies" rows="4" class="weekly-field w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-xs" placeholder="Barang rawatan minggu ini">${toText(item.supplies)}</textarea>
        </div>
      </div>
    </div>`).join('');
}

function collectCoachingSchedule() {
  const unit = getDurationUnit();
  const count = getScheduleCount();
  const keyName = unit === 'day' ? 'day' : 'week';
  const schedule = normalizeCoachingSchedule(coachingSchedule, count, unit);
  document.querySelectorAll('.weekly-field').forEach(el => {
    const idx = parseInt(el.dataset.index);
    const field = el.dataset.field;
    const item = schedule.find(x => x[keyName] === idx);
    if (item) item[field] = toArray(el.value);
  });
  return schedule.filter(item => item.guidance.length || item.references.length || item.supplies.length);
}

function populateForm(pkg) {
  document.getElementById('edit-id').value = pkg?.id || '';
  document.getElementById('f-pkg-id').value = pkg?.package_id || '';
  document.getElementById('f-name').value = pkg?.name || '';
  document.getElementById('f-desc').value = pkg?.description || '';
  document.getElementById('f-price').value = pkg?.price || '';
  document.getElementById('f-duration-unit').value = pkg?.duration_unit || (pkg?.duration?.toLowerCase?.().includes('hari') ? 'day' : 'week');
  document.getElementById('f-weeks').value = (document.getElementById('f-duration-unit').value === 'day')
    ? (parseInt(pkg?.duration) || pkg?.duration_days || pkg?.duration_weeks || '')
    : (pkg?.duration_weeks || '');
  document.getElementById('f-image-url').value = pkg?.image_url || '';
  document.getElementById('f-image-raw').value = pkg?.image_url || '';
  document.getElementById('pkg-image-editor').classList.toggle('hidden', !pkg?.image_url);
  document.getElementById('pkg-crop-zoom').value = 1;
  document.getElementById('pkg-crop-x').value = 0;
  document.getElementById('pkg-crop-y').value = 0;
  pkgCropImage = null;
  const prev = document.getElementById('pkg-img-preview');
  prev.innerHTML = pkg?.image_url ? `<img src="${pkg.image_url}" class="w-full h-full object-cover">` : '📷';
  if (pkg?.image_url) { document.getElementById('pkg-crop-preview').src = pkg.image_url; applyPkgImageAdjustment(false); }
  document.getElementById('f-products').value = toText(pkg?.products);
  document.getElementById('f-bimbingan').value = toText(pkg?.bimbingan);
  coachingSchedule = normalizeCoachingSchedule(pkg?.coaching_schedule || [], getScheduleCount(), getDurationUnit());
  renderCoachingScheduleEditor();
  document.getElementById('f-sched-type').value = pkg?.schedule?.type || '';
  document.getElementById('f-sched-val').value  = pkg?.schedule?.value || 1;
  updateSchedUI();

  // Sprint 1 fields
  document.getElementById('f-madu-freq').value = pkg?.madu_frequency_per_day || '';
  document.getElementById('f-madu-label').value = pkg?.madu_schedule_label || '';
  document.getElementById('f-allow-online-full').checked = !!pkg?.allow_online_full_duration;
  document.getElementById('f-online-lock-week').value = pkg?.online_lock_from_week || 3;
}

async function savePackage() {
  const editId = document.getElementById('edit-id').value;
  const name = document.getElementById('f-name').value.trim();
  if (!name) { banner('Nama pakej wajib diisi', 'error'); return; }

  const products = toArray(document.getElementById('f-products').value);
  const bimbingan = toArray(document.getElementById('f-bimbingan').value);
  const inclusions = [...products, ...bimbingan];
  const durationUnit = getDurationUnit();
  const durationValue = getScheduleCount();
  const durationWeeks = durationUnit === 'day' ? Math.ceil(durationValue / 7) : durationValue;

  const schedType = document.getElementById('f-sched-type').value;
  const schedVal  = parseInt(document.getElementById('f-sched-val').value) || 1;
  const schedule  = schedType ? { type: schedType, value: schedVal } : null;

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Menyimpan...';

  let data = null;
  try {
    const imageUrl = document.getElementById('f-image-url').value || null;
    data = {
      name,
      description: document.getElementById('f-desc').value.trim(),
      price: parseFloat(document.getElementById('f-price').value) || 0,
      duration_unit: durationUnit,
      duration_weeks: durationWeeks,
      duration: durationValue + (durationUnit === 'day' ? ' Hari' : ' Minggu'),
      image_url: imageUrl || null,
      schedule,
      products, bimbingan, inclusions,
      coaching_schedule: collectCoachingSchedule(),
      madu_frequency_per_day: parseInt(document.getElementById('f-madu-freq').value) || null,
      madu_schedule_label: document.getElementById('f-madu-label').value.trim() || null,
      allow_online_full_duration: document.getElementById('f-allow-online-full').checked,
      online_lock_from_week: parseInt(document.getElementById('f-online-lock-week').value) || 3,
      updated_at: new Date().toISOString(),
    };

    if (editId) {
      await dbUpdate('psy_packages', editId, data);
      banner('Pakej dikemaskini');
    } else {
      data.package_id = await generateUniquePackageId();
      const { error } = await window.db.from('psy_packages').insert(data);
      if (error) throw error;
      banner('Pakej baru ditambah');
    }
    await auditLog(editId ? 'package.updated' : 'package.created', editId || data.package_id, { name });
    setTimeout(() => { window.location.href = 'pakej.html'; }, 800);
  } catch (err) {
    if (err.message?.includes('duration_unit') && data) {
      const { duration_unit, ...fallbackData } = data;
      try {
        if (editId) {
          await dbUpdate('psy_packages', editId, fallbackData);
        } else {
          if (!fallbackData.package_id) fallbackData.package_id = await generateUniquePackageId();
          const { error } = await window.db.from('psy_packages').insert(fallbackData);
          if (error) throw error;
        }
        await auditLog(editId ? 'package.updated' : 'package.created', editId || fallbackData.package_id, { name });
        banner('Disimpan');
        setTimeout(() => { window.location.href = 'pakej.html'; }, 800);
      } catch (err2) { banner('Ralat: ' + err2.message, 'error'); }
    } else {
      banner('Ralat: ' + err.message, 'error');
    }
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan Pakej';
  }
}

(async () => {
  const user = await initStaff('pakej', '');
  if (!user) return;

  const params = new URLSearchParams(location.search);
  const editId = params.get('id');

  if (editId) {
    setPageTitle('Edit Pakej', 'Kemaskini maklumat pakej rawatan');
    setHeaderBack('pakej.html', 'Kembali ke Pakej');
    const { data: pkg } = await window.db.from('psy_packages').select('*').eq('id', editId).single();
    if (!pkg) { banner('Pakej tidak ditemui', 'error'); return; }
    populateForm(pkg);
  } else {
    setPageTitle('Tambah Pakej Baru', 'Cipta pakej rawatan baru');
    setHeaderBack('pakej.html', 'Kembali ke Pakej');
    document.getElementById('f-pkg-id').value = await generateUniquePackageId();
    renderCoachingScheduleEditor();
  }

  document.getElementById('f-weeks').addEventListener('change', () => renderCoachingScheduleEditor(true));
})();
</script>
