<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Coaching Sessions</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🎯</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-4">
        <div class="bg-white rounded-xl p-5 border border-ink/10 space-y-3">
          <h3 class="font-bold">Mula Sesi Coaching Baru</h3>
          <div class="grid md:grid-cols-2 gap-3 mb-3">
            <div>
              <label class="text-xs font-semibold">Tarikh Sesi</label>
              <input type="date" id="entry-date" onchange="loadPatientsForDate()" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm outline-none focus:border-navy">
            </div>
            <div>
              <label class="text-xs font-semibold">Pesakit</label>
              <select id="c-patient" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
                <option value="">— Pilih pesakit —</option>
              </select>
            </div>
          </div>
          <div class="grid md:grid-cols-3 gap-3">
            <div>
              <label class="text-xs font-semibold">Pillar fokus</label>
              <select id="c-pillar" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
                <option value="bio">Bio</option>
                <option value="psycho" selected>Psycho</option>
                <option value="social">Social</option>
                <option value="spiritual">Spiritual</option>
              </select>
            </div>
            <div>
              <label class="text-xs font-semibold">Mood Pre (1-10)</label>
              <input id="c-mood-pre" type="number" min="1" max="10" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
            </div>
            <div>
              <label class="text-xs font-semibold">Mood Post (1-10)</label>
              <input id="c-mood-post" type="number" min="1" max="10" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold">Session Notes</label>
            <textarea id="c-notes" rows="4" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
          </div>
          <div class="grid md:grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold">Goals discussed (1 per baris)</label>
              <textarea id="c-goals" rows="3" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
            </div>
            <div>
              <label class="text-xs font-semibold">Homework (1 per baris)</label>
              <textarea id="c-homework" rows="3" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
            </div>
          </div>
          <div class="flex gap-2 flex-wrap">
            <button onclick="saveSession('completed')" class="bg-teal text-white px-5 py-2.5 rounded-lg text-sm font-semibold">Simpan & Selesai</button>
            <button onclick="escalateRisk()" class="bg-terracotta text-white px-5 py-2.5 rounded-lg text-sm">⚠ Escalate Risk</button>
          </div>
        </div>

        <div class="pt-4 border-t border-ink/10">
          <h3 class="font-bold mb-3">Sesi Terbaru</h3>
          <div id="sessions-list" class="space-y-2"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
async function saveSession(status) {
  const patientId = document.getElementById('c-patient').value;
  if (!patientId) { banner('Sila pilih pesakit', 'error'); return; }

  const patient = await dbQuery('psy_patients', { eq: { id: patientId }, single: true });
  await dbInsert('psy_coaching_sessions', {
    patient_id: patientId,
    coach_id: currentUser.id,
    patient_name: patient.mrn,
    pillar: document.getElementById('c-pillar').value,
    session_date: new Date(`${document.getElementById('entry-date').value}T${new Date().toTimeString().split(' ')[0]}`).toISOString(),
    duration_min: 60,
    mood_pre: parseInt(document.getElementById('c-mood-pre').value) || null,
    mood_post: parseInt(document.getElementById('c-mood-post').value) || null,
    notes: document.getElementById('c-notes').value,
    goals_discussed: document.getElementById('c-goals').value.split('\n').filter(Boolean),
    homework: document.getElementById('c-homework').value.split('\n').filter(Boolean),
    status,
  });
  await auditLog('coaching.session_logged', patientId);
  banner('Sesi disimpan');
  resetForm();
  loadSessions();
}

async function escalateRisk() {
  const patientId = document.getElementById('c-patient').value;
  if (!patientId) { banner('Sila pilih pesakit', 'error'); return; }
  const desc = prompt('Terangkan risiko yang diperhatikan:');
  if (!desc) return;
  const patient = await dbQuery('psy_patients', { eq: { id: patientId }, single: true });
  await dbInsert('psy_risk_alerts', {
    patient_id: patientId,
    patient_name: patient.mrn,
    created_by: currentUser.id,
    created_by_name: currentUser.full_name,
    severity: 'high',
    category: 'coach_escalation',
    description: desc,
  });
  await auditLog('risk.escalated', patientId);
  banner('Risk escalated');
}

function resetForm() {
  document.querySelectorAll('#c-mood-pre, #c-mood-post, #c-notes, #c-goals, #c-homework').forEach(i => i.value = '');
}

async function loadSessions() {
  const data = await dbQuery('psy_coaching_sessions', { order: { col: 'session_date' }, limit: 10 });
  document.getElementById('sessions-list').innerHTML = data.length
    ? data.map(s => `
      <div class="bg-white rounded-xl border border-ink/10 p-4">
        <div class="flex items-start justify-between gap-2 flex-wrap">
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <span class="chip bg-${s.pillar === 'bio' ? 'green-light text-green-dark' : s.pillar === 'psycho' ? 'navy-light text-navy' : s.pillar === 'social' ? 'gold/30 text-gold-dark' : 'teal/10 text-teal'}">${s.pillar}</span>
              <strong>${s.patient_name || '—'}</strong>
            </div>
            <p class="text-xs text-ink/70 mt-2">${(s.notes || '').slice(0, 150)}</p>
            <div class="text-xs text-ink/50 mt-1">${formatDateTime(s.session_date)} ${s.mood_pre && s.mood_post ? `· Mood ${s.mood_pre}→${s.mood_post}` : ''}</div>
          </div>
          ${statusChip(s.status)}
        </div>
      </div>`).join('')
    : '<div class="bg-white rounded-xl border border-ink/10 p-6 text-center text-ink/40 text-sm">Tiada sesi</div>';
}

(async () => {
  const user = await initStaff('coaching', 'BPS-S coaching · session log');
  if (!user) return;
  const d = new Date();
  const localToday = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  document.getElementById('entry-date').value = localToday;
  await loadPatientsForDate();

  loadSessions();
})();

async function loadPatientsForDate() {
  const dateStr = document.getElementById('entry-date').value;
  if (!dateStr) return;

  const { data: apps } = await window.db.from('psy_plan_weekly_progress')
    .select('patient_id')
    .gte('session_date', dateStr + 'T00:00:00')
    .lte('session_date', dateStr + 'T23:59:59')
    .in('status', ['booked', 'reschedule', 'hadir']);
  const todayPatientIds = new Set((apps || []).map(a => a.patient_id));

  const res = await window.db.from('psy_patients').select('*, psy_profiles!psy_patients_user_id_fkey(full_name)').eq('status', 'active');
  let patients = res.data || [];
  
  patients = patients.filter(p => todayPatientIds.has(p.id));

  document.getElementById('c-patient').innerHTML = '<option value="">— Pilih pesakit —</option>' +
    patients.map(p => `<option value="${p.id}">${p.psy_profiles?.full_name || p.mrn}</option>`).join('');
}
</script>
</body>
</html>
