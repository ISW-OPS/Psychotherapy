<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Coaching Sessions</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🎯</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-6">

        <!-- ── Summary chips ── -->
        <div class="grid grid-cols-3 gap-3">
          <div class="bg-white rounded-xl border border-ink/10 px-4 py-3 flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-navy/10 flex items-center justify-center text-lg">📅</div>
            <div>
              <div class="text-[11px] text-ink/50 font-semibold uppercase">Hari Ini</div>
              <div class="text-xl font-bold text-ink" id="count-today">—</div>
            </div>
          </div>
          <div class="bg-white rounded-xl border border-ink/10 px-4 py-3 flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-teal/10 flex items-center justify-center text-lg">🗓️</div>
            <div>
              <div class="text-[11px] text-ink/50 font-semibold uppercase">Minggu Ini</div>
              <div class="text-xl font-bold text-ink" id="count-week">—</div>
            </div>
          </div>
          <div class="bg-white rounded-xl border border-ink/10 px-4 py-3 flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-gold/10 flex items-center justify-center text-lg">📆</div>
            <div>
              <div class="text-[11px] text-ink/50 font-semibold uppercase">Bulan Ini</div>
              <div class="text-xl font-bold text-ink" id="count-month">—</div>
            </div>
          </div>
        </div>

        <!-- ── Sessions grouped ── -->
        <div id="sessions-container" class="space-y-5"></div>

      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/utils.js"></script>
<script src="_shared.js"></script>
<script>
// ── Helpers ───────────────────────────────────────────
function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function endOfDay(d)   { const x = new Date(d); x.setHours(23,59,59,999); return x; }
function startOfWeek(d){ const x = new Date(d); x.setDate(x.getDate()-x.getDay()); x.setHours(0,0,0,0); return x; }
function endOfWeek(d)  { const x = new Date(d); x.setDate(x.getDate()+(6-x.getDay())); x.setHours(23,59,59,999); return x; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfMonth(d)  { return new Date(d.getFullYear(), d.getMonth()+1, 0, 23, 59, 59, 999); }

function sessionCard(s, patientMap) {
  const p       = patientMap[s.patient_id] || {};
  const name    = p.name || s.patient_id?.slice(0,8) || '—';
  const mrn     = p.mrn  || '';
  const dt      = new Date(s.session_date);
  const timeStr = dt.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  const status  = s.status || 'booked';
  const statusMap = {
    booked:     { label:'Ditempah',    cls:'bg-navy/10 text-navy' },
    hadir:      { label:'Hadir ✅',    cls:'bg-green-light text-green-dark' },
    tidak_hadir:{ label:'Tidak Hadir', cls:'bg-terracotta-light text-terracotta' },
    reschedule: { label:'Reschedule',  cls:'bg-gold-light text-gold-dark' },
    cancel:     { label:'Batal',       cls:'bg-ink/10 text-ink/50' },
  };
  const st = statusMap[status] || statusMap.booked;
  const hubUrl = `patient-hub.html?patient_id=${s.patient_id}`;

  const initials = escapeHtml(name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase() || '?');
  return `<div class="bg-white rounded-xl border border-ink/10 px-4 py-3 flex items-center gap-4">
    <div class="w-10 h-10 rounded-full bg-navy flex items-center justify-center text-white font-bold text-sm flex-shrink-0">
      ${initials}
    </div>
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="font-semibold text-sm">${escapeHtml(name)}</span>
        ${mrn ? `<span class="text-[11px] text-ink/40">${escapeHtml(mrn)}</span>` : ''}
        <span class="text-[11px] px-2 py-0.5 rounded-full font-semibold ${st.cls}">${escapeHtml(st.label)}</span>
      </div>
      <div class="text-xs text-ink/50 mt-0.5">Minggu ${escapeHtml(String(s.week_number || '?'))} · ${escapeHtml(timeStr)}</div>
    </div>
    <div class="flex items-center gap-2 flex-shrink-0">
      ${s.meet_link ? `<a href="${escapeHtml(s.meet_link)}" target="_blank" class="text-[11px] font-semibold text-white bg-navy px-3 py-1.5 rounded-lg hover:bg-navy-dark transition">🎥 Join</a>` : ''}
      <a href="${hubUrl}" class="text-[11px] font-semibold text-navy border border-navy/30 px-3 py-1.5 rounded-lg hover:bg-navy hover:text-white transition">Buka Hub →</a>
    </div>
  </div>`;
}

function group(title, icon, sessions, patientMap, emptyMsg) {
  return `<div>
    <div class="flex items-center gap-2 mb-2">
      <span class="text-base">${icon}</span>
      <h3 class="font-bold text-sm">${title}</h3>
      <span class="text-xs text-ink/40">(${sessions.length})</span>
    </div>
    ${sessions.length
      ? `<div class="space-y-2">${sessions.map(s => sessionCard(s, patientMap)).join('')}</div>`
      : `<div class="bg-white rounded-xl border border-ink/10 px-4 py-6 text-center text-ink/40 text-sm italic">${emptyMsg}</div>`}
  </div>`;
}

// ── Main load ─────────────────────────────────────────
(async () => {
  const user = await initStaff('coaching', 'Jadual temujanji pesakit anda');
  if (!user) return;

  const now   = new Date();
  const todayStart  = startOfDay(now).toISOString();
  const todayEnd    = endOfDay(now).toISOString();
  const weekStart   = startOfWeek(now).toISOString();
  const weekEnd     = endOfWeek(now).toISOString();
  const monthStart  = startOfMonth(now).toISOString();
  const monthEnd    = endOfMonth(now).toISOString();

  // Get coach's patients
  const { data: myPatients } = await window.db.from('psy_patients')
    .select('id, mrn, full_name, user_id, psy_profiles!psy_patients_user_id_fkey(full_name)')
    .eq('coach_id', user.id);

  const patientIds = (myPatients || []).map(p => p.id);
  const patientMap = {};
  (myPatients || []).forEach(p => {
    patientMap[p.id] = { name: p.psy_profiles?.full_name || p.full_name || p.mrn, mrn: p.mrn };
  });

  if (!patientIds.length) {
    document.getElementById('sessions-container').innerHTML =
      '<div class="text-center py-16 text-ink/40 text-sm">Tiada pesakit ditugaskan kepada anda.</div>';
    ['count-today','count-week','count-month'].forEach(id => document.getElementById(id).textContent = '0');
    return;
  }

  // Fetch all sessions for this month
  const { data: sessions } = await window.db.from('psy_plan_weekly_progress')
    .select('*')
    .in('patient_id', patientIds)
    .gte('session_date', monthStart)
    .lte('session_date', monthEnd)
    .neq('status', 'cancel')
    .order('session_date', { ascending: true });

  const all = sessions || [];

  const todaySessions = all.filter(s => s.session_date >= todayStart && s.session_date <= todayEnd);
  const weekSessions  = all.filter(s => s.session_date >= weekStart  && s.session_date <= weekEnd && s.session_date < todayStart);
  const monthSessions = all.filter(s => s.session_date > weekEnd);

  document.getElementById('count-today').textContent = todaySessions.length;
  document.getElementById('count-week').textContent  = todaySessions.length + weekSessions.length + all.filter(s => s.session_date >= weekStart && s.session_date < todayStart).length;
  document.getElementById('count-month').textContent = all.length;

  const upcomingWeek  = all.filter(s => s.session_date >= weekStart && s.session_date <= weekEnd && s.session_date > todayEnd);
  const upcomingMonth = all.filter(s => s.session_date > weekEnd);
  const past = all.filter(s => s.session_date < todayStart);

  document.getElementById('sessions-container').innerHTML = [
    group('Hari Ini', '📅', todaySessions, patientMap, 'Tiada temujanji hari ini'),
    group('Minggu Ini (Akan Datang)', '🗓️', upcomingWeek, patientMap, 'Tiada lagi temujanji minggu ini'),
    group('Bulan Ini (Lain-lain)', '📆', upcomingMonth, patientMap, 'Tiada temujanji lain bulan ini'),
    past.length ? group('Lepas (Bulan Ini)', '🕐', past.slice().reverse(), patientMap, '') : '',
  ].join('');
})();
</script>
</body>
</html><!--end-->
