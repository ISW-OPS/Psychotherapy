<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Seller / Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.purple-btn { background: #6366f1; color: white; transition: background .15s; }
.purple-btn:hover { background: #4f46e5; }
</style>
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🏪</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-5">
        <div class="text-xs text-ink/40">
          <a href="produk-bahan.html" class="hover:underline">Produk & Bahan</a> <span class="mx-1">›</span>
          <span class="text-ink/70 font-medium">Seller / Platform</span>
        </div>

        <div class="flex items-start justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-2xl font-bold text-ink">Seller / Platform</h1>
            <div class="text-sm text-ink/55 mt-0.5">🏪 Senarai semua seller atau platform yang digunakan untuk pembelian produk dan bahan.</div>
          </div>
          <button data-rbac="produk_bahan.create" id="btn-new" onclick="location.href='produk-seller-form.html'" class="hidden purple-btn px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-sm">+ Tambah Seller / Platform</button>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <input type="text" id="f-search" oninput="renderTable()" placeholder="Cari nama seller, platform, link..." class="text-xs border border-ink/15 rounded-lg px-3 py-1.5 bg-white w-64">
          <select id="f-platform" onchange="renderTable()" class="text-xs border border-ink/15 rounded-lg px-2.5 py-1.5 bg-white">
            <option value="">Platform: Semua</option>
          </select>
          <select id="f-status" onchange="renderTable()" class="text-xs border border-ink/15 rounded-lg px-2.5 py-1.5 bg-white">
            <option value="">Status: Semua</option>
            <option value="active">Aktif</option>
            <option value="inactive">Tidak Aktif</option>
          </select>
          <select id="f-sort" onchange="renderTable()" class="text-xs border border-ink/15 rounded-lg px-2.5 py-1.5 bg-white">
            <option value="name_asc">Sort By: Nama A - Z</option>
            <option value="name_desc">Nama Z - A</option>
            <option value="products_desc">Jumlah Produk (Tinggi-Rendah)</option>
            <option value="verified_desc">Last Verified (Terbaru)</option>
          </select>
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-ink/8 bg-ink/[0.015]">
                  <th class="text-left px-5 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Logo</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Nama Seller</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Platform</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Link</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Jumlah Produk</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Produk Aktif</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Last Verified</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Status</th>
                  <th class="text-right px-5 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Tindakan</th>
                </tr>
              </thead>
              <tbody id="seller-body" class="divide-y divide-ink/5"></tbody>
            </table>
          </div>
          <div id="seller-empty-state" class="hidden px-5 py-12 text-center text-sm text-ink/35">Tiada seller lagi</div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('ms-MY', { day:'2-digit', month:'short', year:'numeric' }) : '—'; }
function fmtDateTime(d) { return d ? new Date(d).toLocaleString('ms-MY', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—'; }

let allSellers = [];
let productCountBySeller = {};     // seller_id -> jumlah produk
let activeProductCountBySeller = {}; // seller_id -> jumlah produk aktif

async function loadAll() {
  const [{ data: sellers }, { data: links }] = await Promise.all([
    window.db.from('psy_recommended_sellers').select('*'),
    window.db.from('psy_recommended_product_sellers').select('seller_id, psy_recommended_products(is_active)'),
  ]);
  allSellers = sellers || [];
  productCountBySeller = {};
  activeProductCountBySeller = {};
  (links || []).forEach(l => {
    productCountBySeller[l.seller_id] = (productCountBySeller[l.seller_id] || 0) + 1;
    if (l.psy_recommended_products?.is_active) activeProductCountBySeller[l.seller_id] = (activeProductCountBySeller[l.seller_id] || 0) + 1;
  });

  const platforms = [...new Set(allSellers.map(s => s.platform).filter(Boolean))].sort();
  document.getElementById('f-platform').innerHTML = '<option value="">Platform: Semua</option>' +
    platforms.map(p => `<option value="${escHtml(p)}">${escHtml(p)}</option>`).join('');

  renderTable();
}

function renderTable() {
  const q = (document.getElementById('f-search').value || '').toLowerCase().trim();
  const platform = document.getElementById('f-platform').value;
  const status = document.getElementById('f-status').value;
  const sort = document.getElementById('f-sort').value;
  const tbody = document.getElementById('seller-body');
  const empty = document.getElementById('seller-empty-state');

  let list = allSellers.filter(s => {
    if (q && !(s.name||'').toLowerCase().includes(q) && !(s.platform||'').toLowerCase().includes(q) && !(s.link||'').toLowerCase().includes(q)) return false;
    if (platform && s.platform !== platform) return false;
    if (status && (status === 'active') !== (s.status === 'active')) return false;
    return true;
  });
  list = list.slice().sort((a, b) => {
    if (sort === 'name_desc') return b.name.localeCompare(a.name);
    if (sort === 'products_desc') return (productCountBySeller[b.id]||0) - (productCountBySeller[a.id]||0);
    if (sort === 'verified_desc') return new Date(b.last_verified_at||0) - new Date(a.last_verified_at||0);
    return a.name.localeCompare(b.name);
  });

  if (!list.length) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  tbody.innerHTML = list.map(s => `
    <tr class="hover:bg-ink/[0.01] cursor-pointer" onclick="window.location.href='produk-seller-view.html?id=${s.id}'">
      <td class="px-5 py-3">${s.logo_url ? `<img src="${escHtml(s.logo_url)}" class="w-10 h-10 rounded-lg object-cover border border-ink/10">` : '<div class="w-10 h-10 rounded-lg bg-ink/5 flex items-center justify-center text-lg">🏪</div>'}</td>
      <td class="px-3 py-3 font-bold text-ink">
        ${escHtml(s.name)}${s.notes ? `<div class="text-[11px] font-normal text-ink/45 mt-0.5 line-clamp-1">${escHtml(s.notes)}</div>` : ''}
      </td>
      <td class="px-3 py-3"><span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-navy-light/50 text-navy">${escHtml(s.platform || '—')}</span></td>
      <td class="px-3 py-3 text-xs max-w-[160px] truncate">${s.link ? `<a href="${escHtml(s.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="text-navy hover:underline">${escHtml(s.link)}</a>` : '—'}</td>
      <td class="px-3 py-3 text-xs">${productCountBySeller[s.id] || 0}</td>
      <td class="px-3 py-3 text-xs">${activeProductCountBySeller[s.id] || 0}</td>
      <td class="px-3 py-3 text-xs text-ink/50">${fmtDateTime(s.last_verified_at)}</td>
      <td class="px-3 py-3">${s.status === 'active' ? '<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700">● Aktif</span>' : '<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-ink/8 text-ink/55">● Tidak Aktif</span>'}</td>
      <td class="px-5 py-3 text-right whitespace-nowrap" onclick="event.stopPropagation()">
        <button onclick="window.location.href='produk-seller-view.html?id=${s.id}'" class="w-8 h-8 inline-flex items-center justify-center border border-ink/15 rounded-lg hover:bg-ink/5" title="Lihat">👁️</button>
      </td>
    </tr>`).join('');
}

(async () => {
  const user = await initStaff('produk_seller', 'Seller / Platform');
  if (!user) return;
  if (can('produk_bahan','create')) document.getElementById('btn-new').classList.remove('hidden');
  await loadAll();
})();
</script>
</body>
</html>
