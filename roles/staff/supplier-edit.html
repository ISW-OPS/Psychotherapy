<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Borang Supplier</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
  .step-badge { width: 24px; height: 24px; border-radius: 999px; background: #50808E; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
</style>
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🏢</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">
        <div class="pb-4 border-b border-ink/10 flex items-center justify-between flex-wrap gap-3">
          <div>
            <h2 id="sf-title" class="text-xl font-bold text-navy">Add / Edit Supplier</h2>
            <p class="text-xs text-ink/50 mt-0.5">Create a new supplier or update supplier information.</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="cancelForm()" class="px-4 py-2.5 border border-ink/20 rounded-xl text-sm font-semibold bg-white hover:bg-ink/5">✕ Cancel</button>
            <button onclick="saveSupplier(true)" class="px-4 py-2.5 border border-ink/20 rounded-xl text-sm font-semibold bg-white hover:bg-ink/5">📋 Save as Draft</button>
            <button onclick="saveSupplier(false)" class="bg-navy text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-navy-dark">✓ Save Supplier</button>
          </div>
        </div>

        <div class="space-y-5">
          <div id="sf-summary-card" class="hidden grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-4 flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-green/10 flex items-center justify-center text-lg flex-shrink-0">💰</div>
              <div>
                <div class="text-[10px] text-ink/40 font-semibold uppercase tracking-wide">Total Purchases (Tahun Ini)</div>
                <div id="sf-sum-purchases" class="text-xl font-bold text-green-dark">RM 0.00</div>
              </div>
            </div>
            <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-4 flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-navy/10 flex items-center justify-center text-lg flex-shrink-0">📅</div>
              <div>
                <div class="text-[10px] text-ink/40 font-semibold uppercase tracking-wide">Last Purchase Date</div>
                <div id="sf-sum-last" class="text-xl font-bold text-ink">—</div>
              </div>
            </div>
            <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-4 flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-gold/10 flex items-center justify-center text-lg flex-shrink-0">⚠️</div>
              <div>
                <div class="text-[10px] text-ink/40 font-semibold uppercase tracking-wide">Total Outstanding</div>
                <div id="sf-sum-outstanding" class="text-xl font-bold text-gold-dark">RM 0.00</div>
              </div>
            </div>
          </div>

          <div class="space-y-4 min-w-0">
            <input id="sup-id" type="hidden">

            <!-- Maklumat Supplier -->
            <div>
              <h3 class="font-bold text-sm text-ink mb-3">Supplier Information</h3>
              <div class="grid grid-cols-4 gap-3">
                <div>
                  <label class="text-sm font-semibold text-ink">Supplier Name <span class="text-terracotta">*</span></label>
                  <input id="sup-name" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="Cth: Medika Supplies Sdn Bhd">
                </div>
                <div>
                  <label class="text-sm font-semibold text-ink">Phone</label>
                  <input id="sup-phone" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="03-1234 5678">
                </div>
                <div>
                  <label class="text-sm font-semibold text-ink">Mobile</label>
                  <input id="sup-mobile" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="012-345 6789">
                </div>
                <div>
                  <label class="text-sm font-semibold text-ink">Email <span class="text-terracotta">*</span></label>
                  <input id="sup-email" type="email" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="sales@supplier.com.my">
                </div>
              </div>
              <div class="grid grid-cols-4 gap-3 mt-3">
                <div class="col-span-2">
                  <label class="text-sm font-semibold text-ink">Address <span class="text-terracotta">*</span></label>
                  <textarea id="sup-address" rows="3" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none resize-none" placeholder="No. 12, Jalan Tiara 3, Section 2, ..."></textarea>
                </div>
                <div>
                  <label class="text-sm font-semibold text-ink">City <span class="text-terracotta">*</span></label>
                  <input id="sup-city" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="Shah Alam">
                </div>
                <div>
                  <label class="text-sm font-semibold text-ink">State <span class="text-terracotta">*</span></label>
                  <input id="sup-state" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="Selangor">
                </div>
              </div>
              <div class="grid grid-cols-4 gap-3 mt-3">
                <div>
                  <label class="text-sm font-semibold text-ink">Country</label>
                  <input id="sup-country" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" value="Malaysia">
                </div>
                <div>
                  <label class="text-sm font-semibold text-ink">Website</label>
                  <input id="sup-website" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="www.supplier.com.my">
                </div>
                <div>
                  <label class="text-sm font-semibold text-ink">Lokasi (Waze)</label>
                  <input id="sup-location-url" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="https://waze.com/ul/...">
                </div>
                <div>
                  <label class="text-sm font-semibold text-ink">Currency <span class="text-terracotta">*</span></label>
                  <select id="sup-currency" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white focus:border-navy outline-none">
                    <option value="MYR">MYR - Malaysian Ringgit</option>
                    <option value="USD">USD - US Dollar</option>
                    <option value="SGD">SGD - Singapore Dollar</option>
                  </select>
                </div>
                <div>
                  <label class="text-sm font-semibold text-ink">Status</label>
                  <select id="sup-status" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white focus:border-navy outline-none">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                    <option value="blacklisted">Blacklisted</option>
                  </select>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-3 mt-3">
                <div>
                  <label class="text-sm font-semibold text-ink">Bank Name</label>
                  <select id="sup-bank-name" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white focus:border-navy outline-none">
                    <option value="">— Pilih Bank —</option>
                    <option>Maybank</option><option>CIMB Bank</option><option>Public Bank</option>
                    <option>RHB Bank</option><option>Hong Leong Bank</option><option>AmBank</option>
                    <option>Bank Islam</option><option>Bank Rakyat</option><option>BSN</option>
                    <option>UOB</option><option>OCBC Bank</option><option>Affin Bank</option>
                    <option>Alliance Bank</option><option>Standard Chartered</option><option>HSBC</option>
                    <option>Lain-lain</option>
                  </select>
                </div>
                <div>
                  <label class="text-sm font-semibold text-ink">Bank Account No.</label>
                  <input id="sup-bank-account-no" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="5621 4567 8901">
                </div>
                <div>
                  <label class="text-sm font-semibold text-ink">Bank Account Name</label>
                  <input id="sup-bank-account-name" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none" placeholder="Sama macam Supplier Name">
                </div>
              </div>

              <div class="pt-5 mt-5 border-t border-ink/8">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="font-bold text-sm text-ink">Contact Persons</h3>
                  <button onclick="addContactRow()" class="text-xs font-semibold text-navy hover:underline">+ Add Contact</button>
                </div>
                <div id="sf-contacts-list" class="space-y-2"></div>
                <p id="sf-contacts-empty" class="text-xs text-ink/40 italic">Tiada kenalan lagi.</p>
              </div>
            </div>
          </div>
        </div>

        <div id="sf-meta" class="hidden pt-4 mt-2 border-t border-ink/8 flex items-center justify-between text-[11px] text-ink/40"></div>
      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let editingSupplierId = null;
let supplierData = null;
let contactsState = [];       // {id?, name, position, phone, email, _deleted?}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Contact Persons (client-side state, disimpan bila Save) ─────────
// Setiap kenalan ada _editing (bool) — baharu terus buka dlm mod edit,
// kenalan sedia ada (dimuat drpd DB) mula dlm mod paparan (jadual),
// padan gaya jadual "Name/Position/Phone/Email/Action" dalam mockup.
function addContactRow() {
  contactsState.push({ name: '', position: '', phone: '', email: '', _editing: true });
  renderContacts();
}
window.addContactRow = addContactRow;

function removeContactRow(idx) {
  if (!confirm('Buang kenalan ini?')) return;
  contactsState.splice(idx, 1);
  renderContacts();
}
window.removeContactRow = removeContactRow;

function editContactRow(idx) {
  contactsState[idx]._editing = true;
  renderContacts();
}
window.editContactRow = editContactRow;

function doneContactRow(idx) {
  if (!contactsState[idx].name.trim()) { banner('Nama kenalan diperlukan', 'error'); return; }
  contactsState[idx]._editing = false;
  renderContacts();
}
window.doneContactRow = doneContactRow;

function updateContactField(idx, field, value) {
  contactsState[idx][field] = value;
}
window.updateContactField = updateContactField;

function renderContacts() {
  const wrap = document.getElementById('sf-contacts-list');
  document.getElementById('sf-contacts-empty').classList.toggle('hidden', contactsState.length > 0);
  if (!contactsState.length) { wrap.innerHTML = ''; return; }

  wrap.innerHTML = `<div class="overflow-x-auto"><table class="w-full text-xs">
    <thead><tr class="border-b border-ink/10 text-left text-[10px] uppercase tracking-wider text-ink/45">
      <th class="pb-1.5">Name</th><th class="pb-1.5">Position</th><th class="pb-1.5">Phone</th><th class="pb-1.5">Email</th><th class="pb-1.5 text-center">Action</th>
    </tr></thead>
    <tbody>${contactsState.map((c, idx) => c._editing ? `
      <tr class="border-b border-ink/5 last:border-0">
        <td class="py-1.5 pr-1"><input value="${escHtml(c.name)}" oninput="updateContactField(${idx},'name',this.value)" placeholder="Nama" class="w-full px-2 py-1.5 border border-ink/15 rounded-lg text-xs focus:border-navy outline-none"></td>
        <td class="py-1.5 pr-1"><input value="${escHtml(c.position)}" oninput="updateContactField(${idx},'position',this.value)" placeholder="Jawatan" class="w-full px-2 py-1.5 border border-ink/15 rounded-lg text-xs focus:border-navy outline-none"></td>
        <td class="py-1.5 pr-1"><input value="${escHtml(c.phone)}" oninput="updateContactField(${idx},'phone',this.value)" placeholder="Telefon" class="w-full px-2 py-1.5 border border-ink/15 rounded-lg text-xs focus:border-navy outline-none"></td>
        <td class="py-1.5 pr-1"><input value="${escHtml(c.email)}" oninput="updateContactField(${idx},'email',this.value)" placeholder="Emel" class="w-full px-2 py-1.5 border border-ink/15 rounded-lg text-xs focus:border-navy outline-none"></td>
        <td class="py-1.5 text-center">
          <button onclick="doneContactRow(${idx})" title="Simpan" class="w-6 h-6 inline-flex items-center justify-center rounded-full text-green-dark hover:bg-green-light">✓</button>
          <button onclick="removeContactRow(${idx})" title="Buang" class="w-6 h-6 inline-flex items-center justify-center rounded-full text-terracotta hover:bg-terracotta/10">🗑</button>
        </td>
      </tr>` : `
      <tr class="border-b border-ink/5 last:border-0">
        <td class="py-2 pr-1 font-medium text-ink">${escHtml(c.name)}</td>
        <td class="py-2 pr-1 text-ink/60">${escHtml(c.position || '—')}</td>
        <td class="py-2 pr-1 text-ink/60">${escHtml(c.phone || '—')}</td>
        <td class="py-2 pr-1 text-ink/60">${escHtml(c.email || '—')}</td>
        <td class="py-2 text-center">
          <button onclick="editContactRow(${idx})" title="Edit" class="w-6 h-6 inline-flex items-center justify-center rounded-full text-navy hover:bg-navy/10">✏️</button>
          <button onclick="removeContactRow(${idx})" title="Buang" class="w-6 h-6 inline-flex items-center justify-center rounded-full text-terracotta hover:bg-terracotta/10">🗑</button>
        </td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

// ── Load for edit ────────────────────────────────────────────────
async function loadForEdit(id) {
  const [supRes, contactRes] = await Promise.all([
    window.db.from('psy_suppliers').select('*').eq('id', id).single(),
    window.db.from('psy_supplier_contacts').select('*').eq('supplier_id', id).order('created_at'),
  ]);
  if (supRes.error || !supRes.data) { banner('Supplier tidak dijumpai', 'error'); setTimeout(() => location.href = 'suppliers.html', 1200); return; }
  const data = supRes.data;
  supplierData = data;
  document.getElementById('sf-title').textContent = 'Edit Supplier';
  document.getElementById('sup-id').value = data.id;
  document.getElementById('sup-name').value = data.name || '';
  document.getElementById('sup-currency').value = data.currency || 'MYR';
  document.getElementById('sup-status').value = data.status || 'active';
  document.getElementById('sup-phone').value = data.phone || '';
  document.getElementById('sup-mobile').value = data.mobile || '';
  document.getElementById('sup-email').value = data.email || '';
  document.getElementById('sup-address').value = data.address || '';
  document.getElementById('sup-city').value = data.city || '';
  document.getElementById('sup-state').value = data.state || '';
  document.getElementById('sup-country').value = data.country || 'Malaysia';
  document.getElementById('sup-website').value = data.website || '';
  document.getElementById('sup-location-url').value = data.location_url || '';
  document.getElementById('sup-bank-name').value = data.bank_name || '';
  document.getElementById('sup-bank-account-no').value = data.bank_account_no || '';
  document.getElementById('sup-bank-account-name').value = data.bank_account_name || '';

  contactsState = (contactRes.data || []).map(c => ({ id: c.id, name: c.name || '', position: c.position || '', phone: c.phone || '', email: c.email || '' }));
  renderContacts();

  document.getElementById('sf-meta').classList.remove('hidden');
  document.getElementById('sf-meta').innerHTML =
    `<span>Created by ${escHtml(data.created_by_name || '—')} on ${data.created_at ? new Date(data.created_at).toLocaleString('en-GB') : '—'}</span>
     <span>Last updated by ${escHtml(data.updated_by_name || '—')} on ${data.updated_at ? new Date(data.updated_at).toLocaleString('en-GB') : '—'}</span>`;
}

async function supAudit(action, target, meta = {}) {
  try {
    await window.db.from('psy_audit_log').insert({
      actor_id: window.currentUser.id, actor_name: window.currentUser.full_name,
      actor_role: 'staff', action, target, meta,
    });
  } catch (_) {}
}

function cancelForm() {
  if (window.opener && !window.opener.closed) window.close();
  else location.href = 'suppliers.html';
}
window.cancelForm = cancelForm;

async function saveSupplier(isDraft) {
  const name = document.getElementById('sup-name').value.trim();
  if (!name) { banner('Supplier Name diperlukan', 'error'); document.getElementById('sup-name').focus(); return; }
  const email = document.getElementById('sup-email').value.trim();
  if (!isDraft && !email) { banner('Email diperlukan', 'error'); document.getElementById('sup-email').focus(); return; }

  const payload = {
    name,
    currency: document.getElementById('sup-currency').value,
    status: document.getElementById('sup-status').value,
    phone: document.getElementById('sup-phone').value.trim() || null,
    mobile: document.getElementById('sup-mobile').value.trim() || null,
    email,
    address: document.getElementById('sup-address').value.trim() || null,
    city: document.getElementById('sup-city').value.trim() || null,
    state: document.getElementById('sup-state').value.trim() || null,
    country: document.getElementById('sup-country').value.trim() || 'Malaysia',
    website: document.getElementById('sup-website').value.trim() || null,
    location_url: document.getElementById('sup-location-url').value.trim() || null,
    bank_name: document.getElementById('sup-bank-name').value || null,
    bank_account_no: document.getElementById('sup-bank-account-no').value.trim() || null,
    bank_account_name: document.getElementById('sup-bank-account-name').value.trim() || null,
    updated_by: window.currentUser?.id,
    updated_by_name: window.currentUser?.full_name || '',
    updated_at: new Date().toISOString(),
  };

  const btn = event?.target;
  if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan...'; }

  try {
    let supplierId = editingSupplierId;
    if (editingSupplierId) {
      const { error } = await window.db.from('psy_suppliers').update(payload).eq('id', editingSupplierId);
      if (error) throw error;
    } else {
      payload.created_by = window.currentUser?.id;
      payload.created_by_name = window.currentUser?.full_name || '';
      const { data, error } = await window.db.from('psy_suppliers').insert(payload).select('id').single();
      if (error) throw error;
      supplierId = data.id;
    }

    // Sync contacts: buang semua sedia ada, masuk semula ikut state semasa (senarai kecil, selamat)
    await window.db.from('psy_supplier_contacts').delete().eq('supplier_id', supplierId);
    const validContacts = contactsState.filter(c => c.name.trim());
    if (validContacts.length) {
      await window.db.from('psy_supplier_contacts').insert(validContacts.map(c => ({
        supplier_id: supplierId, name: c.name.trim(), position: c.position.trim() || null,
        phone: c.phone.trim() || null, email: c.email.trim() || null,
      })));
    }

    await supAudit(editingSupplierId ? 'supplier.updated' : 'supplier.created', supplierId, { name: payload.name });
    banner(editingSupplierId ? 'Supplier dikemaskini ✅' : 'Supplier ditambah ✅');
    setTimeout(() => location.href = `supplier-detail.html?id=${supplierId}`, 700);
  } catch (e) {
    banner('Gagal simpan supplier: ' + e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '✓ Save Supplier'; }
  }
}
window.saveSupplier = saveSupplier;

(async () => {
  const user = await initStaff('suppliers', 'Borang Supplier', 'inventory');
  if (!user) return;

  const qs = new URLSearchParams(location.search);
  const id = qs.get('id');
  if (id) {
    if (!can('inventory', 'edit')) {
      banner('Akses ditolak.', 'error');
      setTimeout(() => location.href = 'suppliers.html', 1200);
      return;
    }
    editingSupplierId = id;
    document.getElementById('sf-summary-card').classList.remove('hidden');
    await loadForEdit(id);
  } else {
    if (!can('inventory', 'create')) {
      banner('Akses ditolak.', 'error');
      setTimeout(() => location.href = 'suppliers.html', 1200);
      return;
    }
    renderContacts();
  }
})();
</script>
</body>
</html>
