<script>
    function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
initScrollPreserve();
const escHtml = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// Palet carta — disahkan lulus semakan CVD (validator dataviz):
// navy #1B4E9C (mood), gold #B8860B (tenaga), teal #0D9488 (tidur)
const CHART_COLORS = { mood: '#1B4E9C', tenaga: '#B8860B', tidur: '#0D9488' };

let allPatients = [];      // senarai psy_patients + join profil
let staffMap    = {};      // id profil staff -> {full_name, staff_role}
let selectedId  = null;
let patient = null, profile = null, kyc = null, activePlan = null;
let checkinChart = null;
// Kalendar Kepatuhan — state dikongsi antara renderSections dan onclick handlers
// kepCalNav/kepSelectDay yg dipanggil lepas HTML dah dipasang.
let kepLogByDateFull = {};  // log_date -> {fasa, jawapan, skor_harian}
let kepItemIndex = {};      // `${fasa}::${item_key}` -> {label, optMap}
let kepCalYear = null, kepCalMonth = null, kepCalSelectedYmd = null;

const params = new URLSearchParams(location.search);

// ── Boot ──────────────────────────────────────────────
(async () => {
  const user = await initStaff('progres_pesakit', 'Progres Pesakit');
  if (!user) return;
  await Promise.all([loadPatientList(), loadStaffList()]);
  const pre = params.get('patient_id');
  if (pre && allPatients.some(p => p.id === pre)) await selectPatient(pre);
  bindPicker();
  restoreScrollPreserve();
})();

// ── Senarai pesakit & staff ───────────────────────────
async function loadPatientList() {
  const { data, error } = await window.db.from('psy_patients')
    .select('id, mrn, full_name, phone, status, coach_id, active_package_name, user_id, psy_profiles!psy_patients_user_id_fkey(full_name, phone, email, avatar_url)')
    .neq('status', 'deleted')
    .order('created_at', { ascending: false });
  if (error) console.error('[progres] patients:', error);
  allPatients = data || [];
  document.getElementById('picker-count').textContent = `${allPatients.length} pesakit`;
}

async function loadStaffList() {
  const { data } = await window.db.from('psy_profiles')
    .select('id, full_name, staff_role').eq('role', 'staff').order('full_name');
  (data || []).forEach(s => { staffMap[s.id] = s; });
  const sel = document.getElementById('filter-coach');
  const coaches = (data || []).filter(s => ['coach', 'manager'].includes(s.staff_role));
  sel.innerHTML = '<option value="">Semua Coach</option>' +
    coaches.map(c => `<option value="${c.id}">${escHtml(c.full_name || '—')}</option>`).join('');
}

// ── Pemilih (cari + tapis) ────────────────────────────
function bindPicker() {
  const input = document.getElementById('patient-search');
  const box   = document.getElementById('search-results');
  const render = () => {
    const q = input.value.trim().toLowerCase();
    const coach  = document.getElementById('filter-coach').value;
    const status = document.getElementById('filter-status').value;
    let list = allPatients;
    if (coach)  list = list.filter(p => p.coach_id === coach);
    if (status) list = list.filter(p => p.status === status);
    if (q) list = list.filter(p => {
      const nm = (iswPatientName(p) || '').toLowerCase();
      const ph = (iswPatientPhone(p) || '').toLowerCase();
      return nm.includes(q) || (p.mrn || '').toLowerCase().includes(q) || ph.includes(q);
    });
    document.getElementById('picker-count').textContent = `${list.length} pesakit`;
    box.innerHTML = list.slice(0, 30).map(p => {
      const nm = escHtml(iswPatientName(p) || `Pesakit ${p.mrn || ''}`);
      const coachNm = p.coach_id && staffMap[p.coach_id] ? escHtml(staffMap[p.coach_id].full_name) : '—';
      return `<button onclick="selectPatient('${p.id}')" class="w-full text-left px-4 py-2.5 hover:bg-navy-light/40 border-b border-ink/5 last:border-0">
        <div class="flex items-center justify-between gap-2">
          <span class="text-sm font-semibold text-ink">${nm}</span>
          ${statusChip(p.status)}
        </div>
        <div class="text-[11px] text-ink/50 mt-0.5">🪪 ${escHtml(p.mrn || '—')} · Coach: ${coachNm}${p.active_package_name ? ' · 📦 ' + escHtml(p.active_package_name) : ''}</div>
      </button>`;
    }).join('') || '<div class="px-4 py-3 text-xs text-ink/50">Tiada padanan.</div>';
    box.classList.remove('hidden');
  };
  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  document.getElementById('filter-coach').addEventListener('change', render);
  document.getElementById('filter-status').addEventListener('change', render);
  document.addEventListener('click', e => {
    if (!e.target.closest('#picker-card')) box.classList.add('hidden');
  });
}

// ── Muatkan SEMUA rekod pesakit terpilih ──────────────
window.selectPatient = async function (id) {
  selectedId = id;
  document.getElementById('search-results').classList.add('hidden');
  history.replaceState(null, '', '?patient_id=' + id);
  document.getElementById('empty-state').classList.add('hidden');
  const wrap = document.getElementById('report-wrap');
  wrap.classList.remove('hidden');
  document.getElementById('report-body').innerHTML =
    '<div class="lg:col-span-2 text-center text-ink/50 text-sm py-10">⏳ Memuatkan semua rekod rawatan...</div>';

  // 1) Pesakit + profil
  const { data: pt, error } = await window.db.from('psy_patients')
    .select('*, psy_profiles!psy_patients_user_id_fkey(full_name, phone, email, avatar_url)')
    .eq('id', id).single();
  if (error || !pt) { banner('Gagal muat pesakit', 'error'); return; }
  patient = pt;
  profile = pt.psy_profiles || null;

  // 2) Semua rekod secara selari — setiap query gagal → senarai kosong (jangan runtuhkan halaman)
  const g = q => q.then(r => (r.error ? [] : (r.data || [])), () => []);
  const [kycRows, plans, kepWeekly, kepLog, kepItems, checkins, vitals, kobs, payments, reports, sesi1on1, notes, reaksi, supply, offers] = await Promise.all([
    pt.user_id ? g(window.db.from('psy_kyc_submissions').select('*').eq('user_id', pt.user_id).order('created_at', { ascending: false }).limit(1)) : Promise.resolve([]),
    g(window.db.from('psy_treatment_plans').select('*').eq('patient_id', id).order('created_at', { ascending: false })),
    g(window.db.from('psy_kepatuhan_weekly').select('*').eq('patient_id', id)),
    g(window.db.from('psy_kepatuhan_log').select('log_date, fasa, jawapan, skor_harian').eq('patient_id', id).order('log_date', { ascending: true })),
    g(window.db.from('psy_kepatuhan_item').select('fasa, item_key, label, options')),
    g(window.db.from('psy_daily_checkins').select('checkin_date, mood_score, energy_score, sleep_quality, sleep_hours').eq('patient_id', id).order('checkin_date', { ascending: false }).limit(30)),
    g(window.db.from('psy_vitals').select('*').eq('patient_id', id).order('created_at', { ascending: false }).limit(5)),
    g(window.db.from('psy_kob_sessions').select('*').eq('patient_id', id).order('scheduled_at', { ascending: false }).limit(10)),
    g(window.db.from('psy_payments').select('receipt_ref, total, status, payment_method, paid_at, created_at').eq('patient_id', id).order('created_at', { ascending: false }).limit(10)),
    g(window.db.from('psy_medical_reports').select('id, title, file_name, file_url, report_type, status, review_status, created_at').eq('patient_id', id).order('created_at', { ascending: false }).limit(10)),
    g(window.db.from('psy_clinical_referrals').select('*').eq('patient_id', id).eq('source', 'plan_1on1').order('created_at', { ascending: false }).limit(30)),
    g(window.db.from('psy_patient_notes').select('*').eq('patient_id', id).in('visibility', ['staff', 'both']).order('is_pinned', { ascending: false }).order('created_at', { ascending: false }).limit(10)),
    g(window.db.from('psy_reaksi_advice_log').select('log_date, symptoms, is_emergency, status, sent_at').eq('patient_id', id).order('log_date', { ascending: false }).limit(30)),
    // psy_stock_movements (bukan psy_supply_disbursements) — sumber lengkap, termasuk
    // auto-potong sesi Hadir (checklist Bekalan di plan-week.html), bukan setakat manual
    // "+ Bagi Bekalan" di patient-hub. Lihat nota sama di patient-hub.html loadSupply().
    g(window.db.from('psy_stock_movements').select('item_name, qty, actor_name, created_at')
      .eq('reference_type', 'patient_package').eq('reference_id', id).eq('movement_type', 'out')
      .order('created_at', { ascending: false }).limit(10))
      .then(rows => rows.map(r => ({ item_name: r.item_name, qty: Math.abs(Number(r.qty)), given_by_name: r.actor_name, created_at: r.created_at }))),
    g(window.db.from('psy_continuity_offers').select('package_name, price, status, created_at').eq('patient_id', id).order('created_at', { ascending: false }).limit(5)),
  ]);

  kyc = kycRows[0] || null;
  activePlan = plans.find(p => p.status === 'active') || plans[0] || null;

  // Minggu progres + coaching_schedule LIVE dari pakej (bukan snapshot lama)
  let weekly = [];
  if (activePlan) {
    weekly = await g(window.db.from('psy_plan_weekly_progress').select('*').eq('plan_id', activePlan.id).order('week_number').order('session_date'));
    if (activePlan.template) {
      const { data: livePkg } = await window.db.from('psy_packages')
        .select('coaching_schedule, sessions_per_week').eq('package_id', activePlan.template).maybeSingle();
      if (livePkg?.coaching_schedule?.length) activePlan.coaching_schedule = livePkg.coaching_schedule;
    }
  }

  const kepWeeks = buildKepWeeks(kepWeekly, kepLog, activePlan);

  renderHeaderCard();
  renderKpis(weekly, kepWeeks, checkins, payments);
  renderSections({ weekly, kepWeeks, kepLog, kepItems, checkins, vitals, kobs, payments, reports, sesi1on1, notes, reaksi, supply, offers, plans });
};

// ── Kad kepala ────────────────────────────────────────
function renderHeaderCard() {
  const name = iswPatientName(patient, profile, kyc) || `Pesakit ${patient.mrn || ''}`;
  document.getElementById('patient-avatar').textContent =
    name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  document.getElementById('patient-name').textContent = name;

  const chips = [statusChip(patient.status)];
  if (kyc) chips.push(statusChip(kyc.status).replace('">', '">Pendaftaran '));
  if (patient.kob_status) chips.push(chip('KOB: ' + escHtml(patient.kob_status), 'teal'));
  if (patient.outcome_status) chips.push(outcomeChip(patient.outcome_status));
  document.getElementById('chips-row').innerHTML = chips.join(' ');

  const phone = iswPatientPhone(patient, profile, kyc);
  const coachNm = patient.coach_id && staffMap[patient.coach_id] ? staffMap[patient.coach_id].full_name : null;
  const age = patient.date_of_birth ? Math.floor((Date.now() - new Date(patient.date_of_birth)) / 31557600000) : null;
  document.getElementById('patient-meta').innerHTML = [
    `🪪 ${escHtml(patient.mrn || '—')}`,
    age ? `🎂 ${age} tahun` : '',
    phone ? `📞 ${escHtml(phone)}` : '',
    patient.active_package_name ? `📦 ${escHtml(patient.active_package_name)}` : '',
    coachNm ? `🧑‍🏫 Coach: ${escHtml(coachNm)}` : '',
  ].filter(Boolean).map(t => `<span>${t}</span>`).join('');

  document.getElementById('link-hub').href = 'patient-hub.html?patient_id=' + selectedId;
}

// ── Kepatuhan mingguan — dikira LIVE dari psy_kepatuhan_log (macam kepatuhan.html),
// bukan sekadar baca psy_kepatuhan_weekly (yg cuma ada rekod bila coach override
// manual). Setiap minggu dari mula pakej sampai minggu ini SENTIASA papar, walau
// pesakit tak isi langsung (0 hari, kelas null → "Belum isi") — supaya reflect
// realiti sebenar, bukan sorok minggu yang tak diisi. Dikongsi antara KPI & kad.
function buildKepWeeks(kepWeekly, kepLog, plan) {
  if (!plan?.start_date) return [];
  const ymd = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  const addDays = (ds, n) => { const dt = new Date(ds + 'T00:00:00'); dt.setDate(dt.getDate() + n); return ymd(dt); };
  const mondayOf = ds => { const dt = new Date(ds + 'T00:00:00'); return addDays(ds, -((dt.getDay() + 6) % 7)); };
  const today = ymd(new Date());
  const elapsedDays = (start, end) => {
    const e = end > today ? today : end;
    if (e < start) return 0;
    return Math.round((new Date(e + 'T00:00:00') - new Date(start + 'T00:00:00')) / 86400000) + 1;
  };
  const weekDenom = ws => elapsedDays(ws, addDays(ws, 6));
  const classify = score => score == null ? null : (score >= 85 ? 'A' : score >= 50 ? 'B' : 'C');

  const overrideMap = {};
  (kepWeekly || []).forEach(w => { overrideMap[w.minggu_mula] = w; });
  const logsByWeek = {};
  (kepLog || []).forEach(l => { (logsByWeek[mondayOf(l.log_date)] ||= []).push(l); });

  const weeks = [];
  const curWk = mondayOf(today);
  let wk = mondayOf(plan.start_date);
  while (wk <= curWk) {
    const pl = logsByWeek[wk] || [];
    const avg = pl.length ? Math.round(pl.reduce((a, l) => a + (l.skor_harian != null ? l.skor_harian : 0), 0) / Math.max(weekDenom(wk), 1)) : null;
    const ov = overrideMap[wk];
    weeks.push({ minggu_mula: wk, skor: avg, kelas: classify(avg), override_kelas: ov?.override_kelas || null, bil_hari_isi: pl.length, nota_coach: ov?.nota_coach || '' });
    wk = addDays(wk, 7);
  }
  return weeks.reverse();
}

// ── KPI ───────────────────────────────────────────────
function renderKpis(weekly, kepWeeks, checkins, payments) {
  const totalWeeks = activePlan?.duration_weeks || weekly.length || 0;
  const curWeek    = activePlan?.current_week || 0;

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const past  = weekly.filter(w => w.session_date && new Date(w.session_date) <= today && w.status !== 'cancel');
  const hadir = past.filter(w => ['hadir', 'consultation_done'].includes(w.status));
  const pct   = past.length ? Math.round(hadir.length / past.length * 100) : null;

  const kepLatest = kepWeeks[0] || null;
  const kelas = kepLatest ? (kepLatest.override_kelas || kepLatest.kelas || '—') : '—';

  const d7 = new Date(); d7.setDate(d7.getDate() - 6); d7.setHours(0, 0, 0, 0);
  const ci7 = checkins.filter(c => new Date(c.checkin_date) >= d7).length;

  const paid = payments.filter(p => p.status === 'completed');
  const totalPaid = paid.reduce((s, p) => s + (Number(p.total) || 0), 0);

  document.getElementById('kpi-row').innerHTML = [
    statCard('Minggu Semasa', curWeek ? `${curWeek}/${totalWeeks}` : '—', activePlan ? escHtml(activePlan.name || '') : 'Tiada plan aktif'),
    statCard('Kehadiran Sesi', pct == null ? '—' : pct + '%', `${hadir.length}/${past.length} sesi hadir`),
    statCard('Kepatuhan', kelas, kepLatest ? `Skor ${kepLatest.skor ?? '—'}% · ${kepLatest.bil_hari_isi ?? 0} hari diisi` : 'Tiada rekod'),
    statCard('Check-in 7 Hari', `${ci7}/7`, checkins[0] ? 'Terakhir: ' + formatDate(checkins[0].checkin_date) : 'Tiada check-in'),
    statCard('Jumlah Bayaran', 'RM ' + totalPaid.toFixed(2), `${paid.length} resit selesai`),
  ].join('');
}

// ── Seksyen ───────────────────────────────────────────
function section(id, icon, title, count, bodyHtml, href, span2) {
  return `<div id="sec-${id}" class="bg-white rounded-2xl border border-ink/10 shadow-sm p-5 space-y-3 ${span2 ? 'lg:col-span-2' : ''} scroll-mt-32">
    <div class="flex items-center justify-between gap-2 flex-wrap">
      <h3 class="font-bold text-sm text-ink flex items-center gap-2">${icon} ${title}
        ${count != null ? `<span class="chip bg-ink/10 text-ink/60">${count}</span>` : ''}</h3>
      ${href ? `<a href="${href}" class="no-print text-xs font-semibold text-navy hover:underline">Buka →</a>` : ''}
    </div>
    ${bodyHtml}
  </div>`;
}
const emptyRow = msg => `<p class="text-xs text-ink/45 py-2">${msg || 'Tiada rekod.'}</p>`;
const tbl = (heads, rows) => rows.length
  ? `<div class="overflow-x-auto"><table class="tbl w-full"><thead><tr>${heads.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`
  : emptyRow();
// Papar N rekod terkini penuh; baki disorok di sebalik butang "Lihat X lagi" (expand
// inline, tiada reload) — elak kad jadi sangat panjang bila rekod banyak (cth 20+).
const PROG_PAGE = 5;
const moreBtn = (id, restLen) => restLen
  ? `<button type="button" onclick="document.getElementById('${id}').classList.remove('hidden'); this.remove();" class="mt-2 text-xs font-semibold text-navy hover:underline">Lihat ${restLen} rekod lagi ↓</button>`
  : '';
const tblPaged = (heads, rows, id, pageSize = PROG_PAGE) => {
  if (!rows.length) return emptyRow();
  const shown = rows.slice(0, pageSize), rest = rows.slice(pageSize);
  const theadHtml = `<tr>${heads.map(h => `<th>${h}</th>`).join('')}</tr>`;
  const restTbody = rest.length ? `<tbody id="pg-more-${id}" class="hidden">${rest.join('')}</tbody>` : '';
  return `<div class="overflow-x-auto"><table class="tbl w-full"><thead>${theadHtml}</thead><tbody>${shown.join('')}</tbody>${restTbody}</table></div>${moreBtn(`pg-more-${id}`, rest.length)}`;
};
const blocksPaged = (blocksHtml, id, pageSize = PROG_PAGE) => {
  if (!blocksHtml.length) return emptyRow();
  const shown = blocksHtml.slice(0, pageSize).join(''), rest = blocksHtml.slice(pageSize);
  const restDiv = rest.length ? `<div id="pg-more-${id}" class="hidden">${rest.join('')}</div>` : '';
  return shown + restDiv + moreBtn(`pg-more-${id}`, rest.length);
};

const WEEK_STATUS = {
  hadir: ['Hadir', 'bg-green-light text-green-dark'],
  consultation_done: ['Konsultasi Selesai', 'bg-green-light text-green-dark'],
  booked: ['Ditempah', 'bg-navy-light text-navy'],
  pending: ['Pending', 'bg-gold/30 text-gold-dark'],
  reschedule: ['Reschedule', 'bg-gold/30 text-gold-dark'],
  cancel: ['Batal', 'bg-terracotta/20 text-terracotta'],
  extension_pending_payment: ['Extension (Bayaran)', 'bg-gold/30 text-gold-dark'],
};
const weekChip = s => {
  const [lbl, cls] = WEEK_STATUS[s] || [s || '—', 'bg-ink/10 text-ink/60'];
  return `<span class="chip ${cls}">${escHtml(lbl)}</span>`;
};

function renderSections(d) {

const KEP_MONTH_NAMES = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
const KEP_DAY_LABELS = ['Aha', 'Isn', 'Sel', 'Rab', 'Kha', 'Jum', 'Sab'];
const kepCalYmd = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const kepDayColor = s => s == null ? null : (s >= 85 ? '#2E8B3E' : s >= 50 ? '#B8860B' : '#B85042');

function kepRenderCalendar() {
  const grid = document.getElementById('kep-cal-grid');
  if (!grid) return;
  if (kepCalYear == null) {
    const [y, m] = kepCalSelectedYmd.split('-').map(Number);
    kepCalYear = y; kepCalMonth = m - 1;
  }
  document.getElementById('kep-cal-month-label').textContent = `${KEP_MONTH_NAMES[kepCalMonth]} ${kepCalYear}`;
  const todayYmd = kepCalYmd(new Date());
  const firstDow = new Date(kepCalYear, kepCalMonth, 1).getDay();
  const daysInMonth = new Date(kepCalYear, kepCalMonth + 1, 0).getDate();
  const gridStart = new Date(kepCalYear, kepCalMonth, 1); gridStart.setDate(gridStart.getDate() - firstDow);
  const gridCells = Math.ceil((firstDow + daysInMonth) / 7) * 7;
  let html = KEP_DAY_LABELS.map(l => `<div class="text-center text-[9px] font-bold text-ink/35 uppercase py-1">${l}</div>`).join('');
  for (let i = 0; i < gridCells; i++) {
    const dt = new Date(gridStart); dt.setDate(dt.getDate() + i);
    const ymd = kepCalYmd(dt);
    const inMonth = dt.getMonth() === kepCalMonth;
    const isToday = ymd === todayYmd;
    const isSelected = ymd === kepCalSelectedYmd;
    const l = kepLogByDateFull[ymd];
    const dotColor = l ? kepDayColor(l.skor_harian) : null;
    html += `<button type="button" onclick="kepSelectDay('${ymd}')" class="h-10 flex flex-col items-center justify-center rounded-lg text-[12px] gap-0.5 transition-colors
    ${!inMonth ? 'text-ink/25' : 'text-ink'}
    ${isSelected ? 'bg-navy text-white font-bold' : isToday ? 'bg-navy/10 font-semibold' : 'hover:bg-cream/60'}">
    <span>${dt.getDate()}</span>
    <span class="w-1.5 h-1.5 rounded-full" style="background:${dotColor ? (isSelected ? '#fff' : dotColor) : 'transparent'}"></span>
  </button>`;
  }
  grid.innerHTML = html;
  kepRenderDayDetail(kepCalSelectedYmd);
}
function kepCalNav(dir) {
  kepCalMonth += dir;
  if (kepCalMonth < 0) { kepCalMonth = 11; kepCalYear--; }
  else if (kepCalMonth > 11) { kepCalMonth = 0; kepCalYear++; }
  kepRenderCalendar();
}
function kepSelectDay(ymd) {
  kepCalSelectedYmd = ymd;
  kepRenderCalendar();
}

// Pecahan item/amalan utk SATU hari sahaja (bukan konteks minggu penuh) — dipetik
// drpd corak "Pecahan Harian" kepatuhan.html, skop dipermudah ikut permintaan user.
function kepRenderDayDetail(ymd) {
  const host = document.getElementById('kep-day-detail');
  if (!host) return;
  const l = kepLogByDateFull[ymd];
  const dLbl = formatDate(ymd);
  if (!l) {
    host.innerHTML = `<div class="text-xs font-semibold text-ink/70 mb-1">${dLbl}</div><p class="text-xs text-ink/40 italic">Tiada rekod checklist untuk hari ini.</p>`;
    return;
  }
  const skorTxt = l.skor_harian != null ? l.skor_harian + '%' : '—';
  const itemsHtml = Object.entries(l.jawapan || {})
    .filter(([k]) => !k.endsWith('__text') && !k.includes('__lain__'))
    .map(([k, v]) => {
      const def = kepItemIndex[`${l.fasa}::${k}`];
      if (!def) return '';
      let valLbl;
      if (k === 'reaksi_pemulihan') {
        const arr = Array.isArray(v) ? v.map(x => String(x).split('::').pop()) : [];
        const lains = Object.entries(l.jawapan || {}).filter(([kk]) => kk.startsWith('reaksi_pemulihan__lain__')).map(([, vv]) => vv).filter(Boolean);
        valLbl = [...arr, ...lains].join(', ');
      } else {
        valLbl = Array.isArray(v) ? v.map(x => def.optMap[x] || x).join(', ') : (def.optMap[v] || v);
        const txt = l.jawapan[k + '__text']; if (txt) valLbl += ` (${escHtml(txt)})`;
      }
      return `<div class="flex justify-between gap-3 text-xs py-1 border-b border-ink/5"><span class="text-ink/55">${escHtml(def.label)}</span><span class="text-ink font-medium text-right">${escHtml(valLbl || '—')}</span></div>`;
    }).join('') || '<p class="text-xs text-ink/40 italic">Tiada amalan diisi.</p>';
  host.innerHTML = `<div class="flex items-center justify-between mb-2">
    <div class="text-xs font-semibold text-ink/70">${dLbl}</div>
    <span class="text-xs font-bold ${l.skor_harian == null ? 'text-ink/40' : l.skor_harian >= 85 ? 'text-green-dark' : l.skor_harian >= 50 ? 'text-gold-dark' : 'text-terracotta'}">${skorTxt}</span>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6">${itemsHtml}</div>`;
}

// ── Carta check-in (mood/tenaga/tidur) ────────────────
function renderCheckinChart(checkins) {
  const el = document.getElementById('checkin-chart');
  if (!el || !checkins.length) return;
  if (checkinChart) { checkinChart.destroy(); checkinChart = null; }
  const rows = [...checkins].sort((a, b) => a.checkin_date < b.checkin_date ? -1 : 1);
  const labels = rows.map(r => new Date(r.checkin_date).toLocaleDateString(LCALE(), { day: '2-digit', month: 'short' }));
  const mk = (label, key, color) => ({
    label, data: rows.map(r => r[key] ?? null), borderColor: color, backgroundColor: color,
    borderWidth: 2, pointRadius: 3, pointHoverRadius: 5, tension: .3, spanGaps: true,
  });
  checkinChart = new Chart(el, {
    type: 'line',
    data: { labels, datasets: [
      mk('Mood', 'mood_score', CHART_COLORS.mood),
      mk('Tenaga', 'energy_score', CHART_COLORS.tenaga),
      mk('Tidur', 'sleep_quality', CHART_COLORS.tidur),
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } },
      scales: {
        y: { min: 0, max: 10, ticks: { stepSize: 2, font: { size: 10 }, color: '#3c4f5c80' }, grid: { color: '#f1f5f9' } },
        x: { ticks: { font: { size: 9 }, color: '#3c4f5c80', maxTicksLimit: 12 }, grid: { display: false } },
      },
    },
  });
}
</script>
