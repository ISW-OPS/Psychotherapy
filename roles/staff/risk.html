<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Risk Alerts</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">⚠️</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-4">
        <div class="bg-terracotta-light border border-terracotta rounded-xl p-4 text-sm">
          <strong>SLA Protocol:</strong> All HIGH RISK & CRITICAL flags must be acknowledged within <strong>15 minutes</strong>.
        </div>

        <div class="flex gap-2 flex-wrap">
          <button onclick="filterRisk('open')" id="r-tab-open" class="px-4 py-2 rounded-full bg-terracotta text-white text-sm font-semibold">Open</button>
          <button onclick="filterRisk('acknowledged')" id="r-tab-ack" class="px-4 py-2 rounded-full bg-white border border-ink/20 text-sm">Acknowledged</button>
          <button onclick="filterRisk('resolved')" id="r-tab-resolved" class="px-4 py-2 rounded-full bg-white border border-ink/20 text-sm">Resolved</button>
        </div>

        <div id="risk-list" class="space-y-3"></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let allRisks = [];

async function loadRisks() {
  allRisks = await dbQuery('risk_alerts', { order: { col: 'created_at' } });
  filterRisk('open');
}

function filterRisk(status) {
  ['open','acknowledged','resolved'].forEach(s => {
    const btn = document.getElementById('r-tab-' + (s === 'acknowledged' ? 'ack' : s));
    btn.className = s === status
      ? 'px-4 py-2 rounded-full bg-terracotta text-white text-sm font-semibold'
      : 'px-4 py-2 rounded-full bg-white border border-ink/20 text-sm';
  });

  const filtered = allRisks.filter(r => r.status === status);
  document.getElementById('risk-list').innerHTML = filtered.length
    ? filtered.map(r => `
      <div class="bg-white rounded-xl p-4 border-l-4 ${r.severity === 'critical' || r.severity === 'high' ? 'border-terracotta' : 'border-gold'}">
        <div class="flex items-start justify-between gap-3 flex-wrap">
          <div class="flex-1 min-w-[250px]">
            <div class="flex items-center gap-2 mb-1 flex-wrap">
              <span class="chip ${r.severity === 'critical' || r.severity === 'high' ? 'bg-terracotta text-white' : 'bg-gold/30 text-gold-dark'}">${r.severity?.toUpperCase()}</span>
              <span class="chip bg-cream text-ink/60">${r.category || 'general'}</span>
              <span class="text-xs text-ink/50">${timeAgo(r.created_at)}</span>
            </div>
            <h4 class="font-bold">${r.patient_name || 'Patient'}</h4>
            <p class="text-sm text-ink/70 mt-1">${r.description}</p>
            <div class="text-xs text-ink/50 mt-2">Lapor oleh: ${r.created_by_name || '—'}</div>
          </div>
          <div class="flex flex-col gap-2">
            ${status === 'open' ? `<button onclick="ackRisk('${r.id}')" class="bg-navy text-white text-sm px-4 py-2 rounded-lg font-semibold">Acknowledge</button>` : ''}
            ${status !== 'resolved' ? `<button onclick="resolveRisk('${r.id}')" class="bg-green text-white text-sm px-4 py-2 rounded-lg">Resolve</button>` : ''}
          </div>
        </div>
      </div>`).join('')
    : `<div class="bg-white rounded-xl border border-ink/10 p-8 text-center text-ink/40 text-sm">Tiada risk ${status}</div>`;
}

async function ackRisk(id) {
  await dbUpdate('risk_alerts', id, { status: 'acknowledged', acknowledged_by: currentUser.id });
  await auditLog('risk.acknowledged', id);
  banner('Risk acknowledged');
  loadRisks();
}

async function resolveRisk(id) {
  await dbUpdate('risk_alerts', id, { status: 'resolved', resolved_at: new Date().toISOString() });
  await auditLog('risk.resolved', id);
  banner('Risk resolved');
  loadRisks();
}

(async () => {
  const user = await initStaff('risk', 'SLA 15 min · triage · escalate');
  if (!user) return;
  loadRisks();
})();
</script>
</body>
</html>
