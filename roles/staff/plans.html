<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Treatment Plans</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📋</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-6">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <h3 class="font-bold text-lg">Weekly Plan</h3>
          <!-- "+ Plan Baru" dibuang — plan dicipta automatik melalui aliran pakej (KOB/pembayaran). -->
        </div>

        <!-- Filter bar -->
        <div class="flex gap-2 flex-wrap">
          <input id="search-patient" oninput="filterPlans()" placeholder="Cari pesakit..." class="px-3 py-2 border border-ink/20 rounded-lg text-sm focus:outline-none focus:border-navy w-52">
          <select id="filter-status" onchange="filterPlans()" class="px-3 py-2 border border-ink/20 rounded-lg text-sm bg-white focus:outline-none focus:border-navy">
            <option value="">Semua Status</option>
            <option value="active">Aktif</option>
            <option value="completed">Selesai</option>
            <option value="paused">Tangguh</option>
          </select>
        </div>

        <!-- Patient plans list -->
        <div id="plans-list" class="flex flex-col gap-3"></div>
      </div>
    </main>
  </div>
</div>

<!-- Compliance Modal -->
<div id="compliance-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" onclick="closeCompliance()"></div>
  <div class="relative bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-hidden flex flex-col">
    <div class="p-5 border-b border-ink/10 flex items-center justify-between">
      <div>
        <h3 class="font-bold text-lg">🌿 Kepatuhan Rawatan</h3>
        <p id="cmp-subtitle" class="text-xs text-ink/60"></p>
      </div>
      <button onclick="closeCompliance()" class="text-ink/60 text-xl">×</button>
    </div>
    <div class="p-5 overflow-y-auto">
      <div class="grid grid-cols-2 gap-3 text-sm">
        <div><label class="text-xs font-semibold">🍯 Madu (sudu/hari)</label><input id="cmp-madu" type="number" min="0" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></div>
        <div><label class="text-xs font-semibold">🌬️ Nafas fitrah (kali/hari)</label><input id="cmp-nafas" type="number" min="0" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></div>
        <div><label class="text-xs font-semibold">🌍 Terapi bumi (min/hari)</label><input id="cmp-bumi" type="number" min="0" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></div>
        <div><label class="text-xs font-semibold">🥥 Air kelapa (kali/mgg)</label><input id="cmp-kelapa" type="number" min="0" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></div>
        <div><label class="text-xs font-semibold">💧 Terapi kolon (kali)</label><input id="cmp-kolon" type="number" min="0" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></div>
        <div class="col-span-2 grid grid-cols-2 gap-3">
          <div class="flex items-center justify-between bg-cream/50 px-3 py-2 rounded-lg">
            <span class="text-xs font-semibold">☀️ Berjemur</span>
            <div class="flex gap-3 text-xs">
              <label class="cursor-pointer"><input type="radio" name="cmp-jemur" value="true"> Ya</label>
              <label class="cursor-pointer"><input type="radio" name="cmp-jemur" value="false"> Tidak</label>
            </div>
          </div>
          <div class="flex items-center justify-between bg-cream/50 px-3 py-2 rounded-lg">
            <span class="text-xs font-semibold">🍽️ Pantang</span>
            <div class="flex gap-3 text-xs">
              <label class="cursor-pointer"><input type="radio" name="cmp-pantang" value="true"> Ya</label>
              <label class="cursor-pointer"><input type="radio" name="cmp-pantang" value="false"> Tidak</label>
            </div>
          </div>
        </div>
        <div class="col-span-2"><label class="text-xs font-semibold">📝 Nota coach</label><textarea id="cmp-notes" rows="2" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea></div>
      </div>
    </div>
    <div class="p-5 border-t border-ink/10 flex justify-end gap-2">
      <button onclick="closeCompliance()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm">Batal</button>
      <button onclick="saveCompliance()" class="bg-navy text-white px-4 py-2 rounded-lg text-sm font-semibold">Simpan</button>
    </div>
  </div>
</div>

<!-- Create Plan Modal -->
<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" onclick="closeModal()"></div>
  <div class="relative bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-hidden flex flex-col">
    <div class="p-5 border-b border-ink/10 flex items-center justify-between">
      <h3 class="font-bold text-lg">Cipta Treatment Plan</h3>
      <button onclick="closeModal()" class="text-ink/60 text-xl">×</button>
    </div>
    <div class="p-5 overflow-y-auto space-y-3">
      <div>
        <label class="text-xs font-semibold">Pesakit</label>
        <select id="m-patient" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold">Nama Plan</label>
          <input id="m-name" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm" placeholder="cth: BPS-S Plan 12 minggu">
        </div>
        <div>
          <label class="text-xs font-semibold">Tempoh (minggu)</label>
          <input id="m-weeks" type="number" value="12" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-bio">🧬 Bio Goals (1 per baris)</label>
        <textarea id="m-bio" rows="3" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
      </div>
      <div>
        <label class="text-xs font-semibold text-psycho">🧠 Psycho Goals</label>
        <textarea id="m-psycho" rows="3" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
      </div>
      <div>
        <label class="text-xs font-semibold text-social">👥 Social Goals</label>
        <textarea id="m-social" rows="3" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
      </div>
      <div>
        <label class="text-xs font-semibold text-spiritual">🕌 Spiritual Goals</label>
        <textarea id="m-spiritual" rows="3" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
      </div>
    </div>
    <div class="p-5 border-t border-ink/10 flex justify-end gap-2">
      <button onclick="closeModal()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm">Batal</button>
      <button onclick="savePlan()" class="bg-navy text-white px-4 py-2 rounded-lg text-sm font-semibold">Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function openModal() { document.getElementById('modal').classList.remove('hidden'); }
function closeModal() { document.getElementById('modal').classList.add('hidden'); }

async function savePlan() {
  const patient_id = document.getElementById('m-patient').value;
  const name = document.getElementById('m-name').value.trim();
  if (!patient_id || !name) { banner('Sila isi semua field', 'error'); return; }

  await dbInsert('psy_treatment_plans', {
    patient_id, doctor_id: window.currentUser.id,
    name, duration_weeks: parseInt(document.getElementById('m-weeks').value) || 12,
    current_week: 1,
    bio_goals: document.getElementById('m-bio').value.split('\n').filter(Boolean),
    psycho_goals: document.getElementById('m-psycho').value.split('\n').filter(Boolean),
    social_goals: document.getElementById('m-social').value.split('\n').filter(Boolean),
    spiritual_goals: document.getElementById('m-spiritual').value.split('\n').filter(Boolean),
    status: 'active',
  });
  await auditLog('plan.created', patient_id);
  banner('Plan dicipta');
  closeModal();
  loadPlans();
}

let allPlans = [];
let allPatientsMap = {};
let patientUserIdMap = {};
let _currentRole = '';
let _coachPatientIds = new Set();

async function loadPlans() {
  const [plansRes, patientsRes] = await Promise.all([
    window.db.from('psy_treatment_plans').select('*').order('created_at'),
    window.db.from('psy_patients').select('*, psy_profiles!psy_patients_user_id_fkey(full_name)')
  ]);
  allPlans = plansRes.data || [];
  const patients = patientsRes.data || [];
  patients.forEach(p => {
    const name = p.psy_profiles?.full_name || p.mrn || '—';
    allPatientsMap[p.id] = name;
    patientUserIdMap[p.id] = p.user_id;
  });
  if (_currentRole === 'coach') {
    _coachPatientIds = new Set(patients.filter(p => p.coach_id === window.currentUser.id).map(p => p.id));
  }
  filterPlans();
}

function renderPlansList(plans) {
  const el = document.getElementById('plans-list');
  if (!plans.length) {
    el.innerHTML = '<p class="text-ink/40 text-sm text-center py-10">Tiada treatment plan</p>';
    return;
  }
  el.innerHTML = plans.map(p => {
    const name     = allPatientsMap[p.patient_id] || '—';
    const initials = name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const week     = p.current_week || 1;
    const total    = p.duration_weeks || 0;
    const pct      = total ? Math.round((week / total) * 100) : 0;
    return `
    <div onclick="location.href='plan-week.html?plan_id=${p.id}&week=${week}'"
      class="bg-white rounded-xl border border-ink/10 p-4 cursor-pointer hover:border-navy hover:shadow-sm transition-all flex items-center gap-4">
      <div class="w-11 h-11 rounded-full bg-navy/10 flex items-center justify-center font-bold text-navy text-sm flex-shrink-0">${initials}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-bold text-sm">${name}</span>
          ${statusChip(p.status)}
        </div>
        <div class="text-xs text-ink/50 mt-0.5">${p.name}</div>
        <div class="mt-2 flex items-center gap-2">
          <div class="flex-1 h-1.5 bg-ink/10 rounded-full overflow-hidden">
            <div class="h-full bg-navy rounded-full" style="width:${pct}%"></div>
          </div>
          <span class="text-[11px] text-ink/50 whitespace-nowrap">Minggu ${week}/${total || '?'}</span>
        </div>
      </div>
      <div class="text-navy text-sm font-semibold whitespace-nowrap flex-shrink-0">Buka →</div>
    </div>`;
  }).join('');
}

function filterPlans() {
  const q      = (document.getElementById('search-patient')?.value || '').toLowerCase();
  const status = document.getElementById('filter-status')?.value || '';
  let plans    = allPlans;
  if (_currentRole === 'coach' && _coachPatientIds.size > 0) plans = plans.filter(p => _coachPatientIds.has(p.patient_id));
  if (q)      plans = plans.filter(p => (allPatientsMap[p.patient_id] || '').toLowerCase().includes(q) || p.name.toLowerCase().includes(q));
  if (status) plans = plans.filter(p => p.status === status);
  renderPlansList(plans);
}

async function openTracker(planId) {
  const plan = allPlans.find(p => p.id === planId);
  if (!plan) return;

  document.getElementById('tracker-section').classList.remove('hidden');
  document.getElementById('tracker-plan-name').textContent = plan.name;
  document.getElementById('tracker-patient').textContent = `${allPatientsMap[plan.patient_id] || '—'} · ${plan.duration_weeks} minggu`;

  const progress = await dbQuery('psy_plan_weekly_progress', { eq: { plan_id: planId }, order: { col: 'week_number', asc: true } }).catch(() => []);
  const progressMap = {};
  progress.forEach(p => { progressMap[p.week_number] = p; });

  const statusColors = {
    hadir: 'bg-green-light border-green text-green-dark',
    reschedule: 'bg-gold-light border-gold text-gold-dark',
    cancel: 'bg-terracotta-light border-terracotta text-terracotta',
    pending: 'bg-white border-ink/20 text-ink/60',
  };

  const statusColors2 = {
    hadir:      { bg:'bg-green-light', text:'text-green-dark', icon:'✅' },
    reschedule: { bg:'bg-gold-light',  text:'text-gold-dark',  icon:'🔄' },
    cancel:     { bg:'bg-terracotta-light', text:'text-terracotta', icon:'❌' },
    pending:    { bg:'bg-cream/40',    text:'text-ink/40',     icon:'⏳' },
  };

  let html = '';
  for (let w = 1; w <= plan.duration_weeks; w++) {
    const entry  = progressMap[w];
    const status = entry?.status || 'pending';
    const sc     = statusColors2[status] || statusColors2.pending;
    const isCurrent = w === plan.current_week;

    html += `<div onclick="location.href='plan-week.html?plan_id=${planId}&week=${w}'"
      class="bg-white rounded-xl border ${isCurrent ? 'border-navy' : 'border-ink/10'} p-4 flex items-center gap-4 cursor-pointer hover:shadow-sm hover:border-navy transition group">
      <div class="w-14 text-center flex-shrink-0">
        <div class="text-xs text-ink/50">Minggu</div>
        <div class="text-2xl font-bold ${isCurrent ? 'text-navy' : 'text-ink'}">${w}</div>
        ${isCurrent ? '<div class="text-[9px] font-bold text-navy uppercase">Semasa</div>' : ''}
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold ${sc.bg} ${sc.text}">
            ${sc.icon} ${status.charAt(0).toUpperCase() + status.slice(1)}
          </span>
          ${entry?.score != null ? `<span class="text-[11px] text-ink/60">⭐ ${entry.score}/10</span>` : ''}
        </div>
        ${entry?.notes ? `<div class="text-xs text-ink/50 mt-1 truncate">"${entry.notes}"</div>` : ''}
        ${entry?.session_date ? `<div class="text-[11px] text-ink/40 mt-0.5">📅 ${new Date(entry.session_date).toLocaleDateString('ms-MY', { day:'2-digit', month:'short', year:'numeric' })}</div>` : ''}
      </div>
      <div class="text-navy text-sm opacity-0 group-hover:opacity-100 transition">→</div>
    </div>`;
  }

  document.getElementById('tracker-weeks').innerHTML = html;
  document.getElementById('tracker-section').scrollIntoView({ behavior: 'smooth' });
}

async function markWeek(planId, patientId, week, status) {
  try {
    const existing = await dbQuery('psy_plan_weekly_progress', { eq: { plan_id: planId, week_number: week } }).catch(() => []);

    if (existing.length > 0) {
      await dbUpdate('psy_plan_weekly_progress', existing[0].id, {
        status,
        updated_by: window.currentUser.id,
        updated_by_name: window.currentUser.full_name,
        updated_at: new Date().toISOString(),
      });
    } else {
      const { error } = await window.db.from('psy_plan_weekly_progress').insert({
        plan_id: planId,
        patient_id: patientId,
        week_number: week,
        status,
        updated_by: window.currentUser.id,
        updated_by_name: window.currentUser.full_name,
        session_date: new Date().toISOString(),
      });
      if (error) throw error;
    }

    // Update current_week on treatment plan
    if (status === 'hadir') {
      const { error } = await window.db.from('psy_treatment_plans').update({ current_week: week }).eq('id', planId);
      if (error) console.warn(error);
    }

    await auditLog('plan.week_updated', planId, { week, status, patient: patientId });
    const patUid = patientUserIdMap[patientId];
    if (patUid && status === 'hadir')
      await notify(patUid, 'plan', `Kehadiran Minggu ${week} direkod ✅`, `Coach ${window.currentUser.full_name} telah mengesahkan kehadiran anda.`, 'plan.html');
    if (patUid && status === 'reschedule')
      await notify(patUid, 'plan', `Minggu ${week} perlu dijadual semula`, `Sila tempah sesi baharu untuk Minggu ${week}.`, 'plan.html');
    if (patUid && status === 'cancel')
      await notify(patUid, 'plan', `Sesi Minggu ${week} dibatalkan`, `Hubungi konsultasi untuk maklumat lanjut.`, 'plan.html');
    banner(`Minggu ${week}: ${status}`);
    openTracker(planId);
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  }
}

let cmpCtx = { planId: null, patientId: null, week: null, rowId: null };

async function openCompliance(planId, patientId, week) {
  cmpCtx = { planId, patientId, week, rowId: null };
  document.getElementById('cmp-subtitle').textContent = `${allPatientsMap[patientId] || '—'} · Minggu ${week}`;

  // Reset form
  ['cmp-madu','cmp-nafas','cmp-bumi','cmp-kelapa','cmp-kolon','cmp-notes'].forEach(id => document.getElementById(id).value = '');
  document.querySelectorAll('input[name="cmp-jemur"],input[name="cmp-pantang"]').forEach(i => i.checked = false);

  const rows = await dbQuery('psy_plan_compliance', { eq: { plan_id: planId, week_number: week } }).catch(() => []);
  const c = rows[0];
  if (c) {
    cmpCtx.rowId = c.id;
    const setN = (id, v) => { if (v != null) document.getElementById(id).value = v; };
    setN('cmp-madu', c.madu_sudu);
    setN('cmp-nafas', c.nafas_kali);
    setN('cmp-bumi', c.bumi_minit);
    setN('cmp-kelapa', c.kelapa_kali);
    setN('cmp-kolon', c.kolon_kali);
    setN('cmp-notes', c.notes);
    if (c.berjemur !== null) document.querySelector(`input[name="cmp-jemur"][value="${c.berjemur}"]`)?.click();
    if (c.pantang !== null) document.querySelector(`input[name="cmp-pantang"][value="${c.pantang}"]`)?.click();
  }

  document.getElementById('compliance-modal').classList.remove('hidden');
}

function closeCompliance() {
  document.getElementById('compliance-modal').classList.add('hidden');
}

async function saveCompliance() {
  const numOrNull = id => {
    const v = document.getElementById(id).value;
    return v === '' ? null : parseInt(v);
  };
  const radioBool = name => {
    const el = document.querySelector(`input[name="${name}"]:checked`);
    return el ? el.value === 'true' : null;
  };

  const data = {
    plan_id: cmpCtx.planId,
    patient_id: cmpCtx.patientId,
    week_number: cmpCtx.week,
    madu_sudu: numOrNull('cmp-madu'),
    nafas_kali: numOrNull('cmp-nafas'),
    bumi_minit: numOrNull('cmp-bumi'),
    berjemur: radioBool('cmp-jemur'),
    pantang: radioBool('cmp-pantang'),
    kelapa_kali: numOrNull('cmp-kelapa'),
    kolon_kali: numOrNull('cmp-kolon'),
    notes: document.getElementById('cmp-notes').value || null,
    updated_at: new Date().toISOString(),
  };

  try {
    if (cmpCtx.rowId) {
      await dbUpdate('psy_plan_compliance', cmpCtx.rowId, data);
    } else {
      await dbInsert('psy_plan_compliance', data);
    }
    await auditLog('plan.compliance_updated', cmpCtx.planId, { week: cmpCtx.week });
    banner('Kepatuhan disimpan');
    closeCompliance();
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  }
}

async function updateScore(planId, patientId, week, score) {
  const existing = await dbQuery('psy_plan_weekly_progress', { eq: { plan_id: planId, week_number: week } }).catch(() => []);
  if (existing.length > 0) {
    const parsed = parseInt(score) || null;
    await dbUpdate('psy_plan_weekly_progress', existing[0].id, { score: parsed });
    if (parsed) {
      const uid = patientUserIdMap[patientId];
      if (uid) await notify(uid, 'plan', `Skor Minggu ${week}: ${parsed}/10`, `Coach ${window.currentUser.full_name} telah merekod skor anda.`, 'plan.html');
    }
  }
}

async function updateNotes(planId, patientId, week, notes) {
  const existing = await dbQuery('psy_plan_weekly_progress', { eq: { plan_id: planId, week_number: week } }).catch(() => []);
  if (existing.length > 0) {
    await dbUpdate('psy_plan_weekly_progress', existing[0].id, { notes });
  }
}

(async () => {
  const user = await initStaff('plans', 'BPS-S · Attendance & Progress Tracker');
  if (!user) return;
  _currentRole = user.staff_role;
  if (_currentRole === 'coach' || _currentRole === 'manager') {
    document.getElementById('btn-new-plan')?.classList.add('hidden');
  }
  const res = await window.db.from('psy_patients').select('*, psy_profiles!psy_patients_user_id_fkey(full_name)').in('status', ['active', 'unregistered']);
  const patients = res.data || [];
  patients.forEach(p => {
    const name = p.psy_profiles?.full_name || p.mrn || '—';
    allPatientsMap[p.id] = name;
    patientUserIdMap[p.id] = p.user_id;
  });
  document.getElementById('m-patient').innerHTML = '<option value="">— Pilih pesakit —</option>' +
    patients.map(p => `<option value="${p.id}">${p.psy_profiles?.full_name || p.mrn}</option>`).join('');
  loadPlans();
})();
</script>
</body>
</html>
