<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Detail Acara</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#f7f8fa]">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📅</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6">
        <div class="flex items-center justify-between gap-3 flex-wrap mb-4">
          <button onclick="history.back()" class="inline-flex items-center gap-2 text-sm font-semibold text-ink/60 hover:text-navy">← Kembali ke Acara &amp; Kelas</button>
          <div id="top-actions" class="flex items-center gap-2 flex-wrap"></div>
        </div>
        <div id="wrap" class="grid grid-cols-1 lg:grid-cols-3 gap-5 items-start">
          <div class="lg:col-span-3 text-center py-16 text-ink/40 text-sm">Memuatkan...</div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Tukar Gambar (inline, dari tab Maklumat Asas) -->
<input id="banner-file" type="file" accept="image/*" class="hidden" onchange="previewBanner(this)">
<div id="crop-modal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-2xl w-full overflow-hidden flex flex-col">
    <div class="px-5 py-4 border-b border-ink/10 flex items-center justify-between">
      <h3 class="font-bold text-lg">Laras Banner</h3>
      <button onclick="closeCrop()" class="text-ink/50 text-xl leading-none">&times;</button>
    </div>
    <div class="p-4">
      <div class="bg-ink/5 rounded-xl overflow-hidden" style="max-height:58vh"><img id="crop-img" class="block max-w-full"></div>
      <div class="flex items-center justify-center gap-1.5 mt-3 flex-wrap">
        <button onclick="cropper&&cropper.zoom(0.1)" class="px-3 py-1.5 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5">🔍 Zoom +</button>
        <button onclick="cropper&&cropper.zoom(-0.1)" class="px-3 py-1.5 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5">🔍 Zoom −</button>
        <span class="w-px h-5 bg-ink/15 mx-1"></span>
        <button onclick="cropper&&cropper.move(-25,0)" class="w-9 h-9 border border-ink/20 rounded-lg hover:bg-ink/5" title="Kiri">←</button>
        <button onclick="cropper&&cropper.move(25,0)" class="w-9 h-9 border border-ink/20 rounded-lg hover:bg-ink/5" title="Kanan">→</button>
        <button onclick="cropper&&cropper.move(0,-25)" class="w-9 h-9 border border-ink/20 rounded-lg hover:bg-ink/5" title="Atas">↑</button>
        <button onclick="cropper&&cropper.move(0,25)" class="w-9 h-9 border border-ink/20 rounded-lg hover:bg-ink/5" title="Bawah">↓</button>
        <button onclick="cropper&&cropper.reset()" class="px-3 py-1.5 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5">↺ Reset</button>
      </div>
      <p class="text-[11px] text-ink/45 text-center mt-2">Seret gambar untuk gerak · butang untuk zoom &amp; arah. Nisbah 2:1.</p>
    </div>
    <div class="px-5 py-4 border-t border-ink/10 flex gap-2">
      <button onclick="closeCrop()" class="flex-1 border border-ink/20 text-ink/60 py-2.5 rounded-xl text-sm font-semibold hover:bg-ink/5">Batal</button>
      <button onclick="applyCrop()" class="flex-1 bg-navy text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-navy-dark">✓ Simpan Banner</button>
    </div>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script src="../../shared/inventoryStock.js"></script>
<script>
    function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
const TYPE = {
  kelas:{ l:'KELAS', grad:'from-navy to-teal', emoji:'🧘', badge:'bg-green-600' },
  webinar:{ l:'WEBINAR', grad:'from-[#2f7fc8] to-[#54b3cf]', emoji:'🎥', badge:'bg-navy' },
  bimbingan_pra_ob:{ l:'BIMBINGAN PRA OB', grad:'from-green to-green-dark', emoji:'🌱', badge:'bg-teal' },
  komuniti:{ l:'KOMUNITI', grad:'from-green to-green-dark', emoji:'🤝', badge:'bg-teal' },
  manzil:{ l:'BACAAN MANZIL', grad:'from-[#0e2a4a] to-[#16604a]', emoji:'🕌', badge:'bg-purple-600' },
  challenge:{ l:'CHALLENGE', grad:'from-gold to-gold-dark', emoji:'🏆', badge:'bg-gold-dark' },
  default:{ l:'ACARA', grad:'from-navy to-navy-dark', emoji:'📅', badge:'bg-navy' },
};
function ty() { return TYPE[EV.type] || TYPE.default; }
function fmtDate(d){ return d?new Date(d).toLocaleDateString(LCALE(),{weekday:'long',day:'2-digit',month:'long',year:'numeric'}):'—'; }
function fmtT(d){ return d?new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):''; }
function fmtDateTime(d){ return d?new Date(d).toLocaleDateString(LCALE(),{day:'2-digit',month:'short',year:'numeric'})+' '+new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):''; }
function timeRange(){ const t1=fmtT(EV.start_at), t2=EV.end_at?fmtT(EV.end_at):''; let dur=''; if(EV.end_at){const m=Math.round((new Date(EV.end_at)-new Date(EV.start_at))/60000); dur=' ('+(m>=60?Math.floor(m/60)+' Jam '+(m%60?(m%60)+' Minit':''):m+' Minit').trim()+')';} return `${t1}${t2?' – '+t2:''}${dur}`; }
function statusDisp(){ if(EV.status==='draft')return{l:'Draft',c:'text-ink/55'}; if(EV.status==='cancelled')return{l:'Dibatalkan',c:'text-terracotta'}; if(EV.status==='completed')return{l:'Selesai',c:'text-navy'}; return new Date(EV.start_at)>new Date()?{l:'Scheduled',c:'text-[#1d4ed8]'}:{l:'Published',c:'text-green-dark'}; }
function audLabel(a){ if(!Array.isArray(a)||!a.length)return'Semua Pengguna'; if(a.includes('patient')&&a.length===1)return'Semua Pesakit'; const m={patient:'Pesakit',staff:'Staff',doctor:'Doktor',coach:'Coach',admin:'Admin'}; return a.length>=5?'Semua Pengguna':a.map(x=>m[x]||x).join(', '); }

let EV = null, REGS = [], CREATOR = '', TAB = 'info', MATERIALS = [];
let PIC_PROFILE = null, CANCELLED_COUNT = 0, cropper = null;
let pkSearch = '', pkStatusFilter = '', pkAttFilter = '', pkPage = 1;
const PK_PAGE_SIZE = 10;
let PREP_ITEMS = [], TASKS = [], INV_ITEMS = [], EQUIP_ITEMS = [], PREP_META = { notes: '', deadline_date: null };
let prepFilter = 'all', prepChecked = new Set();
let TEMPLATES = [], TEMPLATE_ITEMS = {};
let STAFF_LIST = [];
let ITEM_RETURNS = [];
let retFilter = 'all';

const EQUIP_STATUS_META = {
  available:         { label: '🟢 Available',         key: 'ready' },
  in_use:            { label: '🔵 In Use',             key: 'notready' },
  under_maintenance: { label: '🔧 Maintenance',        key: 'notready' },
  damaged:           { label: '🔴 Damaged',            key: 'notready' },
  lost:              { label: '🔴 Lost',               key: 'notready' },
  retired:           { label: '⚪ Retired',             key: 'notready' },
};
const MANUAL_STATUS_META = {
  ready:         { label: '✅ Selesai',       cls: 'bg-green-100 text-green-700' },
  preparing:     { label: '🔄 Dalam Proses',  cls: 'bg-amber-100 text-amber-700' },
  pending:       { label: '⏳ Belum Mula',    cls: 'bg-ink/10 text-ink/50' },
  not_available: { label: '🔴 Tak Dapat',     cls: 'bg-red-100 text-red-600' },
};
const TASK_STATUS_META = {
  selesai:        { label: '✅ Selesai',       cls: 'bg-green-100 text-green-700' },
  dalam_proses:   { label: '🔄 Dalam Proses',  cls: 'bg-amber-100 text-amber-700' },
  belum_mula:     { label: '⏳ Belum Mula',    cls: 'bg-ink/10 text-ink/50' },
};
const TASK_PRESETS = [
  'Cetak borang pendaftaran',
  'Sediakan tag nama peserta',
  'Pasang kerusi & meja',
  'Pasang backdrop / banner',
  'Uji projektor & sistem bunyi',
  'Sediakan borang maklum balas',
  'Hubungi vendor katering',
  'Hantar reminder WhatsApp kepada peserta',
  'Semak senarai kehadiran',
  'Bersihkan & susun lokasi selepas acara',
];
function prepUid() { return 'tmp_' + Math.random().toString(36).slice(2) + Date.now(); }
function prepEscHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function prepInvStock(id) { const it = INV_ITEMS.find(i => i.id === id); return it ? Number(it.qty_in_stock || 0) : null; }

// Senarai gabungan item (psy_event_prep_items) + tugasan (psy_event_checklist_tasks)
// jadi SATU jadual, dibezakan ikut Sumber: Inventory ISW (inventory/equipment) /
// Pembelian Event (manual) / Persediaan (tugasan).
function prepRows() {
  const items = PREP_ITEMS.map(it => ({ _key: it.id, _kind: 'item', ...it }));
  const tasks = TASKS.map(t => ({ _key: t.id, _kind: 'task', ...t }));
  return [...items, ...tasks];
}
function prepSumber(row) {
  if (row._kind === 'task') return { label: 'Persediaan', cls: 'bg-teal/10 text-teal' };
  if (row.source === 'manual') return { label: 'Pembelian Event', cls: 'bg-purple-100 text-purple-700' };
  return { label: 'Inventory ISW', cls: 'bg-navy/10 text-navy' };
}
function prepRowStatus(row) {
  if (row._kind === 'task') {
    const m = TASK_STATUS_META[row.status] || TASK_STATUS_META.belum_mula;
    return { ...m, bucket: row.status === 'selesai' ? 'ready' : row.status === 'dalam_proses' ? 'progress' : 'pending' };
  }
  if (row.source === 'equipment' && row.equipment_id) {
    const eq = EQUIP_ITEMS.find(e => e.id === row.equipment_id);
    const m = eq ? (EQUIP_STATUS_META[eq.status] || { label: eq.status, key: 'notready' }) : { label: '—', key: 'notready' };
    return { label: m.label, cls: m.key === 'ready' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600', bucket: m.key === 'ready' ? 'ready' : 'notready' };
  }
  if (row.source === 'inventory' && row.inventory_item_id) {
    const stock = prepInvStock(row.inventory_item_id);
    const cukup = stock === null || stock >= Number(row.qty_needed);
    return cukup
      ? { label: '🟢 Mencukupi', cls: 'bg-green-100 text-green-700', bucket: 'ready' }
      : { label: '🔴 Tidak Cukup', cls: 'bg-red-100 text-red-600', bucket: 'notready' };
  }
  // manual (Pembelian Event) — status ditetapkan staff sendiri
  const m = MANUAL_STATUS_META[row.status] || MANUAL_STATUS_META.pending;
  const bucket = row.status === 'ready' ? 'ready' : row.status === 'preparing' ? 'progress' : row.status === 'not_available' ? 'notready' : 'pending';
  return { ...m, bucket };
}
function prepStats() {
  const rows = prepRows();
  const total = rows.length;
  const counts = { ready: 0, progress: 0, pending: 0, notready: 0 };
  rows.forEach(r => { counts[prepRowStatus(r).bucket]++; });
  const pct = total ? Math.round((counts.ready / total) * 100) : 0;
  return { total, pct, ...counts };
}

function counts() {
  const active = REGS.filter(r => r.status !== 'batal');
  const pendaftar = active.length;
  const hadir = active.filter(r => r.status === 'hadir').length;
  const tdk = active.filter(r => r.status === 'tak_hadir').length;
  const rate = pendaftar ? Math.round(hadir / pendaftar * 100) : 0;
  return { pendaftar, hadir, tdk, rate, kapasiti: EV.capacity || '∞' };
}

function setTab(t) { TAB = t; render(); }

// ── Persediaan Event: toolbar + filter chip + jadual gabungan ──────
function prepFilterCounts() {
  const rows = prepRows();
  return {
    all: rows.length,
    inv: rows.filter(r => r._kind === 'item' && r.source !== 'manual').length,
    manual: rows.filter(r => r._kind === 'item' && r.source === 'manual').length,
    task: rows.filter(r => r._kind === 'task').length,
  };
}
function prepFilteredRows() {
  const rows = prepRows();
  if (prepFilter === 'inv') return rows.filter(r => r._kind === 'item' && r.source !== 'manual');
  if (prepFilter === 'manual') return rows.filter(r => r._kind === 'item' && r.source === 'manual');
  if (prepFilter === 'task') return rows.filter(r => r._kind === 'task');
  return rows;
}
function prepChip(key, label, n) {
  return `<button onclick="prepSetFilter('${key}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${prepFilter===key?'bg-navy text-white':'bg-ink/5 text-ink/60 hover:bg-ink/10'}">${label} (${n})</button>`;
}
function prepTypePickOpts(row) {
  const eqByCat = {};
  EQUIP_ITEMS.filter(e => e.status !== 'retired').forEach(eq => { (eqByCat[eq.category || 'Lain-lain'] = eqByCat[eq.category || 'Lain-lain'] || []).push(eq); });
  const eqGroups = Object.keys(eqByCat).sort().map(cat => `<optgroup label="🔧 ${prepEscHtml(cat)}">${
    eqByCat[cat].map(eq => `<option value="eq:${eq.id}" ${row.equipment_id === eq.id ? 'selected' : ''}>${prepEscHtml(eq.name)} (${prepEscHtml(eq.code)}) — ${(EQUIP_STATUS_META[eq.status]||{label:eq.status}).label}</option>`).join('')
  }</optgroup>`).join('');
  const invByCat = {};
  INV_ITEMS.forEach(inv => { (invByCat[inv.category || 'Lain-lain'] = invByCat[inv.category || 'Lain-lain'] || []).push(inv); });
  const invGroups = Object.keys(invByCat).sort().map(cat => `<optgroup label="📦 ${prepEscHtml(cat)}">${
    invByCat[cat].map(inv => `<option value="${inv.id}" ${row.source === 'inventory' && row.inventory_item_id === inv.id ? 'selected' : ''}>${prepEscHtml(inv.name)}</option>`).join('')
  }</optgroup>`).join('');
  return `<option value="">— Pilih —</option>`
    + `<option value="__manual__" ${row.source === 'manual' ? 'selected' : ''}>🛍️ Pembelian Event (taip nama)</option>`
    + eqGroups + invGroups;
}
function prepRowHtml(row) {
  const checked = prepChecked.has(row._key);
  const st = prepRowStatus(row);
  if (row._kind === 'task') {
    const statusOpts = Object.keys(TASK_STATUS_META).map(k => `<option value="${k}" ${row.status===k?'selected':''}>${TASK_STATUS_META[k].label}</option>`).join('');
    const isCustom = row._customMode || (row.task && !TASK_PRESETS.includes(row.task));
    const taskOpts = `<option value="">— Pilih tugasan —</option>`
      + TASK_PRESETS.map(p => `<option value="${prepEscHtml(p)}" ${row.task===p?'selected':''}>${prepEscHtml(p)}</option>`).join('')
      + `<option value="__custom__" ${isCustom?'selected':''}>✏️ Tugasan Lain (taip sendiri)</option>`;
    return `<div class="grid gap-2 items-center px-4 py-2.5 hover:bg-ink/[0.015]" style="grid-template-columns:28px 2fr 130px 90px 80px 110px 120px 150px 50px">
      <div><input type="checkbox" ${checked?'checked':''} onchange="prepToggleCheck('${row._key}')" class="w-4 h-4"></div>
      <div>
        <select onchange="prepOnTaskPicked('${row._key}', this.value)" class="w-full px-1.5 py-1 border border-ink/15 rounded-lg text-sm bg-white">${taskOpts}</select>
        ${isCustom ? `<input type="text" placeholder="Taip tugasan" value="${prepEscHtml(row.task||'')}" onchange="prepUpdateTask('${row._key}','task', this.value)" class="w-full mt-1 px-1.5 py-1 border border-ink/15 rounded-lg text-sm">` : ''}
      </div>
      <div><span class="text-[10px] font-semibold px-2 py-1 rounded-full ${prepSumber(row).cls}">${prepSumber(row).label}</span></div>
      <div class="text-center text-ink/30">—</div>
      <div class="text-center text-ink/30">—</div>
      <div><input type="date" value="${row.target_date||''}" onchange="prepUpdateTask('${row._key}','target_date', this.value||null)" class="w-full px-1.5 py-1 border border-ink/15 rounded-lg text-[11px]"></div>
      <div class="text-center text-ink/30">—</div>
      <div><select onchange="prepUpdateTask('${row._key}','status', this.value)" class="w-full text-[11px] font-semibold px-1.5 py-1 rounded-lg border-0 ${st.cls}">${statusOpts}</select></div>
      <div class="text-right"><button onclick="prepDeleteRow('${row._key}','task')" class="text-ink/30 hover:text-terracotta text-sm">✕</button></div>
    </div>`;
  }
  const stock = row.source === 'inventory' ? prepInvStock(row.inventory_item_id) : null;
  const manualStatusOpts = Object.keys(MANUAL_STATUS_META).map(k => `<option value="${k}" ${row.status===k?'selected':''}>${MANUAL_STATUS_META[k].label}</option>`).join('');
  const picOpts = '<option value="">—</option>' + STAFF_LIST.map(s => `<option value="${s.id}" ${row.pic_id===s.id?'selected':''}>${prepEscHtml(s.full_name||'—')}</option>`).join('');
  return `<div class="grid gap-2 items-center px-4 py-2.5 hover:bg-ink/[0.015]" style="grid-template-columns:28px 2fr 130px 90px 80px 110px 120px 150px 50px">
    <div><input type="checkbox" ${checked?'checked':''} onchange="prepToggleCheck('${row._key}')" class="w-4 h-4"></div>
    <div>
      <select onchange="prepOnTypePicked('${row._key}', this.value)" class="w-full px-1.5 py-1 border border-ink/15 rounded-lg text-sm bg-white">${prepTypePickOpts(row)}</select>
      ${row.source === 'manual' ? `<input type="text" placeholder="Nama barang" value="${prepEscHtml(row.item_name||'')}" onchange="prepUpdateItem('${row._key}','item_name', this.value)" class="w-full mt-1 px-1.5 py-1 border border-ink/15 rounded-lg text-sm">` : ''}
    </div>
    <div><span class="text-[10px] font-semibold px-2 py-1 rounded-full ${prepSumber(row).cls}">${prepSumber(row).label}</span></div>
    <div class="text-center"><input type="number" min="0.01" step="0.01" value="${Number(row.qty_needed||1)}" onchange="prepUpdateItem('${row._key}','qty_needed', this.value)" class="w-16 text-center px-1 py-1 border border-ink/15 rounded-lg text-sm"></div>
    <div class="text-center text-sm ${st.bucket==='notready'?'font-bold text-red-600':'text-ink/60'}">${row.source==='manual'?'—':(stock===null?'—':stock)}</div>
    <div><input type="date" value="${row.deadline_date||''}" onchange="prepUpdateItem('${row._key}','deadline_date', this.value||null)" class="w-full px-1.5 py-1 border border-ink/15 rounded-lg text-[11px]"></div>
    <div><select onchange="prepUpdateItem('${row._key}','pic_id', this.value||null)" class="w-full text-[11px] px-1.5 py-1 border border-ink/15 rounded-lg bg-white">${picOpts}</select></div>
    <div>${row.source === 'manual'
      ? `<select onchange="prepUpdateItem('${row._key}','status', this.value)" class="w-full text-[11px] font-semibold px-1.5 py-1 rounded-lg border-0 ${st.cls}">${manualStatusOpts}</select>`
      : `<span class="text-[11px] font-semibold px-2 py-1 rounded-full ${st.cls}">${st.label}</span>`}</div>
    <div class="text-right"><button onclick="prepDeleteRow('${row._key}','item')" class="text-ink/30 hover:text-terracotta text-sm">✕</button></div>
  </div>`;
}
function prepTabHtml() {
  const fc = prepFilterCounts();
  const rows = prepFilteredRows();
  return `
    <div class="flex items-center justify-between gap-3 flex-wrap mb-3">
      <div>
        <h2 class="text-sm font-bold text-ink">Senarai Persediaan Event</h2>
        <p class="text-[11px] text-ink/40 mt-0.5">Senarai barang dan tugasan yang perlu disediakan sebelum acara bermula.</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="prepAddRow('item')" class="bg-navy text-white px-3 py-2 rounded-lg text-xs font-semibold hover:bg-navy-dark">+ Tambah Item</button>
        <button onclick="prepAddRow('task')" class="border border-teal/30 text-teal px-3 py-2 rounded-lg text-xs font-semibold hover:bg-teal hover:text-white">+ Tambah Tugasan</button>
        <button onclick="prepOpenSaveTemplateModal()" ${prepRows().length?'':'disabled'} class="border border-ink/15 text-ink/70 px-3 py-2 rounded-lg text-xs font-semibold hover:bg-ink/5 disabled:opacity-40 disabled:cursor-not-allowed">💾 Simpan Template</button>
      </div>
    </div>
    <div class="flex items-center gap-2 flex-wrap mb-3 bg-cream/50 border border-ink/5 rounded-xl px-3 py-2">
      <label class="flex items-center gap-1.5 text-[12px] font-semibold text-ink/70 cursor-pointer">
        <input type="checkbox" id="prep-use-tpl" class="w-4 h-4 accent-navy" onchange="prepToggleTemplateUse(this.checked)"> Gunakan template persediaan
      </label>
      <select id="prep-tpl-select" disabled class="px-2 py-1.5 border border-ink/15 rounded-lg text-xs bg-white disabled:opacity-40">
        <option value="">— Pilih template —</option>
        ${TEMPLATES.map(t => `<option value="${t.id}">${prepEscHtml(t.name)} (${(TEMPLATE_ITEMS[t.id]||[]).length} barang)</option>`).join('')}
      </select>
      <button onclick="prepApplyTemplate()" class="bg-navy/90 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-navy">Guna Template</button>

async function prepPersistItem(row) {
  if (!row.source) return;
  const payload = {
    source: row.source, inventory_item_id: row.inventory_item_id || null, equipment_id: row.equipment_id || null,
    item_name: row.item_name, category: row.category || null, unit: row.unit || null,
    qty_needed: row.qty_needed, deadline_date: row.deadline_date || null, status: row.status || 'pending',
    pic_id: row.pic_id || null,
  };
  if (row.id) {
    await window.db.from('psy_event_prep_items').update({ ...payload, updated_at: new Date().toISOString() }).eq('id', row.id);
  } else if (row.source === 'inventory' || row.source === 'equipment' || row.item_name) {
    const { data, error } = await window.db.from('psy_event_prep_items').insert({ event_id: EV.id, ...payload }).select().single();
    if (!error) { row.id = data.id; row._key = data.id; }
  }
}
async function prepPersistTask(row) {
  const payload = { task: row.task, target_date: row.target_date || null, status: row.status || 'belum_mula' };
  if (row.id) {
    await window.db.from('psy_event_checklist_tasks').update({ ...payload, updated_at: new Date().toISOString() }).eq('id', row.id);
  } else if (row.task) {
    const { data, error } = await window.db.from('psy_event_checklist_tasks').insert({ event_id: EV.id, ...payload }).select().single();
    if (!error) { row.id = data.id; row._key = data.id; }
  }
}

function prepAddRow(kind) {
  if (kind === 'task') {
    TASKS.push({ _key: prepUid(), id: null, task: '', target_date: null, status: 'belum_mula' });
  } else {
    PREP_ITEMS.push({ _key: prepUid(), id: null, source: null, inventory_item_id: null, equipment_id: null, item_name: '', category: null, unit: null, qty_needed: 1, deadline_date: null, status: 'pending', pic_id: null });
  }
  render();
}
window.prepAddRow = prepAddRow;

async function prepOnTypePicked(key, value) {
  const row = PREP_ITEMS.find(i => i._key === key);
  if (!row) return;
  if (!value) { row.source = null; row.inventory_item_id = null; row.equipment_id = null; row.item_name = ''; row.category = null; row.unit = null; }
  else if (value === '__manual__') { row.source = 'manual'; row.inventory_item_id = null; row.equipment_id = null; row.item_name = ''; row.category = null; row.unit = null; row.status = row.status || 'pending'; }
  else if (value.startsWith('eq:')) {
    const eq = EQUIP_ITEMS.find(e => e.id === value.slice(3));
    row.source = 'equipment'; row.inventory_item_id = null; row.equipment_id = eq?.id || null;
    row.item_name = eq?.name || ''; row.category = eq?.category || null; row.unit = null;
  } else {
    const it = INV_ITEMS.find(i => i.id === value);
    row.source = 'inventory'; row.inventory_item_id = value; row.equipment_id = null;
    row.item_name = it?.name || ''; row.category = it?.category || null; row.unit = it?.unit || null;
  }
  await prepPersistItem(row);
  render();
}
window.prepOnTypePicked = prepOnTypePicked;

async function prepUpdateItem(key, field, value) {
  const row = PREP_ITEMS.find(i => i._key === key);
  if (!row) return;
  row[field] = value;
  await prepPersistItem(row);
  render();
}
window.prepUpdateItem = prepUpdateItem;

async function prepUpdateTask(key, field, value) {
  const row = TASKS.find(t => t._key === key);
  if (!row) return;
  row[field] = value;
  await prepPersistTask(row);
  render();
}
window.prepUpdateTask = prepUpdateTask;

async function prepOnTaskPicked(key, value) {
  const row = TASKS.find(t => t._key === key);
  if (!row) return;
  row._customMode = value === '__custom__';
  row.task = row._customMode ? '' : value;
  await prepPersistTask(row);
  render();
}
window.prepOnTaskPicked = prepOnTaskPicked;

async function prepDeleteRow(key, kind) {
  if (!confirm('Padam rekod ni?')) return;
  if (kind === 'task') {
    const row = TASKS.find(t => t._key === key);
    if (row?.id) { const { error } = await window.db.from('psy_event_checklist_tasks').delete().eq('id', row.id); if (error) { banner('Ralat: ' + error.message, 'error'); return; } }
    TASKS = TASKS.filter(t => t._key !== key);
  } else {
    const row = PREP_ITEMS.find(i => i._key === key);
    if (row?.id) { const { error } = await window.db.from('psy_event_prep_items').delete().eq('id', row.id); if (error) { banner('Ralat: ' + error.message, 'error'); return; } }
    PREP_ITEMS = PREP_ITEMS.filter(i => i._key !== key);
  }
  prepChecked.delete(key);
  render();
}
window.prepDeleteRow = prepDeleteRow;

function prepToggleCheck(key) {
  if (prepChecked.has(key)) prepChecked.delete(key); else prepChecked.add(key);
  render();
}
window.prepToggleCheck = prepToggleCheck;

async function prepBulkDelete() {
  if (!confirm(`Padam ${prepChecked.size} rekod dipilih?`)) return;
  const keys = [...prepChecked];
  for (const key of keys) {
    const taskRow = TASKS.find(t => t._key === key);
    if (taskRow) {
      if (taskRow.id) await window.db.from('psy_event_checklist_tasks').delete().eq('id', taskRow.id);
      TASKS = TASKS.filter(t => t._key !== key);
      continue;
    }
    const itemRow = PREP_ITEMS.find(i => i._key === key);
    if (itemRow) {
      if (itemRow.id) await window.db.from('psy_event_prep_items').delete().eq('id', itemRow.id);
      PREP_ITEMS = PREP_ITEMS.filter(i => i._key !== key);
    }
  }
  prepChecked.clear();
  render();
}
window.prepBulkDelete = prepBulkDelete;

function prepSetFilter(f) { prepFilter = f; render(); }
window.prepSetFilter = prepSetFilter;

async function prepApplyTemplate() {
  const templateId = document.getElementById('prep-tpl-select').value;
  if (!templateId) { banner('Sila pilih template dulu', 'error'); return; }
  const tItems = TEMPLATE_ITEMS[templateId] || [];
  if (!tItems.length) { banner('Template ini tiada barang', 'error'); return; }
  if (!confirm(`Import ${tItems.length} barang dari template ini ke senarai sekarang?`)) return;
  for (const it of tItems) {
    const payload = {
      event_id: EV.id, source: it.source, inventory_item_id: it.inventory_item_id,
      item_name: it.item_name, category: it.category, unit: it.unit, qty_needed: it.qty_needed, status: 'pending',
    };
    const { data, error } = await window.db.from('psy_event_prep_items').insert(payload).select().single();
    if (!error) PREP_ITEMS.push({ ...data, _key: data.id });
  }
  await window.db.from('psy_event_prep_meta').upsert({ event_id: EV.id, template_id: templateId, notes: PREP_META.notes, deadline_date: PREP_META.deadline_date, updated_at: new Date().toISOString() }, { onConflict: 'event_id' });
  PREP_META.template_id = templateId;
  banner(`${tItems.length} barang diimport dari template ✓`, 'ok');
  render();
}
window.prepApplyTemplate = prepApplyTemplate;

function prepOpenSaveTemplateModal() {

async function prepSubmitSaveTemplate() {
  const name = document.getElementById('prep-tpl-name').value.trim();
  if (!name) { banner('Sila isi nama template', 'error'); return; }
  const { data: tpl, error } = await window.db.from('psy_event_prep_templates')
    .insert({ name, description: document.getElementById('prep-tpl-desc').value.trim() || null, created_by: window.currentUser?.id || null }).select().single();
  if (error) { banner('Ralat simpan: ' + error.message, 'error'); return; }
  const srcItems = PREP_ITEMS.filter(it => it.source === 'inventory' || it.source === 'manual');
  const rows = srcItems.map(it => ({
    template_id: tpl.id, source: it.source, inventory_item_id: it.inventory_item_id,
    item_name: it.item_name, category: it.category, unit: it.unit, qty_needed: it.qty_needed,
  }));
  if (rows.length) await window.db.from('psy_event_prep_template_items').insert(rows);
  TEMPLATES.unshift(tpl);
  TEMPLATE_ITEMS[tpl.id] = rows;
  prepCloseSaveTemplateModal();
  banner('Template disimpan ✓', 'ok');
  render();
}

function pkRegStatus(r) {
  return r.status === 'batal' ? { label: 'Batal', cls: 'bg-terracotta/10 text-terracotta' } : { label: 'Berdaftar', cls: 'bg-green/10 text-green-dark' };
}
function pkAttStatus(r) {
  if (r.status === 'batal') return { label: '—', cls: 'text-ink/30' };
  if (r.status === 'hadir') return { label: 'Hadir', cls: 'bg-green/10 text-green-dark' };
  if (r.status === 'tak_hadir') return { label: 'Tidak Hadir', cls: 'bg-terracotta/10 text-terracotta' };
  return { label: 'Belum Direkodkan', cls: 'bg-amber-100 text-amber-700' };
}
function pkSumber(r) { return r.source === 'manual' ? 'Staf Manual' : r.source === 'portal' ? 'Portal Patient' : '—'; }

function pkFilteredRows() {
  const q = pkSearch.toLowerCase().trim();
  return REGS.filter(r => {
    const p = r.psy_patients || {};
    if (pkStatusFilter === 'berdaftar' && r.status === 'batal') return false;
    if (pkStatusFilter === 'batal' && r.status !== 'batal') return false;
    if (pkAttFilter && pkAttFilter !== (r.status === 'batal' ? '' : r.status === 'hadir' ? 'hadir' : r.status === 'tak_hadir' ? 'tak_hadir' : 'belum')) return false;
    if (q && !`${p.full_name||''} ${p.mrn||''} ${p.phone||''}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function pkStats() {
  const total = REGS.length;
  const batal = REGS.filter(r => r.status === 'batal').length;
  const berdaftar = total - batal;
  const hadir = REGS.filter(r => r.status === 'hadir').length;
  const belum = REGS.filter(r => r.status !== 'batal' && r.status !== 'hadir' && r.status !== 'tak_hadir').length;
  const capacity = EV.capacity || null;
  return {
    total, batal, berdaftar, hadir, belum,
    berdaftarPct: capacity ? Math.round(berdaftar / capacity * 100) : null,
    hadirPct: berdaftar ? Math.round(hadir / berdaftar * 100) : 0,
  };
}

function pkChip(label, val, sub, tone, kind, active, handler) {
  const clickable = !!kind;
  const tag = clickable ? 'button' : 'div';
  const onclick = clickable ? ` onclick="${handler||'pkToggleChip'}('${kind}')"` : '';
  const activeCls = active ? 'border-navy ring-2 ring-navy/15' : 'border-ink/8 hover:border-ink/20';
  return `<${tag} type="${clickable?'button':''}"${onclick} class="bg-white rounded-2xl border ${activeCls} shadow-sm px-4 py-3 flex-1 min-w-[120px] text-left ${clickable?'cursor-pointer transition-colors':''}">
    <div class="text-xl font-extrabold ${tone||'text-ink'}">${val}${sub?` <span class="text-[11px] font-semibold text-ink/40">${sub}</span>`:''}</div>
    <div class="text-[11px] text-ink/50 mt-0.5">${label}</div>
  </${tag}>`;
}
function pkToggleChip(kind) {
  if (kind === 'berdaftar') { pkStatusFilter = pkStatusFilter === 'berdaftar' ? '' : 'berdaftar'; pkAttFilter = ''; }
  else if (kind === 'batal') { pkStatusFilter = pkStatusFilter === 'batal' ? '' : 'batal'; pkAttFilter = ''; }
  else if (kind === 'hadir') { pkAttFilter = pkAttFilter === 'hadir' ? '' : 'hadir'; pkStatusFilter = ''; }
  else if (kind === 'belum') { pkAttFilter = pkAttFilter === 'belum' ? '' : 'belum'; pkStatusFilter = ''; }
  pkPage = 1;
  render();
}
window.pkToggleChip = pkToggleChip;

function pkTabHtml() {

        <h2 class="text-sm font-bold text-ink">Senarai Peserta &amp; Kehadiran</h2>

const RETURN_CONDITION_META = {
  baik:   { label: '✅ Baik',   cls: 'bg-green-100 text-green-700' },
  rosak:  { label: '🔴 Rosak',  cls: 'bg-red-100 text-red-600' },
  hilang: { label: '⚫ Hilang', cls: 'bg-ink/10 text-ink/60' },
};
function prepReturnableRows() {
  return PREP_ITEMS.filter(it => it.source === 'inventory' || it.source === 'equipment' || it.source === 'manual');
}
function retFor(prepItemId) { return ITEM_RETURNS.find(r => r.prep_item_id === prepItemId) || null; }
function retStaffName(id) { return STAFF_LIST.find(s => s.id === id)?.full_name || '—'; }
function retBucket(it) {
  const r = retFor(it.id);
  if (!r || !r.returned_at) return 'notReturned';
  if (r.condition === 'rosak' || r.condition === 'hilang') return 'lostDamaged';
  return 'returned';
}
function retStats() {
  const rows = prepReturnableRows();
  const total = rows.length;
  let returned = 0, notReturned = 0, lostDamaged = 0;
  rows.forEach(it => {
    const b = retBucket(it);
    if (b === 'returned') returned++; else if (b === 'notReturned') notReturned++; else lostDamaged++;
  });
  return { total, returned, notReturned, lostDamaged };
}
function retFilteredRows() {
  const rows = prepReturnableRows();
  if (retFilter === 'all') return rows;
  return rows.filter(it => retBucket(it) === retFilter);
}
function retToggleChip(kind) { retFilter = retFilter === kind ? 'all' : kind; render(); }

function retPrefillForm(prepItemId) {
  setTimeout(() => {
    const r = retFor(prepItemId);
    document.getElementById('ret-item').value = prepItemId;
    document.getElementById('ret-qty').value = r ? Number(r.qty_returned) : 0;
    document.getElementById('ret-condition').value = r?.condition || '';
    document.getElementById('ret-date').value = r?.returned_at ? r.returned_at.slice(0,10) : new Date().toISOString().slice(0,10);
    document.getElementById('ret-pic').value = r?.pic_id || '';
    document.getElementById('ret-item').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 0);
}
window.retPrefillForm = retPrefillForm;

async function retSubmit() {
  const prepItemId = document.getElementById('ret-item').value;
  if (!prepItemId) { banner('Sila pilih barang', 'error'); return; }
  const item = PREP_ITEMS.find(i => i.id === prepItemId);
  const qtyReturned = Number(document.getElementById('ret-qty').value) || 0;
  const condition = document.getElementById('ret-condition').value;
  if (!condition) { banner('Sila pilih keadaan barang', 'error'); return; }
  const dateVal = document.getElementById('ret-date').value;
  const picId = document.getElementById('ret-pic').value || null;
  const existing = retFor(prepItemId);

  const payload = {
    event_id: EV.id, prep_item_id: prepItemId, qty_borrowed: Number(item.qty_needed),
    qty_returned: qtyReturned, condition, returned_at: dateVal ? new Date(dateVal).toISOString() : new Date().toISOString(),
    pic_id: picId, updated_at: new Date().toISOString(),
  };
  const { data, error } = await window.db.from('psy_event_item_returns').upsert(payload, { onConflict: 'prep_item_id' }).select().single();
  if (error) { banner('Ralat simpan: ' + error.message, 'error'); return; }
  ITEM_RETURNS = ITEM_RETURNS.filter(r => r.prep_item_id !== prepItemId);
  ITEM_RETURNS.push(data);

  // Baik → pulangkan stok/status; rosak/hilang (equipment) → tandakan rosak/hilang.
  try {
    if (condition === 'baik' && qtyReturned > 0) {
      if (item.source === 'inventory' && item.inventory_item_id) {
        await window.addStockToLocation(item.inventory_item_id, qtyReturned, null, { type: 'in', refType: 'event_return', refId: data.id, refLabel: 'EVT-' + EV.id.slice(0,8), note: `Pemulangan dari acara: ${EV.title}` });
      } else if (item.source === 'equipment' && item.equipment_id) {
        await window.db.from('psy_equipment').update({ status: 'available' }).eq('id', item.equipment_id);
      }
    } else if (item.source === 'equipment' && item.equipment_id && (condition === 'rosak' || condition === 'hilang')) {
      await window.db.from('psy_equipment').update({ status: condition === 'rosak' ? 'damaged' : 'lost' }).eq('id', item.equipment_id);
      const eq = EQUIP_ITEMS.find(e => e.id === item.equipment_id); if (eq) eq.status = condition === 'rosak' ? 'damaged' : 'lost';
    }
  } catch (e) { console.warn('[Pemulangan] gagal kemaskini stok/status:', e); }

  banner('Rekod pemulangan disimpan ✓', 'ok');
  render();
}
window.retSubmit = retSubmit;

const MAT_BUCKET = 'library-media';   // bucket awam sedia ada (RLS: staff tulis, semua baca)
function inferMatType(url) {
  const u = (url || '').toLowerCase();
  if (/youtube|youtu\.be|vimeo|loom|\.mp4|\.mov|\.webm|drive\.google\.com\/file/.test(u)) return 'video';
  if (/\.(png|jpe?g|gif|webp|svg)(\?|$)/.test(u)) return 'imej';
  if (/slides|presentation|\.pptx?|canva/.test(u)) return 'slaid';
  if (/\.pdf|docs\.google\.com\/document|\.docx?/.test(u)) return 'nota';
  return 'pautan';
}
function inferTypeFromFile(file) {
  const t = (file.type || '').toLowerCase(), n = (file.name || '').toLowerCase();
  if (t.startsWith('video/') || /\.(mp4|mov|webm|mkv)$/.test(n)) return 'video';
  if (t.startsWith('image/') || /\.(png|jpe?g|gif|webp|svg)$/.test(n)) return 'imej';
  if (/\.(ppt|pptx)$/.test(n)) return 'slaid';
  return 'nota';   // pdf / doc / docx / txt
}
function onMatFile() {
  const f = document.getElementById('mat-file').files[0];
  document.getElementById('mat-file-name').textContent = f ? ('📄 ' + f.name) : '';
  const t = document.getElementById('mat-title');
  if (f && !t.value.trim()) t.value = f.name.replace(/\.[^.]+$/, '');
}
async function uploadMaterial(file) {
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const path = `event-materials/${EV.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await window.db.storage.from(MAT_BUCKET).upload(path, file, { contentType: file.type || undefined, upsert: false });
  if (error) throw new Error('Upload gagal: ' + error.message);
  return window.db.storage.from(MAT_BUCKET).getPublicUrl(path).data.publicUrl;
}
async function addMaterial() {
  const titleEl = document.getElementById('mat-title');
  const url0 = document.getElementById('mat-url').value.trim();
  const file = document.getElementById('mat-file').files[0];
  if (!file && !url0) { banner('Masukkan pautan atau pilih fail', 'error'); return; }
  const btn = document.getElementById('mat-add-btn');
  const lbl = btn.textContent; btn.disabled = true; btn.textContent = file ? 'Memuat naik…' : 'Menyimpan…';
  try {
    let url = url0, type;
    if (file) {
      if (file.size > 500 * 1024 * 1024) throw new Error('Fail melebihi 500MB');
      url = await uploadMaterial(file);
      type = inferTypeFromFile(file);
    } else {
      type = inferMatType(url0);
    }
    const title = titleEl.value.trim() || (file ? file.name.replace(/\.[^.]+$/, '') : 'Bahan');
    const { error } = await window.db.from('psy_event_materials').insert({ event_id: EV.id, title, type, url });
    if (error) throw error;
    const { data } = await window.db.from('psy_event_materials').select('*').eq('event_id', EV.id).order('created_at', { ascending: true });
    MATERIALS = data || []; banner('Bahan ditambah ✓'); render();   // render() bina semula borang (reset)
  } catch (e) {
    banner('Ralat: ' + e.message, 'error');
    btn.disabled = false; btn.textContent = lbl;
  }
}
function bucketPathFromUrl(url) {
  const marker = `/public/${MAT_BUCKET}/`;
  const i = (url || '').indexOf(marker);
  return i === -1 ? null : decodeURIComponent(url.slice(i + marker.length).split('?')[0]);
}
async function delMaterial(id) {
  if (!confirm('Padam bahan ini?')) return;
  const mat = MATERIALS.find(m => m.id === id);
  const { error } = await window.db.from('psy_event_materials').delete().eq('id', id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  // Buang juga fail dari storage jika ia fail dimuat naik (bukan pautan luar seperti YouTube)
  const path = mat && bucketPathFromUrl(mat.url);
  if (path) { try { await window.db.storage.from(MAT_BUCKET).remove([path]); } catch (_) {} }
  MATERIALS = MATERIALS.filter(m => m.id !== id); render();
}
function copyTxt(t) { navigator.clipboard?.writeText(t).then(() => banner('Pautan disalin ✓'), () => {}); }
function kongsi() {
  const url = location.origin + '/roles/patient/event-detail.html?id=' + EV.id;
  if (navigator.share) navigator.share({ title: EV.title, url }).catch(() => {});
  else copyTxt(url);
}
function exportPeserta() {
  if (!REGS.length) { banner('Tiada peserta', 'error'); return; }
  const head = ['Nama', 'MRN', 'Status', 'Tarikh Daftar'];
  const lines = REGS.map(r => { const p = r.psy_patients || {}; return [p.full_name||'', p.mrn||'', r.status==='batal'?'Batal':r.status==='hadir'?'Hadir':r.status==='tak_hadir'?'Tidak Hadir':'Berdaftar (Belum Direkodkan)', new Date(r.registered_at).toLocaleString(LCALE())]; });
  const csv = [head, ...lines].map(row => row.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8;' }));
  a.download = `peserta-${(EV.title||'acara').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.csv`; a.click();
}
async function batal() {
  if (!confirm('Batalkan acara ini? Status akan jadi "Dibatalkan".')) return;
  const { error } = await window.db.from('psy_events').update({ status: 'cancelled' }).eq('id', EV.id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  EV.status = 'cancelled'; banner('Acara dibatalkan'); render();
}

// ── Tukar Gambar (banner) terus dari tab Maklumat Asas ───────────
function previewBanner(input) {
  const f = input.files[0]; if (!f) return;
  if (f.size > 15 * 1024 * 1024) { banner('Gambar melebihi 15MB', 'error'); input.value = ''; return; }
  const r = new FileReader();
  r.onload = e => openCrop(e.target.result);
  r.readAsDataURL(f);
  input.value = '';
}
window.previewBanner = previewBanner;
function openCrop(src) {
  const img = document.getElementById('crop-img');
  img.src = src;
  document.getElementById('crop-modal').classList.remove('hidden');
  if (cropper) { cropper.destroy(); cropper = null; }
  cropper = new Cropper(img, { aspectRatio: 2, viewMode: 1, autoCropArea: 1, dragMode: 'move', background: false });
}
function closeCrop() {
  document.getElementById('crop-modal').classList.add('hidden');
  if (cropper) { cropper.destroy(); cropper = null; }
}
window.closeCrop = closeCrop;
async function applyCrop() {
  if (!cropper) return;
  const canvas = cropper.getCroppedCanvas({ width: 1200, height: 600, imageSmoothingQuality: 'high' });
  const data = canvas.toDataURL('image/jpeg', 0.85);
  const { error } = await window.db.from('psy_events').update({ cover_image: data, updated_at: new Date().toISOString() }).eq('id', EV.id);
  closeCrop();
  if (error) { banner('Ralat simpan banner: ' + error.message, 'error'); return; }
  EV.cover_image = data;
  banner('Banner dikemaskini ✓', 'ok');
  render();
}
window.applyCrop = applyCrop;

async function saveMapsUrl(val) {
  const url = val.trim() || null;
  const { error } = await window.db.from('psy_events').update({ maps_url: url, updated_at: new Date().toISOString() }).eq('id', EV.id);
  if (error) { banner('Ralat simpan: ' + error.message, 'error'); return; }
  EV.maps_url = url;
  banner('Google Maps URL dikemaskini ✓', 'ok');
  render();
}
window.saveMapsUrl = saveMapsUrl;

(async () => {
  const user = await initStaff('events_admin', 'Detail acara & kehadiran');
  if (!user) return;
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { document.getElementById('wrap').innerHTML = '<div class="lg:col-span-3 text-center py-16 text-ink/40">Tiada ID.</div>'; return; }
  try {
    const { data: ev } = await window.db.from('psy_events').select('*').eq('id', id).maybeSingle();
    if (!ev) { document.getElementById('wrap').innerHTML = '<div class="lg:col-span-3 text-center py-16 text-ink/40">Acara tidak dijumpai.</div>'; return; }
    EV = ev;
    const { data: regs } = await window.db.from('psy_event_registrations')
      .select('id, status, registered_at, source, patient_id, psy_patients(full_name, mrn, phone)')
      .eq('event_id', id).order('registered_at', { ascending: true });
    REGS = regs || [];
    const { data: mats } = await window.db.from('psy_event_materials').select('*').eq('event_id', id).order('created_at', { ascending: true });
    MATERIALS = mats || [];
    if (EV.created_by) { const { data: prof } = await window.db.from('psy_profiles').select('full_name').eq('id', EV.created_by).maybeSingle(); CREATOR = prof?.full_name || ''; }
    if (EV.pic_id) { const { data: pic } = await window.db.from('psy_profiles').select('full_name, phone, email').eq('id', EV.pic_id).maybeSingle(); PIC_PROFILE = pic || null; }
    const { count: cancelledCount } = await window.db.from('psy_event_registrations').select('id', { count: 'exact', head: true }).eq('event_id', id).eq('status', 'batal');
    CANCELLED_COUNT = cancelledCount || 0;
    // Audit #H-36 (Tier 5) — meet_link kini di psy_event_meet_links (staf full access)
    try { const { data: ml } = await window.db.from('psy_event_meet_links').select('meet_link').eq('event_id', id).maybeSingle(); EV.meet_link = ml?.meet_link || null; } catch (_) {}

    // Persediaan Event — item + tugasan + rujukan inventori/equipment + template
    const [itemRes, taskRes, invRes, eqRes, metaRes, tplRes, staffRes, returnsRes] = await Promise.all([
      window.db.from('psy_event_prep_items').select('*').eq('event_id', id).order('created_at'),
      window.db.from('psy_event_checklist_tasks').select('*').eq('event_id', id).order('created_at'),
      window.db.from('psy_inventory_items').select('id, name, category, unit, qty_in_stock').eq('is_active', true).order('name'),
      window.db.from('psy_equipment').select('id, name, code, category, status').order('name'),
      window.db.from('psy_event_prep_meta').select('*').eq('event_id', id).maybeSingle(),
      window.db.from('psy_event_prep_templates').select('*').order('created_at', { ascending: false }),
      window.db.from('psy_profiles').select('id, full_name').eq('role', 'staff').eq('is_active', true).order('full_name'),
      window.db.from('psy_event_item_returns').select('*').eq('event_id', id),
    ]);
    PREP_ITEMS = (itemRes.data || []).map(r => ({ ...r, _key: r.id }));
    TASKS = (taskRes.data || []).map(r => ({ ...r, _key: r.id }));
    INV_ITEMS = invRes.data || [];
    EQUIP_ITEMS = eqRes.data || [];
    PREP_META = metaRes.data || { notes: '', deadline_date: null };
    TEMPLATES = tplRes.data || [];
    STAFF_LIST = staffRes.data || [];
    ITEM_RETURNS = returnsRes.data || [];
    if (TEMPLATES.length) {
      const { data: tItems } = await window.db.from('psy_event_prep_template_items').select('*').in('template_id', TEMPLATES.map(t => t.id));
      TEMPLATE_ITEMS = {};
      (tItems || []).forEach(it => { (TEMPLATE_ITEMS[it.template_id] = TEMPLATE_ITEMS[it.template_id] || []).push(it); });
    }

    const hashTab = (location.hash || '').replace('#', '');
    if (hashTab === 'kehadiran') TAB = 'peserta';   // tab lama digabung ke Peserta & Kehadiran
    else if (['peserta','rakaman','persediaan','pemulangan'].includes(hashTab)) TAB = hashTab;
    render();
  } catch (e) {
    document.getElementById('wrap').innerHTML = `<div class="lg:col-span-3 bg-terracotta/10 text-terracotta rounded-xl p-4 text-sm">Ralat: ${e.message}</div>`;
  }
})();
</script>
