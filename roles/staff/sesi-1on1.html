<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Sesi 1:1</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🧑‍💼</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <div class="flex items-start justify-between gap-3 flex-wrap">
          <div>
            <h1 class="text-xl font-bold text-ink flex items-center gap-2">🧑‍💼 Sesi 1:1</h1>
            <p class="text-sm text-ink/45 mt-0.5">Semua sesi Hakeema / Hakeem / Dr / Fisioterapi / Kaunselor / Bekam / Masseur — merentas semua pesakit.</p>
          </div>
          <div class="flex items-center gap-2">
            <a href="sesi-1on1-jadual.html" class="border border-ink/15 hover:border-navy text-ink/70 hover:text-navy font-semibold px-4 py-2.5 rounded-xl text-sm whitespace-nowrap">📅 Jadual</a>
            <button data-rbac="rujukan.create" onclick="window.open('sesi-1on1-form.html', '_blank')" class="bg-navy hover:bg-navy-dark text-white font-semibold px-4 py-2.5 rounded-xl text-sm whitespace-nowrap">+ Tambah Sesi</button>
          </div>
        </div>

        <!-- 4 stat cards — boleh diklik, terus tapis jadual di bawah (audit #B1-31) -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <button onclick="setStatusFilter('')" class="text-left bg-navy-light/40 border border-navy/10 rounded-2xl p-5 hover:ring-2 hover:ring-navy/30 transition-shadow">
            <div class="flex items-center gap-2"><span class="text-lg">📋</span><div id="sc-total" class="text-3xl font-bold text-navy leading-none">0</div></div>
            <div class="text-xs font-bold text-navy mt-1.5">Jumlah Rekod</div>
            <div class="text-[11px] text-ink/45">Mengikut tapisan semasa</div>
          </button>
          <button onclick="setStatusFilter('pending')" class="text-left bg-amber-50/60 border border-amber-100 rounded-2xl p-5 hover:ring-2 hover:ring-amber-300 transition-shadow">
            <div class="flex items-center gap-2"><span class="text-lg">⏳</span><div id="sc-pending" class="text-3xl font-bold text-amber-600 leading-none">0</div></div>
            <div class="text-xs font-bold text-amber-600 mt-1.5">Belum Konsultasi</div>
            <div class="text-[11px] text-ink/45">Status: pending</div>
          </button>
          <button onclick="setStatusFilter('accepted')" class="text-left bg-blue-50/60 border border-blue-100 rounded-2xl p-5 hover:ring-2 hover:ring-blue-300 transition-shadow">
            <div class="flex items-center gap-2"><span class="text-lg">📅</span><div id="sc-accepted" class="text-3xl font-bold text-blue-600 leading-none">0</div></div>
            <div class="text-xs font-bold text-blue-600 mt-1.5">Dijadualkan</div>
            <div class="text-[11px] text-ink/45">Status: accepted</div>
          </button>
          <button onclick="setStatusFilter('resolved')" class="text-left bg-green-50/60 border border-green-100 rounded-2xl p-5 hover:ring-2 hover:ring-green-300 transition-shadow">
            <div class="flex items-center gap-2"><span class="text-lg">✅</span><div id="sc-resolved" class="text-3xl font-bold text-green-600 leading-none">0</div></div>
            <div class="text-xs font-bold text-green-700 mt-1.5">Selesai</div>
            <div class="text-[11px] text-ink/45">Status: resolved</div>
          </button>
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
          <div class="px-5 py-4 border-b border-ink/8 space-y-3">
            <div class="flex items-center gap-2 flex-wrap justify-between">
              <div id="jenis-tabs" class="flex items-center gap-1.5 flex-wrap"></div>
              <div class="flex items-center gap-2 flex-wrap">
                <select id="status-filter" onchange="currentPage=1;renderTable()" class="text-xs border border-ink/15 rounded-lg px-2.5 py-1.5 bg-white text-ink outline-none focus:border-navy">
                  <option value="">Semua Status</option>
                  <option value="pending">Belum Konsultasi</option>
                  <option value="accepted">Dijadualkan</option>
                  <option value="resolved">Selesai</option>
                  <option value="declined">Ditolak</option>
                </select>
                <input type="date" id="f-from" onchange="currentPage=1;renderTable()" class="text-xs border border-ink/15 rounded-lg px-2.5 py-1.5 bg-white text-ink outline-none focus:border-navy">
                <span class="text-ink/30 text-xs">—</span>
                <input type="date" id="f-to" onchange="currentPage=1;renderTable()" class="text-xs border border-ink/15 rounded-lg px-2.5 py-1.5 bg-white text-ink outline-none focus:border-navy">
                <input id="search" oninput="currentPage=1;renderTable()" type="text" placeholder="🔍 Cari nama pesakit / MRN..." class="text-xs border border-ink/15 rounded-lg px-3 py-1.5 bg-white text-ink outline-none focus:border-navy w-56">
              </div>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="text-left text-[10px] uppercase tracking-wider text-ink/40 border-b border-ink/8 bg-ink/[0.015]">
                  <th class="py-2.5 px-5 font-bold">Pesakit</th>
                  <th class="py-2.5 px-3 font-bold">Tarikh</th>
                  <th class="py-2.5 px-3 font-bold">Sesi Dengan</th>
                  <th class="py-2.5 px-3 font-bold">Priority</th>
                  <th class="py-2.5 px-3 font-bold">Status</th>
                  <th class="py-2.5 px-5 font-bold text-right">Tindakan</th>
                </tr>
              </thead>
              <tbody id="tbl-tbody"></tbody>
            </table>
          </div>
          <div id="pagination" class="border-t border-ink/5 px-5 py-3 flex items-center justify-between gap-3 flex-wrap"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/utils.js"></script>
<script src="_shared.js"></script>
<script>
    function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
const HK1_DISPLAY = {
  hakeema:     { label: 'Hakeema',     emoji: '🧑‍💼' },
  hakeem:      { label: 'Hakeem',      emoji: '🧑' },
  dr:          { label: 'Dr',          emoji: '🩺' },
  fisioterapi: { label: 'Fisioterapi', emoji: '🏃' },
  kaunselor:   { label: 'Kaunselor',   emoji: '🗣️' },
  bekam:       { label: 'Bekam',       emoji: '🩸' },
  masseur:     { label: 'Masseur',     emoji: '💆' },
};
const STATUS_1ON1 = {
  pending:  { lbl: 'Belum Konsultasi', cls: 'bg-amber-100 text-amber-700' },
  accepted: { lbl: 'Dijadualkan',      cls: 'bg-blue-100 text-blue-700' },
  resolved: { lbl: 'Selesai',          cls: 'bg-green-100 text-green-700' },
  declined: { lbl: 'Ditolak',          cls: 'bg-ink/10 text-ink/50' },
};
const PRIORITY_1ON1 = {
  rendah:     { lbl: 'Rendah',     cls: 'bg-ink/10 text-ink/50' },
  sederhana:  { lbl: 'Sederhana',  cls: 'bg-amber-100 text-amber-700' },
  tinggi:     { lbl: 'Tinggi',     cls: 'bg-terracotta/15 text-terracotta' },
};

function escHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }

let allRows = [];       // psy_clinical_referrals source='plan_1on1', semua jenis
let jenisTab = '';       // '' = Semua, atau mana-mana key dlm HK1_DISPLAY
let currentPage = 1;
const PAGE_SIZE = 15;
let showAll = false;

function setStatusFilter(status) {
  document.getElementById('status-filter').value = status;
  currentPage = 1;
  renderTable();
}
window.setStatusFilter = setStatusFilter;

async function loadRows() {
  const { data } = await window.db.from('psy_clinical_referrals')
    .select('id, patient_id, plan_id, week_number, session_type, consultation, status, meet_date, target_name, reason, priority, created_at, psy_patients(full_name, mrn, psy_profiles!psy_patients_user_id_fkey(full_name))')
    .eq('source', 'plan_1on1')
    .order('created_at', { ascending: false })
    .limit(2000)
    .then(r => r, () => ({ data: [] }));
  allRows = data || [];
}

function renderTabs() {
  const counts = {};
  Object.keys(HK1_DISPLAY).forEach(t => { counts[t] = 0; });
  allRows.forEach(r => { if (counts[r.session_type] !== undefined) counts[r.session_type]++; });
  const tabs = [
    { key: '', label: 'Semua', count: allRows.length, cls: 'bg-navy/10 text-navy' },
    ...Object.entries(HK1_DISPLAY).map(([key, meta]) => ({ key, label: `${meta.emoji} ${meta.label}`, count: counts[key], cls: 'bg-navy/10 text-navy' })),
  ];
  document.getElementById('jenis-tabs').innerHTML = tabs.map(t => `
    <button onclick="setJenisTab('${t.key}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold border ${jenisTab === t.key ? t.cls + ' border-transparent' : 'border-ink/15 text-ink/55 hover:bg-ink/5'}">${t.label} <span class="opacity-75">${t.count}</span></button>
  `).join('');
}
function setJenisTab(key) { jenisTab = key; currentPage = 1; renderTabs(); renderTable(); }

function filteredList() {
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  const status = document.getElementById('status-filter').value;
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  return allRows.filter(r => {
    if (jenisTab && r.session_type !== jenisTab) return false;
    if (status && r.status !== status) return false;
    if (from && (!r.meet_date || r.meet_date < from)) return false;
    if (to && (!r.meet_date || r.meet_date > to)) return false;
    if (q) {
      const nm = (iswPatientName(r.psy_patients) || '').toLowerCase();
      const mrn = (r.psy_patients?.mrn || '').toLowerCase();
      if (!nm.includes(q) && !mrn.includes(q)) return false;
    }
    return true;
  });
}

function renderStats() {
  const list = filteredList();
  document.getElementById('sc-total').textContent = list.length;
  document.getElementById('sc-pending').textContent = list.filter(r => r.status === 'pending').length;
  document.getElementById('sc-accepted').textContent = list.filter(r => r.status === 'accepted').length;
  document.getElementById('sc-resolved').textContent = list.filter(r => r.status === 'resolved').length;
}

function renderTable() {
  renderStats();
  const list = filteredList();
  const tbody = document.getElementById('tbl-tbody');

  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-sm text-ink/35 py-10">Tiada rekod ditemui</td></tr>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  const pageRows = showAll ? list : list.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  tbody.innerHTML = pageRows.map(r => {
    const nm = iswPatientName(r.psy_patients) || r.psy_patients?.mrn || 'Pesakit';
    const meta = HK1_DISPLAY[r.session_type] || { label: r.session_type || '—', emoji: '' };
    const sm = STATUS_1ON1[r.status] || { lbl: r.status || '—', cls: 'bg-ink/10 text-ink/50' };
    const dateStr = r.meet_date ? new Date(r.meet_date + 'T00:00:00').toLocaleDateString(LCALE(), { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
    const time = r.consultation?.scheduled_time ? ` · ${r.consultation.scheduled_time}` : '';
    const targetName = r.target_name && r.target_name !== meta.label ? `<div class="text-[10px] text-ink/40">${escHtml(r.target_name)}</div>` : '';
    const pm = PRIORITY_1ON1[r.priority] || PRIORITY_1ON1.sederhana;
    return `<tr class="border-b border-ink/5 hover:bg-ink/[0.015]" title="${escHtml(r.reason || '')}">
      <td class="py-3 px-5">
        <div class="min-w-0">
          <div class="text-[13px] font-semibold text-ink truncate">${escHtml(nm)}</div>
          <div class="text-[10px] font-mono text-navy/55">${escHtml(r.psy_patients?.mrn || '—')}</div>
        </div>
      </td>
      <td class="py-3 px-3 text-[12px] text-ink/70 whitespace-nowrap">${dateStr}${time}</td>
      <td class="py-3 px-3 text-[12px] text-ink/70 whitespace-nowrap">${meta.emoji} ${escHtml(meta.label)}${targetName}</td>
      <td class="py-3 px-3"><span class="inline-block px-2.5 py-1 rounded-full text-[10px] font-bold ${pm.cls}">${pm.lbl}</span></td>
      <td class="py-3 px-3"><span class="inline-block px-2.5 py-1 rounded-full text-[10px] font-bold ${sm.cls}">${sm.lbl}</span></td>
      <td class="py-3 px-5 text-right">
        ${r.plan_id
          ? `<a href="plan-week.html?plan_id=${r.plan_id}&week=${r.week_number}&back=sesi-1on1.html" class="text-[11px] font-semibold text-navy hover:underline whitespace-nowrap">Semak →</a>`
          : `<a href="sesi-1on1-detail.html?patient_id=${r.patient_id}&back=sesi-1on1.html" target="_blank" rel="opener" class="text-[11px] font-semibold text-navy hover:underline whitespace-nowrap">Semak →</a>`}
      </td>
    </tr>`;
  }).join('');

  const pg = document.getElementById('pagination');
  if (showAll || list.length <= PAGE_SIZE) {
    pg.innerHTML = `<span class="text-[11px] text-ink/45">Menunjukkan ${pageRows.length} daripada ${list.length} rekod</span>` +
      (list.length > PAGE_SIZE ? `<button onclick="showAll=false;currentPage=1;renderTable()" class="text-xs font-semibold text-navy hover:underline">Papar Bermuka Surat</button>` : '');
  } else {
    const start = (currentPage - 1) * PAGE_SIZE + 1, end = Math.min(currentPage * PAGE_SIZE, list.length);
    pg.innerHTML = `<span class="text-[11px] text-ink/45">Menunjukkan ${start} hingga ${end} daripada ${list.length} rekod</span>
      <div class="flex items-center gap-2">
        <button onclick="currentPage=Math.max(1,currentPage-1);renderTable()" ${currentPage===1?'disabled':''} class="text-xs font-semibold ${currentPage===1?'text-ink/20':'text-navy hover:underline'}">‹ Sebelum</button>
        <button onclick="currentPage=Math.min(Math.ceil(${list.length}/${PAGE_SIZE}),currentPage+1);renderTable()" ${end>=list.length?'disabled':''} class="text-xs font-semibold ${end>=list.length?'text-ink/20':'text-navy hover:underline'}">Seterus ›</button>
        <button onclick="showAll=true;renderTable()" class="text-xs font-semibold border border-ink/15 rounded-lg px-3 py-1.5 hover:bg-ink/5">Lihat Semua</button>
      </div>`;
  }
}

// Terima isyarat dari tab sesi-1on1-form.html (+ Tambah Sesi dibuka tab baru) — refresh senarai.
window.addEventListener('message', (e) => {
  if (e.data?.type === 'isw-sesi1on1-saved') { loadRows().then(() => { renderTabs(); renderTable(); }); }
});

(async () => {
  const user = await initStaff('sesi_1on1', 'Semua sesi Hakeema / Hakeem / Dr / Fisioterapi / Kaunselor / Bekam / Masseur — merentas semua pesakit.');
  if (!user) return;
  await loadRows();
  renderTabs();
  renderTable();
})();
</script>
</body>
</html>
