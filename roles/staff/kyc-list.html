<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — KYC Form</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.tab-btn { padding: 0.5rem 1rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; background: white; border: 1px solid rgba(60,79,92,0.2); transition: colors 0.15s; }
.tab-btn.active { background: #1a3a5c; color: white; border-color: #1a3a5c; }
</style>
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🆔</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <!-- Search, filter & actions -->
        <div class="flex items-center gap-3 flex-wrap">
          <div class="relative flex-1 min-w-48">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/40 text-sm">🔍</span>
            <input id="search-kyc" type="text" placeholder="Cari nama, IC atau telefon..."
              oninput="filterKYC()"
              class="w-full pl-9 pr-3 py-2.5 border border-ink/20 rounded-xl text-sm focus:border-navy outline-none bg-white">
          </div>
          <select id="filter-status" onchange="filterKYC()"
            class="px-3 py-2.5 border border-ink/20 rounded-xl text-sm bg-white focus:border-navy outline-none">
            <option value="">Semua Status</option>
            <option value="pending">Pending</option>
            <option value="approved">Diluluskan</option>
            <option value="rejected">Ditolak</option>
          </select>
          <span id="kyc-count" class="text-xs text-ink/50 whitespace-nowrap"></span>
          <button onclick="exportExcel()" class="flex items-center gap-1.5 px-4 py-2.5 border border-ink/20 rounded-xl text-sm bg-white hover:border-navy hover:text-navy transition-colors">
            ⬇ Export Excel
          </button>
          <button onclick="printKYCList()" class="flex items-center gap-1.5 px-4 py-2.5 bg-navy text-white rounded-xl text-sm hover:bg-navy-dark transition-colors">
            🖨️ Print
          </button>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-xl border border-ink/10 overflow-x-auto">
          <table class="data">
            <thead>
              <tr>
                <th>Nama</th>
                <th>No. IC</th>
                <th>Telefon</th>
                <th>Emel</th>
                <th>Status</th>
                <th>Tarikh Hantar</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="kyc-body"></tbody>
          </table>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let allKYC       = [];
let filteredList = [];

const STATUS_LABEL = {
  pending:  '⏳ Pending',
  approved: '✅ Diluluskan',
  rejected: '❌ Ditolak',
};

const chipMap = {
  pending:  '<span class="chip bg-gold/20 text-gold-dark text-[10px]">⏳ Pending</span>',
  approved: '<span class="chip bg-green-light text-green-dark text-[10px]">✅ Diluluskan</span>',
  rejected: '<span class="chip bg-terracotta/15 text-terracotta text-[10px]">❌ Ditolak</span>',
};

function filterKYC() {
  const q      = document.getElementById('search-kyc').value.toLowerCase();
  const status = document.getElementById('filter-status').value;
  filteredList = allKYC.filter(k => {
    const matchS = !status || k.status === status;
    const matchQ = !q
      || (k.patient_name || '').toLowerCase().includes(q)
      || (k.ic_number    || '').toLowerCase().includes(q)
      || (k.phone        || '').toLowerCase().includes(q);
    return matchS && matchQ;
  });
  renderTable();
}

function renderTable() {
  document.getElementById('kyc-count').textContent = `${filteredList.length} rekod`;
  document.getElementById('kyc-body').innerHTML = filteredList.length
    ? filteredList.map(k => `
      <tr>
        <td><strong>${k.patient_name || '—'}</strong></td>
        <td class="text-xs font-mono">${k.ic_number || '—'}</td>
        <td class="text-xs">${k.phone || '—'}</td>
        <td class="text-xs">${k.email || '—'}</td>
        <td>${chipMap[k.status] || k.status}</td>
        <td class="text-xs text-ink/60">${formatDate(k.created_at)}</td>
        <td class="whitespace-nowrap">
          <a href="kyc-review.html?id=${k.id}" class="text-navy text-xs font-semibold hover:underline">Semak</a>
          <button onclick="deleteKYC('${k.id}','${(k.patient_name||'').replace(/'/g,"\\'")}',this)" class="text-red-500 text-xs font-semibold hover:underline ml-3">Padam</button>
        </td>
      </tr>`).join('')
    : `<tr><td colspan="7" class="text-center text-ink/40 py-8">📭 Tiada rekod ditemui</td></tr>`;
}

function exportExcel() {
  const statusFilter = document.getElementById('filter-status').value;
  const rows = [['Nama', 'No. IC', 'Telefon', 'Emel', 'Status', 'Tarikh Hantar']];
  filteredList.forEach(k => {
    rows.push([
      k.patient_name || '',
      k.ic_number    || '',
      k.phone        || '',
      k.email        || '',
      STATUS_LABEL[k.status] || k.status || '',
      formatDate(k.created_at),
    ]);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch:30 }, { wch:16 }, { wch:14 }, { wch:28 }, { wch:14 }, { wch:14 }];
  const wb = XLSX.utils.book_new();
  const suffix = statusFilter ? (STATUS_LABEL[statusFilter] || statusFilter).replace(/[^\w]/g,'') : 'Semua';
  XLSX.utils.book_append_sheet(wb, ws, 'KYC ' + suffix);
  XLSX.writeFile(wb, 'senarai_kyc_' + (statusFilter || 'semua') + '_' + new Date().toISOString().slice(0,10) + '.xlsx');
}

function printKYCList() {
  const now = new Date().toLocaleString('ms-MY', { dateStyle: 'full', timeStyle: 'short' });
  const statusFilter = document.getElementById('filter-status').value;
  const tabLabel = statusFilter ? (STATUS_LABEL[statusFilter] || statusFilter) : 'Semua';
  const rows = filteredList.map(k => `
    <tr>
      <td>${k.patient_name || '—'}</td>
      <td>${k.ic_number || '—'}</td>
      <td>${k.phone || '—'}</td>
      <td>${k.email || '—'}</td>
      <td>${STATUS_LABEL[k.status] || k.status}</td>
      <td>${formatDate(k.created_at)}</td>
    </tr>`).join('');

  const html = `<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8">
  <title>Senarai KYC — Ibnu Sina Wellness</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:Arial,sans-serif; font-size:11px; color:#111; padding:24px; }
    .header { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #1a3a5c; padding-bottom:10px; margin-bottom:16px; }
    .header h1 { font-size:16px; font-weight:bold; color:#1a3a5c; }
    .header p  { font-size:9px; color:#888; margin-top:2px; }
    .meta { font-size:9px; color:#999; text-align:right; line-height:1.6; }
    table { width:100%; border-collapse:collapse; }
    thead tr { background:#1a3a5c; color:white; }
    th { padding:7px 10px; text-align:left; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; }
    td { padding:7px 10px; border-bottom:1px solid #e5e7eb; vertical-align:middle; }
    tr:nth-child(even) td { background:#f9fafb; }
    .footer { margin-top:20px; border-top:1px solid #e5e7eb; padding-top:8px; display:flex; justify-content:space-between; font-size:9px; color:#aaa; }
    @media print { body { padding:12px; } }
  </style></head><body>
  <div class="header">
    <div>
      <h1>Ibnu Sina Wellness</h1>
      <p>Senarai KYC — ${tabLabel} &nbsp;·&nbsp; Sulit &amp; Rahsia</p>
    </div>
    <div class="meta">
      <div>Jumlah: <strong>${filteredList.length} rekod</strong></div>
      <div>Dicetak: ${now}</div>
    </div>
  </div>
  <table>
    <thead>
      <tr>
        <th>Nama</th><th>No. IC</th><th>Telefon</th><th>Emel</th>
        <th>Status</th>
        <th>Tarikh Hantar</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>
  <div class="footer">
    <span>Ibnu Sina Wellness · Dokumen Sulit</span>
    <span>Dilarang berkongsi tanpa kebenaran.</span>
  </div>
  <script>window.onload=function(){window.print();}<\/script>
  </body></html>`;

  const w = window.open('', '_blank', 'width=900,height=700');
  w.document.write(html);
  w.document.close();
}

function formatDate(d) {
  return new Date(d).toLocaleDateString('ms-MY', { day:'2-digit', month:'short', year:'numeric' });
}

async function deleteKYC(id, name, btn) {
  if (!confirm(`Padam KYC untuk "${name}"?\n\nTindakan ini tidak boleh dibatalkan.`)) return;
  btn.disabled = true; btn.textContent = 'Memadamkan...';
  const { error } = await window.db.from('psy_kyc_submissions').delete().eq('id', id);
  if (error) { alert('Ralat: ' + error.message); btn.disabled = false; btn.textContent = 'Padam'; return; }
  allKYC = allKYC.filter(k => k.id !== id);
  filterKYC();
}

(async () => {
  const user = await initStaff('kyc_forms', 'Semakan KYC Pesakit');
  if (!user) return;

  const { data, error } = await window.db.from('psy_kyc_submissions')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) { console.error('[kyc-list]', error); }
  allKYC = data || [];

  const urlStatus = new URLSearchParams(location.search).get('status');
  if (urlStatus && ['pending','approved','rejected'].includes(urlStatus)) {
    document.getElementById('filter-status').value = urlStatus;
  }
  filterKYC();
})();
</script>
</body>
</html>
