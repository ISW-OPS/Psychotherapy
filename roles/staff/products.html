<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Products</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🛒</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-6">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <h3 class="font-bold text-lg">Senarai Produk Shop</h3>
          <button onclick="window.location.href='product-edit.html'" class="bg-navy text-white text-sm px-4 py-2 rounded-lg font-semibold">+ Tambah Produk</button>
        </div>

        <div class="bg-white rounded-xl border border-ink/10 overflow-x-auto">
          <table class="data">
            <thead><tr><th>Gambar</th><th>Product ID</th><th>Nama</th><th>Kategori</th><th>Harga</th><th>Stock</th><th>Status</th><th></th></tr></thead>
            <tbody id="products-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- modal removed — edit via product-edit.html -->
<div id="prod-modal" class="hidden">
  <div class="absolute inset-0 bg-black/50" onclick="closeForm()"></div>
  <div class="relative bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-hidden flex flex-col">
    <div class="p-5 border-b border-ink/10 flex items-center justify-between">
      <h3 id="form-title" class="font-bold text-lg">Tambah Produk</h3>
      <button onclick="closeForm()" class="text-ink/60 text-xl">×</button>
    </div>
    <div class="p-5 space-y-3 overflow-y-auto">
      <input id="edit-id" type="hidden">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold">Product ID *</label>
          <input id="f-pid" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm bg-cream/50 text-ink/60" readonly>
        </div>
        <div>
          <label class="text-xs font-semibold">Kategori</label>
          <select id="f-cat" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
            <option>Madu</option>
            <option>IV Saline Drip</option>
            <option>Herba</option>
            <option>Buku</option>
          </select>
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold">Nama *</label>
        <input id="f-name" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
      </div>
      <div>
        <label class="text-xs font-semibold">Description</label>
        <input id="f-desc" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold">Harga (RM)</label>
          <input id="f-price" type="number" step="0.01" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
        </div>
        <div>
          <label class="text-xs font-semibold">Stock</label>
          <input id="f-stock" type="number" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm" placeholder="optional">
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold">Gambar Produk</label>
        <div class="mt-1 flex items-center gap-3">
          <div id="prod-img-preview" class="w-16 h-16 rounded-xl border-2 border-dashed border-ink/20 flex items-center justify-center bg-cream/50 overflow-hidden flex-shrink-0 text-2xl text-ink/30">
            📷
          </div>
          <div>
            <input id="f-image" type="file" accept="image/*" onchange="previewProdImage(this)" class="hidden">
            <input id="f-image-url" type="hidden">
            <input id="f-image-raw" type="hidden">
            <button type="button" onclick="document.getElementById('f-image').click()"
              class="px-3 py-2 border border-ink/20 rounded-lg text-xs hover:border-navy hover:text-navy transition-colors">
              Pilih Gambar
            </button>
            <p class="text-[10px] text-ink/40 mt-1">JPG, PNG · maks 10MB</p>
          </div>
        </div>
      </div>
      <div id="prod-image-editor" class="hidden rounded-xl border border-ink/10 bg-cream/30 p-3 space-y-3">
        <div class="aspect-video rounded-lg overflow-hidden bg-white border border-ink/10">
          <img id="prod-crop-preview" class="w-full h-full object-cover" alt="Preview gambar produk">
        </div>
        <div class="grid grid-cols-3 gap-3">
          <label class="text-[11px] font-semibold text-ink/70">Saiz
            <input id="prod-crop-zoom" type="range" min="1" max="3" step="0.05" value="1" oninput="renderProdImageCrop()" class="w-full">
          </label>
          <label class="text-[11px] font-semibold text-ink/70">Kiri / Kanan
            <input id="prod-crop-x" type="range" min="-100" max="100" step="1" value="0" oninput="renderProdImageCrop()" class="w-full">
          </label>
          <label class="text-[11px] font-semibold text-ink/70">Atas / Bawah
            <input id="prod-crop-y" type="range" min="-100" max="100" step="1" value="0" oninput="renderProdImageCrop()" class="w-full">
          </label>
        </div>
        <button type="button" onclick="resetProdImageCrop()" class="text-xs font-semibold text-navy hover:underline">Reset gambar</button>
      </div>
    </div>
    <div class="p-5 border-t border-ink/10 flex justify-end gap-2">
      <button onclick="closeForm()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm">Batal</button>
      <button onclick="saveProduct()" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold">Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const BG_MAP = {
  'Madu': 'bg-gold-light',
  'IV Saline Drip': 'bg-navy-light',
  'Herba': 'bg-green-light',
  'Buku': 'bg-cream',
};

function nextSequenceId(items, field, prefix) {
  const re = new RegExp(`^${prefix}\\s*(\\d+)$`, 'i');
  const max = (items || []).reduce((highest, item) => {
    const match = String(item[field] || '').trim().match(re);
    return match ? Math.max(highest, parseInt(match[1], 10) || 0) : highest;
  }, 0);
  return `${prefix} ${String(max + 1).padStart(3, '0')}`;
}

async function generateUniqueProductId() {
  const { data } = await window.db.from('psy_products').select('product_id');
  const base = nextSequenceId(data, 'product_id', 'P');
  const used = new Set((data || []).map(p => p.product_id).filter(Boolean));
  if (!used.has(base)) return base;
  for (let i = 1; i < 10000; i++) {
    const candidate = `P ${String(i).padStart(3, '0')}`;
    if (!used.has(candidate)) return candidate;
  }
  return `P ${Date.now().toString().slice(-6)}`;
}

async function updateProductIdPreview() {
  const editId = document.getElementById('edit-id').value;
  if (editId) return;
  document.getElementById('f-pid').value = await generateUniqueProductId();
}

function previewProdImage(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { banner('Gambar melebihi 10MB', 'error'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('f-image-raw').value = e.target.result;
    applyProdImageAdjustment();
  };
  reader.readAsDataURL(file);
}

let prodCropImage = null;

function cropImageDataUrl(img, zoom, offsetX, offsetY, width = 1200, height = 675) {
  if (!img) return Promise.resolve('');
  const baseScale = Math.max(width / img.width, height / img.height);
  const scale = baseScale * zoom;
  const drawW = img.width * scale;
  const drawH = img.height * scale;
  const maxX = Math.max(0, (drawW - width) / 2);
  const maxY = Math.max(0, (drawH - height) / 2);
  const dx = (width - drawW) / 2 + (offsetX / 100) * maxX;
  const dy = (height - drawH) / 2 + (offsetY / 100) * maxY;
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(img, dx, dy, drawW, drawH);
  return Promise.resolve(canvas.toDataURL('image/jpeg', 0.9));
}

function loadCropImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function applyProdImageAdjustment(reset = true) {
  const raw = document.getElementById('f-image-raw').value;
  if (!raw) return;
  try {
    prodCropImage = await loadCropImage(raw);
    document.getElementById('prod-image-editor').classList.remove('hidden');
    if (reset) resetProdImageCrop(false);
    else renderProdImageCrop();
  } catch (err) {
    banner('Gagal proses gambar: ' + err.message, 'error');
  }
}

async function renderProdImageCrop() {
  if (!prodCropImage) return;
  const adjusted = await cropImageDataUrl(
    prodCropImage,
    parseFloat(document.getElementById('prod-crop-zoom').value) || 1,
    parseInt(document.getElementById('prod-crop-x').value) || 0,
    parseInt(document.getElementById('prod-crop-y').value) || 0
  );
  document.getElementById('f-image-url').value = adjusted;
  document.getElementById('prod-crop-preview').src = adjusted;
  document.getElementById('prod-img-preview').innerHTML =
    `<img src="${adjusted}" class="w-full h-full object-cover">`;
}

function resetProdImageCrop(render = true) {
  document.getElementById('prod-crop-zoom').value = 1;
  document.getElementById('prod-crop-x').value = 0;
  document.getElementById('prod-crop-y').value = 0;
  if (render) renderProdImageCrop();
  else renderProdImageCrop();
}

function openForm(p) {
  document.getElementById('form-title').textContent = p ? 'Edit Produk' : 'Tambah Produk';
  document.getElementById('edit-id').value = p?.id || '';
  document.getElementById('f-pid').value = p?.product_id || 'P 001';
  document.getElementById('f-cat').value = p?.category || 'Madu';
  document.getElementById('f-name').value = p?.name || '';
  document.getElementById('f-desc').value = p?.description || '';
  document.getElementById('f-price').value = p?.price || '';
  document.getElementById('f-stock').value = p?.stock || '';
  document.getElementById('f-image-url').value = p?.image_url || '';
  document.getElementById('f-image-raw').value = p?.image_url || '';
  document.getElementById('prod-image-editor').classList.toggle('hidden', !p?.image_url);
  document.getElementById('prod-crop-zoom').value = 1;
  document.getElementById('prod-crop-x').value = 0;
  document.getElementById('prod-crop-y').value = 0;
  prodCropImage = null;
  document.getElementById('f-image').value = '';
  const prev = document.getElementById('prod-img-preview');
  prev.innerHTML = p?.image_url
    ? `<img src="${p.image_url}" class="w-full h-full object-cover">` : '📷';
  if (p?.image_url) {
    document.getElementById('prod-crop-preview').src = p.image_url;
    applyProdImageAdjustment(false);
  }
  if (!p) updateProductIdPreview();
  document.getElementById('prod-modal').classList.remove('hidden');
}
function closeForm() { document.getElementById('prod-modal').classList.add('hidden'); }

async function saveProduct() {
  const editId = document.getElementById('edit-id').value;
  const cat = document.getElementById('f-cat').value;
  const data = {
    name: document.getElementById('f-name').value.trim(),
    description: document.getElementById('f-desc').value.trim(),
    category: cat,
    price: parseFloat(document.getElementById('f-price').value) || 0,
    stock: parseInt(document.getElementById('f-stock').value) || null,
    image_url: document.getElementById('f-image-url').value || null,
    bg_color: BG_MAP[cat] || 'bg-cream',
    updated_at: new Date().toISOString(),
  };
  if (!data.name) { banner('Nama produk wajib diisi', 'error'); return; }

  try {
    let auditTarget = editId;
    if (editId) {
      await dbUpdate('psy_products', editId, data);
    } else {
      data.product_id = await generateUniqueProductId();
      document.getElementById('f-pid').value = data.product_id;
      auditTarget = data.product_id;
      const { error } = await window.db.from('psy_products').insert(data);
      if (error) throw error;
    }
    await auditLog(editId ? 'product.updated' : 'product.created', auditTarget);
    banner('Disimpan');
    closeForm();
    loadProducts();
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  }
}

async function toggleProduct(id, isActive) {
  await dbUpdate('psy_products', id, { is_active: !isActive });
  loadProducts();
}

async function deleteProduct(id, name) {
  if (!confirm(`Padam "${name}"?`)) return;
  await dbDelete('psy_products', id);
  await auditLog('product.deleted', id, { name });
  loadProducts();
}

async function loadProducts() {
  const data = await dbQuery('psy_products', { order: { col: 'sort_order', asc: true } });
  document.getElementById('products-body').innerHTML = data.length
    ? data.map(p => `<tr class="cursor-pointer hover:bg-cream/30 transition-colors ${!p.is_active ? 'opacity-50' : ''}" onclick="window.location.href='product-detail.html?id=${p.id}'">
        <td>
          <div class="w-10 h-10 rounded-lg overflow-hidden ${p.bg_color || 'bg-cream'} flex items-center justify-center flex-shrink-0">
            ${p.image_url
              ? `<img src="${p.image_url}" class="w-full h-full object-cover">`
              : `<span class="text-xl">${p.icon || '📦'}</span>`}
          </div>
        </td>
        <td><span class="font-mono text-xs text-ink/60">${p.product_id || '—'}</span></td>
        <td><strong>${p.name}</strong></td>
        <td><span class="chip bg-cream text-ink/70">${p.category || '—'}</span></td>
        <td class="font-bold">RM ${Number(p.price).toFixed(2)}</td>
        <td>${p.stock !== null ? p.stock : '—'}</td>
        <td>${p.is_active ? '<span class="chip bg-green-light text-green-dark">Active</span>' : '<span class="chip bg-ink/10 text-ink/60">Inactive</span>'}</td>
        <td class="space-x-2 whitespace-nowrap" onclick="event.stopPropagation()">
          <button onclick="window.location.href='product-detail.html?id=${p.id}'" class="text-navy text-xs font-semibold">Detail</button>
          <button onclick="toggleProduct('${p.id}',${p.is_active})" class="text-xs font-semibold ${p.is_active ? 'text-gold-dark' : 'text-green-dark'}">${p.is_active ? 'Off' : 'On'}</button>
          <button onclick="deleteProduct('${p.id}','${p.name}')" class="text-terracotta text-xs font-semibold">Padam</button>
        </td>
      </tr>`).join('')
    : '<tr><td colspan="8" class="text-center text-ink/40 py-8">Tiada produk</td></tr>';
}

(async () => {
  const user = await initStaff('psy_products', 'Urus produk shop · harga & stock');
  if (!user) return;
  loadProducts();
})();
</script>
</body>
</html>
