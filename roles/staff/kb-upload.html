<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Muat Naik Sumber</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.kb-card{background:#fff;border:1px solid rgba(60,79,92,.10);border-radius:1rem;}
.fld{width:100%;padding:.65rem .8rem;border:1px solid rgba(60,79,92,.15);border-radius:.7rem;font-size:.85rem;color:#3C4F5C;background:#fff;}
.fld:focus{outline:none;border-color:var(--rpm);}
.lbl{font-size:.75rem;font-weight:600;color:#3C4F5C;margin-bottom:.35rem;display:block;}
.vpill{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .85rem;border:1.5px solid rgba(60,79,92,.15);border-radius:9999px;font-size:.8rem;font-weight:600;color:#3C4F5C;cursor:pointer;background:#fff;transition:all .12s;}
.vpill.active{border-color:var(--rpm);background:var(--rpl);color:var(--rpm);}
.drop{border:2px dashed rgba(60,79,92,.2);border-radius:.8rem;padding:1.4rem;text-align:center;cursor:pointer;transition:all .12s;}
.drop:hover,.drop.drag{border-color:var(--rpm);background:var(--rpl);}
</style>
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📖</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
<div class="flex min-h-screen">
<aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
<main class="main-content flex-1 min-w-0">
<header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

<div class="p-4 md:p-8">
  <div class="max-w-none">
    <!-- Header -->
    <div class="mb-4">
      <div class="text-xs text-ink/40 mb-1"><a href="kb-dashboard.html" class="hover:underline">Knowledge Hub</a> › <span id="crumb" class="text-navy font-semibold">Muat Naik Sumber</span></div>
      <h1 id="page-h1" class="text-2xl font-bold text-ink">Muat Naik Sumber</h1>
      <p class="text-sm text-ink/55 mt-1">Kongsi pengetahuan dengan memuat naik dokumen atau pautan.</p>
    </div>

    <!-- Borang penuh skrin (tanpa card) -->
    <div class="space-y-5">
      <div class="grid md:grid-cols-2 gap-5">
        <div>
          <label class="lbl">Tajuk <span class="text-terracotta">*</span></label>
          <input id="f-title" class="fld" placeholder="Masukkan tajuk sumber">
        </div>
        <div>
          <label class="lbl">Kategori <span class="text-terracotta">*</span></label>
          <select id="f-cat" class="fld"><option value="">Pilih kategori</option></select>
        </div>
      </div>

      <div>
        <label class="lbl">Fail</label>
        <div id="drop" class="drop">
          <div class="text-2xl mb-1">☁️</div>
          <div id="drop-text" class="text-[13px] text-ink/60">Seret & lepas fail ke sini<br><span class="text-navy font-semibold">atau klik untuk pilih</span></div>
          <input id="f-file" type="file" class="hidden" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv,.mp4,.mov,.webm,.png,.jpg,.jpeg,.gif">
        </div>
        <p class="text-[10px] text-ink/40 mt-1">PDF, DOCX, PPTX, XLSX, MP4, PNG, JPG (Maks 100MB)</p>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex-1 h-px bg-ink/10"></div><span class="text-[11px] text-ink/40 font-semibold">ATAU PAUTAN</span><div class="flex-1 h-px bg-ink/10"></div>
      </div>
      <div>
        <input id="f-link" class="fld" placeholder="https:// (Google Drive, YouTube, dll.)">
      </div>

      <div class="border-t border-ink/8 pt-4">
        <label class="lbl">Visibiliti & Akses</label>
        <div class="flex flex-wrap gap-2">
          <label class="vpill active" data-vis="public"><input type="radio" name="vis" value="public" class="hidden" checked>🌐 Umum</label>
          <label class="vpill" data-vis="role"><input type="radio" name="vis" value="role" class="hidden">👥 Ikut Peranan</label>
          <label class="vpill" data-vis="user"><input type="radio" name="vis" value="user" class="hidden">🙋 Orang Tertentu</label>
          <label class="vpill" data-vis="private"><input type="radio" name="vis" value="private" class="hidden">🔒 Peribadi</label>
        </div>
        <p id="vis-hint" class="text-[11px] text-ink/45 mt-2">Kelihatan kepada semua staf.</p>

        <div id="role-box" class="hidden mt-3">
          <div class="flex flex-wrap gap-3 text-xs">
            <label class="flex items-center gap-1"><input type="checkbox" class="role-cb" value="super_admin"> super_admin</label>
            <label class="flex items-center gap-1"><input type="checkbox" class="role-cb" value="manager"> manager</label>
            <label class="flex items-center gap-1"><input type="checkbox" class="role-cb" value="admin"> admin</label>
            <label class="flex items-center gap-1"><input type="checkbox" class="role-cb" value="doctor"> doctor</label>
            <label class="flex items-center gap-1"><input type="checkbox" class="role-cb" value="coach"> coach</label>
          </div>
        </div>

        <div id="user-box" class="hidden mt-3">
          <input id="user-search" class="fld mb-2" placeholder="Cari nama staf...">
          <div id="user-list" class="max-h-40 overflow-y-auto border border-ink/10 rounded-lg p-2 space-y-1 text-xs">
            <div class="text-ink/40 text-center py-2">Memuatkan...</div>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 border-t border-ink/8 pt-4">
        <a href="kb-resources.html" class="px-4 py-2.5 rounded-xl text-sm font-semibold border border-ink/15 text-ink/70 hover:bg-ink/5">Batal</a>
        <button id="btn-publish" class="bg-navy text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-navy-dark">Terbitkan</button>
      </div>
    </div>
  </div>
</div>
</main>
</div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script src="_kb.js"></script>
<script>
let EDIT_ID = null, pickedFile = null, existing = null;
let STAFF = [], pickedUsers = new Set();

const VIS_HINT = {
  public: 'Kelihatan kepada semua staf.',
  role: 'Hanya peranan yang dipilih boleh lihat.',
  user: 'Hanya staf yang dipilih boleh lihat.',
  private: 'Hanya anda boleh lihat.',
};

// Auto-kesan res_type: fail > pautan > sedia ada (edit) > default.
function deriveType(link) {
  if (pickedFile) return kbTypeFromExt(pickedFile.name.split('.').pop());
  if (link) return kbTypeFromUrl(link);
  if (existing?.res_type) return existing.res_type;
  return 'document';
}

function renderStaff(filter) {
  const q = (filter || '').toLowerCase();
  const list = STAFF.filter(s => !q || (s.full_name || '').toLowerCase().includes(q));
  document.getElementById('user-list').innerHTML = list.length ? list.map(s => `
    <label class="flex items-center gap-2 py-1 px-1 hover:bg-ink/5 rounded cursor-pointer">
      <input type="checkbox" class="user-cb" value="${s.id}" ${pickedUsers.has(s.id) ? 'checked' : ''}>
      <span class="text-ink">${kbEsc(s.full_name || 'Tanpa nama')}</span>
      <span class="text-[10px] text-ink/40 ml-auto">${kbEsc(s.staff_role || '')}</span>
    </label>`).join('') : '<div class="text-ink/40 text-center py-2">Tiada staf.</div>';
  document.querySelectorAll('.user-cb').forEach(cb => cb.onchange = () => {
    if (cb.checked) pickedUsers.add(cb.value); else pickedUsers.delete(cb.value);
  });
}

function selectVis(vis) {
  document.querySelectorAll('.vpill').forEach(p => p.classList.toggle('active', p.dataset.vis === vis));
  const input = document.querySelector(`.vpill[data-vis="${vis}"] input`);
  if (input) input.checked = true;
  document.getElementById('vis-hint').textContent = VIS_HINT[vis] || '';
  document.getElementById('role-box').classList.toggle('hidden', vis !== 'role');
  document.getElementById('user-box').classList.toggle('hidden', vis !== 'user');
}

async function save() {
  const title = document.getElementById('f-title').value.trim();
  const catId = document.getElementById('f-cat').value;
  if (!title) return banner('Sila masukkan tajuk.', 'error');
  if (!catId) return banner('Sila pilih kategori.', 'error');

  const btn = document.getElementById('btn-publish');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    let fileUrl = existing?.file_url || null, fileSize = existing?.file_size || null, fileExt = existing?.file_ext || null;
    let fileChanged = false;
    if (pickedFile) {
      if (pickedFile.size > 100 * 1024 * 1024) throw new Error('Fail melebihi 100MB');
      const up = await kbUploadFile(pickedFile);
      fileUrl = up.url; fileSize = up.size; fileExt = up.ext; fileChanged = true;
    }
    const link = document.getElementById('f-link').value.trim();
    const vis = document.querySelector('input[name=vis]:checked').value;
    const roles = vis === 'role' ? [...document.querySelectorAll('.role-cb:checked')].map(c => c.value) : [];
    const users = vis === 'user' ? [...pickedUsers] : [];

    const row = {
      title, category_id: catId, res_type: deriveType(link),
      file_url: fileUrl, external_url: link || null, file_size: fileSize, file_ext: fileExt,
      visibility: vis, allowed_roles: roles, allowed_users: users,
      version: existing?.version || 'v1.0',
    };

    let resId;
    if (EDIT_ID) {
      await dbUpdate('psy_kb_resources', EDIT_ID, row);
      resId = EDIT_ID;
      if (fileChanged) {
        await window.db.from('psy_kb_versions').update({ is_current: false }).eq('resource_id', resId);
        await window.db.from('psy_kb_versions').insert({
          resource_id: resId, version: row.version, file_url: fileUrl, external_url: link || null,
          file_size: fileSize, is_current: true, uploaded_by: window.currentUser.id,
        });
      }
    } else {
      row.uploaded_by = window.currentUser.id;
      const created = await dbInsert('psy_kb_resources', row);
      resId = created.id;
      await window.db.from('psy_kb_versions').insert({
        resource_id: resId, version: row.version, file_url: fileUrl, external_url: link || null,
        file_size: fileSize, changes_summary: 'Versi pertama', is_current: true, uploaded_by: window.currentUser.id,
      });
    }
    auditLog?.(EDIT_ID ? 'kb_update' : 'kb_create', resId, { title });
    banner('Berjaya disimpan.');
    setTimeout(() => location.href = 'kb-detail.html?id=' + resId, 700);
  } catch (e) {
    banner(e.message || 'Gagal simpan', 'error');
    btn.disabled = false; btn.textContent = EDIT_ID ? 'Simpan' : 'Terbitkan';
  }
}

async function boot() {
  const u = await initStaff('kb_upload', 'Muat Naik Sumber', 'kb');
  if (!u) return;
  if (!kbCanAuthor()) { alert('Anda tiada kebenaran untuk memuat naik sumber.'); location.href = 'kb-dashboard.html'; return; }

  const [cats, staffRes] = await Promise.all([
    kbCategories().catch(() => []),
    window.db.from('psy_profiles').select('id,full_name,staff_role').eq('role', 'staff').order('full_name').then(r => r.data || []).catch(() => []),
  ]);
  STAFF = staffRes;
  document.getElementById('f-cat').innerHTML = '<option value="">Pilih kategori</option>' +
    cats.map(c => `<option value="${c.id}">${kbEsc(c.name)}</option>`).join('');
  renderStaff('');
  document.getElementById('user-search').addEventListener('input', e => renderStaff(e.target.value));

  document.querySelectorAll('.vpill').forEach(p => p.onclick = () => selectVis(p.dataset.vis));

  const drop = document.getElementById('drop'), fileIn = document.getElementById('f-file');
  drop.onclick = () => fileIn.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag'); };
  drop.ondragleave = () => drop.classList.remove('drag');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('drag'); if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); };
  fileIn.onchange = () => { if (fileIn.files[0]) setFile(fileIn.files[0]); };
  function setFile(f) {
    pickedFile = f;
    document.getElementById('drop-text').innerHTML = `<span class="text-navy font-semibold">${kbEsc(f.name)}</span><br>${kbFileSize(f.size)}`;
  }

  document.getElementById('btn-publish').onclick = save;

  // EDIT mode
  const id = new URLSearchParams(location.search).get('id');
  if (id) {
    EDIT_ID = id;
    const { data: r } = await window.db.from('psy_kb_resources').select('*').eq('id', id).single();
    if (r) {
      existing = r;
      document.getElementById('page-h1').textContent = 'Edit Sumber';
      document.getElementById('crumb').textContent = 'Edit Sumber';
      document.getElementById('btn-publish').textContent = 'Simpan';
      document.getElementById('f-title').value = r.title || '';
      document.getElementById('f-cat').value = r.category_id || '';
      document.getElementById('f-link').value = r.external_url || '';
      if (r.file_url) document.getElementById('drop-text').innerHTML = `<span class="text-green-dark font-semibold">✓ Fail sedia ada</span><br>Muat naik fail baru untuk ganti`;
      pickedUsers = new Set(r.allowed_users || []);
      selectVis(r.visibility === 'department' ? 'public' : (r.visibility || 'public'));
      (r.allowed_roles || []).forEach(role => { const cb = document.querySelector(`.role-cb[value="${role}"]`); if (cb) cb.checked = true; });
      renderStaff('');
    }
  }
}
boot();
</script>
</body>
</html>
