<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Services</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">⚕</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-6">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <h3 class="font-bold text-lg">Senarai Services</h3>
          <button onclick="openForm()" class="bg-navy text-white text-sm px-4 py-2 rounded-lg font-semibold">+ Tambah Service</button>
        </div>

        <div class="bg-white rounded-xl border border-ink/10 overflow-x-auto">
          <table class="data">
            <thead><tr><th>Icon</th><th>Nama</th><th>Description</th><th>Harga</th><th>Duration</th><th>Status</th><th></th></tr></thead>
            <tbody id="services-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal -->
<div id="svc-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" onclick="closeForm()"></div>
  <div class="relative bg-white rounded-2xl max-w-lg w-full overflow-hidden">
    <div class="p-5 border-b border-ink/10 flex items-center justify-between">
      <h3 id="form-title" class="font-bold text-lg">Tambah Service</h3>
      <button onclick="closeForm()" class="text-ink/60 text-xl">×</button>
    </div>
    <div class="p-5 space-y-3">
      <input id="edit-id" type="hidden">
      <div>
        <label class="text-xs font-semibold">Service ID (unique) *</label>
        <input id="f-sid" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm" placeholder="cth: consultation">
      </div>
      <div>
        <label class="text-xs font-semibold">Nama *</label>
        <input id="f-name" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm" placeholder="cth: Consultation with Doctor">
      </div>
      <div>
        <label class="text-xs font-semibold">Description</label>
        <input id="f-desc" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
      </div>
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="text-xs font-semibold">Harga (RM)</label>
          <input id="f-price" type="number" step="0.01" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
        </div>
        <div>
          <label class="text-xs font-semibold">Duration (min)</label>
          <input id="f-duration" type="number" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
        </div>
        <div>
          <label class="text-xs font-semibold">Icon</label>
          <input id="f-icon" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm" placeholder="⚕" value="⚕">
        </div>
      </div>
    </div>
    <div class="p-5 border-t border-ink/10 flex justify-end gap-2">
      <button onclick="closeForm()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm">Batal</button>
      <button onclick="saveService()" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold">Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function openForm(svc) {
  document.getElementById('form-title').textContent = svc ? 'Edit Service' : 'Tambah Service';
  document.getElementById('edit-id').value = svc?.id || '';
  document.getElementById('f-sid').value = svc?.service_id || '';
  document.getElementById('f-name').value = svc?.name || '';
  document.getElementById('f-desc').value = svc?.description || '';
  document.getElementById('f-price').value = svc?.price || '';
  document.getElementById('f-duration').value = svc?.duration_min || 30;
  document.getElementById('f-icon').value = svc?.icon || '⚕';
  document.getElementById('svc-modal').classList.remove('hidden');
}
function closeForm() { document.getElementById('svc-modal').classList.add('hidden'); }

async function saveService() {
  const editId = document.getElementById('edit-id').value;
  const data = {
    service_id: document.getElementById('f-sid').value.trim(),
    name: document.getElementById('f-name').value.trim(),
    description: document.getElementById('f-desc').value.trim(),
    price: parseFloat(document.getElementById('f-price').value) || 0,
    duration_min: parseInt(document.getElementById('f-duration').value) || 30,
    icon: document.getElementById('f-icon').value || '⚕',
    updated_at: new Date().toISOString(),
  };
  if (!data.service_id || !data.name) { banner('Service ID dan Nama wajib', 'error'); return; }

  try {
    if (editId) {
      await dbUpdate('psy_services', editId, data);
    } else {
      const { error } = await window.db.from('psy_services').insert(data);
      if (error) throw error;
    }
    await auditLog(editId ? 'service.updated' : 'service.created', data.service_id);
    banner('Service disimpan');
    closeForm();
    loadServices();
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  }
}

async function toggleService(id, isActive) {
  await dbUpdate('psy_services', id, { is_active: !isActive });
  banner(isActive ? 'Service dinyahaktifkan' : 'Service diaktifkan');
  loadServices();
}

async function deleteService(id, name) {
  if (!confirm(`Padam "${name}"?`)) return;
  await dbDelete('psy_services', id);
  await auditLog('service.deleted', id, { name });
  banner('Service dipadam');
  loadServices();
}

async function loadServices() {
  const data = await dbQuery('psy_services', { order: { col: 'sort_order', asc: true } });
  document.getElementById('services-body').innerHTML = data.length
    ? data.map(s => `<tr class="cursor-pointer hover:bg-cream/30 transition-colors ${!s.is_active ? 'opacity-50' : ''}" onclick="window.location.href='service-detail.html?id=${s.id}'">
        <td class="text-2xl">${s.icon}</td>
        <td><strong>${s.name}</strong><div class="text-[10px] text-ink/50">${s.service_id}</div></td>
        <td class="text-xs">${s.description || '—'}</td>
        <td class="font-bold">RM ${Number(s.price).toFixed(2)}</td>
        <td>${s.duration_min} min</td>
        <td>${s.is_active ? '<span class="chip bg-green-light text-green-dark">Active</span>' : '<span class="chip bg-ink/10 text-ink/60">Inactive</span>'}</td>
        <td class="space-x-2 whitespace-nowrap" onclick="event.stopPropagation()">
          <button onclick="window.location.href='service-detail.html?id=${s.id}'" class="text-navy text-xs font-semibold">Detail</button>
          <button onclick="toggleService('${s.id}',${s.is_active})" class="text-xs font-semibold ${s.is_active ? 'text-gold-dark' : 'text-green-dark'}">${s.is_active ? 'Off' : 'On'}</button>
          <button onclick="deleteService('${s.id}','${s.name}')" class="text-terracotta text-xs font-semibold">Padam</button>
        </td>
      </tr>`).join('')
    : '<tr><td colspan="7" class="text-center text-ink/40 py-8">Tiada services. Klik + Tambah untuk mula.</td></tr>';
}

(async () => {
  const user = await initStaff('services', 'Urus jenis appointment & harga');
  if (!user) return;
  loadServices();
})();
</script>
</body>
</html>
