<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Detail Library</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.media-type-btn { @apply flex flex-col items-center border-2 border-ink/20 rounded-xl p-3 cursor-pointer transition-all hover:border-navy; }
.media-type-btn:has(input:checked) { @apply border-navy bg-navy-light; }
.media-type-btn input { display:none; }
</style>
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📚</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <!-- Action bar — always visible -->
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <div id="view-status"></div>
          <div id="btn-bar-view" class="flex gap-2">
            <button id="btn-toggle-status" onclick="toggleStatus()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5"></button>
            <button onclick="enterEdit()" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark flex items-center gap-2">✏️ Edit Kandungan</button>
          </div>
          <div id="btn-bar-edit" class="hidden flex gap-2">
            <button onclick="exitEdit()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5">Batal</button>
            <button id="save-btn" onclick="saveItem()" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark">Simpan</button>
          </div>
        </div>

        <!-- ── VIEW SECTION ─────────────────────────────── -->
        <div id="view-section" class="space-y-5">

          <!-- Hero -->
          <div id="lib-hero" class="rounded-2xl overflow-hidden relative min-h-[160px] flex items-end">
            <div id="hero-inner" class="p-6 text-white w-full"></div>
          </div>

          <!-- Stats -->
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-white rounded-xl p-5 border border-ink/10 text-center">
              <div class="text-xs text-ink/50 uppercase font-semibold tracking-wide">Jenis Kandungan</div>
              <div id="stat-type" class="text-sm font-semibold mt-2 text-navy"></div>
            </div>
            <div class="bg-white rounded-xl p-5 border border-ink/10 text-center">
              <div class="text-xs text-ink/50 uppercase font-semibold tracking-wide">Kategori</div>
              <div id="stat-cat" class="text-sm font-semibold mt-2 text-navy capitalize"></div>
            </div>
          </div>

          <!-- Description -->
          <div id="section-desc" class="hidden bg-white rounded-xl p-5 border border-ink/10">
            <h3 class="font-bold mb-2 text-sm">📄 Penerangan</h3>
            <p id="view-desc" class="text-sm text-ink/70 leading-relaxed"></p>
          </div>

          <!-- Content link -->
          <div id="section-link" class="hidden bg-white rounded-xl p-5 border border-ink/10">
            <h3 class="font-bold mb-3 text-sm">🔗 Kandungan</h3>
            <div id="view-content-link"></div>
          </div>

          <!-- Article body -->
          <div id="section-body" class="hidden bg-white rounded-xl p-5 border border-ink/10">
            <h3 class="font-bold mb-3 text-sm">📝 Teks Kandungan</h3>
            <p id="view-body" class="text-sm text-ink/80 whitespace-pre-wrap leading-relaxed"></p>
          </div>

        </div>

        <!-- ── EDIT SECTION ─────────────────────────────── -->
        <div id="edit-section" class="hidden max-w-2xl mx-auto">
          <input id="edit-id" type="hidden">

          <div class="space-y-5">

            <!-- Media type -->
            <div>
              <label class="text-xs font-semibold text-ink/60">Jenis Media</label>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2">
              <label class="media-type-btn"><input type="radio" name="media-type" value="article" checked onchange="onMediaTypeChange()"><span class="text-xl">📝</span><span class="text-xs font-semibold mt-1">Artikel</span></label>
              <label class="media-type-btn"><input type="radio" name="media-type" value="image" onchange="onMediaTypeChange()"><span class="text-xl">🖼️</span><span class="text-xs font-semibold mt-1">Gambar</span></label>
              <label class="media-type-btn"><input type="radio" name="media-type" value="video" onchange="onMediaTypeChange()"><span class="text-xl">🎬</span><span class="text-xs font-semibold mt-1">Video</span></label>
              <label class="media-type-btn"><input type="radio" name="media-type" value="pdf" onchange="onMediaTypeChange()"><span class="text-xl">📄</span><span class="text-xs font-semibold mt-1">PDF</span></label>
            </div>
            </div>

            <!-- Basic info -->
            <div class="grid md:grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold text-ink/60">Title <span class="text-terracotta">*</span></label>
                <input id="f-title" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/60">Label Kandungan</label>
                <input id="f-type" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="cth: Video · 8 min">
              </div>
            </div>

            <div>
              <label class="text-xs font-semibold text-ink/60">Description</label>
              <textarea id="f-desc" rows="2" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none"></textarea>
            </div>

            <!-- Image upload -->
            <div id="section-image" class="hidden space-y-2">
              <label class="text-xs font-semibold text-ink/60">Upload Gambar</label>
              <div id="img-drop" class="border-2 border-dashed border-ink/20 rounded-xl p-5 text-center cursor-pointer hover:border-navy transition-colors" onclick="document.getElementById('img-file').click()">
                <div id="img-preview-wrap" class="hidden mb-2"><img id="img-preview" class="max-h-40 mx-auto rounded-lg object-contain"></div>
                <div id="img-placeholder"><div class="text-3xl mb-1">🖼️</div><div class="text-sm text-ink/60">Klik untuk upload gambar</div><div class="text-xs text-ink/40 mt-1">JPG, PNG · Max 5MB</div></div>
                <input id="img-file" type="file" accept="image/*" class="hidden" onchange="previewImage(event)">
              </div>
              <div id="img-existing-url" class="hidden text-xs text-ink/50 bg-cream rounded-lg px-3 py-2"></div>
            </div>

            <!-- Video upload/url -->
            <div id="section-video" class="hidden space-y-3">
              <div class="flex gap-2">
                <label class="flex-1 border border-ink/20 rounded-lg p-2 text-xs cursor-pointer has-[:checked]:border-navy has-[:checked]:bg-navy-light text-center"><input type="radio" name="video-src" value="upload" checked onchange="onVideoSrcChange()" class="mr-1">📤 Upload</label>
                <label class="flex-1 border border-ink/20 rounded-lg p-2 text-xs cursor-pointer has-[:checked]:border-navy has-[:checked]:bg-navy-light text-center"><input type="radio" name="video-src" value="youtube" onchange="onVideoSrcChange()" class="mr-1">▶️ YouTube</label>
                <label class="flex-1 border border-ink/20 rounded-lg p-2 text-xs cursor-pointer has-[:checked]:border-navy has-[:checked]:bg-navy-light text-center"><input type="radio" name="video-src" value="url" onchange="onVideoSrcChange()" class="mr-1">🔗 URL</label>
              </div>
              <div id="video-upload-area">
                <div id="vid-drop" class="border-2 border-dashed border-ink/20 rounded-xl p-5 text-center cursor-pointer hover:border-navy transition-colors" onclick="document.getElementById('vid-file').click()">
                  <div id="vid-preview-wrap" class="hidden mb-2"><video id="vid-preview" controls class="max-h-36 mx-auto rounded-lg w-full"></video></div>
                  <div id="vid-placeholder"><div class="text-3xl mb-1">🎬</div><div class="text-sm text-ink/60">Klik untuk upload video</div><div class="text-xs text-ink/40 mt-1">MP4, WebM · Max 50MB</div></div>
                  <input id="vid-file" type="file" accept="video/*" class="hidden" onchange="previewVideo(event)">
                </div>
                <div id="vid-existing-url" class="hidden text-xs text-ink/50 bg-cream rounded-lg px-3 py-2 mt-2"></div>
              </div>
              <div id="video-url-area" class="hidden">
                <input id="f-video-url" class="w-full px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="https://youtube.com/watch?v=...">
              </div>
            </div>

            <!-- PDF upload/url -->
            <div id="section-pdf" class="hidden space-y-3">
              <div class="flex gap-2">
                <label class="flex-1 border border-ink/20 rounded-lg p-2 text-xs cursor-pointer has-[:checked]:border-navy has-[:checked]:bg-navy-light text-center"><input type="radio" name="pdf-src" value="upload" checked onchange="onPdfSrcChange()" class="mr-1">📤 Upload</label>
                <label class="flex-1 border border-ink/20 rounded-lg p-2 text-xs cursor-pointer has-[:checked]:border-navy has-[:checked]:bg-navy-light text-center"><input type="radio" name="pdf-src" value="url" onchange="onPdfSrcChange()" class="mr-1">🔗 URL</label>
              </div>
              <div id="pdf-upload-area">
                <div id="pdf-drop" class="border-2 border-dashed border-ink/20 rounded-xl p-5 text-center cursor-pointer hover:border-navy transition-colors" onclick="document.getElementById('pdf-file').click()">
                  <div id="pdf-name" class="hidden mb-2 text-sm font-semibold text-navy"></div>
                  <div id="pdf-placeholder"><div class="text-3xl mb-1">📄</div><div class="text-sm text-ink/60">Klik untuk upload PDF</div><div class="text-xs text-ink/40 mt-1">PDF · Max 20MB</div></div>
                  <input id="pdf-file" type="file" accept=".pdf" class="hidden" onchange="previewPdf(event)">
                </div>
                <div id="pdf-existing-url" class="hidden text-xs text-ink/50 bg-cream rounded-lg px-3 py-2 mt-2"></div>
              </div>
              <div id="pdf-url-area" class="hidden">
                <input id="f-pdf-url" class="w-full px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="https://... atau Google Drive link">
              </div>
            </div>

            <!-- Article -->
            <div id="section-article" class="space-y-3">
              <div>
                <label class="text-xs font-semibold text-ink/60">Kandungan Teks</label>
                <textarea id="f-body" rows="6" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="Taip isi kandungan di sini..."></textarea>
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/60">Link Luaran (optional)</label>
                <input id="f-url" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="https://...">
              </div>
            </div>

            <!-- Thumbnail -->
            <div id="section-thumbnail" class="hidden space-y-2">
              <label class="text-xs font-semibold text-ink/60">Gambar Thumbnail (optional)</label>
              <div class="flex items-center gap-3">
                <div id="thumb-preview-wrap" class="hidden"><img id="thumb-preview" class="h-14 w-20 object-cover rounded-lg border border-ink/10"></div>
                <label class="flex items-center gap-2 border border-dashed border-ink/20 rounded-lg px-4 py-2 cursor-pointer hover:border-navy text-sm text-ink/60 hover:text-navy transition-colors">
                  📷 <span id="thumb-label">Upload thumbnail</span>
                  <input id="thumb-file" type="file" accept="image/*" class="hidden" onchange="previewThumb(event)">
                </label>
                <button id="thumb-clear" class="hidden text-xs text-terracotta" onclick="clearThumb()">× Buang</button>
              </div>
              <div id="thumb-existing-url" class="hidden text-xs text-ink/50 bg-cream rounded-lg px-3 py-2"></div>
            </div>

            <!-- Appearance -->
            <div class="grid grid-cols-3 gap-3">
              <div>
                <label class="text-xs font-semibold text-ink/60">Icon</label>
                <input id="f-icon" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" value="📄">
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/60">Kategori</label>
                <select id="f-cat" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm bg-white focus:border-navy outline-none">
                  <option value="navy">Navy</option><option value="green">Green</option><option value="terracotta">Terracotta</option><option value="gold">Gold</option><option value="teal">Teal</option><option value="ink">Ink</option>
                </select>
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/60">Gradient Hero</label>
                <input id="f-gradient" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" value="from-navy to-teal">
              </div>
            </div>

            <div id="upload-progress" class="hidden bg-navy-light rounded-lg px-4 py-3 text-sm text-navy font-medium">
              <div class="flex items-center gap-2"><span class="animate-spin">⏳</span> <span id="upload-progress-text">Mengupload...</span></div>
            </div>
            <div id="form-error" class="hidden text-xs text-terracotta bg-terracotta/10 rounded-lg p-3"></div>

          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const BUCKET = 'library-media';
let imgFile=null, vidFile=null, pdfFile=null, thumbFile=null, currentItem=null;

function getMediaType() { return document.querySelector('input[name="media-type"]:checked')?.value || 'article'; }

function onMediaTypeChange() {
  const t = getMediaType();
  document.getElementById('section-article').classList.toggle('hidden',   t !== 'article');
  document.getElementById('section-image').classList.toggle('hidden',     t !== 'image');
  document.getElementById('section-video').classList.toggle('hidden',     t !== 'video');
  document.getElementById('section-pdf').classList.toggle('hidden',       t !== 'pdf');
  document.getElementById('section-thumbnail').classList.toggle('hidden', t === 'image' || t === 'article');
}
function onVideoSrcChange() {
  const s = document.querySelector('input[name="video-src"]:checked')?.value || 'upload';
  document.getElementById('video-upload-area').classList.toggle('hidden', s !== 'upload');
  document.getElementById('video-url-area').classList.toggle('hidden',   s === 'upload');
}
function onPdfSrcChange() {
  const s = document.querySelector('input[name="pdf-src"]:checked')?.value || 'upload';
  document.getElementById('pdf-upload-area').classList.toggle('hidden', s !== 'upload');
  document.getElementById('pdf-url-area').classList.toggle('hidden',   s === 'upload');
}
function previewImage(e) { const f=e.target.files[0]; if(!f) return; imgFile=f; document.getElementById('img-preview').src=URL.createObjectURL(f); document.getElementById('img-preview-wrap').classList.remove('hidden'); document.getElementById('img-placeholder').classList.add('hidden'); }
function previewVideo(e) { const f=e.target.files[0]; if(!f) return; vidFile=f; document.getElementById('vid-preview').src=URL.createObjectURL(f); document.getElementById('vid-preview-wrap').classList.remove('hidden'); document.getElementById('vid-placeholder').classList.add('hidden'); }
function previewPdf(e) { const f=e.target.files[0]; if(!f) return; pdfFile=f; document.getElementById('pdf-name').textContent='📄 '+f.name; document.getElementById('pdf-name').classList.remove('hidden'); document.getElementById('pdf-placeholder').classList.add('hidden'); }
function previewThumb(e) { const f=e.target.files[0]; if(!f) return; thumbFile=f; document.getElementById('thumb-preview').src=URL.createObjectURL(f); document.getElementById('thumb-preview-wrap').classList.remove('hidden'); document.getElementById('thumb-label').textContent=f.name; document.getElementById('thumb-clear').classList.remove('hidden'); }
function clearThumb() { thumbFile=null; document.getElementById('thumb-file').value=''; document.getElementById('thumb-preview-wrap').classList.add('hidden'); document.getElementById('thumb-label').textContent='Upload thumbnail'; document.getElementById('thumb-clear').classList.add('hidden'); }

async function uploadFile(file, folder) {
  const ext=file.name.split('.').pop(), path=`${folder}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await window.db.storage.from(BUCKET).upload(path, file, { upsert:false });
  if (error) throw new Error('Upload gagal: '+error.message);
  const { data } = window.db.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

// ── Render view ───────────────────────────────────────
function renderView(item) {
  currentItem = item;

  document.getElementById('view-status').innerHTML = item.is_active
    ? '<span class="chip bg-green-light text-green-dark">✓ Aktif</span>'
    : '<span class="chip bg-ink/10 text-ink/60">Tidak Aktif</span>';
  document.getElementById('btn-toggle-status').textContent = item.is_active ? 'Nyahaktifkan' : 'Aktifkan';
  document.getElementById('btn-toggle-status').className = `px-4 py-2 border rounded-lg text-sm font-semibold ${item.is_active ? 'border-gold/40 text-gold-dark hover:bg-gold/10' : 'border-green/40 text-green-dark hover:bg-green-light'}`;

  const hero  = document.getElementById('lib-hero');
  const inner = document.getElementById('hero-inner');
  if (item.thumbnail_url) {
    hero.style.backgroundImage    = `url(${item.thumbnail_url})`;
    hero.style.backgroundSize     = 'cover';
    hero.style.backgroundPosition = 'center';
    hero.className = 'rounded-2xl overflow-hidden relative min-h-[200px] flex items-end';
    inner.className = 'p-6 text-white w-full bg-gradient-to-t from-black/60 to-transparent';
  } else {
    hero.style.backgroundImage = '';
    hero.className = `rounded-2xl overflow-hidden relative min-h-[160px] flex items-end bg-gradient-to-br ${item.gradient || 'from-navy to-teal'}`;
    inner.className = 'p-6 text-white w-full';
  }
  inner.innerHTML = `
    <div class="text-4xl mb-2">${item.icon || '📄'}</div>
    <h1 class="text-2xl font-bold drop-shadow">${item.title || ''}</h1>
    ${item.content_type ? `<div class="text-white/70 text-sm mt-1">${item.content_type}</div>` : ''}
  `;

  document.getElementById('stat-type').textContent = item.content_type || '—';
  document.getElementById('stat-cat').textContent  = item.category || '—';

  if (item.description) {
    document.getElementById('view-desc').textContent = item.description;
    document.getElementById('section-desc').classList.remove('hidden');
  } else {
    document.getElementById('section-desc').classList.add('hidden');
  }

  if (item.content_url) {
    document.getElementById('view-content-link').innerHTML =
      `<a href="${item.content_url}" target="_blank" class="inline-flex items-center gap-2 text-sm font-semibold text-navy border border-navy/30 px-4 py-2.5 rounded-lg hover:bg-navy hover:text-white transition-colors">⬇️ Buka Kandungan</a>`;
    document.getElementById('section-link').classList.remove('hidden');
  } else {
    document.getElementById('section-link').classList.add('hidden');
  }

  if (item.content_body) {
    document.getElementById('view-body').textContent = item.content_body;
    document.getElementById('section-body').classList.remove('hidden');
  } else {
    document.getElementById('section-body').classList.add('hidden');
  }
}

// ── Toggle active ─────────────────────────────────────
async function toggleStatus() {
  if (!currentItem) return;
  await dbUpdate('psy_library_items', currentItem.id, { is_active: !currentItem.is_active });
  currentItem.is_active = !currentItem.is_active;
  renderView(currentItem);
  banner(currentItem.is_active ? 'Diaktifkan' : 'Dinyahaktifkan');
}

// ── View / Edit toggle ────────────────────────────────
function enterEdit() {
  imgFile=vidFile=pdfFile=thumbFile=null;
  document.getElementById('edit-id').value    = currentItem.id;
  document.getElementById('f-title').value    = currentItem.title || '';
  document.getElementById('f-desc').value     = currentItem.description || '';
  document.getElementById('f-type').value     = currentItem.content_type || '';
  document.getElementById('f-cat').value      = currentItem.category || 'navy';
  document.getElementById('f-icon').value     = currentItem.icon || '📄';
  document.getElementById('f-gradient').value = currentItem.gradient || 'from-navy to-teal';
  document.getElementById('f-body').value     = currentItem.content_body || '';
  document.getElementById('f-url').value      = '';
  document.getElementById('f-video-url').value = '';
  document.getElementById('f-pdf-url').value  = '';
  document.getElementById('form-error').classList.add('hidden');
  ['img-preview-wrap','vid-preview-wrap','pdf-name','thumb-preview-wrap'].forEach(id => document.getElementById(id).classList.add('hidden'));
  ['img-placeholder','vid-placeholder','pdf-placeholder'].forEach(id => document.getElementById(id).classList.remove('hidden'));
  ['img-existing-url','vid-existing-url','pdf-existing-url','thumb-existing-url'].forEach(id => { const el=document.getElementById(id); if(el) el.classList.add('hidden'); });
  document.getElementById('thumb-label').textContent = 'Upload thumbnail';
  document.getElementById('thumb-clear').classList.add('hidden');

  let detectedType = 'article';
  if (currentItem.content_url) {
    const u = currentItem.content_url.toLowerCase();
    if (/\.(jpg|jpeg|png|gif|webp)/.test(u)) detectedType='image';
    else if (/\.(mp4|webm|mov)/.test(u)||u.includes('youtube')||u.includes('youtu.be')) detectedType='video';
    else if (/\.pdf/.test(u)||u.includes('drive.google.com')) detectedType='pdf';
  }
  document.querySelector(`input[name="media-type"][value="${detectedType}"]`).checked = true;

  if (currentItem.content_url) {
    const short = currentItem.content_url.length > 60 ? currentItem.content_url.slice(0,60)+'…' : currentItem.content_url;
    if (detectedType==='image') { document.getElementById('img-existing-url').textContent='Semasa: '+short; document.getElementById('img-existing-url').classList.remove('hidden'); }
    else if (detectedType==='video') { document.getElementById('vid-existing-url').textContent='Semasa: '+short; document.getElementById('vid-existing-url').classList.remove('hidden'); document.getElementById('f-video-url').value=currentItem.content_url; }
    else if (detectedType==='pdf') { document.getElementById('pdf-existing-url').textContent='Semasa: '+short; document.getElementById('pdf-existing-url').classList.remove('hidden'); document.getElementById('f-pdf-url').value=currentItem.content_url; }
    else { document.getElementById('f-url').value=currentItem.content_url; }
  }
  if (currentItem.thumbnail_url) {
    document.getElementById('thumb-preview').src=currentItem.thumbnail_url;
    document.getElementById('thumb-preview-wrap').classList.remove('hidden');
    document.getElementById('thumb-label').textContent='Tukar thumbnail';
    document.getElementById('thumb-clear').classList.remove('hidden');
    document.getElementById('thumb-existing-url').textContent='Thumbnail sedia ada';
    document.getElementById('thumb-existing-url').classList.remove('hidden');
  }
  onMediaTypeChange(); onVideoSrcChange(); onPdfSrcChange();

  document.getElementById('view-section').classList.add('hidden');
  document.getElementById('edit-section').classList.remove('hidden');
  document.getElementById('btn-bar-view').classList.add('hidden');
  document.getElementById('btn-bar-edit').classList.remove('hidden');
  window.scrollTo({ top:0, behavior:'smooth' });
}

function exitEdit() {
  document.getElementById('edit-section').classList.add('hidden');
  document.getElementById('view-section').classList.remove('hidden');
  document.getElementById('btn-bar-edit').classList.add('hidden');
  document.getElementById('btn-bar-view').classList.remove('hidden');
}

// ── Save ──────────────────────────────────────────────
async function saveItem() {
  const editId=document.getElementById('edit-id').value, title=document.getElementById('f-title').value.trim(), mediaType=getMediaType();
  const errEl=document.getElementById('form-error'); errEl.classList.add('hidden');
  if (!title) { errEl.textContent='Title wajib diisi'; errEl.classList.remove('hidden'); return; }
  const btn=document.getElementById('save-btn'); btn.disabled=true; btn.textContent='Menyimpan...';
  const prog=document.getElementById('upload-progress'), progText=document.getElementById('upload-progress-text');
  try {
    let contentUrl=null, thumbnailUrl=null;
    if (mediaType==='image') { if (imgFile) { prog.classList.remove('hidden'); progText.textContent='Mengupload gambar...'; contentUrl=await uploadFile(imgFile,'images'); } }
    else if (mediaType==='video') {
      const vs=document.querySelector('input[name="video-src"]:checked')?.value||'upload';
      if (vs==='upload') { if (vidFile) { prog.classList.remove('hidden'); progText.textContent='Mengupload video...'; contentUrl=await uploadFile(vidFile,'videos'); } }
      else { contentUrl=document.getElementById('f-video-url').value.trim()||null; }
    } else if (mediaType==='pdf') {
      const ps=document.querySelector('input[name="pdf-src"]:checked')?.value||'upload';
      if (ps==='upload') { if (pdfFile) { prog.classList.remove('hidden'); progText.textContent='Mengupload PDF...'; contentUrl=await uploadFile(pdfFile,'pdfs'); } }
      else { contentUrl=document.getElementById('f-pdf-url').value.trim()||null; }
    } else { contentUrl=document.getElementById('f-url').value.trim()||null; }
    if (thumbFile) { progText.textContent='Mengupload thumbnail...'; prog.classList.remove('hidden'); thumbnailUrl=await uploadFile(thumbFile,'thumbnails'); }
    prog.classList.add('hidden');
    const data = {
      title, description: document.getElementById('f-desc').value.trim()||null,
      content_type: document.getElementById('f-type').value.trim()||null,
      category: document.getElementById('f-cat').value,
      icon: document.getElementById('f-icon').value||'📄',
      gradient: document.getElementById('f-gradient').value||'from-navy to-teal',
      content_body: mediaType==='article' ? (document.getElementById('f-body').value.trim()||null) : null,
      updated_at: new Date().toISOString(),
    };
    if (contentUrl!==null)   data.content_url=contentUrl;
    if (thumbnailUrl!==null) data.thumbnail_url=thumbnailUrl;
    await dbUpdate('psy_library_items', editId, data);
    await auditLog('library.updated', title);
    Object.assign(currentItem, data);
    banner('Kandungan disimpan ✓');
    exitEdit(); renderView(currentItem);
  } catch(err) { prog.classList.add('hidden'); errEl.textContent=err.message; errEl.classList.remove('hidden'); }
  finally { btn.disabled=false; btn.textContent='Simpan'; }
}

// ── Bootstrap ─────────────────────────────────────────
(async () => {
  const user = await initStaff('library', '');
  if (!user) return;
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { banner('ID tidak ditemui','error'); return; }
  setHeaderBack('library.html', 'Kembali ke Library');
  const { data: item } = await window.db.from('psy_library_items').select('*').eq('id', id).single();
  if (!item) { banner('Item tidak ditemui','error'); return; }
  setPageTitle(item.title, 'Detail kandungan library');
  renderView(item);
})();
</script>
