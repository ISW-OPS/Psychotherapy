<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ibnu Sina Wellness — Patients</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../shared/theme.js"></script>
  <script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="_styles.css" rel="stylesheet">
  <style>
    @media print {

      #sidebar,
      #page-header,
      .tab-btn,
      #search-patient,
      #filter-status,
      #filter-pakej,
      #patient-count,
      .print-hide,
      nav,
      .mobile-nav,
      #patient-modal,
      #print-patient-hidden {
        display: none !important;
      }

      #app-shell {
        display: block !important;
      }

      #list-section {
        display: block !important;
      }

      #kyc-section {
        display: none !important;
      }

      body {
        background: white;
      }

      .main-content {
        padding: 0 !important;
      }

      #print-header {
        display: block !important;
      }

      table {
        font-size: 11px;
      }

      th,
      td {
        padding: 6px 8px !important;
      }

      .chip {
        border: 1px solid #ccc !important;
        background: transparent !important;
        color: #333 !important;
      }

      a[href] {
        color: black;
        text-decoration: none;
      }
    }

    #print-header {
      display: none;
    }
  </style>
</head>

<body class="min-h-screen">

  <div id="app-loading" class="min-h-screen flex items-center justify-center">
    <div class="text-center">
      <div class="text-4xl mb-3">👥</div>
      <p class="text-ink/60 text-sm">Memuatkan...</p>
    </div>
  </div>

  <div id="app-shell" class="hidden">
    <div class="flex min-h-screen">
      <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
      <main class="main-content flex-1 min-w-0">
        <header id="page-header"
          class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4">
        </header>

        <div class="p-4 md:p-6 pt-3 md:pt-4 space-y-4">

          <!-- Print-only list header -->
          <div id="print-header" class="mb-4">
            <h1 class="text-xl font-bold">Ibnu Sina Wellness — Senarai Pesakit</h1>
            <p class="text-xs text-gray-500" id="print-date"></p>
          </div>

          <!-- ── Patient List ─────────────────────────────── -->
          <div id="list-section">
            <div class="flex items-center gap-3 mb-3 flex-wrap print-hide">
              <div class="relative flex-1 min-w-48">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/40 pointer-events-none" width="15"
                  height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                  stroke-linecap="round">
                  <circle cx="10" cy="10" r="7" />
                  <line x1="15.5" y1="15.5" x2="22" y2="22" />
                </svg>
                <input id="search-patient" type="text" placeholder="Cari nama, Patient ID atau IC..."
                  oninput="filterPatients()"
                  class="w-full pl-9 pr-3 py-2.5 border border-ink/20 rounded-xl text-sm focus:border-navy outline-none bg-white">
              </div>
              <select id="filter-status" onchange="filterPatients()"
                class="px-3 py-2.5 border border-ink/20 rounded-xl text-sm bg-white focus:border-navy outline-none">
                <option value="">Semua Status</option>
                <option value="active">Aktif</option>
                <option value="inactive">Tidak Aktif</option>
              </select>
              <select id="filter-pakej" onchange="filterPatients()"
                class="px-3 py-2.5 border border-ink/20 rounded-xl text-sm bg-white focus:border-navy outline-none">
                <option value="">Semua Pakej</option>
              </select>
              <span id="patient-count" class="text-xs text-ink/50 whitespace-nowrap"></span>
              <button onclick="exportCSV()"
                class="flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-semibold text-white transition-colors hover:opacity-90"
                style="background-color:#1D6F42">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="3" width="9" height="18" rx="1" />
                  <line x1="5" y1="8" x2="8" y2="13" />
                  <line x1="8" y1="8" x2="5" y2="13" />
                  <rect x="11" y="3" width="11" height="18" rx="1" />
                  <line x1="13" y1="8" x2="20" y2="8" />
                  <line x1="13" y1="12" x2="20" y2="12" />
                  <line x1="13" y1="16" x2="20" y2="16" />
                  <line x1="16.5" y1="5" x2="16.5" y2="19" />
                </svg>
                Excel
              </button>
              <button onclick="printList()"
                class="flex items-center gap-1.5 px-4 py-2.5 bg-navy text-white rounded-xl text-sm hover:bg-navy-dark transition-colors">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 6 2 18 2 18 9" />
                  <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                  <rect x="6" y="14" width="12" height="8" />
                  <circle cx="18" cy="11.5" r="1" fill="currentColor" stroke="none" />
                  <circle cx="15" cy="11.5" r="1" fill="currentColor" stroke="none" />
                </svg>
                Print
              </button>
              <button onclick="openCreatePatient()"
                class="flex items-center gap-1.5 px-4 py-2.5 bg-green text-white rounded-xl text-sm hover:bg-green-dark transition-colors font-semibold">
                + Tambah Pesakit
              </button>
            </div>

            <div class="bg-white rounded-xl border border-ink/10 overflow-x-auto">
              <table class="data">
                <thead>
                  <tr>
                    <th>No</th>
                    <th>Patient ID</th>
                    <th>Nama</th>
                    <th>Telefon</th>
                    <th>Pakej</th>
                    <th>Jantina</th>
                    <th>Status</th>
                    <th class="print-hide"></th>
                  </tr>
                </thead>
                <tbody id="patients-body"></tbody>
              </table>
            </div>

            <!-- Pagination -->
            <div id="pagination" class="flex items-center justify-between mt-3 print-hide hidden">
              <span id="pagination-info" class="text-xs text-ink/50"></span>
              <div id="pagination-btns" class="flex items-center gap-1"></div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- ── Create Patient Modal ──────────────────────── -->
  <div id="create-patient-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl flex flex-col max-h-[90vh]">
      <div class="flex items-center justify-between px-6 py-4 border-b border-ink/10 flex-shrink-0">
        <h3 class="font-bold text-lg" id="cp-modal-title">Tambah Pesakit Baru</h3>
        <button onclick="closeCreatePatient()" class="text-ink/40 hover:text-ink text-2xl leading-none">&times;</button>
      </div>
      <div class="px-6 py-5 space-y-5 overflow-y-auto">

        <!-- MAKLUMAT PERIBADI -->
        <div>
          <p class="text-[10px] font-bold text-ink/40 uppercase tracking-wide mb-3">Maklumat Peribadi</p>

          <!-- Row 1: Nama | No Kad | Telefon -->
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="text-xs font-semibold">Nama Penuh *</label>
              <input id="cp-name" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                placeholder="cth: Ahmad bin Ali">
            </div>
            <div>
              <label class="text-xs font-semibold">No Kad Pengenalan / Passport *</label>
              <input id="cp-ic" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                placeholder="cth: 900101011234">
            </div>
            <div>
              <label class="text-xs font-semibold">Telefon *</label>
              <input id="cp-phone" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                placeholder="cth: 0123456789">
            </div>
          </div>

          <!-- Row 2: Jantina | Tarikh Lahir | E-mel | Pekerjaan -->
          <div class="grid grid-cols-4 gap-3 mt-3">
            <div>
              <label class="text-xs font-semibold">Jantina *</label>
              <div class="flex gap-1.5 mt-1">
                <button type="button" onclick="toggleChoice(this,'cp-gender')" data-val="M"
                  class="choice-btn flex-1 py-2 border border-ink/20 rounded-lg text-xs font-medium text-ink/70 hover:border-navy transition-colors">Lelaki</button>
                <button type="button" onclick="toggleChoice(this,'cp-gender')" data-val="F"
                  class="choice-btn flex-1 py-2 border border-ink/20 rounded-lg text-xs font-medium text-ink/70 hover:border-navy transition-colors">Perempuan</button>
              </div>
              <input type="hidden" id="cp-gender" value="">
            </div>
            <div>
              <label class="text-xs font-semibold">Tarikh Lahir *</label>
              <input id="cp-dob" type="date" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
            </div>
            <div>
              <label class="text-xs font-semibold">E-mel *</label>
              <input id="cp-email" type="email" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                placeholder="cth: ahmad@gmail.com">
            </div>
            <div>
              <label class="text-xs font-semibold">Pekerjaan *</label>
              <input id="cp-occupation" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                placeholder="cth: Guru ">
              <input id="cp-company" type="hidden" value="">
            </div>
          </div>

          <!-- Row 3: Alamat | Status Perkahwinan -->
          <div class="grid grid-cols-3 gap-3 mt-3">
            <div>
              <label class="text-xs font-semibold">Alamat *</label>
              <input id="cp-address" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                placeholder="No, Jalan, Bandar, Negeri">
            </div>
            <div class="col-span-2">
              <label class="text-xs font-semibold">Status Perkahwinan *</label>
              <div class="flex gap-2 mt-1">
                <button type="button" onclick="toggleChoice(this,'cp-marital')" data-val="Bujang"
                  class="choice-btn flex-1 py-2 border border-ink/20 rounded-lg text-sm font-medium text-ink/70 hover:border-navy transition-colors">Bujang</button>
                <button type="button" onclick="toggleChoice(this,'cp-marital')" data-val="Berkahwin"
                  class="choice-btn flex-1 py-2 border border-ink/20 rounded-lg text-sm font-medium text-ink/70 hover:border-navy transition-colors">Berkahwin</button>
                <button type="button" onclick="toggleChoice(this,'cp-marital')" data-val="Janda"
                  class="choice-btn flex-1 py-2 border border-ink/20 rounded-lg text-sm font-medium text-ink/70 hover:border-navy transition-colors">Janda</button>
                <button type="button" onclick="toggleChoice(this,'cp-marital')" data-val="Duda"
                  class="choice-btn flex-1 py-2 border border-ink/20 rounded-lg text-sm font-medium text-ink/70 hover:border-navy transition-colors">Duda</button>
              </div>
              <input type="hidden" id="cp-marital" value="">
            </div>
          </div>
        </div>

        <!-- MAKLUMAT PERUBATAN -->
        <div class="border-t border-ink/10 pt-4">
          <p class="text-[10px] font-bold text-ink/40 uppercase tracking-wide mb-3">Maklumat Perubatan</p>
          <label class="text-xs font-semibold">Masalah Kesihatan * <span class="text-ink/40 font-normal">(pilih sekurang-kurangnya satu)</span></label>
          <div id="cp-conditions-grid" class="grid grid-cols-3 gap-x-4 gap-y-2 mt-2">
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Diabetes"
                class="rounded"> Diabetes</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox"
                value="Darah Tinggi (Hypertension)" class="rounded"> Darah Tinggi (Hypertension)</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox"
                value="Kolesterol Tinggi" class="rounded"> Kolesterol Tinggi</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox"
                value="Anxiety Disorder" class="rounded"> Anxiety Disorder</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Depression"
                class="rounded"> Depression</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox"
                value="Bipolar Disorder" class="rounded"> Bipolar Disorder</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Panic Attack"
                class="rounded"> Panic Attack</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox"
                value="Insomnia / Masalah Tidur" class="rounded"> Insomnia / Masalah Tidur</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="OCD"
                class="rounded"> OCD</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="PTSD / Trauma"
                class="rounded"> PTSD / Trauma</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Autism"
                class="rounded"> Autism</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="ADHD"
                class="rounded"> ADHD</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Schizophrenia"
                class="rounded"> Schizophrenia</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Stress Kronik"
                class="rounded"> Stress Kronik</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Migrain"
                class="rounded"> Migrain</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Sakit Jantung"
                class="rounded"> Sakit Jantung</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Asthma"
                class="rounded"> Asthma</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Gastrik / GERD"
                class="rounded"> Gastrik / GERD</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Thyroid"
                class="rounded"> Thyroid</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox"
                value="Epilepsy / Sawan" class="rounded"> Epilepsy / Sawan</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox"
                value="Slip Disc / Sakit Belakang" class="rounded"> Slip Disc / Sakit Belakang</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Obesiti"
                class="rounded"> Obesiti</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Kanser"
                class="rounded"> Kanser</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Stroke"
                class="rounded"> Stroke</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Buah Pinggang"
                class="rounded"> Buah Pinggang</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox"
                value="Arthritis / Sendi" class="rounded"> Arthritis / Sendi</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" value="Ketagihan Dadah"
                class="rounded"> Ketagihan Dadah</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox"
                value="Ketagihan Alkohol" class="rounded"> Ketagihan Alkohol</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox"
                value="Ketagihan Pornografi" class="rounded"> Ketagihan Pornografi</label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox"
                value="Smoking / Vape Addiction" class="rounded"> Smoking / Vape Addiction</label>
          </div>
          <!-- Lain-lain -->
          <div class="flex items-center gap-2 mt-3">
            <input type="checkbox" id="cp-cond-other-check" class="rounded"
              onchange="const el=document.getElementById('cp-condition-other');el.disabled=!this.checked;el.style.opacity=this.checked?'1':'0.4';el.style.cursor=this.checked?'text':'not-allowed';if(this.checked)el.focus();">
            <label class="text-xs font-semibold">Lain-lain:</label>
            <input id="cp-condition-other" disabled placeholder="Nyatakan..."
              class="flex-1 px-3 py-1.5 border border-ink/20 rounded-lg text-sm" style="opacity:0.4;cursor:not-allowed"
              onchange="" onfocus="" oninput="">
          </div>
        </div>

        <!-- MAKLUMAT WARIS -->
        <div class="border-t border-ink/10 pt-4">
          <p class="text-[10px] font-bold text-ink/40 uppercase tracking-wide mb-3">Maklumat Waris / Kecemasan</p>
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="text-xs font-semibold">Nama Penuh *</label>
              <input id="cp-emg-name" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
            </div>
            <div>
              <label class="text-xs font-semibold">No Kad Pengenalan / Passport *</label>
              <input id="cp-emg-ic" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                placeholder="cth: 900101011234">
            </div>
            <div>
              <label class="text-xs font-semibold">Telefon *</label>
              <input id="cp-emg-phone" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
            </div>
            <div class="col-span-3">
              <label class="text-xs font-semibold">Hubungan *</label>
              <div class="grid grid-cols-3 gap-x-4 gap-y-2 mt-2">
                <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="radio"
                    name="cp-emg-rel-radio" value="Ibu/Bapa" onchange="onHubunganChange(this)" class="rounded">
                  Ibu/Bapa</label>
                <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="radio"
                    name="cp-emg-rel-radio" value="Adik-Beradik" onchange="onHubunganChange(this)" class="rounded">
                  Adik-Beradik</label>
                <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="radio"
                    name="cp-emg-rel-radio" value="Suami/Isteri" onchange="onHubunganChange(this)" class="rounded">
                  Suami/Isteri</label>
                <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="radio"
                    name="cp-emg-rel-radio" value="Anak" onchange="onHubunganChange(this)" class="rounded"> Anak</label>
              </div>
              <div class="flex items-center gap-2 mt-2">
                <input type="radio" name="cp-emg-rel-radio" value="__other__" onchange="onHubunganChange(this)"
                  class="rounded">
                <label class="text-xs font-semibold">Lain-lain:</label>
                <input id="cp-emg-rel-other" disabled placeholder="Nyatakan..."
                  class="flex-1 px-3 py-1.5 border border-ink/20 rounded-lg text-sm"
                  style="opacity:0.4;cursor:not-allowed">
              </div>
              <input type="hidden" id="cp-emg-rel" value="">
            </div>
            <div>
              <label class="text-xs font-semibold">E-mel *</label>
              <input id="cp-emg-email" type="email"
                class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm" placeholder="cth: waris@gmail.com">
            </div>
          </div>
        </div>

        <div id="cp-error" class="hidden text-xs text-red-600 bg-red-50 rounded-lg px-3 py-2"></div>
      </div>
      <div class="px-6 py-4 border-t border-ink/10 flex justify-end gap-2 flex-shrink-0">
        <button onclick="closeCreatePatient()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm">Batal</button>
        <button onclick="savePatient()" id="cp-save-btn"
          class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold">Simpan</button>
      </div>
    </div>
  </div>

  <!-- ── Link Account Modal ────────────────────────── -->
  <div id="link-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md flex flex-col">
      <div class="flex items-center justify-between px-6 py-4 border-b border-ink/10">
        <div>
          <h3 class="font-bold">Link Akaun Pesakit</h3>
          <p id="link-patient-name" class="text-sm text-navy font-semibold"></p>
          <p id="link-patient-ic" class="text-xs text-ink/50"></p>
        </div>
        <button onclick="closeLinkModal()" class="text-ink/40 hover:text-ink text-2xl">&times;</button>
      </div>
      <div class="p-5 space-y-3">
        <p class="text-xs text-ink/60">Cari akaun yang telah didaftar oleh pesakit ini:</p>
        <input id="link-search" type="text" oninput="searchLinkUsers()"
          placeholder="Cari nama atau emel akaun patient..."
          class="w-full px-3 py-2.5 border border-ink/20 rounded-xl text-sm focus:border-navy outline-none">
        <div id="link-results" class="space-y-1 max-h-52 overflow-y-auto"></div>
        <div id="link-error" class="hidden text-xs text-red-600 bg-red-50 rounded-lg px-3 py-2"></div>
      </div>
      <div class="px-6 py-3 border-t border-ink/10 flex justify-end">
        <button onclick="closeLinkModal()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm">Tutup</button>
      </div>
    </div>
  </div>

  <!-- ── Patient Detail Modal ───────────────────────── -->
  <div id="patient-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between px-6 py-4 border-b border-ink/10 flex-shrink-0">
        <div>
          <h3 class="font-bold text-lg" id="modal-pt-name">—</h3>
          <p class="text-xs text-ink/50" id="modal-pt-mrn">—</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="printPatientReport()"
            class="flex items-center gap-1.5 bg-navy text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-navy-dark">
            🖨️ Print
          </button>
          <button onclick="closePatientModal()"
            class="text-ink/40 hover:text-ink text-2xl leading-none px-1">&times;</button>
        </div>
      </div>
      <div id="modal-pt-body" class="p-6 overflow-y-auto space-y-4"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../config/supabase.js"></script>
  <script src="../../shared/authGuard.js"></script>
  <script src="../../shared/logout.js"></script>
  <script src="../../shared/navbar.js"></script>
  <script src="_shared.js"></script>
  <script>
    let allPatients = [];
    let currentFiltered = [];
    let currentDetailPt = null;
    let isAdmin = false;
    let editingPatientId = null;

    // ── Create Patient ────────────────────────────────────
    function onHubunganChange(radio) {
      const otherInput = document.getElementById('cp-emg-rel-other');
      if (radio.value === '__other__') {
        otherInput.disabled = false;
        otherInput.style.opacity = '1';
        otherInput.style.cursor = 'text';
        otherInput.focus();
        document.getElementById('cp-emg-rel').value = '';
        otherInput.oninput = () => document.getElementById('cp-emg-rel').value = otherInput.value.trim();
      } else {
        otherInput.disabled = true;
        otherInput.style.opacity = '0.4';
        otherInput.style.cursor = 'not-allowed';
        otherInput.value = '';
        document.getElementById('cp-emg-rel').value = radio.value;
      }
    }

    function toggleChoice(btn, hiddenId) {
      btn.parentElement.querySelectorAll('.choice-btn').forEach(b => {
        b.classList.remove('bg-navy', 'text-white', 'border-navy');
        b.classList.add('border-ink/20', 'text-ink/70');
      });
      btn.classList.add('bg-navy', 'text-white', 'border-navy');
      btn.classList.remove('border-ink/20', 'text-ink/70');
      document.getElementById(hiddenId).value = btn.dataset.val;
    }

    function resetCreateForm() {
      ['cp-name', 'cp-ic', 'cp-phone', 'cp-email', 'cp-address',
        'cp-emg-name', 'cp-emg-ic', 'cp-emg-phone', 'cp-occupation', 'cp-emg-rel', 'cp-emg-email'].forEach(id => {
          const el = document.getElementById(id); if (el) el.value = '';
        });
      document.getElementById('cp-gender').value = '';
      document.getElementById('cp-dob').value = '';
      document.getElementById('cp-marital').value = '';
      document.getElementById('cp-condition-other').value = '';
      document.getElementById('cp-condition-other').disabled = true;
      document.getElementById('cp-cond-other-check').checked = false;
      const relOther = document.getElementById('cp-emg-rel-other');
      relOther.classList.remove('hidden');
      relOther.value = '';
      relOther.disabled = true;
      relOther.style.opacity = '0.4';
      relOther.style.cursor = 'not-allowed';
      document.querySelectorAll('#cp-conditions-grid input[type=checkbox]').forEach(cb => cb.checked = false);
      document.getElementById('cp-error').classList.add('hidden');
      document.querySelectorAll('input[name="cp-emg-rel-radio"]').forEach(r => r.checked = false);
      document.querySelectorAll('#create-patient-modal .choice-btn').forEach(b => {
        b.classList.remove('bg-navy', 'text-white', 'border-navy');
        b.classList.add('border-ink/20', 'text-ink/70');
      });
    }

    function openCreatePatient() {
      editingPatientId = null;
      resetCreateForm();
      document.getElementById('cp-modal-title').textContent = 'Tambah Pesakit Baru';
      document.getElementById('cp-save-btn').textContent = 'Simpan';
      // IC field editable for new patient
      document.getElementById('cp-ic').readOnly = false;
      document.getElementById('cp-ic').classList.remove('bg-cream/40');
      document.getElementById('create-patient-modal').classList.remove('hidden');
    }

    function openEditPatient(id) {
      const p = allPatients.find(x => x.id === id);
      if (!p) return;
      editingPatientId = id;
      resetCreateForm();

      document.getElementById('cp-modal-title').textContent = 'Edit Maklumat Pesakit';
      document.getElementById('cp-save-btn').textContent = 'Kemaskini';

      // Fill fields
      document.getElementById('cp-name').value        = p.full_name || p.psy_profiles?.full_name || '';
      document.getElementById('cp-phone').value       = p.phone || p.psy_profiles?.phone || '';
      document.getElementById('cp-email').value       = p.email || p.psy_profiles?.email || '';
      document.getElementById('cp-address').value     = p.address || '';
      document.getElementById('cp-occupation').value  = p.occupation || '';
      document.getElementById('cp-dob').value         = p.date_of_birth || '';

      // IC — readonly when editing (cannot change IC)
      document.getElementById('cp-ic').value    = p.ic_number || '';
      document.getElementById('cp-ic').readOnly = true;
      document.getElementById('cp-ic').classList.add('bg-cream/40');

      // Gender toggle
      if (p.gender) {
        const gBtn = document.querySelector(`#create-patient-modal .choice-btn[data-val="${p.gender}"]`);
        if (gBtn) toggleChoice(gBtn, 'cp-gender');
      }

      // Marital status toggle
      if (p.marital_status) {
        const mBtn = document.querySelector(`#create-patient-modal .choice-btn[data-val="${p.marital_status}"]`);
        if (mBtn) toggleChoice(mBtn, 'cp-marital');
      }

      // Medical conditions — tick matching checkboxes
      const condList = (p.medical_condition || '').split(',').map(c => c.trim());
      document.querySelectorAll('#cp-conditions-grid input[type=checkbox]').forEach(cb => {
        if (condList.includes(cb.value)) cb.checked = true;
      });
      // Check for "Lain-lain" conditions
      const otherCond = condList.find(c => c.startsWith('Lain-lain:'));
      if (otherCond) {
        document.getElementById('cp-cond-other-check').checked = true;
        const otherEl = document.getElementById('cp-condition-other');
        otherEl.value = otherCond.replace('Lain-lain:', '').trim();
        otherEl.disabled = false;
        otherEl.style.opacity = '1';
        otherEl.style.cursor = 'text';
      }

      // Emergency contact
      document.getElementById('cp-emg-name').value  = p.emergency_contact_name || '';
      document.getElementById('cp-emg-ic').value    = p.emergency_contact_ic || '';
      document.getElementById('cp-emg-phone').value = p.emergency_contact_phone || '';
      document.getElementById('cp-emg-email').value = p.emergency_contact_email || '';

      const rel = p.emergency_contact_relationship || '';
      document.getElementById('cp-emg-rel').value = rel;
      const knownRels = ['Ibu/Bapa', 'Adik-Beradik', 'Suami/Isteri', 'Anak'];
      if (knownRels.includes(rel)) {
        const radio = document.querySelector(`input[name="cp-emg-rel-radio"][value="${rel}"]`);
        if (radio) { radio.checked = true; }
      } else if (rel) {
        const otherRadio = document.querySelector(`input[name="cp-emg-rel-radio"][value="__other__"]`);
        if (otherRadio) { otherRadio.checked = true; }
        const relOther = document.getElementById('cp-emg-rel-other');
        relOther.value = rel;
        relOther.disabled = false;
        relOther.style.opacity = '1';
        relOther.style.cursor = 'text';
      }

      document.getElementById('create-patient-modal').classList.remove('hidden');
    }

    function closeCreatePatient() {
      document.getElementById('create-patient-modal').classList.add('hidden');
    }

    async function savePatient() {
      const name = document.getElementById('cp-name').value.trim();
      const ic = document.getElementById('cp-ic').value.trim();
      const phone = document.getElementById('cp-phone').value.trim();
      const address = document.getElementById('cp-address').value.trim();
      const emgName = document.getElementById('cp-emg-name').value.trim();
      const emgPhone = document.getElementById('cp-emg-phone').value.trim();
      const emgRel = document.getElementById('cp-emg-rel').value.trim();
      const emgEmail = document.getElementById('cp-emg-email').value.trim();
      const emgIc = document.getElementById('cp-emg-ic').value.trim();
      const occupation = document.getElementById('cp-occupation').value.trim();
      const errEl = document.getElementById('cp-error');

      // Build condition string from checkboxes
      const checked = [...document.querySelectorAll('#cp-conditions-grid input[type=checkbox]:checked')].map(cb => cb.value);
      const otherVal = document.getElementById('cp-condition-other').value.trim();
      if (document.getElementById('cp-cond-other-check').checked && otherVal) checked.push('Lain-lain: ' + otherVal);
      const condition = checked.join(', ');

      const gender = document.getElementById('cp-gender').value;
      const dob = document.getElementById('cp-dob').value;
      const email = document.getElementById('cp-email').value.trim();
      const marital = document.getElementById('cp-marital').value;

      if (!name || !ic || !phone || !gender || !dob || !email || !occupation || !address || !marital ||
          !condition || !emgName || !emgIc || !emgPhone || !emgRel || !emgEmail) {
        errEl.textContent = 'Semua field bertanda * wajib diisi.';
        errEl.classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('cp-save-btn');
      btn.disabled = true; btn.textContent = 'Menyimpan...';

      const payload = {
        full_name: name,
        phone,
        email: email || null,
        gender: gender || null,
        date_of_birth: dob || null,
        marital_status: marital || null,
        address,
        medical_condition: condition || null,
        emergency_contact_name: emgName,
        emergency_contact_phone: emgPhone,
        emergency_contact_relationship: emgRel || null,
        emergency_contact_email: emgEmail || null,
        emergency_contact_ic: emgIc || null,
        occupation: occupation || null,
      };

      try {
        if (editingPatientId) {
          // UPDATE existing patient
          const { error } = await window.db.from('psy_patients').update(payload).eq('id', editingPatientId);
          if (error) throw error;
          await auditLog('patient.updated_by_staff', editingPatientId, { name });
          banner('Maklumat pesakit dikemaskini ✅');
        } else {
          // CREATE new patient
          const mrn = 'PSY-' + Date.now().toString().slice(-6);
          const { error } = await window.db.from('psy_patients').insert({
            mrn, user_id: null, ic_number: ic, status: 'active', created_by_staff: true, ...payload,
          });
          if (error) throw error;
          await auditLog('patient.created_by_staff', mrn, { name, ic });
          banner('Pesakit baru berjaya ditambah ✅');
        }
        closeCreatePatient();
        loadAll();
      } catch (err) {
        errEl.textContent = 'Ralat: ' + err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = editingPatientId ? 'Kemaskini' : 'Simpan';
      }
    }

    // ── Patient List ─────────────────────────────────────
    const PAGE_SIZE = 15;
    let currentPage = 1;

    function renderPatients(list, resetPage = true) {
      currentFiltered = list;
      if (resetPage) currentPage = 1;

      const total = list.length;
      const totalPages = Math.ceil(total / PAGE_SIZE);
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = list.slice(start, start + PAGE_SIZE);

      document.getElementById('patient-count').textContent = `Total Pesakit : ${total} orang`;

      document.getElementById('patients-body').innerHTML = pageItems.length
        ? pageItems.map((p, i) => {
          const name = p.psy_profiles?.full_name || p.full_name || '—';
          const phone = p.psy_profiles?.phone || p.phone || p.emergency_contact_phone || '—';
          return `<tr>
          <td class="text-xs text-ink/50 text-center">${start + i + 1}</td>
          <td class="text-xs font-mono">${p.mrn}</td>
          <td>
            <strong>${name}</strong>
            ${(!p.user_id) ? '<span class="text-[9px] bg-terracotta/15 text-terracotta px-1.5 py-0.5 rounded ml-1">Belum Daftar</span>' : ''}
          </td>
          <td class="text-xs">${phone}</td>
          <td class="text-xs">${p.active_package_name
              ? `<span class="chip bg-navy-light text-navy">${p.active_package_name}</span>`
              : '<span class="text-ink/40">—</span>'}</td>
          <td>${p.gender === 'M' ? 'Lelaki' : p.gender === 'F' ? 'Perempuan' : '—'}</td>
          <td>${statusChip(p.status)}</td>
          <td class="whitespace-nowrap print-hide space-x-3">
            <a href="patient-hub.html?patient_id=${p.id}" class="text-navy text-xs font-semibold hover:underline">Details</a>
            ${isAdmin ? `<button onclick="openEditPatient('${p.id}')" class="text-teal text-xs font-semibold hover:underline">Edit</button>` : ''}
            ${isAdmin ? `<button onclick="deletePatient('${p.id}','${(p.full_name || p.psy_profiles?.full_name || '').replace(/'/g, "\\'")}' )" class="text-terracotta text-xs font-semibold hover:underline">Padam</button>` : ''}
          </td>
        </tr>`;
        }).join('')
        : '<tr><td colspan="8" class="text-center text-ink/40 py-8">Tiada pesakit ditemui</td></tr>';

      renderPagination(total, totalPages);
    }

    function renderPagination(total, totalPages) {
      const pag = document.getElementById('pagination');
      const info = document.getElementById('pagination-info');
      const btns = document.getElementById('pagination-btns');

      if (totalPages <= 1) { pag.classList.add('hidden'); return; }
      pag.classList.remove('hidden');

      const start = (currentPage - 1) * PAGE_SIZE + 1;
      const end = Math.min(currentPage * PAGE_SIZE, total);
      info.textContent = `Menunjukkan ${start}–${end} daripada ${total} pesakit`;

      let html = '';
      // Prev
      html += `<button onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}
    class="px-3 py-1.5 rounded-lg text-sm border border-ink/20 hover:border-navy hover:text-navy transition-colors disabled:opacity-30 disabled:cursor-not-allowed">‹</button>`;

      // Page numbers
      for (let p = 1; p <= totalPages; p++) {
        if (totalPages > 7 && p > 2 && p < totalPages - 1 && Math.abs(p - currentPage) > 1) {
          if (p === 3 || p === totalPages - 2) html += `<span class="px-1 text-ink/40 text-sm">…</span>`;
          continue;
        }
        html += `<button onclick="goPage(${p})"
      class="px-3 py-1.5 rounded-lg text-sm border transition-colors ${p === currentPage
            ? 'bg-navy text-white border-navy'
            : 'border-ink/20 hover:border-navy hover:text-navy'}">${p}</button>`;
      }

      // Next
      html += `<button onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}
    class="px-3 py-1.5 rounded-lg text-sm border border-ink/20 hover:border-navy hover:text-navy transition-colors disabled:opacity-30 disabled:cursor-not-allowed">›</button>`;

      btns.innerHTML = html;
    }

    function goPage(p) {
      const totalPages = Math.ceil(currentFiltered.length / PAGE_SIZE);
      if (p < 1 || p > totalPages) return;
      currentPage = p;
      renderPatients(currentFiltered, false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filterPatients() {
      const q = document.getElementById('search-patient').value.toLowerCase();
      const status = document.getElementById('filter-status').value;
      const pakej = document.getElementById('filter-pakej').value;
      const list = allPatients.filter(p => {
        const name = (p.psy_profiles?.full_name || p.full_name || '').toLowerCase();
        const matchQ = !q || name.includes(q) || (p.mrn || '').toLowerCase().includes(q) || (p.ic_number || '').includes(q);
        const matchS = !status || p.status === status;
        const matchP = !pakej
          || (pakej === '__none__' ? !p.active_package_name : p.active_package_name === pakej);
        return matchQ && matchS && matchP;
      });
      renderPatients(list);
    }

    function populatePackageFilter() {
      const names = [...new Set(allPatients.map(p => p.active_package_name).filter(Boolean))].sort();
      const sel = document.getElementById('filter-pakej');
      sel.innerHTML = '<option value="">Semua Pakej</option>'
        + names.map(n => `<option value="${n}">${n}</option>`).join('')
        + '<option value="__none__">Tiada Pakej</option>';
    }

    // ── Patient Detail Modal ──────────────────────────────
    function openPatientDetail(id) {
      const p = allPatients.find(x => x.id === id);
      if (!p) return;
      currentDetailPt = p;

      const name = p.psy_profiles?.full_name || '—';
      const phone = p.psy_profiles?.phone || '—';
      const email = p.psy_profiles?.email || '—';

      document.getElementById('modal-pt-name').textContent = name;
      document.getElementById('modal-pt-mrn').textContent = `Patient ID: ${p.mrn}`;

      document.getElementById('modal-pt-body').innerHTML = `
    <!-- Status banner -->
    <div class="flex gap-3 items-center flex-wrap">
      ${statusChip(p.status)}
      ${p.active_package_name ? `<span class="chip bg-navy-light text-navy text-xs">${p.active_package_name}</span>` : ''}
    </div>

    <!-- Personal info -->
    <div class="grid md:grid-cols-2 gap-3 text-sm">
      <div class="bg-cream/40 rounded-xl p-4 space-y-2">
        <div class="text-[10px] font-bold text-ink/50 uppercase tracking-wide mb-1">Maklumat Peribadi</div>
        <div class="flex justify-between"><span class="text-ink/60">No. IC</span><strong>${p.ic_number || '—'}</strong></div>
        <div class="flex justify-between"><span class="text-ink/60">Tarikh Lahir</span><strong>${p.date_of_birth || '—'}</strong></div>
        <div class="flex justify-between"><span class="text-ink/60">Jantina</span><strong>${p.gender === 'M' ? 'Lelaki' : p.gender === 'F' ? 'Perempuan' : '—'}</strong></div>
        <div class="flex justify-between"><span class="text-ink/60">Rujukan</span><strong>${p.referral_source || '—'}</strong></div>
      </div>
      <div class="bg-cream/40 rounded-xl p-4 space-y-2">
        <div class="text-[10px] font-bold text-ink/50 uppercase tracking-wide mb-1">Hubungi</div>
        <div class="flex justify-between"><span class="text-ink/60">Telefon</span><strong>${phone}</strong></div>
        <div class="flex justify-between"><span class="text-ink/60">Email</span><strong class="text-xs">${email}</strong></div>
        <div class="flex justify-between"><span class="text-ink/60">Alamat</span><strong class="text-xs text-right max-w-[60%]">${p.address || '—'}</strong></div>
      </div>
    </div>

    <!-- Emergency contact -->
    <div class="bg-gold/10 rounded-xl p-4 text-sm space-y-1">
      <div class="text-[10px] font-bold text-ink/50 uppercase tracking-wide mb-1">🚨 Hubungi Kecemasan</div>
      <div class="flex gap-6 flex-wrap">
        <span><strong>${p.emergency_contact_name || '—'}</strong></span>
        <span class="text-ink/60">${p.emergency_contact_phone || '—'}</span>
      </div>
    </div>

    <!-- Medical info -->
    <div class="bg-terracotta/5 rounded-xl p-4 text-sm space-y-2">
      <div class="text-[10px] font-bold text-ink/50 uppercase tracking-wide mb-1">🩺 Maklumat Perubatan</div>
      <div class="flex justify-between"><span class="text-ink/60">Kondisi</span><strong>${p.medical_condition || '—'}</strong></div>
      <div class="flex justify-between"><span class="text-ink/60">Tempoh</span><strong>${p.condition_duration || '—'}</strong></div>
      ${p.medical_notes ? `<div class="text-xs text-ink/70 italic border-t border-ink/10 pt-2 mt-2">${p.medical_notes}</div>` : ''}
    </div>

    <!-- Consent -->
    <div class="text-xs text-ink/50 flex gap-4 flex-wrap pt-1">
      <span>Consent daftar: ${new Date(p.created_at).toLocaleDateString('ms-MY')}</span>
    </div>`;

      document.getElementById('patient-modal').classList.remove('hidden');
    }

    function closePatientModal() {
      document.getElementById('patient-modal').classList.add('hidden');
      currentDetailPt = null;
    }

    // ── Print per-patient report in new window ────────────
    function printPatientReport() {
      const p = currentDetailPt;
      if (!p) return;
      const name = p.psy_profiles?.full_name || '—';
      const phone = p.psy_profiles?.phone || '—';
      const email = p.psy_profiles?.email || '—';
      const now = new Date().toLocaleString('ms-MY', { dateStyle: 'full', timeStyle: 'short' });

      const html = `<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8">
  <title>Laporan Pesakit — ${name}</title>
  <style>
    body { font-family: Arial, sans-serif; font-size: 12px; color: #1a1a2e; margin: 0; padding: 24px; }
    .header { border-bottom: 2px solid #1a1a2e; padding-bottom: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; }
    .header h1 { font-size: 18px; margin: 0 0 4px; }
    .header p  { font-size: 10px; color: #666; margin: 0; }
    .badge { display: inline-block; font-size: 10px; padding: 2px 8px; border: 1px solid #ccc; border-radius: 20px; margin-right: 4px; }

    .footer { margin-top: 40px; border-top: 1px solid #eee; padding-top: 10px; font-size: 9px; color: #999; display: flex; justify-content: space-between; }
    @media print { body { padding: 16px; } }
  </style>
  </head><body>
  <div class="header">
    <div>
      <h1>Laporan Pesakit</h1>
      <p>Ibnu Sina Wellness · Sulit &amp; Rahsia</p>
    </div>
    <div style="text-align:right">
      <strong style="font-size:15px">${name}</strong><br>
      <span style="font-size:10px;color:#666">MRN: ${p.mrn}</span>
    </div>
  </div>

  <div style="margin-bottom:14px">
    <span class="badge">${p.status === 'active' ? 'Aktif' : p.status === 'pending_kyc' ? 'Pending KYC' : p.status || '—'}</span>
    ${p.active_package_name ? `<span class="badge">${p.active_package_name}</span>` : ''}
  </div>

  <div class="grid">
    <div class="section">
      <div class="section-title">Maklumat Peribadi</div>
      <div class="row"><span>No. IC</span><strong>${p.ic_number || '—'}</strong></div>
      <div class="row"><span>Tarikh Lahir</span><strong>${p.date_of_birth || '—'}</strong></div>
      <div class="row"><span>Jantina</span><strong>${p.gender === 'M' ? 'Lelaki' : p.gender === 'F' ? 'Perempuan' : '—'}</strong></div>
      <div class="row"><span>Rujukan</span><strong>${p.referral_source || '—'}</strong></div>
    </div>
    <div class="section">
      <div class="section-title">Maklumat Hubungan</div>
      <div class="row"><span>Telefon</span><strong>${phone}</strong></div>
      <div class="row"><span>Email</span><strong>${email}</strong></div>
      <div class="row"><span>Alamat</span><strong>${p.address || '—'}</strong></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Hubungi Kecemasan</div>
    <div class="row"><span>Nama</span><strong>${p.emergency_contact_name || '—'}</strong></div>
    <div class="row"><span>Telefon</span><strong>${p.emergency_contact_phone || '—'}</strong></div>
  </div>

  <div class="section">
    <div class="section-title">Maklumat Perubatan</div>
    <div class="row"><span>Kondisi</span><strong>${p.medical_condition || '—'}</strong></div>
    <div class="row"><span>Tempoh</span><strong>${p.condition_duration || '—'}</strong></div>
    ${p.medical_notes ? `<div style="margin-top:6px;font-style:italic;color:#555;font-size:11px">${p.medical_notes}</div>` : ''}
  </div>

  <div class="footer">
    <span>Dicetak: ${now}</span>
    <span>Dokumen ini adalah SULIT. Dilarang berkongsi tanpa kebenaran.</span>
  </div>
  <script>window.onload = function(){ window.print(); }<\/script>
  </body></html>`;

    // ── Export Excel ──────────────────────────────────────
    function exportCSV() {
      const rows = [['Nama', 'Patient ID', 'No. IC', 'Jantina', 'Pakej Aktif', 'Status', 'Telefon', 'Kondisi']];
      currentFiltered.forEach(p => {
        rows.push([
          p.psy_profiles?.full_name || p.full_name || '',
          p.mrn || '',
          p.ic_number || '',
          p.gender === 'M' ? 'Lelaki' : p.gender === 'F' ? 'Perempuan' : '',
          p.active_package_name || '',
          p.status || '',
          p.psy_profiles?.phone || p.phone || p.emergency_contact_phone || '',
          p.medical_condition || '',
        ]);

      ws['!cols'] = [{ wch: 35 }, { wch: 14 }, { wch: 16 }, { wch: 12 }, { wch: 14 }, { wch: 10 }, { wch: 14 }, { wch: 30 }];

    // ── Auto-link staff patients whose IC matches an existing KYC ────
    async function autoLinkStaffPatients() {
      const unlinked = allPatients.filter(p => p.created_by_staff && !p.user_id && p.ic_number);
      if (!unlinked.length) return false;

      const icList = [...new Set(unlinked.map(p => p.ic_number))];
      const { data: matches } = await window.db
        .from('psy_kyc_submissions')
        .select('user_id, ic_number')
        .in('ic_number', icList);

      if (!matches?.length) return false;

      const kycMap = {};
      matches.forEach(k => { if (k.user_id) kycMap[k.ic_number] = k.user_id; });

      const toLink = unlinked.filter(p => kycMap[p.ic_number]);
      if (!toLink.length) return false;

      await Promise.all(toLink.map(p =>
        window.db.from('psy_patients')
          .update({ user_id: kycMap[p.ic_number], created_by_staff: false })
          .eq('id', p.id)
      ));
      return true;
    }

    // ── Load ─────────────────────────────────────────────
    async function loadAll(skipAutoLink = false) {
      const isCoach = window.currentUser?.staff_role === 'coach';

      let patQuery = window.db.from('psy_patients')
        .select('*, psy_profiles!psy_patients_user_id_fkey(full_name, phone, email, role, avatar_url)')
        .order('created_at', { ascending: false });

      if (isCoach) patQuery = patQuery.eq('coach_id', window.currentUser.id);

      const [patRes, kycRes] = await Promise.all([
        patQuery,
        window.db.from('psy_kyc_submissions').select('user_id').eq('status', 'pending'),
      ]);

      if (patRes.error) console.error('[patients] load error:', patRes.error);

      const pendingKycUserIds = new Set((kycRes.data || []).map(k => k.user_id).filter(Boolean));

      allPatients = (patRes.data || []).filter(p =>
        (p.psy_profiles?.role === 'patient' || !p.psy_profiles)
        && p.status !== 'pending_kyc'
        && !pendingKycUserIds.has(p.user_id)
      );

      // Fallback: batch-fetch psy_profiles for registered patients where the join returned null
      const missingProfile = allPatients.filter(p => p.user_id && !p.psy_profiles);
      if (missingProfile.length) {
        const { data: profiles } = await window.db.from('psy_profiles')
          .select('id, full_name, phone, email, role, avatar_url')
          .in('id', missingProfile.map(p => p.user_id));
        if (profiles?.length) {
          const profileMap = Object.fromEntries(profiles.map(pr => [pr.id, pr]));
          allPatients = allPatients.map(p => ({
            ...p,
            psy_profiles: p.psy_profiles || profileMap[p.user_id] || null,
          }));
        }
      }

      if (!skipAutoLink) {
        const linked = await autoLinkStaffPatients();
        if (linked) { await loadAll(true); return; }
      }

      populatePackageFilter();
      filterPatients();
    }

    function formatDate(d) { return new Date(d).toLocaleDateString('ms-MY', { day: '2-digit', month: 'short', year: 'numeric' }); }

    // ── Link Account ──────────────────────────────────────
    let linkPatientId = null;

    function openLinkModal(patientId, name, ic) {
      linkPatientId = patientId;
      document.getElementById('link-patient-name').textContent = name;
      document.getElementById('link-patient-ic').textContent = ic ? `IC: ${ic}` : '';
      document.getElementById('link-search').value = '';
      document.getElementById('link-results').innerHTML = '';
      document.getElementById('link-error').classList.add('hidden');
      document.getElementById('link-modal').classList.remove('hidden');
    }

    function closeLinkModal() {
      document.getElementById('link-modal').classList.add('hidden');
      linkPatientId = null;
    }

    async function searchLinkUsers() {
      const q = document.getElementById('link-search').value.trim();
      if (q.length < 2) { document.getElementById('link-results').innerHTML = ''; return; }

      const { data } = await window.db.from('psy_profiles')
        .select('id, full_name, email, phone')
        .eq('role', 'patient')
        .or(`full_name.ilike.%${q}%,email.ilike.%${q}%`)
        .limit(8);

      document.getElementById('link-results').innerHTML = (data || []).length
        ? (data).map(u => `
        <button onclick="confirmLink('${u.id}','${(u.full_name || '').replace(/'/g, "\\'")}','${(u.email || '').replace(/'/g, "\\'")}' )"
          class="w-full text-left px-3 py-2.5 hover:bg-cream rounded-lg text-sm flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-navy text-white flex items-center justify-center text-xs font-bold flex-shrink-0">
            ${(u.full_name || '?')[0].toUpperCase()}
          </div>
          <div>
            <div class="font-semibold">${u.full_name || '—'}</div>
            <div class="text-xs text-ink/50">${u.email || '—'}</div>
          </div>
        </button>`).join('')
        : '<p class="text-xs text-ink/40 text-center py-4">Tiada akaun dijumpai</p>';
    }

    async function confirmLink(userId, userName, userEmail) {
      if (!linkPatientId) return;
      if (!confirm(`Link rekod pesakit ini kepada akaun "${userName}" (${userEmail})?`)) return;

      const errEl = document.getElementById('link-error');
      try {
        const { error } = await window.db.from('psy_patients')
          .update({ user_id: userId, created_by_staff: false })
          .eq('id', linkPatientId);
        if (error) throw error;

        await auditLog('patient.account_linked', linkPatientId, { linked_to: userId, user_name: userName });
        closeLinkModal();
        loadAll();
      } catch (err) {
        errEl.textContent = 'Ralat: ' + err.message;
        errEl.classList.remove('hidden');
      }
    }

    async function deletePatient(id, name) {
      if (!confirm(`Padam rekod pesakit "${name || id}"?\n\nSemua data berkaitan (temujanji, vitals, sesi) akan turut dipadam.\nTindakan ini tidak boleh diundur.`)) return;
      try {
        // Delete child records first to satisfy FK constraints
        const relatedTables = [
          'psy_appointments', 'psy_treatment_plans', 'psy_checkins',
          'psy_vitals', 'psy_sessions', 'psy_invoices', 'psy_notes',
        ];
        await Promise.all(relatedTables.map(t =>
          window.db.from(t).delete().eq('patient_id', id)
        ));
        const { error } = await window.db.from('psy_patients').delete().eq('id', id);
        if (error) throw error;
        await auditLog('patient.deleted', id, { name });
        banner('Rekod pesakit dipadam');
        loadAll();
      } catch (err) {
        banner('Ralat: ' + err.message, 'error');
      }
    }

    (async () => {
      const user = await initStaff('psy_patients', 'Senarai Pesakit');
      if (!user) return;
      isAdmin = ['admin', 'manager', 'doctor'].includes(user.staff_role);
      loadAll();
    })();
  </script>
