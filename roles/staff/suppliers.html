<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Suppliers</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🏢</div><p class="text-ink/60 text-sm">Memuatkan suppliers...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">
        <div class="pb-4 border-b border-ink/10 flex items-center justify-between flex-wrap gap-3">
          <div>
            <h2 class="text-xl font-bold text-navy">Suppliers</h2>
            <p class="text-xs text-ink/50 mt-0.5">Urus suppliers dan maklumat mereka.</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="exportSuppliers()" class="px-4 py-2.5 border border-ink/20 rounded-xl text-sm font-semibold bg-white hover:bg-ink/5">⭳ Export</button>
            <button id="btn-tambah-supplier" data-rbac="inventory.create" onclick="location.href='supplier-edit.html'"
              class="hidden bg-navy text-white text-sm px-5 py-2.5 rounded-xl font-semibold hover:bg-navy-dark transition-colors shadow-sm">
              + Add Supplier
            </button>
          </div>
        </div>

        <div class="space-y-4">

            <!-- Stat Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <button type="button" id="sup-card-total" onclick="supFilterStatus('')" class="w-full bg-white rounded-2xl border border-ink/10 shadow-sm p-4 flex items-center gap-3 text-left cursor-pointer hover:shadow-md transition-shadow">
                <div class="w-10 h-10 rounded-xl bg-navy/10 flex items-center justify-center text-lg flex-shrink-0">🏢</div>
                <div>
                  <div class="text-[10px] text-ink/40 font-semibold uppercase tracking-wide">Total Suppliers</div>
                  <div id="stat-total" class="text-2xl font-bold text-ink">—</div>
                  <div class="text-[10px] text-ink/40 mt-0.5">Semua supplier berdaftar</div>
                </div>
              </button>
              <button type="button" id="sup-card-active" onclick="supFilterStatus('active')" class="w-full bg-white rounded-2xl border border-ink/10 shadow-sm p-4 flex items-center gap-3 text-left cursor-pointer hover:shadow-md transition-shadow">
                <div class="w-10 h-10 rounded-xl bg-green/10 flex items-center justify-center text-lg flex-shrink-0">✅</div>
                <div>
                  <div class="text-[10px] text-ink/40 font-semibold uppercase tracking-wide">Active Suppliers</div>
                  <div id="stat-active" class="text-2xl font-bold text-green-dark">—</div>
                  <div id="stat-active-pct" class="text-[10px] text-ink/40 mt-0.5">—</div>
                </div>
              </button>
              <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-teal/10 flex items-center justify-center text-lg flex-shrink-0">💰</div>
                <div>
                  <div class="text-[10px] text-ink/40 font-semibold uppercase tracking-wide">Total Purchases (Tahun Ini)</div>
                  <div id="stat-purchases" class="text-xl font-bold text-teal">RM 0.00</div>
                  <div class="text-[10px] text-ink/40 mt-0.5">Sedia bila Purchase Orders siap</div>
                </div>
              </div>
            </div>

            <!-- Search + Filter -->
            <div class="flex flex-wrap items-center gap-2">
              <div class="relative flex-1 min-w-48">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/30 text-sm">🔍</span>
                <input id="sup-search" type="text" placeholder="Cari nama supplier / kenalan / emel / telefon..."
                  oninput="renderSuppliers()"
                  class="w-full pl-9 pr-3 py-2.5 border border-ink/20 rounded-xl text-sm focus:outline-none focus:border-navy bg-white">
              </div>
              <select id="sup-filter-status" onchange="renderSuppliers()" class="px-3 py-2.5 border border-ink/20 rounded-xl text-sm bg-white focus:outline-none focus:border-navy">
                <option value="">Semua Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="blacklisted">Blacklisted</option>
              </select>
              <button onclick="resetSupFilters()" class="px-3 py-2.5 border border-ink/20 rounded-xl text-sm text-ink/50 hover:bg-ink/5 transition-colors bg-white">↺ Reset</button>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-2xl border border-ink/10 overflow-hidden shadow-sm">
              <div class="overflow-x-auto min-h-[520px]">
                <table class="w-full text-sm">
                  <thead>
                    <tr class="border-b border-ink/8 bg-ink/[0.02]">
                      <th class="px-5 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">#</th>
                      <th class="px-4 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">Supplier Code</th>
                      <th class="px-4 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">Company Name</th>
                      <th class="px-4 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">Kenalan</th>
                      <th class="px-4 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">Telefon</th>
                      <th class="px-4 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">Emel</th>
                      <th class="px-4 py-3 text-center text-[10px] font-bold text-ink/40 uppercase tracking-widest">Status</th>
                      <th class="px-4 py-3 text-left text-[10px] font-bold text-ink/40 uppercase tracking-widest">Kemaskini Terakhir</th>
                      <th class="px-4 py-3 text-center text-[10px] font-bold text-ink/40 uppercase tracking-widest">Tindakan</th>
                    </tr>
                  </thead>
                  <tbody id="sup-tbody">
                    <tr><td colspan="9" class="text-center py-12 text-ink/40 text-sm">Memuatkan...</td></tr>
                  </tbody>
                </table>
              </div>
              <div id="sup-pagination" class="px-5 py-3 border-t border-ink/8 flex items-center justify-between hidden">
                <div id="sup-page-info" class="text-xs text-ink/40"></div>
                <div id="sup-page-btns" class="flex items-center gap-1"></div>
              </div>
            </div>

        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let allSuppliers = [];
const SUP_PAGE_SIZE = 10;
let supCurrentPage = 1;

const SUPPLIER_STATUS_CHIP = {
  active:      '<span class="text-xs font-semibold text-green-dark bg-green-light px-2.5 py-1 rounded-full">Active</span>',
  inactive:    '<span class="text-xs font-semibold text-ink/45 bg-ink/8 px-2.5 py-1 rounded-full">Inactive</span>',
  blacklisted: '<span class="text-xs font-semibold text-terracotta bg-terracotta/10 px-2.5 py-1 rounded-full">Blacklisted</span>',
};

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function loadSuppliers() {
  const [supRes, contactRes] = await Promise.all([
    window.db.from('psy_suppliers').select('*').order('name'),
    window.db.from('psy_supplier_contacts').select('*').order('created_at'),
  ]);
  if (supRes.error) { banner('Gagal memuatkan suppliers: ' + supRes.error.message, 'error'); return; }
  const contactsBySupplier = {};
  (contactRes.data || []).forEach(c => { (contactsBySupplier[c.supplier_id] = contactsBySupplier[c.supplier_id] || []).push(c); });
  allSuppliers = (supRes.data || []).map(s => ({ ...s, primary_contact: contactsBySupplier[s.id]?.[0] || null }));
  updateSupStats();
  renderSuppliers();
}

function updateSupStats() {
  const total    = allSuppliers.length;
  const active   = allSuppliers.filter(s => s.status === 'active');

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-active').textContent = active.length;
  document.getElementById('stat-active-pct').textContent = total ? `${Math.round(active.length/total*100)}% drpd jumlah` : '—';
}

function resetSupFilters() {
  document.getElementById('sup-search').value = '';
  document.getElementById('sup-filter-status').value = '';
  renderSuppliers();
}
window.resetSupFilters = resetSupFilters;

function supFilterStatus(status) {
  document.getElementById('sup-filter-status').value = status;
  document.getElementById('sup-card-total').classList.toggle('ring-2', status === '');
  document.getElementById('sup-card-total').classList.toggle('ring-navy', status === '');
  document.getElementById('sup-card-active').classList.toggle('ring-2', status === 'active');
  document.getElementById('sup-card-active').classList.toggle('ring-green-dark', status === 'active');
  renderSuppliers();
}
window.supFilterStatus = supFilterStatus;

function renderSuppliers() {
  const tbody = document.getElementById('sup-tbody');
  const q      = (document.getElementById('sup-search')?.value || '').toLowerCase();
  const status = document.getElementById('sup-filter-status')?.value || '';

  let list = allSuppliers;
  if (q) list = list.filter(s => [s.name, s.email, s.phone, s.mobile, s.primary_contact?.name].some(v => (v || '').toLowerCase().includes(q)));
  if (status) list = list.filter(s => s.status === status);

  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="9" class="text-center py-12 text-ink/40 text-sm">${allSuppliers.length ? 'Tiada supplier sepadan dengan carian' : 'Tiada supplier lagi — klik "+ Add Supplier" untuk mula.'}</td></tr>`;
    document.getElementById('sup-pagination').classList.add('hidden');
    return;
  }

  const totalPages = Math.ceil(list.length / SUP_PAGE_SIZE);
  if (supCurrentPage > totalPages) supCurrentPage = 1;
  const start = (supCurrentPage - 1) * SUP_PAGE_SIZE;
  const page  = list.slice(start, start + SUP_PAGE_SIZE);
  const canManage = can('inventory', 'edit');

  tbody.innerHTML = page.map((s, i) => {
    const lastUpdate = s.updated_at ? new Date(s.updated_at).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—';
    return `<tr class="border-b border-ink/5 last:border-0 hover:bg-ink/[0.015] transition-colors cursor-pointer" onclick="location.href='supplier-detail.html?id=${s.id}'">
      <td class="px-5 py-3.5 text-xs text-ink/40">${start + i + 1}</td>
      <td class="px-4 py-3.5 text-xs font-mono text-ink/50">${escHtml(s.supplier_code || '—')}</td>
      <td class="px-4 py-3.5" onclick="event.stopPropagation()">
        <a href="supplier-detail.html?id=${s.id}" class="font-semibold text-sm text-ink hover:text-navy hover:underline">${escHtml(s.name)}</a>
      </td>
      <td class="px-4 py-3.5 text-sm text-ink/70">${escHtml(s.primary_contact?.name || '—')}</td>
      <td class="px-4 py-3.5 text-sm text-ink/70">${escHtml(s.phone || '—')}</td>
      <td class="px-4 py-3.5 text-sm text-ink/70">${escHtml(s.email || '—')}</td>
      <td class="px-4 py-3.5 text-center">${SUPPLIER_STATUS_CHIP[s.status] || s.status}</td>
      <td class="px-4 py-3.5 text-xs text-ink/45 whitespace-nowrap">${lastUpdate}</td>
      <td class="px-4 py-3.5 text-center" onclick="event.stopPropagation()">
        <div class="relative inline-block">
          <button onclick="toggleActionMenu(this)" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-ink/8 text-ink/50 text-lg leading-none">⋮</button>
          <div class="hidden absolute right-0 top-full mt-1 bg-white border border-ink/10 rounded-xl shadow-lg py-1 z-20 w-36 action-menu">
            <button onclick="location.href='supplier-detail.html?id=${s.id}'" class="w-full text-left px-3 py-2 text-xs text-ink/70 hover:bg-ink/5 flex items-center gap-2">👁️ Lihat</button>
            ${canManage ? `<button onclick="location.href='supplier-edit.html?id=${s.id}'" class="w-full text-left px-3 py-2 text-xs text-ink/70 hover:bg-ink/5 flex items-center gap-2">✏️ Edit</button>` : ''}
            ${canManage ? `<button onclick="deleteSupplier('${s.id}','${escHtml(s.name)}')" class="w-full text-left px-3 py-2 text-xs text-terracotta hover:bg-terracotta/5 flex items-center gap-2">🗑 Padam</button>` : ''}
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');

  const pag = document.getElementById('sup-pagination');
  pag.classList.toggle('hidden', totalPages <= 1);
  document.getElementById('sup-page-info').textContent =
    `Memaparkan ${start + 1} hingga ${Math.min(start + SUP_PAGE_SIZE, list.length)} daripada ${list.length} supplier`;

  const btns = document.getElementById('sup-page-btns');
  const pagesToShow = [...new Set([1, supCurrentPage-1, supCurrentPage, supCurrentPage+1, totalPages])].filter(p => p >= 1 && p <= totalPages).sort((a,b)=>a-b);
  let btnHtml = `<button onclick="supGoPage(${supCurrentPage-1})" ${supCurrentPage===1?'disabled':''} class="px-2 py-1 rounded-lg text-sm border border-ink/15 disabled:opacity-30 hover:bg-ink/5">‹</button>`;
  let prev = 0;
  pagesToShow.forEach(p => {
    if (prev && p - prev > 1) btnHtml += `<span class="px-1 text-ink/30 text-sm">…</span>`;
    btnHtml += `<button onclick="supGoPage(${p})" class="w-8 h-8 rounded-lg text-sm font-semibold transition-colors ${p===supCurrentPage ? 'bg-navy text-white' : 'border border-ink/15 hover:bg-ink/5 text-ink/60'}">${p}</button>`;
    prev = p;
  });
  btnHtml += `<button onclick="supGoPage(${supCurrentPage+1})" ${supCurrentPage===totalPages?'disabled':''} class="px-2 py-1 rounded-lg text-sm border border-ink/15 disabled:opacity-30 hover:bg-ink/5">›</button>`;
  btns.innerHTML = btnHtml;
}
window.renderSuppliers = renderSuppliers;

function supGoPage(p) {
  supCurrentPage = p;
  renderSuppliers();
}
window.supGoPage = supGoPage;

function toggleActionMenu(btn) {
  const menu = btn.nextElementSibling;
  document.querySelectorAll('.action-menu').forEach(m => { if (m !== menu) m.classList.add('hidden'); });
  menu.classList.toggle('hidden');
}
window.toggleActionMenu = toggleActionMenu;
document.addEventListener('click', (e) => {
  if (!e.target.closest('.relative')) document.querySelectorAll('.action-menu').forEach(m => m.classList.add('hidden'));
});

async function deleteSupplier(id, name) {
  if (!confirm(`Padam supplier "${name}"? Tindakan ini tidak boleh dibatalkan — kenalan & dokumen berkaitan turut dipadam.`)) return;
  const { error } = await window.db.from('psy_suppliers').delete().eq('id', id);
  if (error) { banner('Gagal padam supplier: ' + error.message, 'error'); return; }
  banner('Supplier dipadam');
  allSuppliers = allSuppliers.filter(s => s.id !== id);
  updateSupStats();
  renderSuppliers();
}
window.deleteSupplier = deleteSupplier;

function exportSuppliers() {
  const rows = [['Kod','Nama','Status','Telefon','Emel','Bandar','Negeri']];
  allSuppliers.forEach(s => rows.push([s.supplier_code, s.name, s.status, s.phone||'', s.email||'', s.city||'', s.state||'']));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `suppliers_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
window.exportSuppliers = exportSuppliers;

(async () => {
  const user = await initStaff('suppliers', 'Suppliers', 'inventory');
  if (!user) return;
  await loadSuppliers();
})();
</script>
</body>
</html>
