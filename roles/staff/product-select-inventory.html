<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Pilih dari Inventori</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📦</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-5">

        <!-- Page header -->
        <div class="flex items-start justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-2xl font-bold text-ink">Pilih dari Inventori</h1>
            <p class="text-sm text-ink/45 mt-0.5">Pilih item yang ingin dijadikan produk shop. Semua produk mesti asal dari Inventori.</p>
            <div class="flex items-center gap-2 text-xs text-ink/55 mt-2">
              <a href="products.html" class="hover:text-ink">Produk</a>
              <span class="text-ink/30">/</span>
              <span class="text-ink/70">Pilih dari Inventori</span>
            </div>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <button type="button" onclick="cancelPicker()" class="px-4 py-2 border border-ink/20 rounded-xl text-sm font-semibold text-ink/65 hover:bg-ink/5 transition-colors">Batal</button>
            <button type="button" onclick="openAddToInventory()" class="bg-navy text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-navy-dark transition-colors flex items-center gap-1.5">➕ Tambah ke Inventori</button>
          </div>
        </div>

        <!-- Table card: tabs kategori + toolbar carian + jadual -->
        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
          <div id="inv-picker-cats" class="flex items-center gap-1 overflow-x-auto px-3 pt-2 border-b border-ink/10"></div>

          <div class="flex items-center justify-between gap-3 px-4 py-3 border-b border-ink/10 flex-wrap">
            <div id="inv-picker-count" class="text-xs text-ink/55 whitespace-nowrap"></div>
            <div class="relative w-full sm:w-72">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/40 text-sm">🔍</span>
              <input type="text" id="inv-picker-search" placeholder="Cari nama item atau kategori..." oninput="onInvPickerSearch(this.value)"
                class="w-full pl-9 pr-3 py-2 border border-ink/15 rounded-lg text-sm focus:outline-none focus:border-navy">
            </div>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="text-left text-[11px] uppercase tracking-wide text-ink/45 bg-cream/50 border-b border-ink/10">
                  <th class="px-4 py-2.5 font-semibold">Item</th>
                  <th class="px-4 py-2.5 font-semibold">Kategori</th>
                  <th class="px-4 py-2.5 font-semibold text-right">Stok</th>
                  <th class="px-4 py-2.5 font-semibold">Status</th>
                  <th class="px-4 py-2.5 font-semibold w-10"></th>
                </tr>
              </thead>
              <tbody id="inv-picker-list"></tbody>
            </table>
          </div>

          <div id="inv-picker-pager" class="hidden flex items-center justify-between px-4 py-3 border-t border-ink/10">
            <div id="inv-picker-pager-info" class="text-[11px] text-ink/45"></div>
            <div id="inv-picker-pager-btns" class="flex items-center gap-1"></div>
          </div>
        </div>

        <!-- Confirm bar -->
        <div class="sticky bottom-0 bg-white border-t border-ink/10 -mx-4 md:-mx-6 px-4 md:px-6 py-3 flex items-center justify-end gap-2">
          <button type="button" onclick="cancelPicker()" class="text-sm font-semibold text-ink/60 hover:text-ink px-4 py-2">Batal</button>
          <button id="inv-picker-confirm" type="button" onclick="confirmInventoryPick()" disabled
            class="bg-navy text-white text-sm font-semibold px-5 py-2 rounded-lg hover:bg-navy-dark transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
            ✓ Pilih Item
          </button>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/stockSync.js"></script>
<script src="_shared.js"></script>
<script>

let _invItemsCache = [];
let _invPickerSearch = '';
let _invPickerCat = 'all';
let _invPickerPage = 1;
let _invPickerSelectedId = null;
const _INV_PAGE_SIZE = 12;
let _pid = null; // product id sedang ditukar item-nya (mod swap), null = produk baru

function categoryIcon(cat) {
  const c = (cat || '').toLowerCase();
  if (c.includes('madu') || c.includes('makanan') || c.includes('minuman')) return '🍯';
  if (c.includes('herba') || c.includes('tradisional')) return '🌿';
  if (c.includes('vitamin') || c.includes('suplemen')) return '💊';
  if (c.includes('peralatan') || c.includes('kesihatan')) return '⚕️';
  if (c.includes('kit') || c.includes('program')) return '🧰';
  if (c.includes('brosur') || c.includes('marketing')) return '📄';
  if (c.includes('produk')) return '📦';
  return '📦';
}

function escAttr(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function cancelPicker() { history.back(); }

function openAddToInventory(name) {
  const url = 'item-form.html' + (name ? ('?name=' + encodeURIComponent(name)) : '');
  window.open(url, '_blank');
}

// Terima isyarat dari tab item-form.html (Tambah Item dalam tab baru) — refresh senarai.
window.addEventListener('message', (e) => {
  if (e.data?.type !== 'isw-item-saved') return;
  _invItemsCache = [];
  loadInvItems();
});

async function loadInvItems() {
  const { data } = await window.db.from('psy_inventory_items')
    .select('id, item_code, name, category, unit, qty_in_stock, min_qty, notes, image_url').order('name');
  _invItemsCache = data || [];

  // Tag item Inventori yang dah dipaut ke produk (ikut ID, kecuali produk yang sedang ditukar item-nya)
  let takenIds = new Set();
  try {
    let q = window.db.from('psy_products').select('id, name, inventory_item_id');
    const { data: prods } = await q;
    const others = (prods || []).filter(p => !_pid || String(p.id) !== String(_pid));
    takenIds = new Set(others.map(p => p.inventory_item_id).filter(Boolean));
  } catch {}

  window._invPickerAvailable = _invItemsCache.map(i => ({
    ...i,
    _alreadyProduct: takenIds.has(i.id),
  }));
  renderInvPickerCats();
  renderInvPicker();
}

function onInvPickerSearch(v) {
  _invPickerSearch = (v || '').toLowerCase().trim();
  _invPickerPage = 1;
  renderInvPicker();
}

function getFilteredItems() {
  return (window._invPickerAvailable || []).filter(i => {
    const matchCat = _invPickerCat === 'all' || (i.category || 'Lain-lain') === _invPickerCat;
    if (!matchCat) return false;
    if (!_invPickerSearch) return true;
    return (i.name || '').toLowerCase().includes(_invPickerSearch)
        || (i.item_code || '').toLowerCase().includes(_invPickerSearch)
        || (i.category || '').toLowerCase().includes(_invPickerSearch);
  });
}

function renderInvPickerCats() {
  const all = window._invPickerAvailable || [];
  const counts = { all: all.length };
  all.forEach(i => {
    const c = i.category || 'Lain-lain';
    counts[c] = (counts[c] || 0) + 1;
  });
  const cats = Object.keys(counts).filter(c => c !== 'all').sort((a, b) => counts[b] - counts[a]);
  const entries = [['all', 'Semua Kategori'], ...cats.map(c => [c, c])];
  const wrap = document.getElementById('inv-picker-cats');
  wrap.innerHTML = entries.map(([key, label]) => {
    const active = _invPickerCat === key;
    return `<button type="button" onclick="setInvPickerCat('${escAttr(key)}')"
      class="px-3 py-2 text-xs font-semibold whitespace-nowrap border-b-2 transition ${active ? 'border-navy text-navy' : 'border-transparent text-ink/50 hover:text-ink'}">
      ${escAttr(label)} <span class="text-[10px] ${active ? 'text-navy' : 'text-ink/35'}">${counts[key]}</span>
    </button>`;
  }).join('');
}

function setInvPickerCat(cat) {
  _invPickerCat = cat;
  _invPickerPage = 1;
  renderInvPickerCats();
  renderInvPicker();
}

function renderInvPicker() {
  const items = getFilteredItems();
  document.getElementById('inv-picker-count').textContent = `${items.length} item ditemui`;
  const list = document.getElementById('inv-picker-list');
  if (!items.length) {
    const term = _invPickerSearch || '';
    list.innerHTML = `<tr><td colspan="5" class="text-center text-sm py-12">
      <div class="text-ink/40 mb-3">Tiada item ditemui${term ? ` untuk "<span class="text-ink/60 font-medium">${escAttr(term)}</span>"` : ''}</div>
      <button type="button" onclick="openAddToInventory('${escAttr(term)}')" class="bg-navy text-white text-xs font-semibold px-4 py-2.5 rounded-lg hover:bg-navy-dark transition-colors">➕ Tambah ke Inventori</button>
    </td></tr>`;
    document.getElementById('inv-picker-pager').classList.add('hidden');
    return;
  }
  const totalPages = Math.max(1, Math.ceil(items.length / _INV_PAGE_SIZE));
  if (_invPickerPage > totalPages) _invPickerPage = totalPages;
  const start = (_invPickerPage - 1) * _INV_PAGE_SIZE;
  const slice = items.slice(start, start + _INV_PAGE_SIZE);
  list.innerHTML = slice.map(i => {
    const taken = i._alreadyProduct;
    const qty = Number(i.qty_in_stock) || 0;
    const noStock = qty <= 0;
    const blocked = taken || noStock;
    const selected = String(i.id) === String(_invPickerSelectedId);
    const rowCls = blocked
      ? 'opacity-60'
      : selected
        ? 'bg-navy/5 cursor-pointer'
        : 'hover:bg-cream/50 cursor-pointer';
    const radioCls = taken
      ? 'border-green text-green-dark'
      : noStock
        ? 'border-terracotta/40 text-terracotta'
      : selected
        ? 'bg-navy border-navy text-white'
        : 'border-ink/25';
    const radioInner = (taken || selected)
      ? '<svg viewBox="0 0 16 16" class="w-3 h-3 fill-current"><path d="M6.5 10.5L3 7l1-1 2.5 2.5L12 3l1 1z"/></svg>'
      : noStock
        ? '<svg viewBox="0 0 16 16" class="w-3 h-3 fill-current"><path d="M4 8h8v1H4z"/></svg>'
        : '';
    const statusBadges = [];
    if (taken) statusBadges.push('<span class="inline-flex items-center gap-1 text-[11px] font-semibold text-green-dark bg-green/10 px-2 py-1 rounded-md">✓ Dah jadi produk</span>');
    if (noStock) statusBadges.push('<span class="inline-flex items-center gap-1 text-[11px] font-semibold text-terracotta bg-terracotta/10 px-2 py-1 rounded-md">⛔ Stok kosong</span>');
    const statusBadge = statusBadges.length ? `<div class="flex flex-wrap items-center gap-1">${statusBadges.join('')}</div>` : '<span class="text-[11px] font-medium text-ink/40">Tersedia</span>';
    return `<tr data-inv-id="${i.id}" ${blocked ? '' : `onclick="selectInvPickerItem('${i.id}')"`}
      class="border-b border-ink/5 last:border-0 transition ${rowCls}">
      <td class="px-4 py-2.5">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-lg bg-cream flex items-center justify-center text-lg flex-shrink-0 overflow-hidden">${i.image_url ? `<img src="${escAttr(i.image_url)}" class="w-full h-full object-cover">` : categoryIcon(i.category)}</div>
          <div class="min-w-0">
            <div class="font-semibold text-ink truncate">${escAttr(i.name || '')}</div>
            ${i.item_code ? `<div class="text-[11px] font-mono text-ink/45">${escAttr(i.item_code)}</div>` : ''}
          </div>
        </div>
      </td>
      <td class="px-4 py-2.5 text-ink/60 whitespace-nowrap">${i.category ? escAttr(i.category) : '—'}</td>
      <td class="px-4 py-2.5 text-right font-semibold whitespace-nowrap ${noStock ? 'text-terracotta' : qty <= Number(i.min_qty || 5) ? 'text-amber-600' : 'text-ink'}">${qty} ${escAttr(i.unit || 'unit')}</td>
      <td class="px-4 py-2.5">${statusBadge}</td>
      <td class="px-4 py-2.5">
        <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center ${radioCls}">${radioInner}</div>
      </td>
    </tr>`;
  }).join('');
  // Pager
  const pager = document.getElementById('inv-picker-pager');
  if (totalPages > 1) {
    pager.classList.remove('hidden');
    document.getElementById('inv-picker-pager-info').textContent =
      `Menunjuk ${start + 1}–${Math.min(start + _INV_PAGE_SIZE, items.length)} dari ${items.length}`;
    const btns = document.getElementById('inv-picker-pager-btns');
    const btn = (label, page, disabled, active) =>
      `<button type="button" ${disabled ? 'disabled' : `onclick="setInvPickerPage(${page})"`}
        class="px-2.5 py-1 rounded text-[11px] font-semibold transition ${active ? 'bg-navy text-white' : 'border border-ink/15 hover:bg-cream'} ${disabled ? 'opacity-40 cursor-not-allowed' : ''}">${label}</button>`;
    const pages = [];
    pages.push(btn('‹', _invPickerPage - 1, _invPickerPage === 1));
    for (let p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || Math.abs(p - _invPickerPage) <= 1) {
        pages.push(btn(String(p), p, false, p === _invPickerPage));
      } else if (p === _invPickerPage - 2 || p === _invPickerPage + 2) {
        pages.push('<span class="text-ink/30 px-1">…</span>');
      }
    }
    pages.push(btn('›', _invPickerPage + 1, _invPickerPage === totalPages));
    btns.innerHTML = pages.join('');
  } else {
    pager.classList.add('hidden');
  }
}

function setInvPickerPage(p) { _invPickerPage = p; renderInvPicker(); }

function selectInvPickerItem(id) {
  _invPickerSelectedId = String(id);
  document.getElementById('inv-picker-confirm').disabled = false;
  renderInvPicker();
}

function confirmInventoryPick() {
  if (!_invPickerSelectedId) return;
  const target = 'product-edit.html?' + (_pid ? `id=${encodeURIComponent(_pid)}&` : '') + `inv=${encodeURIComponent(_invPickerSelectedId)}`;
  location.href = target;
}

(async () => {
  const user = await initStaff('psy_products', 'Pilih dari Inventori');
  if (!user) return;
  _pid = new URLSearchParams(location.search).get('pid');
  await loadInvItems();
})();
</script>
</body>
</html>
