<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Orders & Tracking</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📦</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <!-- New Orders Alert Banner -->
        <div id="orders-alert-banner" class="hidden bg-orange-50 border border-orange-200 rounded-xl px-4 py-3 flex items-center gap-3">
          <span class="relative flex h-3 w-3 flex-shrink-0">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-orange-500"></span>
          </span>
          <div class="flex-1 min-w-0">
            <span class="font-semibold text-sm text-orange-800" id="orders-alert-text">Pesanan baru diterima</span>
            <span class="text-xs text-orange-600 ml-2">Semak dan proses penghantaran</span>
          </div>
          <button onclick="dismissOrdersAlert()" class="text-orange-400 hover:text-orange-700 text-xl leading-none px-1 flex-shrink-0">×</button>
        </div>

        <!-- Stat Cards -->
        <div id="stat-row" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>

        <!-- Search + Filter -->
        <div class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/40 text-sm">🔍</span>
            <input id="search-input" type="text" placeholder="Cari nama patient atau no. order..."
              class="w-full pl-9 pr-3 py-2.5 border border-ink/20 rounded-xl text-sm focus:border-navy outline-none bg-white"
              oninput="resetPage(); renderOrders()">
          </div>
          <select id="sort-select" onchange="resetPage(); renderOrders()"
            class="px-3 py-2.5 border border-ink/20 rounded-xl text-sm bg-white focus:border-navy outline-none">
            <option value="newest">Terbaru dulu</option>
            <option value="oldest">Terlama dulu</option>
            <option value="amount_desc">Jumlah ↓</option>
          </select>
          <!-- View Toggle -->
          <div class="flex rounded-xl border border-ink/20 overflow-hidden bg-white">
            <button id="view-card" onclick="setView('card')" title="Card View"
              class="px-3 py-2 text-xs font-semibold transition-colors bg-navy text-white">Kad</button>
            <button id="view-table" onclick="setView('table')" title="Table View"
              class="px-3 py-2 text-xs font-semibold transition-colors text-ink/60 hover:bg-ink/5">Jadual</button>
          </div>
        </div>

        <!-- Status Filters -->
        <div id="filter-chips" class="flex gap-2 flex-wrap"></div>

        <div id="orders-list" class="space-y-3"></div>

        <!-- Pagination -->
        <div id="pagination" class="hidden flex items-center justify-between gap-3 pt-1">
          <span id="page-info" class="text-xs text-ink/50"></span>
          <div class="flex gap-2">
            <button id="btn-prev" onclick="changePage(-1)"
              class="px-4 py-2 border border-ink/20 rounded-xl text-sm hover:border-navy hover:text-navy disabled:opacity-30 disabled:cursor-not-allowed transition-colors">← Sebelum</button>
            <button id="btn-next" onclick="changePage(1)"
              class="px-4 py-2 border border-ink/20 rounded-xl text-sm hover:border-navy hover:text-navy disabled:opacity-30 disabled:cursor-not-allowed transition-colors">Seterusnya →</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ── Ship Modal ──────────────────────────────────── -->
<div id="ship-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" onclick="closeShipModal()"></div>
  <div class="relative bg-white rounded-2xl max-w-md w-full overflow-hidden">
    <div class="p-5 border-b border-ink/10 flex items-center justify-between">
      <h3 class="font-bold text-lg">🚚 Hantar Parsel</h3>
      <button onclick="closeShipModal()" class="text-ink/60 text-xl">×</button>
    </div>
    <div class="p-5 space-y-4">
      <input id="ship-order-id" type="hidden">
      <div>
        <label class="text-xs font-semibold">Kurier</label>
        <select id="ship-courier" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm bg-white">
          <option value="JNT">J&T Express</option>
          <option value="Poslaju">Pos Laju</option>
          <option value="DHL">DHL</option>
          <option value="Ninja">Ninja Van</option>
          <option value="Grab">Grab Express</option>
          <option value="Lain">Lain-lain</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold">Tracking Number <span class="text-terracotta">*</span></label>
        <input id="ship-tracking" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm" placeholder="cth: JT1234567890">
      </div>
      <div>
        <label class="text-xs font-semibold">Gambar Parsel / Resit (optional)</label>
        <label for="ship-photo" class="flex items-center gap-3 mt-1 border border-dashed border-ink/20 rounded-lg p-3 cursor-pointer hover:border-navy">
          <span class="text-xl">📷</span>
          <div>
            <div id="ship-photo-label" class="text-sm font-medium text-ink">Klik untuk upload</div>
            <div class="text-xs text-ink/50">JPG, PNG</div>
          </div>
          <input id="ship-photo" type="file" accept="image/*" class="hidden" onchange="previewShipPhoto(event)">
        </label>
        <div id="ship-photo-preview" class="hidden mt-2">
          <img id="ship-photo-img" class="h-24 rounded-lg border border-ink/10 object-cover">
        </div>
      </div>
    </div>
    <div class="p-5 border-t border-ink/10 flex justify-end gap-2">
      <button onclick="closeShipModal()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm">Batal</button>
      <button onclick="confirmShip()" id="ship-btn" data-rbac="orders.edit" class="hidden bg-green text-white px-5 py-2 rounded-lg text-sm font-semibold">Tandakan Dihantar</button>
    </div>
  </div>
</div>

<!-- ── Order Detail Modal ──────────────────────────── -->
<div id="detail-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" onclick="closeDetailModal()"></div>
  <div class="relative bg-white rounded-2xl max-w-lg w-full max-h-[90vh] flex flex-col overflow-hidden">
    <div class="p-5 border-b border-ink/10 flex items-center justify-between">
      <h3 class="font-bold text-lg" id="detail-title">Detail Order</h3>
      <button onclick="closeDetailModal()" class="text-ink/60 text-xl">×</button>
    </div>
    <div id="detail-body" class="p-5 space-y-4 overflow-y-auto"></div>
  </div>
</div>

<style>
.filter-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 8px; cursor: pointer;
  border: 1.5px solid transparent; background: white;
  font-size: 12px; font-weight: 600; color: #6b7280;
  transition: all 0.15s; white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
.filter-chip:hover { border-color: #cbd5e1; color: #1e293b; }
.filter-chip.active { color: var(--chip-color); border-color: var(--chip-color); background: var(--chip-bg); }
.filter-chip .count {
  background: #f1f5f9; color: #64748b;
  font-size: 10px; font-weight: 700; padding: 1px 6px;
  border-radius: 999px; min-width: 20px; text-align: center;
}
.filter-chip.active .count { background: var(--chip-color); color: white; }
</style>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/stockSync.js"></script>
<script src="_shared.js"></script>
<script>
let activeFilter = 'toship';
let currentPage  = 1;
const PAGE_SIZE  = 25;
let viewMode     = 'card';
let allOrders    = [];
let shipPhotoFile = null;

const STATUS_META = {
  pending:   { label: 'Pending',           chip: 'bg-gold/30 text-gold-dark',           icon: '⏳' },
  paid:      { label: 'Dibayar',           chip: 'bg-navy-light text-navy',             icon: '💳' },
  packed:    { label: 'Dibungkus',         chip: 'bg-teal/10 text-teal',                icon: '📦' },
  shipped:   { label: 'Dihantar',          chip: 'bg-green-light text-green-dark',      icon: '🚚' },
  delivered: { label: 'Diterima',          chip: 'bg-ink/10 text-ink/60',              icon: '✅' },
  cancelled: { label: 'Dibatalkan',        chip: 'bg-terracotta/20 text-terracotta',    icon: '❌' },
};

// ── View Toggle ──────────────────────────────────────
function setView(mode) {
  viewMode = mode;
  document.getElementById('view-card').className  = `px-3 py-2 text-xs font-semibold transition-colors ${mode === 'card'  ? 'bg-navy text-white' : 'text-ink/60 hover:bg-ink/5'}`;
  document.getElementById('view-table').className = `px-3 py-2 text-xs font-semibold transition-colors ${mode === 'table' ? 'bg-navy text-white' : 'text-ink/60 hover:bg-ink/5'}`;
  renderOrders();
}

// ── Filters & Search ─────────────────────────────────
const FILTER_META = [
  { key: 'toship',    label: 'Perlu Dihantar', color: '#c0392b', bg: '#fdf2f2' },
  { key: 'all',       label: 'Semua',          color: '#1a3a5c', bg: '#eef3f8' },
  { key: 'pending',   label: 'Pending',         color: '#b45309', bg: '#fffbeb' },
  { key: 'paid',      label: 'Dibayar',         color: '#1a3a5c', bg: '#eef3f8' },
  { key: 'packed',    label: 'Dibungkus',       color: '#0f766e', bg: '#f0fdfa' },
  { key: 'shipped',   label: 'Dihantar',        color: '#15803d', bg: '#f0fdf4' },
  { key: 'delivered', label: 'Diterima',        color: '#475569', bg: '#f8fafc' },
  { key: 'cancelled', label: 'Batal',           color: '#9f1239', bg: '#fff1f2' },
];

function countFor(key) {
  if (key === 'all')    return allOrders.length;
  if (key === 'toship') return allOrders.filter(o => o.status === 'paid' || o.status === 'packed').length;
  return allOrders.filter(o => o.status === key).length;
}

function renderFilterChips() {
  document.getElementById('filter-chips').innerHTML = FILTER_META.map(f => `
    <button class="filter-chip ${activeFilter === f.key ? 'active' : ''}"
      style="--chip-color:${f.color};--chip-bg:${f.bg}"
      onclick="setFilter('${f.key}')">
      ${f.label}
      <span class="count" id="count-${f.key}">${countFor(f.key)}</span>
    </button>`).join('');
}

function setFilter(f) {
  activeFilter = f;
  resetPage();
  renderFilterChips();
  renderOrders();
}

function resetPage() { currentPage = 1; }

function changePage(dir) {
  const q    = document.getElementById('search-input').value.toLowerCase();
  const sort = document.getElementById('sort-select').value;
  const list = getFilteredSorted(q, sort);
  const pages = Math.ceil(list.length / PAGE_SIZE);
  currentPage = Math.max(1, Math.min(pages, currentPage + dir));
  renderOrders();
}

function getFilteredSorted(q, sort) {
  let list = allOrders.filter(o => {
    if (activeFilter === 'toship') {
      if (o.status !== 'paid' && o.status !== 'packed') return false;
    } else if (activeFilter !== 'all') {
      if (o.status !== activeFilter) return false;
    }
    if (q) {
      const name = (o.psy_profiles?.full_name || '').toLowerCase();
      const ref  = (o.order_ref || '').toLowerCase();
      if (!name.includes(q) && !ref.includes(q)) return false;
    }
    return true;
  });
  if (sort === 'oldest')           list.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  else if (sort === 'amount_desc') list.sort((a, b) => b.total - a.total);
  else                             list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  return list;
}

function renderOrders() {
  const q    = document.getElementById('search-input').value.toLowerCase();
  const sort = document.getElementById('sort-select').value;
  const list = getFilteredSorted(q, sort);

  const pages    = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  currentPage    = Math.min(currentPage, pages);
  const start    = (currentPage - 1) * PAGE_SIZE;
  const pageList = list.slice(start, start + PAGE_SIZE);

  const el = document.getElementById('orders-list');

  if (!list.length) {
    el.innerHTML = '<div class="bg-white rounded-xl border border-ink/10 p-10 text-center text-ink/40 text-sm">Tiada orders ditemui</div>';
    document.getElementById('pagination').classList.add('hidden');
    return;
  }

  el.className = viewMode === 'table' ? '' : 'space-y-3';
  el.innerHTML = viewMode === 'table' ? renderTable(pageList) : pageList.map(orderCard).join('');

  // Pagination controls
  const pgEl = document.getElementById('pagination');
  if (list.length > PAGE_SIZE) {
    pgEl.classList.remove('hidden');
    document.getElementById('page-info').textContent = `${start + 1}–${Math.min(start + PAGE_SIZE, list.length)} daripada ${list.length} order`;
    document.getElementById('btn-prev').disabled = currentPage <= 1;
    document.getElementById('btn-next').disabled = currentPage >= pages;
  } else {
    pgEl.classList.add('hidden');
  }
}

// ── Table View ───────────────────────────────────────
function renderTable(list) {
  const rows = list.map(o => {
    const sm      = STATUS_META[o.status] || STATUS_META.pending;
    const patient = o.psy_profiles?.full_name || '—';
    const items   = Array.isArray(o.items) ? o.items : [];
    const method  = o.delivery_method === 'pickup'
      ? '<span class="chip bg-ink/10 text-ink/60 text-[10px]">Pickup</span>'
      : '<span class="chip bg-navy-light text-navy text-[10px]">Pos</span>';
    const tracking = o.tracking_number
      ? `<span class="font-mono text-xs text-green-dark">${o.tracking_number}</span>`
      : '<span class="text-ink/30 text-xs">—</span>';
    const actions = buildActions(o);
    return `<tr class="hover:bg-cream/30 transition-colors">
      <td class="text-xs font-mono text-ink/60 whitespace-nowrap">${o.order_ref}</td>
      <td><strong class="text-sm">${patient}</strong>
        <div class="text-[10px] text-ink/50">${formatDate(o.created_at)}</div></td>
      <td>${method}</td>
      <td class="text-xs">${items.map(i => `${i.name} ×${i.qty}`).join(', ')}</td>
      <td><span class="chip text-[10px] ${sm.chip}">${sm.icon} ${sm.label}</span></td>
      <td>${tracking}</td>
      <td class="font-semibold text-sm whitespace-nowrap">RM ${Number(o.total).toFixed(2)}</td>
      <td class="whitespace-nowrap">
        <div class="flex items-center gap-1.5 flex-wrap">
          ${actions || '<span class="text-ink/30 text-xs">—</span>'}
          <button onclick="openDetailModal('${o.id}')" class="text-[10px] text-navy border border-navy/30 px-2 py-1 rounded-lg hover:bg-navy hover:text-white transition-colors">Detail</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  return `<div class="bg-white rounded-xl border border-ink/10 overflow-x-auto">
    <table class="data text-sm">
      <thead><tr>
        <th>No. Order</th><th>Patient</th><th>Kaedah</th><th>Item</th>
        <th>Status</th><th>Tracking</th><th>Jumlah</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// ── Stat Cards ───────────────────────────────────────
function renderStats(orders) {
  const today    = new Date().toDateString();
  const total    = orders.filter(o => o.status !== 'cancelled').length;
  const toship   = orders.filter(o => o.status === 'paid' || o.status === 'packed').length;
  const shippedToday = orders.filter(o =>
    (o.status === 'shipped' || o.status === 'delivered') &&
    o.shipped_at && new Date(o.shipped_at).toDateString() === today
  ).length;
  const revenue  = orders.filter(o => o.status !== 'cancelled').reduce((s, o) => s + Number(o.total || 0), 0);

  document.getElementById('stat-row').innerHTML = [
    statCard('Jumlah Order',    total,                    'tidak termasuk batal', 'gold'),
    statCard('Perlu Dihantar',  toship,                   'paid + packed',        'teal'),
    statCard('Dihantar Hari Ini', shippedToday,           'hari ini',             'green'),
    statCard('Jumlah Jualan',   `RM ${revenue.toFixed(2)}`, 'semua orders aktif', 'navy'),
  ].join('');
}

function statCard(label, value, sub, color) {
  const colors = { gold: 'border-gold', teal: 'border-teal', green: 'border-green', navy: 'border-navy' };
  return `<div class="bg-white rounded-xl p-4 border-t-4 ${colors[color] || 'border-navy'}">
    <div class="text-[10px] uppercase text-ink/60 font-semibold">${label}</div>
    <div class="text-2xl font-bold mt-1">${value}</div>
    <div class="text-[10px] text-ink/50 mt-1">${sub}</div>
  </div>`;
}

// ── Order Card ───────────────────────────────────────
function orderCard(o) {
  const sm      = STATUS_META[o.status] || STATUS_META.pending;
  const items   = Array.isArray(o.items) ? o.items : [];
  const patient = o.psy_profiles?.full_name || 'Patient';
  const phone   = o.psy_profiles?.phone || '';
  const actions = buildActions(o);
  const isPickup = o.delivery_method === 'pickup';

  const itemSummary = items.length <= 2
    ? items.map(it => `<span class="chip bg-cream text-ink/70 text-xs">${it.name} × ${it.qty}</span>`).join('')
    : `${items.slice(0,2).map(it => `<span class="chip bg-cream text-ink/70 text-xs">${it.name} × ${it.qty}</span>`).join('')}<span class="chip bg-ink/5 text-ink/50 text-xs">+${items.length - 2} lagi</span>`;

  return `
  <div class="bg-white rounded-xl border border-ink/10 overflow-hidden hover:shadow-md transition-shadow">
    <!-- Compact Header Row -->
    <div class="px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
      <div class="flex items-center gap-2 flex-wrap min-w-0">
        <span class="font-bold text-sm font-mono">${o.order_ref}</span>
        <span class="chip text-xs ${sm.chip}">${sm.icon} ${sm.label}</span>
        ${isPickup ? '<span class="chip bg-ink/10 text-ink/60 text-xs">Pickup</span>' : '<span class="chip bg-navy-light text-navy text-xs">Pos</span>'}
        <span class="text-xs text-ink/50 hidden sm:inline">· ${formatDateTime(o.created_at)}</span>
      </div>
      <div class="flex items-center gap-3 flex-shrink-0">
        <div class="text-right">
          <div class="font-bold text-sm">RM ${Number(o.total).toFixed(2)}</div>
        </div>
        <button onclick="openDetailModal('${o.id}')" class="text-[10px] text-navy border border-navy/30 px-2 py-1 rounded-lg hover:bg-navy hover:text-white transition-colors whitespace-nowrap">Detail</button>
      </div>
    </div>

    <!-- Patient + Items Row -->
    <div class="px-4 pb-2 flex items-center gap-3 flex-wrap border-t border-ink/5 pt-2">
      <div class="text-xs text-ink/60 flex-shrink-0">
        👤 <strong class="text-ink/80">${patient}</strong>${phone ? ` · ${phone}` : ''}
      </div>
      <div class="flex flex-wrap gap-1">${itemSummary}</div>
    </div>

    ${o.tracking_number ? `
    <!-- Tracking Compact -->
    <div class="px-4 pb-2">
      <div class="flex items-center gap-2 bg-green-light rounded-lg px-3 py-1.5">
        <span class="text-[10px] text-ink/60 font-semibold">${o.courier || 'Kurier'}</span>
        <span class="font-mono text-xs font-bold flex-1">${o.tracking_number}</span>
        ${o.tracking_photo_url ? `<img src="${o.tracking_photo_url}" class="h-8 w-8 rounded object-cover border border-ink/10 cursor-pointer" onclick="window.open('${o.tracking_photo_url}','_blank')">` : ''}
        ${o.shipped_at ? `<span class="text-[10px] text-ink/50 whitespace-nowrap">${formatDate(o.shipped_at)}</span>` : ''}
      </div>
    </div>` : ''}

    ${o.delivery_method !== 'pickup' && o.delivery_address ? `
    <div class="px-4 pb-2">
      <div class="text-xs text-ink/60 bg-cream rounded-lg px-3 py-1.5 truncate">
        📍 ${o.delivery_address}
      </div>
    </div>` : ''}

    ${actions ? `<div class="px-4 pb-3 pt-1 flex items-center gap-2 flex-wrap border-t border-ink/5">${actions}</div>` : ''}
  </div>`;
}

function buildActions(o) {
  const id       = o.id;
  const isPickup = o.delivery_method === 'pickup';

  if (o.status === 'pending') return `
    <button onclick="markStatus('${id}','paid')" data-rbac="orders.edit" class="bg-navy text-white px-4 py-2 rounded-lg text-xs font-semibold">✓ Sahkan Bayaran</button>
    <button onclick="markStatus('${id}','cancelled')" data-rbac="orders.edit" class="border border-terracotta text-terracotta px-3 py-2 rounded-lg text-xs">Batalkan</button>`;

  if (o.status === 'paid') return isPickup ? `
    <button onclick="markStatus('${id}','packed')" data-rbac="orders.edit" class="bg-teal text-white px-4 py-2 rounded-lg text-xs font-semibold">✅ Tandakan Sedia Pickup</button>` : `
    <button onclick="markStatus('${id}','packed')" data-rbac="orders.edit" class="bg-teal text-white px-4 py-2 rounded-lg text-xs font-semibold">📦 Tandakan Dibungkus</button>`;

  if (o.status === 'packed') return isPickup ? `
    <div class="text-xs text-green-dark bg-green-light rounded-lg px-3 py-2 flex-1">📍 Sedia untuk diambil di konsultasi</div>
    <button onclick="markStatus('${id}','delivered')" data-rbac="orders.edit" class="bg-green text-white px-4 py-2 rounded-lg text-xs font-semibold">✅ Sedia Pickup</button>` : `
    <button onclick="openShipModal('${id}')" data-rbac="orders.edit" class="bg-green text-white px-4 py-2 rounded-lg text-xs font-semibold">🚚 Hantar + Tracking</button>`;

  if (o.status === 'shipped') return `
    <div class="text-xs text-ink/40 italic flex-1">Menunggu patient confirm penerimaan...</div>
    <button onclick="markStatus('${id}','delivered')" data-rbac="orders.edit" class="border border-ink/20 px-3 py-1.5 rounded-lg text-xs text-ink/60">Force Diterima</button>`;

  return '';
}

// ── Stock helpers ────────────────────────────────────
async function decrementStockForOrder(order) {
  if (!order || !Array.isArray(order.items)) return;
  for (const it of order.items) {
    if (!it.id || !it.qty) continue;
    const { data: prod } = await window.db.from('psy_products')
      .select('name, stock').eq('id', it.id).single().then(r => r, () => ({ data: null }));
    if (prod && prod.stock != null) {
      const newStock = Math.max(0, Number(prod.stock) - Number(it.qty));
      await window.db.from('psy_products').update({ stock: newStock }).eq('id', it.id);
      // Auto-sync: kurangkan juga di Inventori (nama sama)
      await (window.syncStockToInventory?.(prod.name, newStock));
    }
  }
}

async function restockForOrder(order) {
  if (!order || !Array.isArray(order.items)) return;
  for (const it of order.items) {
    if (!it.id || !it.qty) continue;
    const { data: prod } = await window.db.from('psy_products')
      .select('name, stock').eq('id', it.id).single().then(r => r, () => ({ data: null }));
    if (prod && prod.stock != null) {
      const newStock = Number(prod.stock) + Number(it.qty);
      await window.db.from('psy_products').update({ stock: newStock }).eq('id', it.id);
      // Auto-sync: tambah balik di Inventori (nama sama)
      await (window.syncStockToInventory?.(prod.name, newStock));
    }
  }
}

// ── Status Update ────────────────────────────────────
async function markStatus(orderId, status, extra = {}) {
  const ts = {};
  if (status === 'paid')      ts.paid_at      = new Date().toISOString();
  if (status === 'packed')    ts.packed_at    = new Date().toISOString();
  if (status === 'delivered') ts.delivered_at = new Date().toISOString();

  const prevOrder = allOrders.find(x => x.id === orderId);
  const prevStatus = prevOrder?.status;

  const { data: updated, error } = await window.db.from('psy_orders')
    .update({ status, updated_at: new Date().toISOString(), ...ts, ...extra })
    .eq('id', orderId).select('order_ref, patient_id, tracking_number').single()
    .then(r => r, r => r);

  if (error) { banner('Gagal: ' + (error.message || 'Ralat'), 'error'); return; }

  // Decrement stock on first transition into 'packed' (committed to ship)
  if (status === 'packed' && prevStatus !== 'packed' && prevStatus !== 'shipped' && prevStatus !== 'delivered') {
    await decrementStockForOrder(prevOrder);
  }
  // Restock if order is cancelled after stock was decremented
  if (status === 'cancelled' && (prevStatus === 'packed' || prevStatus === 'shipped')) {
    await restockForOrder(prevOrder);
  }

  // Audit log for accountability
  await window.db.from('psy_audit_log').insert({
    actor_id: window.currentUser.id, actor_name: window.currentUser.full_name,
    actor_role: 'staff', action: 'order.' + status, target: orderId,
    meta: { order_ref: updated?.order_ref, prev_status: prevStatus, ...extra },
  }).then(() => {}, () => {});

  // Notify patient
  const ref      = updated?.order_ref || '';
  const uid      = updated?.patient_id;
  const order    = allOrders.find(x => x.id === orderId);
  const isPickup = order?.delivery_method === 'pickup';
  const NOTIF = {
    paid:      ['Bayaran disahkan ✓',          isPickup
                  ? `Pesanan ${ref} disahkan. Kami akan maklumkan bila sedia untuk diambil.`
                  : `Pesanan ${ref} telah disahkan. Kami sedang menyediakan parsel anda.`],
    packed:    [isPickup ? 'Pesanan sedia untuk diambil 📍' : 'Pesanan sedang dibungkus 📦',
                isPickup
                  ? `Pesanan ${ref} sedia untuk diambil di konsultasi. Datang pada waktu operasi.`
                  : `Pesanan ${ref} sedang disediakan untuk penghantaran.`],
    shipped:   ['Pesanan dalam perjalanan 🚚',  `Pesanan ${ref} telah dihantar. No. tracking: ${extra.tracking_number || '—'}`],
    delivered: ['Pesanan selesai ✅',           `Pesanan ${ref} telah selesai. Terima kasih!`],
    cancelled: ['Pesanan dibatalkan',           `Pesanan ${ref} telah dibatalkan. Hubungi kami untuk maklumat lanjut.`],
  };
  if (uid && NOTIF[status]) {
    await window.db.from('psy_notifications').insert({
      user_id: uid, type: 'order',
      title: NOTIF[status][0], body: NOTIF[status][1],
      link: 'orders.html',
    }).then(() => {}, () => {});
  }

  banner('Status dikemaskini: ' + status);
  await loadOrders();
}

// ── Ship Modal ───────────────────────────────────────
function openShipModal(orderId) {
  document.getElementById('ship-order-id').value = orderId;
  document.getElementById('ship-tracking').value = '';
  document.getElementById('ship-courier').value  = 'JNT';
  document.getElementById('ship-photo-label').textContent = 'Klik untuk upload';
  document.getElementById('ship-photo-preview').classList.add('hidden');
  document.getElementById('ship-photo').value = '';
  document.getElementById('ship-btn').disabled = false;
  document.getElementById('ship-btn').textContent = 'Tandakan Dihantar';
  document.getElementById('ship-modal').classList.remove('hidden');
  shipPhotoFile = null;
}
function closeShipModal() { document.getElementById('ship-modal').classList.add('hidden'); }

function previewShipPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  shipPhotoFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('ship-photo-img').src = ev.target.result;
    document.getElementById('ship-photo-preview').classList.remove('hidden');
    document.getElementById('ship-photo-label').textContent = '✓ ' + file.name;
  };
  reader.readAsDataURL(file);
}

async function confirmShip() {
  const orderId  = document.getElementById('ship-order-id').value;
  const tracking = document.getElementById('ship-tracking').value.trim();
  const courier  = document.getElementById('ship-courier').value;
  if (!tracking) { banner('Masukkan tracking number dahulu', 'error'); return; }

  const btn = document.getElementById('ship-btn');
  btn.disabled = true; btn.textContent = 'Menghantar...';

  let photoUrl = null;
  if (shipPhotoFile) {
    try {
      const path = `orders/${orderId}/${Date.now()}_${shipPhotoFile.name}`;
      const { error } = await window.db.storage.from('order-photos').upload(path, shipPhotoFile);
      if (!error) {
        const { data } = window.db.storage.from('order-photos').getPublicUrl(path);
        photoUrl = data.publicUrl;
      }
    } catch (e) { console.warn('Photo upload skipped:', e.message); }
  }

  await markStatus(orderId, 'shipped', {
    tracking_number: tracking, courier,
    tracking_photo_url: photoUrl,
    shipped_at: new Date().toISOString(),
  });
  closeShipModal();
}

        <div class="flex justify-between text-sm"><span class="text-ink/60">No. Tracking</span><strong class="font-mono">${o.tracking_number}</strong></div>
        ${o.tracking_photo_url ? `<img src="${o.tracking_photo_url}" class="w-full mt-2 rounded-lg border border-ink/10 cursor-pointer max-h-40 object-cover" onclick="window.open('${o.tracking_photo_url}','_blank')">` : ''}

function closeDetailModal() { document.getElementById('detail-modal').classList.add('hidden'); }

// ── Load Data ────────────────────────────────────────
async function loadOrders() {
  const { data: orders, error } = await window.db
    .from('psy_orders')
    .select('*')
    .order('created_at', { ascending: false })
    .then(r => r, r => r);

  if (error || !orders?.length) {
    allOrders = [];
    renderStats([]);
    renderFilterChips();
    renderOrders();
    return;
  }

  // Fetch profiles separately (no FK constraint on patient_id)
  const ids = [...new Set(orders.map(o => o.patient_id).filter(Boolean))];
  let profileMap = {};
  if (ids.length) {
    const { data: profiles } = await window.db
      .from('psy_profiles')
      .select('id, full_name, phone')
      .in('id', ids)
      .then(r => r, () => ({ data: [] }));
    (profiles || []).forEach(p => { profileMap[p.id] = p; });
  }

  allOrders = orders.map(o => ({ ...o, psy_profiles: profileMap[o.patient_id] || null }));
  renderStats(allOrders);
  renderFilterChips();
  renderOrders();
}

function formatDate(d)     { return new Date(d).toLocaleDateString('ms-MY', { day:'2-digit', month:'short', year:'numeric' }); }
function formatDateTime(d) { return new Date(d).toLocaleString('ms-MY', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }); }

async function checkNewOrderNotifs() {
  const { data: { user } } = await window.db.auth.getUser();
  if (!user) return;
  const { data } = await window.db.from('psy_notifications')
    .select('id').eq('user_id', user.id).eq('type', 'order').eq('is_read', false);
  const count = data?.length || 0;
  if (count > 0) {
    document.getElementById('orders-alert-text').textContent = `${count} pesanan baru diterima`;
    document.getElementById('orders-alert-banner').classList.remove('hidden');
  }
}

async function dismissOrdersAlert() {
  const { data: { user } } = await window.db.auth.getUser();
  if (!user) return;
  await window.db.from('psy_notifications')
    .update({ is_read: true }).eq('user_id', user.id).eq('type', 'order').eq('is_read', false);
  document.getElementById('orders-alert-banner').classList.add('hidden');
  if (typeof loadNotifBadge === 'function') loadNotifBadge();
}

(async () => {
  const user = await initStaff('psy_orders', 'Urus orders & penghantaran');
  if (!user) return;
  if (!can('orders','export')) {
    document.getElementById('stat-row').classList.add('hidden');
  }
  if (can('orders','edit')) document.getElementById('ship-btn').classList.remove('hidden');
  loadOrders();
  checkNewOrderNotifs();
})();
</script>
