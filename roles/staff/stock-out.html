<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Stock Out</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📤</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">
        <div class="text-xs text-ink/40">
          <span>Inventory</span> <span class="mx-1">›</span>
          <span class="text-ink/70 font-medium">Stock Out</span>
        </div>

        <div class="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h2 class="text-xl font-bold text-navy">Stock Out</h2>
            <p class="text-xs text-ink/50 mt-0.5">Rekod stok keluar secara manual — rosak, luput, hilang, pembetulan, atau guna dalaman.</p>
          </div>
        </div>

        <!-- Satu kad sahaja — bahagian dipisah dengan garisan, bukan kad berasingan -->
        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm min-w-0">

          <div class="p-6 space-y-3">
            <h3 class="font-bold text-sm text-ink">1. Keluar Information</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
              <div>
                <label class="text-sm font-semibold text-ink">Tarikh Keluar <span class="text-terracotta">*</span></label>
                <input id="so-date" type="date" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none">
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Storage Location <span class="text-terracotta">*</span></label>
                <select id="so-location" onchange="onLocationChange()" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white focus:border-navy outline-none"></select>
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Dikeluarkan Oleh</label>
                <input id="so-by" disabled class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-ink/5 text-ink/50">
              </div>
              <div>
                <label class="text-sm font-semibold text-ink">Sebab <span class="text-terracotta">*</span></label>
                <select id="so-reason" onchange="onReasonChange()" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white focus:border-navy outline-none">
                  <option value="rosak">Rosak</option>
                  <option value="luput">Luput / Tamat Tempoh</option>
                  <option value="hilang">Hilang</option>
                  <option value="pembetulan">Pembetulan Stok Fizikal</option>
                  <option value="dalaman">Guna Dalaman</option>
                  <option value="lain">Lain-lain</option>
                </select>
              </div>
            </div>
            <div>
              <label class="text-sm font-semibold text-ink">Catatan <span id="so-notes-req" class="hidden text-terracotta">*</span><span id="so-notes-opt" class="text-ink/35 font-normal">(Optional)</span></label>
              <textarea id="so-notes" rows="2" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none resize-none" placeholder="Cth: Botol pecah masa pengangkutan, kiraan fizikal bulanan..."></textarea>
            </div>
          </div>

          <div class="p-6 border-t border-ink/8">
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-bold text-sm text-ink">2. Items Keluar</h3>
              <button onclick="addLineRow()" class="text-xs font-semibold text-navy hover:underline">+ Add Item</button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead>
                  <tr class="border-b border-ink/10 text-left text-[10px] uppercase tracking-wider text-ink/45">
                    <th class="pb-2">Product</th>
                    <th class="pb-2 w-32 text-right">Tersedia</th>
                    <th class="pb-2 w-28 text-right">Kuantiti Keluar</th>
                    <th class="pb-2 w-10"></th>
                  </tr>
                </thead>
                <tbody id="so-items-tbody"></tbody>
              </table>
            </div>
            <div id="so-items-empty" class="text-center text-ink/40 text-sm py-6 italic">Tiada item — klik "+ Add Item" untuk mula.</div>
          </div>

          <!-- Butang tindakan di bawah -->
          <div class="p-6 border-t border-ink/8 flex justify-end gap-2">
            <button onclick="cancelForm()" class="px-4 py-2.5 border border-ink/20 rounded-xl text-sm font-semibold bg-white hover:bg-ink/5">Cancel</button>
            <button id="so-submit-btn" onclick="saveStockOut()" class="bg-navy text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-navy-dark">✓ Confirm &amp; Post</button>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/inventoryStock.js"></script>
<script src="_shared.js"></script>
<script>
const REASON_LABEL = {
  rosak: 'Rosak', luput: 'Luput / Tamat Tempoh', hilang: 'Hilang',
  pembetulan: 'Pembetulan Stok Fizikal', dalaman: 'Guna Dalaman', lain: 'Lain-lain',
};

let allItems = [];
let allLocations = [];
let stockByLoc = {}; // `${item_id}_${location_id}` -> qty
let lineItems = []; // { _key, item_id, item_name, qty }
let lineSeq = 0;

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function loadItems() {
  const { data } = await window.db.from('psy_inventory_items').select('id,name,unit').eq('is_active', true).order('name');
  allItems = data || [];
}

async function loadLocations() {
  const { data } = await window.db.from('psy_inventory_locations').select('*').eq('is_active', true).order('name');
  allLocations = data || [];
  const sel = document.getElementById('so-location');
  sel.innerHTML = allLocations.map(l => `<option value="${l.id}" ${l.is_default ? 'selected' : ''}>${escHtml(l.name)}</option>`).join('');
}

async function loadStock() {
  const { data } = await window.db.from('psy_inventory_stock_by_location').select('item_id,location_id,qty_in_stock');
  stockByLoc = {};
  (data || []).forEach(r => { stockByLoc[`${r.item_id}_${r.location_id}`] = Number(r.qty_in_stock) || 0; });
}

function availableQty(itemId, locId) {
  return stockByLoc[`${itemId}_${locId}`] || 0;
}

function onLocationChange() { renderLineItems(); }
window.onLocationChange = onLocationChange;

function onReasonChange() {
  const isLain = document.getElementById('so-reason').value === 'lain';
  document.getElementById('so-notes-req').classList.toggle('hidden', !isLain);
  document.getElementById('so-notes-opt').classList.toggle('hidden', isLain);
}
window.onReasonChange = onReasonChange;

function addLineRow() {
  lineItems.push({ _key: ++lineSeq, item_id: '', item_name: '', qty: 1 });
  renderLineItems();
}
window.addLineRow = addLineRow;

function removeLineRow(key) {
  lineItems = lineItems.filter(r => r._key !== key);
  renderLineItems();
}
window.removeLineRow = removeLineRow;

function onLineItemChange(key, itemId) {
  const row = lineItems.find(r => r._key === key);
  const item = allItems.find(i => i.id === itemId);
  row.item_id = itemId;
  row.item_name = item?.name || '';
  renderLineItems();
}
window.onLineItemChange = onLineItemChange;

function onLineQtyChange(key, value) {
  const row = lineItems.find(r => r._key === key);
  row.qty = Number(value);
}
window.onLineQtyChange = onLineQtyChange;

function renderLineItems() {
  const tbody = document.getElementById('so-items-tbody');
  document.getElementById('so-items-empty').classList.toggle('hidden', lineItems.length > 0);
  const locId = document.getElementById('so-location').value;
  tbody.innerHTML = lineItems.map(row => {
    const avail = row.item_id && locId ? availableQty(row.item_id, locId) : null;
    const item = allItems.find(i => i.id === row.item_id);
    return `
    <tr class="border-b border-ink/5 last:border-0">
      <td class="py-2 pr-2 align-top">
        <select onchange="onLineItemChange(${row._key}, this.value)" class="w-full px-2 py-2 border border-ink/15 rounded-lg text-sm bg-white focus:border-navy outline-none">
          <option value="">— Pilih item —</option>
          ${allItems.map(i => `<option value="${i.id}" ${i.id === row.item_id ? 'selected' : ''}>${escHtml(i.name)}</option>`).join('')}
        </select>
      </td>
      <td class="py-2 pr-2 align-top text-right text-sm text-ink/60 whitespace-nowrap">${avail === null ? '—' : `${avail} ${escHtml(item?.unit || '')}`}</td>
      <td class="py-2 pr-2 align-top"><input type="number" min="0.01" step="0.01" value="${row.qty}" oninput="onLineQtyChange(${row._key},this.value)" class="w-full px-2 py-2 border border-ink/15 rounded-lg text-sm text-right focus:border-navy outline-none"></td>
      <td class="py-2 align-top text-center"><button onclick="removeLineRow(${row._key})" class="text-terracotta hover:text-terracotta/70 text-sm">🗑</button></td>
    </tr>`;
  }).join('');
}

function cancelForm() {
  history.back();
}
window.cancelForm = cancelForm;

async function saveStockOut() {
  const locationId = document.getElementById('so-location').value;
  const reason = document.getElementById('so-reason').value;
  const notes = document.getElementById('so-notes').value.trim();
  if (!locationId) { banner('Sila pilih Storage Location', 'error'); return; }
  if (reason === 'lain' && !notes) { banner('Sila nyatakan sebab dalam Catatan', 'error'); return; }
  if (!lineItems.length) { banner('Sila tambah sekurang-kurangnya satu item', 'error'); return; }
  for (const r of lineItems) {
    if (!r.item_id) { banner('Sila pilih item untuk setiap baris', 'error'); return; }
    if (!r.qty || r.qty <= 0) { banner('Kuantiti setiap item mesti lebih daripada 0', 'error'); return; }
    const avail = availableQty(r.item_id, locationId);
    if (r.qty > avail) { banner(`${r.item_name}: kuantiti (${r.qty}) melebihi stok tersedia di lokasi ini (${avail})`, 'error'); return; }
  }

  const loc = allLocations.find(l => l.id === locationId);
  const note = `${REASON_LABEL[reason]}${notes ? ' — ' + notes : ''}`;

  const btn = document.getElementById('so-submit-btn');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    for (const r of lineItems) {
      await addStockToLocation(r.item_id, -r.qty, loc?.name, { type: 'out', refType: 'manual', note, itemName: r.item_name });
    }
    await window.db.from('psy_audit_log').insert({
      actor_id: window.currentUser.id, actor_name: window.currentUser.full_name, actor_role: 'staff',
      action: 'inventory.manual_stock_out', target: null,
      meta: { reason, location: loc?.name, items: lineItems.map(r => ({ item_id: r.item_id, item_name: r.item_name, qty: r.qty })) },
    });
    banner('Stock Out berjaya direkod — stok dikemaskini ✅');
    location.href = 'inventory.html';
  } catch (e) {
    btn.disabled = false; btn.textContent = '✓ Confirm & Post';
    banner('Gagal simpan Stock Out: ' + e.message, 'error');
  }
}
window.saveStockOut = saveStockOut;

(async () => {
  const user = await initStaff('stock_out', 'Stock Out', 'inventory');
  if (!user) return;
  document.getElementById('so-date').value = new Date().toISOString().slice(0, 10);
  document.getElementById('so-by').value = user.full_name || '';
  await Promise.all([loadItems(), loadLocations(), loadStock()]);
  onReasonChange();

  // ?item=<id> — datang dari halaman produk (butang Stock Out di kad Stok Keluar).
  const qs = new URLSearchParams(location.search);
  addLineRow();
  const itemParam = qs.get('item');
  if (itemParam && allItems.find(i => i.id === itemParam)) {
    onLineItemChange(lineItems[lineItems.length - 1]._key, itemParam);
  }
})();
</script>
</body>
</html>
