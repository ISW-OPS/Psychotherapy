<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Persediaan Event</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🧰</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-6">

        <!-- Page Header -->
        <div class="flex items-center justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-xl font-bold text-ink">Persediaan Event</h1>
            <p class="text-sm text-ink/45 mt-0.5">Status checklist peralatan & bahan merentas semua Acara & Kelas</p>
          </div>
        </div>

        <!-- Ringkasan -->
        <div id="summary-row" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>

        <!-- Jadual acara -->
        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
          <div class="p-4 border-b border-ink/10">
            <input id="search-input" type="text" placeholder="Cari nama acara / lokasi..." oninput="renderEvents()"
              class="w-full max-w-sm px-3 py-2 border border-ink/15 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-navy/20">
          </div>
          <div class="px-5 py-2 border-b border-ink/5 grid gap-3 items-center" style="grid-template-columns:2fr 1fr 1fr 1.4fr 110px 90px">
            <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider">Nama Acara</span>
            <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider">Tarikh</span>
            <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider">Lokasi</span>
            <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider">Progress</span>
            <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider">Status</span>
            <span class="text-[10px] font-bold text-ink/40 uppercase tracking-wider text-right">Tindakan</span>
          </div>
          <div id="events-table" class="divide-y divide-ink/5"></div>
          <div id="events-empty" class="hidden px-5 py-12 text-center text-sm text-ink/35">Tiada acara ditemui</div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString(LCALE(),{day:'2-digit',month:'short',year:'numeric'}) : '—'; }

let allEvents = [];
let allPrepItems = [];
let allInventoryStock = [];   // {id, qty_in_stock}
let allEquipment = [];        // {id, status}

const STATUS_META = {
  sedia:            { label: 'Sedia',            cls: 'bg-green-100 text-green-700' },
  tidak_lengkap:    { label: 'Tidak Cukup',       cls: 'bg-red-100 text-red-600' },
  belum_mula:       { label: 'Belum Mula',        cls: 'bg-ink/10 text-ink/50' },
};

function invStock(inventoryItemId) {
  const it = allInventoryStock.find(i => i.id === inventoryItemId);
  return it ? Number(it.qty_in_stock || 0) : null;
}
function itemCukup(it) {
  if (it.source === 'equipment') {
    const eq = allEquipment.find(e => e.id === it.equipment_id);
    return eq ? eq.status === 'available' : true;
  }
  if (it.source !== 'inventory' || !it.inventory_item_id) return true;
  const stock = invStock(it.inventory_item_id);
  return stock === null || stock >= Number(it.qty_needed);
}

// Status acara dikira dari stok sebenar barang psy_event_prep_items dia:
// tiada item = Belum Mula; semua barang mencukupi stok = Sedia; ada barang
// tak cukup stok = Tidak Cukup.
function eventPrepStats(eventId) {
  const items = allPrepItems.filter(i => i.event_id === eventId);
  const total = items.length;
  const cukup = items.filter(itemCukup).length;
  let status;
  if (total === 0) status = 'belum_mula';
  else if (cukup === total) status = 'sedia';
  else status = 'tidak_lengkap';
  const pct = total ? Math.round((cukup/total)*100) : 0;
  return { total, ready: cukup, pct, status };
}

function renderSummary() {
  const counts = { sedia:0, tidak_lengkap:0, belum_mula:0 };
  allEvents.forEach(ev => { counts[eventPrepStats(ev.id).status]++; });

  const tile = (key) => `
    <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-5">
      <div class="text-[11px] text-ink/45 font-medium">${STATUS_META[key].label}</div>
      <div class="text-2xl font-bold text-ink mt-1">${counts[key]}</div>
    </div>`;

  document.getElementById('summary-row').innerHTML = Object.keys(STATUS_META).map(tile).join('');
}

function renderEvents() {
  const search = (document.getElementById('search-input').value || '').toLowerCase().trim();
  const filtered = allEvents.filter(ev => {
    if (!search) return true;
    return `${ev.title || ''} ${ev.location || ''}`.toLowerCase().includes(search);
  });

  const tbody = document.getElementById('events-table');
  const empty = document.getElementById('events-empty');
  if (!filtered.length) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  tbody.innerHTML = filtered
    .sort((a,b) => new Date(a.start_at||0) - new Date(b.start_at||0))
    .map(ev => {
      const s = eventPrepStats(ev.id);
      const info = STATUS_META[s.status];
      return `<div class="grid gap-3 items-center px-5 py-3 hover:bg-ink/[0.015] transition-colors" style="grid-template-columns:2fr 1fr 1fr 1.4fr 110px 90px">
        <div class="text-sm font-semibold text-ink truncate">${escHtml(ev.title)}</div>
        <div class="text-xs text-ink/60">${fmtDate(ev.start_at)}</div>
        <div class="text-xs text-ink/60 truncate">${escHtml(ev.location || (ev.mode === 'online' ? 'Online' : '—'))}</div>
        <div>
          <div class="flex items-center justify-between text-[11px] text-ink/50 mb-1">
            <span>${s.ready}/${s.total} item</span><span>${s.pct}%</span>
          </div>
          <div class="h-1.5 rounded-full bg-ink/5 overflow-hidden"><div class="h-full bg-navy rounded-full" style="width:${s.pct}%"></div></div>
        </div>
        <div><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${info.cls}">${info.label}</span></div>
        <div class="text-right"><a href="acara-detail.html?id=${ev.id}#persediaan" class="text-xs font-semibold text-navy hover:underline">Lihat ›</a></div>
      </div>`;
    }).join('');
}

async function loadData() {
  const [evRes, itemRes, invRes, eqRes] = await Promise.all([
    window.db.from('psy_events').select('id, title, start_at, location, mode').order('start_at', { ascending: false }),
    window.db.from('psy_event_prep_items').select('event_id, source, inventory_item_id, equipment_id, qty_needed'),
    window.db.from('psy_inventory_items').select('id, qty_in_stock').eq('is_active', true),
    window.db.from('psy_equipment').select('id, status'),
  ]);
  if (evRes.error) { banner('Ralat muat acara: ' + evRes.error.message, 'error'); return; }
  allEvents = evRes.data || [];
  allPrepItems = itemRes.data || [];
  allInventoryStock = invRes.data || [];
  allEquipment = eqRes.data || [];
  renderSummary();
  renderEvents();
}

async function init() {
  const user = await initStaff('persediaan_event', 'Persediaan Event');
  if (!user) return;
  await loadData();
}

init();
</script>
</body>
</html>
