<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Senarai KOB</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
  /* Sama gaya select macam kob-detail.html (.finput) — untuk dropdown assign
     Collector/Closer terus dari senarai. */
  .finput { width: 100%; padding: 6px 10px; border: 1.5px solid #e5e7eb; border-radius: 10px;
    font-size: 12.5px; outline: none; transition: border-color .15s; background: white; color: #111; }
  .finput:focus { border-color: #1a3a5c; }
  select.finput { cursor: pointer; }
</style>
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🩺</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <div class="bg-navy-light/40 border border-navy/20 rounded-xl p-4 text-sm text-navy flex-1">
            📌 Senarai sesi KOB (Konsultasi Overhaul Body). Tekan butang untuk lihat detail, tandakan Hadir & Selesai.
          </div>
          <a href="patients.html?add=1" data-rbac="kob.create" class="bg-navy text-white px-4 py-2.5 rounded-lg text-sm font-semibold hover:bg-navy-dark whitespace-nowrap inline-block">+ Tambah Pesakit / Tempah KOB</a>
        </div>

        <div class="flex items-center gap-3 flex-wrap">
          <div class="flex gap-2 flex-wrap">
            <button onclick="setFilter('today')" id="f-today" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-navy text-white">Hari Ini <span id="badge-today" class="hidden ml-1 bg-terracotta text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full"></span></button>
            <button onclick="setFilter('upcoming')" id="f-upcoming" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-ink/15">Akan Datang <span id="badge-upcoming" class="hidden ml-1 bg-terracotta text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full"></span></button>
            <button onclick="setFilter('missed')" id="f-missed" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-ink/15">Terlepas <span id="badge-missed" class="hidden ml-1 bg-terracotta text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full"></span></button>
            <button onclick="setFilter('hadir')" id="f-hadir" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-ink/15">Sedang Berlangsung</button>
            <button onclick="setFilter('completed')" id="f-completed" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-ink/15">Selesai</button>
            <button onclick="setFilter('all')" id="f-all" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-ink/15">Semua</button>
          </div>
          <select id="filter-signup" onchange="render()"
            class="ml-auto px-3 py-1.5 border border-ink/15 rounded-lg text-xs bg-white">
            <option value="">Semua Signup Pakej</option>
            <option value="signed_up">✅ Signup Pakej</option>
            <option value="not_signed">⚠️ Tak Signup Pakej</option>
            <option value="pending">⏳ Tunggu Doktor</option>
          </select>
        </div>

        <div class="bg-white rounded-xl border border-ink/10 overflow-x-auto">
          <table class="data">
            <thead>
              <tr>
                <th>Tarikh & Masa</th>
                <th>Pesakit</th>
                <th>Kod KOB</th>
                <th>Mod</th>
                <th>Collector</th>
                <th>Closer</th>
                <th>Status</th>
                <th>Sumber</th>
                <th>Signup Pakej</th>
                <th class="text-right">Tindakan</th>
              </tr>
            </thead>
            <tbody id="kob-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/utils.js"></script>
<script src="_shared.js"></script>
<script>
    function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
initScrollPreserve();
let allKob = [];
let patientMap = {};
let filterMode = 'today';

const STATUS_LABEL = {
  booked:     { label: 'Ditempah', cls: 'bg-navy-light text-navy' },
  hadir:      { label: 'Hadir',    cls: 'bg-gold/30 text-gold-dark' },
  completed:  { label: 'Selesai',  cls: 'bg-green-light text-green-dark' },
  reschedule: { label: 'Reschedule', cls: 'bg-ink/10 text-ink/70' },
  cancelled:  { label: 'Batal',    cls: 'bg-terracotta/15 text-terracotta' },
  kiv:        { label: 'KIV',      cls: 'bg-amber-100 text-amber-700' },
  no_show:    { label: 'Tidak Hadir', cls: 'bg-terracotta/15 text-terracotta' },
};
// Status yang staff boleh set manual dari dropdown senarai (bukan semua —
// 'completed' ada gate/syarat berat di kob-detail.html (agreement, bayaran,
// pengaktifan pakej+plan), kekal di sana sahaja. 'kiv' JUGA bukan pilihan
// manual di sini — ia auto-set bila doktor klik "Patient Tidak Teruskan" di
// kob-detail.html, lihat saveRecommendation()). 'reschedule' pilihan manual
// TAPI tak tulis status terus dari sini — onKobStatusChange redirect ke modal
// "Tukar Jadual" kob-detail.html supaya tarikh/slot baharu wajib dipilih
// serta-merta (elak sesi tergantung dgn status Reschedule tapi tarikh lama).
// 'hadir' pun selamat manual — cuma sekatan ringan (tak boleh sebelum tarikh
// sesi, lihat onKobStatusChange), tiada automasi pakej seperti 'completed'.
const EDITABLE_STATUS = ['booked', 'hadir', 'reschedule', 'cancelled', 'no_show'];

// ── Collector / Closer assign & tukar terus dari senarai (sama pattern
// dgn assign Coach di patients.html, dan assign single-record di kob-detail.html) ──
let kobRoleStaff = [];
async function loadKobRoleStaff() {
  // psy_roles.code TAK semestinya sama dgn label paparan "KOB" (cth. kod sebenar
  // warisan peranan lama "telesales") — cari code betul ikut label dulu, jangan
  // hardcode 'kob'.
  const { data: roleRows } = await window.db.from('psy_roles')
    .select('code').ilike('label', 'KOB').limit(1);
  const roleCode = roleRows?.[0]?.code;
  if (!roleCode) { kobRoleStaff = []; return; }
  const { data } = await window.db.from('psy_profiles')
    .select('id, full_name').eq('role', 'staff').eq('staff_role', roleCode).order('full_name');
  kobRoleStaff = data || [];
}
const KOB_ROLE_LABEL = { collector: 'Collector', closer: 'Closer' };

function kobRoleCellHtml(k, field) {
  const idKey = `${field}_id`, nameKey = `${field}_name`;
  // Collector rekod source='ghl' ditarik terus dari GHL (medan "closer" =
  // {{appointment.booked_by}}, lihat ghl-booking-webhook) — bukan akaun staff
  // ISW, papar apa adanya, tiada dropdown (keputusan 28 Sept 2026). TAPI
  // rekod source='system' (PT System, dicipta terus dlm ISW, tiada data GHL
  // langsung) KEKAL dropdown boleh assign manual — tanpa ni staff tiada cara
  // assign Collector langsung utk sesi bukan-GHL (disahkan dari data sedia
  // ada di PROD yg memang guna collector_id staff sebenar utk rekod 'system').
  // Closer kekal dropdown sepenuhnya utk semua rekod — staff tetapkan/tukar
  // manual (idea auto-assign closer digugurkan, 28 Sept 2026).
  if ((field === 'collector' && k.source === 'ghl') || !can('kob', 'edit')) {
    return `<span class="text-ink/70">${escapeHtml(k[nameKey] || '—')}</span>`;
  }
  const current = k[idKey];
  const opts = kobRoleStaff.map(s => `<option value="${s.id}" ${s.id === current ? 'selected' : ''}>${escapeHtml(s.full_name)}</option>`).join('');
  // Sesi dari GHL — nama collector ditarik terus dari GHL (cth. "T103 SABRINA"),
  // TIADA akaun staff ISW sepadan (collector_id kosong). Papar teks GHL tu sbg
  // placeholder dropdown supaya nampak, bukan hilang jadi "— Pilih —" kosong.
  // Staff ISW tetap boleh timpa manual ke Collector sebenar bila-bila.
  const ghlOnly = !current && k[nameKey];
  const placeholder = ghlOnly
    ? `<option value="" selected>${escapeHtml(k[nameKey])} (Maju Jaya)</option>`
    : `<option value="" ${current ? '' : 'selected'}>— Pilih ${KOB_ROLE_LABEL[field]} —</option>`;
  return `<select class="finput" data-rbac="kob.edit" onchange="onKobRoleChange(this,'${field}','${k.id}')">
    ${placeholder}
    ${opts}
  </select>`;
}

async function onKobRoleChange(sel, field, kobId) {
  const k = allKob.find(x => x.id === kobId);
  if (!k) return;
  const idKey = `${field}_id`, nameKey = `${field}_name`;
  const fromId = k[idKey], fromName = k[nameKey];
  const staff = kobRoleStaff.find(s => s.id === sel.value);
  const toId = staff?.id || null, toName = staff?.full_name || null;
  if (toId === fromId) return;
  sel.disabled = true;
  const { error } = await window.db.from('psy_kob_sessions')
    .update({ [idKey]: toId, [nameKey]: toName, updated_at: new Date().toISOString() })
    .eq('id', kobId);
  sel.disabled = false;
  if (error) { banner('Ralat: ' + error.message, 'error'); sel.value = fromId || ''; return; }
  await auditLog(`kob.${field}_${toId ? 'assigned' : 'unassigned'}`, kobId, { patient_id: k.patient_id, from_id: fromId, from_name: fromName, to_id: toId, to_name: toName });
  k[idKey] = toId; k[nameKey] = toName;
  banner(toId ? `${KOB_ROLE_LABEL[field]} ditetapkan kepada ${toName} ✅` : `${KOB_ROLE_LABEL[field]} dikosongkan`);
}

// Dropdown status terus dari senarai — status "flat" (booked/hadir/
// reschedule/cancelled/no_show), TIADA gate berat. 'completed'/'kiv' ada
// logik/gate sendiri (agreement, pengaktifan pakej+plan, auto-trigger
// doktor) — kekal di kob-detail.html sahaja, papar sbg chip read-only di
// sini (elak staff terlepas syarat penting / conflict dgn automasi).
function statusCellHtml(k, missed) {
  const st = missed ? { label: 'Terlepas', cls: 'bg-terracotta/15 text-terracotta' } : (STATUS_LABEL[k.status] || STATUS_LABEL.booked);
  const hint = missed ? '<div class="text-[10px] text-terracotta mt-0.5">⚠️ Terlepas</div>' : '';
  if (!can('kob', 'edit') || !EDITABLE_STATUS.includes(k.status)) {
    return `<span class="chip ${st.cls}">${st.label}</span>${hint}`;
  }
  const opts = EDITABLE_STATUS.map(s => `<option value="${s}" ${s === k.status ? 'selected' : ''}>${STATUS_LABEL[s].label}</option>`).join('');
  return `<select class="finput" data-rbac="kob.edit" onchange="onKobStatusChange(this,'${k.id}')">${opts}</select>${hint}`;
}

async function onKobStatusChange(sel, kobId) {
  const k = allKob.find(x => x.id === kobId);
  if (!k) return;
  const fromStatus = k.status, toStatus = sel.value;
  if (toStatus === fromStatus) return;
  // 'reschedule' tanpa tarikh baru tak berguna (sesi tergantung dgn tarikh lama) —
  // jangan tulis status terus dari sini, bawa ke modal "Tukar Jadual" kob-detail.html
  // supaya tarikh/slot baharu wajib dipilih serta-merta. Modal tu sendiri akan
  // set status='booked' + tarikh baharu bila staff confirm (tiada tarikh dipilih =
  // batal, status kekal macam asal, tiada apa ditulis).
  if (toStatus === 'reschedule') {
    sel.value = fromStatus;
    location.href = `kob-detail.html?id=${kobId}&action=reschedule`;
    return;
  }
  // 'hadir' bawa sekatan ringan yang sama macam markHadir() di kob-detail.html —
  // elak tandakan hadir utk sesi yang belum sampai tarikhnya.
  if (toStatus === 'hadir' && k.scheduled_at && new Date(k.scheduled_at) > new Date()) {
    banner('Belum boleh tandakan hadir — sesi KOB ini dijadualkan pada masa akan datang.', 'error');
    sel.value = fromStatus;
    return;
  }
  sel.disabled = true;
  const updates = { status: toStatus, updated_at: new Date().toISOString() };
  if (toStatus === 'hadir') updates.hadir_at = new Date().toISOString();
  const { error } = await window.db.from('psy_kob_sessions').update(updates).eq('id', kobId);
  if (!error && toStatus === 'hadir') {
    await window.db.from('psy_patients').update({ kob_status: 'hadir' }).eq('id', k.patient_id);
  }
  sel.disabled = false;
  if (error) { banner('Ralat: ' + error.message, 'error'); sel.value = fromStatus; return; }
  await auditLog(toStatus === 'hadir' ? 'kob.hadir' : 'kob.status_changed', kobId, { patient_id: k.patient_id, from: fromStatus, to: toStatus });
  k.status = toStatus;
  banner(`Status ditukar ke ${STATUS_LABEL[toStatus].label} ✅`);
  render();
}

// "Terlepas" bukan status DB sebenar — ia keadaan terbitan: masih 'booked' tapi
// tarikh/masa dah lepas & staff belum tandakan Hadir/Reschedule/Batal.
const isMissed = k => k.status === 'booked' && k.scheduled_at < new Date().toISOString();

function setFilter(mode) {
  filterMode = mode;
  ['today','upcoming','missed','hadir','completed','all'].forEach(m => {
    const b = document.getElementById('f-' + m);
    if (b) b.className = `px-3 py-1.5 rounded-lg text-xs font-semibold ${m === mode ? 'bg-navy text-white' : 'bg-white border border-ink/15'}`;
  });
  render();
}

async function loadAll() {
  const [kobRes, patRes] = await Promise.all([
    window.db.from('psy_kob_sessions').select('*').order('scheduled_at', { ascending: false }),
    window.db.from('psy_patients').select('id, mrn, full_name, kob_status, active_package_id, active_package_name, ghl_kob_code, psy_profiles!psy_patients_user_id_fkey(full_name, phone)'),
    loadKobRoleStaff(),
  ]);
  allKob = kobRes.data || [];
  (patRes.data || []).forEach(p => { patientMap[p.id] = p; });
  const todayStr = localDateStr(new Date());
  const todayCount = allKob.filter(k => localDateStr(k.scheduled_at) === todayStr).length;
  const upcomingCount = allKob.filter(k => k.scheduled_at >= new Date().toISOString() && k.status === 'booked').length;
  const missedCount = allKob.filter(isMissed).length;
  const badgeToday = document.getElementById('badge-today');
  if (badgeToday) {
    if (todayCount > 0) { badgeToday.textContent = todayCount; badgeToday.classList.remove('hidden'); }
    else badgeToday.classList.add('hidden');
  }
  const badge = document.getElementById('badge-upcoming');
  if (badge) {
    if (upcomingCount > 0) { badge.textContent = upcomingCount; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  }
  const badgeMissed = document.getElementById('badge-missed');
  if (badgeMissed) {
    if (missedCount > 0) { badgeMissed.textContent = missedCount; badgeMissed.classList.remove('hidden'); }
    else badgeMissed.classList.add('hidden');
  }
  render();
}

function signupChip(kob, pat) {
  // Show signup status based on patient state + kob recommendation
  const kobDone = pat?.kob_status === 'completed';
  const hasPkg = !!pat?.active_package_id;
  if (kobDone && hasPkg) {
    return `<span class="text-xs text-green-dark">✅ ${escapeHtml(pat.active_package_name || 'Signup')}</span>`;
  }
  if (kobDone && !hasPkg) {
    return '<span class="text-xs text-terracotta">⚠️ Tak Signup</span>';
  }
  // KOB session has recommendation but not finalized
  if (kob.recommended_package_name) {
    return `<span class="text-xs text-gold-dark">⏳ Cadang: ${escapeHtml(kob.recommended_package_name)}</span>`;
  }
  return '<span class="text-xs text-ink/40">—</span>';
}

function signupCategory(kob, pat) {
  const kobDone = pat?.kob_status === 'completed';
  const hasPkg = !!pat?.active_package_id;
  if (kobDone && hasPkg) return 'signed_up';
  if (kobDone && !hasPkg) return 'not_signed';
  return 'pending';
}

function localDateStr(d) {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}

function render() {
  const today = localDateStr(new Date());
  const signupFilter = document.getElementById('filter-signup')?.value || '';
  let list = allKob;
  if (filterMode === 'today') {
    list = list.filter(k => localDateStr(k.scheduled_at) === today);
  } else if (filterMode === 'upcoming') {
    list = list.filter(k => k.scheduled_at >= new Date().toISOString() && k.status === 'booked');
  } else if (filterMode === 'missed') {
    list = list.filter(isMissed);
  } else if (filterMode === 'hadir') {
    list = list.filter(k => k.status === 'hadir');
  } else if (filterMode === 'completed') {
    // KIV turut dikira "Selesai" di sini — sesi dah berlaku (parking sebab
    // patient tak teruskan pakej), bukan tempahan aktif lagi. Papar tab ni,
    // tapi badge STATUS kekal tunjuk "KIV" berasingan drpd "Selesai" (statusCellHtml).
    list = list.filter(k => k.status === 'completed' || k.status === 'kiv');
  }
  if (signupFilter) {
    list = list.filter(k => signupCategory(k, patientMap[k.patient_id]) === signupFilter);
  }

  const body = document.getElementById('kob-body');
  if (!list.length) {
    body.innerHTML = '<tr><td colspan="10" class="text-center text-ink/40 py-8">Tiada KOB ditemui</td></tr>';
    return;
  }

  body.innerHTML = list.map(k => {
    const pat = patientMap[k.patient_id];
    const patName = pat?.psy_profiles?.full_name || pat?.full_name || '—';
    const dt = new Date(k.scheduled_at);
    const dateStr = dt.toLocaleDateString(LCALE(), { day:'2-digit', month:'short', year:'numeric' });
    const timeStr = dt.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    const missed = isMissed(k);
    return `<tr${missed ? ' class="bg-terracotta/5"' : ''}>
      <td class="whitespace-nowrap"><div class="font-semibold">${escapeHtml(dateStr)}</div><div class="text-xs text-ink/50">${escapeHtml(timeStr)}</div></td>
      <td>${escapeHtml(patName)}</td>
      <td class="text-xs font-mono">${escapeHtml(pat?.ghl_kob_code || '—')}</td>
      <td class="text-xs">${k.mode === 'online' ? '💻 Online' : '🏥 F2F'}</td>
      <td class="text-xs">${kobRoleCellHtml(k, 'collector')}</td>
      <td class="text-xs">${kobRoleCellHtml(k, 'closer')}</td>
      <td class="text-xs">${statusCellHtml(k, missed)}</td>
      <td class="text-xs">${k.source === 'ghl' ? '<span class="text-navy font-semibold">🔗 Maju Jaya Sync</span>' : '<span class="text-ink/50">🖥️ PT System</span>'}</td>
      <td>${signupChip(k, pat)}</td>
      <td class="text-right whitespace-nowrap flex items-center justify-end gap-3">
        <a href="kob-detail.html?id=${k.id}" class="text-xs text-navy font-semibold hover:underline">Detail →</a>
        ${can('kob','delete') ? `<button data-rbac="kob.delete" onclick="deleteKob(${JSON.stringify(k.id).replace(/"/g,'&quot;')}, ${JSON.stringify(patName).replace(/"/g,'&quot;')}, ${JSON.stringify(dateStr).replace(/"/g,'&quot;')})" class="text-xs text-terracotta font-semibold hover:underline">Padam</button>` : ''}
      </td>
    </tr>`;
  }).join('');
}

async function deleteKob(id, patName, dateStr) {
  if (!confirm(`Padam sesi KOB untuk ${patName} (${dateStr})?\n\nTindakan ini tidak boleh dibatalkan.`)) return;
  try {
    const { error } = await window.db.from('psy_kob_sessions').delete().eq('id', id);
    if (error) throw error;
    banner('Sesi KOB dipadam');
    await loadAll();
  } catch (e) {
    banner('Ralat: ' + e.message, 'error');
  }
}

(async () => {
  const user = await initStaff('kob_list', 'Senarai sesi KOB');
  if (!user) return;
  await loadAll();
  restoreScrollPreserve();
})();
</script>
</body>
</html>
