<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Stock In History</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📥</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">
        <div class="text-xs text-ink/40">
          <span>Inventory</span> <span class="mx-1">›</span>
          <span class="text-ink/70 font-medium">Stock In History</span>
        </div>

        <div class="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h2 class="text-xl font-bold text-navy">Stock In History</h2>
            <p class="text-xs text-ink/50 mt-0.5">Semua rekod penerimaan stok — nota, batch/expiry &amp; dokumen lampiran.</p>
          </div>
          <button data-rbac="inventory.create" onclick="location.href='stock-in.html'"
            class="hidden bg-teal text-white text-sm px-5 py-2.5 rounded-xl font-semibold hover:bg-teal/90 transition-colors shadow-sm">
            + New Stock In
          </button>
        </div>

        <!-- Filter bar -->
        <div class="flex flex-wrap items-end gap-2">
          <div>
            <label class="text-[10px] font-bold text-ink/40 uppercase tracking-wide">Date Range</label>
            <div class="flex items-center gap-1 mt-1 bg-white border border-ink/20 rounded-xl px-2 py-1.5">
              <input id="si-date-from" type="date" onchange="renderList()" class="text-sm outline-none w-[124px]">
              <span class="text-ink/30 text-xs">–</span>
              <input id="si-date-to" type="date" onchange="renderList()" class="text-sm outline-none w-[124px]">
            </div>
          </div>
          <div>
            <label class="text-[10px] font-bold text-ink/40 uppercase tracking-wide">Status</label>
            <select id="si-filter-status" onchange="renderList()"
              class="block mt-1 px-3 py-2.5 border border-ink/20 rounded-xl text-sm bg-white focus:border-navy outline-none">
              <option value="">All Status</option>
              <option value="draft">Draft</option>
              <option value="posted">Posted</option>
            </select>
          </div>
          <div class="relative flex-1 min-w-48">
            <label class="text-[10px] font-bold text-ink/40 uppercase tracking-wide">&nbsp;</label>
            <div class="relative mt-1">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/40 text-sm">🔍</span>
              <input id="si-search" type="text" placeholder="Cari no. terima, lokasi, nota, item..."
                class="w-full pl-9 pr-3 py-2.5 border border-ink/20 rounded-xl text-sm focus:border-navy outline-none bg-white"
                oninput="renderList()">
            </div>
          </div>
        </div>

        <div class="min-w-0 space-y-3">
          <div class="flex items-center gap-2">
            <h3 class="font-bold text-sm text-ink">Senarai Stock In</h3>
            <span id="si-count-badge" class="text-[11px] font-semibold text-ink/50 bg-ink/8 px-2 py-0.5 rounded-full">0 rekod</span>
          </div>

          <div class="bg-white rounded-2xl border border-ink/10 overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead>
                  <tr class="bg-ink/[0.02] border-b border-ink/10 text-left">
                    <th class="px-4 py-3 text-[10px] font-bold text-ink/40 uppercase tracking-widest">Receive No.</th>
                    <th class="px-4 py-3 text-[10px] font-bold text-ink/40 uppercase tracking-widest">Tarikh</th>
                    <th class="px-4 py-3 text-[10px] font-bold text-ink/40 uppercase tracking-widest">Lokasi</th>
                    <th class="px-4 py-3 text-[10px] font-bold text-ink/40 uppercase tracking-widest">Nota</th>
                    <th class="px-4 py-3 text-center text-[10px] font-bold text-ink/40 uppercase tracking-widest">Item</th>
                    <th class="px-4 py-3 text-right text-[10px] font-bold text-ink/40 uppercase tracking-widest">Total (RM)</th>
                    <th class="px-4 py-3 text-[10px] font-bold text-ink/40 uppercase tracking-widest">Received By</th>
                    <th class="px-4 py-3 text-center text-[10px] font-bold text-ink/40 uppercase tracking-widest">Status</th>
                    <th class="px-4 py-3 text-center text-[10px] font-bold text-ink/40 uppercase tracking-widest">Actions</th>
                  </tr>
                </thead>
                <tbody id="si-tbody">
                  <tr><td colspan="9" class="text-center py-12 text-ink/40 text-sm italic">Memuatkan...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- Modal: detail Stock In -->
<div id="si-detail-modal" class="hidden fixed inset-0 bg-ink/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-y-auto shadow-xl">
    <div class="p-5 border-b border-ink/10 flex items-center justify-between sticky top-0 bg-white">
      <h3 class="font-bold text-ink">Detail Stock In <span id="si-detail-no" class="text-navy"></span></h3>
      <button onclick="closeDetailModal()" class="text-ink/40 hover:text-ink text-xl leading-none">&times;</button>
    </div>
    <div id="si-detail-body" class="p-5 space-y-4 text-sm"></div>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let allRecords = [];
let locationMap = {};

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function statusChipSI(s) {
  return s === 'posted'
    ? '<span class="chip bg-green-light text-green-dark">Posted</span>'
    : '<span class="chip bg-gold/30 text-gold-dark">Draft</span>';
}

async function loadLocations() {
  const { data } = await window.db.from('psy_inventory_locations').select('id,name');
  locationMap = {};
  (data || []).forEach(l => locationMap[l.id] = l.name);
}

async function loadRecords() {
  const { data, error } = await window.db.from('psy_stock_in_records')
    .select('id, receive_no, receive_date, location_id, status, remarks, total_cost, received_by_name, reference_type, reference_id, posted_at, created_at')
    .order('created_at', { ascending: false });
  if (error) { banner('Gagal muat rekod Stock In: ' + error.message, 'error'); return; }
  allRecords = data || [];

  // Jumlah item per rekod — satu query untuk semua, bukan N+1
  const ids = allRecords.map(r => r.id);
  if (ids.length) {
    const { data: items } = await window.db.from('psy_stock_in_items').select('stock_in_id').in('stock_in_id', ids);
    const counts = {};
    (items || []).forEach(it => counts[it.stock_in_id] = (counts[it.stock_in_id] || 0) + 1);
    allRecords.forEach(r => r._itemCount = counts[r.id] || 0);
  }
}

function renderList() {
  const from = document.getElementById('si-date-from').value;
  const to = document.getElementById('si-date-to').value;
  const status = document.getElementById('si-filter-status').value;
  const q = document.getElementById('si-search').value.trim().toLowerCase();

  let rows = allRecords.filter(r => {
    if (from && r.receive_date < from) return false;
    if (to && r.receive_date > to) return false;
    if (status && r.status !== status) return false;
    if (q) {
      const hay = [r.receive_no, locationMap[r.location_id], r.remarks, r.received_by_name].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('si-count-badge').textContent = `${rows.length} rekod`;
  const tbody = document.getElementById('si-tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="text-center py-12 text-ink/40 text-sm italic">Tiada rekod Stock In dijumpai.</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(r => `
    <tr class="border-b border-ink/5 hover:bg-ink/[0.015]">
      <td class="px-4 py-3 font-semibold text-navy">${escHtml(r.receive_no)}</td>
      <td class="px-4 py-3 text-ink/70">${r.receive_date ? new Date(r.receive_date).toLocaleDateString('ms-MY') : '—'}</td>
      <td class="px-4 py-3 text-ink/70">${escHtml(locationMap[r.location_id] || '—')}</td>
      <td class="px-4 py-3 text-ink/60 max-w-[220px] truncate" title="${escHtml(r.remarks || '')}">${r.remarks ? escHtml(r.remarks) : '<span class="italic text-ink/30">—</span>'}</td>
      <td class="px-4 py-3 text-center text-ink/70">${r._itemCount || 0}</td>
      <td class="px-4 py-3 text-right font-semibold text-ink">RM ${Number(r.total_cost || 0).toFixed(2)}</td>
      <td class="px-4 py-3 text-ink/70">${escHtml(r.received_by_name || '—')}</td>
      <td class="px-4 py-3 text-center">${statusChipSI(r.status)}</td>
      <td class="px-4 py-3 text-center">
        <button onclick="openDetailModal('${r.id}')" class="text-xs font-semibold text-navy hover:underline">👁 Lihat</button>
      </td>
    </tr>`).join('');
}
window.renderList = renderList;

async function openDetailModal(id) {
  const rec = allRecords.find(r => r.id === id);
  if (!rec) return;
  document.getElementById('si-detail-no').textContent = rec.receive_no;
  document.getElementById('si-detail-body').innerHTML = '<div class="text-center text-ink/40 py-6 text-sm italic">Memuatkan...</div>';
  document.getElementById('si-detail-modal').classList.remove('hidden');

  const [itemsRes, docsRes, refRes] = await Promise.all([
    window.db.from('psy_stock_in_items').select('*').eq('stock_in_id', id).order('created_at'),
    window.db.from('psy_stock_in_documents').select('*').eq('stock_in_id', id).order('created_at'),
    rec.reference_type === 'purchase_request' && rec.reference_id
      ? window.db.from('psy_inventory_requests').select('request_no').eq('id', rec.reference_id).maybeSingle()
      : Promise.resolve({ data: null }),
  ]);
  const items = itemsRes.data || [];
  const docs = docsRes.data || [];
  const refReq = refRes.data;

  // Pautan muat turun dokumen — signed URL (bucket peribadi)
  const docLinks = await Promise.all(docs.map(async d => {
    const { data } = await window.db.storage.from('stock-in-docs').createSignedUrl(d.file_path, 3600);
    return { ...d, url: data?.signedUrl || null };
  }));

  const itemsHtml = items.length
    ? `<table class="w-full text-xs">
        <thead><tr class="text-left text-ink/40 border-b border-ink/10">
          <th class="py-1.5 pr-2">Produk</th><th class="py-1.5 pr-2">Batch</th><th class="py-1.5 pr-2">Expiry</th>
          <th class="py-1.5 pr-2 text-right">Qty</th><th class="py-1.5 pr-2 text-right">Kos/Unit</th><th class="py-1.5 text-right">Subtotal</th>
        </tr></thead>
        <tbody>${items.map(it => `
          <tr class="border-b border-ink/5 last:border-0">
            <td class="py-1.5 pr-2 font-medium text-ink">${escHtml(it.item_name)}</td>
            <td class="py-1.5 pr-2 text-ink/60">${escHtml(it.batch_no || '—')}</td>
            <td class="py-1.5 pr-2 text-ink/60">${it.expiry_date ? new Date(it.expiry_date).toLocaleDateString('ms-MY') : '—'}</td>
            <td class="py-1.5 pr-2 text-right text-ink/70">${it.qty_received}</td>
            <td class="py-1.5 pr-2 text-right text-ink/70">RM ${Number(it.unit_cost || 0).toFixed(2)}</td>
            <td class="py-1.5 text-right font-semibold text-ink">RM ${Number(it.subtotal || 0).toFixed(2)}</td>
          </tr>`).join('')}</tbody>
      </table>`
    : '<p class="text-ink/40 italic text-xs">Tiada item direkod.</p>';

  const docsHtml = docLinks.length
    ? docLinks.map(d => `
        <div class="flex items-center justify-between px-3 py-2 bg-cream/60 rounded-lg text-xs">
          <span class="truncate">📄 ${escHtml(d.file_name)} <span class="text-ink/40">(${d.file_size ? Math.round(d.file_size / 1024) + ' KB' : '—'})</span></span>
          ${d.url ? `<a href="${d.url}" target="_blank" class="text-navy font-semibold hover:underline flex-shrink-0 ml-2">⬇ Muat Turun</a>` : '<span class="text-ink/30 flex-shrink-0 ml-2">Tiada akses</span>'}
        </div>`).join('')
    : '<p class="text-ink/40 italic text-xs">Tiada dokumen dilampirkan.</p>';

  document.getElementById('si-detail-body').innerHTML = `
    <div class="grid grid-cols-2 gap-3 text-xs">
      <div><span class="text-ink/40">Tarikh Terima</span><br><span class="font-semibold text-ink">${rec.receive_date ? new Date(rec.receive_date).toLocaleDateString('ms-MY') : '—'}</span></div>
      <div><span class="text-ink/40">Lokasi</span><br><span class="font-semibold text-ink">${escHtml(locationMap[rec.location_id] || '—')}</span></div>
      <div><span class="text-ink/40">Status</span><br>${statusChipSI(rec.status)}</div>
      <div><span class="text-ink/40">Received By</span><br><span class="font-semibold text-ink">${escHtml(rec.received_by_name || '—')}</span></div>
      ${refReq ? `<div class="col-span-2"><span class="text-ink/40">Rujukan Purchase Request</span><br><a href="purchase-request-detail.html?id=${rec.reference_id}" class="font-semibold text-navy hover:underline">${escHtml(refReq.request_no)}</a></div>` : ''}
    </div>
    <div>
      <div class="text-[11px] font-bold text-ink/50 uppercase tracking-wide mb-1">🩺 Nota / Remarks</div>
      <div class="text-sm text-ink/80 bg-cream/40 rounded-lg p-3">${rec.remarks ? escHtml(rec.remarks).replace(/\n/g, '<br>') : '<span class="italic text-ink/40">Tiada nota</span>'}</div>
    </div>
    <div>
      <div class="text-[11px] font-bold text-ink/50 uppercase tracking-wide mb-2">📦 Item Diterima</div>
      ${itemsHtml}
    </div>
    <div>
      <div class="text-[11px] font-bold text-ink/50 uppercase tracking-wide mb-2">📎 Dokumen Lampiran</div>
      <div class="space-y-1.5">${docsHtml}</div>
    </div>
    <div class="flex justify-between pt-2 border-t border-ink/10 text-sm">
      <span class="text-ink/50">Grand Total</span>
      <span class="font-bold text-navy text-lg">RM ${Number(rec.total_cost || 0).toFixed(2)}</span>
    </div>`;
}
window.openDetailModal = openDetailModal;

function closeDetailModal() {
  document.getElementById('si-detail-modal').classList.add('hidden');
}
window.closeDetailModal = closeDetailModal;

(async () => {
  const user = await initStaff('stock_in_list', 'Stock In History', 'inventory');
  if (!user) return;
  await loadLocations();
  await loadRecords();
  renderList();
})();
</script>
</body>
</html>
