<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Cuti Konsultasi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📅</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <div class="bg-navy-light/50 border border-navy/20 rounded-xl p-4 text-sm text-navy">
          📌 Tarikh di sini akan <strong>auto-lock</strong> dalam kalendar tempahan. Pesakit dan staff tidak boleh book sesi pada tarikh ini.
        </div>

        <div class="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h3 class="font-bold text-lg">Senarai Cuti Konsultasi</h3>
            <p class="text-xs text-ink/50 mt-0.5">Hari Raya · cuti umum · hari konsultasi tutup</p>
          </div>
          <button onclick="openModal()" class="bg-navy text-white text-sm px-4 py-2.5 rounded-xl font-semibold hover:bg-navy-dark">+ Tambah Tarikh Cuti</button>
        </div>

        <!-- Filter -->
        <div class="flex gap-2 flex-wrap">
          <button onclick="setFilter('upcoming')" id="f-upcoming" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-navy text-white">Akan Datang</button>
          <button onclick="setFilter('all')" id="f-all" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-ink/15">Semua</button>
          <button onclick="setFilter('past')" id="f-past" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-ink/15">Yang Lepas</button>
        </div>

        <div class="bg-white rounded-xl border border-ink/10 overflow-x-auto">
          <table class="data">
            <thead>
              <tr>
                <th>Tarikh</th>
                <th>Hari</th>
                <th>Label</th>
                <th>Kategori</th>
                <th>Nota</th>
                <th class="text-right">Tindakan</th>
              </tr>
            </thead>
            <tbody id="closures-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal -->
<div id="closure-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" onclick="closeModal()"></div>
  <div class="relative bg-white rounded-2xl max-w-md w-full p-6">
    <h3 id="modal-title" class="font-bold text-lg mb-4">Tambah Tarikh Cuti</h3>
    <input type="hidden" id="cl-id">
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-semibold mb-1">Tarikh *</label>
        <input id="cl-date" type="date" class="w-full px-3 py-2 border border-ink/15 rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Label *</label>
        <input id="cl-label" type="text" placeholder="cth: Hari Raya Aidilfitri" class="w-full px-3 py-2 border border-ink/15 rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Kategori</label>
        <select id="cl-category" class="w-full px-3 py-2 border border-ink/15 rounded-lg text-sm">
          <option value="public_holiday">Cuti Umum</option>
          <option value="hari_raya">Hari Raya</option>
          <option value="clinic_closed">Konsultasi Tutup</option>
          <option value="training">Training Staff</option>
          <option value="other">Lain-lain</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Nota</label>
        <textarea id="cl-notes" rows="2" class="w-full px-3 py-2 border border-ink/15 rounded-lg text-sm" placeholder="Optional"></textarea>
      </div>
      <p id="cl-error" class="text-xs text-terracotta hidden"></p>
    </div>
    <div class="flex gap-2 mt-5">
      <button onclick="closeModal()" class="flex-1 px-4 py-2.5 border border-ink/20 rounded-lg text-sm font-semibold">Batal</button>
      <button onclick="saveClosure()" id="btn-save" class="flex-1 bg-navy text-white px-4 py-2.5 rounded-lg text-sm font-semibold hover:bg-navy-dark">Simpan</button>
    </div>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/utils.js"></script>
<script src="_shared.js"></script>
<script>
let allClosures = [];
let filterMode = 'upcoming';

const CATEGORY_LABEL = {
  public_holiday: { label: 'Cuti Umum',     cls: 'bg-navy-light text-navy' },
  hari_raya:      { label: 'Hari Raya',     cls: 'bg-green-light text-green-dark' },
  clinic_closed:  { label: 'Konsultasi Tutup',  cls: 'bg-terracotta/15 text-terracotta' },
  training:       { label: 'Training',      cls: 'bg-gold/20 text-gold-dark' },
  other:          { label: 'Lain-lain',     cls: 'bg-ink/10 text-ink/60' },
};

function setFilter(mode) {
  filterMode = mode;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('bg-navy', 'text-white');
    b.classList.add('bg-white', 'border', 'border-ink/15');
  });
  const active = document.getElementById('f-' + mode);
  if (active) {
    active.classList.add('bg-navy', 'text-white');
    active.classList.remove('bg-white', 'border', 'border-ink/15');
  }
  render();
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function loadAll() {
  const { data, error } = await window.db.from('psy_clinic_closures')
    .select('*').order('closure_date', { ascending: true });
  if (error) { banner('Gagal load: ' + error.message, 'error'); return; }
  allClosures = data || [];
  render();
}

function render() {
  const today = todayStr();
  let list = allClosures;
  if (filterMode === 'upcoming') list = list.filter(c => c.closure_date >= today);
  else if (filterMode === 'past') list = list.filter(c => c.closure_date < today);

  const body = document.getElementById('closures-body');
  if (!list.length) {
    body.innerHTML = '<tr><td colspan="6" class="text-center text-ink/40 py-8">Tiada rekod</td></tr>';
    return;
  }

  body.innerHTML = list.map(c => {
    const cat = CATEGORY_LABEL[c.category] || CATEGORY_LABEL.other;
    const d = new Date(c.closure_date + 'T00:00:00');
    const dayName = d.toLocaleDateString('ms-MY', { weekday: 'long' });
    const dateLabel = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    return `<tr>
      <td class="font-semibold whitespace-nowrap">${escapeHtml(dateLabel)}</td>
      <td class="text-xs text-ink/60">${escapeHtml(dayName)}</td>
      <td>${escapeHtml(c.label)}</td>
      <td><span class="chip ${cat.cls}">${cat.label}</span></td>
      <td class="text-xs text-ink/60 max-w-xs">${escapeHtml(c.notes || '—')}</td>
      <td class="text-right whitespace-nowrap">
        <button onclick="editClosure('${c.id}')" class="text-xs text-navy font-semibold hover:underline mr-3">Edit</button>
        <button onclick="deleteClosure('${c.id}')" class="text-xs text-terracotta font-semibold hover:underline">Padam</button>
      </td>
    </tr>`;
  }).join('');
}

function openModal() {
  document.getElementById('modal-title').textContent = 'Tambah Tarikh Cuti';
  document.getElementById('cl-id').value = '';
  document.getElementById('cl-date').value = '';
  document.getElementById('cl-label').value = '';
  document.getElementById('cl-category').value = 'public_holiday';
  document.getElementById('cl-notes').value = '';
  document.getElementById('cl-error').classList.add('hidden');
  document.getElementById('closure-modal').classList.remove('hidden');
  document.getElementById('closure-modal').classList.add('flex');
}

function closeModal() {
  document.getElementById('closure-modal').classList.add('hidden');
  document.getElementById('closure-modal').classList.remove('flex');
}

function editClosure(id) {
  const c = allClosures.find(x => x.id === id);
  if (!c) return;
  document.getElementById('modal-title').textContent = 'Edit Tarikh Cuti';
  document.getElementById('cl-id').value = c.id;
  document.getElementById('cl-date').value = c.closure_date;
  document.getElementById('cl-label').value = c.label;
  document.getElementById('cl-category').value = c.category;
  document.getElementById('cl-notes').value = c.notes || '';
  document.getElementById('cl-error').classList.add('hidden');
  document.getElementById('closure-modal').classList.remove('hidden');
  document.getElementById('closure-modal').classList.add('flex');
}

async function saveClosure() {
  const id = document.getElementById('cl-id').value;
  const date = document.getElementById('cl-date').value;
  const label = document.getElementById('cl-label').value.trim();
  const category = document.getElementById('cl-category').value;
  const notes = document.getElementById('cl-notes').value.trim() || null;
  const errEl = document.getElementById('cl-error');

  if (!date) { errEl.textContent = 'Tarikh diperlukan'; errEl.classList.remove('hidden'); return; }
  if (!label) { errEl.textContent = 'Label diperlukan'; errEl.classList.remove('hidden'); return; }

  const payload = {
    closure_date: date, label, category, notes,
    updated_at: new Date().toISOString(),
  };

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    let error;
    if (id) {
      ({ error } = await window.db.from('psy_clinic_closures').update(payload).eq('id', id));
    } else {
      ({ error } = await window.db.from('psy_clinic_closures').insert({
        ...payload, created_by: window.currentUser.id,
      }));
    }
    if (error) throw error;
    await auditLog(id ? 'closure.updated' : 'closure.created', date, { label, category });
    banner(id ? 'Cuti dikemaskini' : 'Cuti ditambah');
    closeModal();
    await loadAll();
  } catch (e) {
    errEl.textContent = e.message.includes('duplicate') ? 'Tarikh ini sudah ada dalam senarai' : e.message;
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan';
  }
}

async function deleteClosure(id) {
  const c = allClosures.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`Padam tarikh cuti "${c.label}" pada ${c.closure_date}?`)) return;
  const { error } = await window.db.from('psy_clinic_closures').delete().eq('id', id);
  if (error) { banner('Gagal: ' + error.message, 'error'); return; }
  await auditLog('closure.deleted', c.closure_date, { label: c.label });
  banner('Tarikh cuti dipadam');
  await loadAll();
}

(async () => {
  const user = await initStaff('closures', 'Cuti Konsultasi & Hari Raya');
  if (!user) return;
  setHeaderBack('dashboard.html', 'Kembali ke Dashboard');
  await loadAll();
})();
</script>
</body>
</html>
