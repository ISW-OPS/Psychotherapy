<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Kategori KB</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.kb-card{background:#fff;border:1px solid rgba(60,79,92,.10);border-radius:1rem;}
.kb-catcard{transition:all .15s;}
.kb-catcard:hover{border-color:var(--rpm);box-shadow:0 4px 14px rgba(15,46,95,.08);}
.kb-subrow{transition:background .12s;}
.kb-subrow:hover{background:rgba(60,79,92,.04);}
</style>
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📖</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
<div class="flex min-h-screen">
<aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
<main class="main-content flex-1 min-w-0">
<header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

<div class="p-4 md:p-8 space-y-6">
  <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-ink">Knowledge Base</h1>
      <p class="text-sm text-ink/55 mt-1">Layari sumber mengikut kategori untuk cari dengan pantas.</p>
    </div>
    <div class="flex items-center gap-2 w-full lg:w-auto">
      <div class="relative flex-1 lg:w-80">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/40">🔍</span>
        <input id="cat-search" type="text" placeholder="Cari dokumen, topik atau kata kunci..."
          class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-ink/15 text-sm focus:outline-none focus:border-navy/40 bg-white">
      </div>
      <button id="btn-new" data-rbac="kb.create" class="hidden whitespace-nowrap bg-navy text-white px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-navy-dark">+ Kategori Baru</button>
    </div>
  </div>

  <div id="cat-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4">
    <div class="col-span-full text-center text-xs text-ink/35 py-10">Memuatkan...</div>
  </div>

  <!-- Ringkasan statistik (bawah grid, tak ganggu reka letak kad rujukan) -->
  <div class="kb-card p-5">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-semibold text-sm text-ink">Statistik Kategori</h3>
      <span id="cat-total" class="text-lg font-bold text-navy"></span>
    </div>
    <div id="cat-stats" class="grid grid-cols-1 sm:grid-cols-2 gap-x-8"></div>
  </div>
</div>
</main>
</div>
</div>

<!-- Modal kategori -->
<div id="cat-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4 overflow-y-auto">
  <div class="kb-card w-full max-w-lg p-6 my-8">
    <h3 id="modal-title" class="font-bold text-ink text-lg mb-4">Kategori Baru</h3>
    <input type="hidden" id="m-id">
    <div class="space-y-3">
      <div><label class="text-xs font-semibold text-ink">Nama</label>
        <input id="m-name" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm"></div>
      <div><label class="text-xs font-semibold text-ink">Penerangan</label>
        <textarea id="m-desc" rows="2" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm"></textarea></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs font-semibold text-ink">Ikon (emoji)</label>
          <input id="m-icon" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm" value="📁"></div>
        <div><label class="text-xs font-semibold text-ink">Warna</label>
          <select id="m-color" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
            <option value="navy">Navy</option><option value="green">Hijau</option><option value="gold">Emas</option>
            <option value="terracotta">Terracotta</option><option value="teal">Teal</option>
            <option value="purple">Ungu</option><option value="blue">Biru</option><option value="grey">Kelabu</option>
          </select></div>
      </div>
    </div>

    <!-- Subkategori (hanya bila edit kategori sedia ada) -->
    <div id="m-subcat-box" class="hidden border-t border-ink/8 mt-4 pt-4">
      <label class="text-xs font-semibold text-ink mb-2 block">Subkategori Utama</label>
      <div id="m-subcat-list" class="flex flex-wrap gap-1.5 mb-2"></div>
      <div class="flex gap-2">
        <input id="m-subcat-icon" class="w-14 px-2 py-2 border border-ink/15 rounded-lg text-sm text-center" value="📄" maxlength="2">
        <input id="m-subcat-name" class="flex-1 px-3 py-2 border border-ink/15 rounded-lg text-sm" placeholder="Nama subkategori baharu...">
        <button id="m-subcat-add" class="px-3 py-2 rounded-lg text-sm font-semibold bg-navy-light text-navy hover:bg-navy/15">+ Tambah</button>
      </div>
    </div>

    <div class="flex justify-between items-center gap-2 mt-5">
      <button id="m-delete" data-rbac="kb.delete" class="hidden px-4 py-2 rounded-lg text-sm font-semibold border border-terracotta/30 text-terracotta hover:bg-terracotta/5">Padam</button>
      <div class="flex justify-end gap-2 ml-auto">
        <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-semibold border border-ink/15 text-ink/70">Batal</button>
        <button id="m-save" data-rbac="kb.edit" class="px-4 py-2 rounded-lg text-sm font-semibold bg-navy text-white">Simpan</button>
      </div>
    </div>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script src="_kb.js"></script>
<script>
let CATS = [], COUNTS = {}, SUBCATS = [], SUBCOUNTS = {}, MODAL_SUBCATS = [];
let searchTerm = '';

function catMatchesSearch(c, subs) {
  if (!searchTerm) return true;
  const q = searchTerm;
  if ((c.name || '').toLowerCase().includes(q)) return true;
  if ((c.description || '').toLowerCase().includes(q)) return true;
  return subs.some(s => (s.name || '').toLowerCase().includes(q));
}

function render() {
  const total = Object.values(COUNTS).reduce((a, b) => a + b, 0);
  const canEdit = kbCanAuthor();

  const visible = CATS.map(c => ({ cat: c, subs: SUBCATS.filter(s => s.category_id === c.id) }))
    .filter(x => catMatchesSearch(x.cat, x.subs));

  document.getElementById('cat-grid').innerHTML = visible.length ? visible.map(({ cat: c, subs }) => `
    <div class="kb-catcard kb-card p-5 flex flex-col">
      <div class="flex items-start justify-between">
        <div class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl ${kbCatCls(c.color)}">${c.icon || '📁'}</div>
        ${canEdit ? `<button data-rbac="kb.edit" onclick="editCat('${c.id}')" class="text-ink/40 hover:text-ink px-1">⋮</button>` : ''}
      </div>
      <h3 class="font-semibold text-ink mt-3">${kbEsc(c.name)}</h3>
      <div class="text-[11px] text-ink/50 mb-1">${COUNTS[c.id] || 0} dokumen</div>
      <p class="text-xs text-ink/55 leading-snug">${kbEsc(c.description || '')}</p>

      ${subs.length ? `
      <div class="mt-3 pt-3 border-t border-ink/8">
        <div class="text-[10px] font-semibold text-ink/45 uppercase tracking-wide mb-1.5">Subkategori utama:</div>
        <ul class="space-y-1">
          ${subs.slice(0, 6).map(s => `
            <li><a href="kb-resources.html?cat=${c.id}&subcat=${s.id}" class="kb-subrow flex items-center gap-1.5 text-xs text-ink/70 no-underline rounded px-1 py-0.5 -mx-1">
              <span>${s.icon || '📄'}</span><span class="truncate">${kbEsc(s.name)}</span>
              ${SUBCOUNTS[s.id] ? `<span class="ml-auto text-[10px] text-ink/35">${SUBCOUNTS[s.id]}</span>` : ''}
            </a></li>`).join('')}
        </ul>
      </div>` : ''}

      <a href="kb-resources.html?cat=${c.id}" class="inline-flex items-center gap-1 mt-auto pt-3 text-xs font-semibold text-navy hover:underline">Lihat →</a>
    </div>`).join('')
    : `<div class="col-span-full text-center text-xs text-ink/35 py-10">${searchTerm ? 'Tiada kategori atau subkategori sepadan.' : 'Tiada kategori.'}</div>`;

  document.getElementById('cat-total').textContent = total;
  const sorted = [...CATS].sort((a, b) => (COUNTS[b.id] || 0) - (COUNTS[a.id] || 0));
  document.getElementById('cat-stats').innerHTML = sorted.map(c => {
    const pct = total ? Math.round((COUNTS[c.id] || 0) / total * 100) : 0;
    return `<div class="mb-2"><div class="flex justify-between text-[11px] mb-0.5"><span class="text-ink/70">${c.icon || ''} ${kbEsc(c.name)}</span><span class="text-ink/50">${COUNTS[c.id] || 0} (${pct}%)</span></div>
      <div class="h-2 rounded-full bg-ink/10 overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:var(--rpm)"></div></div></div>`;
  }).join('');
}

window.editCat = id => { const c = CATS.find(x => x.id === id); openModal(c); };

function renderModalSubcats() {
  const box = document.getElementById('m-subcat-list');
  box.innerHTML = MODAL_SUBCATS.length ? MODAL_SUBCATS.map(s => `
    <span class="inline-flex items-center gap-1 pl-2 pr-1 py-1 rounded-full text-[11px] font-medium bg-ink/5 text-ink/70">
      ${s.icon || '📄'} ${kbEsc(s.name)}
      <button type="button" onclick="removeModalSubcat('${s.id}')" class="w-4 h-4 rounded-full hover:bg-ink/15 flex items-center justify-center text-ink/50">×</button>
    </span>`).join('') : '<span class="text-[11px] text-ink/40">Belum ada subkategori.</span>';
}

window.removeModalSubcat = async function (id) {
  if (!confirm('Padam subkategori ini? Dokumen yang dipaut akan jadi "Tiada Subkategori".')) return;
  try {
    await dbDelete('psy_kb_subcategories', id);
    MODAL_SUBCATS = MODAL_SUBCATS.filter(s => s.id !== id);
    renderModalSubcats();
    SUBCATS = await kbSubcategories().catch(() => []);
  } catch (_) { banner('Gagal padam subkategori', 'error'); }
};

async function addModalSubcat() {
  const catId = document.getElementById('m-id').value;
  if (!catId) return banner('Simpan kategori dahulu sebelum tambah subkategori.', 'error');
  const name = document.getElementById('m-subcat-name').value.trim();
  if (!name) return;
  const icon = document.getElementById('m-subcat-icon').value.trim() || '📄';
  try {
    const slug = name.toLowerCase().replace(/[^\w]+/g, '-') + '-' + Date.now().toString(36);
    const row = await dbInsert('psy_kb_subcategories', { category_id: catId, name, icon, slug, sort_order: (MODAL_SUBCATS.length + 1) * 10 });
    MODAL_SUBCATS.push(row);
    document.getElementById('m-subcat-name').value = '';
    renderModalSubcats();
    SUBCATS = await kbSubcategories().catch(() => []);
  } catch (_) { banner('Gagal tambah subkategori', 'error'); }
}

function openModal(c) {
  document.getElementById('modal-title').textContent = c ? 'Edit Kategori' : 'Kategori Baru';
  document.getElementById('m-id').value = c?.id || '';
  document.getElementById('m-name').value = c?.name || '';
  document.getElementById('m-desc').value = c?.description || '';
  document.getElementById('m-icon').value = c?.icon || '📁';
  document.getElementById('m-color').value = c?.color || 'navy';
  document.getElementById('m-delete').classList.toggle('hidden', !c);
  document.getElementById('m-subcat-box').classList.toggle('hidden', !c);
  MODAL_SUBCATS = c ? SUBCATS.filter(s => s.category_id === c.id) : [];
  if (c) renderModalSubcats();
  document.getElementById('cat-modal').classList.remove('hidden');
}
window.closeModal = () => document.getElementById('cat-modal').classList.add('hidden');

async function deleteCat() {
  const id = document.getElementById('m-id').value;
  if (!id) return;
  const name = document.getElementById('m-name').value.trim();
  const docCount = COUNTS[id] || 0;
  const msg = docCount
    ? `Padam kategori "${name}"? ${docCount} dokumen dalam kategori ni akan jadi "Tiada Kategori" — dokumen itu sendiri TIDAK dipadam.`
    : `Padam kategori "${name}"?`;
  if (!confirm(msg)) return;
  try {
    await dbDelete('psy_kb_categories', id);
    closeModal(); banner('Kategori dipadam.');
    [CATS, COUNTS, SUBCATS] = await Promise.all([kbCategories().catch(() => []), kbCategoryCounts().catch(() => ({})), kbSubcategories().catch(() => [])]);
    render();
  } catch (_) { banner('Gagal padam', 'error'); }
}

async function saveCat() {
  const id = document.getElementById('m-id').value;
  const name = document.getElementById('m-name').value.trim();
  if (!name) return banner('Sila masukkan nama.', 'error');
  const row = {
    name, description: document.getElementById('m-desc').value.trim(),
    icon: document.getElementById('m-icon').value.trim() || '📁',
    color: document.getElementById('m-color').value,
  };
  try {
    if (id) { await dbUpdate('psy_kb_categories', id, row); }
    else {
      row.slug = name.toLowerCase().replace(/[^\w]+/g, '-') + '-' + Date.now().toString(36);
      const created = await dbInsert('psy_kb_categories', row);
      document.getElementById('m-id').value = created.id;
    }
    banner('Disimpan.');
    CATS = await kbCategories();
    if (!id) { openModal(CATS.find(c => c.id === document.getElementById('m-id').value)); }
    render();
  } catch (_) { banner('Gagal simpan', 'error'); }
}

async function boot() {
  const u = await initStaff('kb', 'Knowledge Base');
  if (!u) return;
  if (kbCanAuthor()) {
    document.getElementById('btn-new').classList.remove('hidden');
    document.getElementById('btn-new').onclick = () => openModal(null);
  }
  document.getElementById('m-save').onclick = saveCat;
  document.getElementById('m-delete').onclick = deleteCat;
  document.getElementById('m-subcat-add').onclick = addModalSubcat;
  document.getElementById('m-subcat-name').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addModalSubcat(); } });

  const s = document.getElementById('cat-search');
  s.addEventListener('input', e => { searchTerm = e.target.value.trim().toLowerCase(); render(); });
  s.addEventListener('keydown', e => {
    if (e.key === 'Enter' && s.value.trim()) location.href = 'kb-resources.html?q=' + encodeURIComponent(s.value.trim());
  });

  [CATS, COUNTS, SUBCATS, SUBCOUNTS] = await Promise.all([
    kbCategories().catch(() => []),
    kbCategoryCounts().catch(() => ({})),
    kbSubcategories().catch(() => []),
    kbSubcategoryCounts().catch(() => ({})),
  ]);
  render();
}
boot();
</script>
</body>
</html>
