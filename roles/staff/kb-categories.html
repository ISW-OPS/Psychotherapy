<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Kategori KB</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.kb-card{background:#fff;border:1px solid rgba(60,79,92,.10);border-radius:1rem;}
.kb-catcard{transition:all .15s;}
.kb-catcard:hover{border-color:var(--rpm);box-shadow:0 4px 14px rgba(15,46,95,.08);}
</style>
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📖</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
<div class="flex min-h-screen">
<aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
<main class="main-content flex-1 min-w-0">
<header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

<div class="p-4 md:p-8 space-y-5">
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold text-ink">Knowledge Base</h1>
      <p class="text-sm text-ink/55 mt-1">Layari sumber mengikut kategori untuk cari dengan pantas.</p>
    </div>
    <button id="btn-new" data-rbac="kb.create" class="hidden self-start md:self-auto bg-navy text-white px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-navy-dark">+ Kategori Baru</button>
  </div>

  <div class="grid grid-cols-1 xl:grid-cols-[1fr_320px] gap-6 items-start">
    <div id="cat-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full text-center text-xs text-ink/35 py-10">Memuatkan...</div>
    </div>

    <div class="space-y-5">
      <div class="kb-card p-5">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold text-sm text-ink">Semua Kategori</h3>
          <span id="cat-total" class="text-lg font-bold text-navy"></span>
        </div>
        <div id="cat-list" class="space-y-1"></div>
      </div>
      <div class="kb-card p-5">
        <h3 class="font-semibold text-sm text-ink mb-3">Statistik Kategori</h3>
        <div id="cat-stats"></div>
      </div>
    </div>
  </div>
</div>
</main>
</div>
</div>

<!-- Modal -->
<div id="cat-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
  <div class="kb-card w-full max-w-md p-6">
    <h3 id="modal-title" class="font-bold text-ink text-lg mb-4">Kategori Baru</h3>
    <input type="hidden" id="m-id">
    <div class="space-y-3">
      <div><label class="text-xs font-semibold text-ink">Nama</label>
        <input id="m-name" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm"></div>
      <div><label class="text-xs font-semibold text-ink">Penerangan</label>
        <textarea id="m-desc" rows="2" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm"></textarea></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs font-semibold text-ink">Ikon (emoji)</label>
          <input id="m-icon" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm" value="📁"></div>
        <div><label class="text-xs font-semibold text-ink">Warna</label>
          <select id="m-color" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
            <option value="navy">Navy</option><option value="green">Hijau</option><option value="gold">Emas</option>
            <option value="terracotta">Terracotta</option><option value="teal">Teal</option><option value="grey">Kelabu</option>
          </select></div>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-semibold border border-ink/15 text-ink/70">Batal</button>
      <button id="m-save" data-rbac="kb.edit" class="px-4 py-2 rounded-lg text-sm font-semibold bg-navy text-white">Simpan</button>
    </div>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script src="_kb.js"></script>
<script>
let CATS = [], COUNTS = {};

function render() {
  const total = Object.values(COUNTS).reduce((a, b) => a + b, 0);
  const canEdit = kbCanAuthor();

  document.getElementById('cat-grid').innerHTML = CATS.length ? CATS.map(c => `
    <div class="kb-catcard kb-card p-5">
      <div class="flex items-start justify-between">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center text-xl ${kbCatCls(c.color)}">${c.icon || '📁'}</div>
        ${canEdit ? `<button data-rbac="kb.edit" onclick="editCat('${c.id}')" class="text-ink/40 hover:text-ink px-1">⋮</button>` : ''}
      </div>
      <h3 class="font-semibold text-ink mt-3">${kbEsc(c.name)}</h3>
      <div class="text-[11px] text-ink/50 mb-1">${COUNTS[c.id] || 0} dokumen</div>
      <p class="text-xs text-ink/55 leading-snug min-h-[32px]">${kbEsc(c.description || '')}</p>
      <a href="kb-resources.html?cat=${c.id}" class="inline-flex items-center gap-1 mt-3 text-xs font-semibold text-navy hover:underline">Lihat →</a>
    </div>`).join('')
    : '<div class="col-span-full text-center text-xs text-ink/35 py-10">Tiada kategori.</div>';

  document.getElementById('cat-total').textContent = CATS.length;
  document.getElementById('cat-list').innerHTML = CATS.map(c => `
    <div class="flex items-center gap-2.5 py-1.5">
      <span class="w-6 h-6 rounded-md flex items-center justify-center text-xs ${kbCatCls(c.color)}">${c.icon || '📁'}</span>
      <span class="text-[13px] text-ink flex-1 truncate">${kbEsc(c.name)}</span>
      <span class="text-xs font-semibold text-ink/50">${COUNTS[c.id] || 0}</span>
    </div>`).join('');

  // stats bars
  const sorted = [...CATS].sort((a, b) => (COUNTS[b.id] || 0) - (COUNTS[a.id] || 0)).slice(0, 6);
  document.getElementById('cat-stats').innerHTML = `
    <div class="text-center mb-3"><div class="text-3xl font-bold text-navy">${total}</div><div class="text-[11px] text-ink/50">Jumlah Dokumen</div></div>
    ${sorted.map(c => {
      const pct = total ? Math.round((COUNTS[c.id] || 0) / total * 100) : 0;
      return `<div class="mb-2"><div class="flex justify-between text-[11px] mb-0.5"><span class="text-ink/70">${kbEsc(c.name)}</span><span class="text-ink/50">${pct}%</span></div>
        <div class="h-2 rounded-full bg-ink/10 overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:var(--rpm)"></div></div></div>`;
    }).join('')}`;
}

window.editCat = id => { const c = CATS.find(x => x.id === id); openModal(c); };

function openModal(c) {
  document.getElementById('modal-title').textContent = c ? 'Edit Kategori' : 'Kategori Baru';
  document.getElementById('m-id').value = c?.id || '';
  document.getElementById('m-name').value = c?.name || '';
  document.getElementById('m-desc').value = c?.description || '';
  document.getElementById('m-icon').value = c?.icon || '📁';
  document.getElementById('m-color').value = c?.color || 'navy';
  document.getElementById('cat-modal').classList.remove('hidden');
}
window.closeModal = () => document.getElementById('cat-modal').classList.add('hidden');

async function saveCat() {
  const id = document.getElementById('m-id').value;
  const name = document.getElementById('m-name').value.trim();
  if (!name) return banner('Sila masukkan nama.', 'error');
  const row = {
    name, description: document.getElementById('m-desc').value.trim(),
    icon: document.getElementById('m-icon').value.trim() || '📁',
    color: document.getElementById('m-color').value,
  };
  try {
    if (id) { await dbUpdate('psy_kb_categories', id, row); }
    else { row.slug = name.toLowerCase().replace(/[^\w]+/g, '-') + '-' + Date.now().toString(36); await dbInsert('psy_kb_categories', row); }
    closeModal(); banner('Disimpan.');
    CATS = await kbCategories(); render();
  } catch (_) { banner('Gagal simpan', 'error'); }
}

async function boot() {
  const u = await initStaff('kb', 'Knowledge Base');
  if (!u) return;
  if (kbCanAuthor()) {
    document.getElementById('btn-new').classList.remove('hidden');
    document.getElementById('btn-new').onclick = () => openModal(null);
  }
  document.getElementById('m-save').onclick = saveCat;
  [CATS, COUNTS] = await Promise.all([kbCategories().catch(() => []), kbCategoryCounts().catch(() => ({}))]);
  render();
}
boot();
</script>
</body>
</html>
