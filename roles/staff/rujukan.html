<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Rujukan Pesakit</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🔀</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-4">

        <div class="flex items-start justify-between gap-3 flex-wrap">
          <div>
            <h1 class="text-xl font-bold text-ink flex items-center gap-2">🔀 Rujukan Pesakit</h1>
            <p class="text-sm text-ink/45 mt-0.5">Senarai rujukan pesakit kepada doctor / coach / manager.</p>
          </div>
          <select id="ref-scope" onchange="renderReferrals()" class="border border-ink/15 rounded-lg px-3 py-2 text-sm bg-white outline-none">
            <option value="me">Untuk Saya</option>
            <option value="sent">Saya Hantar</option>
            <option value="all">Semua</option>
          </select>
        </div>

        <!-- Status tabs -->
        <div class="flex items-center gap-1 border-b border-ink/10 overflow-x-auto">
          <button data-st="" onclick="setStatusTab('')" class="st-tab px-4 py-2.5 text-sm font-semibold whitespace-nowrap border-b-2 border-navy text-navy">Semua <span class="st-count text-[10px] opacity-70"></span></button>
          <button data-st="pending" onclick="setStatusTab('pending')" class="st-tab px-4 py-2.5 text-sm font-semibold whitespace-nowrap border-b-2 border-transparent text-ink/55 hover:text-ink">Pending <span class="st-count text-[10px] opacity-70"></span></button>
          <button data-st="resolved" onclick="setStatusTab('resolved')" class="st-tab px-4 py-2.5 text-sm font-semibold whitespace-nowrap border-b-2 border-transparent text-ink/55 hover:text-ink">Selesai <span class="st-count text-[10px] opacity-70"></span></button>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <input id="ref-search" oninput="renderReferrals()" type="text" placeholder="🔍 Cari pesakit atau sebab…" class="flex-1 min-w-[200px] border border-ink/15 rounded-lg px-3 py-2 text-sm bg-white outline-none focus:border-navy">
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-ink/8 bg-ink/[0.015] text-[10px] uppercase tracking-wider text-ink/45">
                <th class="text-left px-5 py-3">Pesakit</th>
                <th class="text-left px-3 py-3">Sebab Rujukan</th>
                <th class="text-left px-3 py-3 w-28">Priori</th>
                <th class="text-left px-3 py-3 w-40">Tarikh Rujukan</th>
                <th class="text-left px-3 py-3 w-28">Status</th>
                <th class="text-right px-5 py-3 w-60">Tindakan</th>
              </tr>
            </thead>
            <tbody id="ref-tbody" class="divide-y divide-ink/5"></tbody>
          </table>
          <div id="ref-empty" class="hidden py-16 text-center text-sm text-ink/40">Tiada rujukan.</div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/utils.js"></script>
<script src="_shared.js"></script>
<script>
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDT(d){ if(!d) return '—'; const x=new Date(d); return `${x.toLocaleDateString('ms-MY',{day:'2-digit',month:'short',year:'numeric'})}<br><span class="text-[11px] text-ink/40">${x.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span>`; }

const ROLE_LBL   = { doctor:'🩺 Doctor', coach:'🧑‍🏫 Coach', manager:'🧑‍💼 Manager' };
const STATUS_MAP = {
  pending:  { lbl:'Pending',  cls:'bg-amber-100 text-amber-700' },
  accepted: { lbl:'Diterima', cls:'bg-blue-100 text-blue-700' },
  resolved: { lbl:'Selesai',  cls:'bg-green-100 text-green-700' },
  declined: { lbl:'Ditolak',  cls:'bg-ink/10 text-ink/50' },
};
const PRIO_MAP = {
  tinggi:    { lbl:'Tinggi',    cls:'bg-terracotta/15 text-terracotta' },
  sederhana: { lbl:'Sederhana', cls:'bg-gold/20 text-gold-dark' },
  rendah:    { lbl:'Rendah',    cls:'bg-green-100 text-green-700' },
};

let allReferrals = [];
let statusTab = '';
let me = null;

async function loadReferrals() {
  const { data } = await window.db.from('psy_clinical_referrals')
    .select('*, psy_patients(full_name, mrn)')
    .order('created_at', { ascending: false }).limit(500);
  allReferrals = data || [];
  renderReferrals();
}

function setStatusTab(s) {
  statusTab = s;
  document.querySelectorAll('.st-tab').forEach(b => {
    const on = b.dataset.st === s;
    b.classList.toggle('border-navy', on); b.classList.toggle('text-navy', on);
    b.classList.toggle('border-transparent', !on); b.classList.toggle('text-ink/55', !on);
  });
  renderReferrals();
}
window.setStatusTab = setStatusTab;

function scopeFilter(list, scope) {
  if (scope === 'me')   return list.filter(r => r.target_id === me);
  if (scope === 'sent') return list.filter(r => r.referred_by === me);
  return list;
}

function renderReferrals() {
  const scope = document.getElementById('ref-scope').value;
  const q = (document.getElementById('ref-search').value || '').toLowerCase().trim();
  const scoped = scopeFilter(allReferrals, scope);

  // Kiraan tab (dalam scope)
  document.querySelectorAll('.st-tab').forEach(b => {
    const s = b.dataset.st;
    const n = s ? scoped.filter(r => r.status === s).length : scoped.length;
    b.querySelector('.st-count').textContent = n ? n : '';
  });

  let list = statusTab ? scoped.filter(r => r.status === statusTab) : scoped;
  if (q) list = list.filter(r => {
    const nm = (r.psy_patients?.full_name || r.psy_patients?.mrn || '').toLowerCase();
    return nm.includes(q) || (r.reason || '').toLowerCase().includes(q);
  });

  const tbody = document.getElementById('ref-tbody');
  const empty = document.getElementById('ref-empty');
  if (!list.length) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  tbody.innerHTML = list.map(r => {
    const st = STATUS_MAP[r.status] || STATUS_MAP.pending;
    const pr = PRIO_MAP[r.priority] || PRIO_MAP.sederhana;
    const nm = r.psy_patients?.full_name || r.psy_patients?.mrn || 'Pesakit';
    return `<tr class="hover:bg-cream/30">
      <td class="px-5 py-3">
        <div class="font-semibold text-ink">${esc(nm)}</div>
        <div class="text-[11px] text-ink/40">${esc(r.psy_patients?.mrn || '')} · → ${ROLE_LBL[r.target_role]||r.target_role||''} ${esc(r.target_name||'')}</div>
      </td>
      <td class="px-3 py-3 text-ink/75 max-w-[240px] truncate" title="${esc(r.reason)}">${esc(r.reason)}</td>
      <td class="px-3 py-3"><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${pr.cls}">${pr.lbl}</span></td>
      <td class="px-3 py-3 text-ink/70 whitespace-nowrap">${r.meet_date ? '📅 '+new Date(r.meet_date+'T00:00:00').toLocaleDateString('ms-MY',{day:'2-digit',month:'short',year:'numeric'}) : fmtDT(r.created_at)}</td>
      <td class="px-3 py-3"><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${st.cls}">${st.lbl}</span></td>
      <td class="px-5 py-3">
        <div class="flex items-center justify-end gap-1.5 flex-wrap">
          <a href="rujukan-konsultasi.html?id=${r.id}" class="text-[11px] font-semibold px-2 py-1 rounded-lg bg-navy/10 text-navy hover:bg-navy/20" title="Konsultasi">🩺 Konsultasi</a>
          <button onclick="editRef('${r.id}')" class="text-[11px] px-2 py-1 rounded-lg border border-ink/15 text-ink/60 hover:bg-ink/5" title="Edit">✏️</button>
          <button onclick="delRef('${r.id}')" class="text-[11px] px-2 py-1 rounded-lg border border-terracotta/40 text-terracotta hover:bg-terracotta/5" title="Padam">🗑️</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}
window.renderReferrals = renderReferrals;

function editRef(id) { location.href = 'rujuk.html?id=' + id; }
window.editRef = editRef;
async function delRef(id) {
  if (!confirm('Padam rujukan ini? Tindakan ini tidak boleh dibatalkan.')) return;
  const { error } = await window.db.from('psy_clinical_referrals').delete().eq('id', id);
  if (error) { banner('Ralat: '+error.message,'error'); return; }
  banner('Rujukan dipadam'); await loadReferrals();
}
window.delRef = delRef;

(async () => {
  const user = await initStaff('rujukan', 'Rujukan pesakit kepada doctor / coach / manager');
  if (!user) return;
  me = window.currentUser?.id || user.id;
  await loadReferrals();
})();
</script>
</body>
</html>
