<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Rujukan Pesakit</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🔀</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-5">

        <div>
          <h1 class="text-xl font-bold text-ink flex items-center gap-2">🔀 Rujukan Pesakit</h1>
          <p class="text-sm text-ink/45 mt-0.5">Rujukan pesakit kepada doctor, coach, atau Hakeem/Hakeema.</p>
        </div>

        <!-- Filter tabs -->
        <div class="flex items-center gap-2 flex-wrap">
          <button data-refmode="me"   onclick="setRefMode('me')"   class="refmode-btn px-4 py-2 rounded-xl text-sm font-semibold bg-navy text-white">Untuk Saya <span id="rm-me" class="opacity-80">0</span></button>
          <button data-refmode="sent" onclick="setRefMode('sent')" class="refmode-btn px-4 py-2 rounded-xl text-sm font-semibold bg-white border border-ink/15 text-ink/60">Saya Hantar <span id="rm-sent" class="opacity-70">0</span></button>
          <button data-refmode="all"  onclick="setRefMode('all')"  class="refmode-btn px-4 py-2 rounded-xl text-sm font-semibold bg-white border border-ink/15 text-ink/60">Semua <span id="rm-all" class="opacity-70">0</span></button>
          <select id="ref-status-filter" onchange="renderReferrals()" class="ml-auto border border-ink/15 rounded-lg px-3 py-2 text-sm bg-white outline-none">
            <option value="open">Belum selesai</option>
            <option value="">Semua status</option>
            <option value="pending">Pending</option>
            <option value="accepted">Diterima</option>
            <option value="resolved">Selesai</option>
            <option value="declined">Ditolak</option>
          </select>
        </div>

        <div id="ref-list" class="space-y-3"></div>
        <div id="ref-empty" class="hidden bg-white rounded-2xl border border-ink/10 py-16 text-center text-sm text-ink/40">Tiada rujukan.</div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/utils.js"></script>
<script src="_shared.js"></script>
<script>
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('ms-MY',{day:'2-digit',month:'short',year:'numeric', hour:'2-digit', minute:'2-digit'}) : '—'; }

const ROLE_LBL   = { doctor:'🩺 Doctor', coach:'🧑‍🏫 Coach', manager:'🕌 Hakeem/Hakeema' };
const STATUS_MAP = {
  pending:  { lbl:'Pending',  cls:'bg-amber-100 text-amber-700' },
  accepted: { lbl:'Diterima', cls:'bg-blue-100 text-blue-700' },
  resolved: { lbl:'Selesai',  cls:'bg-green-100 text-green-700' },
  declined: { lbl:'Ditolak',  cls:'bg-ink/10 text-ink/50' },
};

let allReferrals = [];
let refMode = 'me';
let me = null;

async function loadReferrals() {
  const { data } = await window.db.from('psy_referrals')
    .select('*, psy_patients(full_name, mrn)')
    .order('created_at', { ascending: false }).limit(500);
  allReferrals = data || [];
  // Kiraan tab
  document.getElementById('rm-me').textContent   = allReferrals.filter(r => r.target_id === me && r.status !== 'resolved' && r.status !== 'declined').length;
  document.getElementById('rm-sent').textContent = allReferrals.filter(r => r.referred_by === me).length;
  document.getElementById('rm-all').textContent  = allReferrals.length;
  renderReferrals();
}

function setRefMode(m) {
  refMode = m;
  document.querySelectorAll('.refmode-btn').forEach(b => {
    const on = b.dataset.refmode === m;
    b.classList.toggle('bg-navy', on); b.classList.toggle('text-white', on);
    b.classList.toggle('bg-white', !on); b.classList.toggle('border', !on);
    b.classList.toggle('border-ink/15', !on); b.classList.toggle('text-ink/60', !on);
  });
  renderReferrals();
}
window.setRefMode = setRefMode;

function renderReferrals() {
  const sf = document.getElementById('ref-status-filter').value;
  let list = allReferrals.slice();
  if (refMode === 'me')   list = list.filter(r => r.target_id === me);
  if (refMode === 'sent') list = list.filter(r => r.referred_by === me);
  if (sf === 'open')      list = list.filter(r => r.status === 'pending' || r.status === 'accepted');
  else if (sf)            list = list.filter(r => r.status === sf);

  const host = document.getElementById('ref-list');
  const empty = document.getElementById('ref-empty');
  if (!list.length) { host.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  host.innerHTML = list.map(r => {
    const st = STATUS_MAP[r.status] || STATUS_MAP.pending;
    const pName = r.psy_patients?.full_name || r.psy_patients?.mrn || 'Pesakit';
    const isTarget = r.target_id === me;
    const segera = r.priority === 'segera';
    let actions = '';
    if (isTarget && r.status === 'pending') {
      actions = `<button onclick="acceptReferral('${r.id}')" class="bg-blue-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg hover:bg-blue-700">Terima</button>
                 <button onclick="declineReferral('${r.id}')" class="border border-ink/20 text-ink/60 text-xs font-semibold px-3 py-1.5 rounded-lg hover:bg-ink/5">Tolak</button>`;
    } else if (isTarget && r.status === 'accepted') {
      actions = `<button onclick="resolveReferral('${r.id}')" class="bg-green text-white text-xs font-semibold px-3 py-1.5 rounded-lg hover:bg-green-dark">✅ Tandakan Selesai</button>`;
    }
    return `<div class="bg-white rounded-2xl border ${segera && r.status==='pending' ? 'border-terracotta/40' : 'border-ink/10'} shadow-sm p-4">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <a href="patient-hub.html?patient_id=${r.patient_id}" class="font-bold text-ink hover:underline">${esc(pName)}</a>
            ${segera ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-terracotta/15 text-terracotta">🔴 SEGERA</span>' : ''}
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${st.cls}">${st.lbl}</span>
          </div>
          <div class="text-xs text-ink/55 mt-1">
            ${esc(r.referred_by_name || 'Staff')} → ${ROLE_LBL[r.target_role] || r.target_role} <span class="font-semibold text-ink/70">${esc(r.target_name || '')}</span>
          </div>
          <div class="text-sm text-ink/80 mt-2 bg-cream/50 rounded-lg px-3 py-2">${esc(r.reason)}</div>
          ${r.resolution_note ? `<div class="text-xs text-green-dark mt-2">✅ ${esc(r.resolution_note)}</div>` : ''}
          <div class="text-[11px] text-ink/40 mt-2">${fmtDate(r.created_at)}</div>
        </div>
        <div class="flex flex-col gap-1.5 flex-shrink-0">${actions}</div>
      </div>
    </div>`;
  }).join('');
}
window.renderReferrals = renderReferrals;

async function acceptReferral(id) {
  const { error } = await window.db.from('psy_referrals').update({ status: 'accepted', updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  banner('Rujukan diterima ✅');
  await loadReferrals();
}
window.acceptReferral = acceptReferral;

async function declineReferral(id) {
  const note = prompt('Sebab tolak rujukan (pilihan):') ?? '';
  const { error } = await window.db.from('psy_referrals').update({ status: 'declined', resolution_note: note.trim() || null, resolved_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  banner('Rujukan ditolak');
  await loadReferrals();
}
window.declineReferral = declineReferral;

async function resolveReferral(id) {
  const note = prompt('Nota tindakan / hasil rujukan:');
  if (note === null) return;
  const { error } = await window.db.from('psy_referrals').update({ status: 'resolved', resolution_note: note.trim() || null, resolved_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  banner('Rujukan ditandakan selesai ✅');
  await loadReferrals();
}
window.resolveReferral = resolveReferral;

(async () => {
  const user = await initStaff('rujukan', 'Rujukan pesakit kepada doctor / coach / Hakeem');
  if (!user) return;
  me = window.currentUser?.id || user.id;
  await loadReferrals();
})();
</script>
</body>
</html>
