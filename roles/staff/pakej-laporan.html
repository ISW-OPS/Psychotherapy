<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Laporan Pakej</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📊</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-5">

        <!-- Page header -->
        <div class="flex items-center justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-xl font-bold text-ink">Laporan Pakej</h1>
            <p class="text-sm text-ink/45 mt-0.5">Statistik & pesakit aktif setiap pakej rawatan</p>
          </div>
        </div>

        <!-- KPI strip -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-5 flex items-center gap-4">
            <div class="w-11 h-11 rounded-xl bg-green-50 flex items-center justify-center text-xl">📦</div>
            <div><div class="text-[11px] text-ink/45 font-medium">Pakej Aktif</div><div id="kpi-pkg-active" class="text-2xl font-bold text-ink mt-0.5">0</div></div>
          </div>
          <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-5 flex items-center gap-4">
            <div class="w-11 h-11 rounded-xl bg-indigo-50 flex items-center justify-center text-xl">👥</div>
            <div><div class="text-[11px] text-ink/45 font-medium">Jumlah Pesakit</div><div id="kpi-patients" class="text-2xl font-bold text-ink mt-0.5">0</div></div>
          </div>
          <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-5 flex items-center gap-4">
            <div class="w-11 h-11 rounded-xl bg-amber-50 flex items-center justify-center text-xl">💰</div>
            <div><div class="text-[11px] text-ink/45 font-medium">Pakej Paling Popular</div><div id="kpi-popular" class="text-sm font-bold text-ink mt-0.5 truncate">—</div></div>
          </div>
          <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-5 flex items-center gap-4">
            <div class="w-11 h-11 rounded-xl bg-purple-50 flex items-center justify-center text-xl">📊</div>
            <div><div class="text-[11px] text-ink/45 font-medium">Purata Pesakit/Pakej</div><div id="kpi-avg" class="text-2xl font-bold text-ink mt-0.5">0</div></div>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-4 flex flex-wrap items-center gap-3">
          <input id="search-input" type="text" placeholder="Cari pakej..." oninput="renderRows()"
            class="flex-1 min-w-[200px] px-3 py-2 border border-ink/15 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-navy/20">
          <select id="status-filter" onchange="renderRows()" class="px-3 py-2 border border-ink/15 rounded-lg text-sm bg-white">
            <option value="">Semua Status</option>
            <option value="active">Aktif</option>
            <option value="draft">Draft</option>
            <option value="inactive">Tidak Aktif</option>
          </select>
          <select id="sort-by" onchange="renderRows()" class="px-3 py-2 border border-ink/15 rounded-lg text-sm bg-white">
            <option value="patients">Susun: Bilangan Pesakit ↓</option>
            <option value="name">Susun: Nama A-Z</option>
            <option value="price">Susun: Harga ↓</option>
          </select>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
          <div class="px-5 py-2 grid gap-3 items-center text-[10px] font-bold text-ink/40 uppercase tracking-wider border-b border-ink/5 bg-ink/[0.015]" style="grid-template-columns: 1fr 110px 100px 110px 100px 80px">
            <span>Pakej</span>
            <span class="text-center">Pesakit Aktif</span>
            <span class="text-center">Selesai</span>
            <span class="text-center">Aktiviti 30H</span>
            <span>Status</span>
            <span class="text-right">Tindakan</span>
          </div>
          <div id="pkg-rows" class="divide-y divide-ink/5"></div>
          <div id="empty" class="hidden px-5 py-12 text-center text-sm text-ink/35">Tiada pakej ditemui</div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let stats = []; // [{pkg, activeCount, doneCount, activity30, ...}]

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtRM(n) { return Number(n||0) === 0 ? 'Percuma' : 'RM' + Number(n).toLocaleString('en-MY'); }

function statusInfo(p) {
  const s = p.status || (p.is_active ? 'active' : 'inactive');
  return {
    active:   { lbl: 'Aktif',       cls: 'bg-green-100 text-green-700' },
    draft:    { lbl: 'Draft',       cls: 'bg-amber-100 text-amber-700' },
    inactive: { lbl: 'Tidak Aktif', cls: 'bg-ink/10 text-ink/55' },
  }[s] || { lbl: 'Aktif', cls: 'bg-green-100 text-green-700' };
}

function renderRows() {
  const search = (document.getElementById('search-input').value || '').toLowerCase().trim();
  const statusF = document.getElementById('status-filter').value;
  const sortBy = document.getElementById('sort-by').value;

  let rows = stats.filter(r => {
    const status = r.pkg.status || (r.pkg.is_active ? 'active' : 'inactive');
    if (statusF && status !== statusF) return false;
    if (search && !(r.pkg.name || '').toLowerCase().includes(search) && !(r.pkg.package_id || '').toLowerCase().includes(search)) return false;
    return true;
  });

  if (sortBy === 'patients') rows.sort((a, b) => b.activeCount - a.activeCount);
  else if (sortBy === 'name') rows.sort((a, b) => (a.pkg.name || '').localeCompare(b.pkg.name || ''));
  else if (sortBy === 'price') rows.sort((a, b) => Number(b.pkg.price || 0) - Number(a.pkg.price || 0));

  const empty = document.getElementById('empty');
  const tbody = document.getElementById('pkg-rows');

  if (!rows.length) {
    tbody.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  tbody.innerHTML = rows.map(r => {
    const p = r.pkg;
    const info = statusInfo(p);
    return `<a href="pakej-report.html?id=${p.id}" class="grid gap-3 items-center px-5 py-3.5 hover:bg-ink/[0.015] transition-colors" style="grid-template-columns: 1fr 110px 100px 110px 100px 80px">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-xl ${p.bg_color || 'bg-cream'} flex items-center justify-center flex-shrink-0 text-xl">${p.icon || '📦'}</div>
        <div class="min-w-0">
          <div class="font-semibold text-ink truncate">${escHtml(p.name)}</div>
          <div class="text-[11px] text-ink/45">${escHtml(p.package_id || '—')} · ${fmtRM(p.price)}</div>
        </div>
      </div>
      <div class="text-center">
        <div class="text-base font-bold text-navy">${r.activeCount}</div>
        <div class="text-[10px] text-ink/40">aktif</div>
      </div>
      <div class="text-center">
        <div class="text-base font-bold text-ink/65">${r.doneCount}</div>
        <div class="text-[10px] text-ink/40">selesai</div>
      </div>
      <div class="text-center">
        <div class="text-base font-bold text-ink/65">${r.activity30}</div>
        <div class="text-[10px] text-ink/40">aktiviti</div>
      </div>
      <div><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${info.cls}">${info.lbl}</span></div>
      <div class="text-right"><span class="text-xs font-semibold text-navy">Lihat →</span></div>
    </a>`;
  }).join('');
}

async function init() {
  const user = await initStaff('pakej_laporan', 'Laporan Pakej');
  if (!user) return;

  // Load all packages + patients + activity counts
  const [pkgRes, ptRes, logRes] = await Promise.all([
    window.db.from('psy_packages').select('id, name, package_id, price, icon, bg_color, is_active').order('sort_order', { ascending: true }),
    window.db.from('psy_patients').select('id, status, active_package_id'),
    window.db.from('psy_audit_log').select('action, target, meta, created_at').gte('created_at', new Date(Date.now() - 30*86400000).toISOString()).like('action', 'package.%'),
  ]);

  const pkgs = pkgRes.data || [];
  const pts  = ptRes.data  || [];
  const logs = logRes.data || [];

  stats = pkgs.map(p => {
    const inPkg = pts.filter(x => x.active_package_id === p.package_id);
    const activeCount = inPkg.filter(x => x.status === 'active').length;
    const doneCount   = inPkg.filter(x => x.status === 'inactive').length;
    const activity30  = logs.filter(l => l.target === p.id || l.meta?.package_id === p.id).length;
    return { pkg: p, activeCount, doneCount, activity30 };
  });

  // KPIs
  const activePkgs = stats.filter(r => (r.pkg.status || (r.pkg.is_active ? 'active' : 'inactive')) === 'active');
  const totalPatients = stats.reduce((s, r) => s + r.activeCount, 0);
  const popular = [...stats].sort((a, b) => b.activeCount - a.activeCount)[0];
  const avg = activePkgs.length ? Math.round(totalPatients / activePkgs.length) : 0;

  document.getElementById('kpi-pkg-active').textContent = activePkgs.length;
  document.getElementById('kpi-patients').textContent   = totalPatients;
  document.getElementById('kpi-popular').textContent    = popular?.activeCount ? popular.pkg.name : '—';
  document.getElementById('kpi-avg').textContent        = avg;

  renderRows();
}

init();
</script>
</body>
</html>
