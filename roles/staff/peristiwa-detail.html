<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Detail Peristiwa</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🏥</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-4">

        <!-- Tajuk + tindakan -->
        <div class="flex items-start justify-between gap-3 flex-wrap">
          <div>
            <a href="peristiwa.html" class="text-xs text-ink/50 hover:text-navy no-underline">← Kembali</a>
            <h1 class="text-xl font-bold text-ink mt-0.5">Butiran & Maklumat Lawatan</h1>
            <p class="text-xs text-ink/40 mt-0.5">Peristiwa Pesakit &rsaquo; Butiran & Maklumat Lawatan</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="window.print()" class="text-sm font-semibold px-4 py-2 rounded-lg border border-ink/15 text-ink/60 bg-white hover:bg-ink/5">🖨️ Cetak</button>
            <div class="relative">
              <button onclick="toggleActionMenu(event)" class="text-sm font-semibold px-4 py-2 rounded-lg border border-ink/15 text-ink/60 bg-white hover:bg-ink/5">⋮ Tindakan ▾</button>
              <div id="action-menu" class="hidden absolute right-0 top-11 z-30 bg-white border border-ink/10 rounded-xl shadow-lg py-1 w-52">
                <a id="am-edit" data-rbac="patient_events.edit" href="#" class="flex items-center gap-2.5 px-4 py-2.5 text-sm text-ink hover:bg-cream/60 no-underline">✏️ <span>Ubah Maklumat</span></a>
                <button data-rbac="patient_events.create" onclick="scheduleVisit()" class="w-full text-left flex items-center gap-2.5 px-4 py-2.5 text-sm text-ink hover:bg-cream/60">🚶 <span>Rekod Lawatan</span></button>
                <button data-rbac="patient_events.edit" onclick="addNote()" class="w-full text-left flex items-center gap-2.5 px-4 py-2.5 text-sm text-ink hover:bg-cream/60">📝 <span>Tambah Nota</span></button>
                <button data-rbac="patient_events.edit" onclick="markDischarge()" class="w-full text-left flex items-center gap-2.5 px-4 py-2.5 text-sm text-ink hover:bg-cream/60">✅ <span>Tanda Discaj</span></button>
                <button id="am-close" data-rbac="patient_events.edit" onclick="toggleClose()" class="w-full text-left flex items-center gap-2.5 px-4 py-2.5 text-sm text-ink hover:bg-cream/60">✕ <span>Tutup Peristiwa</span></button>
                <button data-rbac="patient_events.delete" onclick="delEvent()" class="w-full text-left flex items-center gap-2.5 px-4 py-2.5 text-sm text-terracotta hover:bg-terracotta/5">🗑️ <span>Padam Peristiwa</span></button>
              </div>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-start">

          <!-- ═══ Kiri ═══ -->
          <div class="lg:col-span-2 space-y-4">

            <!-- Header pesakit + ringkasan pantas -->
            <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-5 flex items-center gap-5 flex-wrap">
              <div class="flex items-center gap-3 min-w-0">
                <div id="ph-avatar" class="w-14 h-14 rounded-full bg-navy text-white text-xl font-bold flex items-center justify-center flex-shrink-0"></div>
                <div class="min-w-0">
                  <div id="ph-name" class="font-bold text-lg text-ink truncate"></div>
                  <div id="ph-meta" class="text-xs text-ink/45"></div>
                  <div id="ph-status" class="mt-1"></div>
                </div>
              </div>
              <div class="hidden md:block w-px self-stretch bg-ink/8"></div>
              <div class="flex items-center gap-6 flex-wrap">
                <div>
                  <div class="text-[10px] uppercase tracking-wide text-ink/40 font-semibold mb-1">Jenis Peristiwa</div>
                  <div id="ph-type"></div>
                </div>
                <div>
                  <div class="text-[10px] uppercase tracking-wide text-ink/40 font-semibold mb-1">Tarikh Peristiwa</div>
                  <div id="ph-date" class="text-sm font-semibold text-ink"></div>
                </div>
                <div>
                  <div class="text-[10px] uppercase tracking-wide text-ink/40 font-semibold mb-1">Hospital</div>
                  <div id="ph-hosp" class="text-sm font-semibold text-ink"></div>
                </div>
              </div>
            </div>

            <!-- Kad kandungan (Butiran · Lawatan · Dokumen) -->
            <div class="bg-white rounded-2xl border border-ink/10 shadow-sm">
              <div class="p-5">
                <h2 class="font-bold text-ink mb-3 flex items-center gap-2">📋 Butiran</h2>
                <div id="detail-rows" class="grid grid-cols-1 md:grid-cols-2 gap-x-8"></div>
              </div>

              <div class="border-t border-ink/8 p-5">
                <div class="flex items-center justify-between gap-3 flex-wrap mb-3">
                  <div>
                    <h2 class="font-bold text-ink flex items-center gap-2">📎 Dokumen</h2>
                    <p id="doc-count" class="text-xs text-ink/45 mt-0.5"></p>
                  </div>
                  <label data-rbac="patient_events.edit" class="inline-flex items-center gap-2 text-xs font-semibold text-navy border border-navy/30 bg-navy/5 hover:bg-navy/10 px-4 py-2 rounded-lg cursor-pointer">
                    ⬆️ Muat Naik Dokumen
                    <input type="file" multiple class="hidden" onchange="uploadDocs(this.files); this.value='';">
                  </label>
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full text-sm">
                    <thead>
                      <tr class="border-b border-ink/8 bg-ink/[0.015] text-[10px] uppercase tracking-wider text-ink/45">
                        <th class="text-left px-3 py-2.5">Nama Dokumen</th>
                        <th class="text-left px-3 py-2.5 w-20">Jenis</th>
                        <th class="text-left px-3 py-2.5 w-20">Saiz</th>
                        <th class="text-left px-3 py-2.5 w-40">Dimuat naik oleh</th>
                        <th class="text-left px-3 py-2.5 w-40">Tarikh Muat Naik</th>
                        <th class="text-right px-3 py-2.5 w-24">Tindakan</th>
                      </tr>
                    </thead>
                    <tbody id="doc-tbody" class="divide-y divide-ink/5"></tbody>
                  </table>
                  <div id="doc-empty" class="hidden py-8 text-center text-xs text-ink/40">Tiada dokumen dilampirkan.</div>
                </div>
              </div>
            </div>
          </div>

          <!-- ═══ Sidebar kanan (satu kad bersekat) ═══ -->
          <div class="bg-white rounded-2xl border border-ink/10 shadow-sm">
            <div id="panel-visit-status" class="p-5 bg-green-light/20 rounded-t-2xl"></div>

            <div class="border-t border-ink/8 p-5">
              <h3 class="font-bold text-ink mb-2">Maklumat Lawatan</h3>
              <div id="visit-rows"></div>
            </div>

          </div>

        </div>
      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/utils.js"></script>
<script src="_shared.js"></script>
<script src="../../shared/settings.js"></script>
<script src="_peristiwa.js"></script>
<script>
let EV = null;
let LOGS = [], VISITS = [], DOCS = [];
const evId = new URLSearchParams(location.search).get('id');

const LOG_ICONS = {
  created: '🆕', updated: '✏️', notified: '🔔', assigned: '👤', visit_scheduled: '📅',
  visit_completed: '✅', note: '📝', doc_uploaded: '📎', closed: '✕', reopened: '↩️', discaj: '🏠',
};

async function loadAll() {
  const [{ data: e, error }, { data: logs }, { data: visits }, { data: docs }] = await Promise.all([
    window.db.from('psy_patient_events').select(PE_SELECT).eq('id', evId).single(),
    window.db.from('psy_patient_event_logs').select('*').eq('event_id', evId).order('created_at', { ascending: true }),
    window.db.from('psy_patient_event_visits').select(PEV_SELECT).eq('event_id', evId).order('visit_date', { ascending: true }),
    window.db.from('psy_patient_event_docs').select('*').eq('event_id', evId).order('created_at', { ascending: false }),
  ]);
  if (error || !e) { banner('Peristiwa tidak dijumpai', 'error'); setTimeout(() => location.href = 'peristiwa.html', 900); return; }
  EV = e; LOGS = logs || []; VISITS = visits || []; DOCS = docs || [];
  renderAll();
}

function renderAll() {
  renderHeaderCard();
  renderDetailRows();
  renderVisitRows();
  renderDocs();
  renderVisitStatus();
  document.getElementById('am-edit').href = 'peristiwa-baru.html?id=' + EV.id;
  document.getElementById('am-close').innerHTML = EV.status === 'open' ? '✕ <span>Tutup Peristiwa</span>' : '↩️ <span>Buka Semula</span>';
}

// ── Header pesakit ───────────────────────────────────────
function renderHeaderCard() {
  const nm = pePatientName(EV);
  const p = EV.psy_patients || {};
  const g = p.gender === 'M' ? 'Lelaki' : p.gender === 'F' ? 'Perempuan' : '';
  document.getElementById('ph-avatar').textContent = nm.slice(0, 1).toUpperCase();
  document.getElementById('ph-name').textContent = nm;
  document.getElementById('ph-meta').textContent = [p.mrn, peAge(p.date_of_birth), g].filter(Boolean).join(' · ');
  document.getElementById('ph-status').innerHTML = p.status === 'deceased'
    ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-ink/10 text-ink/70">🕊️ Meninggal Dunia</span>'
    : '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-green-light text-green-dark">Aktif</span>';
  document.getElementById('ph-type').innerHTML = peTypeChip(EV.event_type);
  document.getElementById('ph-date').textContent = '📅 ' + peFmtDate(EV.event_date);
  document.getElementById('ph-hosp').textContent = '🏥 ' + (EV.hospital_name || '—');
}

// ── Kad Butiran ──────────────────────────────────────────
function renderDetailRows() {
  const row = (icon, k, v) => `
    <div class="flex items-center gap-3 py-2.5 border-b border-ink/5">
      <span class="text-base w-6 text-center flex-shrink-0">${icon}</span>
      <span class="text-xs text-ink/50 w-36 flex-shrink-0">${k}</span>
      <span class="text-sm font-semibold text-ink">${peEsc(v || '—')}</span>
    </div>`;
  const rowH = (icon, k, h) => `
    <div class="flex items-center gap-3 py-2.5 border-b border-ink/5">
      <span class="text-base w-6 text-center flex-shrink-0">${icon}</span>
      <span class="text-xs text-ink/50 w-36 flex-shrink-0">${k}</span>
      <span>${h}</span>
    </div>`;
  document.getElementById('detail-rows').innerHTML =
    row('📅', PE_DATE_LBL[EV.event_type] || 'Tarikh Peristiwa', peFmtDate(EV.event_date)) +
    row('🛏️', 'Katil / Unit', EV.bed_unit) +
    row('🏥', 'Hospital', EV.hospital_name) +
    row('📞', 'No Tel Kecemasan', EV.emergency_contact_phone) +
    row('🚪', 'Wad / Bilik', EV.ward_room) +
    rowH('⚡', 'Prioriti', pePrioChip(EV.priority)) +
    row('🔔', 'Dinotifikasi Kepada', Array.isArray(EV.notify_roles) ? EV.notify_roles.join(', ') : '') +
    row('🧾', 'Direkod Oleh', (EV.reporter?.full_name || '—') + ' · ' + peFmtDT(EV.created_at));
}

// ── Kad Maklumat Lawatan ─────────────────────────────────
function renderVisitRows() {
  const row = (icon, k, html) => `
    <div class="flex items-start gap-3 py-2.5 border-b border-ink/5 last:border-0">
      <span class="text-base w-6 text-center flex-shrink-0">${icon}</span>
      <span class="text-xs text-ink/50 w-36 flex-shrink-0 mt-0.5">${k}</span>
      <div class="text-sm font-semibold text-ink min-w-0">${html}</div>
    </div>`;
  let html = row('🚶', 'Perlu lawatan', EV.need_visit
    ? '<span class="text-green-dark">✓ Ya</span>'
    : '<span class="text-ink/50">✕ Tidak</span>');
  if (EV.need_visit) {
    html += row('📅', 'Tarikh lawatan (kalau Ya)', EV.expected_visit_date ? peFmtDate(EV.expected_visit_date) : '<span class="text-ink/40 font-normal">Belum ditetapkan</span>');
  }
  html += row('📝', 'Nota', EV.notes ? `<span class="font-normal whitespace-pre-wrap">${peEsc(EV.notes)}</span>` : '—');
  document.getElementById('visit-rows').innerHTML = html;
}

// ── Kad Dokumen ──────────────────────────────────────────
function docExt(d) {
  const m = (d.name || '').match(/\.([a-z0-9]+)$/i);
  return m ? m[1].toUpperCase() : (d.mime || '').split('/')[1]?.toUpperCase() || '—';
}
function docIcon(d) {
  const s = (d.mime || d.name || '').toLowerCase();
  if (s.includes('pdf')) return '📕';
  if (s.includes('jp') || s.includes('png') || s.includes('image')) return '🖼️';
  return '📄';
}
function renderDocs() {
  document.getElementById('doc-count').textContent = DOCS.length
    ? `${DOCS.length} dokumen dilampirkan` : 'Tiada dokumen dilampirkan lagi.';
  const tbody = document.getElementById('doc-tbody');
  const empty = document.getElementById('doc-empty');
  if (!DOCS.length) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  tbody.innerHTML = DOCS.map(d => `
    <tr class="hover:bg-cream/30">
      <td class="px-3 py-2.5">
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="text-lg flex-shrink-0">${docIcon(d)}</span>
          <span class="text-xs font-semibold text-ink truncate">${peEsc(d.name)}</span>
        </div>
      </td>
      <td class="px-3 py-2.5 text-xs text-ink/60">${docExt(d)}</td>
      <td class="px-3 py-2.5 text-xs text-ink/60">${d.size_kb ? (d.size_kb >= 1024 ? (d.size_kb / 1024).toFixed(1) + ' MB' : d.size_kb + ' KB') : '—'}</td>
      <td class="px-3 py-2.5 text-xs text-ink/70">${peEsc(d.uploaded_by_name || '—')}</td>
      <td class="px-3 py-2.5 text-xs text-ink/60 whitespace-nowrap">${peFmtDT(d.created_at)}</td>
      <td class="px-3 py-2.5">
        <div class="flex items-center justify-end gap-1">
          <button onclick="openDoc('${d.id}')" title="Lihat / Muat turun" class="text-[13px] px-2 py-1 rounded-lg border border-ink/15 text-ink/60 hover:bg-ink/5">👁️</button>
          <button data-rbac="patient_events.delete" onclick="delDoc('${d.id}')" title="Padam" class="text-[13px] px-2 py-1 rounded-lg border border-terracotta/40 text-terracotta hover:bg-terracotta/5">🗑️</button>
        </div>
      </td>
    </tr>`).join('');
  if (typeof applyRbacUI === 'function') applyRbacUI(tbody);
}

// ── Sidebar: Status Lawatan ──────────────────────────────
function renderVisitStatus() {
  const el = document.getElementById('panel-visit-status');
  const head = '<h3 class="font-bold text-ink mb-3">Status Lawatan</h3>';
  const next = VISITS.find(v => ['pending', 'in_progress'].includes(v.status));
  const done = VISITS.filter(v => v.status === 'completed').length;

  if (next) {
    const st = peVisitEffectiveStatus(next);
    const chip = st === 'overdue'
      ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700">Lewat</span>'
      : '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-green-light text-green-dark">Akan Datang</span>';
    el.innerHTML = head + `
      <div class="flex items-center justify-between gap-2 mb-3">
        <div class="flex items-center gap-3">
          <span class="w-9 h-9 rounded-lg bg-green text-white flex items-center justify-center flex-shrink-0">📅</span>
          <div>
            <div class="text-sm font-bold text-green-dark">Lawatan Dijadualkan</div>
            <div class="text-xs text-ink/55">${peFmtDate(next.visit_date)}${next.visit_time ? ', ' + peFmtTime(next.visit_time) : ''}</div>
          </div>
        </div>
        ${chip}
      </div>
      <a href="lawatan-detail.html?id=${next.id}" class="block text-center text-xs font-semibold text-ink/70 border border-ink/15 bg-white hover:bg-cream/60 px-4 py-2.5 rounded-lg no-underline">📅 Ubah Jadual Lawatan</a>`;
  } else if (EV.need_visit) {
    el.innerHTML = head + `
      <div class="flex items-center gap-3 mb-3">
        <span class="w-9 h-9 rounded-lg bg-amber-400 text-white flex items-center justify-center flex-shrink-0">⏳</span>
        <div>
          <div class="text-sm font-bold text-amber-600">${done ? 'Semua Lawatan Selesai' : 'Lawatan Belum Diatur'}</div>
          <div class="text-xs text-ink/55">${done ? done + ' lawatan selesai' : (EV.expected_visit_date ? 'Jangkaan: ' + peFmtDate(EV.expected_visit_date) : 'Perlu lawatan')}</div>
        </div>
      </div>
      <button data-rbac="patient_events.create" onclick="scheduleVisit()" class="w-full text-center text-xs font-semibold text-ink/70 border border-ink/15 bg-white hover:bg-cream/60 px-4 py-2.5 rounded-lg">📅 Jadualkan Lawatan</button>`;
    if (typeof applyRbacUI === 'function') applyRbacUI(el);
  } else {
    el.innerHTML = head + `
      <div class="flex items-center gap-3">
        <span class="w-9 h-9 rounded-lg bg-ink/10 text-ink/50 flex items-center justify-center flex-shrink-0">—</span>
        <div>
          <div class="text-sm font-bold text-ink/60">Tiada Lawatan Diperlukan</div>
          <div class="text-xs text-ink/45">Peristiwa ini tidak memerlukan lawatan.</div>
        </div>
      </div>`;
  }
}

// ── Menu tindakan ────────────────────────────────────────
function toggleActionMenu(e) {
  if (e) e.stopPropagation();
  document.getElementById('action-menu').classList.toggle('hidden');
}
window.toggleActionMenu = toggleActionMenu;
document.addEventListener('click', e => {
  const m = document.getElementById('action-menu');
  if (m && !m.classList.contains('hidden') && !e.target.closest('#action-menu') && !e.target.closest('button[onclick*="toggleActionMenu"]'))
    m.classList.add('hidden');
});

// ── Tindakan ─────────────────────────────────────────────
async function scheduleVisit() {
  const d = prompt('Tarikh lawatan (YYYY-MM-DD):', EV.expected_visit_date || new Date().toISOString().slice(0, 10));
  if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) { if (d) banner('Format tarikh salah', 'error'); return; }
  const { data, error } = await window.db.from('psy_patient_event_visits').insert({
    event_id: EV.id, patient_id: EV.patient_id, visit_date: d,
    visited_by: EV.assigned_to || window.currentUser.id,
    location: EV.hospital_name, ward_room: [EV.ward_room, EV.bed_unit].filter(Boolean).join(' / ') || null,
    created_by: window.currentUser.id,
  }).select('id').single();
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  await peLog(EV.id, 'visit_scheduled', 'Lawatan dijadualkan pada ' + peFmtDate(d), data.id);
  banner('Lawatan dijadualkan ✅');
  location.href = 'lawatan-detail.html?id=' + data.id;
}
window.scheduleVisit = scheduleVisit;

async function addNote() {
  const n = prompt('Nota baru:');
  if (!n || !n.trim()) return;
  await peLog(EV.id, 'note', n.trim());
  banner('Nota disimpan ✅');
  await loadAll();
}
window.addNote = addNote;

async function uploadDocs(files) {
  for (const f of [...files]) {
    if (f.size > 10 * 1024 * 1024) { banner(`${f.name} melebihi 10MB — dilangkau`, 'error'); continue; }
    const path = `event/${EV.id}/${Date.now()}_${f.name.replace(/[^\w.\-]/g, '_')}`;
    const { error: upErr } = await window.db.storage.from('event-docs').upload(path, f);
    if (upErr) { banner(`Gagal: ${upErr.message}`, 'error'); continue; }
    await window.db.from('psy_patient_event_docs').insert({
      event_id: EV.id, name: f.name, path, size_kb: Math.round(f.size / 1024), mime: f.type,
      uploaded_by: window.currentUser.id, uploaded_by_name: window.currentUser.full_name,
    });
    await peLog(EV.id, 'doc_uploaded', 'Dokumen dimuat naik: ' + f.name);
  }
  banner('Dokumen dimuat naik ✅');
  await loadAll();
}
window.uploadDocs = uploadDocs;

async function openDoc(id) {
  const d = DOCS.find(x => x.id === id);
  if (!d) return;
  const { data, error } = await window.db.storage.from('event-docs').createSignedUrl(d.path, 300);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  window.open(data.signedUrl, '_blank');
}
window.openDoc = openDoc;

async function delDoc(id) {
  const d = DOCS.find(x => x.id === id);
  if (!d || !confirm('Padam dokumen "' + d.name + '"?')) return;
  await window.db.storage.from('event-docs').remove([d.path]);
  await window.db.from('psy_patient_event_docs').delete().eq('id', id);
  banner('Dokumen dipadam');
  await loadAll();
}
window.delDoc = delDoc;

async function toggleClose() {
  const closing = EV.status === 'open';
  if (closing && !confirm('Tutup peristiwa ini? Ia akan ditanda Selesai.')) return;
  const { error } = await window.db.from('psy_patient_events').update(closing
    ? { status: 'closed', closed_by: window.currentUser.id, closed_at: new Date().toISOString() }
    : { status: 'open', closed_by: null, closed_at: null }).eq('id', EV.id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  await peLog(EV.id, closing ? 'closed' : 'reopened', closing ? 'Peristiwa ditutup' : 'Peristiwa dibuka semula');
  banner(closing ? 'Peristiwa ditutup ✅' : 'Peristiwa dibuka semula');
  await loadAll();
}
window.toggleClose = toggleClose;

async function markDischarge() {
  if (!confirm('Tandakan pesakit telah DISCAJ dan tutup peristiwa ini?')) return;
  const { error } = await window.db.from('psy_patient_events').update({
    status: 'closed', closed_by: window.currentUser.id, closed_at: new Date().toISOString(),
  }).eq('id', EV.id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  await peLog(EV.id, 'discaj', 'Pesakit ditandakan discaj — peristiwa ditutup');
  banner('Pesakit ditanda discaj ✅');
  await loadAll();
}
window.markDischarge = markDischarge;

async function delEvent() {
  if (!confirm('Padam peristiwa ini beserta semua lawatan, nota & dokumen? Tindakan ini tidak boleh dibatalkan.')) return;
  const { error } = await window.db.from('psy_patient_events').delete().eq('id', EV.id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  banner('Peristiwa dipadam');
  setTimeout(() => location.href = 'peristiwa.html', 700);
}
window.delEvent = delEvent;

(async () => {
  const user = await initStaff('peristiwa', 'Detail peristiwa pesakit');
  if (!user) return;
  if (!evId) { location.href = 'peristiwa.html'; return; }
  await loadAll();
})();
</script>
