<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Edit Library</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.media-type-btn {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 14px 12px; border: 2px solid rgba(60,79,92,0.15); border-radius: 12px;
  cursor: pointer; transition: all 0.18s ease; background: white;
}
.media-type-btn:hover { border-color: #1a3a5c; }
.media-type-btn:has(input:checked) {
  border-color: #1a3a5c; background: linear-gradient(135deg, #dde8f5 0%, #c5d7ec 100%);
  box-shadow: 0 2px 8px rgba(26,58,92,0.15);
}
.media-type-btn:has(input:checked) span { color: #1a3a5c; font-weight: 700; }
.media-type-btn input { display: none; }
</style>
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📚</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8">
        <div class="space-y-5">
          <input id="edit-id" type="hidden">

          <!-- Media Type -->
          <div>
            <label class="text-xs font-semibold">Jenis Media <span class="text-terracotta">*</span></label>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2">
              <label class="media-type-btn">
                <input type="radio" name="media-type" value="article" checked onchange="onMediaTypeChange()">
                <span class="text-xl">📝</span><span class="text-xs font-semibold">Artikel</span>
              </label>
              <label class="media-type-btn">
                <input type="radio" name="media-type" value="image" onchange="onMediaTypeChange()">
                <span class="text-xl">🖼️</span><span class="text-xs font-semibold">Gambar</span>
              </label>
              <label class="media-type-btn">
                <input type="radio" name="media-type" value="video" onchange="onMediaTypeChange()">
                <span class="text-xl">🎬</span><span class="text-xs font-semibold">Video</span>
              </label>
              <label class="media-type-btn">
                <input type="radio" name="media-type" value="pdf" onchange="onMediaTypeChange()">
                <span class="text-xl">📄</span><span class="text-xs font-semibold">PDF</span>
              </label>
            </div>
          </div>

          <!-- Basic Info -->
          <div class="grid md:grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold">Title <span class="text-terracotta">*</span></label>
              <input id="f-title" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="cth: Apa itu BPS-S model?">
            </div>
            <div>
              <label class="text-xs font-semibold">Label Kandungan</label>
              <input id="f-type" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="cth: Video · 8 min">
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold">Description</label>
            <textarea id="f-desc" rows="2" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none"></textarea>
          </div>

            <!-- Image -->
            <div id="section-image" class="hidden space-y-3">
              <label class="text-xs font-semibold">Upload Gambar <span class="text-terracotta">*</span></label>
              <div id="img-drop" class="border-2 border-dashed border-ink/20 rounded-xl p-6 text-center cursor-pointer hover:border-navy transition-colors" onclick="document.getElementById('img-file').click()">
                <div id="img-preview-wrap" class="hidden mb-3"><img id="img-preview" class="max-h-48 mx-auto rounded-lg object-contain"></div>
                <div id="img-placeholder"><div class="text-3xl mb-2">🖼️</div><div class="text-sm font-medium text-ink/60">Klik untuk upload gambar</div><div class="text-xs text-ink/40 mt-1">JPG, PNG, WebP · Max 5MB</div></div>
                <input id="img-file" type="file" accept="image/*" class="hidden" onchange="previewImage(event)">
              </div>
              <div id="img-existing-url" class="hidden text-xs text-ink/50 bg-cream rounded-lg px-3 py-2"></div>
            </div>

            <!-- Video -->
            <div id="section-video" class="hidden space-y-3">
              <div>
                <label class="text-xs font-semibold">Sumber Video</label>
                <div class="flex gap-2 mt-1">
                  <label class="flex-1 border border-ink/20 rounded-lg p-2 text-xs cursor-pointer has-[:checked]:border-navy has-[:checked]:bg-navy-light text-center">
                    <input type="radio" name="video-src" value="upload" checked onchange="onVideoSrcChange()" class="mr-1">📤 Upload fail
                  </label>
                  <label class="flex-1 border border-ink/20 rounded-lg p-2 text-xs cursor-pointer has-[:checked]:border-navy has-[:checked]:bg-navy-light text-center">
                    <input type="radio" name="video-src" value="youtube" onchange="onVideoSrcChange()" class="mr-1">▶️ YouTube URL
                  </label>
                  <label class="flex-1 border border-ink/20 rounded-lg p-2 text-xs cursor-pointer has-[:checked]:border-navy has-[:checked]:bg-navy-light text-center">
                    <input type="radio" name="video-src" value="url" onchange="onVideoSrcChange()" class="mr-1">🔗 URL Luaran
                  </label>
                </div>
              </div>
              <div id="video-upload-area">
                <div id="vid-drop" class="border-2 border-dashed border-ink/20 rounded-xl p-6 text-center cursor-pointer hover:border-navy transition-colors" onclick="document.getElementById('vid-file').click()">
                  <div id="vid-preview-wrap" class="hidden mb-3"><video id="vid-preview" controls class="max-h-40 mx-auto rounded-lg w-full"></video></div>
                  <div id="vid-placeholder"><div class="text-3xl mb-2">🎬</div><div class="text-sm font-medium text-ink/60">Klik untuk upload video</div><div class="text-xs text-ink/40 mt-1">MP4, WebM · Max 50MB</div></div>
                  <input id="vid-file" type="file" accept="video/*" class="hidden" onchange="previewVideo(event)">
                </div>
                <div id="vid-existing-url" class="hidden text-xs text-ink/50 bg-cream rounded-lg px-3 py-2 mt-2"></div>
              </div>
              <div id="video-url-area" class="hidden">
                <label class="text-xs font-semibold">URL Video</label>
                <input id="f-video-url" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="https://youtube.com/watch?v=... atau https://...">
              </div>
            </div>

            <!-- PDF -->
            <div id="section-pdf" class="hidden space-y-3">
              <div>
                <label class="text-xs font-semibold">Sumber PDF</label>
                <div class="flex gap-2 mt-1">
                  <label class="flex-1 border border-ink/20 rounded-lg p-2 text-xs cursor-pointer has-[:checked]:border-navy has-[:checked]:bg-navy-light text-center">
                    <input type="radio" name="pdf-src" value="upload" checked onchange="onPdfSrcChange()" class="mr-1">📤 Upload PDF
                  </label>
                  <label class="flex-1 border border-ink/20 rounded-lg p-2 text-xs cursor-pointer has-[:checked]:border-navy has-[:checked]:bg-navy-light text-center">
                    <input type="radio" name="pdf-src" value="url" onchange="onPdfSrcChange()" class="mr-1">🔗 URL / Google Drive
                  </label>
                </div>
              </div>
              <div id="pdf-upload-area">
                <div id="pdf-drop" class="border-2 border-dashed border-ink/20 rounded-xl p-6 text-center cursor-pointer hover:border-navy transition-colors" onclick="document.getElementById('pdf-file').click()">
                  <div id="pdf-name" class="hidden mb-2 text-sm font-semibold text-navy"></div>
                  <div id="pdf-placeholder"><div class="text-3xl mb-2">📄</div><div class="text-sm font-medium text-ink/60">Klik untuk upload PDF</div><div class="text-xs text-ink/40 mt-1">PDF · Max 20MB</div></div>
                  <input id="pdf-file" type="file" accept=".pdf" class="hidden" onchange="previewPdf(event)">
                </div>
                <div id="pdf-existing-url" class="hidden text-xs text-ink/50 bg-cream rounded-lg px-3 py-2 mt-2"></div>
              </div>
              <div id="pdf-url-area" class="hidden">
                <label class="text-xs font-semibold">URL PDF</label>
                <input id="f-pdf-url" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="https://... atau Google Drive share link">
              </div>
            </div>

            <!-- Article -->
            <div id="section-article" class="space-y-3">
              <div>
                <label class="text-xs font-semibold">Kandungan Teks</label>
                <textarea id="f-body" rows="6" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="Taip isi kandungan di sini..."></textarea>
              </div>
              <div>
                <label class="text-xs font-semibold">Link Luaran (optional)</label>
                <input id="f-url" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="https://...">
              </div>
            </div>

            <!-- Thumbnail -->
          <!-- Thumbnail -->
          <div id="section-thumbnail" class="hidden space-y-2">
            <label class="text-xs font-semibold">Gambar Thumbnail / Cover (optional)</label>
            <div class="flex items-center gap-3">
              <div id="thumb-preview-wrap" class="hidden">
                <img id="thumb-preview" class="h-16 w-24 object-cover rounded-lg border border-ink/10">
              </div>
              <label class="flex items-center gap-2 border border-dashed border-ink/20 rounded-lg px-4 py-2.5 cursor-pointer hover:border-navy text-sm text-ink/60 hover:text-navy transition-colors">
                <span>📷</span> <span id="thumb-label">Upload thumbnail</span>
                <input id="thumb-file" type="file" accept="image/*" class="hidden" onchange="previewThumb(event)">
              </label>
              <button id="thumb-clear" class="hidden text-xs text-terracotta" onclick="clearThumb()">× Buang</button>
            </div>
            <div id="thumb-existing-url" class="hidden text-xs text-ink/50 bg-cream rounded-lg px-3 py-2"></div>
          </div>

          <!-- Akses Pakej -->
          <div class="border-t border-ink/10 pt-4">
            <label class="text-xs font-semibold">🔒 Akses Pakej</label>
            <p class="text-[10px] text-ink/50 mb-2">Pilih pakej yang boleh akses content ni. Kosongkan semua = visible kepada semua patient.</p>

            <!-- Visibility toggle: Public vs Private -->
            <div class="flex items-center gap-2 mb-3 p-1 bg-cream/60 rounded-lg w-fit">
              <button type="button" id="btn-vis-public" onclick="setVisibility('public')"
                class="px-4 py-1.5 rounded-md text-xs font-semibold transition-all">
                🌐 Public (semua patient)
              </button>
              <button type="button" id="btn-vis-private" onclick="setVisibility('private')"
                class="px-4 py-1.5 rounded-md text-xs font-semibold transition-all">
                🔒 Pakej tertentu sahaja
              </button>
            </div>

            <div id="pkg-checkbox-list" class="grid grid-cols-2 md:grid-cols-3 gap-2"></div>
            <div id="pkg-quick-actions" class="hidden flex items-center gap-3 mt-2">
              <button type="button" onclick="togglePkgAll(true)" class="text-[10px] text-navy hover:underline">✓ Pilih semua</button>
              <button type="button" onclick="togglePkgAll(false)" class="text-[10px] text-ink/60 hover:underline">✕ Kosongkan</button>
            </div>
          </div>

          <!-- Card Appearance -->
          <div class="border-t border-ink/10 pt-4 grid grid-cols-3 gap-3">
            <div>
              <label class="text-xs font-semibold">Icon (emoji)</label>
              <input id="f-icon" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" value="📄">
            </div>
            <div>
              <label class="text-xs font-semibold">Kategori (warna)</label>
              <select id="f-cat" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm bg-white focus:border-navy outline-none">
                <option value="navy">Navy</option>
                <option value="green">Green</option>
                <option value="terracotta">Terracotta</option>
                <option value="gold">Gold</option>
                <option value="teal">Teal</option>
                <option value="ink">Ink</option>
              </select>
            </div>
            <div>
              <label class="text-xs font-semibold">Gradient</label>
              <input id="f-gradient" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" value="from-navy to-teal">
            </div>
          </div>

          <!-- Upload progress -->
          <div id="upload-progress" class="hidden bg-navy-light rounded-lg px-4 py-3 text-sm text-navy font-medium">
            <div class="flex items-center gap-2"><span class="animate-spin">⏳</span> <span id="upload-progress-text">Mengupload...</span></div>
          </div>

          <div id="form-error" class="hidden text-xs text-terracotta bg-terracotta/10 rounded-lg p-3"></div>

          <div class="sticky bottom-0 bg-cream/95 backdrop-blur-sm border-t border-ink/10 -mx-4 md:-mx-8 px-4 md:px-8 py-3 flex justify-end gap-2 z-10">
            <button onclick="window.location.href='library.html'" class="px-4 py-2.5 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5">Batal</button>
            <button id="save-btn" onclick="saveItem()" class="bg-navy text-white px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-navy-dark">Simpan</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const BUCKET = 'library-media';
let imgFile = null, vidFile = null, pdfFile = null, thumbFile = null;
let allPackages = [];

async function loadPackageList(selectedIds) {
  const { data } = await window.db.from('psy_packages')
    .select('package_id, name').eq('is_active', true).order('sort_order', { ascending: true });
  allPackages = data || [];
  const selected = new Set(selectedIds || []);
  document.getElementById('pkg-checkbox-list').innerHTML = allPackages.map(p => `
    <label class="flex items-center gap-2 text-xs px-3 py-2 border border-ink/15 rounded cursor-pointer hover:bg-cream">
      <input type="checkbox" class="pkg-check accent-navy" value="${p.package_id}" ${selected.has(p.package_id) ? 'checked' : ''}>
      <span class="font-semibold">${p.package_id}</span>
      <span class="text-ink/60 truncate">${(p.name || '').slice(0, 30)}</span>
    </label>
  `).join('') || '<p class="text-[10px] text-ink/40">Tiada pakej aktif</p>';
}

function togglePkgAll(check) {
  document.querySelectorAll('.pkg-check').forEach(el => el.checked = check);
}

function collectPackageIds() {
  if (currentVisibility !== 'private') return [];  // public → empty
  return Array.from(document.querySelectorAll('.pkg-check:checked')).map(el => el.value);
}

let currentVisibility = 'public';

function setVisibility(mode) {
  currentVisibility = mode;
  const pub = document.getElementById('btn-vis-public');
  const priv = document.getElementById('btn-vis-private');
  if (mode === 'public') {
    pub.className = 'px-4 py-1.5 rounded-md text-xs font-semibold bg-white text-green-dark shadow';
    priv.className = 'px-4 py-1.5 rounded-md text-xs font-semibold text-ink/50 hover:text-ink';
    document.getElementById('pkg-checkbox-list').classList.add('opacity-40','pointer-events-none');
    document.getElementById('pkg-quick-actions').classList.add('hidden');
    togglePkgAll(false);
  } else {
    pub.className = 'px-4 py-1.5 rounded-md text-xs font-semibold text-ink/50 hover:text-ink';
    priv.className = 'px-4 py-1.5 rounded-md text-xs font-semibold bg-white text-navy shadow';
    document.getElementById('pkg-checkbox-list').classList.remove('opacity-40','pointer-events-none');
    document.getElementById('pkg-quick-actions').classList.remove('hidden');
  }
}

function getMediaType() { return document.querySelector('input[name="media-type"]:checked')?.value || 'article'; }

function onMediaTypeChange() {
  const t = getMediaType();
  document.getElementById('section-article').classList.toggle('hidden',   t !== 'article');
  document.getElementById('section-image').classList.toggle('hidden',     t !== 'image');
  document.getElementById('section-video').classList.toggle('hidden',     t !== 'video');
  document.getElementById('section-pdf').classList.toggle('hidden',       t !== 'pdf');
  document.getElementById('section-thumbnail').classList.toggle('hidden', t === 'image' || t === 'article');
  const labels = { article: 'Article · 5 min', image: 'Infografik', video: 'Video · 8 min', pdf: 'Worksheet · PDF' };
  if (!document.getElementById('f-type').value) document.getElementById('f-type').placeholder = labels[t] || '';
  const icons = { article: '📝', image: '🖼️', video: '🎥', pdf: '📄' };
  if (document.getElementById('f-icon').value === '📄' || !document.getElementById('f-icon').value)
    document.getElementById('f-icon').value = icons[t];
}

function onVideoSrcChange() {
  const src = document.querySelector('input[name="video-src"]:checked')?.value || 'upload';
  document.getElementById('video-upload-area').classList.toggle('hidden', src !== 'upload');
  document.getElementById('video-url-area').classList.toggle('hidden',   src === 'upload');
}

function onPdfSrcChange() {
  const src = document.querySelector('input[name="pdf-src"]:checked')?.value || 'upload';
  document.getElementById('pdf-upload-area').classList.toggle('hidden', src !== 'upload');
  document.getElementById('pdf-url-area').classList.toggle('hidden',   src === 'upload');
}

function previewImage(e) {
  const file = e.target.files[0]; if (!file) return;
  imgFile = file;
  document.getElementById('img-preview').src = URL.createObjectURL(file);
  document.getElementById('img-preview-wrap').classList.remove('hidden');
  document.getElementById('img-placeholder').classList.add('hidden');
}

function previewVideo(e) {
  const file = e.target.files[0]; if (!file) return;
  vidFile = file;
  document.getElementById('vid-preview').src = URL.createObjectURL(file);
  document.getElementById('vid-preview-wrap').classList.remove('hidden');
  document.getElementById('vid-placeholder').classList.add('hidden');
}

function previewPdf(e) {
  const file = e.target.files[0]; if (!file) return;
  pdfFile = file;
  document.getElementById('pdf-name').textContent = '📄 ' + file.name;
  document.getElementById('pdf-name').classList.remove('hidden');
  document.getElementById('pdf-placeholder').classList.add('hidden');
}

function previewThumb(e) {
  const file = e.target.files[0]; if (!file) return;
  thumbFile = file;
  document.getElementById('thumb-preview').src = URL.createObjectURL(file);
  document.getElementById('thumb-preview-wrap').classList.remove('hidden');
  document.getElementById('thumb-label').textContent = file.name;
  document.getElementById('thumb-clear').classList.remove('hidden');
}

function clearThumb() {
  thumbFile = null;
  document.getElementById('thumb-file').value = '';
  document.getElementById('thumb-preview-wrap').classList.add('hidden');
  document.getElementById('thumb-label').textContent = 'Upload thumbnail';
  document.getElementById('thumb-clear').classList.add('hidden');
}

async function uploadFile(file, folder) {
  const ext  = file.name.split('.').pop();
  const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await window.db.storage.from(BUCKET).upload(path, file, { upsert: false });
  if (error) throw new Error('Upload gagal: ' + error.message);
  const { data } = window.db.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

async function saveItem() {
  const editId    = document.getElementById('edit-id').value;
  const title     = document.getElementById('f-title').value.trim();
  const mediaType = getMediaType();
  const errEl     = document.getElementById('form-error');
  errEl.classList.add('hidden');
  if (!title) { errEl.textContent = 'Title wajib diisi'; errEl.classList.remove('hidden'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  const prog = document.getElementById('upload-progress');
  const progText = document.getElementById('upload-progress-text');

  try {
    let contentUrl = null, thumbnailUrl = null;

    if (mediaType === 'image') {
      if (!imgFile && !editId) throw new Error('Sila upload gambar');
      if (imgFile) { prog.classList.remove('hidden'); progText.textContent = 'Mengupload gambar...'; contentUrl = await uploadFile(imgFile, 'images'); }
    } else if (mediaType === 'video') {
      const vsrc = document.querySelector('input[name="video-src"]:checked')?.value || 'upload';
      if (vsrc === 'upload') {
        if (!vidFile && !editId) throw new Error('Sila upload video');
        if (vidFile) { prog.classList.remove('hidden'); progText.textContent = 'Mengupload video...'; contentUrl = await uploadFile(vidFile, 'videos'); }
      } else {
        contentUrl = document.getElementById('f-video-url').value.trim() || null;
      }
    } else if (mediaType === 'pdf') {
      const psrc = document.querySelector('input[name="pdf-src"]:checked')?.value || 'upload';
      if (psrc === 'upload') {
        if (!pdfFile && !editId) throw new Error('Sila upload PDF');
        if (pdfFile) { prog.classList.remove('hidden'); progText.textContent = 'Mengupload PDF...'; contentUrl = await uploadFile(pdfFile, 'pdfs'); }
      } else {
        contentUrl = document.getElementById('f-pdf-url').value.trim() || null;
      }
    } else {
      contentUrl = document.getElementById('f-url').value.trim() || null;
    }

    if (thumbFile) { progText.textContent = 'Mengupload thumbnail...'; prog.classList.remove('hidden'); thumbnailUrl = await uploadFile(thumbFile, 'thumbnails'); }
    prog.classList.add('hidden');

    const data = {
      title,
      description:  document.getElementById('f-desc').value.trim() || null,
      content_type: document.getElementById('f-type').value.trim() || null,
      category:     document.getElementById('f-cat').value,
      icon:         document.getElementById('f-icon').value || '📄',
      gradient:     document.getElementById('f-gradient').value || 'from-navy to-teal',
      content_body: mediaType === 'article' ? (document.getElementById('f-body').value.trim() || null) : null,
      package_ids: (function() { const ids = collectPackageIds(); return ids.length ? ids : null; })(),
      updated_at:   new Date().toISOString(),
    };
    if (contentUrl  !== null) data.content_url   = contentUrl;
    if (thumbnailUrl !== null) data.thumbnail_url = thumbnailUrl;

    if (editId) {
      await dbUpdate('psy_library_items', editId, data);
    } else {
      data.item_id = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40) + '-' + Date.now().toString(36);
      const { error } = await window.db.from('psy_library_items').insert(data);
      if (error) throw error;
    }

    await auditLog(editId ? 'library.updated' : 'library.created', title);
    banner('Kandungan disimpan ✓');
    setTimeout(() => { window.location.href = 'library.html'; }, 800);
  } catch (err) {
    prog.classList.add('hidden');
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan';
  }
}

(async () => {
  const user = await initStaff('library', '');
  if (!user) return;

  const params = new URLSearchParams(location.search);
  const editId = params.get('id');

  if (editId) {
    setPageTitle('Edit Kandungan', 'Kemaskini kandungan library');
    setHeaderBack('library.html', 'Kembali ke Library');
    document.getElementById('form-title').textContent = 'Edit Kandungan';
    document.getElementById('edit-id').value = editId;

    const { data: item } = await window.db.from('psy_library_items').select('*').eq('id', editId).single();
    if (!item) { banner('Item tidak ditemui', 'error'); return; }

    document.getElementById('f-title').value    = item.title || '';
    document.getElementById('f-desc').value     = item.description || '';
    document.getElementById('f-type').value     = item.content_type || '';
    document.getElementById('f-cat').value      = item.category || 'navy';
    document.getElementById('f-icon').value     = item.icon || '📄';
    document.getElementById('f-gradient').value = item.gradient || 'from-navy to-teal';
    document.getElementById('f-body').value     = item.content_body || '';

    let detectedType = 'article';
    if (item.content_url) {
      const u = item.content_url.toLowerCase();
      if (/\.(jpg|jpeg|png|gif|webp)/.test(u)) detectedType = 'image';
      else if (/\.(mp4|webm|mov)/.test(u) || u.includes('youtube') || u.includes('youtu.be')) detectedType = 'video';
      else if (/\.pdf/.test(u) || u.includes('drive.google.com')) detectedType = 'pdf';
    }
    document.querySelector(`input[name="media-type"][value="${detectedType}"]`).checked = true;

    if (item.content_url) {
      const short = item.content_url.length > 60 ? item.content_url.slice(0, 60) + '…' : item.content_url;
      if (detectedType === 'image') {
        document.getElementById('img-existing-url').textContent = 'Semasa: ' + short;
        document.getElementById('img-existing-url').classList.remove('hidden');
      } else if (detectedType === 'video') {
        document.getElementById('vid-existing-url').textContent = 'Semasa: ' + short;
        document.getElementById('vid-existing-url').classList.remove('hidden');
        document.getElementById('f-video-url').value = item.content_url;
      } else if (detectedType === 'pdf') {
        document.getElementById('pdf-existing-url').textContent = 'Semasa: ' + short;
        document.getElementById('pdf-existing-url').classList.remove('hidden');
        document.getElementById('f-pdf-url').value = item.content_url;
      } else {
        document.getElementById('f-url').value = item.content_url;
      }
    }
    if (item.thumbnail_url) {
      document.getElementById('thumb-preview').src = item.thumbnail_url;
      document.getElementById('thumb-preview-wrap').classList.remove('hidden');
      document.getElementById('thumb-label').textContent = 'Tukar thumbnail';
      document.getElementById('thumb-clear').classList.remove('hidden');
      document.getElementById('thumb-existing-url').textContent = 'Thumbnail sedia ada';
      document.getElementById('thumb-existing-url').classList.remove('hidden');
    }
    onMediaTypeChange();
    onVideoSrcChange();
    onPdfSrcChange();
    await loadPackageList(item.package_ids);
    setVisibility(Array.isArray(item.package_ids) && item.package_ids.length > 0 ? 'private' : 'public');
  } else {
    setPageTitle('Tambah Kandungan', 'Cipta kandungan library baru');
    setHeaderBack('library.html', 'Kembali ke Library');
    onMediaTypeChange();
    onVideoSrcChange();
    onPdfSrcChange();
    await loadPackageList([]);
    setVisibility('public');
  }
})();
</script>
