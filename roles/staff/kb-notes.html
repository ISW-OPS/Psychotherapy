<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Nota Saya</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.kb-card{background:#fff;border:1px solid rgba(60,79,92,.10);border-radius:1rem;}
.note-card{transition:all .15s;border-left:3px solid var(--rpm);}
.note-card:hover{box-shadow:0 4px 14px rgba(15,46,95,.08);}
</style>
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📖</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
<div class="flex min-h-screen">
<aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
<main class="main-content flex-1 min-w-0">
<header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

<div class="p-4 md:p-8 space-y-5">
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-3">
    <div>
      <div class="text-xs text-ink/40 mb-1"><a href="kb-dashboard.html" class="hover:underline">Knowledge Hub</a> › <span class="text-navy font-semibold">Nota Saya</span></div>
      <h1 class="text-2xl font-bold text-ink">Nota Saya</h1>
      <p class="text-sm text-ink/55 mt-1">Nota peribadi anda. Hanya anda boleh lihat & urus.</p>
    </div>
    <button id="btn-new" class="self-start md:self-auto bg-navy text-white px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-navy-dark">+ Nota Baru</button>
  </div>

  <div class="grid grid-cols-1 xl:grid-cols-[1fr_300px] gap-6 items-start">
    <div>
      <div class="flex items-center gap-2 mb-4 flex-wrap">
        <div class="relative flex-1 min-w-[200px]">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/40">🔍</span>
          <input id="n-search" class="w-full pl-9 pr-3 py-2 rounded-xl border border-ink/15 text-sm focus:outline-none focus:border-navy/40" placeholder="Cari nota saya...">
        </div>
        <select id="n-label" class="px-3 py-2 rounded-xl border border-ink/15 text-sm bg-white"><option value="">Semua Label</option></select>
      </div>
      <div id="notes-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="col-span-full text-center text-xs text-ink/35 py-10">Memuatkan...</div>
      </div>
    </div>

    <div class="space-y-5">
      <div class="kb-card p-5">
        <h3 class="font-semibold text-sm text-ink mb-3">✍️ Nota Pantas</h3>
        <textarea id="quick-note" rows="3" maxlength="500" class="w-full px-3 py-2 border border-ink/15 rounded-lg text-sm" placeholder="Tulis nota pantas..."></textarea>
        <button id="quick-save" class="w-full mt-2 bg-navy text-white py-2 rounded-lg text-sm font-semibold">Simpan Nota</button>
      </div>
      <div class="kb-card p-5">
        <h3 class="font-semibold text-sm text-ink mb-3">📊 Statistik Nota</h3>
        <div id="note-stats"></div>
      </div>
    </div>
  </div>
</div>
</main>
</div>
</div>

<!-- Modal -->
<div id="note-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
  <div class="kb-card w-full max-w-lg p-6">
    <h3 id="nm-title" class="font-bold text-ink text-lg mb-4">Nota Baru</h3>
    <input type="hidden" id="nm-id">
    <div class="space-y-3">
      <input id="nm-name" class="w-full px-3 py-2 border border-ink/15 rounded-lg text-sm font-semibold" placeholder="Tajuk nota">
      <textarea id="nm-body" rows="6" class="w-full px-3 py-2 border border-ink/15 rounded-lg text-sm" placeholder="Kandungan nota..."></textarea>
      <div class="flex items-center gap-3">
        <select id="nm-label" class="flex-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
          <option value="">Tiada label</option>
          <option>Checklist</option><option>Clinical Notes</option><option>Communication</option>
          <option>Ideas</option><option>To-Do</option><option>Reference</option><option>Template</option>
          <option>Meeting Notes</option><option>Plan</option><option>Reminder</option>
        </select>
        <label class="flex items-center gap-1.5 text-sm text-ink/70"><input type="checkbox" id="nm-pin"> 📌 Pin</label>
      </div>
    </div>
    <div class="flex justify-between items-center mt-5">
      <button id="nm-del" class="hidden text-terracotta text-sm font-semibold">🗑️ Padam</button>
      <div class="flex gap-2 ml-auto">
        <button onclick="closeNote()" class="px-4 py-2 rounded-lg text-sm font-semibold border border-ink/15 text-ink/70">Batal</button>
        <button id="nm-save" class="px-4 py-2 rounded-lg text-sm font-semibold bg-navy text-white">Simpan</button>
      </div>
    </div>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script src="_kb.js"></script>
<script>
let NOTES = [];
const LABEL_CLS = {
  'Checklist': 'bg-green-light text-green-dark', 'Clinical Notes': 'bg-navy-light text-navy',
  'Communication': 'bg-teal/15 text-teal', 'Ideas': 'bg-gold/30 text-gold-dark',
  'To-Do': 'bg-terracotta/15 text-terracotta', 'Reference': 'bg-navy-light text-navy',
  'Template': 'bg-teal/15 text-teal', 'Meeting Notes': 'bg-gold/30 text-gold-dark',
  'Plan': 'bg-green-light text-green-dark', 'Reminder': 'bg-terracotta/15 text-terracotta',
};
const state = { q: '', label: '' };

function filtered() {
  let l = NOTES.slice();
  if (state.q) { const q = state.q.toLowerCase(); l = l.filter(n => (n.title || '').toLowerCase().includes(q) || (n.body || '').toLowerCase().includes(q)); }
  if (state.label) l = l.filter(n => n.label === state.label);
  l.sort((a, b) => (b.is_pinned - a.is_pinned) || (new Date(b.updated_at) - new Date(a.updated_at)));
  return l;
}

function render() {
  const list = filtered();
  document.getElementById('notes-grid').innerHTML = list.length ? list.map(n => `
    <div class="note-card kb-card p-4 cursor-pointer" onclick="editNote('${n.id}')">
      <div class="flex items-start justify-between gap-2">
        <h4 class="font-semibold text-ink text-[15px] leading-snug">${n.is_pinned ? '📌 ' : ''}${kbEsc(n.title)}</h4>
      </div>
      <p class="text-xs text-ink/60 mt-1 line-clamp-2 min-h-[32px]">${kbEsc((n.body || '').slice(0, 120))}</p>
      ${n.label ? `<span class="chip ${LABEL_CLS[n.label] || 'bg-ink/10 text-ink/60'} text-[10px] mt-2">${kbEsc(n.label)}</span>` : ''}
      <div class="text-[10px] text-ink/40 mt-2">🕒 ${formatDateTime(n.updated_at)}</div>
    </div>`).join('')
    : '<div class="col-span-full text-center text-xs text-ink/35 py-10">Belum ada nota. Cipta yang pertama →</div>';

  // stats
  const byLabel = {};
  NOTES.forEach(n => { const k = n.label || 'Lain-lain'; byLabel[k] = (byLabel[k] || 0) + 1; });
  const total = NOTES.length;
  document.getElementById('note-stats').innerHTML =
    `<div class="text-center mb-3"><div class="text-3xl font-bold text-navy">${total}</div><div class="text-[11px] text-ink/50">Jumlah Nota</div></div>` +
    Object.entries(byLabel).sort((a, b) => b[1] - a[1]).map(([k, v]) => {
      const pct = total ? Math.round(v / total * 100) : 0;
      return `<div class="flex justify-between text-[12px] py-0.5"><span class="text-ink/70">${kbEsc(k)}</span><span class="text-ink/50">${v} (${pct}%)</span></div>`;
    }).join('');
}

window.editNote = id => { const n = NOTES.find(x => x.id === id); openNote(n); };

function openNote(n) {
  document.getElementById('nm-title').textContent = n ? 'Edit Nota' : 'Nota Baru';
  document.getElementById('nm-id').value = n?.id || '';
  document.getElementById('nm-name').value = n?.title || '';
  document.getElementById('nm-body').value = n?.body || '';
  document.getElementById('nm-label').value = n?.label || '';
  document.getElementById('nm-pin').checked = !!n?.is_pinned;
  document.getElementById('nm-del').classList.toggle('hidden', !n);
  document.getElementById('note-modal').classList.remove('hidden');
}
window.closeNote = () => document.getElementById('note-modal').classList.add('hidden');

async function saveNote() {
  const id = document.getElementById('nm-id').value;
  const title = document.getElementById('nm-name').value.trim();
  if (!title) return banner('Sila masukkan tajuk.', 'error');
  const row = {
    title, body: document.getElementById('nm-body').value.trim(),
    label: document.getElementById('nm-label').value || null,
    is_pinned: document.getElementById('nm-pin').checked,
  };
  try {
    if (id) await dbUpdate('psy_kb_notes', id, row);
    else { row.user_id = window.currentUser.id; await dbInsert('psy_kb_notes', row); }
    closeNote(); banner('Disimpan.'); await reload();
  } catch (_) { banner('Gagal simpan', 'error'); }
}
async function delNote() {
  const id = document.getElementById('nm-id').value;
  if (!id || !confirm('Padam nota ini?')) return;
  try { await dbDelete('psy_kb_notes', id); closeNote(); banner('Dipadam.'); await reload(); }
  catch (_) { banner('Gagal padam', 'error'); }
}

async function reload() {
  const { data } = await window.db.from('psy_kb_notes').select('*').eq('user_id', window.currentUser.id).order('updated_at', { ascending: false });
  NOTES = data || [];
  const labels = [...new Set(NOTES.map(n => n.label).filter(Boolean))];
  document.getElementById('n-label').innerHTML = '<option value="">Semua Label</option>' + labels.map(l => `<option>${kbEsc(l)}</option>`).join('');
  render();
}

async function boot() {
  const u = await initStaff('kb_notes', 'Nota Saya');
  if (!u) return;
  document.getElementById('btn-new').onclick = () => openNote(null);
  document.getElementById('nm-save').onclick = saveNote;
  document.getElementById('nm-del').onclick = delNote;
  document.getElementById('n-search').addEventListener('input', e => { state.q = e.target.value; render(); });
  document.getElementById('n-label').addEventListener('change', e => { state.label = e.target.value; render(); });
  document.getElementById('quick-save').onclick = async () => {
    const body = document.getElementById('quick-note').value.trim();
    if (!body) return;
    try {
      await dbInsert('psy_kb_notes', { user_id: u.id, title: body.slice(0, 40), body, label: null });
      document.getElementById('quick-note').value = ''; banner('Nota disimpan.'); await reload();
    } catch (_) { banner('Gagal simpan', 'error'); }
  };
  await reload();
}
boot();
</script>
</body>
</html>
