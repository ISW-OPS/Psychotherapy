<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — My Letters</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
  .stat-card { background:white; border:1px solid rgba(0,0,0,0.08); border-radius:1rem; padding:16px; display:flex; align-items:center; gap:12px; transition: all 0.15s; cursor:pointer; }
  .stat-card.active { box-shadow: 0 0 0 2px #1a3a5c; background: #fffaf0; }
  .stat-card:hover:not(.active) { background: #fcfaf5; }
  .stat-icon { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .rtab { padding:10px 4px; font-size:13px; font-weight:600; color:rgba(0,0,0,0.5); border-bottom:2px solid transparent; background:transparent; white-space:nowrap; }
  .rtab.active { color:#1e3a5f; border-bottom-color:#1e3a5f; }
</style>
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📄</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">
        <div class="text-xs text-ink/40">
          <a href="surat.html" class="hover:text-navy hover:underline">Surat Rasmi</a> <span class="mx-1">›</span>
          <span class="text-ink/70 font-medium">My Letters</span>
        </div>

        <div class="flex items-center justify-between gap-3 flex-wrap">
          <div>
            <h2 class="text-xl font-bold text-navy">My Letters</h2>
            <p class="text-xs text-ink/50 mt-0.5">Status semua surat yang anda pernah mohon.</p>
          </div>
          <a href="surat-request-new.html" class="bg-navy text-white text-sm px-4 py-2.5 rounded-xl font-semibold hover:bg-navy-dark flex-shrink-0">+ Letter Request</a>
        </div>

        <!-- Stat cards -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
          <button onclick="setTab('all')" data-st="all" class="stat-card active text-left">
            <div class="stat-icon bg-navy/10 text-navy">📄</div>
            <div><div class="text-[11px] text-ink/50">Jumlah Surat</div><div id="st-total" class="text-xl font-bold text-ink">0</div></div>
          </button>
          <button onclick="setTab('pending')" data-st="pending" class="stat-card text-left">
            <div class="stat-icon bg-gold/15 text-gold-dark">⏳</div>
            <div><div class="text-[11px] text-ink/50">Menunggu Kelulusan</div><div id="st-pending" class="text-xl font-bold text-ink">0</div></div>
          </button>
          <button onclick="setTab('action')" data-st="action" class="stat-card text-left">
            <div class="stat-icon bg-teal/15 text-teal">✏️</div>
            <div><div class="text-[11px] text-ink/50">Draf / Perlu Tindakan</div><div id="st-action" class="text-xl font-bold text-ink">0</div></div>
          </button>
          <button onclick="setTab('done')" data-st="done" class="stat-card text-left">
            <div class="stat-icon bg-green-light text-green-dark">✓</div>
            <div><div class="text-[11px] text-ink/50">Selesai</div><div id="st-done" class="text-xl font-bold text-ink">0</div></div>
          </button>
          <button onclick="setTab('rejected')" data-st="rejected" class="stat-card text-left">
            <div class="stat-icon bg-terracotta/15 text-terracotta">✕</div>
            <div><div class="text-[11px] text-ink/50">Ditolak / Batal</div><div id="st-rejected" class="text-xl font-bold text-ink">0</div></div>
          </button>
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 overflow-visible">
          <div class="flex items-center gap-1 px-5 border-b border-ink/8 overflow-x-auto">
            <button onclick="setTab('all')" id="rtab-all" class="rtab active">Semua</button>
            <button onclick="setTab('pending')" id="rtab-pending" class="rtab">Menunggu Kelulusan</button>
            <button onclick="setTab('action')" id="rtab-action" class="rtab">Draf &amp; Tindakan</button>
            <button onclick="setTab('done')" id="rtab-done" class="rtab">Selesai</button>
            <button onclick="setTab('rejected')" id="rtab-rejected" class="rtab">Ditolak</button>
          </div>

          <div class="flex items-center gap-2 p-4 flex-wrap">
            <div class="relative flex-1 min-w-[220px]">
              <input id="search-box" type="text" placeholder="Cari nama surat, tujuan, atau penerima..." oninput="renderTable()" class="w-full border border-ink/20 rounded-xl pl-9 pr-3 py-2.5 text-sm outline-none focus:border-navy">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/30 text-sm">🔍</span>
            </div>
            <div class="relative">
              <button onclick="toggleFilterPanel()" class="border border-ink/20 text-ink/70 px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-cream">⚙ Filter</button>
              <div id="filter-panel" class="hidden absolute right-0 mt-1 bg-white border border-ink/10 rounded-xl shadow-lg p-4 z-20 w-64 space-y-3">
                <div>
                  <label class="text-[11px] font-semibold text-ink/60 mb-1 block">Dari Tarikh</label>
                  <input id="filter-from" type="date" class="w-full border border-ink/20 rounded-lg px-2.5 py-2 text-sm outline-none focus:border-navy">
                </div>
                <div>
                  <label class="text-[11px] font-semibold text-ink/60 mb-1 block">Hingga Tarikh</label>
                  <input id="filter-to" type="date" class="w-full border border-ink/20 rounded-lg px-2.5 py-2 text-sm outline-none focus:border-navy">
                </div>
                <div class="flex gap-2">
                  <button onclick="resetDateFilter()" class="flex-1 border border-ink/20 text-ink/60 py-2 rounded-lg text-xs font-semibold hover:bg-cream">Reset</button>
                  <button onclick="applyDateFilter()" class="flex-1 bg-navy text-white py-2 rounded-lg text-xs font-semibold hover:bg-navy-dark">Guna</button>
                </div>
              </div>
            </div>
            <button onclick="exportCsv()" class="bg-navy text-white px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-navy-dark">⬇ Export</button>
          </div>

          <div class="overflow-x-auto min-h-[360px]">
            <table class="w-full text-sm">
              <thead>
                <tr class="text-left text-[11px] uppercase text-ink/40 border-y border-ink/8">
                  <th class="px-5 py-2.5 font-semibold">#</th>
                  <th class="px-3 py-2.5 font-semibold">Nama Surat</th>
                  <th class="px-3 py-2.5 font-semibold">Tujuan</th>
                  <th class="px-3 py-2.5 font-semibold">Penerima</th>
                  <th class="px-3 py-2.5 font-semibold">Tarikh Mohon</th>
                  <th class="px-3 py-2.5 font-semibold">Status</th>
                  <th class="px-3 py-2.5 font-semibold">Kemaskini</th>
                  <th class="px-5 py-2.5 font-semibold text-right">Tindakan</th>
                </tr>
              </thead>
              <tbody id="rows-body"></tbody>
            </table>
            <div id="empty-state" class="hidden text-center text-ink/40 text-sm py-10">Tiada surat ditemui.</div>
          </div>

          <div class="flex items-center justify-between px-5 py-3 border-t border-ink/8 text-xs text-ink/50">
            <span id="pg-info">—</span>
            <div id="pg-controls" class="flex items-center gap-1"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/letterTemplates.js"></script>
<script src="_shared.js"></script>
<script>
function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
const LOGO_URL = '../../image/Logo_ISW.png';

async function viewLetter(id) {
  const { data: rows } = await window.db.from('psy_letter_issued').select('*').eq('id', id).limit(1);
  const l = rows?.[0];
  if (!l) { banner('Surat tidak ditemui', 'error'); return; }
  const { data: tplRows } = await window.db.from('psy_letter_templates').select('*').eq('name', l.template_name).limit(1);
  const tpl = tplRows?.[0] || { name: l.template_name, body: '', recipient: '', title: l.template_name };
  const html = renderLetterFull({
    logoUrl: LOGO_URL, template: tpl, values: l.field_values || {},
    refNumber: l.ref_number,
    signerName: l.signed_by_name, signerRole: l.signed_by_role || '',
    signatureDataUrl: l.signature_url || null,
    todayStr: new Date(l.signed_at).toLocaleDateString(LCALE(), { day: '2-digit', month: 'long', year: 'numeric' }),
  });
  openLetterTab(html, l.template_name + ' — ' + l.ref_number);
}
window.viewLetter = viewLetter;

function escHtml(str) { return (str || '').replace(/</g,'&lt;'); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString(LCALE(), { day: '2-digit', month: 'short', year: 'numeric' }) : '—'; }

const STATUS_CHIP = {
  draft:              { label: 'Draf',                cls: 'bg-ink/10 text-ink/60' },
  submitted:          { label: 'Menunggu',             cls: 'bg-gold/15 text-gold-dark' },
  pending_approval:   { label: 'Menunggu Kelulusan',   cls: 'bg-gold/15 text-gold-dark' },
  revision_requested: { label: 'Perlu Semakan Anda',   cls: 'bg-teal/15 text-teal' },
  rejected:           { label: 'Ditolak',              cls: 'bg-terracotta/15 text-terracotta' },
  issued:             { label: 'Selesai',              cls: 'bg-green-light text-green-dark' },
  cancelled:          { label: 'Dibatalkan',           cls: 'bg-ink/10 text-ink/50' },
};

let allRequests = [];   // psy_letter_requests milik user, digabung dgn issuedId/refNumber kalau status=issued
let currentTab = 'all';
let currentPage = 1;
const PAGE_SIZE = 10;
let dateFrom = null, dateTo = null;

function toggleFilterPanel() { document.getElementById('filter-panel').classList.toggle('hidden'); }
function applyDateFilter() {
  dateFrom = document.getElementById('filter-from').value || null;
  dateTo = document.getElementById('filter-to').value || null;
  document.getElementById('filter-panel').classList.add('hidden');
  currentPage = 1;
  renderTable();
}
window.applyDateFilter = applyDateFilter;
function resetDateFilter() {
  dateFrom = null; dateTo = null;
  document.getElementById('filter-from').value = '';
  document.getElementById('filter-to').value = '';
  document.getElementById('filter-panel').classList.add('hidden');
  currentPage = 1;
  renderTable();
}
window.resetDateFilter = resetDateFilter;
document.addEventListener('click', e => {
  const panel = document.getElementById('filter-panel');
  if (!panel || panel.classList.contains('hidden')) return;
  if (!panel.contains(e.target) && e.target.id !== 'filter-panel') {
    if (!e.target.closest('#filter-panel') && e.target.textContent.indexOf('Filter') === -1) panel.classList.add('hidden');
  }
});

function setTab(t) {
  currentTab = t;
  currentPage = 1;
  ['all','pending','action','done','rejected'].forEach(id => {
    document.getElementById('rtab-' + id)?.classList.toggle('active', id === t);
  });
  document.querySelectorAll('.stat-card').forEach(c => c.classList.toggle('active', c.dataset.st === t));
  renderTable();
}
window.setTab = setTab;

function matchesTab(r, tab) {
  if (tab === 'all') return true;
  if (tab === 'pending') return ['submitted','pending_approval'].includes(r.status);
  if (tab === 'action') return ['draft','revision_requested'].includes(r.status);
  if (tab === 'done') return r.status === 'issued';
  if (tab === 'rejected') return ['rejected','cancelled'].includes(r.status);
  return true;
}

function updateStats() {
  document.getElementById('st-total').textContent = allRequests.length;
  document.getElementById('st-pending').textContent = allRequests.filter(r => matchesTab(r, 'pending')).length;
  document.getElementById('st-action').textContent = allRequests.filter(r => matchesTab(r, 'action')).length;
  document.getElementById('st-done').textContent = allRequests.filter(r => matchesTab(r, 'done')).length;
  document.getElementById('st-rejected').textContent = allRequests.filter(r => matchesTab(r, 'rejected')).length;
}

function getFilteredRows() {
  const q = (document.getElementById('search-box').value || '').toLowerCase().trim();
  return allRequests.filter(r => {
    if (!matchesTab(r, currentTab)) return false;
    if (q && !(`${r.template_name} ${r.reason || ''} ${r.recipient || ''}`.toLowerCase().includes(q))) return false;
    if (dateFrom && r.created_at < dateFrom) return false;
    if (dateTo && r.created_at > (dateTo + 'T23:59:59')) return false;
    return true;
  });
}

function rowActionsHtml(r) {
  const editable = ['draft','revision_requested'].includes(r.status);
  const cancellable = ['draft','submitted','pending_approval'].includes(r.status);
  let menu = `<a href="surat-request-detail.html?id=${r.id}" class="block w-full text-left px-3 py-1.5 text-xs hover:bg-cream">👁 Lihat Detail</a>`;
  if (r.status === 'issued' && r._issuedId) menu += `<button onclick="viewLetter('${r._issuedId}')" class="block w-full text-left px-3 py-1.5 text-xs hover:bg-cream">🖨 Buka / Cetak</button>`;
  if (editable) menu += `<a href="surat-request-new.html?edit=${r.id}" class="block w-full text-left px-3 py-1.5 text-xs hover:bg-cream">✏️ Edit</a>`;
  if (cancellable) menu += `<button onclick="cancelRequest('${r.id}')" class="block w-full text-left px-3 py-1.5 text-xs hover:bg-cream text-terracotta">Batal</button>`;
  return `
    <div class="flex items-center justify-end">
      <div class="relative inline-block">
        <button onclick="toggleRowMenu(event, '${r.id}')" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-ink/8 text-ink/50">⋯</button>
        <div id="menu-${r.id}" class="hidden absolute right-0 mt-1 bg-white border border-ink/10 rounded-xl shadow-lg py-1 z-20 w-44">${menu}</div>
      </div>
    </div>`;
}

function toggleRowMenu(e, id) {
  e.stopPropagation();
  document.querySelectorAll('[id^="menu-"]').forEach(m => { if (m.id !== 'menu-' + id) m.classList.add('hidden'); });
  document.getElementById('menu-' + id)?.classList.toggle('hidden');
}
window.toggleRowMenu = toggleRowMenu;
document.addEventListener('click', () => document.querySelectorAll('[id^="menu-"]').forEach(m => m.classList.add('hidden')));

function renderTable() {
  updateStats();
  const filtered = getFilteredRows();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageRows = filtered.slice(start, start + PAGE_SIZE);

  const tbody = document.getElementById('rows-body');
  const empty = document.getElementById('empty-state');
  if (!pageRows.length) {
    tbody.innerHTML = '';
    empty.classList.remove('hidden');
  } else {
    empty.classList.add('hidden');
    tbody.innerHTML = pageRows.map((r, i) => {
      const chip = STATUS_CHIP[r.status] || { label: r.status, cls: 'bg-ink/10 text-ink/60' };
      return `
      <tr class="border-b border-ink/6 hover:bg-cream/30">
        <td class="px-5 py-3 text-ink/50">${start + i + 1}</td>
        <td class="px-3 py-3 font-semibold text-ink">${escHtml(r.template_name)}</td>
        <td class="px-3 py-3 text-ink/70 max-w-[220px] truncate" title="${escHtml(r.reason || '')}">${escHtml(r.reason || '—')}</td>
        <td class="px-3 py-3 text-ink/70 max-w-[160px] truncate" title="${escHtml(r.recipient || '')}">${escHtml(r.recipient || '—')}</td>
        <td class="px-3 py-3 text-ink/60 whitespace-nowrap">${fmtDate(r.created_at)}</td>
        <td class="px-3 py-3"><span class="text-[10px] font-semibold px-2 py-1 rounded-full ${chip.cls}">${chip.label}</span></td>
        <td class="px-3 py-3 text-ink/60 whitespace-nowrap">${fmtDate(r.updated_at)}</td>
        <td class="px-5 py-3">${rowActionsHtml(r)}</td>
      </tr>`;
    }).join('');
  }

  document.getElementById('pg-info').textContent = filtered.length
    ? `Showing ${start + 1} to ${Math.min(start + PAGE_SIZE, filtered.length)} of ${filtered.length} results`
    : 'Tiada rekod';

  const pg = document.getElementById('pg-controls');
  if (totalPages <= 1) { pg.innerHTML = ''; }
  else {
    let html = `<button onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="w-7 h-7 rounded-lg border border-ink/15 disabled:opacity-30 hover:bg-cream">‹</button>`;
    for (let p = 1; p <= totalPages; p++) {
      html += `<button onclick="goPage(${p})" class="w-7 h-7 rounded-lg text-xs font-semibold ${p === currentPage ? 'bg-navy text-white' : 'border border-ink/15 hover:bg-cream'}">${p}</button>`;
    }
    html += `<button onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="w-7 h-7 rounded-lg border border-ink/15 disabled:opacity-30 hover:bg-cream">›</button>`;
    pg.innerHTML = html;
  }
}

function goPage(p) {
  const filtered = getFilteredRows();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  renderTable();
}
window.goPage = goPage;

async function cancelRequest(id) {
  if (!confirm('Batalkan permohonan ini?')) return;
  try {
    await window.db.from('psy_letter_requests').update({ status: 'cancelled', updated_at: new Date().toISOString() }).eq('id', id);
    banner('Permohonan dibatalkan');
    await loadList();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}
window.cancelRequest = cancelRequest;

function exportCsv() {
  const rows = getFilteredRows();
  const header = ['Nama Surat','Tujuan','Penerima','Tarikh Mohon','Status','Kemaskini'];
  const lines = [header.join(',')];
  rows.forEach(r => {
    const chip = STATUS_CHIP[r.status] || { label: r.status };
    const cells = [r.template_name, r.reason || '', r.recipient || '', fmtDate(r.created_at), chip.label, fmtDate(r.updated_at)]
      .map(v => `"${String(v).replace(/"/g, '""')}"`);
    lines.push(cells.join(','));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'my-letters.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
window.exportCsv = exportCsv;

async function loadList() {
  const { data: mine } = await window.db.from('psy_letter_requests').select('*')
    .eq('requested_by_staff_id', window.currentUser.id).order('created_at', { ascending: false });
  const reqs = mine || [];
  const issuedReqIds = reqs.filter(r => r.status === 'issued').map(r => r.id);
  const issuedMap = {};
  if (issuedReqIds.length) {
    const { data: issued } = await window.db.from('psy_letter_issued').select('id, request_id').in('request_id', issuedReqIds);
    (issued || []).forEach(l => { issuedMap[l.request_id] = l.id; });
  }
  allRequests = reqs.map(r => ({ ...r, _issuedId: issuedMap[r.id] || null }));
  renderTable();
}

(async () => {
  const user = await initStaff('surat_request', 'My Letters');
  if (!user) return;
  await loadList();
})();
</script>
</body>
</html>
