<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Catalog Bimbingan & Aktiviti</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📚</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-6">

        <!-- Filter -->
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="setTab('bimbingan')" id="tab-bimbingan" class="tab-btn active">Bimbingan / Calling</button>
          <button onclick="setTab('aktiviti')"  id="tab-aktiviti"  class="tab-btn">Aktiviti / Rawatan</button>
          <input id="search" type="text" oninput="render()" placeholder="Cari..." class="border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none ml-auto">
          <button onclick="openForm(null)" data-rbac="coaching.create" class="bg-navy text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark">+ Tambah</button>
        </div>

        <div id="list" class="space-y-1.5"></div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Modal -->
<div id="form-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
    <div class="px-6 py-4 border-b border-ink/10 flex items-center justify-between">
      <h3 id="form-title" class="font-bold text-base">Tambah Item</h3>
      <button onclick="closeForm()" class="text-ink/40 hover:text-ink text-2xl leading-none">&times;</button>
    </div>
    <div class="p-6 space-y-3">
      <div>
        <label class="text-xs font-semibold text-ink/60 mb-1 block">Nama <span class="text-terracotta">*</span></label>
        <input id="f-name" type="text" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-ink/60 mb-1 block">Jenis <span class="text-terracotta">*</span></label>
          <select id="f-type" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none">
            <option value="bimbingan">Bimbingan</option>
            <option value="aktiviti">Aktiviti</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-ink/60 mb-1 block">Kategori</label>
          <input id="f-category" type="text" placeholder="cth: Terapi" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none">
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/60 mb-1 block">Description</label>
        <textarea id="f-desc" rows="2" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none resize-none"></textarea>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-ink/10 flex gap-3">
      <button onclick="closeForm()" class="flex-1 border border-ink/20 text-ink/60 py-2.5 rounded-xl text-sm">Batal</button>
      <button onclick="saveItem()" class="flex-1 bg-navy text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-navy-dark">Simpan</button>
    </div>
  </div>
</div>

<style>
.tab-btn { padding: 0.5rem 1rem; font-size: 0.75rem; font-weight: 600; color: rgba(0,0,0,0.5); border: 1px solid rgba(0,0,0,0.12); border-radius: 9999px; background: white; }
.tab-btn.active { background: #1e3a5f; color: white; border-color: #1e3a5f; }
</style>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let allItems = [];
let currentTab = 'bimbingan';
let editingId = null;

function setTab(t) {
  currentTab = t;
  ['bimbingan','aktiviti'].forEach(k =>
    document.getElementById('tab-' + k).classList.toggle('active', k === t));
  render();
}

async function load() {
  const { data } = await window.db.from('psy_coaching_catalog')
    .select('*').order('type').order('sort_order').order('name');
  allItems = data || [];
  render();
}

function render() {
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  let items = allItems.filter(it => it.type === currentTab);
  if (q) items = items.filter(it =>
    (it.name || '').toLowerCase().includes(q) ||
    (it.category || '').toLowerCase().includes(q)
  );
  const list = document.getElementById('list');
  if (!items.length) {
    list.innerHTML = '<div class="text-center text-ink/40 text-sm py-10">Tiada item dalam kategori ini.</div>';
    return;
  }
  // Group by category
  const byCat = {};
  items.forEach(it => {
    const cat = it.category || 'Tanpa Kategori';
    if (!byCat[cat]) byCat[cat] = [];
    byCat[cat].push(it);
  });

  list.innerHTML = Object.entries(byCat).map(([cat, list]) => `
    <div class="mb-4">
      <div class="text-[10px] font-bold text-ink/45 uppercase tracking-wider mb-1.5 pb-1 border-b border-ink/10">${escapeHtmlSafe(cat)}</div>
      <div class="space-y-1">
        ${list.map(it => `
          <div class="flex items-center gap-2 px-3 py-2 bg-cream/30 rounded-lg ${!it.is_active ? 'opacity-50' : ''}">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium truncate">${escapeHtmlSafe(it.name)}</div>
              ${it.description ? `<div class="text-[11px] text-ink/55 truncate">${escapeHtmlSafe(it.description)}</div>` : ''}
            </div>
            <button onclick="toggleActive('${it.id}', ${!it.is_active})" data-rbac="coaching.edit" class="text-[11px] ${it.is_active ? 'text-ink/50 hover:text-gold-dark' : 'text-green-dark hover:underline'}">${it.is_active ? 'Nyahaktif' : 'Aktif'}</button>
            <button onclick="openForm('${it.id}')" data-rbac="coaching.edit" class="text-[11px] text-navy hover:underline">Edit</button>
            <button onclick="deleteItem('${it.id}')" data-rbac="coaching.delete" class="text-[11px] text-terracotta hover:underline">Buang</button>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function escapeHtmlSafe(s) { return String(s || '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function openForm(id) {
  editingId = id;
  const it = id ? allItems.find(x => x.id === id) : null;
  document.getElementById('form-title').textContent = it ? 'Edit Item' : 'Tambah Item';
  document.getElementById('f-name').value = it?.name || '';
  document.getElementById('f-type').value = it?.type || currentTab;
  document.getElementById('f-category').value = it?.category || '';
  document.getElementById('f-desc').value = it?.description || '';
  document.getElementById('form-modal').classList.remove('hidden');
}

function closeForm() {
  document.getElementById('form-modal').classList.add('hidden');
  editingId = null;
}

async function saveItem() {
  const name = document.getElementById('f-name').value.trim();
  const type = document.getElementById('f-type').value;
  if (!name) { banner('Nama wajib diisi', 'error'); return; }
  const data = {
    name, type,
    category:    document.getElementById('f-category').value.trim() || null,
    description: document.getElementById('f-desc').value.trim() || null,
    updated_at:  new Date().toISOString(),
  };
  try {
    let err;
    if (editingId) {
      ({ error: err } = await window.db.from('psy_coaching_catalog').update(data).eq('id', editingId));
    } else {
      ({ error: err } = await window.db.from('psy_coaching_catalog').insert({
        ...data,
        created_by: window.currentUser.id,
        created_by_name: window.currentUser.full_name,
      }));
    }
    if (err) throw err;
    banner('Disimpan');
    closeForm();
    load();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

async function toggleActive(id, newState) {
  try {
    const { error: err } = await window.db.from('psy_coaching_catalog').update({ is_active: newState, updated_at: new Date().toISOString() }).eq('id', id);
    if (err) throw err;
    banner(newState ? 'Diaktifkan' : 'Dinyahaktif');
    load();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

async function deleteItem(id) {
  if (!confirm('Buang item ini? Pakej yang guna item ni akan kekal tunjuk nama (snapshot).')) return;
  try {
    const { error: err } = await window.db.from('psy_coaching_catalog').delete().eq('id', id);
    if (err) throw err;
    banner('Dibuang');
    load();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

(async () => {
  const user = await initStaff('coaching_catalog', 'Catalog Bimbingan & Aktiviti');
  if (!user) return;
  load();
})();
</script>
</body>
</html>
