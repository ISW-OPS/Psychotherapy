<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Affiliate</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🤝</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-4">

        <div class="flex items-start justify-between gap-3 flex-wrap">
          <div>
            <h1 class="text-xl font-bold text-ink flex items-center gap-2">🤝 Affiliate</h1>
            <p class="text-sm text-ink/45 mt-0.5">Komisen rujukan pesakit & bayaran keluar.</p>
          </div>
        </div>

        <!-- Stat ringkasan -->
        <div id="aff-stats" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>

        <div class="flex items-center gap-1 border-b border-ink/10 overflow-x-auto">
          <button data-st="" onclick="setStatusTab('')" class="st-tab px-4 py-2 text-xs font-semibold whitespace-nowrap border-b-2 border-navy text-navy">All <span class="st-count text-[10px] opacity-70"></span></button>
          <button data-st="qualified" onclick="setStatusTab('qualified')" class="st-tab px-4 py-2 text-xs font-semibold whitespace-nowrap border-b-2 border-transparent text-ink/55 hover:text-ink">Permohonan <span class="st-count text-[10px] opacity-70"></span></button>
          <button data-st="processing" onclick="setStatusTab('processing')" class="st-tab px-4 py-2 text-xs font-semibold whitespace-nowrap border-b-2 border-transparent text-ink/55 hover:text-ink">Diproses <span class="st-count text-[10px] opacity-70"></span></button>
          <button data-st="paid" onclick="setStatusTab('paid')" class="st-tab px-4 py-2 text-xs font-semibold whitespace-nowrap border-b-2 border-transparent text-ink/55 hover:text-ink">Done <span class="st-count text-[10px] opacity-70"></span></button>
          <button data-st="void" onclick="setStatusTab('void')" class="st-tab px-4 py-2 text-xs font-semibold whitespace-nowrap border-b-2 border-transparent text-ink/55 hover:text-ink">Cancel <span class="st-count text-[10px] opacity-70"></span></button>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <input id="ref-search" oninput="renderReferrals()" type="text" placeholder="🔍 Cari perujuk atau rujukan…" class="flex-1 min-w-[200px] border border-ink/15 rounded-lg px-3 py-2 text-sm bg-white outline-none focus:border-navy">
          <button data-rbac="affiliate.edit" onclick="exportCsv()" class="text-sm font-semibold px-3.5 py-2 rounded-lg border border-ink/15 text-ink/70 hover:bg-ink/5 whitespace-nowrap">⬇ Eksport CSV</button>
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-ink/8 bg-ink/[0.015] text-[10px] uppercase tracking-wider text-ink/45">
                <th class="text-left px-5 py-3">Perujuk</th>
                <th class="text-left px-3 py-3">Rujukan</th>
                <th class="text-left px-3 py-3">Pakej</th>
                <th class="text-left px-3 py-3 w-28">Komisen</th>
                <th class="text-left px-3 py-3">Maklumat Bank</th>
                <th class="text-left px-3 py-3 w-32">Status</th>
                <th class="text-left px-3 py-3 w-32">Tarikh Layak</th>
                <th class="text-right px-5 py-3">Aksi</th>
              </tr>
            </thead>
            <tbody id="ref-tbody" class="divide-y divide-ink/5"></tbody>
          </table>
          <div id="ref-empty" class="hidden py-16 text-center text-sm text-ink/40">Tiada rujukan.</div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- Modal: Tandakan Dibayar -->
<div id="pay-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-start justify-center p-4 overflow-y-auto">
  <div class="bg-white rounded-2xl w-full max-w-md my-16 shadow-xl" onclick="event.stopPropagation()">
    <div class="px-6 py-4 border-b border-ink/10 flex items-center justify-between gap-4">
      <h3 class="font-bold text-ink">Tandakan Dibayar</h3>
      <button onclick="closePayModal()" class="w-8 h-8 rounded-lg hover:bg-ink/5 text-ink/50 flex items-center justify-center text-lg">✕</button>
    </div>
    <div class="px-6 py-5 space-y-3">
      <div>
        <label class="text-xs font-semibold text-ink/60">Rujukan Transaksi (No. Resit Bank)</label>
        <input id="pay-ref" type="text" placeholder="cth TXN20260724001" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm outline-none focus:border-navy">
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/60">Nota (pilihan)</label>
        <textarea id="pay-note" rows="2" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm outline-none focus:border-navy"></textarea>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-ink/10 flex justify-end gap-2">
      <button onclick="closePayModal()" class="px-4 py-2 rounded-lg text-sm font-semibold border border-ink/15 text-ink/60 hover:bg-ink/5">Batal</button>
      <button onclick="confirmMarkPaid()" class="px-4 py-2 rounded-lg text-sm font-semibold bg-navy text-white hover:bg-navy-dark">Sahkan Dibayar</button>
    </div>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/utils.js"></script>
<script src="_shared.js"></script>
<script>
    function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString(LCALE(),{day:'2-digit',month:'short',year:'numeric'}); }
function fmtRM(n){ return 'RM ' + (Number(n)||0).toFixed(2); }

const REF_STATUS_MAP = {
  qualified:  { lbl:'Permohonan — Belum Bayar', cls:'bg-amber-100 text-amber-700' },
  processing: { lbl:'Diproses', cls:'bg-blue-100 text-blue-700' },
  paid:       { lbl:'Done',     cls:'bg-green-100 text-green-700' },
  void:       { lbl:'Cancel',   cls:'bg-terracotta/15 text-terracotta' },
};

let allReferrals = [];
let statusTab = '';
let me = null;

// Status paparan gabungkan status rujukan asas + status payout terkait
// (1 rujukan = paling banyak 1 payout — bukan batch berbilang lagi).
// Nota: 'pending' (pesakit dirujuk belum bayar, komisen belum tentu)
// sengaja tak dipaparkan langsung di sini — ditapis di loadAll().
function refDisplayStatus(r) {
  if (r.status === 'void') return 'void';
  if (r.status === 'qualified') {
    if (r.payout_id) {
      if (r.payout?.status === 'paid') return 'paid';
      if (r.payout?.status === 'processing') return 'processing';
    }
    return 'qualified';
  }
  return r.status;
}

async function loadAll() {
  const { data: refs } = await window.db.from('psy_referrals')
    .select('*, referrer:referrer_patient_id(full_name, mrn, referral_code, bank_name, bank_account_no, bank_account_holder), referee:referee_patient_id(full_name, mrn), pkg:qualifying_package_id(name), payout:payout_id(id, status, payout_ref, bank_snapshot)')
    .neq('status', 'pending')
    .order('created_at', { ascending: false }).limit(500);
  allReferrals = refs || [];
  renderStats();
  renderReferrals();
}

function renderStats() {
  const withStatus = allReferrals.map(r => ({ r, ds: refDisplayStatus(r) }));
  const qualified = withStatus.filter(x => x.ds === 'qualified');
  const processing = withStatus.filter(x => x.ds === 'processing');
  const paid = withStatus.filter(x => x.ds === 'paid');
  const belumBayar = qualified.reduce((s, x) => s + Number(x.r.commission_amount || 0), 0);
  const dahBayar = paid.reduce((s, x) => s + Number(x.r.commission_amount || 0), 0);

  document.getElementById('aff-stats').innerHTML = [
    statCard('Rujukan Komisen', qualified.length + processing.length + paid.length, 'jumlah rujukan layak komisen', 'navy'),
    statCard('Belum Dibayar', fmtRM(belumBayar), 'komisen tertunggak', 'gold'),
    statCard('Dah Dibayar', fmtRM(dahBayar), 'komisen selesai', 'green'),
    statCard('Bayaran Dalam Proses', processing.length, 'perlu tindakan', 'terracotta'),
  ].join('');
}

// Mulakan bayaran untuk SATU rujukan (1 rujukan = 1 payout).
async function startPayout(referralId) {
  const r = allReferrals.find(x => x.id === referralId);
  if (!r) return;
  const p = r.referrer || {};
  if (!p.bank_name) { banner('Pesakit belum lengkapkan maklumat bank', 'error'); return; }
  if (!confirm(`Mulakan bayaran ${fmtRM(r.commission_amount)} untuk ${p.full_name || p.mrn || 'pesakit ini'}?`)) return;
  const { data: payout, error } = await window.db.from('psy_affiliate_payouts').insert({
    patient_id: r.referrer_patient_id,
    amount: r.commission_amount,
    bank_snapshot: {
      bank_name: p.bank_name,
      bank_account_no: p.bank_account_no,
      bank_account_holder: p.bank_account_holder,
    },
  }).select().single();
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  const { error: e2 } = await window.db.from('psy_referrals').update({ payout_id: payout.id }).eq('id', r.id);
  if (e2) { banner('Ralat: ' + e2.message, 'error'); return; }
  banner('Bayaran dimulakan — klik "Selesai" selepas transfer siap');
  await loadAll();
}
window.startPayout = startPayout;

function csvEscape(v) {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadCsv(filename, rows) {
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' }); // BOM supaya Excel baca UTF-8 betul
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// Eksport senarai komisen Permohonan + Diproses (utk staff buat transfer bank
// manual / rekod). Tak cetus apa-apa payout — muat turun je.
function exportCsv() {
  const rows = [['Perujuk', 'MRN', 'Bank', 'No. Akaun', 'Nama Pemegang', 'Amaun (RM)', 'Status']];
  allReferrals.forEach(r => {
    const ds = refDisplayStatus(r);
    if (ds !== 'qualified' && ds !== 'processing') return;
    const bank = r.payout?.bank_snapshot?.bank_name ? r.payout.bank_snapshot : (r.referrer || {});
    rows.push([
      r.referrer?.full_name || r.referrer?.mrn || '',
      r.referrer?.mrn || '',
      bank.bank_name || '',
      bank.bank_account_no || '',
      bank.bank_account_holder || r.referrer?.full_name || '',
      Number(r.commission_amount || 0).toFixed(2),
      ds === 'processing' ? 'Diproses' : 'Permohonan',
    ]);
  });
  if (rows.length === 1) { banner('Tiada rekod Permohonan/Diproses untuk dieksport', 'error'); return; }
  downloadCsv(`affiliate-komisen-${new Date().toISOString().slice(0, 10)}.csv`, rows);
}
window.exportCsv = exportCsv;

function setStatusTab(s) {
  statusTab = s;
  document.querySelectorAll('.st-tab').forEach(b => {
    const on = b.dataset.st === s;
    b.classList.toggle('border-navy', on); b.classList.toggle('text-navy', on);
    b.classList.toggle('border-transparent', !on); b.classList.toggle('text-ink/55', !on);
  });
  renderReferrals();
}
window.setStatusTab = setStatusTab;

function renderReferrals() {
  const q = (document.getElementById('ref-search').value || '').toLowerCase().trim();
  const withStatus = allReferrals.map(r => ({ r, ds: refDisplayStatus(r) }));

  document.querySelectorAll('.st-tab').forEach(b => {
    const s = b.dataset.st;
    const n = s ? withStatus.filter(x => x.ds === s).length : withStatus.length;
    b.querySelector('.st-count').textContent = n ? n : '';
  });

  let list = statusTab ? withStatus.filter(x => x.ds === statusTab) : withStatus;
  if (q) list = list.filter(({ r }) => {
    const a = (r.referrer?.full_name || r.referrer?.mrn || '').toLowerCase();
    const b = (r.referee?.full_name || r.referee?.mrn || '').toLowerCase();
    return a.includes(q) || b.includes(q);
  });

  const tbody = document.getElementById('ref-tbody');
  const empty = document.getElementById('ref-empty');
  if (!list.length) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  tbody.innerHTML = list.map(({ r, ds }) => {
    const st = REF_STATUS_MAP[ds] || REF_STATUS_MAP.qualified;
    const bank = r.payout?.bank_snapshot?.bank_name ? r.payout.bank_snapshot : (r.referrer || {});
    const bankTxt = bank.bank_name
      ? `${esc(bank.bank_name)} · ${esc(bank.bank_account_no || '')}`
      : '<span class="text-ink/30">—</span>';

    let actions = '';
    if (ds === 'qualified') {
      actions += `<button data-rbac="affiliate.edit" onclick="startPayout('${r.id}')" class="text-[11px] px-2 py-1 rounded-lg bg-navy text-white hover:bg-navy-dark mr-1.5">Mulakan Bayaran</button>`;
    }
    if (ds === 'processing') {
      actions += `<button data-rbac="affiliate.edit" onclick="openPayModal('${r.payout.id}')" class="text-[11px] px-2 py-1 rounded-lg bg-green-100 text-green-700 hover:bg-green-200 mr-1.5">Selesai</button>
        <button data-rbac="affiliate.delete" onclick="rejectPayout('${r.payout.id}')" class="text-[11px] px-2 py-1 rounded-lg border border-terracotta/40 text-terracotta hover:bg-terracotta/5 mr-1.5">Tolak</button>`;
    }
    if (ds === 'paid') {
      actions += `<span class="text-[11px] text-ink/40">Ref: ${esc(r.payout?.payout_ref || '—')}</span>`;
    }
    if (ds === 'qualified') {
      actions += `<button data-rbac="affiliate.edit" onclick="voidRef('${r.id}')" class="text-[11px] px-2 py-1 rounded-lg border border-terracotta/40 text-terracotta hover:bg-terracotta/5">Cancel</button>`;
    }
    if (ds === 'void') {
      actions += `<button data-rbac="affiliate.delete" onclick="deleteRef('${r.id}')" class="text-[11px] px-2 py-1 rounded-lg text-terracotta hover:bg-terracotta/5">🗑 Padam</button>`;
    }

    return `<tr class="hover:bg-cream/30">
      <td class="px-5 py-3">
        <div class="font-semibold text-ink">${esc(r.referrer?.full_name || r.referrer?.mrn || '—')}</div>
        <div class="text-[11px] text-ink/40">${esc(r.referrer?.mrn || '')} · ${esc(r.code_used || '')}</div>
      </td>
      <td class="px-3 py-3">
        <div class="text-ink/80">${esc(r.referee?.full_name || r.referee?.mrn || '—')}</div>
        <div class="text-[11px] text-ink/40">${esc(r.referee?.mrn || '')}</div>
      </td>
      <td class="px-3 py-3 text-ink/70">${esc(r.pkg?.name || '—')}</td>
      <td class="px-3 py-3 font-semibold text-ink">${r.commission_amount ? fmtRM(r.commission_amount) : '—'}</td>
      <td class="px-3 py-3 text-ink/60">${bankTxt}</td>
      <td class="px-3 py-3"><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${st.cls}">${st.lbl}</span></td>
      <td class="px-3 py-3 text-ink/60">${fmtDate(r.qualified_at)}</td>
      <td class="px-5 py-3 text-right whitespace-nowrap">${actions}</td>
    </tr>`;
  }).join('');
}
window.renderReferrals = renderReferrals;

async function voidRef(id) {
  if (!confirm('Batalkan rujukan ini? Komisen tidak akan dikira.')) return;
  const { error } = await window.db.from('psy_referrals').update({ status: 'void' }).eq('id', id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  banner('Rujukan dibatalkan'); await loadAll();
}
window.voidRef = voidRef;

// Buang KEKAL rekod rujukan yang dah Cancel (+ payout berkaitan kalau ada,
// cth payout 'rejected' yang tinggal terpaut). Hanya untuk rekod Cancel —
// rujukan aktif/dah dibayar tak boleh dipadam (jaga audit trail).
async function deleteRef(id) {
  const r = allReferrals.find(x => x.id === id);
  if (!r) return;
  if (!confirm('PADAM rekod ini secara KEKAL? Tindakan ini TIDAK BOLEH DIBUAT ASAL.')) return;
  if (r.payout_id) {
    const { error: ep } = await window.db.from('psy_affiliate_payouts').delete().eq('id', r.payout_id);
    if (ep) { banner('Ralat buang payout berkaitan: ' + ep.message, 'error'); return; }
  }
  const { error } = await window.db.from('psy_referrals').delete().eq('id', id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  banner('Rekod dipadam'); await loadAll();
}
window.deleteRef = deleteRef;

// Tolak payout yg sedang Diproses — buka semula rujukan (payout_id=null)
// supaya ia kembali ke status "Permohonan — Belum Bayar" & boleh diproses semula.
async function rejectPayout(id) {
  if (!confirm('Batalkan bayaran ini? Rujukan akan kembali ke status "Permohonan — Belum Bayar".')) return;
  const { error: e1 } = await window.db.from('psy_referrals').update({ payout_id: null }).eq('payout_id', id);
  if (e1) { banner('Ralat: ' + e1.message, 'error'); return; }
  const { error: e2 } = await window.db.from('psy_affiliate_payouts').update({ status: 'rejected', processed_at: new Date().toISOString(), processed_by: me }).eq('id', id);
  if (e2) { banner('Ralat: ' + e2.message, 'error'); return; }
  banner('Permohonan ditolak'); await loadAll();
}
window.rejectPayout = rejectPayout;

let payModalId = null;
function openPayModal(id) {
  payModalId = id;
  document.getElementById('pay-ref').value = '';
  document.getElementById('pay-note').value = '';
  document.getElementById('pay-modal').classList.remove('hidden');
}
window.openPayModal = openPayModal;
function closePayModal() {
  document.getElementById('pay-modal').classList.add('hidden');
  payModalId = null;
}
window.closePayModal = closePayModal;

async function confirmMarkPaid() {
  if (!payModalId) return;
  const payout_ref = document.getElementById('pay-ref').value.trim();
  const note = document.getElementById('pay-note').value.trim();
  const { error } = await window.db.from('psy_affiliate_payouts').update({
    status: 'paid', payout_ref, note, processed_at: new Date().toISOString(), processed_by: me,
  }).eq('id', payModalId);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }
  banner('Bayaran ditandakan selesai ✅');
  closePayModal();
  await loadAll();
}
window.confirmMarkPaid = confirmMarkPaid;

(async () => {
  const user = await initStaff('affiliate', 'Komisen rujukan pesakit & bayaran keluar');
  if (!user) return;
  me = window.currentUser?.id || user.id;
  await loadAll();
})();
</script>
