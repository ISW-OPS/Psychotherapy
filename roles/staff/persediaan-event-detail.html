<!-- Halaman ni dah digabung ke tab "Persediaan Event" dalam acara-detail.html
     (senarai barang + tugasan + sidebar status kini satu tempat). Redirect

  location.replace(eventId ? `acara-detail.html?id=${eventId}#persediaan` : 'events.html');
</script>
