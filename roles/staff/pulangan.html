<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Pulangan Botol</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🍯</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-4">

        <!-- Filter tabs -->
        <div class="flex gap-2 flex-wrap items-center">
          <button onclick="setFilter('pending')"  id="f-pending"  class="filter-btn active">⏳ Pending <span id="cnt-pending" class="ml-1 px-1.5 py-0.5 bg-white/30 rounded-full text-[10px]">0</span></button>
          <button onclick="setFilter('all')"      id="f-all"      class="filter-btn">Semua <span id="cnt-all" class="ml-1 px-1.5 py-0.5 bg-ink/10 rounded-full text-[10px]">0</span></button>
          <button onclick="setFilter('received')" id="f-received" class="filter-btn">✅ Diterima <span id="cnt-received" class="ml-1 px-1.5 py-0.5 bg-ink/10 rounded-full text-[10px]">0</span></button>
          <button onclick="setFilter('rejected')" id="f-rejected" class="filter-btn">❌ Ditolak <span id="cnt-rejected" class="ml-1 px-1.5 py-0.5 bg-ink/10 rounded-full text-[10px]">0</span></button>
          <button onclick="openManualModal()" data-rbac="pulangan.edit" class="ml-auto bg-navy text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-navy-dark">➕ Rekod Pulangan (Staff)</button>
        </div>

        <div id="list" class="space-y-3">
          <div class="text-center text-ink/40 text-sm py-10">Memuatkan...</div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal: staff key-in pulangan bagi pihak pesakit -->
<div id="manual-modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="font-bold text-ink">🍯 Rekod Pulangan Botol (Staff)</h2>
      <button onclick="closeManualModal()" class="text-ink/40 hover:text-ink text-xl leading-none">×</button>
    </div>
    <p class="text-xs text-ink/50">Untuk pesakit yang hantar/bawa botol terus tanpa guna borang app. Staff isi bagi pihak pesakit.</p>

    <!-- Pilih pesakit -->
    <div>
      <label class="block text-xs font-semibold text-ink/70 mb-1.5">Pesakit <span class="text-terracotta">*</span></label>
      <div id="mm-pat-picker" class="relative">
        <input id="mm-pat-search" type="text" autocomplete="off" placeholder="🔍 Taip nama / MRN pesakit…"
          oninput="mmFilterPatients()" onfocus="mmFilterPatients()"
          class="w-full border border-ink/15 rounded-lg px-3 py-2.5 text-sm bg-white outline-none focus:border-navy">
        <div id="mm-pat-dropdown" class="hidden absolute z-20 top-full left-0 right-0 mt-1 bg-white border border-ink/10 rounded-xl shadow-lg max-h-56 overflow-y-auto"></div>
      </div>
      <div id="mm-pat-selected" class="hidden flex items-center justify-between gap-2 border border-navy/20 bg-navy/5 rounded-lg px-3 py-2">
        <span id="mm-pat-selected-name" class="text-sm font-semibold text-ink"></span>
        <button onclick="mmClearPatient()" class="text-[11px] text-terracotta hover:underline">Tukar</button>
      </div>
    </div>

    <!-- Kuantiti -->
    <div>
      <label class="block text-xs font-semibold text-ink/70 mb-1.5">Kuantiti Botol <span class="text-terracotta">*</span></label>
      <input id="mm-qty" type="number" value="1" min="1" max="100" class="w-32 border border-ink/15 rounded-lg px-3 py-2 text-sm outline-none focus:border-navy">
    </div>

    <!-- Syarat -->
    <div>
      <label class="block text-xs font-semibold text-ink/70 mb-1.5">Sahkan Syarat Botol <span class="text-terracotta">*</span></label>
      <div class="space-y-1.5">
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="mm-c-tidak-berkarat" class="w-4 h-4 accent-navy"> Tidak berkarat</label>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="mm-c-bersih" class="w-4 h-4 accent-navy"> Bersih</label>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="mm-c-getah" class="w-4 h-4 accent-navy"> Getah pada botol masih ada</label>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="mm-c-besi" class="w-4 h-4 accent-navy"> Besi penutup kemas</label>
      </div>
    </div>

    <!-- Foto (optional - staff dah nampak botol terus) -->
    <div>
      <label class="block text-xs font-semibold text-ink/70 mb-1.5">Foto Bukti (optional)</label>
      <input id="mm-photos" type="file" accept="image/*" multiple
        class="w-full border border-dashed border-ink/20 rounded-lg px-3 py-2 text-xs">
    </div>

    <!-- Nota -->
    <div>
      <label class="block text-xs font-semibold text-ink/70 mb-1.5">Nota (optional)</label>
      <textarea id="mm-notes" rows="2" class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm outline-none focus:border-navy resize-none"></textarea>
    </div>

    <div class="flex gap-2 pt-2">
      <button onclick="closeManualModal()" class="flex-1 border border-ink/15 text-ink/70 rounded-lg px-4 py-2.5 text-sm font-semibold">Batal</button>
      <button id="mm-submit-btn" onclick="submitManualReturn()" class="flex-1 bg-navy text-white rounded-lg px-4 py-2.5 text-sm font-semibold hover:bg-navy-dark">Simpan</button>
    </div>
  </div>
</div>

<style>
.filter-btn { padding: 0.5rem 1rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; background: white; border: 1px solid rgba(0,0,0,0.12); transition: all .15s; display: inline-flex; align-items: center; }
.filter-btn.active { background: #1e3a5f; color: white; border-color: #1e3a5f; }
</style>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
    function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
function openPhotoLightbox(url) {
  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[100] bg-black/85 flex items-center justify-center p-4 cursor-zoom-out';
  overlay.onclick = () => overlay.remove();
  overlay.innerHTML = `
    <button class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white text-xl flex items-center justify-center" onclick="event.stopPropagation(); this.parentElement.remove()">×</button>
    <a href="${url}" target="_blank" onclick="event.stopPropagation()" class="absolute bottom-4 right-4 text-white/70 hover:text-white text-xs underline bg-black/30 px-3 py-1.5 rounded-full">Buka tab baru ↗</a>
    <img src="${url}" alt="foto" class="max-w-full max-h-full object-contain rounded-lg" onclick="event.stopPropagation()">`;
  document.body.appendChild(overlay);
  const onEsc = e => { if (e.key === 'Escape') overlay.remove(); };
  document.addEventListener('keydown', onEsc, { once: true });
}

let allReturns = [];
let allMsgs = [];
let currentFilter = 'pending';

const CRITERIA_LABEL = {
  tidak_berkarat: 'Tidak berkarat',
  bersih:         'Bersih',
  getah_ada:      'Getah ada',
  besi_kemas:     'Besi penutup kemas',
};

function setFilter(f) {
  currentFilter = f;
  ['pending','all','received','rejected'].forEach(k =>
    document.getElementById('f-' + k).classList.toggle('active', k === f));
  renderList();
}

async function loadReturns() {
  const [retRes, msgRes] = await Promise.all([
    window.db.from('psy_bottle_returns').select('*').order('created_at', { ascending: false }),
    window.db.from('psy_audit_log').select('*').eq('action', 'bottle_return.message').order('created_at', { ascending: true }),
  ]);
  allReturns = retRes.data || [];
  allMsgs = msgRes.data || [];

  // Update counts
  document.getElementById('cnt-all').textContent      = allReturns.length;
  document.getElementById('cnt-pending').textContent  = allReturns.filter(r => r.status === 'pending').length;
  document.getElementById('cnt-received').textContent = allReturns.filter(r => r.status === 'received').length;
  document.getElementById('cnt-rejected').textContent = allReturns.filter(r => r.status === 'rejected').length;

  renderList();
}

function renderList() {
  const filtered = currentFilter === 'all' ? allReturns : allReturns.filter(r => r.status === currentFilter);
  const list = document.getElementById('list');
  if (!filtered.length) {
    list.innerHTML = `<div class="text-center text-ink/40 text-sm py-10">Tiada pulangan dalam kategori "${currentFilter}"</div>`;
    return;
  }

  list.innerHTML = filtered.map(r => {
    const msgs = allMsgs.filter(m => m.meta?.return_id === r.id);
    const date = new Date(r.created_at).toLocaleDateString(LCALE(), { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const statusChip = r.status === 'received'
      ? '<span class="chip bg-green-light text-green-dark text-[10px]">✅ Diterima</span>'
      : r.status === 'rejected'
        ? '<span class="chip bg-terracotta/15 text-terracotta text-[10px]">❌ Ditolak</span>'
        : '<span class="chip bg-gold/15 text-gold-dark text-[10px]">⏳ Pending Verify</span>';

    const photos = (r.photo_urls || []).map(url =>
      `<img src="${url}" onclick="openPhotoLightbox('${url}')" class="h-20 w-20 object-cover rounded border border-ink/10 cursor-zoom-in hover:opacity-90">`
    ).join('');

    const criteria = Object.entries(r.criteria_confirmed || {}).map(([k, v]) =>
      `<span class="inline-flex items-center gap-1 text-[11px] ${v ? 'text-green-dark' : 'text-terracotta'}">
        ${v ? '✓' : '✗'} ${CRITERIA_LABEL[k] || k}
      </span>`
    ).join(' · ');

    const verifyInfo = r.verified_at ? `
      <div class="text-[11px] text-ink/50 mt-2">
        Diverify oleh <span class="font-semibold">${r.verified_by_name || '—'}</span> pada ${new Date(r.verified_at).toLocaleDateString(LCALE(),{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
      </div>` : '';

    const rejectReason = r.status === 'rejected' && r.reject_reason ? `
      <div class="mt-3 text-xs bg-terracotta/10 text-terracotta px-3 py-2 rounded-lg">
        <span class="font-semibold">Alasan tolak:</span> ${(r.reject_reason || '').replace(/</g,'&lt;')}
      </div>` : '';

    const msgsHtml = msgs.length ? `
      <div class="mt-3 space-y-2">
        ${msgs.map(m => {
          const fromStaff = m.actor_role === 'staff';
          const t = new Date(m.created_at).toLocaleString(LCALE(), { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
          return `<div class="${fromStaff ? 'bg-navy/5 border-navy/10' : 'bg-cream border-ink/10'} border rounded-xl p-3">
            <div class="text-[10px] ${fromStaff ? 'text-navy' : 'text-ink/60'} font-bold mb-1">${fromStaff ? '↩ Staff' : 'Patient'} · ${m.actor_name} · ${t}</div>
            <p class="text-sm whitespace-pre-wrap">${(m.meta?.message || '').replace(/</g,'&lt;')}</p>
          </div>`;
        }).join('')}
      </div>` : '';

    const actions = r.status === 'pending' ? `
      <div class="flex gap-2 mt-3 pt-3 border-t border-ink/10 flex-wrap">
        <input id="msg-${r.id}" type="text" placeholder="Sembang dengan patient..."
          class="flex-1 min-w-[200px] border border-ink/20 rounded-lg px-3 py-2 text-xs outline-none focus:border-navy"
          onkeydown="if(event.key==='Enter')sendMessage('${r.id}')">
        <button onclick="sendMessage('${r.id}')" data-rbac="pulangan.edit" class="bg-navy text-white px-3 py-2 rounded-lg text-xs font-semibold">Hantar</button>
        <button onclick="verifyReturn('${r.id}', 'received')" data-rbac="pulangan.edit" class="bg-green-dark text-white px-3 py-2 rounded-lg text-xs font-semibold hover:opacity-90">✅ Terima</button>
        <button onclick="verifyReturn('${r.id}', 'rejected')" data-rbac="pulangan.edit" class="bg-terracotta text-white px-3 py-2 rounded-lg text-xs font-semibold hover:opacity-90">❌ Tolak</button>
      </div>` : '';

    return `<div class="bg-white rounded-xl border border-ink/15 p-4">
      <div class="flex items-center justify-between gap-2 flex-wrap mb-2">
        <div>
          <div class="font-semibold text-sm">🍯 ${r.patient_name} · ${r.qty} botol</div>
          <div class="text-[11px] text-ink/50">${date}</div>
        </div>
        ${statusChip}
      </div>
      <div class="text-[11px] mt-1">${criteria}</div>
      ${r.notes ? `<p class="text-xs text-ink/60 mt-2 italic">"${(r.notes || '').replace(/</g,'&lt;')}"</p>` : ''}
      <div class="flex gap-2 mt-3 flex-wrap">${photos}</div>
      ${verifyInfo}
      ${rejectReason}
      ${msgsHtml}
      ${actions}
    </div>`;
  }).join('');
}

async function sendMessage(returnId) {
  const input = document.getElementById('msg-' + returnId);
  const text = input.value.trim();
  if (!text) return;
  try {
    const { error: msgErr } = await window.db.from('psy_audit_log').insert({
      actor_id: window.currentUser.id,
      actor_name: window.currentUser.full_name,
      actor_role: window.currentUser.role,
      action: 'bottle_return.message',
      target: returnId,
      meta: { return_id: returnId, message: text },
    });
    if (msgErr) throw msgErr;
    // Notify patient
    const ret = allReturns.find(r => r.id === returnId);
    if (ret) {
      const { data: patientRow } = await window.db.from('psy_patients').select('user_id').eq('id', ret.patient_id).single();
      if (patientRow?.user_id) {
        await notify(patientRow.user_id, 'system', '🍯 Mesej Baru — Pulangan Botol', text, 'pulangan.html');
      }
    }
    input.value = '';
    loadReturns();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

async function verifyReturn(returnId, action) {
  const isReject = action === 'rejected';
  let reason = null;
  if (isReject) {
    reason = prompt('Alasan tolak (wajib):');
    if (!reason || !reason.trim()) return;
  } else {
    if (!confirm('Sahkan botol dah diterima & memenuhi syarat?')) return;
  }

  try {
    const { error: vrErr } = await window.db.from('psy_bottle_returns').update({
      status: action,
      reject_reason: isReject ? reason.trim() : null,
      verified_by: window.currentUser.id,
      verified_by_name: window.currentUser.full_name,
      verified_at: new Date().toISOString(),
      updated_at: new Date().toISOString(),
    }).eq('id', returnId);
    if (vrErr) throw vrErr;

    // Notify patient
    const ret = allReturns.find(r => r.id === returnId);
    if (ret) {
      const { data: patientRow } = await window.db.from('psy_patients').select('user_id').eq('id', ret.patient_id).single();
      if (patientRow?.user_id) {
        await notify(
          patientRow.user_id, 'system',
          isReject ? '❌ Pulangan Ditolak' : '✅ Pulangan Diterima',
          isReject ? `Alasan: ${reason.trim()}` : `Terima kasih — ${ret.qty} botol diterima.`,
          'pulangan.html'
        );
      }
    }

    banner(isReject ? 'Pulangan ditolak' : 'Pulangan diterima ✅');
    loadReturns();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

// ── Rekod manual oleh staff (key-in bagi pihak pesakit) ──────────────
let mmPatients = [];
let mmSelPatient = null;

async function mmLoadPatients() {
  if (mmPatients.length) return;
  const { data } = await window.db.from('psy_patients')
    .select('id, full_name, mrn, user_id, status, psy_profiles!psy_patients_user_id_fkey(full_name, phone, email)')
    .not('status', 'in', '("deleted","rejected")')
    .order('full_name', { ascending: true }).limit(2000);
  mmPatients = data || [];
}

function mmFilterPatients() {
  const q = (document.getElementById('mm-pat-search').value || '').toLowerCase().trim();
  const dd = document.getElementById('mm-pat-dropdown');
  const list = mmPatients.filter(p =>
    !q || iswPatientName(p).toLowerCase().includes(q) || (p.mrn || '').toLowerCase().includes(q)).slice(0, 30);
  dd.innerHTML = list.length ? list.map(p => `
    <button onclick="mmPickPatient('${p.id}')" class="w-full text-left px-4 py-2.5 hover:bg-cream/60 border-b border-ink/5 last:border-0">
      <div class="text-sm font-semibold text-ink">${iswPatientName(p).replace(/</g,'&lt;')}</div>
      <div class="text-[11px] text-ink/40">${(p.mrn || '').replace(/</g,'&lt;')}</div>
    </button>`).join('')
    : '<div class="px-4 py-3 text-sm text-ink/40">Tiada padanan.</div>';
  dd.classList.remove('hidden');
}

document.addEventListener('click', e => {
  if (!e.target.closest('#mm-pat-search') && !e.target.closest('#mm-pat-dropdown'))
    document.getElementById('mm-pat-dropdown')?.classList.add('hidden');
});

function mmPickPatient(id) {
  mmSelPatient = mmPatients.find(p => p.id === id) || null;
  if (!mmSelPatient) return;
  document.getElementById('mm-pat-dropdown').classList.add('hidden');
  document.getElementById('mm-pat-picker').classList.add('hidden');
  document.getElementById('mm-pat-selected').classList.remove('hidden');
  document.getElementById('mm-pat-selected').classList.add('flex');
  document.getElementById('mm-pat-selected-name').textContent = iswPatientName(mmSelPatient);
}

function mmClearPatient() {
  mmSelPatient = null;
  document.getElementById('mm-pat-selected').classList.add('hidden');
  document.getElementById('mm-pat-selected').classList.remove('flex');
  document.getElementById('mm-pat-picker').classList.remove('hidden');
  document.getElementById('mm-pat-search').value = '';
}

async function openManualModal() {
  await mmLoadPatients();
  mmSelPatient = null;
  document.getElementById('mm-pat-search').value = '';
  document.getElementById('mm-pat-picker').classList.remove('hidden');
  document.getElementById('mm-pat-selected').classList.add('hidden');
  document.getElementById('mm-pat-selected').classList.remove('flex');
  document.getElementById('mm-qty').value = '1';
  ['mm-c-tidak-berkarat','mm-c-bersih','mm-c-getah','mm-c-besi'].forEach(id => document.getElementById(id).checked = false);
  document.getElementById('mm-photos').value = '';
  document.getElementById('mm-notes').value = '';
  document.getElementById('manual-modal').classList.remove('hidden');
}
window.openManualModal = openManualModal;

function closeManualModal() {
  document.getElementById('manual-modal').classList.add('hidden');
}
window.closeManualModal = closeManualModal;

async function submitManualReturn() {
  if (!mmSelPatient) { banner('Sila pilih pesakit', 'error'); return; }
  const qty = parseInt(document.getElementById('mm-qty').value) || 0;
  if (qty < 1) { banner('Kuantiti tidak sah', 'error'); return; }
  const criteria = {
    tidak_berkarat: document.getElementById('mm-c-tidak-berkarat').checked,
    bersih:         document.getElementById('mm-c-bersih').checked,
    getah_ada:      document.getElementById('mm-c-getah').checked,
    besi_kemas:     document.getElementById('mm-c-besi').checked,
  };
  if (!Object.values(criteria).every(Boolean)) { banner('Sila tick semua 4 syarat', 'error'); return; }
  const notes = document.getElementById('mm-notes').value.trim();
  const files = Array.from(document.getElementById('mm-photos').files || []);

  const btn = document.getElementById('mm-submit-btn');
  btn.disabled = true; btn.textContent = 'Memproses...';

  try {
    const photoUrls = [];
    for (const f of files) {
      const path = `returns/${mmSelPatient.id}/${Date.now()}_${f.name}`;
      const { error } = await window.db.storage.from('issue-photos').upload(path, f);
      if (error) { console.warn('Photo upload failed:', error); continue; }
      const { data } = window.db.storage.from('issue-photos').getPublicUrl(path);
      photoUrls.push(data.publicUrl);
    }

    const { error: insertErr } = await window.db.from('psy_bottle_returns').insert({
      patient_id: mmSelPatient.id,
      patient_name: iswPatientName(mmSelPatient),
      qty,
      photo_urls: photoUrls,
      criteria_confirmed: criteria,
      notes: notes || null,
      status: 'pending',
    });
    if (insertErr) throw insertErr;

    if (mmSelPatient.user_id) {
      await notify(mmSelPatient.user_id, 'system', '🍯 Pulangan Botol Direkod', `Staff telah merekodkan pulangan ${qty} botol bagi pihak anda.`, 'pulangan.html');
    }

    banner('Pulangan direkod ✅');
    closeManualModal();
    loadReturns();
  } catch (e) {
    banner('Ralat: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan';
  }
}
window.submitManualReturn = submitManualReturn;

(async () => {
  const user = await initStaff('pulangan', 'Senarai pulangan botol madu');
  if (!user) return;
  loadReturns();
})();
</script>
</body>
</html>
