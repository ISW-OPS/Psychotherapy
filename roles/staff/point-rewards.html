<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Ganjaran Mata</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.purple-btn { background: #6366f1; color: white; transition: background .15s; }
.purple-btn:hover { background: #4f46e5; }
</style>
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🏆</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-5">

        <!-- Page header -->
        <div class="flex items-start justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-2xl font-bold text-ink">Ganjaran Mata</h1>
            <div class="text-sm text-ink/55 mt-0.5">🏆 Pesakit dapat 1 mata/hari isi Catatan Harian, tukar jadi baucar RM.</div>
          </div>
          <button data-rbac="products.create" id="btn-reward-new" onclick="openRewardModal()" class="hidden purple-btn px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-sm">+ Tambah Ganjaran</button>
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-ink/8 bg-ink/[0.015]">
                  <th class="text-left px-5 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Nama</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Kos Mata</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Nilai Baucar</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Had/Pesakit</th>
                  <th class="text-left px-3 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Status</th>
                  <th class="text-right px-5 py-3 text-[10px] font-bold text-ink/45 uppercase tracking-wider">Tindakan</th>
                </tr>
              </thead>
              <tbody id="reward-body" class="divide-y divide-ink/5"></tbody>
            </table>
          </div>
          <div id="reward-empty-state" class="hidden px-5 py-12 text-center text-sm text-ink/35">Tiada ganjaran lagi</div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- ═══ Modal: Tambah/Edit Ganjaran Mata ═══ -->
<div id="reward-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/40" onclick="closeRewardModal()"></div>
  <div class="relative bg-white rounded-2xl w-full max-w-md p-6 space-y-4 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between">
      <h3 id="reward-modal-title" class="font-bold text-lg text-ink">Tambah Ganjaran</h3>
      <button onclick="closeRewardModal()" class="text-ink/50 text-xl">×</button>
    </div>
    <input type="hidden" id="rf-id">
    <div>
      <label class="text-xs font-semibold text-ink/60">Nama Ganjaran</label>
      <input id="rf-name" type="text" placeholder="RM5 OFF" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="text-xs font-semibold text-ink/60">Penerangan (opsyenal)</label>
      <input id="rf-desc" type="text" placeholder="Baucar diskaun kedai" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs font-semibold text-ink/60">Kos Mata</label>
        <input id="rf-cost" type="number" min="1" placeholder="50" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/60">Nilai Baucar (RM)</label>
        <input id="rf-amount" type="number" min="0" step="0.01" placeholder="5" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs font-semibold text-ink/60">Had Tukar / Pesakit</label>
        <input id="rf-max" type="number" min="1" placeholder="Tiada had" class="w-full mt-1 border border-ink/15 rounded-lg px-3 py-2 text-sm">
      </div>
      <div class="flex items-end pb-2">
        <label class="flex items-center gap-2 text-sm">
          <input id="rf-active" type="checkbox" checked class="accent-[#6366f1]"> Aktif
        </label>
      </div>
    </div>
    <button onclick="saveReward()" class="w-full purple-btn py-2.5 rounded-xl text-sm font-semibold mt-2">Simpan Ganjaran</button>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtRM(n) { return 'RM ' + Number(n||0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

let allRewards = [];

function rewardStatusBadge(r) {
  return r.is_active
    ? `<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700">● Aktif</span>`
    : `<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-ink/8 text-ink/55">● Tidak Aktif</span>`;
}

function renderRewardTable() {
  const tbody = document.getElementById('reward-body');
  const empty = document.getElementById('reward-empty-state');
  if (!allRewards.length) {
    tbody.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  tbody.innerHTML = allRewards.map(r => `<tr class="hover:bg-ink/[0.01]">
      <td class="px-5 py-3 font-bold text-ink">${escHtml(r.name)}${r.description ? `<div class="text-[11px] font-normal text-ink/45 mt-0.5">${escHtml(r.description)}</div>` : ''}</td>
      <td class="px-3 py-3">${r.points_cost} pts</td>
      <td class="px-3 py-3">${fmtRM(r.voucher_amount)}</td>
      <td class="px-3 py-3">${r.max_redemptions_per_patient ?? 'Tiada had'}</td>
      <td class="px-3 py-3">${rewardStatusBadge(r)}</td>
      <td class="px-5 py-3 text-right">
        <div class="inline-flex items-center gap-1">
          <button data-rbac="products.edit" onclick="openRewardModal('${r.id}')" class="w-8 h-8 flex items-center justify-center border border-ink/15 rounded-lg hover:bg-ink/5" title="Edit">✏️</button>
          <button data-rbac="products.edit" onclick="toggleRewardActive('${r.id}')" class="w-8 h-8 flex items-center justify-center border border-ink/15 rounded-lg hover:bg-ink/5" title="${r.is_active ? 'Nyahaktif' : 'Aktifkan'}">${r.is_active ? '⏸️' : '▶️'}</button>
        </div>
      </td>
    </tr>`).join('');
}

async function loadRewards() {
  const { data, error } = await window.db.from('psy_point_rewards').select('*').order('points_cost', { ascending: true });
  if (error) { banner('Gagal load ganjaran: ' + error.message, 'error'); return; }
  allRewards = data || [];
  renderRewardTable();
}

function openRewardModal(id) {
  const r = id ? allRewards.find(x => x.id === id) : null;
  document.getElementById('reward-modal-title').textContent = r ? 'Edit Ganjaran' : 'Tambah Ganjaran';
  document.getElementById('rf-id').value = r?.id || '';
  document.getElementById('rf-name').value = r?.name || '';
  document.getElementById('rf-desc').value = r?.description || '';
  document.getElementById('rf-cost').value = r?.points_cost ?? '';
  document.getElementById('rf-amount').value = r?.voucher_amount ?? '';
  document.getElementById('rf-max').value = r?.max_redemptions_per_patient ?? '';
  document.getElementById('rf-active').checked = r ? !!r.is_active : true;
  document.getElementById('reward-modal').classList.remove('hidden');
}

function closeRewardModal() { document.getElementById('reward-modal').classList.add('hidden'); }

async function saveReward() {
  const id = document.getElementById('rf-id').value || null;
  const name = document.getElementById('rf-name').value.trim();
  const cost = Number(document.getElementById('rf-cost').value);
  const amount = Number(document.getElementById('rf-amount').value);
  if (!name) { banner('Sila isi nama ganjaran', 'error'); return; }
  if (!(cost > 0)) { banner('Sila isi kos mata', 'error'); return; }
  if (!(amount > 0)) { banner('Sila isi nilai baucar', 'error'); return; }

  const payload = {
    name,
    description: document.getElementById('rf-desc').value.trim() || null,
    points_cost: cost,
    voucher_amount: amount,
    max_redemptions_per_patient: document.getElementById('rf-max').value ? Number(document.getElementById('rf-max').value) : null,
    is_active: document.getElementById('rf-active').checked,
    updated_at: new Date().toISOString(),
  };

  try {
    if (id) {
      const { error } = await window.db.from('psy_point_rewards').update(payload).eq('id', id);
      if (error) throw error;
      banner('Ganjaran dikemaskini ✅');
    } else {
      const uid = (await window.db.auth.getUser()).data.user?.id || null;
      const { error } = await window.db.from('psy_point_rewards').insert({ ...payload, created_by: uid });
      if (error) throw error;
      banner('Ganjaran ditambah ✅');
    }
    closeRewardModal();
    await loadRewards();
  } catch (e) {
    banner('Ralat: ' + e.message, 'error');
  }
}

async function toggleRewardActive(id) {
  const r = allRewards.find(x => x.id === id);
  if (!r) return;
  try {
    const { error } = await window.db.from('psy_point_rewards').update({ is_active: !r.is_active, updated_at: new Date().toISOString() }).eq('id', id);
    if (error) throw error;
    r.is_active = !r.is_active;
    banner(r.is_active ? 'Ganjaran diaktifkan ✅' : 'Ganjaran dinyahaktifkan ⛔');
    renderRewardTable();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

(async () => {
  const user = await initStaff('point_rewards', 'Tukar mata jadi baucar RM', 'psy_products');
  if (!user) return;
  if (can('products','create')) document.getElementById('btn-reward-new').classList.remove('hidden');
  await loadRewards();
})();
</script>
</body>
</html>
