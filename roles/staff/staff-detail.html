<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Detail Staff</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">👤</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 max-w-xl mx-auto space-y-4">

        <!-- Action bar -->
        <div class="flex items-center justify-between gap-3">
          <div id="view-status"></div>
          <div id="btn-bar-view" class="flex gap-2">
            <button onclick="enterEdit()" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark flex items-center gap-2">✏️ Edit Staff</button>
          </div>
          <div id="btn-bar-edit" class="hidden flex gap-2">
            <button onclick="exitEdit()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5">Batal</button>
            <button id="btn-save" onclick="saveStaff()" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark">Simpan</button>
          </div>
        </div>

        <!-- Card -->
        <div id="view-card" class="bg-white rounded-2xl border border-ink/10 overflow-hidden">

          <!-- Avatar area -->
          <div id="staff-avatar-bar" class="bg-navy px-6 py-8 flex items-center gap-5">
            <div id="staff-avatar" class="w-16 h-16 rounded-full bg-white/20 flex items-center justify-center text-2xl font-bold text-white flex-shrink-0"></div>
            <div>
              <div id="avatar-name" class="text-white font-bold text-xl"></div>
              <div id="avatar-role" class="mt-1"></div>
            </div>
          </div>

          <!-- VIEW content -->
          <div id="view-content" class="p-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <div class="text-[11px] text-ink/40 uppercase font-semibold tracking-wide">Staff ID</div>
                <div id="view-sid" class="font-bold font-mono mt-0.5"></div>
              </div>
              <div>
                <div class="text-[11px] text-ink/40 uppercase font-semibold tracking-wide">Role</div>
                <div id="view-role" class="mt-0.5"></div>
              </div>
            </div>
            <div>
              <div class="text-[11px] text-ink/40 uppercase font-semibold tracking-wide">Email</div>
              <div id="view-email" class="text-sm mt-0.5 break-all"></div>
            </div>
            <div>
              <div class="text-[11px] text-ink/40 uppercase font-semibold tracking-wide">Status</div>
              <div id="view-active" class="mt-0.5"></div>
            </div>
          </div>

        </div>

        <!-- EDIT content -->
        <div id="edit-content" class="hidden space-y-4">
          <input id="edit-id" type="hidden">

          <div>
            <label class="text-xs font-semibold text-ink/60">Staff ID <span class="text-terracotta">*</span></label>
            <input id="f-sid" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none font-mono">
          </div>

          <div>
            <label class="text-xs font-semibold text-ink/60">Nama Penuh <span class="text-terracotta">*</span></label>
            <input id="f-name" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
          </div>

          <div>
            <label class="text-xs font-semibold text-ink/60">Staff Role</label>
            <select id="f-role" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm bg-white focus:border-navy outline-none">
              <option value="super_admin">Super Admin</option>
              <option value="admin">Admin</option>
              <option value="doctor">Doctor</option>
              <option value="coach">Coach</option>
              <option value="manager">Manager</option>
            </select>
          </div>

          <div>
            <label class="text-xs font-semibold text-ink/60">Status</label>
            <select id="f-active" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm bg-white focus:border-navy outline-none">
              <option value="true">Aktif</option>
              <option value="false">Dipecat / Tidak Aktif</option>
            </select>
          </div>

          <div id="edit-error" class="hidden text-xs text-terracotta bg-terracotta/10 rounded-lg p-3"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let currentStaff = null;

const ROLE_BADGE = {
  admin:   '<span class="chip bg-terracotta/20 text-terracotta">Admin</span>',
  doctor:  '<span class="chip bg-navy/20 text-navy">Doctor</span>',
  coach:   '<span class="chip bg-teal/20 text-teal">Coach</span>',
  manager: '<span class="chip bg-gold/30 text-gold-dark">Manager</span>',
};

const ROLE_BADGE_WHITE = {
  admin:   '<span class="text-xs font-semibold bg-white/20 text-white px-2 py-0.5 rounded-full">Admin</span>',
  doctor:  '<span class="text-xs font-semibold bg-white/20 text-white px-2 py-0.5 rounded-full">Doctor</span>',
  coach:   '<span class="text-xs font-semibold bg-white/20 text-white px-2 py-0.5 rounded-full">Coach</span>',
  manager: '<span class="text-xs font-semibold bg-white/20 text-white px-2 py-0.5 rounded-full">Manager</span>',
};

function renderView(s) {
  currentStaff = s;

  const isActive = s.is_active !== false;
  document.getElementById('view-status').innerHTML = isActive
    ? '<span class="chip bg-green-light text-green-dark">✓ Aktif</span>'
    : '<span class="chip bg-terracotta/20 text-terracotta">Dipecat</span>';

  const initials = (s.full_name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  document.getElementById('staff-avatar').textContent = initials;
  document.getElementById('avatar-name').textContent  = s.full_name || '—';
  document.getElementById('avatar-role').innerHTML    = ROLE_BADGE_WHITE[s.staff_role] || '';

  document.getElementById('view-sid').textContent    = s.registration_no || '—';
  document.getElementById('view-role').innerHTML     = ROLE_BADGE[s.staff_role] || '—';
  document.getElementById('view-email').textContent  = s.email || '—';
  document.getElementById('view-active').innerHTML   = isActive
    ? '<span class="chip bg-green-light text-green-dark">Aktif</span>'
    : '<span class="chip bg-terracotta/20 text-terracotta">Dipecat / Tidak Aktif</span>';
}

function enterEdit() {
  document.getElementById('edit-id').value   = currentStaff.id;
  document.getElementById('f-sid').value     = currentStaff.registration_no || '';
  document.getElementById('f-name').value    = currentStaff.full_name || '';
  document.getElementById('f-role').value    = currentStaff.staff_role || 'coach';
  document.getElementById('f-active').value  = String(currentStaff.is_active !== false);
  document.getElementById('edit-error').classList.add('hidden');

  document.getElementById('view-card').classList.add('hidden');
  document.getElementById('edit-content').classList.remove('hidden');
  document.getElementById('btn-bar-view').classList.add('hidden');
  document.getElementById('btn-bar-edit').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function exitEdit() {
  document.getElementById('edit-content').classList.add('hidden');
  document.getElementById('view-card').classList.remove('hidden');
  document.getElementById('btn-bar-edit').classList.add('hidden');
  document.getElementById('btn-bar-view').classList.remove('hidden');
}

async function callEdgeFn(body) {
  const { data, error } = await window.db.functions.invoke('invite-staff', { body });
  if (error) {
    let msg = error.message || 'Ralat tidak diketahui';
    try {
      if (error.context && typeof error.context.json === 'function') {
        const b = await Promise.race([error.context.json(), new Promise((_,rej) => setTimeout(() => rej(), 3000))]);
        if (b?.error) msg = b.error;
      }
    } catch {}
    throw new Error(msg);
  }
  if (data?.error) throw new Error(data.error);
  return data;
}

async function saveStaff() {
  const errEl  = document.getElementById('edit-error');
  const staffId = document.getElementById('f-sid').value.trim();
  const name   = document.getElementById('f-name').value.trim();
  errEl.classList.add('hidden');

  if (!staffId) { errEl.textContent = 'Sila masukkan Staff ID'; errEl.classList.remove('hidden'); return; }
  if (!name)    { errEl.textContent = 'Nama penuh wajib diisi'; errEl.classList.remove('hidden'); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    await callEdgeFn({
      action:          'update',
      target_id:       document.getElementById('edit-id').value,
      full_name:       name,
      staff_role:      document.getElementById('f-role').value,
      registration_no: staffId || null,
      is_active:       document.getElementById('f-active').value === 'true',
    });
    Object.assign(currentStaff, {
      full_name:       name,
      staff_role:      document.getElementById('f-role').value,
      registration_no: staffId,
      is_active:       document.getElementById('f-active').value === 'true',
    });
    banner('Staff berjaya dikemaskini ✓');
    setPageTitle(name, 'Detail staff');
    exitEdit();
    renderView(currentStaff);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan';
  }
}

(async () => {
  const user = await initStaff('staff_mgmt', '');
  if (!user) return;
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { banner('ID tidak ditemui', 'error'); return; }
  setHeaderBack('staff_management.html', 'Kembali ke Manage Staff');
  const { data: s } = await window.db.from('psy_profiles').select('*').eq('id', id).single();
  if (!s) { banner('Staff tidak ditemui', 'error'); return; }
  setPageTitle(s.full_name, 'Detail staff');
  renderView(s);
})();
</script>
</body>
</html>
