<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Detail Staff</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
  .card { background:white; border-radius:14px; border:1px solid #e5e7eb;
    box-shadow:0 1px 3px rgba(0,0,0,.06); padding:20px; }
  .card-title { font-size:.8125rem; font-weight:700; color:#374151; margin-bottom:14px;
    padding-bottom:12px; border-bottom:1px solid #f3f4f6; display:flex; align-items:center; gap:8px; }
  .info-grid { display:grid; gap:0; }
  .info-row { display:flex; align-items:baseline; gap:.5rem; padding:.5rem 0;
    border-bottom:1px solid #f3f4f6; font-size:.8125rem; }
  .info-row:last-child { border:none; padding-bottom:0; }
  .info-lbl { color:#9ca3af; min-width:140px; flex-shrink:0; font-size:.75rem; font-weight:500; }
  .info-val { color:#111; font-weight:500; flex:1; min-width:0; word-break:break-word; }
  .section-lbl { font-size:.8125rem; font-weight:700; color:#374151; margin-bottom:14px; }
  .field-lbl { font-size:.75rem; font-weight:500; color:#9ca3af; margin-bottom:.35rem; display:block; }
  .field-box { width:100%; padding:.6rem .75rem; border:1px solid #e5e7eb; border-radius:.5rem;
    font-size:.8125rem; font-weight:600; color:#111; background:#fafafa; min-height:2.4rem;
    display:flex; align-items:center; word-break:break-word; }
</style>
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">👤</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <!-- Action bar -->
        <div class="flex items-center justify-between gap-3">
          <div id="view-status"></div>
          <div id="btn-bar-view" class="flex gap-2">
            <button onclick="enterEdit()" data-rbac="staff.edit" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark flex items-center gap-2">✏️ Edit Staff</button>
          </div>
          <div id="btn-bar-edit" class="hidden flex gap-2">
            <button onclick="exitEdit()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5">Batal</button>
            <button id="btn-save" onclick="saveStaff()" data-rbac="staff.edit" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark">Simpan</button>
          </div>
        </div>

        <!-- ═══ VIEW: kad utama (kiri) + kad ringkasan (kanan) ═══ -->
        <div id="view-card" class="grid grid-cols-1 lg:grid-cols-3 gap-5 items-start">

          <!-- Kiri (2/3): kad utama — avatar + semua maklumat -->
          <div class="lg:col-span-2 bg-white rounded-2xl border border-ink/10 overflow-hidden">
            <div id="staff-avatar-bar" class="bg-navy px-6 py-8 flex items-center gap-5">
              <div id="staff-avatar" class="w-16 h-16 rounded-full bg-white/20 flex items-center justify-center text-2xl font-bold text-white flex-shrink-0 overflow-hidden"></div>
              <div class="min-w-0">
                <div id="avatar-name" class="text-white font-bold text-xl truncate"></div>
                <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                  <div id="avatar-role"></div>
                  <span id="avatar-sid" class="text-xs font-mono text-white/70"></span>
                </div>
              </div>
            </div>

            <div id="view-content" class="p-6 space-y-6">

              <div>
                <div class="section-lbl">💼 Maklumat Perkhidmatan</div>
                <div class="grid grid-cols-2 gap-4">
                  <div><span class="field-lbl">Staff ID</span><div class="field-box font-mono" id="view-sid">—</div></div>
                  <div><span class="field-lbl">Peranan</span><div class="field-box" id="view-role">—</div></div>
                  <div><span class="field-lbl">Jabatan / Unit</span><div class="field-box" id="view-department">—</div></div>
                  <div><span class="field-lbl">Pengkhususan</span><div class="field-box" id="view-specialization">—</div></div>
                </div>
              </div>

              <div class="pt-6 border-t border-ink/5">
                <div class="section-lbl">📇 Maklumat Hubungan</div>
                <div class="grid grid-cols-2 gap-4">
                  <div><span class="field-lbl">✉️ Emel</span><div class="field-box break-all" id="view-email">—</div></div>
                  <div><span class="field-lbl">📞 Telefon</span><div class="field-box" id="view-phone">—</div></div>
                </div>
              </div>

              <div class="pt-6 border-t border-ink/5">
                <div class="section-lbl">🪪 Maklumat Peribadi</div>
                <div class="grid grid-cols-2 gap-4">
                  <div><span class="field-lbl">Tarikh Lahir</span><div class="field-box" id="view-dob">—</div></div>
                  <div><span class="field-lbl">Jantina</span><div class="field-box" id="view-gender">—</div></div>
                  <div><span class="field-lbl">Status Perkahwinan</span><div class="field-box" id="view-marital">—</div></div>
                  <div><span class="field-lbl">Bahasa Utama</span><div class="field-box" id="view-language">—</div></div>
                </div>
              </div>

              <div id="view-signature-wrap" class="hidden pt-6 border-t border-ink/5">
                <div class="section-lbl">✍️ Tandatangan Digital</div>
                <img id="view-signature" class="h-16 object-contain border border-ink/10 rounded-lg bg-cream px-3" alt="Tandatangan">
              </div>

            </div>
          </div>

          <!-- Kanan (1/3): kad-kad ringkas bertindan -->
          <div class="space-y-5">
            <div class="card">
              <div class="card-title"><span>✅</span> Status Akaun</div>
              <div id="view-active" class="mb-4"></div>
              <div class="info-grid">
                <div class="info-row"><span class="info-lbl">Tarikh Daftar</span><span class="info-val" id="view-created">—</span></div>
                <div class="info-row"><span class="info-lbl">Kemaskini Terakhir</span><span class="info-val" id="view-updated">—</span></div>
              </div>
            </div>
          </div>

        </div>

        <!-- ═══ EDIT: kad sama lebar dengan lajur kiri VIEW ═══ -->
        <div id="edit-content" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-5">
          <input id="edit-id" type="hidden">

          <div class="lg:col-span-2 card space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-xs font-semibold text-ink/60">Staff ID <span class="text-terracotta">*</span></label>
                <input id="f-sid" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none font-mono">
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/60">Staff Role</label>
                <select id="f-role" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm bg-white focus:border-navy outline-none">
                  <option value="super_admin">Super Admin</option>
                  <option value="admin">Admin</option>
                  <option value="doctor">Doctor</option>
                  <option value="coach">Coach</option>
                  <option value="manager">Manager</option>
                </select>
              </div>
            </div>

            <div>
              <label class="text-xs font-semibold text-ink/60">Nama Penuh <span class="text-terracotta">*</span></label>
              <input id="f-name" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-xs font-semibold text-ink/60">Telefon</label>
                <input id="f-phone" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="+60...">
              </div>
              <div>
                <label class="text-xs font-semibold text-ink/60">Pengkhususan</label>
                <input id="f-specialization" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="cth. Psikologi Klinikal">
              </div>
            </div>

            <div>
              <label class="text-xs font-semibold text-ink/60">Status</label>
              <select id="f-active" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm bg-white focus:border-navy outline-none">
                <option value="true">Aktif</option>
                <option value="false">Dipecat / Tidak Aktif</option>
              </select>
            </div>

            <div id="edit-error" class="hidden text-xs text-terracotta bg-terracotta/10 rounded-lg p-3"></div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let currentStaff = null;

const ROLE_BADGE = {
  super_admin: '<span class="chip bg-ink/15 text-ink">Super Admin</span>',
  admin:   '<span class="chip bg-terracotta/20 text-terracotta">Admin</span>',
  doctor:  '<span class="chip bg-navy/20 text-navy">Doctor</span>',
  coach:   '<span class="chip bg-teal/20 text-teal">Coach</span>',
  manager: '<span class="chip bg-gold/30 text-gold-dark">Manager</span>',
};

const ROLE_BADGE_WHITE = {
  super_admin: '<span class="text-xs font-semibold bg-white/20 text-white px-2 py-0.5 rounded-full">Super Admin</span>',
  admin:   '<span class="text-xs font-semibold bg-white/20 text-white px-2 py-0.5 rounded-full">Admin</span>',
  doctor:  '<span class="text-xs font-semibold bg-white/20 text-white px-2 py-0.5 rounded-full">Doctor</span>',
  coach:   '<span class="text-xs font-semibold bg-white/20 text-white px-2 py-0.5 rounded-full">Coach</span>',
  manager: '<span class="text-xs font-semibold bg-white/20 text-white px-2 py-0.5 rounded-full">Manager</span>',
};

const GENDER_LABEL  = { lelaki: 'Lelaki', perempuan: 'Perempuan' };
const MARITAL_LABEL = { bujang: 'Bujang', berkahwin: 'Berkahwin', bercerai: 'Bercerai', duda: 'Duda', janda: 'Janda' };

function renderView(s) {
  currentStaff = s;

  const isActive = s.is_active !== false;
  document.getElementById('view-status').innerHTML = isActive
    ? '<span class="chip bg-green-light text-green-dark">✓ Aktif</span>'
    : '<span class="chip bg-terracotta/20 text-terracotta">Dipecat</span>';

  const initials = (s.full_name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  document.getElementById('staff-avatar').innerHTML = s.avatar_url
    ? `<img src="${s.avatar_url}" class="w-full h-full object-cover" alt="">`
    : initials;
  document.getElementById('avatar-name').textContent = s.full_name || '—';
  document.getElementById('avatar-role').innerHTML   = ROLE_BADGE_WHITE[s.staff_role]
    || `<span class="text-xs font-semibold bg-white/20 text-white px-2 py-0.5 rounded-full">${s.staff_role || '—'}</span>`;
  document.getElementById('avatar-sid').textContent  = s.registration_no ? '#' + s.registration_no : '';

  document.getElementById('view-sid').textContent      = s.registration_no || '—';
  document.getElementById('view-role').innerHTML       = ROLE_BADGE[s.staff_role]
    || `<span class="chip bg-ink/10 text-ink/60">${s.staff_role || '—'}</span>`;
  document.getElementById('view-department').textContent     = s.department || '—';
  document.getElementById('view-specialization').textContent = s.specialization || '—';
  document.getElementById('view-active').innerHTML     = isActive
    ? '<span class="chip bg-green-light text-green-dark">Aktif</span>'
    : '<span class="chip bg-terracotta/20 text-terracotta">Dipecat / Tidak Aktif</span>';

  document.getElementById('view-email').textContent = s.email || '—';
  document.getElementById('view-phone').textContent = s.phone || '—';

  document.getElementById('view-dob').textContent     = s.birth_date ? formatDate(s.birth_date) : '—';
  document.getElementById('view-gender').textContent  = GENDER_LABEL[s.gender] || '—';
  document.getElementById('view-marital').textContent = MARITAL_LABEL[s.marital_status] || '—';
  document.getElementById('view-language').textContent = s.language || '—';

  document.getElementById('view-created').textContent = s.created_at ? formatDateTime(s.created_at) : '—';
  document.getElementById('view-updated').textContent = s.updated_at ? formatDateTime(s.updated_at) : '—';

  const sigWrap = document.getElementById('view-signature-wrap');
  if (s.signature_url) {
    sigWrap.classList.remove('hidden');
    document.getElementById('view-signature').src = s.signature_url;
  } else {
    sigWrap.classList.add('hidden');
  }
}

function enterEdit() {
  document.getElementById('edit-id').value      = currentStaff.id;
  document.getElementById('f-sid').value         = currentStaff.registration_no || '';
  document.getElementById('f-name').value        = currentStaff.full_name || '';
  document.getElementById('f-role').value        = currentStaff.staff_role || 'coach';
  document.getElementById('f-phone').value       = currentStaff.phone || '';
  document.getElementById('f-specialization').value = currentStaff.specialization || '';
  document.getElementById('f-active').value      = String(currentStaff.is_active !== false);
  document.getElementById('edit-error').classList.add('hidden');

  document.getElementById('view-card').classList.add('hidden');
  document.getElementById('edit-content').classList.remove('hidden');
  document.getElementById('btn-bar-view').classList.add('hidden');
  document.getElementById('btn-bar-edit').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function exitEdit() {
  document.getElementById('edit-content').classList.add('hidden');
  document.getElementById('view-card').classList.remove('hidden');
  document.getElementById('btn-bar-edit').classList.add('hidden');
  document.getElementById('btn-bar-view').classList.remove('hidden');
}

async function callEdgeFn(body) {
  const { data, error } = await window.db.functions.invoke('invite-staff', { body });
  if (error) {
    let msg = error.message || 'Ralat tidak diketahui';
    try {
      if (error.context && typeof error.context.json === 'function') {
        const b = await Promise.race([error.context.json(), new Promise((_,rej) => setTimeout(() => rej(), 3000))]);
        if (b?.error) msg = b.error;
      }
    } catch {}
    throw new Error(msg);
  }
  if (data?.error) throw new Error(data.error);
  return data;
}

async function saveStaff() {
  const errEl  = document.getElementById('edit-error');
  const staffId = document.getElementById('f-sid').value.trim();
  const name   = document.getElementById('f-name').value.trim();
  errEl.classList.add('hidden');

  if (!staffId) { errEl.textContent = 'Sila masukkan Staff ID'; errEl.classList.remove('hidden'); return; }
  if (!name)    { errEl.textContent = 'Nama penuh wajib diisi'; errEl.classList.remove('hidden'); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    const phone = document.getElementById('f-phone').value.trim();
    const specialization = document.getElementById('f-specialization').value.trim();
    await callEdgeFn({
      action:          'update',
      target_id:       document.getElementById('edit-id').value,
      full_name:       name,
      staff_role:      document.getElementById('f-role').value,
      registration_no: staffId || null,
      phone:           phone || null,
      specialization:  specialization || null,
      is_active:       document.getElementById('f-active').value === 'true',
    });
    Object.assign(currentStaff, {
      full_name:       name,
      staff_role:      document.getElementById('f-role').value,
      registration_no: staffId,
      phone:           phone || null,
      specialization:  specialization || null,
      is_active:       document.getElementById('f-active').value === 'true',
    });
    banner('Staff berjaya dikemaskini ✓');
    setPageTitle(name, 'Detail staff');
    exitEdit();
    renderView(currentStaff);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan';
  }
}

(async () => {
  const user = await initStaff('staff_mgmt', '');
  if (!user) return;
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { banner('ID tidak ditemui', 'error'); return; }
  setHeaderBack('staff_management.html', 'Kembali ke Manage Staff');
  const { data: s } = await window.db.from('psy_profiles').select('*').eq('id', id).single();
  if (!s) { banner('Staff tidak ditemui', 'error'); return; }
  setPageTitle(s.full_name, 'Detail staff');
  renderView(s);
})();
</script>
</body>
</html>
