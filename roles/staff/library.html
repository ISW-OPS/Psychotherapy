<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Library</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📚</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-6">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <h3 class="font-bold text-lg">Senarai Kandungan Library</h3>
          <button onclick="openForm()" class="bg-navy text-white text-sm px-4 py-2 rounded-lg font-semibold">+ Tambah Kandungan</button>
        </div>

        <div class="bg-white rounded-xl border border-ink/10 overflow-x-auto">
          <table class="data">
            <thead><tr><th>Icon</th><th>Title</th><th>Type</th><th>Category</th><th>URL</th><th>Status</th><th></th></tr></thead>
            <tbody id="library-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="lib-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" onclick="closeForm()"></div>
  <div class="relative bg-white rounded-2xl max-w-xl w-full overflow-hidden">
    <div class="p-5 border-b border-ink/10 flex items-center justify-between">
      <h3 id="form-title" class="font-bold text-lg">Tambah Kandungan</h3>
      <button onclick="closeForm()" class="text-ink/60 text-xl">×</button>
    </div>
    <div class="p-5 space-y-3">
      <input id="edit-id" type="hidden">
      <div>
        <label class="text-xs font-semibold">Title *</label>
        <input id="f-title" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm" placeholder="cth: Apa itu BPS-S model?">
      </div>
      <div>
        <label class="text-xs font-semibold">Description</label>
        <textarea id="f-desc" rows="2" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold">Content Type</label>
          <input id="f-type" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm" placeholder="cth: Video · 8 min">
        </div>
        <div>
          <label class="text-xs font-semibold">Category (color)</label>
          <select id="f-cat" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
            <option value="navy">Navy</option>
            <option value="green">Green</option>
            <option value="terracotta">Terracotta</option>
            <option value="gold">Gold</option>
            <option value="teal">Teal</option>
            <option value="ink">Ink</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold">Icon (emoji)</label>
          <input id="f-icon" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm" value="📄">
        </div>
        <div>
          <label class="text-xs font-semibold">Gradient</label>
          <input id="f-gradient" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm" placeholder="from-navy to-teal" value="from-navy to-teal">
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold">Content URL (optional)</label>
        <input id="f-url" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm" placeholder="https://...">
      </div>
      <div>
        <label class="text-xs font-semibold">Kandungan Teks (artikel / doa / langkah latihan)</label>
        <textarea id="f-body" rows="5" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm" placeholder="Taip isi kandungan di sini..."></textarea>
      </div>
    </div>
    <div class="p-5 border-t border-ink/10 flex justify-end gap-2">
      <button onclick="closeForm()" class="px-4 py-2 border border-ink/20 rounded-lg text-sm">Batal</button>
      <button onclick="saveItem()" class="bg-navy text-white px-5 py-2 rounded-lg text-sm font-semibold">Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function openForm(item) {
  document.getElementById('form-title').textContent = item ? 'Edit Kandungan' : 'Tambah Kandungan';
  document.getElementById('edit-id').value = item?.id || '';
  document.getElementById('f-title').value = item?.title || '';
  document.getElementById('f-desc').value = item?.description || '';
  document.getElementById('f-type').value = item?.content_type || '';
  document.getElementById('f-cat').value = item?.category || 'navy';
  document.getElementById('f-icon').value = item?.icon || '📄';
  document.getElementById('f-gradient').value = item?.gradient || 'from-navy to-teal';
  document.getElementById('f-url').value = item?.content_url || '';
  document.getElementById('f-body').value = item?.content_body || '';
  document.getElementById('lib-modal').classList.remove('hidden');
}
function closeForm() { document.getElementById('lib-modal').classList.add('hidden'); }

async function saveItem() {
  const editId = document.getElementById('edit-id').value;
  const title = document.getElementById('f-title').value.trim();
  if (!title) { banner('Title wajib', 'error'); return; }

  const data = {
    title,
    description: document.getElementById('f-desc').value.trim(),
    content_type: document.getElementById('f-type').value.trim(),
    category: document.getElementById('f-cat').value,
    icon: document.getElementById('f-icon').value || '📄',
    gradient: document.getElementById('f-gradient').value || 'from-navy to-teal',
    content_url: document.getElementById('f-url').value.trim() || null,
    content_body: document.getElementById('f-body').value.trim() || null,
    updated_at: new Date().toISOString(),
  };

  try {
    if (editId) await dbUpdate('library_items', editId, data);
    else {
      data.item_id = title.toLowerCase().replace(/\s+/g, '-').slice(0, 40);
      const { error } = await window.db.from('library_items').insert(data);
      if (error) throw error;
    }
    await auditLog(editId ? 'library.updated' : 'library.created', title);
    banner('Disimpan');
    closeForm();
    loadLibrary();
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  }
}

async function toggleItem(id, isActive) {
  await dbUpdate('library_items', id, { is_active: !isActive });
  loadLibrary();
}

async function deleteItem(id, title) {
  if (!confirm(`Padam "${title}"?`)) return;
  await dbDelete('library_items', id);
  await auditLog('library.deleted', id, { title });
  loadLibrary();
}

async function loadLibrary() {
  const data = await dbQuery('library_items', { order: { col: 'sort_order', asc: true } });
  document.getElementById('library-body').innerHTML = data.length
    ? data.map(it => `<tr class="${!it.is_active ? 'opacity-50' : ''}">
        <td class="text-2xl">${it.icon}</td>
        <td><strong>${it.title}</strong><div class="text-[10px] text-ink/50 line-clamp-1">${it.description || ''}</div></td>
        <td class="text-xs">${it.content_type || '—'}</td>
        <td><span class="chip bg-cream text-ink/70">${it.category || '—'}</span></td>
        <td class="text-xs text-ink/60 max-w-[150px] truncate">${it.content_url || '—'}</td>
        <td>${it.is_active ? '<span class="chip bg-green-light text-green-dark">Active</span>' : '<span class="chip bg-ink/10 text-ink/60">Inactive</span>'}</td>
        <td class="space-x-2 whitespace-nowrap">
          <button onclick='openForm(${JSON.stringify(it).replace(/'/g,"&#39;")})' class="text-navy text-xs font-semibold">Edit</button>
          <button onclick="toggleItem('${it.id}',${it.is_active})" class="text-xs font-semibold ${it.is_active ? 'text-gold-dark' : 'text-green-dark'}">${it.is_active ? 'Off' : 'On'}</button>
          <button onclick="deleteItem('${it.id}','${it.title}')" class="text-terracotta text-xs font-semibold">Padam</button>
        </td>
      </tr>`).join('')
    : '<tr><td colspan="7" class="text-center text-ink/40 py-8">Tiada kandungan</td></tr>';
}

(async () => {
  const user = await initStaff('library', 'Urus self-help content');
  if (!user) return;
  loadLibrary();
})();
</script>
</body>
</html>
