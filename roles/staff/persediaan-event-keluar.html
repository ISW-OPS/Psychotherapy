<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Pengeluaran &amp; Pemulangan</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#f7f8fa]">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📦</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-4">

        <div class="text-xs text-ink/45 flex items-center gap-1.5 flex-wrap">
          <a href="events.html" class="hover:text-navy hover:underline">Acara &amp; Kelas</a><span>›</span>
          <a href="events.html" class="hover:text-navy hover:underline">Senarai Acara</a><span>›</span>
          <span id="bc-title" class="text-ink/60">—</span>
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-5">
          <div class="flex items-center gap-2 flex-wrap">
            <h1 id="ev-title" class="text-xl font-bold text-ink">—</h1>
          </div>
          <p id="ev-sub" class="text-sm text-ink/45 mt-1"></p>

          <div class="flex items-center gap-5 border-b border-ink/10 mt-5 overflow-x-auto">
            <a id="tab-info" href="#" class="px-1 pb-2.5 text-sm font-semibold border-b-2 border-transparent text-ink/50 hover:text-ink whitespace-nowrap">📋 Maklumat Asas</a>
            <a id="tab-peserta" href="#" class="px-1 pb-2.5 text-sm font-semibold border-b-2 border-transparent text-ink/50 hover:text-ink whitespace-nowrap">👥 Peserta &amp; Pendaftaran</a>
            <a id="tab-persediaan" href="#" class="px-1 pb-2.5 text-sm font-semibold border-b-2 border-transparent text-ink/50 hover:text-ink whitespace-nowrap">🧰 Persediaan Event</a>
            <a id="tab-kehadiran" href="#" class="px-1 pb-2.5 text-sm font-semibold border-b-2 border-transparent text-ink/50 hover:text-ink whitespace-nowrap">✓ Kehadiran</a>
            <span class="px-1 pb-2.5 text-sm font-semibold border-b-2 border-navy text-navy whitespace-nowrap">📦 Pengeluaran &amp; Pemulangan</span>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
          <div class="flex items-center justify-between gap-3 flex-wrap p-4 border-b border-ink/10">
            <div class="flex items-center gap-1">
              <button id="subtab-keluar-btn" onclick="setSubTab('keluar')" class="px-3 py-2 text-sm font-semibold rounded-t-lg whitespace-nowrap"></button>
              <button id="subtab-pulang-btn" onclick="setSubTab('pulang')" class="px-3 py-2 text-sm font-semibold rounded-t-lg whitespace-nowrap"></button>
            </div>
            <button onclick="openIssueModal()" class="bg-navy text-white px-3 py-2 rounded-lg text-xs font-semibold hover:bg-navy-dark">+ Rekod Barang Keluar</button>
          </div>
          <div class="px-5 py-2 border-b border-ink/5 grid gap-3 items-center text-[10px] font-bold text-ink/40 uppercase tracking-wider" style="grid-template-columns:110px 1.6fr 90px 1fr 1fr 110px">
            <span>Tarikh</span><span>Item</span><span class="text-right">Kuantiti</span><span>Dipinjamkan Oleh</span><span>Status</span><span></span>
          </div>
          <div id="issuance-table" class="divide-y divide-ink/5"></div>
          <div id="issuance-empty" class="hidden px-5 py-12 text-center text-sm text-ink/35">Tiada rekod lagi.</div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- Modal: Rekod Barang Keluar -->
<div id="issue-modal" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" onclick="closeIssueModal()"></div>
  <div class="relative bg-white rounded-2xl max-w-md w-full">
    <div class="p-5 border-b border-ink/10 flex items-center justify-between">
      <h3 class="font-bold text-ink">Rekod Barang Keluar</h3>
      <button onclick="closeIssueModal()" class="text-ink/50 text-2xl leading-none hover:text-ink">×</button>
    </div>
    <div class="p-5 space-y-2.5">
      <div>
        <label class="text-[11px] text-ink/50">Barang *</label>
        <select id="issue-item" onchange="onIssueItemChange()" class="w-full px-2 py-1.5 border border-ink/15 rounded-lg text-sm bg-white"><option value="">— Pilih barang persediaan —</option></select>
        <div id="issue-stock-hint" class="text-[11px] text-ink/40 mt-1"></div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-[11px] text-ink/50">Kuantiti *</label><input id="issue-qty" type="number" min="0.01" step="0.01" value="1" class="w-full px-2 py-1.5 border border-ink/15 rounded-lg text-sm"></div>
        <div><label class="text-[11px] text-ink/50">Dipinjamkan Oleh</label><select id="issue-borrower" class="w-full px-2 py-1.5 border border-ink/15 rounded-lg text-sm bg-white"><option value="">— Tiada —</option></select></div>
      </div>
      <div><label class="text-[11px] text-ink/50">Nota</label><input id="issue-notes" type="text" class="w-full px-2 py-1.5 border border-ink/15 rounded-lg text-sm"></div>
    </div>
    <div class="p-5 border-t border-ink/10 flex justify-end gap-2">
      <button onclick="closeIssueModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-ink/60 hover:bg-ink/5">Batal</button>
      <button onclick="submitIssue()" class="bg-navy text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark">Rekod</button>
    </div>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script src="../../shared/inventoryStock.js"></script>
<script>
function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString(LCALE(),{day:'2-digit',month:'short',year:'numeric'}) : '—'; }

const params = new URLSearchParams(location.search);
const eventId = params.get('event_id') || params.get('id');

let eventRow = null;
let prepItems = [];
let staffList = [];
let issuance = [];
let subTab = 'keluar';

function renderHeader() {
  document.getElementById('bc-title').textContent = eventRow.title;
  document.getElementById('ev-title').textContent = eventRow.title;
  document.getElementById('ev-sub').textContent = `${fmtDate(eventRow.start_at)} · ${eventRow.mode === 'online' ? 'Online' : (eventRow.location || '—')}`;
  ['info','peserta','kehadiran'].forEach(k => document.getElementById('tab-'+k).href = `acara-detail.html?id=${eventRow.id}#${k}`);
  document.getElementById('tab-persediaan').href = `persediaan-event-detail.html?event_id=${eventRow.id}`;
}

function setSubTab(t) {
  subTab = t;
  const keluarCount = issuance.filter(i => i.status === 'dikeluarkan').length;
  const pulangCount = issuance.filter(i => i.status === 'dipulangkan').length;
  document.getElementById('subtab-keluar-btn').textContent = `Barang Keluar (${keluarCount})`;
  document.getElementById('subtab-pulang-btn').textContent = `Dipulangkan (${pulangCount})`;
  document.getElementById('subtab-keluar-btn').className = `px-3 py-2 text-sm font-semibold rounded-t-lg whitespace-nowrap ${subTab==='keluar' ? 'bg-cream text-navy border-b-2 border-navy' : 'text-ink/50 hover:text-ink'}`;
  document.getElementById('subtab-pulang-btn').className = `px-3 py-2 text-sm font-semibold rounded-t-lg whitespace-nowrap ${subTab==='pulang' ? 'bg-cream text-navy border-b-2 border-navy' : 'text-ink/50 hover:text-ink'}`;
  renderTable();
}
window.setSubTab = setSubTab;

function renderTable() {
  const rows = issuance.filter(i => i.status === (subTab === 'keluar' ? 'dikeluarkan' : 'dipulangkan'));
  const tbody = document.getElementById('issuance-table');
  const empty = document.getElementById('issuance-empty');
  if (!rows.length) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  const name = id => staffList.find(s => s.id === id)?.full_name || '—';

  tbody.innerHTML = rows.map(r => `
    <div class="grid gap-3 items-center px-5 py-3 hover:bg-ink/[0.015]" style="grid-template-columns:110px 1.6fr 90px 1fr 1fr 110px">
      <div class="text-xs text-ink/55">${fmtDate(r.status === 'dipulangkan' ? r.returned_at : r.issued_at)}</div>
      <div class="text-sm font-semibold text-ink truncate">${escHtml(r.item_name)}</div>
      <div class="text-sm text-right text-ink/70">${Number(r.qty)}</div>
      <div class="text-xs text-ink/60 truncate">${escHtml(name(r.borrowed_by))}</div>
      <div><span class="text-[11px] font-semibold px-2.5 py-1 rounded-full ${r.status==='dikeluarkan' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'}">${r.status==='dikeluarkan' ? 'Dikeluarkan' : 'Dipulangkan'}</span></div>
      <div class="text-right">${r.status==='dikeluarkan' ? `<button onclick="returnItem('${r.id}')" class="text-[11px] font-semibold text-navy hover:underline">↩ Pulangkan</button>` : ''}</div>
    </div>`).join('');
}

function populateIssueSelects() {
  const opts = '<option value="">— Pilih barang persediaan —</option>' + prepItems.map(it =>
    `<option value="${it.id}">${escHtml(it.item_name)} (${Number(it.qty_needed)} ${escHtml(it.unit||'')})</option>`).join('');
  document.getElementById('issue-item').innerHTML = opts;
  document.getElementById('issue-borrower').innerHTML = '<option value="">— Tiada —</option>' + staffList.map(s => `<option value="${s.id}">${escHtml(s.full_name||'—')}</option>`).join('');
}

function onIssueItemChange() {
  const id = document.getElementById('issue-item').value;
  const it = prepItems.find(i => i.id === id);
  const hint = document.getElementById('issue-stock-hint');
  if (it && it.source === 'inventory') hint.textContent = `Barang ini akan dipotong dari stok inventori (${it.unit || 'unit'}).`;
  else if (it) hint.textContent = 'Barang manual — tiada potongan stok inventori.';
  else hint.textContent = '';
}
window.onIssueItemChange = onIssueItemChange;

function openIssueModal() {
  populateIssueSelects();
  document.getElementById('issue-item').value = '';
  document.getElementById('issue-qty').value = '1';
  document.getElementById('issue-borrower').value = '';
  document.getElementById('issue-notes').value = '';
  document.getElementById('issue-stock-hint').textContent = '';
  document.getElementById('issue-modal').classList.remove('hidden');
}
window.openIssueModal = openIssueModal;
function closeIssueModal() { document.getElementById('issue-modal').classList.add('hidden'); }
window.closeIssueModal = closeIssueModal;

async function submitIssue() {
  const prepItemId = document.getElementById('issue-item').value;
  const it = prepItems.find(i => i.id === prepItemId);
  if (!it) { banner('Sila pilih barang', 'error'); return; }
  const qty = Number(document.getElementById('issue-qty').value) || 0;
  if (qty <= 0) { banner('Kuantiti mesti lebih 0', 'error'); return; }
  const borrowedBy = document.getElementById('issue-borrower').value || null;
  const notes = document.getElementById('issue-notes').value.trim() || null;

  const payload = {
    event_id: eventId, prep_item_id: it.id, inventory_item_id: it.inventory_item_id,
    item_name: it.item_name, qty, borrowed_by: borrowedBy,
    issued_by: window.currentUser?.id || null, notes,
  };
  const { data, error } = await window.db.from('psy_event_stock_issuance').insert(payload).select().single();
  if (error) { banner('Ralat simpan: ' + error.message, 'error'); return; }

  if (it.source === 'inventory' && it.inventory_item_id) {
    try {
      await window.addStockToLocation(it.inventory_item_id, -qty, null, {
        type: 'out', refType: 'event_stock_issuance', refId: data.id, refLabel: 'EVT-' + eventId.slice(0,8),
        note: `Pengeluaran utk acara: ${eventRow.title}`,
      });
    } catch (e) { console.warn('addStockToLocation gagal:', e); }
  }

  issuance.push(data);
  closeIssueModal();
  setSubTab('keluar');
  banner('Barang keluar direkodkan ✓', 'ok');
}
window.submitIssue = submitIssue;

async function returnItem(id) {
  if (!confirm('Tandakan barang ni sudah dipulangkan?')) return;
  const row = issuance.find(i => i.id === id);
  if (!row) return;
  const { error } = await window.db.from('psy_event_stock_issuance').update({ status: 'dipulangkan', returned_at: new Date().toISOString() }).eq('id', id);
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }

  if (row.inventory_item_id) {
    try {
      await window.addStockToLocation(row.inventory_item_id, Number(row.qty), null, {
        type: 'in', refType: 'event_stock_issuance', refId: row.id, refLabel: 'EVT-' + eventId.slice(0,8),
        note: `Pemulangan dari acara: ${eventRow.title}`,
      });
    } catch (e) { console.warn('addStockToLocation gagal:', e); }
  }

  row.status = 'dipulangkan'; row.returned_at = new Date().toISOString();
  setSubTab('keluar');
  banner('Barang dipulangkan ✓', 'ok');
}
window.returnItem = returnItem;

async function loadData() {
  if (!eventId) { banner('Tiada event_id', 'error'); return; }
  const [evRes, itemRes, staffRes, issRes] = await Promise.all([
    window.db.from('psy_events').select('id, title, start_at, location, mode').eq('id', eventId).single(),
    window.db.from('psy_event_prep_items').select('*').eq('event_id', eventId).order('created_at'),
    window.db.from('psy_profiles').select('id, full_name').eq('role', 'staff').order('full_name'),
    window.db.from('psy_event_stock_issuance').select('*').eq('event_id', eventId).order('issued_at', { ascending: false }),
  ]);
  if (evRes.error || !evRes.data) { banner('Acara tidak dijumpai', 'error'); return; }
  eventRow = evRes.data;
  prepItems = itemRes.data || [];
  staffList = staffRes.data || [];
  issuance = issRes.data || [];
  renderHeader();
  setSubTab('keluar');
}

async function init() {
  const user = await initStaff('persediaan_event_keluar', 'Pengeluaran & Pemulangan', 'persediaan_event');
  if (!user) return;
  await loadData();
}

init();
</script>
</body>
</html>
