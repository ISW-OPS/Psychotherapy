<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Maklum Balas Pesakit</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">⭐</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-6">

        <!-- Summary chips -->
        <div class="grid grid-cols-3 gap-3">
          <div class="bg-white rounded-xl border border-ink/10 px-4 py-3 flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-gold/10 flex items-center justify-center text-lg">⭐</div>
            <div>
              <div class="text-[11px] text-ink/50 font-semibold uppercase">Purata Rating</div>
              <div class="text-xl font-bold text-ink" id="avg-rating">—</div>
            </div>
          </div>
          <div class="bg-white rounded-xl border border-ink/10 px-4 py-3 flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-navy/10 flex items-center justify-center text-lg">📝</div>
            <div>
              <div class="text-[11px] text-ink/50 font-semibold uppercase">Jumlah Feedback</div>
              <div class="text-xl font-bold text-ink" id="total-count">—</div>
            </div>
          </div>
          <div class="bg-white rounded-xl border border-ink/10 px-4 py-3 flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-green/10 flex items-center justify-center text-lg">😊</div>
            <div>
              <div class="text-[11px] text-ink/50 font-semibold uppercase">5 Bintang</div>
              <div class="text-xl font-bold text-ink" id="five-star">—</div>
            </div>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="flex items-center gap-3 flex-wrap">
          <select id="filter-rating" onchange="renderList()" class="border border-ink/20 rounded-lg px-3 py-2 text-sm outline-none focus:border-navy bg-white">
            <option value="">Semua Rating</option>
            <option value="5">⭐⭐⭐⭐⭐ (5)</option>
            <option value="4">⭐⭐⭐⭐ (4)</option>
            <option value="3">⭐⭐⭐ (3)</option>
            <option value="2">⭐⭐ (2)</option>
            <option value="1">⭐ (1)</option>
          </select>
          <input id="filter-search" oninput="renderList()" placeholder="Cari nama pesakit..." class="border border-ink/20 rounded-lg px-3 py-2 text-sm outline-none focus:border-navy bg-white w-56">
          <span id="filter-count" class="text-xs text-ink/40 ml-auto"></span>
        </div>

        <!-- Feedback list -->
        <div id="feedback-list" class="space-y-3"></div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
    function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
const escHtml = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let allFeedback = [];

function stars(n) {
  return '⭐'.repeat(n) + '<span class="opacity-20">' + '⭐'.repeat(5 - n) + '</span>';
}

function renderList() {
  const ratingF = document.getElementById('filter-rating').value;
  const searchF = document.getElementById('filter-search').value.trim().toLowerCase();

  const filtered = allFeedback.filter(f => {
    if (ratingF && f.rating !== parseInt(ratingF)) return false;
    if (searchF && !(f.patient_name || '').toLowerCase().includes(searchF)) return false;
    return true;
  });

  document.getElementById('filter-count').textContent = `${filtered.length} daripada ${allFeedback.length} feedback`;

  if (!filtered.length) {
    document.getElementById('feedback-list').innerHTML =
      '<div class="bg-white rounded-xl border border-ink/10 px-4 py-10 text-center text-ink/40 text-sm italic">Tiada maklum balas ditemui</div>';
    return;
  }

  document.getElementById('feedback-list').innerHTML = filtered.map(f => {
    const dt   = new Date(f.created_at);
    const date = dt.toLocaleDateString(LCALE(), { day:'2-digit', month:'short', year:'numeric' });
    const time = dt.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    const helpful = (f.helpful || []);
    const initials = (f.patient_name || '?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();

    return `<div class="bg-white rounded-xl border border-ink/10 p-4 md:p-5">
      <div class="flex items-start gap-4">
        <div class="w-10 h-10 rounded-full bg-navy flex items-center justify-center text-white font-bold text-sm flex-shrink-0">${initials}</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-3 flex-wrap">
            <span class="font-semibold text-sm">${escHtml(f.patient_name || 'Pesakit')}</span>
            <span class="text-sm">${stars(f.rating)}</span>
            <span class="text-[11px] text-ink/40 ml-auto">${date} · ${time}</span>
          </div>
          ${helpful.length ? `<div class="flex flex-wrap gap-1.5 mt-2">${helpful.map(h => `<span class="text-[11px] px-2 py-0.5 rounded-full bg-navy/8 text-navy font-medium">${escHtml(h)}</span>`).join('')}</div>` : ''}
          ${f.comment ? `<p class="text-sm text-ink/70 mt-2 leading-relaxed italic">"${escHtml(f.comment)}"</p>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

(async () => {
  const user = await initStaff('feedback', 'Maklum balas pesakit');
  if (!user) return;

  const { data, error } = await window.db.from('psy_feedback')
    .select('*').order('created_at', { ascending: false });

  if (error) { banner('Ralat: ' + error.message, 'error'); return; }

  allFeedback = data || [];

  // Summary stats
  const total = allFeedback.length;
  const avg   = total ? (allFeedback.reduce((s, f) => s + f.rating, 0) / total).toFixed(1) : '—';
  const five  = allFeedback.filter(f => f.rating === 5).length;

  document.getElementById('avg-rating').textContent = total ? `${avg} / 5` : '—';
  document.getElementById('total-count').textContent = total;
  document.getElementById('five-star').textContent   = five;

  renderList();
})();
</script>
</body>
</html>
