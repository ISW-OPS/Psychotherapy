<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Edit Produk</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🛒</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 max-w-2xl mx-auto">
        <div class="bg-white rounded-2xl border border-ink/10 overflow-hidden">
          <div class="p-5 border-b border-ink/10 bg-navy text-white">
            <h3 id="form-title" class="font-bold text-base">Tambah Produk</h3>
          </div>

          <div class="p-5 space-y-4">
            <input id="edit-id" type="hidden">

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold">Product ID</label>
                <input id="f-pid" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm bg-cream/50 text-ink/60 font-mono" readonly>
              </div>
              <div>
                <label class="text-xs font-semibold">Kategori</label>
                <select id="f-cat" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm bg-white focus:border-navy outline-none">
                  <option>Madu</option>
                  <option>IV Saline Drip</option>
                  <option>Herba</option>
                  <option>Buku</option>
                </select>
              </div>
            </div>

            <div>
              <label class="text-xs font-semibold">Nama <span class="text-terracotta">*</span></label>
              <input id="f-name" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
            </div>

            <div>
              <label class="text-xs font-semibold">Description</label>
              <input id="f-desc" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold">Harga (RM)</label>
                <input id="f-price" type="number" step="0.01" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none">
              </div>
              <div>
                <label class="text-xs font-semibold">Stock</label>
                <input id="f-stock" type="number" class="w-full mt-1 px-3 py-2.5 border border-ink/20 rounded-lg text-sm focus:border-navy outline-none" placeholder="optional">
              </div>
            </div>

            <div>
              <label class="text-xs font-semibold">Gambar Produk</label>
              <div class="mt-2 flex items-center gap-3">
                <div id="prod-img-preview" class="w-20 h-20 rounded-xl border-2 border-dashed border-ink/20 flex items-center justify-center bg-cream/50 overflow-hidden flex-shrink-0 text-2xl text-ink/30 cursor-pointer hover:border-navy transition-colors" onclick="document.getElementById('f-image').click()">
                  📷
                </div>
                <div>
                  <input id="f-image" type="file" accept="image/*" onchange="previewProdImage(this)" class="hidden">
                  <input id="f-image-url" type="hidden">
                  <input id="f-image-raw" type="hidden">
                  <button type="button" onclick="document.getElementById('f-image').click()" class="px-3 py-2 border border-ink/20 rounded-lg text-xs hover:border-navy hover:text-navy transition-colors">
                    Pilih Gambar
                  </button>
                  <p class="text-[10px] text-ink/40 mt-1">JPG, PNG · maks 10MB</p>
                </div>
              </div>
            </div>

            <div id="prod-image-editor" class="hidden rounded-xl border border-ink/10 bg-cream/30 p-3 space-y-3">
              <div class="aspect-video rounded-lg overflow-hidden bg-white border border-ink/10">
                <img id="prod-crop-preview" class="w-full h-full object-cover" alt="Preview gambar produk">
              </div>
              <div class="grid grid-cols-3 gap-3">
                <label class="text-[11px] font-semibold text-ink/70">Saiz
                  <input id="prod-crop-zoom" type="range" min="1" max="3" step="0.05" value="1" oninput="renderProdImageCrop()" class="w-full">
                </label>
                <label class="text-[11px] font-semibold text-ink/70">Kiri / Kanan
                  <input id="prod-crop-x" type="range" min="-100" max="100" step="1" value="0" oninput="renderProdImageCrop()" class="w-full">
                </label>
                <label class="text-[11px] font-semibold text-ink/70">Atas / Bawah
                  <input id="prod-crop-y" type="range" min="-100" max="100" step="1" value="0" oninput="renderProdImageCrop()" class="w-full">
                </label>
              </div>
              <button type="button" onclick="resetProdImageCrop()" class="text-xs font-semibold text-navy hover:underline">Reset gambar</button>
            </div>
          </div>

          <div class="p-5 border-t border-ink/10 bg-cream/30 flex justify-end gap-2">
            <button onclick="window.location.href='products.html'" class="px-4 py-2.5 border border-ink/20 rounded-lg text-sm font-semibold hover:bg-ink/5">Batal</button>
            <button id="btn-save" onclick="saveProduct()" class="bg-navy text-white px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-navy-dark">Simpan</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const BG_MAP = { 'Madu': 'bg-gold-light', 'IV Saline Drip': 'bg-navy-light', 'Herba': 'bg-green-light', 'Buku': 'bg-cream' };

function nextSequenceId(items, field, prefix) {
  const re = new RegExp(`^${prefix}\\s*(\\d+)$`, 'i');
  const max = (items || []).reduce((h, item) => { const m = String(item[field] || '').trim().match(re); return m ? Math.max(h, parseInt(m[1], 10) || 0) : h; }, 0);
  return `${prefix} ${String(max + 1).padStart(3, '0')}`;
}

async function generateUniqueProductId() {
  const { data } = await window.db.from('psy_products').select('product_id');
  const base = nextSequenceId(data, 'product_id', 'P');
  const used = new Set((data || []).map(p => p.product_id).filter(Boolean));
  if (!used.has(base)) return base;
  for (let i = 1; i < 10000; i++) { const c = `P ${String(i).padStart(3, '0')}`; if (!used.has(c)) return c; }
  return `P ${Date.now().toString().slice(-6)}`;
}

function previewProdImage(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { banner('Gambar melebihi 10MB', 'error'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = e => { document.getElementById('f-image-raw').value = e.target.result; applyProdImageAdjustment(); };
  reader.readAsDataURL(file);
}

let prodCropImage = null;

function cropImageDataUrl(img, zoom, offsetX, offsetY, width = 1200, height = 675) {
  if (!img) return Promise.resolve('');
  const baseScale = Math.max(width / img.width, height / img.height);
  const scale = baseScale * zoom;
  const drawW = img.width * scale, drawH = img.height * scale;
  const maxX = Math.max(0, (drawW - width) / 2), maxY = Math.max(0, (drawH - height) / 2);
  const dx = (width - drawW) / 2 + (offsetX / 100) * maxX, dy = (height - drawH) / 2 + (offsetY / 100) * maxY;
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  canvas.getContext('2d').drawImage(img, dx, dy, drawW, drawH);
  return Promise.resolve(canvas.toDataURL('image/jpeg', 0.9));
}

function loadCropImage(src) {
  return new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = reject; img.src = src; });
}

async function applyProdImageAdjustment(reset = true) {
  const raw = document.getElementById('f-image-raw').value;
  if (!raw) return;
  try {
    prodCropImage = await loadCropImage(raw);
    document.getElementById('prod-image-editor').classList.remove('hidden');
    if (reset) resetProdImageCrop(false);
    else renderProdImageCrop();
  } catch (err) { banner('Gagal proses gambar: ' + err.message, 'error'); }
}

async function renderProdImageCrop() {
  if (!prodCropImage) return;
  const adjusted = await cropImageDataUrl(prodCropImage,
    parseFloat(document.getElementById('prod-crop-zoom').value) || 1,
    parseInt(document.getElementById('prod-crop-x').value) || 0,
    parseInt(document.getElementById('prod-crop-y').value) || 0);
  document.getElementById('f-image-url').value = adjusted;
  document.getElementById('prod-crop-preview').src = adjusted;
  document.getElementById('prod-img-preview').innerHTML = `<img src="${adjusted}" class="w-full h-full object-cover">`;
}

function resetProdImageCrop(render = true) {
  document.getElementById('prod-crop-zoom').value = 1;
  document.getElementById('prod-crop-x').value = 0;
  document.getElementById('prod-crop-y').value = 0;
  renderProdImageCrop();
}

async function saveProduct() {
  const editId = document.getElementById('edit-id').value;
  const cat = document.getElementById('f-cat').value;
  const data = {
    name: document.getElementById('f-name').value.trim(),
    description: document.getElementById('f-desc').value.trim(),
    category: cat,
    price: parseFloat(document.getElementById('f-price').value) || 0,
    stock: parseInt(document.getElementById('f-stock').value) || null,
    image_url: document.getElementById('f-image-url').value || null,
    bg_color: BG_MAP[cat] || 'bg-cream',
    updated_at: new Date().toISOString(),
  };
  if (!data.name) { banner('Nama produk wajib diisi', 'error'); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    let auditTarget = editId;
    if (editId) {
      await dbUpdate('psy_products', editId, data);
    } else {
      data.product_id = await generateUniqueProductId();
      auditTarget = data.product_id;
      const { error } = await window.db.from('psy_products').insert(data);
      if (error) throw error;
    }
    await auditLog(editId ? 'product.updated' : 'product.created', auditTarget);
    banner('Disimpan');
    setTimeout(() => { window.location.href = 'products.html'; }, 800);
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan';
  }
}

(async () => {
  const user = await initStaff('psy_products', '');
  if (!user) return;

  const params = new URLSearchParams(location.search);
  const editId = params.get('id');

  if (editId) {
    setPageTitle('Edit Produk', 'Kemaskini maklumat produk shop');
    setHeaderBack('products.html', 'Kembali ke Products');
    document.getElementById('form-title').textContent = 'Edit Produk';
    document.getElementById('edit-id').value = editId;
    const { data: p } = await window.db.from('psy_products').select('*').eq('id', editId).single();
    if (!p) { banner('Produk tidak ditemui', 'error'); return; }
    document.getElementById('f-pid').value = p.product_id || '';
    document.getElementById('f-cat').value = p.category || 'Madu';
    document.getElementById('f-name').value = p.name || '';
    document.getElementById('f-desc').value = p.description || '';
    document.getElementById('f-price').value = p.price || '';
    document.getElementById('f-stock').value = p.stock || '';
    document.getElementById('f-image-url').value = p.image_url || '';
    document.getElementById('f-image-raw').value = p.image_url || '';
    document.getElementById('prod-image-editor').classList.toggle('hidden', !p.image_url);
    const prev = document.getElementById('prod-img-preview');
    prev.innerHTML = p.image_url ? `<img src="${p.image_url}" class="w-full h-full object-cover">` : '📷';
    if (p.image_url) { document.getElementById('prod-crop-preview').src = p.image_url; applyProdImageAdjustment(false); }
  } else {
    setPageTitle('Tambah Produk', 'Cipta produk shop baru');
    setHeaderBack('products.html', 'Kembali ke Products');
    document.getElementById('f-pid').value = await generateUniqueProductId();
  }
})();
</script>
</body>
</html>
