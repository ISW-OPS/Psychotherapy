<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Letter Templates</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📄</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">
        <div class="flex items-start justify-between gap-4 flex-wrap">
          <div>
            <h2 class="text-xl font-bold text-navy">Letter Template List</h2>
            <p class="text-xs text-ink/50 mt-0.5">Manage and view all letter templates available in the system.</p>
          </div>
          <a id="btn-new-tpl" href="surat-edit.html" data-rbac="surat.create" class="hidden bg-navy text-white px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-navy-dark">+ Create Template</a>
        </div>

        <!-- Stat cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="bg-white rounded-2xl border border-ink/10 p-4">
            <div class="w-9 h-9 rounded-xl bg-navy/10 flex items-center justify-center text-base mb-2">📄</div>
            <div class="text-[10px] text-ink/40 font-semibold uppercase tracking-wide">Total Templates</div>
            <div id="stat-total" class="text-2xl font-bold text-ink">—</div>
          </div>
          <div class="bg-white rounded-2xl border border-ink/10 p-4">
            <div class="w-9 h-9 rounded-xl bg-green-light flex items-center justify-center text-base mb-2">✅</div>
            <div class="text-[10px] text-ink/40 font-semibold uppercase tracking-wide">Active Templates</div>
            <div id="stat-active" class="text-2xl font-bold text-green-dark">—</div>
          </div>
          <div class="bg-white rounded-2xl border border-ink/10 p-4">
            <div class="w-9 h-9 rounded-xl bg-gold/15 flex items-center justify-center text-base mb-2">⏸️</div>
            <div class="text-[10px] text-ink/40 font-semibold uppercase tracking-wide">Inactive Templates</div>
            <div id="stat-inactive" class="text-2xl font-bold text-gold-dark">—</div>
          </div>
          <div class="bg-white rounded-2xl border border-ink/10 p-4">
            <div class="w-9 h-9 rounded-xl bg-teal/10 flex items-center justify-center text-base mb-2">📈</div>
            <div class="text-[10px] text-ink/40 font-semibold uppercase tracking-wide">Used This Month</div>
            <div id="stat-used" class="text-2xl font-bold text-teal">—</div>
          </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-2xl border border-ink/10 p-4 flex gap-2 flex-wrap items-center">
          <div class="relative flex-1 min-w-[220px]">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/30 text-sm">🔍</span>
            <input id="f-search" type="text" placeholder="Search template name..." oninput="renderList()"
              class="w-full pl-9 pr-3 py-2.5 border border-ink/20 rounded-xl text-sm focus:outline-none focus:border-navy">
          </div>
          <select id="f-status" onchange="renderList()" class="border border-ink/15 rounded-xl px-3 py-2.5 text-sm bg-white outline-none focus:border-navy">
            <option value="">All Statuses</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
          <button onclick="resetFilters()" class="border border-ink/15 rounded-xl px-4 py-2.5 text-sm text-ink/50 hover:bg-cream">↺ Reset</button>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl border border-ink/10 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="bg-ink/[0.02] border-b border-ink/10 text-left">
                  <th class="px-5 py-3 text-[10px] font-bold text-ink/40 uppercase tracking-widest">#</th>
                  <th class="px-4 py-3 text-[10px] font-bold text-ink/40 uppercase tracking-widest">Template Name</th>
                  <th class="px-4 py-3 text-center text-[10px] font-bold text-ink/40 uppercase tracking-widest">Requires Approval</th>
                  <th class="px-4 py-3 text-center text-[10px] font-bold text-ink/40 uppercase tracking-widest">Status</th>
                  <th class="px-4 py-3 text-[10px] font-bold text-ink/40 uppercase tracking-widest">Last Updated</th>
                  <th class="px-4 py-3 text-center text-[10px] font-bold text-ink/40 uppercase tracking-widest">Actions</th>
                </tr>
              </thead>
              <tbody id="tbl-body"><tr><td colspan="6" class="text-center py-12 text-ink/40 text-sm italic">Memuatkan...</td></tr></tbody>
            </table>
          </div>
          <div class="px-5 py-3 border-t border-ink/8 flex items-center justify-between flex-wrap gap-2">
            <div id="page-info" class="text-xs text-ink/40"></div>
            <div id="page-btns" class="flex items-center gap-1"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const PAGE_SIZE = 10;
let allTemplates = [];
let allRequests = [];
let currentPage = 1;

function isAdmin() { return can('surat','edit'); }
function escHtml(s) { return (s || '').replace(/</g,'&lt;'); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—'; }

async function loadData() {
  const [tplRes, reqRes] = await Promise.all([
    window.db.from('psy_letter_templates').select('*').order('updated_at', { ascending: false }),
    window.db.from('psy_letter_requests').select('template_code, created_at'),
  ]);
  allTemplates = tplRes.data || [];
  allRequests = reqRes.data || [];

  document.getElementById('btn-new-tpl').classList.toggle('hidden', !isAdmin());

  renderStats();
  renderList();
}

function renderStats() {
  document.getElementById('stat-total').textContent = allTemplates.length;
  document.getElementById('stat-active').textContent = allTemplates.filter(t => t.is_active !== false).length;
  document.getElementById('stat-inactive').textContent = allTemplates.filter(t => t.is_active === false).length;
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const usedThisMonth = allRequests.filter(r => new Date(r.created_at) >= monthStart).length;
  document.getElementById('stat-used').textContent = usedThisMonth;
}

function resetFilters() {
  document.getElementById('f-search').value = '';
  document.getElementById('f-status').value = '';
  currentPage = 1;
  renderList();
}
window.resetFilters = resetFilters;

function getFiltered() {
  const q = (document.getElementById('f-search').value || '').toLowerCase().trim();
  const fs = document.getElementById('f-status').value;
  return allTemplates.filter(t => {
    if (q && !(t.name || '').toLowerCase().includes(q)) return false;
    if (fs === 'active' && t.is_active === false) return false;
    if (fs === 'inactive' && t.is_active !== false) return false;
    return true;
  });
}

function renderList() {
  const list = getFiltered();
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = list.slice(start, start + PAGE_SIZE);

  const tbody = document.getElementById('tbl-body');
  if (!page.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-12 text-ink/40 text-sm">Tiada template sepadan</td></tr>';
  } else {
    tbody.innerHTML = page.map((t, i) => {
      const active = t.is_active !== false;
      return `<tr class="border-b border-ink/5 last:border-0 hover:bg-ink/[0.015] cursor-pointer" onclick="location.href='surat-template-detail.html?id=${t.id}'">
        <td class="px-5 py-3.5 text-xs text-ink/50">${start + i + 1}</td>
        <td class="px-4 py-3.5">
          <div class="font-semibold text-sm text-ink">${escHtml(t.name)}</div>
          ${t.description ? `<div class="text-[11px] text-ink/45 truncate max-w-xs">${escHtml(t.description)}</div>` : ''}
        </td>
        <td class="px-4 py-3.5 text-center" data-i18n-skip>${t.requires_specific_approver ? '<span class="text-xs font-semibold text-navy">Yes</span>' : '<span class="text-xs text-terracotta">No</span>'}</td>
        <td class="px-4 py-3.5 text-center"><span class="text-xs font-semibold px-2 py-0.5 rounded-full ${active ? 'bg-green-light text-green-dark' : 'bg-ink/10 text-ink/50'}">${active ? 'Active' : 'Inactive'}</span></td>
        <td class="px-4 py-3.5 text-xs text-ink/50 whitespace-nowrap">${fmtDate(t.updated_at || t.created_at)}<div class="text-[10px] text-ink/35">by ${escHtml(t.created_by_name) || '—'}</div></td>
        <td class="px-4 py-3.5 text-center" onclick="event.stopPropagation()">
          <div class="relative inline-block">
            <button onclick="toggleRowMenu('${t.id}')" class="w-8 h-8 rounded-lg hover:bg-ink/8 text-ink/50">⋮</button>
            <div id="menu-${t.id}" class="hidden absolute right-0 top-full mt-1 bg-white border border-ink/10 rounded-xl shadow-lg py-1 z-20 w-40">
              <button onclick="location.href='surat-template-detail.html?id=${t.id}'" class="w-full text-left px-3 py-1.5 text-xs hover:bg-cream">👁️ View</button>
              <button onclick="location.href='surat-issue.html?tpl=${t.id}'" data-rbac="surat.create" class="hidden w-full text-left px-3 py-1.5 text-xs hover:bg-cream">📝 Use / Issue Now</button>
              ${isAdmin() ? `<button onclick="location.href='surat-edit.html?id=${t.id}'" class="w-full text-left px-3 py-1.5 text-xs hover:bg-cream">✏️ Edit</button>` : ''}
            </div>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  document.getElementById('page-info').textContent = `Showing ${list.length ? start + 1 : 0} to ${Math.min(start + PAGE_SIZE, list.length)} of ${list.length} templates`;
  const btns = document.getElementById('page-btns');
  let html = `<button onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''} class="px-2 py-1 rounded-lg text-sm border border-ink/15 disabled:opacity-30 hover:bg-ink/5">‹</button>`;
  for (let p = 1; p <= totalPages; p++) {
    html += `<button onclick="goPage(${p})" class="w-8 h-8 rounded-lg text-sm font-semibold ${p===currentPage ? 'bg-navy text-white' : 'border border-ink/15 hover:bg-ink/5 text-ink/60'}">${p}</button>`;
  }
  html += `<button onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''} class="px-2 py-1 rounded-lg text-sm border border-ink/15 disabled:opacity-30 hover:bg-ink/5">›</button>`;
  btns.innerHTML = html;
}
window.renderList = renderList;

function goPage(p) { currentPage = p; renderList(); }
window.goPage = goPage;

function toggleRowMenu(id) {
  document.querySelectorAll('[id^="menu-"]').forEach(m => { if (m.id !== 'menu-' + id) m.classList.add('hidden'); });
  document.getElementById('menu-' + id)?.classList.toggle('hidden');
}
window.toggleRowMenu = toggleRowMenu;
document.addEventListener('click', (e) => {
  if (!e.target.closest('.relative.inline-block')) document.querySelectorAll('[id^="menu-"]').forEach(m => m.classList.add('hidden'));
});

(async () => {
  const user = await initStaff('surat_templates', 'Letter Templates', 'surat');
  if (!user) return;
  await loadData();
})();
</script>
</body>
</html>
