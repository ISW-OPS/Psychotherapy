<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Red Emergency Protocol</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🚨</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <div class="flex items-start justify-between gap-3 flex-wrap">
          <div>
            <h1 class="text-xl font-bold text-terracotta flex items-center gap-2">🚨 RED EMERGENCY PROTOCOL</h1>
            <p class="text-sm text-ink/45 mt-0.5">Monitor dan follow up pesakit mengikut aras risiko.</p>
          </div>
          <button data-rbac="emergency.create" onclick="openLaporModal()" class="bg-terracotta hover:bg-terracotta/90 text-white font-semibold px-4 py-2.5 rounded-xl text-sm whitespace-nowrap">+ Lapor Kecemasan</button>
        </div>

        <!-- 4 stat cards — boleh diklik, terus filter jadual di bawah -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <button onclick="setZonTab('merah')" class="text-left bg-red-50/60 border border-red-100 rounded-2xl p-5 hover:ring-2 hover:ring-red-300 transition-shadow">
            <div class="flex items-center gap-2"><span class="text-lg">🔔</span><div id="sc-red" class="text-3xl font-bold text-red-600 leading-none">0</div></div>
            <div class="text-xs font-bold text-red-600 mt-1.5">RED <span class="font-normal text-ink/50">(Kecemasan)</span></div>
            <div class="text-[11px] text-ink/45">Perlu tindakan segera</div>
          </button>
          <button onclick="setZonTab('kuning')" class="text-left bg-amber-50/60 border border-amber-100 rounded-2xl p-5 hover:ring-2 hover:ring-amber-300 transition-shadow">
            <div class="flex items-center gap-2"><span class="text-lg">⚠️</span><div id="sc-yellow" class="text-3xl font-bold text-amber-500 leading-none">0</div></div>
            <div class="text-xs font-bold text-amber-600 mt-1.5">YELLOW <span class="font-normal text-ink/50">(Perlu Perhatian)</span></div>
            <div class="text-[11px] text-ink/45">Perlu follow up</div>
          </button>
          <button onclick="setZonTab('hijau')" class="text-left bg-green-50/60 border border-green-100 rounded-2xl p-5 hover:ring-2 hover:ring-green-300 transition-shadow">
            <div class="flex items-center gap-2"><span class="text-lg">✅</span><div id="sc-green" class="text-3xl font-bold text-green-600 leading-none">0</div></div>
            <div class="text-xs font-bold text-green-700 mt-1.5">GREEN <span class="font-normal text-ink/50">(Stabil)</span></div>
            <div class="text-[11px] text-ink/45">Pemantauan rutin</div>
          </button>
          <button onclick="setZonTab('')" class="text-left bg-navy-light/40 border border-navy/10 rounded-2xl p-5 hover:ring-2 hover:ring-navy/30 transition-shadow">
            <div class="flex items-center gap-2"><span class="text-lg">👥</span><div id="sc-total" class="text-3xl font-bold text-navy leading-none">0</div></div>
            <div class="text-xs font-bold text-navy mt-1.5">Jumlah Pesakit Aktif</div>
            <div class="text-[11px] text-ink/45">Dalam rawatan</div>
          </button>
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
          <div class="px-5 py-4 border-b border-ink/8 space-y-3">
            <h3 class="font-bold text-sm text-ink">PESAKIT PERLU TINDAKAN</h3>
            <div class="flex items-center gap-2 flex-wrap justify-between">
              <div id="zon-tabs" class="flex items-center gap-1.5 flex-wrap"></div>
              <div class="flex items-center gap-2 flex-wrap">
                <select id="coach-filter" onchange="currentPage=1;renderTable()" class="text-xs border border-ink/15 rounded-lg px-2.5 py-1.5 bg-white text-ink outline-none focus:border-navy">
                  <option value="">Semua Coach</option>
                </select>
                <input id="search" oninput="currentPage=1;renderTable()" type="text" placeholder="🔍 Cari nama / IC / pesakit..." class="text-xs border border-ink/15 rounded-lg px-3 py-1.5 bg-white text-ink outline-none focus:border-navy w-56">
              </div>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="text-left text-[10px] uppercase tracking-wider text-ink/40 border-b border-ink/8 bg-ink/[0.015]">
                  <th class="py-2.5 px-5 font-bold">Pesakit</th>
                  <th class="py-2.5 px-3 font-bold">Zon</th>
                  <th class="py-2.5 px-3 font-bold">Trigger / Simptom</th>
                  <th class="py-2.5 px-3 font-bold">Assigned To</th>
                  <th class="py-2.5 px-3 font-bold">Status</th>
                  <th class="py-2.5 px-5 font-bold text-right">Tindakan</th>
                </tr>
              </thead>
              <tbody id="tbl-tbody"></tbody>
            </table>
          </div>
          <div id="pagination" class="border-t border-ink/5 px-5 py-3 flex items-center justify-between gap-3 flex-wrap"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- Modal: Lapor Kecemasan -->
<div id="lapor-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
    <div class="px-5 py-4 border-b border-ink/10 flex items-center justify-between">
      <h3 class="font-bold text-sm text-ink">🚨 Lapor Kecemasan</h3>
      <button onclick="closeLaporModal()" class="text-ink/40 text-2xl leading-none">&times;</button>
    </div>
    <div class="p-5 space-y-3">
      <div>
        <label class="text-xs font-semibold text-ink/60 mb-1 block">Pesakit</label>
        <select id="lapor-patient" class="w-full border border-ink/20 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-navy"></select>
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/60 mb-1 block">Zon</label>
        <div class="flex gap-2">
          <label class="flex-1 flex items-center justify-center gap-1.5 border border-red-200 bg-red-50 text-red-600 rounded-xl px-3 py-2.5 text-sm font-semibold cursor-pointer">
            <input type="radio" name="lapor-zon" value="merah" checked class="accent-red-600"> 🔴 Merah
          </label>
          <label class="flex-1 flex items-center justify-center gap-1.5 border border-amber-200 bg-amber-50 text-amber-600 rounded-xl px-3 py-2.5 text-sm font-semibold cursor-pointer">
            <input type="radio" name="lapor-zon" value="kuning" class="accent-amber-500"> 🟡 Kuning
          </label>
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/60 mb-1 block">Trigger / Simptom</label>
        <textarea id="lapor-notes" rows="3" placeholder="cth. Sesak nafas, sakit dada (dilaporkan via telefon)..." class="w-full border border-ink/20 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-navy resize-none"></textarea>
      </div>
    </div>
    <div class="px-5 pb-5 flex gap-2">
      <button onclick="closeLaporModal()" class="flex-1 border border-ink/20 text-ink/60 py-2.5 rounded-xl text-sm">Batal</button>
      <button id="lapor-submit" onclick="submitLapor()" class="flex-1 bg-terracotta hover:bg-terracotta/90 text-white py-2.5 rounded-xl text-sm font-semibold">Hantar</button>
    </div>
  </div>
</div>

<!-- Modal: Urus Kes (status/PIC/resolution) -->
<div id="case-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
    <div class="px-5 py-4 border-b border-ink/10 flex items-center justify-between sticky top-0 bg-white">
      <div>
        <h3 id="case-title" class="font-bold text-sm text-ink">Urus Kes</h3>
        <div id="case-zon-chip" class="mt-1"></div>
      </div>
      <button onclick="closeCaseModal()" class="text-ink/40 text-2xl leading-none">&times;</button>
    </div>
    <div class="p-5 space-y-4">
      <div>
        <label class="text-xs font-semibold text-ink/60 mb-1 block">Trigger / Simptom</label>
        <p id="case-trigger" class="text-sm text-ink/80 bg-cream/50 rounded-xl px-3 py-2.5"></p>
      </div>
      <div id="case-overdue-banner" class="hidden bg-terracotta/10 border border-terracotta/30 text-terracotta text-xs font-semibold rounded-xl px-3 py-2.5"></div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-ink/60 mb-1 block">Status</label>
          <select id="case-status" onchange="onCaseStatusChange()" class="w-full border border-ink/20 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-navy"></select>
        </div>
        <div>
          <label class="text-xs font-semibold text-ink/60 mb-1 block">PIC (Assigned To)</label>
          <select id="case-pic" class="w-full border border-ink/20 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-navy"></select>
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/60 mb-1 block">Sejarah / Nota</label>
        <p id="case-notes-history" class="text-xs text-ink/60 whitespace-pre-line bg-cream/50 rounded-xl px-3 py-2.5 mb-2 max-h-32 overflow-y-auto"></p>
        <textarea id="case-note-new" rows="2" placeholder="Tambah nota tindakan..." class="w-full border border-ink/20 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-navy resize-none"></textarea>
      </div>
      <div id="case-resolution-block" class="hidden">
        <label class="text-xs font-semibold text-terracotta mb-1 block">⚠️ Resolution / Outcome (wajib bila Selesai)</label>
        <textarea id="case-resolution" rows="3" placeholder="Apa berlaku, tindakan diambil, keputusan akhir..." class="w-full border border-terracotta/40 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-terracotta resize-none"></textarea>
      </div>
      <a id="case-clinical-link" href="#" class="flex items-center justify-center gap-1.5 text-xs font-semibold text-navy border border-navy/25 rounded-xl px-3 py-2.5 hover:bg-navy/5 no-underline">🏥 Pesakit Masuk Wad/Hospital? Cipta Rekod Klinikal Pesakit →</a>
    </div>
    <div class="px-5 pb-5 flex gap-2">
      <button onclick="closeCaseModal()" class="flex-1 border border-ink/20 text-ink/60 py-2.5 rounded-xl text-sm">Tutup</button>
      <button id="case-save" onclick="saveCaseModal()" class="flex-1 bg-navy hover:bg-navy/90 text-white py-2.5 rounded-xl text-sm font-semibold">Simpan</button>
    </div>
  </div>
</div>

<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/utils.js"></script>
<script src="_shared.js"></script>
<script>
const ZON_META = {
  merah:  { label: 'RED',    sub: 'Kecemasan',      chip: 'bg-red-100 text-red-700',    dot: 'bg-red-500' },
  kuning: { label: 'YELLOW', sub: 'Perlu Perhatian', chip: 'bg-amber-100 text-amber-700', dot: 'bg-amber-400' },
  hijau:  { label: 'GREEN',  sub: 'Stabil',          chip: 'bg-green-100 text-green-700', dot: 'bg-green-500' },
};
// Label papar ikut vokab management (Baru/Acknowledged/Dalam Tindakan/Selesai) —
// nilai DB (kolum status) KEKAL macam sedia ada, cuma label UI diselaraskan supaya
// staf nampak peringkat jelas. "Dalam Tindakan" ada 2 sub-status DB (waiting_vital/
// follow_up) bergantung apa staf tengah buat.
const STATUS_META = {
  waiting_coach: { label: 'Baru',                          stage: 1, cls: 'bg-red-100 text-red-600' },
  contacted:     { label: 'Acknowledged',                  stage: 2, cls: 'bg-blue-100 text-blue-600' },
  waiting_vital: { label: 'Dalam Tindakan · Vitals',        stage: 3, cls: 'bg-amber-100 text-amber-600' },
  follow_up:     { label: 'Dalam Tindakan · Follow-up',     stage: 3, cls: 'bg-amber-100 text-amber-600' },
  resolved:      { label: 'Selesai',                        stage: 4, cls: 'bg-ink/10 text-ink/50' },
  stable:        { label: 'Stabil',                         stage: 0, cls: 'bg-green-100 text-green-700' },
};
// Susunan progres yang staf boleh pilih di modal detail (label mudah, bukan nilai DB terus)
const STATUS_FLOW = [
  { value: 'waiting_coach', label: 'Baru' },
  { value: 'contacted',     label: 'Acknowledged' },
  { value: 'waiting_vital', label: 'Dalam Tindakan (Menunggu Vitals)' },
  { value: 'follow_up',     label: 'Dalam Tindakan (Follow-up)' },
  { value: 'resolved',      label: 'Selesai' },
];

let patients = [];          // pesakit aktif
let patientById = {};
let coachNameById = {};
let activeAlerts = [];       // psy_emergency_alerts status <> 'resolved'
let alertByPatient = {};     // patient_id -> alert aktif
let zonTab = 'merah';         // 'merah' | 'kuning' | 'hijau' — RED default depan (tiada tab "Semua")
let currentPage = 1;
const PAGE_SIZE = 10;
let showAll = false;

function symptomText(alert) {
  const syms = alert && Array.isArray(alert.symptoms) ? alert.symptoms.map(s => String(s).split('::').pop()).filter(Boolean) : [];
  if (syms.length) return syms.slice(0, 3).join(', ');
  return (alert && alert.notes) || '—';
}
function patientZon(p) { return alertByPatient[p.id] ? alertByPatient[p.id].zon : 'hijau'; }
function patientStatus(p) { const a = alertByPatient[p.id]; return a ? a.status : 'stable'; }

// Escalation timer — kes belum Selesai yg dah lepas response_target_minutes drpd reported_at.
function overdueMinutes(alert) {
  if (!alert || alert.status === 'resolved' || !alert.reported_at) return 0;
  const elapsedMin = (Date.now() - new Date(alert.reported_at).getTime()) / 60000;
  const over = elapsedMin - (alert.response_target_minutes || 0);
  return over > 0 ? Math.round(over) : 0;
}

async function loadEmergency() {
  const nowIso = new Date().toISOString();
  const [patientsRes, alertsRes] = await Promise.all([
    window.db.from('psy_patients')
      .select('id, mrn, full_name, ic_number, phone, coach_id, active_package_id, package_expires_at, psy_profiles!psy_patients_user_id_fkey(full_name)')
      .neq('status', 'deleted').neq('status', 'rejected'),
    window.db.from('psy_emergency_alerts').select('*').neq('status', 'resolved').order('reported_at', { ascending: true }),
  ]);

  patients = (patientsRes.data || [])
    .filter(p => p.active_package_id && (!p.package_expires_at || p.package_expires_at >= nowIso))
    .map(p => ({ id: p.id, mrn: p.mrn, ic: p.ic_number, phone: p.phone, coach_id: p.coach_id, name: p.psy_profiles?.full_name || p.full_name || p.mrn || 'Pesakit' }));
  patientById = {}; patients.forEach(p => { patientById[p.id] = p; });

  const coachIds = [...new Set(patients.map(p => p.coach_id).filter(Boolean))];
  coachNameById = {};
  if (coachIds.length) {
    const { data: coaches } = await window.db.from('psy_profiles').select('id, full_name').in('id', coachIds);
    (coaches || []).forEach(c => { coachNameById[c.id] = c.full_name; });
  }

  activeAlerts = (alertsRes.data || []).filter(a => patientById[a.patient_id]);
  alertByPatient = {}; activeAlerts.forEach(a => { alertByPatient[a.patient_id] = a; });

  renderStats();
  renderCoachFilter();
  renderTabs();
  renderTable();
}

function renderStats() {
  const red = activeAlerts.filter(a => a.zon === 'merah').length;
  const yellow = activeAlerts.filter(a => a.zon === 'kuning').length;
  const total = patients.length;
  document.getElementById('sc-red').textContent = red;
  document.getElementById('sc-yellow').textContent = yellow;
  document.getElementById('sc-green').textContent = Math.max(0, total - red - yellow);
  document.getElementById('sc-total').textContent = total;
}

function renderCoachFilter() {
  const sel = document.getElementById('coach-filter');
  const cur = sel.value;
  const coachIds = [...new Set(patients.map(p => p.coach_id).filter(Boolean))]
    .sort((a, b) => (coachNameById[a] || '').localeCompare(coachNameById[b] || ''));
  sel.innerHTML = '<option value="">Semua Coach</option>' +
    coachIds.map(id => `<option value="${id}">${escapeHtml(coachNameById[id] || '—')}</option>`).join('');
  sel.value = cur;
}

function renderTabs() {
  const red = activeAlerts.filter(a => a.zon === 'merah').length;
  const yellow = activeAlerts.filter(a => a.zon === 'kuning').length;
  const green = Math.max(0, patients.length - red - yellow);
  const tabs = [
    { key: '', label: 'SEMUA', count: patients.length, cls: 'bg-navy text-white' },
    { key: 'merah', label: 'RED', count: red, cls: 'bg-red-100 text-red-600' },
    { key: 'kuning', label: 'YELLOW', count: yellow, cls: 'bg-amber-100 text-amber-600' },
    { key: 'hijau', label: 'GREEN', count: green, cls: 'bg-green-100 text-green-700' },
  ];
  document.getElementById('zon-tabs').innerHTML = tabs.map(t => `
    <button onclick="setZonTab('${t.key}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold border ${zonTab === t.key ? t.cls + ' border-transparent' : 'border-ink/15 text-ink/55 hover:bg-ink/5'}">${t.label} <span class="opacity-75">${t.count}</span></button>
  `).join('');
}
function setZonTab(key) { zonTab = key; currentPage = 1; renderTabs(); renderTable(); }

function sortedFilteredList() {
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  const coach = document.getElementById('coach-filter').value;
  return patients
    .filter(p => {
      if (zonTab && patientZon(p) !== zonTab) return false;
      if (coach && p.coach_id !== coach) return false;
      if (q && !p.name.toLowerCase().includes(q) && !(p.mrn || '').toLowerCase().includes(q) && !(p.ic || '').toLowerCase().includes(q)) return false;
      return true;
    })
    .sort((a, b) => {
      const rank = z => z === 'merah' ? 0 : z === 'kuning' ? 1 : 2;
      const ra = rank(patientZon(a)), rb = rank(patientZon(b));
      if (ra !== rb) return ra - rb;
      return a.name.localeCompare(b.name);
    });
}

function renderTable() {
  const list = sortedFilteredList();
  const tbody = document.getElementById('tbl-tbody');

  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="6" style="height:${PAGE_SIZE * 57}px" class="text-center text-sm text-ink/35">Tiada pesakit ditemui</td></tr>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  const pageRows = showAll ? list : list.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  let bodyHtml = pageRows.map(p => {
    const zon = patientZon(p), zm = ZON_META[zon];
    const status = patientStatus(p), sm = STATUS_META[status] || STATUS_META.stable;
    const alert = alertByPatient[p.id];
    const picId = alert ? (alert.assigned_to || null) : p.coach_id;
    const overdue = overdueMinutes(alert);
    const waHref = p.phone ? `inbox.html?phone=${encodeURIComponent(p.phone)}&name=${encodeURIComponent(p.name)}` : '#';
    return `<tr class="border-b border-ink/5 hover:bg-ink/[0.015] ${alert ? 'cursor-pointer' : ''}" ${alert ? `onclick="openCaseModal('${p.id}')"` : ''}>
      <td class="py-3 px-5">
        <div class="min-w-0">
          <div class="text-[13px] font-semibold text-ink truncate">${escapeHtml(p.name)}</div>
          <div class="text-[10px] font-mono text-navy/55">${escapeHtml(p.mrn || '—')}</div>
        </div>
      </td>
      <td class="py-3 px-3"><span class="chip ${zm.chip} text-[10px] font-bold">${zm.label}</span><div class="text-[10px] text-ink/40 mt-0.5">${zm.sub}</div></td>
      <td class="py-3 px-3 max-w-[200px]"><div class="text-[12px] text-ink/70 line-clamp-2">${escapeHtml(alert ? symptomText(alert) : '—')}</div></td>
      <td class="py-3 px-3 text-[12px] text-ink/70 whitespace-nowrap">👤 ${escapeHtml(coachNameById[picId] || '—')}</td>
      <td class="py-3 px-3">
        <span class="inline-block px-2.5 py-1 rounded-full text-[10px] font-bold ${sm.cls}">${sm.label}</span>
        ${overdue ? `<div class="text-[10px] font-bold text-terracotta mt-1">⏰ Terlewat ${overdue}min</div>` : ''}
      </td>
      <td class="py-3 px-5 text-right" onclick="event.stopPropagation()">
        ${alert ? `<button title="Urus Kes" onclick="openCaseModal('${p.id}')" class="inline-flex w-8 h-8 rounded-full border border-navy/20 text-navy items-center justify-center hover:bg-navy/5 mr-1.5">📋</button>` : ''}
        <a href="${waHref}" title="WhatsApp" class="inline-flex w-8 h-8 rounded-full border border-green-200 text-green-600 items-center justify-center ${p.phone ? 'hover:bg-green-50' : 'opacity-30 pointer-events-none'}">💬</a>
      </td>
    </tr>`;
  }).join('');
  // Isi baris kosong supaya tinggi kad konsisten (10 baris) tak kira berapa hasil sebenar
  if (pageRows.length < PAGE_SIZE) {
    bodyHtml += `<tr style="height:57px"><td colspan="6"></td></tr>`.repeat(PAGE_SIZE - pageRows.length);
  }
  tbody.innerHTML = bodyHtml;

  const pg = document.getElementById('pagination');
  if (showAll || list.length <= PAGE_SIZE) {
    pg.innerHTML = `<span class="text-[11px] text-ink/45">Menunjukkan ${pageRows.length} daripada ${list.length} rekod</span>` +
      (list.length > PAGE_SIZE ? `<button onclick="showAll=false;currentPage=1;renderTable()" class="text-xs font-semibold text-navy hover:underline">Papar Bermuka Surat</button>` : '');
  } else {
    const start = (currentPage - 1) * PAGE_SIZE + 1, end = Math.min(currentPage * PAGE_SIZE, list.length);
    pg.innerHTML = `<span class="text-[11px] text-ink/45">Menunjukkan ${start} hingga ${end} daripada ${list.length} rekod</span>
      <div class="flex items-center gap-2">
        <button onclick="currentPage=Math.max(1,currentPage-1);renderTable()" ${currentPage===1?'disabled':''} class="text-xs font-semibold ${currentPage===1?'text-ink/20':'text-navy hover:underline'}">‹ Sebelum</button>
        <button onclick="currentPage=Math.min(Math.ceil(${list.length}/${PAGE_SIZE}),currentPage+1);renderTable()" ${end>=list.length?'disabled':''} class="text-xs font-semibold ${end>=list.length?'text-ink/20':'text-navy hover:underline'}">Seterus ›</button>
        <button onclick="showAll=true;renderTable()" class="text-xs font-semibold border border-ink/15 rounded-lg px-3 py-1.5 hover:bg-ink/5">Lihat Semua</button>
      </div>`;
  }
}

// ── Lapor Kecemasan (manual) ──
function openLaporModal() {
  const sel = document.getElementById('lapor-patient');
  sel.innerHTML = [...patients].sort((a, b) => a.name.localeCompare(b.name))
    .map(p => `<option value="${p.id}">${escapeHtml(p.name)} (${escapeHtml(p.mrn || '—')})</option>`).join('');
  document.getElementById('lapor-notes').value = '';
  document.querySelector('input[name="lapor-zon"][value="merah"]').checked = true;
  document.getElementById('lapor-modal').classList.remove('hidden');
}
function closeLaporModal() { document.getElementById('lapor-modal').classList.add('hidden'); }

async function submitLapor() {
  const patientId = document.getElementById('lapor-patient').value;
  const zon = document.querySelector('input[name="lapor-zon"]:checked').value;
  const notes = document.getElementById('lapor-notes').value.trim();
  if (!patientId) { banner('Pilih pesakit dahulu', 'error'); return; }

  if (alertByPatient[patientId]) {
    banner('Pesakit ini sudah ada alert aktif — sila lihat di senarai', 'error');
    closeLaporModal();
    return;
  }

  const p = patientById[patientId];
  const btn = document.getElementById('lapor-submit');
  btn.disabled = true; btn.textContent = 'Menghantar...';

  const { data: inserted, error } = await window.db.from('psy_emergency_alerts').insert({
    patient_id: patientId, zon, notes: notes || null, source: 'manual',
    response_target_minutes: zon === 'merah' ? 15 : 60,
    assigned_to: p.coach_id || null, created_by: window.currentUser?.id,
  }).select().single();

  btn.disabled = false; btn.textContent = 'Hantar';

  if (error) { banner('Ralat: ' + error.message, 'error'); return; }

  if (p.coach_id) {
    await notify(p.coach_id, 'reaksi',
      (zon === 'merah' ? '🔴 ZON MERAH: ' : '🟡 Zon Kuning: ') + p.name,
      `Kecemasan dilaporkan manual oleh staff. ${notes ? 'Simptom: ' + notes : ''}`,
      `emergency.html?patient_id=${patientId}`);
  }
  await auditLog('emergency.manual_reported', inserted.id, { patient_id: patientId, zon, notes });

  closeLaporModal();
  banner('Kecemasan dilaporkan ✓');
  await loadEmergency();
}

// ── Urus Kes (status/PIC/resolution) ──
let staffList = [];        // semua staff — pilihan PIC boleh sesiapa, bukan coach je
let caseModalPatientId = null;

async function loadStaffList() {
  const { data } = await window.db.from('psy_profiles').select('id, full_name').eq('role', 'staff').order('full_name');
  staffList = data || [];
}

function openCaseModal(patientId) {
  const p = patientById[patientId];
  const alert = alertByPatient[patientId];
  if (!p || !alert) return;
  caseModalPatientId = patientId;

  const zm = ZON_META[alert.zon] || ZON_META.hijau;
  document.getElementById('case-title').textContent = `Urus Kes — ${p.name}`;
  document.getElementById('case-zon-chip').innerHTML = `<span class="chip ${zm.chip} text-[10px] font-bold">${zm.label}</span>`;
  document.getElementById('case-trigger').textContent = symptomText(alert);

  const overdue = overdueMinutes(alert);
  const banner_ = document.getElementById('case-overdue-banner');
  if (overdue) {
    banner_.textContent = `⏰ Kes ini TERLEWAT ${overdue} minit drpd sasaran tindak balas (${alert.response_target_minutes} min).`;
    banner_.classList.remove('hidden');
  } else {
    banner_.classList.add('hidden');
  }

  document.getElementById('case-status').innerHTML = STATUS_FLOW.map(s =>
    `<option value="${s.value}" ${s.value === alert.status ? 'selected' : ''}>${s.label}</option>`).join('');

  document.getElementById('case-pic').innerHTML = '<option value="">— Belum ditetapkan —</option>' +
    staffList.map(s => `<option value="${s.id}" ${s.id === alert.assigned_to ? 'selected' : ''}>${escapeHtml(s.full_name)}</option>`).join('');

  document.getElementById('case-notes-history').textContent = alert.notes || '—';
  document.getElementById('case-note-new').value = '';
  document.getElementById('case-resolution').value = '';
  document.getElementById('case-clinical-link').href = `peristiwa-baru.html?patient_id=${patientId}&from_alert=${alert.id}`;
  onCaseStatusChange();

  document.getElementById('case-modal').classList.remove('hidden');
}
function closeCaseModal() { document.getElementById('case-modal').classList.add('hidden'); caseModalPatientId = null; }

function onCaseStatusChange() {
  const isResolved = document.getElementById('case-status').value === 'resolved';
  document.getElementById('case-resolution-block').classList.toggle('hidden', !isResolved);
}

async function saveCaseModal() {
  const alert = alertByPatient[caseModalPatientId];
  if (!alert) return;

  const newStatus = document.getElementById('case-status').value;
  const newPic = document.getElementById('case-pic').value || null;
  const newNote = document.getElementById('case-note-new').value.trim();
  const resolution = document.getElementById('case-resolution').value.trim();

  if (newStatus === 'resolved' && !resolution) {
    banner('Sila isi Resolution / Outcome sebelum tandakan Selesai', 'error');
    return;
  }

  const stamp = `[${new Date().toLocaleString('ms-MY', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })} · ${window.currentUser?.full_name || 'Staff'}]`;
  let notesParts = [];
  if (newNote) notesParts.push(`${stamp} ${newNote}`);
  if (newStatus === 'resolved' && resolution) notesParts.push(`${stamp} RESOLUTION: ${resolution}`);
  const updatedNotes = notesParts.length
    ? (alert.notes ? alert.notes + '\n' + notesParts.join('\n') : notesParts.join('\n'))
    : alert.notes;

  const payload = { status: newStatus, assigned_to: newPic, notes: updatedNotes, updated_at: new Date().toISOString() };
  if (newStatus === 'resolved') {
    payload.resolved_at = new Date().toISOString();
    payload.resolved_by = window.currentUser?.id;
  }

  const btn = document.getElementById('case-save');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  const { error } = await window.db.from('psy_emergency_alerts').update(payload).eq('id', alert.id);
  btn.disabled = false; btn.textContent = 'Simpan';

  if (error) { banner('Ralat: ' + error.message, 'error'); return; }

  const changes = {};
  if (newStatus !== alert.status) changes.status = { from: alert.status, to: newStatus };
  if (newPic !== (alert.assigned_to || null)) changes.assigned_to = { from: alert.assigned_to, to: newPic };
  if (Object.keys(changes).length) await auditLog('emergency.case_updated', alert.id, changes);
  if (newStatus === 'resolved') await auditLog('emergency.case_resolved', alert.id, { resolution });

  closeCaseModal();
  banner('Kes dikemaskini ✓');
  await loadEmergency();
}

(async () => {
  const user = await initStaff('emergency', 'Monitor dan follow up pesakit mengikut aras risiko');
  if (!user) return;
  await Promise.all([loadEmergency(), loadStaffList()]);

  // Refresh badge escalation ("Terlewat Xmin") tanpa tunggu realtime event
  setInterval(renderTable, 60000);

  window.db.channel('emergency-alerts')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'psy_emergency_alerts' }, () => loadEmergency())
    .subscribe();

  const pid = new URLSearchParams(location.search).get('patient_id');
  if (pid && patientById[pid]) {
    zonTab = patientZon(patientById[pid]);
    document.getElementById('search').value = patientById[pid].name;
    renderTabs(); renderTable();
  }
})();
</script>
