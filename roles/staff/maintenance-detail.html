<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Maintenance Detail</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🛠️</div><p class="text-ink/60 text-sm">Memuatkan permohonan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <button onclick="history.back()" class="inline-flex items-center gap-1.5 text-xs font-semibold text-ink/55 hover:text-navy">← Kembali</button>

        <!-- Header: ID permohonan, status -->
        <div class="flex items-start justify-between flex-wrap gap-4">
          <div>
            <div class="flex items-center gap-3 flex-wrap">
              <h2 id="d-title" class="text-2xl font-bold text-ink">—</h2>
              <span id="d-status" class="text-xs font-bold px-2.5 py-1 rounded-full"></span>
            </div>
            <div id="d-submitted" class="text-sm text-ink/50 mt-1">—</div>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">

          <!-- Kiri: peralatan, maklumat permohonan, lampiran -->
          <div class="lg:col-span-2 flex flex-col gap-5">

            <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-6 grid grid-cols-1 md:grid-cols-[220px_1fr] gap-6">
              <div id="d-photo-box" class="rounded-xl border border-dashed border-ink/20 bg-cream/40 aspect-[4/3] flex flex-col items-center justify-center text-ink/30 overflow-hidden">
                <span class="text-5xl mb-2">📦</span>
                <span class="text-xs">Tiada gambar</span>
              </div>
              <div class="flex flex-col">
                <div class="flex items-center gap-3 flex-wrap">
                  <h3 id="d-equip-name" class="text-lg font-bold text-ink">—</h3>
                  <span id="d-equip-status" class="text-xs font-bold px-2.5 py-1 rounded-full"></span>
                </div>
                <div id="d-equip-code" class="text-sm text-ink/50 font-mono mt-1">—</div>
                <dl id="info-equip" class="text-sm space-y-2 mt-4"></dl>
                <a id="btn-equip" href="#" class="self-end mt-auto pt-4 text-xs font-semibold text-navy hover:underline">Lihat butiran peralatan →</a>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-6">
              <h3 class="font-bold text-sm text-ink mb-3">Maklumat Permohonan</h3>
              <dl id="info-request" class="grid grid-cols-1 md:grid-cols-2 gap-x-8 text-sm"></dl>
              <div class="mt-4">
                <div class="text-xs text-ink/50 mb-1.5">Masalah</div>
                <div id="d-issue" class="px-4 py-3 bg-ink/[0.03] rounded-xl text-sm text-ink/80 whitespace-pre-line">—</div>
              </div>
              <div id="d-notes-wrap" class="hidden mt-4">
                <div class="text-xs text-ink/50 mb-1.5">Nota tambahan</div>
                <div id="d-notes" class="px-4 py-3 bg-ink/[0.03] rounded-xl text-sm text-ink/80 whitespace-pre-line"></div>
              </div>
            </div>

            <div class="flex-1 bg-white rounded-2xl border border-ink/10 shadow-sm p-6">
              <h3 class="font-bold text-sm text-ink mb-3">Gambar / Lampiran</h3>
              <div id="d-photo-wrap">
                <a id="d-photo-link" href="#" target="_blank" rel="noopener">
                  <img id="d-photo" alt="" class="w-full max-h-72 object-contain rounded-xl border border-ink/10 bg-cream/40">
                </a>
              </div>
              <div id="d-photo-none" class="text-sm text-ink/40">Tiada lampiran</div>
            </div>

          </div>

          <!-- Kanan: keputusan manager + timeline -->
          <div class="flex flex-col gap-5">

            <div class="flex-1 min-h-[360px] bg-white rounded-2xl border border-ink/10 shadow-sm p-6">
              <h3 class="font-bold text-sm text-ink mb-4">Keputusan Manager</h3>
              <div id="review-readonly" class="hidden text-sm space-y-2 mb-4"></div>
              <div id="review-form" class="hidden space-y-4">
                <div>
                  <label class="text-xs font-semibold text-ink/70">Status Semakan <span class="text-terracotta">*</span></label>
                  <select id="rv-status" onchange="onReviewStatusChange()" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm bg-white focus:border-navy outline-none"></select>
                </div>
                <div id="rv-date-wrap" class="hidden">
                  <label class="text-xs font-semibold text-ink/70">Tarikh Maintenance</label>
                  <input id="rv-date" type="date" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none">
                  <div class="text-[11px] text-ink/40 mt-1">Kosongkan jika belum tahu.</div>
                </div>
                <div>
                  <label class="text-xs font-semibold text-ink/70">Nota Manager <span id="rv-note-req" class="hidden text-terracotta">*</span></label>
                  <textarea id="rv-note" rows="3" class="w-full mt-1.5 px-3 py-2.5 border border-ink/15 rounded-xl text-sm focus:border-navy outline-none resize-none" placeholder="Nota untuk makluman staff"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-1">
                  <button id="rv-save" onclick="submitReview()" class="px-5 py-2.5 bg-navy text-white rounded-xl text-sm font-semibold hover:bg-navy-dark shadow-sm">Sahkan</button>
                </div>
              </div>
              <div id="review-none" class="hidden text-sm text-ink/40">Tiada tindakan diperlukan untuk status ini.</div>
            </div>

            <div class="bg-white rounded-2xl border border-ink/10 shadow-sm p-6">
              <h3 class="font-bold text-sm text-ink mb-4">Timeline</h3>
              <ol id="timeline" class="space-y-5 text-sm"></ol>
            </div>

          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const STATUS_LABEL = {
  baru:         ['Menunggu',     'bg-gold/20 text-gold-dark'],
  diluluskan:   ['Diluluskan',   'bg-navy/10 text-navy'],
  dalam_servis: ['Dalam Servis', 'bg-teal/15 text-teal'],
  selesai:      ['Selesai',      'bg-green-light text-green-dark'],
  ditolak:      ['Ditolak',      'bg-terracotta/15 text-terracotta'],
};
const TYPE_LABEL = { repair: 'Pembaikan', cleaning: 'Pembersihan', inspection: 'Pemeriksaan', other: 'Lain-lain' };
const PRIORITY_LABEL = { low: 'Rendah', medium: 'Sederhana', high: 'Tinggi', urgent: 'Segera' };
const PRIORITY_CLS = { low: 'bg-ink/10 text-ink/60', medium: 'bg-gold/20 text-gold-dark', high: 'bg-terracotta/15 text-terracotta', urgent: 'bg-terracotta text-white' };
const EQUIP_STATUS = {
  available:         ['Available',          'bg-navy/10 text-navy'],
  in_use:            ['In Use',             'bg-green-light text-green-dark'],
  under_maintenance: ['Under Maintenance',  'bg-gold/20 text-gold-dark'],
  damaged:           ['Damaged',            'bg-terracotta/15 text-terracotta'],
  lost:              ['Lost',               'bg-ink/10 text-ink/60'],
  retired:           ['Retired',            'bg-ink/10 text-ink/50'],
};
// Pilihan status semakan ikut status semasa. Status sebelumnya juga boleh dipilih (betulkan kalau tertekan silap)
const NEXT_OPTIONS = {
  baru:         [['diluluskan', 'Diluluskan'], ['ditolak', 'Ditolak']],
  diluluskan:   [['dalam_servis', 'Dalam Servis'], ['ditolak', 'Ditolak'], ['baru', 'Kembali ke Menunggu']],
  dalam_servis: [['selesai', 'Selesai'], ['ditolak', 'Ditolak'], ['diluluskan', 'Kembali ke Diluluskan']],
  selesai:      [['dalam_servis', 'Dalam Servis (buka semula)']],
  ditolak:      [['baru', 'Kembali ke Menunggu']],
};

const reqId = new URLSearchParams(location.search).get('id');
let currentUser = null;
let req = null;

function isManager() {
  return can('equipment', 'edit');
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtDate(d) {
  return d ? new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
}
function fmtDateTime(d) {
  return d ? new Date(d).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
}
function chip(map, key) {
  const [label, cls] = map[key] || [key || '—', 'bg-ink/10 text-ink/60'];
  return `<span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${cls}">${escHtml(label)}</span>`;
}
function row(label, value) {
  return `<div class="flex justify-between gap-4 py-1.5 border-b border-ink/5 last:border-0"><dt class="text-ink/50">${label}</dt><dd class="text-ink font-medium text-right">${value}</dd></div>`;
}

async function loadDetail() {
  if (!reqId) { banner('ID permohonan tiada', 'error'); setTimeout(() => history.back(), 1000); return; }
  const { data, error } = await window.db.from('psy_equipment_maintenance')
    .select('*, psy_equipment(id, name, code, category, status, brand, model, serial_no, purchase_date, warranty_expiry, image_url)')
    .eq('id', reqId).maybeSingle();
  if (error || !data) { banner('Permohonan tak dijumpai', 'error'); setTimeout(() => location.href = 'equipment.html', 1000); return; }
  req = data;
  render();
}

function render() {
  const m = req;
  const eq = m.psy_equipment || {};
  const [label, cls] = STATUS_LABEL[m.status] || [m.status, 'bg-ink/10 text-ink/60'];

  document.getElementById('d-title').textContent = m.request_no ? `Permohonan ${m.request_no}` : 'Permohonan Maintenance';
  const st = document.getElementById('d-status');
  st.textContent = label; st.className = `text-xs font-bold px-2.5 py-1 rounded-full ${cls}`;
  document.getElementById('d-submitted').textContent = `Dihantar pada ${fmtDateTime(m.created_at)}`;

  // Peralatan
  document.getElementById('d-equip-name').textContent = eq.name || '—';
  document.getElementById('d-equip-code').textContent = eq.code || '—';
  const [esl, esc] = EQUIP_STATUS[eq.status] || [eq.status || '—', 'bg-ink/10 text-ink/60'];
  const es = document.getElementById('d-equip-status');
  es.textContent = esl; es.className = `text-xs font-bold px-2.5 py-1 rounded-full ${esc}`;
  if (eq.image_url) {
    document.getElementById('d-photo-box').innerHTML = `<img src="${escHtml(eq.image_url)}" alt="" class="w-full h-full object-cover">`;
    document.getElementById('d-photo-box').className = 'rounded-xl border border-ink/10 aspect-[4/3] overflow-hidden';
  }
  document.getElementById('info-equip').innerHTML = [
    row('Kategori', escHtml(eq.category || '—')),
    row('Jenama', escHtml(eq.brand || '—')),
    row('Model', escHtml(eq.model || '—')),
    row('No. Siri', escHtml(eq.serial_no || '—')),
    row('Tarikh Beli', fmtDate(eq.purchase_date)),
    row('Tamat Waranti', fmtDate(eq.warranty_expiry)),
  ].join('');
  const btnEq = document.getElementById('btn-equip');
  if (eq.id) btnEq.href = `equipment-detail.html?id=${eq.id}`; else btnEq.classList.add('hidden');

  // Maklumat permohonan
  document.getElementById('info-request').innerHTML = [
    row('Dilapor Oleh', escHtml(m.reported_by_name || '—')),
    row('Tarikh Mohon', fmtDateTime(m.created_at)),
    row('Jenis', escHtml(TYPE_LABEL[m.request_type] || '—')),
    row('Keutamaan', m.priority ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${PRIORITY_CLS[m.priority] || ''}">${escHtml(PRIORITY_LABEL[m.priority] || m.priority)}</span>` : '—'),
  ].join('');
  document.getElementById('d-issue').textContent = m.issue || '—';
  if (m.notes) {
    document.getElementById('d-notes').textContent = m.notes;
    document.getElementById('d-notes-wrap').classList.remove('hidden');
  }

  // Lampiran
  if (m.photo_url) {
    document.getElementById('d-photo').src = m.photo_url;
    document.getElementById('d-photo-link').href = m.photo_url;
    document.getElementById('d-photo-wrap').classList.remove('hidden');
    document.getElementById('d-photo-none').classList.add('hidden');
  } else {
    document.getElementById('d-photo-wrap').classList.add('hidden');
    document.getElementById('d-photo-none').classList.remove('hidden');
  }

  renderReview();
  renderTimeline();
}

// Panel keputusan: borang untuk manager, paparan sahaja untuk yang lain
function renderReview() {
  const m = req;
  const opts = NEXT_OPTIONS[m.status] || [];
  const canAct = isManager() && opts.length > 0;

  const ro = document.getElementById('review-readonly');
  ro.innerHTML = [
    row('Status', chip(STATUS_LABEL, m.status)),
    row('Tarikh Lulus', fmtDate(m.handled_at && m.status !== 'baru' ? m.handled_at : null)),
    row('Tarikh Maintenance', fmtDate(m.scheduled_date)),
    row('Diproses Oleh', escHtml(m.handled_by_name || '—')),
    row('Nota Manager', `<span class="text-left">${escHtml(m.manager_note || '—')}</span>`),
  ].join('');
  ro.classList.remove('hidden');

  document.getElementById('review-form').classList.toggle('hidden', !canAct);
  document.getElementById('review-none').classList.toggle('hidden', canAct || opts.length > 0);
  if (!canAct) return;

  const sel = document.getElementById('rv-status');
  sel.innerHTML = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  document.getElementById('rv-date').value = m.scheduled_date || '';
  document.getElementById('rv-note').value = m.manager_note || '';
  onReviewStatusChange();
}

function onReviewStatusChange() {
  const v = document.getElementById('rv-status').value;
  document.getElementById('rv-date-wrap').classList.toggle('hidden', v !== 'diluluskan');
  document.getElementById('rv-note-req').classList.toggle('hidden', v !== 'ditolak');
}

// Timeline: hantar → semakan → dalam servis → selesai / ditolak
function renderTimeline() {
  const m = req;
  const reviewed = m.status !== 'baru';
  const rejected = m.status === 'ditolak';
  const inProgress = ['dalam_servis', 'selesai'].includes(m.status);
  const done = m.status === 'selesai';

  const step = (on, title, sub, time, cls) => `
    <li class="flex gap-3">
      <span class="mt-1 w-2.5 h-2.5 rounded-full shrink-0 ${on ? cls : 'bg-ink/15'}"></span>
      <div class="min-w-0">
        <div class="font-semibold ${on ? 'text-ink' : 'text-ink/40'}">${title}</div>
        <div class="text-xs ${on ? 'text-ink/60' : 'text-ink/30'}">${sub}</div>
        <div class="text-[11px] text-ink/40 mt-0.5">${time}</div>
      </div>
    </li>`;

  const items = [
    step(true, 'Permohonan Dihantar', `oleh ${escHtml(m.reported_by_name || '—')}`, fmtDateTime(m.created_at), 'bg-navy'),
    step(reviewed, rejected ? 'Ditolak' : 'Semakan Manager',
      reviewed ? `oleh ${escHtml(m.handled_by_name || 'Manager')}${m.manager_note ? ` — ${escHtml(m.manager_note)}` : ''}` : 'Menunggu semakan',
      reviewed ? fmtDateTime(m.handled_at) : '—', rejected ? 'bg-terracotta' : 'bg-navy'),
  ];
  if (!rejected) {
    items.push(step(inProgress, 'Dalam Servis', m.scheduled_date ? `Tarikh maintenance: ${fmtDate(m.scheduled_date)}` : 'Belum dimulakan', '—', 'bg-teal'));
    items.push(step(done, 'Selesai', done ? 'Maintenance selesai' : 'Belum selesai', done ? fmtDateTime(m.updated_at) : '—', 'bg-green'));
  }
  document.getElementById('timeline').innerHTML = items.join('');
}

async function submitReview() {
  const status = document.getElementById('rv-status').value;
  const note = document.getElementById('rv-note').value.trim();
  const date = document.getElementById('rv-date').value || null;
  if (status === 'ditolak' && !note) { banner('Sila nyatakan sebab ditolak', 'error'); return; }

  const btn = document.getElementById('rv-save');
  btn.disabled = true;
  const patch = {
    status,
    manager_note: note || req.manager_note || null,
    ...(status === 'diluluskan' ? { scheduled_date: date } : {}),
    handled_by: currentUser.id,
    handled_by_name: currentUser.full_name || '',
    handled_at: new Date().toISOString(),
    updated_at: new Date().toISOString(),
  };
  const { error } = await window.db.from('psy_equipment_maintenance').update(patch).eq('id', reqId);
  btn.disabled = false;
  if (error) { banner('Gagal kemaskini: ' + error.message, 'error'); return; }

  // Makluman kepada staff yang lapor
  if (req.reported_by) {
    const label = STATUS_LABEL[status]?.[0] || status;
    await notify(req.reported_by, 'system', `Maintenance: ${label}`, `${req.psy_equipment?.name || 'Peralatan'} — ${label}${patch.manager_note ? ` (${patch.manager_note})` : ''}`, `maintenance-detail.html?id=${reqId}`);
  }
  banner('Status dikemaskini');
  await loadDetail();
}
window.submitReview = submitReview;
window.onReviewStatusChange = onReviewStatusChange;

(async () => {
  const user = await initStaff('equipment_maintenance', 'Maintenance Detail', 'equipment');
  if (!user) return;
  currentUser = user;
  await loadDetail();
})();
</script>
</body>
</html>
