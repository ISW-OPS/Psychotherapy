<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Profile & Consent</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">👤</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8">
        <div class="max-w-2xl mx-auto space-y-6">
          <div class="bg-white rounded-2xl border border-ink/10 p-6">
            <div class="flex items-center gap-4 mb-5">
              <div id="prof-avatar" class="w-16 h-16 bg-green rounded-full flex items-center justify-center text-white text-2xl font-bold">—</div>
              <div>
                <div id="prof-full-name" class="font-bold text-lg">—</div>
                <div id="prof-patient-id" class="text-sm text-ink/60"></div>
              </div>
            </div>
            <div class="grid md:grid-cols-2 gap-4 text-sm">
              <div><label class="text-xs text-ink/60">Nama penuh</label><input id="prof-name-in" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></div>
              <div><label class="text-xs text-ink/60">No. Telefon</label><input id="prof-phone-in" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></div>
              <div><label class="text-xs text-ink/60">Email</label><input id="prof-email-in" disabled class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm bg-cream"></div>
              <div><label class="text-xs text-ink/60">IC</label><input id="prof-ic-in" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></div>
              <div class="md:col-span-2"><label class="text-xs text-ink/60">Alamat</label><input id="prof-address-in" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></div>
            </div>
            <button onclick="saveProfile()" class="bg-navy text-white text-sm px-5 py-2 rounded-lg mt-4">Simpan</button>
          </div>

          <div class="bg-white rounded-2xl border border-ink/10 p-6">
            <h3 class="font-bold mb-4">Emergency Contact</h3>
            <div class="grid md:grid-cols-2 gap-4 text-sm">
              <div><label class="text-xs text-ink/60">Nama</label><input id="prof-emg-name" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></div>
              <div><label class="text-xs text-ink/60">Telefon</label><input id="prof-emg-phone" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"></div>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-ink/10 p-6">
            <h3 class="font-bold mb-4">Consent & PDPA</h3>
            <div class="space-y-3 text-sm">
              <label class="flex items-start gap-3"><input type="checkbox" checked disabled class="mt-1"><span><strong>Treatment consent</strong><br><span class="text-xs text-ink/70">Saya bersetuju menerima rawatan dari ISW clinicians</span></span></label>
              <label class="flex items-start gap-3"><input type="checkbox" checked disabled class="mt-1"><span><strong>PDPA data use</strong><br><span class="text-xs text-ink/70">Data kesihatan untuk rawatan & audit</span></span></label>
              <label class="flex items-start gap-3"><input id="consent-marketing" type="checkbox" class="mt-1"><span><strong>Marketing communications</strong><br><span class="text-xs text-ink/70">Terima promosi via email/WhatsApp (optional)</span></span></label>
              <label class="flex items-start gap-3"><input id="consent-research" type="checkbox" class="mt-1"><span><strong>Research participation</strong><br><span class="text-xs text-ink/70">Data anonymized untuk kajian (optional)</span></span></label>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-navy-dark text-white py-2 justify-around z-20">
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🏠</span>Home</a>
    <a href="appointments.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>📅</span>Book</a>
    <a href="plan.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>💊</span>Plan</a>
    <a href="shop.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🛒</span>Shop</a>
    <a href="profile.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>👤</span>Profile</a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function loadProfileForm() {
  const initials = (currentUser.full_name || 'U').split(' ').map(w => w[0]).join('').slice(0, 2);
  document.getElementById('prof-avatar').textContent = initials;
  document.getElementById('prof-full-name').textContent = currentUser.full_name;
  document.getElementById('prof-patient-id').textContent = patientRecord ? `${patientRecord.mrn} · Pesakit aktif` : 'Belum aktif';
  document.getElementById('prof-name-in').value = currentUser.full_name || '';
  document.getElementById('prof-phone-in').value = currentUser.phone || '';
  document.getElementById('prof-email-in').value = currentUser.email || '';
  document.getElementById('prof-ic-in').value = patientRecord?.ic_number || '';
  document.getElementById('prof-address-in').value = patientRecord?.address || '';
  document.getElementById('prof-emg-name').value = patientRecord?.emergency_contact_name || '';
  document.getElementById('prof-emg-phone').value = patientRecord?.emergency_contact_phone || '';
}

async function saveProfile() {
  await dbUpdate('profiles', currentUser.id, {
    full_name: document.getElementById('prof-name-in').value,
    phone: document.getElementById('prof-phone-in').value,
  });
  if (patientRecord) {
    await dbUpdate('patients', patientRecord.id, {
      ic_number: document.getElementById('prof-ic-in').value,
      address: document.getElementById('prof-address-in').value,
      emergency_contact_name: document.getElementById('prof-emg-name').value,
      emergency_contact_phone: document.getElementById('prof-emg-phone').value,
    });
  }
  banner('Profil dikemaskini');
}

(async () => {
  const user = await initPatient('profile', 'Maklumat & persetujuan PDPA');
  if (!user) return;
  loadProfileForm();
})();
</script>
</body>
</html>
