<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Orders & Tracking</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📦</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-4">
        <div id="orders-list" class="space-y-4"></div>
      </div>
    </main>
  </div>
  <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-navy-dark text-white py-2 justify-around z-20">
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🏠</span>Home</a>
    <a href="plan.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>💊</span>Plan</a>
    <a href="shop.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🛒</span>Shop</a>
    <a href="profile.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>👤</span>Profile</a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const STATUS_META = {
  pending:   { label: 'Menunggu Pembayaran', chip: 'bg-gold/30 text-gold-dark',          stepDelivery: 0, stepPickup: 0 },
  paid:      { label: 'Dibayar',             chip: 'bg-navy-light text-navy',            stepDelivery: 1, stepPickup: 1 },
  packed:    { label: 'Sedang Disediakan',   chip: 'bg-teal/10 text-teal',               stepDelivery: 2, stepPickup: 2 },
  shipped:   { label: 'Dalam Penghantaran',  chip: 'bg-green-light text-green-dark',     stepDelivery: 3, stepPickup: 3 },
  delivered: { label: 'Selesai',             chip: 'bg-ink/10 text-ink/60',              stepDelivery: 4, stepPickup: 3 },
  cancelled: { label: 'Dibatalkan',          chip: 'bg-terracotta/20 text-terracotta',   stepDelivery: -1, stepPickup: -1 },
};

const STEPS_DELIVERY = [
  { icon: '🛒', label: 'Order Dibuat' },
  { icon: '💳', label: 'Bayaran Diterima' },
  { icon: '📦', label: 'Dibungkus' },
  { icon: '🚚', label: 'Dihantar' },
  { icon: '✅', label: 'Diterima' },
];

const STEPS_PICKUP = [
  { icon: '🛒', label: 'Order Dibuat' },
  { icon: '💳', label: 'Bayaran Diterima' },
  { icon: '📍', label: 'Sedia Pickup' },
  { icon: '✅', label: 'Diambil' },
];

function renderTimeline(order) {
  const isPickup = order.delivery_method === 'pickup';
  const steps    = isPickup ? STEPS_PICKUP : STEPS_DELIVERY;
  const meta     = STATUS_META[order.status] || STATUS_META.pending;
  const curStep  = isPickup ? meta.stepPickup : meta.stepDelivery;

  return steps.map((s, i) => {
    const done   = i < curStep;
    const active = i === curStep;
    const circle = done ? 'bg-green text-white' : active ? 'bg-navy text-white ring-4 ring-navy/20' : 'bg-ink/10 text-ink/40';
    const line   = i < steps.length - 1
      ? `<div class="flex-1 h-0.5 mx-1 mt-[-12px] ${i < curStep ? 'bg-green' : 'bg-ink/10'}"></div>`
      : '';
    return `
      <div class="flex items-start ${i < steps.length - 1 ? 'flex-1' : ''}">
        <div class="flex flex-col items-center gap-1 flex-shrink-0">
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${circle}">${done ? '✓' : s.icon}</div>
          <div class="text-[10px] text-center leading-tight ${active ? 'font-semibold text-navy' : done ? 'text-ink/60' : 'text-ink/30'} w-14">${s.label}</div>
        </div>
        ${line}
      </div>`;
  }).join('');
}

async function confirmDelivered(orderId) {
  try {
    await window.db.from('psy_orders').update({ status: 'delivered', delivered_at: new Date().toISOString() }).eq('id', orderId);
    banner('Terima kasih! Status order dikemaskini.');
    loadOrders();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}

async function loadOrders() {
  const { data: orders } = await window.db.from('psy_orders')
    .select('*').eq('patient_id', currentUser.id).order('created_at', { ascending: false });

  const list = orders || [];
  document.getElementById('orders-list').innerHTML = list.length
    ? list.map(o => {
      const sm       = STATUS_META[o.status] || STATUS_META.pending;
      const items    = Array.isArray(o.items) ? o.items : [];
      const isPickup = o.delivery_method === 'pickup';
      const jtUrl    = o.tracking_number ? `https://www.jtexpress.my/index/query/gzquery.html?bills=${o.tracking_number}` : null;
      const deliveryBadge = isPickup ? '🏥 Ambil Sendiri di Klinik' : '🚚 Penghantaran';

      return `
      <div class="bg-white rounded-xl border border-ink/10 overflow-hidden">
        <div class="px-5 py-4 flex items-center justify-between flex-wrap gap-2 border-b border-ink/5">
          <div>
            <div class="font-bold">${o.order_ref}</div>
            <div class="text-xs text-ink/50 mt-0.5">
              ${new Date(o.created_at).toLocaleDateString('ms-MY', { day:'2-digit', month:'short', year:'numeric' })}
              · ${items.length} item · RM ${Number(o.total).toFixed(2)}
              ${deliveryBadge ? `· <span class="text-ink/60">${deliveryBadge}</span>` : ''}
            </div>
          </div>
          <span class="chip text-xs ${sm.chip}">${sm.label}</span>
        </div>

        <div class="px-5 py-5">
          <div class="flex items-start gap-1 overflow-x-auto">
            ${renderTimeline(o)}
          </div>
        </div>

        <div class="px-5 pb-5 space-y-3">
          <div class="flex flex-wrap gap-1.5">
            ${items.map(it => `<span class="chip bg-cream text-ink/70 text-xs">${it.name} × ${it.qty}</span>`).join('')}
          </div>

          ${isPickup && o.status === 'packed' ? `
            <div class="flex items-center gap-3 bg-teal/10 rounded-xl px-4 py-3 border border-teal/20">
              <span class="text-2xl">📍</span>
              <div>
                <div class="font-semibold text-sm text-teal">Parsel Sedia untuk Diambil</div>
                <div class="text-xs text-ink/60 mt-0.5">Sila datang ke klinik pada waktu operasi untuk mengambil pesanan anda.</div>
              </div>
            </div>` : ''}

          ${!isPickup && o.tracking_number ? `
            <div class="flex items-center gap-3 bg-green-light rounded-xl px-4 py-3">
              <div class="flex-1 min-w-0">
                <div class="text-[10px] font-semibold text-ink/60 uppercase tracking-wide">${o.courier || 'Courier'} · Tracking No.</div>
                <div class="font-bold font-mono">${o.tracking_number}</div>
              </div>
              ${jtUrl ? `<a href="${jtUrl}" target="_blank" rel="noopener" class="bg-green text-white text-xs px-3 py-2 rounded-lg font-semibold whitespace-nowrap">Track →</a>` : ''}
            </div>` : ''}

          ${!isPickup && o.tracking_photo_url ? `
            <div>
              <div class="text-[10px] font-semibold text-ink/60 uppercase tracking-wide mb-2">Gambar Parsel</div>
              <img src="${o.tracking_photo_url}" class="h-28 rounded-lg border border-ink/10 object-cover cursor-pointer" onclick="window.open('${o.tracking_photo_url}','_blank')">
            </div>` : ''}

          ${o.status === 'shipped' ? `
            <button onclick="confirmDelivered('${o.id}')" class="w-full bg-green text-white py-3 rounded-xl font-semibold">
              ✅ Saya Dah Terima Parsel
            </button>` : ''}
        </div>
      </div>`;
    }).join('')
    : `<div class="text-center py-16 space-y-3">
        <div class="text-5xl">📭</div>
        <p class="text-ink/60 text-sm">Tiada orders lagi.</p>
        <a href="shop.html" class="inline-block bg-navy text-white px-5 py-2.5 rounded-xl text-sm font-semibold">Pergi ke Shop →</a>
      </div>`;
}

(async () => {
  const user = await initPatient('psy_orders', 'Status penghantaran anda');
  if (!user) return;
  loadOrders();
})();
</script>
</body>
</html>
