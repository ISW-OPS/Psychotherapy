<script>
async function getPlanTemplate(packageId, packageName) {
  const rows = await dbQuery('psy_packages', { eq: { package_id: packageId } }).catch(() => []);
  if (!rows.length) return { name: packageName + ' Plan', duration_weeks: 12, duration_unit: 'week', bio:[], psycho:[], social:[], spiritual:[], coaching_schedule: [] };
  const p = rows[0];
  return {
    name: `${p.name} Treatment Plan`,
    duration_weeks: p.duration_weeks || 12,
    duration_unit: p.duration_unit || 'week',
    bio: p.bio_goals || [],
    psycho: p.psycho_goals || [],
    social: p.social_goals || [],
    spiritual: p.spiritual_goals || [],
    coaching_schedule: p.coaching_schedule || [],
  };
}
</script>
<script>
const SERVICE_CHARGE = 5.00;
const SST_RATE = 0.06;

let pendingItems = [];
let grandTotal = 0;

function extractPrice(note) {
  const m = note?.match(/RM\s*([0-9.]+)/);
  return m ? parseFloat(m[1]) : 0;
}

function checkPendingPayment() {
  const raw = localStorage.getItem('isw_pending_payment');
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

// Re-verify shop order prices against DB to prevent localStorage tampering
async function verifyShopOrderPrices(item) {
  const ids = item.items.map(i => i.id).filter(Boolean);
  if (!ids.length) return null;
  const { data: products, error } = await window.db
    .from('psy_products')
    .select('id, price, is_active')
    .in('id', ids);
  if (error || !products) return null;
  const priceMap = Object.fromEntries(products.map(p => [p.id, p]));
  let verifiedSubtotal = 0;
  const verifiedItems = [];
  for (const cartItem of item.items) {
    const dbProd = priceMap[cartItem.id];
    if (!dbProd || dbProd.is_active === false) return null;
    const qty = Math.max(1, parseInt(cartItem.qty) || 1);
    const dbPrice = Number(dbProd.price);
    if (!Number.isFinite(dbPrice) || dbPrice < 0) return null;
    verifiedSubtotal += dbPrice * qty;
    verifiedItems.push({ id: cartItem.id, name: cartItem.name, qty, price: dbPrice });
  }
  const deliveryFee = item.deliveryMethod === 'pos' ? 8 : 0;
  return {
    ...item,
    items: verifiedItems,
    subtotal: verifiedSubtotal,
    deliveryFee,
    amount: verifiedSubtotal + deliveryFee,
  };
}

// Re-verify package price against DB
async function verifyPackagePrice(item) {
  const { data: rows, error } = await window.db
    .from('psy_packages')
    .select('package_id, name, price, is_active')
    .eq('package_id', item.packageId)
    .limit(1);
  if (error || !rows || !rows.length) return null;
  const pkg = rows[0];
  if (pkg.is_active === false) return null;
  const dbPrice = Number(pkg.price);
  if (!Number.isFinite(dbPrice) || dbPrice < 0) return null;
  return {
    ...item,
    packageName: pkg.name,
    title: `Pakej: ${pkg.name}`,
    amount: dbPrice,
  };
}

async function loadPayments() {
  pendingItems = [];

  // Check localStorage for pending payment (from pakej/appointment redirect)
  const pendingItem = checkPendingPayment();
  if (pendingItem && pendingItem.amount > 0) {
    // For shop orders, re-verify prices from DB to prevent client-side tampering
    if (pendingItem.type === 'shop_order' && Array.isArray(pendingItem.items)) {
      const verified = await verifyShopOrderPrices(pendingItem);
      if (!verified) {
        localStorage.removeItem('isw_pending_payment');
        banner('Harga produk tidak sah. Sila buat semula order anda.', 'error');
      } else {
        pendingItems.push(verified);
      }
    } else if (pendingItem.type === 'package' && pendingItem.packageId) {
      const verified = await verifyPackagePrice(pendingItem);
      if (!verified) {
        localStorage.removeItem('isw_pending_payment');
        banner('Harga pakej tidak sah. Sila pilih semula pakej.', 'error');
      } else {
        pendingItems.push(verified);
      }
    } else {
      pendingItems.push(pendingItem);
    }
  }

  // DB-based pending items (only if patient record exists)
  let appts = [], pkgPurchases = [];
  if (patientRecord) {
    [appts, pkgPurchases] = await Promise.all([
      dbQuery('psy_appointments', { eq: { patient_id: patientRecord.id } }).catch(() => []),
      dbQuery('psy_package_purchases', { eq: { patient_id: patientRecord.id } }).catch(() => []),
    ]);
  }

  appts.filter(a => a.notes?.includes('[PENDING PAYMENT]')).forEach(a => {
    pendingItems.push({
      type: 'appointment', id: a.id, title: a.service,
      date: formatDate(a.appointment_time),
      amount: extractPrice(a.notes), raw: a,
    });
  });

  pkgPurchases.filter(p => p.status === 'pending_payment').forEach(p => {
    const alreadyFromUrl = pendingItem && pendingItem.packageId === p.package_id;
    if (!alreadyFromUrl) {
      pendingItems.push({
        type: 'package_existing', id: p.id,
        title: `Pakej: ${p.package_name}`,
        amount: Number(p.price), raw: p,
      });
    }
  });

  renderInvoice();
  loadReceipts();
}

function renderInvoice() {
  const box = document.getElementById('invoice-content');
  const methods = document.getElementById('payment-methods');

  if (pendingItems.length === 0) {
    box.innerHTML = '<p class="text-green-dark text-center py-4 font-semibold">✓ Tiada bayaran tertunggak</p>';
    methods.classList.add('hidden');
    return;
  }

  const subtotal = pendingItems.reduce((s, i) => s + i.amount, 0);
  const sst = subtotal * SST_RATE;
  grandTotal = subtotal + SERVICE_CHARGE + sst;

  let html = `<div class="font-semibold mb-3">Ringkasan bayaran (${pendingItems.length} invois belum bayar)</div>`;

  pendingItems.forEach(item => {
    const sub = item.type === 'shop_order' ? `
      <div class="text-xs text-ink/50 mt-0.5 mb-1">${item.subtitle || ''}</div>
      ${item.deliveryFee > 0 ? `<div class="flex justify-between text-ink/60 text-xs py-0.5"><span>Penghantaran (${item.deliveryMethod === 'pos' ? 'Courier' : 'Pickup'})</span><span>RM ${item.deliveryFee.toFixed(2)}</span></div>` : `<div class="text-xs text-ink/50">Pickup Klinik · Penghantaran Percuma</div>`}` : '';
    html += `<div class="py-1">
      <div class="flex justify-between">
        <span>${item.title}${item.date ? ' · ' + item.date : ''}</span>
        <span class="font-semibold">RM ${item.amount.toFixed(2)}</span>
      </div>${sub}
    </div>`;
  });

  html += `
    <div class="flex justify-between py-1 text-ink/60">
      <span>Service charge</span>
      <span>RM ${SERVICE_CHARGE.toFixed(2)}</span>
    </div>
    <div class="flex justify-between py-1 text-ink/60">
      <span>SST 6%</span>
      <span>RM ${sst.toFixed(2)}</span>
    </div>
    <div class="flex justify-between pt-3 mt-2 border-t border-ink/20">
      <span class="font-bold text-base">Jumlah</span>
      <span class="font-bold text-base text-navy">RM ${grandTotal.toFixed(2)}</span>
    </div>
  `;

  box.innerHTML = html;
  methods.classList.remove('hidden');
  document.getElementById('btn-pay').textContent = `Pay RM ${grandTotal.toFixed(2)} →`;
}

async function processPayment() {
  if (pendingItems.length === 0) return;
  const method = document.querySelector('input[name="pm"]:checked').value;
  const btn = document.getElementById('btn-pay');
  btn.disabled = true;
  btn.textContent = 'Memproses...';

  try {
    // CRITICAL: Fresh DB check — prevent duplicate package subscription
    const hasPackageInCart = pendingItems.some(i => i.type === 'package');
    if (hasPackageInCart && patientRecord) {
      const fresh = await dbQuery('psy_patients', { eq: { id: patientRecord.id }, single: true }).catch(() => null);
      if (fresh?.active_package_id &&
          (!fresh.package_expires_at || new Date(fresh.package_expires_at) >= new Date())) {
        banner(`Anda sudah ada pakej aktif: ${fresh.active_package_name}. Bayaran dibatalkan.`, 'error');
        localStorage.removeItem('isw_pending_payment');
        setTimeout(() => { window.location.href = 'plan.html'; }, 2000);
        return;
      }
    }

    await new Promise(r => setTimeout(r, 1200));
    const receiptRef = 'RCP-' + Date.now().toString(36).toUpperCase();

    for (const item of pendingItems) {
      if (item.type === 'appointment') {
        const cleanNotes = (item.raw?.notes || '').replace('[PENDING PAYMENT]', '').trim();
        await dbUpdate('psy_appointments', item.id, { notes: `[PAID · ${receiptRef}] ${cleanNotes}` });

      } else if (item.type === 'package') {
        const expiresAt = new Date();
        expiresAt.setMonth(expiresAt.getMonth() + 3);

        // Insert without .single() to avoid RLS read-back issue
        const { error: insertErr } = await window.db.from('psy_package_purchases').insert({
          patient_id: patientRecord.id,
          package_id: item.packageId,
          package_name: item.packageName,
          price: item.amount,
          expires_at: expiresAt.toISOString(),
          status: 'active',
          payment_method: method,
        });
        if (insertErr) throw insertErr;

        // Activate package on patient record
        const { error: updateErr } = await window.db.from('psy_patients').update({
          active_package_id: item.packageId,
          active_package_name: item.packageName,
          package_purchased_at: new Date().toISOString(),
          package_expires_at: expiresAt.toISOString(),
        }).eq('id', patientRecord.id);
        if (updateErr) throw updateErr;

      } else if (item.type === 'package_existing') {
        await dbUpdate('psy_package_purchases', item.id, { status: 'active', payment_method: method });

      } else if (item.type === 'shop_order') {
        const { error } = await window.db.from('psy_orders').insert({
          order_ref: item.orderRef,
          patient_id: currentUser.id,
          items: item.items,
          total: item.amount,
          status: 'paid',
          paid_at: new Date().toISOString(),
          delivery_method: item.deliveryMethod,
          delivery_address: item.deliveryAddress || null,
          courier: item.deliveryMethod === 'pos' ? 'JNT' : null,
          notes: item.deliveryMethod === 'pickup' ? 'Pickup Klinik' : null,
        });
        if (error) throw error;
        clearCart();
      }
    }

    const subtotal = pendingItems.reduce((s, i) => s + i.amount, 0);
    const sstAmount = grandTotal - subtotal - SERVICE_CHARGE;

    // Insert proper payment record
    await window.db.from('psy_payments').insert({
      receipt_ref: receiptRef,
      patient_id: patientRecord?.id,
      user_id: currentUser.id,
      items: pendingItems.map(i => ({
        type: i.type,
        title: i.title,
        amount: i.amount,
        reference_id: i.id || i.packageId,
      })),
      subtotal,
      service_charge: SERVICE_CHARGE,
      sst: sstAmount,
      total: grandTotal,
      payment_method: method,
      status: 'completed',
      paid_at: new Date().toISOString(),
    });

    await auditLog('payment.received', receiptRef, {
      ref: receiptRef,
      total: grandTotal,
      method,
    });

    localStorage.removeItem('isw_pending_payment');

    // Auto-create treatment plan if package was purchased
    let createdPlan = false;
    for (const item of pendingItems) {
      if (item.type === 'package' && item.packageId && patientRecord) {
        // Race guard: skip if active plan already exists
        const existingPlans = await dbQuery('psy_treatment_plans', { eq: { patient_id: patientRecord.id, status: 'active' } }).catch(() => []);
        if (existingPlans.length > 0) continue;
        const template = await getPlanTemplate(item.packageId, item.packageName);
        const { error: planErr } = await window.db.from('psy_treatment_plans').insert({
          patient_id: patientRecord.id,
          doctor_id: null,
          name: template.name,
          duration_unit: template.duration_unit,
          duration_weeks: template.duration_weeks,
          current_week: 1,
          bio_goals: template.bio,
          psycho_goals: template.psycho,
          social_goals: template.social,
          spiritual_goals: template.spiritual,
          coaching_schedule: template.coaching_schedule,
          status: 'active',
        });
        if (!planErr) createdPlan = true;
      }
    }

    banner(`Pembayaran berjaya! Resit: ${receiptRef}`);
    pendingItems = [];

    if (createdPlan) {
      setTimeout(() => { window.location.href = 'plan.html'; }, 2000);
    } else {
      loadPayments();
    }
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = `Pay RM ${grandTotal.toFixed(2)} →`;
  }
}

async function cancelAll() {
  if (!confirm('Pasti nak batal semua bayaran tertunggak?')) return;
  try {
    for (const item of pendingItems) {
      if (item.type === 'appointment') {
        await dbUpdate('psy_appointments', item.id, { status: 'cancelled', notes: '[CANCELLED]' });
      } else if (item.type === 'package_existing') {
        await dbDelete('psy_package_purchases', item.id);
      }
    }

    localStorage.removeItem('isw_pending_payment');

    await auditLog('payment.cancelled', currentUser.id, {
      items: pendingItems.map(i => i.title),
    });

    banner('Semua bayaran dibatalkan');
    pendingItems = [];
    loadPayments();
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  }
}

async function loadReceipts() {
  if (!patientRecord) {
    document.getElementById('receipts-list').innerHTML = '<div class="bg-white rounded-xl border border-ink/10 p-6 text-center text-ink/40 text-sm">Tiada resit lagi</div>';
    return;
  }

  const receipts = await dbQuery('psy_payments', {
    eq: { patient_id: patientRecord.id },
    order: { col: 'paid_at' },
    limit: 50,
  }).catch(() => []);

  const methodLabels = { fpx: 'FPX Online Banking', card: 'Credit/Debit Card', transfer: 'Bank Transfer', ghl: 'GHL Payment', manual: 'Manual' };

  window._receipts = receipts;

  document.getElementById('receipts-list').innerHTML = receipts.length
    ? receipts.map(r => `
      <div class="bg-white rounded-xl border border-ink/10 p-4 md:p-5">
        <div class="flex items-start justify-between gap-3 flex-wrap mb-2">
          <div>
            <div class="font-semibold">${r.receipt_ref}</div>
            <div class="text-xs text-ink/60">${new Date(r.paid_at).toLocaleString('ms-MY')}</div>
          </div>
          <div class="flex items-center gap-2">
            <span class="chip ${r.status === 'completed' ? 'bg-green-light text-green-dark' : r.status === 'refunded' ? 'bg-terracotta/20 text-terracotta' : 'bg-gold/30 text-gold-dark'}">${r.status.toUpperCase()}</span>
            <button onclick="viewReceiptPDF('${r.id}')" class="text-xs text-navy font-semibold border border-navy/30 px-3 py-1 rounded-lg hover:bg-navy hover:text-white">📄 PDF</button>
          </div>
        </div>
        ${(r.items || []).map(it => `
          <div class="flex justify-between text-sm py-0.5">
            <span>${it.title}</span>
            <span>RM ${Number(it.amount).toFixed(2)}</span>
          </div>`).join('')}
        ${Number(r.service_charge) > 0 ? `<div class="flex justify-between text-xs text-ink/60 py-0.5"><span>Service charge</span><span>RM ${Number(r.service_charge).toFixed(2)}</span></div>` : ''}
        ${Number(r.sst) > 0 ? `<div class="flex justify-between text-xs text-ink/60 py-0.5"><span>SST 6%</span><span>RM ${Number(r.sst).toFixed(2)}</span></div>` : ''}
        <div class="flex justify-between font-bold text-sm pt-2 mt-2 border-t border-ink/10">
          <span>Total</span>
          <span class="text-green-dark">RM ${Number(r.total).toFixed(2)}</span>
        </div>
        <div class="text-xs text-ink/50 mt-2">Kaedah: ${methodLabels[r.payment_method] || r.payment_method}</div>
      </div>`).join('')
    : '<div class="bg-white rounded-xl border border-ink/10 p-6 text-center text-ink/40 text-sm">Tiada resit lagi</div>';
}

(async () => {
  const user = await initPatient('payment', 'Selesaikan bayaran · resit');
  if (!user) return;
  loadPayments();
})();
</script>
</body>
</html>
