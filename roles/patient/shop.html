<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ibnu Sina Wellness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../shared/theme.js"></script>
  <script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="_styles.css" rel="stylesheet">
</head>

<body class="min-h-screen">

  <div id="app-loading" class="min-h-screen flex items-center justify-center">
    <div class="text-center">
      <div class="text-4xl mb-3">🛒</div>
      <p class="text-ink/60 text-sm">Memuatkan...</p>
    </div>
  </div>

  <div id="app-shell" class="hidden">
    <div class="flex min-h-screen">
      <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
      <main class="main-content flex-1 min-w-0">
        <header id="page-header"
          class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4">
        </header>
        <div id="content" class="p-4 md:p-8 space-y-6"></div>
      </main>
    </div>

    <button id="cart-fab" onclick="openCart()"
      class="hidden fixed bottom-6 right-6 bg-navy text-white rounded-full shadow-xl px-5 py-3 font-semibold text-sm z-30 flex items-center gap-2">
      🛒 <span id="cart-count">0</span> · <span id="cart-total-mini">RM 0</span>
    </button>

    <div id="cart-drawer" class="hidden fixed inset-0 z-40">
      <div class="absolute inset-0 bg-black/40" onclick="closeCart()"></div>
      <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white flex flex-col">
        <div class="p-4 border-b border-ink/10 flex items-center justify-between">
          <h3 class="font-bold">Cart Anda</h3>
          <button onclick="closeCart()" class="text-ink/60 text-xl">×</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div class="border-t border-ink/10 p-4 space-y-4">
          <!-- Delivery method -->
          <div>
            <div class="text-xs font-semibold text-ink/60 mb-2">Kaedah Penghantaran</div>
            <div class="grid grid-cols-2 gap-2">
              <label id="lbl-pickup" class="border-2 border-navy bg-navy-light rounded-xl p-3 cursor-pointer text-center has-[:checked]:border-navy transition-all">
                <input type="radio" name="delivery" value="pickup" checked class="sr-only" onchange="toggleDelivery()">
                <div class="text-xl mb-1">🏥</div>
                <div class="text-xs font-semibold">Pickup Konsultasi</div>
                <div class="text-[10px] text-ink/60 mt-0.5">Percuma</div>
              </label>
              <label id="lbl-pos" class="border-2 border-ink/20 rounded-xl p-3 cursor-pointer text-center transition-all hover:border-navy">
                <input type="radio" name="delivery" value="pos" class="sr-only" onchange="toggleDelivery()">
                <div class="text-xl mb-1">🚚</div>
                <div class="text-xs font-semibold">Pos / Courier</div>
                <div class="text-[10px] text-ink/60 mt-0.5">+ RM 8.00</div>
              </label>
            </div>
            <p id="shipping-policy-note" class="text-[10px] text-ink/50 mt-2 leading-relaxed"></p>
          </div>

          <!-- Address diisi di halaman bayaran (borang penuh & jelas — bukan dalam drawer sempit) -->
          <div id="address-field" class="hidden">
            <p class="text-xs text-ink/50 bg-cream/70 rounded-lg px-3 py-2.5">📍 Alamat penghantaran akan diisi di langkah seterusnya (halaman bayaran).</p>
          </div>

          <!-- Voucher Saya (quick-pick dari wallet) -->
          <div id="my-vouchers-row" class="hidden">
            <div class="text-xs font-semibold text-ink/60 mb-1">Voucher Saya</div>
            <div id="my-vouchers-chips" class="flex gap-2 flex-wrap"></div>
          </div>

          <!-- Kod Diskaun -->
          <div>
            <div class="text-xs font-semibold text-ink/60 mb-1">Kod Diskaun</div>
            <div class="flex gap-2">
              <input id="promo-input" type="text" placeholder="Masukkan kod"
                class="flex-1 border border-ink/20 rounded-lg px-3 py-2 text-sm outline-none focus:border-navy bg-white uppercase">
              <button onclick="applyPromoCode()" class="px-4 py-2 rounded-lg border border-navy text-navy text-sm font-semibold hover:bg-navy-light whitespace-nowrap">Guna</button>
            </div>
            <div id="promo-msg" class="text-xs mt-1"></div>
          </div>

          <!-- Totals -->
          <div class="space-y-1 text-sm">
            <div class="flex justify-between"><span class="text-ink/60">Subtotal</span><span id="cart-subtotal" class="font-medium">RM 0</span></div>
            <div id="delivery-fee-row" class="hidden justify-between"><span class="text-ink/60">Penghantaran</span><span class="font-medium">RM 8.00</span></div>
            <div id="promo-discount-row" class="hidden justify-between text-green-dark"><span>Diskaun (<span id="promo-code-label"></span>)</span><span id="promo-discount-amt">-RM 0</span></div>
            <div class="flex justify-between font-bold pt-1 border-t border-ink/10"><span>Jumlah</span><span id="cart-total-final">RM 0</span></div>
          </div>

          <button onclick="checkout()" class="w-full bg-navy text-white py-3 rounded-xl font-semibold hover:bg-navy-dark">Teruskan ke Bayaran →</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/shared/supabase.js"></script>
  <script src="../../config/supabase.js"></script>
  <script src="../../shared/authGuard.js"></script>
  <script src="../../shared/logout.js"></script>
  <script src="../../shared/navbar.js"></script>
  <script src="../../shared/settings.js"></script>
  <script src="_shared.js"></script>
  <script>
    let PRODUCTS = [];
    let CATEGORIES = ['All'];

    async function loadProductsFromDB() {
      const [{ data: rows }, { data: invRows }] = await Promise.all([
        window.db.from('psy_products')
          .select('*, inv:inventory_item_id (id, qty_in_stock, unit)')
          .eq('is_active', true)
          .order('sort_order', { ascending: true }),
        window.db.from('psy_inventory_items').select('name, qty_in_stock, unit'),
      ]);
      // Index Inventori by lowercase trimmed name supaya boleh match nama produk
      const invByName = new Map();
      for (const i of (invRows || [])) {
        const key = (i.name || '').trim().toLowerCase();
        if (key) invByName.set(key, i);
      }
      const arr = rows || [];
      PRODUCTS = arr.map(r => {
        // Priority: (1) FK link inv, (2) nama-match Inventori, (3) legacy r.stock column
        const fkInv = r.inv || null;
        const nameInv = invByName.get((r.name || '').trim().toLowerCase()) || null;
        let stock, stockUnit = '';
        if (fkInv) {
          stock = Number(fkInv.qty_in_stock);
          stockUnit = fkInv.unit || '';
        } else if (nameInv) {
          stock = Number(nameInv.qty_in_stock);
          stockUnit = nameInv.unit || '';
        } else if (r.stock != null) {
          stock = Number(r.stock);
        } else {
          stock = 0; // tiada source — default 0 (out of stock) supaya selamat
        }
        // Promo aktif jika ada harga promo > 0 dan belum tamat (promo_until kosong = tiada had)
        const today = new Date().toISOString().slice(0, 10);
        const origPrice = Number(r.price);
        const promoPrice = Number(r.promo_price || 0);
        const onPromo = promoPrice > 0 && promoPrice < origPrice && (!r.promo_until || r.promo_until >= today);
        return {
          id: r.product_id,
          cat: r.category,
          name: r.name,
          desc: r.description || '',
          price: onPromo ? promoPrice : origPrice,  // harga berkesan (dipakai troli & bayaran)
          origPrice,
          onPromo,
          promoUntil: r.promo_until || null,
          icon: r.icon,
          image_url: r.image_url || null,
          bg: r.bg_color,
          stock,
          stockUnit,
          linked: !!(fkInv || nameInv),
        };
      });
      // Derive unique categories from DB
      const cats = [...new Set(arr.map(r => r.category).filter(Boolean))];
      CATEGORIES = ['All', ...cats];
      window.PRODUCTS = PRODUCTS;
      window.CATEGORIES = CATEGORIES;
    }
  </script>
  <script>
    let activeCategory = 'All';

    function renderShop() {
      document.getElementById('content').innerHTML = `
    <div class="bg-navy-light rounded-xl p-4 text-sm flex items-start gap-3 mb-2">
      <span class="text-xl">💡</span>
      <div>
        <strong>Top-up produk individual</strong>
        <p class="text-xs text-ink/70 mt-1">Untuk pakej rawatan utama, sila ke <a href="pakej.html" class="text-navy underline">Pakej Rawatan</a>.</p>
      </div>
    </div>
    <div id="shop-categories" class="flex gap-2 overflow-x-auto pb-2"></div>
    <div id="shop-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-4"></div>
    <div class="pt-4 flex justify-end">
      <a href="orders.html" class="text-sm text-navy font-semibold hover:underline">📦 Lihat Orders & Tracking →</a>
    </div>
  `;
      loadShop();
    }

    function loadShop() {
      document.getElementById('shop-categories').innerHTML = CATEGORIES.map(c =>
        `<button onclick="setCategory('${c}')" class="px-4 py-2 rounded-full text-sm whitespace-nowrap ${c === activeCategory ? 'bg-navy text-white' : 'bg-white border border-ink/20'}">${c}</button>`
      ).join('');

      const filtered = activeCategory === 'All' ? PRODUCTS : PRODUCTS.filter(p => p.cat === activeCategory);
      document.getElementById('shop-grid').innerHTML = filtered.map(p => {
        const outOfStock = p.stock != null && p.stock <= 0;
        const lowStock   = p.stock != null && p.stock > 0 && p.stock <= 5;
        const stockBadge = outOfStock
          ? '<span class="absolute top-2 right-2 chip bg-terracotta/15 text-terracotta text-[10px]">Habis Stok</span>'
          : lowStock
          ? `<span class="absolute top-2 right-2 chip bg-gold/30 text-gold-dark text-[10px]">Tinggal ${p.stock}</span>`
          : '';
        const promoBadge = p.onPromo
          ? '<span class="absolute top-2 left-2 chip bg-red-600 text-white text-[10px] font-bold">PROMO</span>'
          : '';
        const priceHtml = p.onPromo
          ? `<div class="leading-tight">
               <span class="text-xs text-ink/40 line-through">RM ${p.origPrice.toFixed(2)}</span>
               <div class="font-bold text-sm text-red-600">RM ${p.price.toFixed(2)}</div>
             </div>`
          : `<div class="font-bold text-sm">RM ${p.price.toFixed(2)}</div>`;
        const btn = outOfStock
          ? '<button disabled class="bg-ink/15 text-ink/40 text-xs px-3 py-1.5 rounded-lg cursor-not-allowed">Habis</button>'
          : `<button onclick="addToCart('${p.id}')" class="bg-navy text-white text-xs px-3 py-1.5 rounded-lg hover:bg-navy-dark">+ Add</button>`;
        return `
    <div class="bg-white rounded-xl overflow-hidden border border-ink/10 hover:shadow-md flex flex-col ${outOfStock ? 'opacity-60' : ''}">
      <div class="relative h-32 ${p.bg || 'bg-cream'} flex items-center justify-center overflow-hidden">
        ${p.image_url ? `<img src="${p.image_url}" class="w-full h-full object-cover">` : `<span class="text-5xl">${p.icon || '📦'}</span>`}
        ${promoBadge}
        ${stockBadge}
      </div>
      <div class="p-4 flex-1 flex flex-col">
        <div class="font-semibold text-sm">${p.name}</div>
        <div class="text-xs text-ink/60 mt-1 flex-1">${p.desc}</div>
        <div class="flex items-center justify-between mt-3 pt-3 border-t border-ink/5">
          ${priceHtml}
          ${btn}
        </div>
      </div>
    </div>`;
      }).join('');
      updateCartBadge();
    }

    function setCategory(c) { activeCategory = c; loadShop(); }

    function openCart() { document.getElementById('cart-drawer').classList.remove('hidden'); renderCart(); loadMyVoucherChips(); }
    function closeCart() { document.getElementById('cart-drawer').classList.add('hidden'); }

    function toggleDelivery() {
      const isPos = document.querySelector('input[name="delivery"]:checked')?.value === 'pos';
      document.getElementById('address-field').classList.toggle('hidden', !isPos);
      document.getElementById('delivery-fee-row').style.display = isPos ? 'flex' : 'none';
      document.getElementById('lbl-pickup').className = `border-2 rounded-xl p-3 cursor-pointer text-center transition-all ${!isPos ? 'border-navy bg-navy-light' : 'border-ink/20 hover:border-navy'}`;
      document.getElementById('lbl-pos').className = `border-2 rounded-xl p-3 cursor-pointer text-center transition-all ${isPos ? 'border-navy bg-navy-light' : 'border-ink/20 hover:border-navy'}`;
      updateCartTotals();
    }

    // ── Kod Diskaun ──
    let appliedPromo = null; // { id, code, discount_type, discount_value, min_subtotal }

    function computePromoDiscount(totalBeforeDiscount) {
      if (!appliedPromo) return 0;
      if (totalBeforeDiscount < (Number(appliedPromo.min_subtotal) || 0)) return 0;
      const raw = appliedPromo.discount_type === 'percent'
        ? totalBeforeDiscount * (Number(appliedPromo.discount_value) / 100)
        : Number(appliedPromo.discount_value);
      return Math.min(raw, totalBeforeDiscount);
    }

    async function applyPromoCode() {
      const input = document.getElementById('promo-input');
      const msg = document.getElementById('promo-msg');
      const code = (input?.value || '').trim().toUpperCase();
      if (!code) return;
      msg.className = 'text-xs mt-1 text-ink/50';
      msg.textContent = 'Menyemak kod…';
      const today = new Date().toISOString().slice(0, 10);
      const { data: promo } = await window.db.from('psy_promo_codes')
        .select('id, discount_type, discount_value, min_subtotal, max_uses, used_count, valid_from, valid_until, is_active')
        .eq('code', code).maybeSingle();
      const dateOk = promo && (!promo.valid_from || promo.valid_from <= today) && (!promo.valid_until || promo.valid_until >= today);
      const usesOk = promo && (promo.max_uses == null || promo.used_count < promo.max_uses);
      if (!promo || !promo.is_active || !dateOk || !usesOk) {
        appliedPromo = null;
        msg.className = 'text-xs mt-1 text-terracotta';
        msg.textContent = 'Kod tidak sah atau telah luput.';
        updateCartTotals();
        return;
      }
      appliedPromo = { id: promo.id, code, discount_type: promo.discount_type, discount_value: promo.discount_value, min_subtotal: promo.min_subtotal };
      updateCartTotals(); // kira semula dulu supaya mesej min_subtotal (jika ada) tepat
      const cartItems = getCart();
      const isPos = document.querySelector('input[name="delivery"]:checked')?.value === 'pos';
      const subtotal = cartItems.reduce((s, i) => s + i.qty * i.price, 0);
      const beforeDiscount = subtotal + (isPos ? 8 : 0);
      if (beforeDiscount < (Number(promo.min_subtotal) || 0)) {
        msg.className = 'text-xs mt-1 text-terracotta';
        msg.textContent = `Perlu belanja minimum RM${Number(promo.min_subtotal).toFixed(2)} untuk guna kod ni.`;
      } else {
        msg.className = 'text-xs mt-1 text-green-dark';
        msg.textContent = '✓ Kod diguna pakai.';
      }
    }

    function updateCartTotals() {
      const cartItems = getCart();
      const isPos = document.querySelector('input[name="delivery"]:checked')?.value === 'pos';
      const subtotal = cartItems.reduce((s, i) => s + i.qty * i.price, 0);
      const deliveryFee = isPos ? 8 : 0;
      const beforeDiscount = subtotal + deliveryFee;
      const promoDiscount = computePromoDiscount(beforeDiscount);
      const total = Math.max(0, beforeDiscount - promoDiscount);
      const sub = document.getElementById('cart-subtotal');
      const fin = document.getElementById('cart-total-final');
      if (sub) sub.textContent = 'RM ' + subtotal.toFixed(2);
      if (fin) fin.textContent = 'RM ' + total.toFixed(2);
      const discRow = document.getElementById('promo-discount-row');
      if (discRow) {
        discRow.classList.toggle('hidden', promoDiscount <= 0);
        discRow.style.display = promoDiscount > 0 ? 'flex' : 'none';
        if (promoDiscount > 0) {
          document.getElementById('promo-code-label').textContent = appliedPromo.code;
          document.getElementById('promo-discount-amt').textContent = '-RM ' + promoDiscount.toFixed(2);
        }
      }
    }

    function renderCart() {
      const cartItems = getCart();
      document.getElementById('cart-items').innerHTML = cartItems.length
        ? cartItems.map(i => `
      <div class="flex items-center gap-3 p-3 border border-ink/10 rounded-lg">
        <div class="w-12 h-12 ${i.bg} rounded-lg flex items-center justify-center text-2xl">${i.icon}</div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold truncate">${i.name}</div>
          <div class="text-xs text-ink/60">RM ${i.price.toFixed(2)} × ${i.qty}</div>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="updateQty('${i.id}',-1)" class="w-7 h-7 rounded bg-cream">−</button>
          <span class="w-6 text-center text-sm">${i.qty}</span>
          <button onclick="updateQty('${i.id}',1)" class="w-7 h-7 rounded bg-cream">+</button>
        </div>
      </div>`).join('')
        : '<p class="text-ink/40 text-center py-8 text-sm">Cart kosong</p>';
      updateCartTotals();
    }

    async function checkout() {
      const cartItems = getCart();
      if (cartItems.length === 0) { banner('Cart kosong', 'error'); return; }

      // Alamat penuh dikumpul di payment.html (borang besar & jelas), bukan di sini —
      // drawer cart cuma tentukan kaedah penghantaran.
      const deliveryMethod = document.querySelector('input[name="delivery"]:checked')?.value || 'pickup';

      const subtotal = cartItems.reduce((s, i) => s + i.qty * i.price, 0);
      const deliveryFee = deliveryMethod === 'pos' ? 8 : 0;
      const beforeDiscount = subtotal + deliveryFee;
      const promoDiscount = computePromoDiscount(beforeDiscount);
      const total = Math.max(0, beforeDiscount - promoDiscount);
      const orderRef = 'ORD-' + Date.now().toString(36).toUpperCase()
        + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();

      const itemsLabel = cartItems.map(i => `${i.name} ×${i.qty}`).join(', ');

      localStorage.setItem('isw_pending_payment', JSON.stringify({
        type: 'shop_order',
        title: `Order ${orderRef} (${cartItems.length} item)`,
        subtitle: itemsLabel,
        amount: total,
        orderRef,
        items: cartItems.map(i => ({ id: i.id, name: i.name, qty: i.qty, price: i.price })),
        subtotal,
        deliveryFee,
        deliveryMethod,
        deliveryAddress: null, // diisi di payment.html
        promoCode: (promoDiscount > 0 && appliedPromo) ? appliedPromo.code : null,
      }));

      closeCart();
      window.location.href = 'payment.html';
    }


    async function loadMyVoucherChips() {
      if (!window.patientRecord?.id) return;
      const { data } = await window.db.from('psy_promo_claims')
        .select('code, discount_type, discount_value')
        .eq('patient_id', window.patientRecord.id).eq('status', 'active')
        .or('expires_at.is.null,expires_at.gte.' + new Date().toISOString());
      const claims = data || [];
      const row = document.getElementById('my-vouchers-row');
      if (!claims.length) { row.classList.add('hidden'); return; }
      row.classList.remove('hidden');
      document.getElementById('my-vouchers-chips').innerHTML = claims.map(v => {
        const label = v.discount_type === 'percent' ? `${v.code} (${Number(v.discount_value)}%)` : `${v.code} (RM${Number(v.discount_value).toFixed(0)})`;
        return `<button onclick="useMyVoucher('${v.code}')" class="px-3 py-1.5 rounded-full border border-navy/30 bg-navy-light text-navy text-xs font-semibold hover:bg-navy hover:text-white transition-colors">🎟️ ${label}</button>`;
      }).join('');
    }

    function useMyVoucher(code) {
      document.getElementById('promo-input').value = code;
      applyPromoCode();
    }

    async function loadShippingPolicyNote() {
      await iswLoadSettings();
      const note = iswGetSetting('shop_shipping_policy',
        'Pickup di klinik percuma · Pos/Courier RM8 (Semenanjung 2-4 hari bekerja). Item boleh ditukar/pulang dalam 7 hari jika rosak — hubungi kami di WhatsApp.');
      const el = document.getElementById('shipping-policy-note');
      if (el) el.textContent = note;
    }

    (async () => {
      const user = await initPatient('shop', 'À la carte · beli individu tanpa pakej');
      if (!user) return;
      await loadProductsFromDB();
      renderShop();
      loadShippingPolicyNote();
      loadMyVoucherChips();
    })();
  </script>
</body>

</html>
