<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Week Detail</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📅</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div id="content" class="p-4 md:p-8 space-y-5 w-full">
        <!-- Hero -->
        <div id="week-hero"></div>

        <!-- Quick Review: 4 preview cards (click to open modal) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <button onclick="openReviewModal('notes')" class="text-left bg-white rounded-xl p-4 border border-ink/10 hover:border-navy hover:shadow-sm transition">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-navy/10 flex items-center justify-center text-lg">🎯</div>
              <div class="flex-1 min-w-0">
                <div class="font-semibold text-sm">Nota Coach</div>
                <div id="preview-notes" class="text-[11px] text-ink/60 truncate">—</div>
              </div>
              <div class="text-xs text-navy">→</div>
            </div>
          </button>
          <button onclick="openReviewModal('soap')" class="text-left bg-white rounded-xl p-4 border border-ink/10 hover:border-navy hover:shadow-sm transition">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-teal/10 flex items-center justify-center text-lg">⚕</div>
              <div class="flex-1 min-w-0">
                <div class="font-semibold text-sm">Nota Doktor</div>
                <div id="preview-soap" class="text-[11px] text-ink/60 truncate">—</div>
              </div>
              <div class="text-xs text-navy">→</div>
            </div>
          </button>
          <button onclick="openReviewModal('psy_vitals')" class="text-left bg-white rounded-xl p-4 border border-ink/10 hover:border-navy hover:shadow-sm transition">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-green/10 flex items-center justify-center text-lg">📊</div>
              <div class="flex-1 min-w-0">
                <div class="font-semibold text-sm">Bacaan Vitals</div>
                <div id="preview-vitals" class="text-[11px] text-ink/60 truncate">—</div>
              </div>
              <div class="text-xs text-navy">→</div>
            </div>
          </button>
          <button onclick="openReviewModal('sessions')" class="text-left bg-white rounded-xl p-4 border border-ink/10 hover:border-navy hover:shadow-sm transition">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-gold/10 flex items-center justify-center text-lg">📝</div>
              <div class="flex-1 min-w-0">
                <div class="font-semibold text-sm">Sesi Coaching</div>
                <div id="preview-sessions" class="text-[11px] text-ink/60 truncate">—</div>
              </div>
              <div class="text-xs text-navy">→</div>
            </div>
          </button>
        </div>

        <!-- Main actions: BPS-S Checklist + Kepatuhan -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4" id="main-grid">
          <!-- BPS-S Matlamat -->
          <div class="bg-white rounded-xl p-5 border border-ink/10">
            <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
              <h3 class="font-bold flex items-center gap-2">✅ Matlamat BPS-S</h3>
              <span id="progress-text" class="text-xs text-ink/60">0/0</span>
            </div>
            <p class="text-xs text-ink/60 mb-3">Tanda matlamat yang anda dah laksanakan minggu ini.</p>
            <div id="progress-bar" class="w-full bg-ink/10 rounded-full h-2 mb-4">
              <div id="progress-fill" class="bg-green h-2 rounded-full transition-all" style="width: 0%"></div>
            </div>

            <div class="space-y-2">
              <div id="checklist-bio"></div>
              <div id="checklist-psycho"></div>
              <div id="checklist-social"></div>
              <div id="checklist-spiritual"></div>
            </div>
          </div>

          <!-- Kepatuhan Rawatan Fitrah (read-only for patient) -->
          <div class="bg-white rounded-xl p-5 border border-ink/10">
            <h3 class="font-bold mb-1 flex items-center gap-2">🌿 Kepatuhan Rawatan</h3>
            <p class="text-xs text-ink/60 mb-4">Direkod oleh coach semasa sesi rawatan.</p>
            <div id="compliance-view" class="text-sm"></div>
          </div>
        </div>
      </div>

        <!-- Feedback Minggu Ini -->
        <div id="feedback-section" class="bg-white rounded-xl p-5 border border-ink/10">
          <h3 class="font-bold mb-1 flex items-center gap-2">⭐ Feedback Minggu Ini</h3>
          <p class="text-xs text-ink/60 mb-4">Bagaimana minggu rawatan ini bagi anda?</p>

          <!-- Submitted state -->
          <div id="feedback-done" class="hidden text-center py-4 space-y-2">
            <div id="feedback-done-stars" class="text-3xl"></div>
            <p class="text-sm text-ink/70 font-medium">Terima kasih atas feedback anda!</p>
            <p id="feedback-done-comment" class="text-xs text-ink/50 italic"></p>
            <button onclick="editFeedback()" class="text-xs text-navy underline mt-1">Tukar feedback</button>
          </div>

          <!-- Input state -->
          <div id="feedback-form" class="space-y-4">
            <div class="flex gap-3 text-3xl" id="feedback-stars">
              <span class="cursor-pointer select-none" onclick="setWeekRating(1)">☆</span>
              <span class="cursor-pointer select-none" onclick="setWeekRating(2)">☆</span>
              <span class="cursor-pointer select-none" onclick="setWeekRating(3)">☆</span>
              <span class="cursor-pointer select-none" onclick="setWeekRating(4)">☆</span>
              <span class="cursor-pointer select-none" onclick="setWeekRating(5)">☆</span>
            </div>
            <textarea id="feedback-comment" rows="3" placeholder="Komen atau cadangan (optional)..."
              class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none bg-white resize-none"></textarea>
            <button onclick="submitWeekFeedback()" class="bg-navy text-white px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-navy-dark">
              Hantar Feedback
            </button>
          </div>
        </div>
      </div>

      <!-- Review modals -->
      <div id="review-modal" onclick="if(event.target===this)closeReviewModal()" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[80vh] flex flex-col">
          <div class="flex items-center justify-between p-5 border-b border-ink/10">
            <h3 id="review-title" class="font-bold text-lg"></h3>
            <button onclick="closeReviewModal()" class="w-8 h-8 rounded-lg hover:bg-cream flex items-center justify-center text-xl">×</button>
          </div>
          <div id="review-body" class="flex-1 overflow-y-auto p-5"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let activePlan = null;
let weekNumber = 1;
let weekEntry = null;
let weekStart = null;
let weekEnd = null;
let checkInState = {};

function parseWeekFromHash() {
  const m = (location.hash || '').match(/week=(\d+)/);
  return m ? parseInt(m[1]) : 1;
}

function computeWeekRange(plan, w) {
  const start = new Date(plan.created_at);
  start.setDate(start.getDate() + (w - 1) * 7);
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  return { start, end };
}

async function loadWeekDetail() {
  const plans = await dbQuery('psy_treatment_plans', { eq: { patient_id: patientRecord.id } });
  activePlan = plans.find(p => p.status === 'active') || plans[0];
  if (!activePlan) {
    document.getElementById('content').innerHTML = '<div class="text-center p-10">Tiada pelan rawatan aktif.</div>';
    return;
  }

  weekNumber = Math.max(1, Math.min(parseWeekFromHash(), activePlan.duration_weeks || 12));
  const range = computeWeekRange(activePlan, weekNumber);
  weekStart = range.start;
  weekEnd = range.end;

  // Week entry (coach-recorded)
  const progress = await dbQuery('psy_plan_weekly_progress', {
    eq: { plan_id: activePlan.id, week_number: weekNumber },
  }).catch(() => []);
  weekEntry = progress[0] || null;

  renderHero();
  renderCoachNotes();
  await Promise.all([loadVitals(), loadSessions(), loadSoap(), loadCheckIns(), loadCompliance()]);
  renderFeedbackSection();
  renderChecklists();
}

let weekSoap = [];

async function loadSoap() {
  const all = await dbQuery('psy_soap_notes', { eq: { patient_id: patientRecord.id }, order: { col: 'created_at' } }).catch(() => []);
  weekSoap = all.filter(n => {
    const t = new Date(n.created_at);
    return t >= weekStart && t < weekEnd;
  });

  const preview = document.getElementById('preview-soap');
  if (weekSoap.length) {
    const latest = weekSoap[0];
    preview.textContent = latest.chief_complaint ? latest.chief_complaint.slice(0, 50) + (latest.chief_complaint.length > 50 ? '…' : '') : `${weekSoap.length} catatan`;
    preview.classList.remove('italic');
  } else {
    preview.textContent = 'Tiada catatan';
    preview.classList.add('italic');
  }
}

async function loadCompliance() {
  const rows = await dbQuery('psy_plan_compliance', {
    eq: { plan_id: activePlan.id, week_number: weekNumber },
  }).catch(() => []);
  const c = rows[0];
  const host = document.getElementById('compliance-view');

  if (!c) {
    host.innerHTML = '<p class="text-sm text-ink/40 italic text-center py-6">Coach belum rekod kepatuhan untuk minggu ini.</p>';
    return;
  }

  const fmt = v => v === null || v === undefined || v === '' ? '—' : v;
  const boolIcon = v => v === null || v === undefined ? '—' : (v ? '✅ Ya' : '❌ Tidak');

  host.innerHTML = `
    <div class="grid grid-cols-2 gap-2 text-sm">
      <div class="bg-cream/40 rounded-lg p-2"><div class="text-[11px] text-ink/60">🍯 Madu</div><div class="font-semibold">${fmt(c.madu_sudu)} ${c.madu_sudu ? 'sudu/hari' : ''}</div></div>
      <div class="bg-cream/40 rounded-lg p-2"><div class="text-[11px] text-ink/60">🌬️ Nafas fitrah</div><div class="font-semibold">${fmt(c.nafas_kali)} ${c.nafas_kali ? 'kali/hari' : ''}</div></div>
      <div class="bg-cream/40 rounded-lg p-2"><div class="text-[11px] text-ink/60">🌍 Terapi bumi</div><div class="font-semibold">${fmt(c.bumi_minit)} ${c.bumi_minit ? 'min/hari' : ''}</div></div>
      <div class="bg-cream/40 rounded-lg p-2"><div class="text-[11px] text-ink/60">🥥 Air kelapa</div><div class="font-semibold">${fmt(c.kelapa_kali)} ${c.kelapa_kali ? 'kali/minggu' : ''}</div></div>
      <div class="bg-cream/40 rounded-lg p-2"><div class="text-[11px] text-ink/60">💧 Terapi kolon</div><div class="font-semibold">${fmt(c.kolon_kali)} ${c.kolon_kali ? 'kali' : ''}</div></div>
      <div class="bg-cream/40 rounded-lg p-2"><div class="text-[11px] text-ink/60">☀️ Berjemur</div><div class="font-semibold">${boolIcon(c.berjemur)}</div></div>
      <div class="bg-cream/40 rounded-lg p-2 col-span-2"><div class="text-[11px] text-ink/60">🍽️ Pantang makanan</div><div class="font-semibold">${boolIcon(c.pantang)}</div></div>
      ${c.notes ? `<div class="col-span-2 bg-cream/40 rounded-lg p-2"><div class="text-[11px] text-ink/60 mb-1">📝 Nota Coach</div><div class="text-xs italic">${c.notes}</div></div>` : ''}
    </div>
    <p class="text-[10px] text-ink/50 mt-3 text-right">Direkod: ${c.updated_at ? new Date(c.updated_at).toLocaleDateString('ms-MY') : '—'}</p>`;
}

function renderHero() {
  const status = weekEntry?.status || 'unbooked';
  const statusStyles = {
    hadir: { color: 'text-green-dark', icon: '✅', label: 'Hadir' },
    reschedule: { color: 'text-gold-dark', icon: '🔄', label: 'Reschedule' },
    cancel: { color: 'text-terracotta', icon: '❌', label: 'Tidak Hadir' },
    booked: { color: 'text-navy', icon: '📅', label: 'Ditempah' },
    pending: { color: 'text-ink/60', icon: '⏳', label: 'Pending' },
    unbooked: { color: 'text-ink/60', icon: '⚪', label: 'Belum Tempah' },
  };
  const s = statusStyles[status];
  const isCurrent = weekNumber === activePlan.current_week;
  const totalWeeks = activePlan.duration_weeks || 12;
  const pct = Math.round((weekNumber / totalWeeks) * 100);

  let countdown = '';
  if (weekEntry?.session_date && status === 'booked') {
    const diffDays = Math.ceil((new Date(weekEntry.session_date) - new Date()) / 86400000);
    if (diffDays > 0) countdown = `<span class="text-sm font-semibold text-navy">${diffDays} hari lagi</span>`;
    else if (diffDays === 0) countdown = `<span class="text-sm font-semibold text-gold-dark">Hari ini 📍</span>`;
  }

  document.getElementById('week-hero').innerHTML = `
    <div class="flex items-start justify-between gap-4 flex-wrap">
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2 flex-wrap mb-1">
          <span class="text-[11px] uppercase tracking-wider text-ink/60 font-semibold">${activePlan.name}</span>
          ${isCurrent ? '<span class="bg-gold text-ink text-[10px] font-bold px-2 py-0.5 rounded-full">SEMASA</span>' : ''}
          <span class="${s.color} text-xs font-semibold flex items-center gap-1">· ${s.icon} ${s.label}</span>
        </div>
        <h2 class="text-2xl md:text-3xl font-bold text-ink">Minggu ${weekNumber}</h2>
        <div class="text-sm text-ink/70 mt-1">
          ${weekEntry?.session_date
            ? `📅 ${new Date(weekEntry.session_date).toLocaleDateString('ms-MY', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' })} · 🕐 ${new Date(weekEntry.session_date).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`
            : 'Belum ditempah'}
          ${weekEntry?.score ? ` · ⭐ ${weekEntry.score}/10` : ''}
          ${weekEntry?.meet_link ? `<br><a href="${weekEntry.meet_link}" target="_blank" class="inline-flex items-center gap-1.5 mt-2 text-sm font-semibold text-white bg-navy px-4 py-2 rounded-xl hover:bg-navy-dark transition-colors">🎥 Sertai Google Meet →</a>` : ''}
        </div>
      </div>
      ${countdown}
    </div>

    <div class="mt-4 flex items-center gap-3 text-[11px] text-ink/60">
      <span>Minggu ${weekNumber}/${totalWeeks}</span>
      <div class="flex-1 bg-ink/10 rounded-full h-1">
        <div class="bg-navy rounded-full h-1 transition-all" style="width: ${pct}%"></div>
      </div>
      <span>${pct}%</span>
    </div>`;
}

let weekVitals = [];
let weekSessions = [];

function renderCoachNotes() {
  const preview = document.getElementById('preview-notes');
  if (weekEntry?.notes) {
    preview.textContent = weekEntry.notes.slice(0, 60) + (weekEntry.notes.length > 60 ? '…' : '');
    preview.classList.remove('italic');
  } else {
    preview.textContent = 'Belum ada nota';
    preview.classList.add('italic');
  }
}

async function loadVitals() {
  const all = await dbQuery('psy_vitals', { eq: { patient_id: patientRecord.id }, order: { col: 'created_at' } });
  weekVitals = all.filter(v => {
    const t = new Date(v.created_at);
    return t >= weekStart && t < weekEnd;
  });

  const preview = document.getElementById('preview-vitals');
  if (weekVitals.length) {
    const latest = weekVitals[0];
    const bits = [];
    if (latest.bp_systolic) bits.push(`BP ${latest.bp_systolic}/${latest.bp_diastolic}`);
    if (latest.heart_rate) bits.push(`HR ${latest.heart_rate}`);
    if (latest.bmi) bits.push(`BMI ${latest.bmi}`);
    preview.textContent = `${weekVitals.length} bacaan · ${bits.join(' · ')}`;
    preview.classList.remove('italic');
  } else {
    preview.textContent = 'Tiada bacaan minggu ini';
    preview.classList.add('italic');
  }
}

async function loadSessions() {
  const all = await dbQuery('psy_coaching_sessions', { eq: { patient_id: patientRecord.id }, order: { col: 'scheduled_at' } }).catch(() => []);
  weekSessions = all.filter(s => {
    const d = s.scheduled_at ? new Date(s.scheduled_at) : new Date(s.created_at);
    return d >= weekStart && d < weekEnd;
  });

  const preview = document.getElementById('preview-sessions');
  if (weekSessions.length) {
    preview.textContent = `${weekSessions.length} sesi minggu ini`;
    preview.classList.remove('italic');
  } else {
    preview.textContent = 'Tiada sesi minggu ini';
    preview.classList.add('italic');
  }
}

function openReviewModal(kind) {
  const modal = document.getElementById('review-modal');
  const title = document.getElementById('review-title');
  const body = document.getElementById('review-body');

  if (kind === 'notes') {
    title.textContent = '🎯 Nota Coach';
    body.innerHTML = weekEntry?.notes
      ? `<div class="bg-cream/40 rounded-lg p-4 text-sm leading-relaxed whitespace-pre-wrap">${weekEntry.notes}</div>
         ${weekEntry.updated_by_name ? `<p class="text-xs text-ink/50 mt-3">— ${weekEntry.updated_by_name}${weekEntry.updated_at ? ' · ' + new Date(weekEntry.updated_at).toLocaleDateString('ms-MY') : ''}</p>` : ''}`
      : '<p class="text-sm text-ink/40 italic text-center py-6">Coach belum tinggalkan nota untuk minggu ini.</p>';
  } else if (kind === 'psy_vitals') {
    title.textContent = `📊 Bacaan Vitals (${weekVitals.length})`;
    body.innerHTML = weekVitals.length
      ? `<div class="space-y-2">${weekVitals.map(v => `
          <div class="border border-ink/10 rounded-lg p-3">
            <div class="text-xs text-ink/60 mb-2">${new Date(v.created_at).toLocaleString('ms-MY')}</div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
              ${v.bp_systolic ? `<div><span class="text-ink/50">BP:</span> <strong>${v.bp_systolic}/${v.bp_diastolic}</strong></div>` : ''}
              ${v.heart_rate ? `<div><span class="text-ink/50">HR:</span> <strong>${v.heart_rate} bpm</strong></div>` : ''}
              ${v.bmi ? `<div><span class="text-ink/50">BMI:</span> <strong>${v.bmi}</strong></div>` : ''}
              ${v.weight ? `<div><span class="text-ink/50">Weight:</span> <strong>${v.weight} kg</strong></div>` : ''}
              ${v.spo2 ? `<div><span class="text-ink/50">SpO2:</span> <strong>${v.spo2}%</strong></div>` : ''}
              ${v.temperature ? `<div><span class="text-ink/50">Temp:</span> <strong>${v.temperature}°C</strong></div>` : ''}
              ${v.waist_cm ? `<div><span class="text-ink/50">Waist:</span> <strong>${v.waist_cm} cm</strong></div>` : ''}
              ${v.rbs ? `<div><span class="text-ink/50">RBS:</span> <strong>${v.rbs}</strong></div>` : ''}
            </div>
            ${v.notes ? `<div class="text-xs text-ink/60 mt-2 italic">💬 ${v.notes}</div>` : ''}
          </div>`).join('')}</div>`
      : '<p class="text-sm text-ink/40 italic text-center py-6">Tiada bacaan vitals untuk minggu ini.</p>';
  } else if (kind === 'soap') {
    title.textContent = `⚕ Nota Doktor (${weekSoap.length})`;
    body.innerHTML = weekSoap.length
      ? `<div class="space-y-3">${weekSoap.map(n => `
          <div class="border border-ink/10 rounded-lg p-4 space-y-2">
            <div class="text-xs text-ink/60">${new Date(n.created_at).toLocaleString('ms-MY')} · Status: <strong>${n.status || '—'}</strong></div>
            ${n.chief_complaint ? `<div><div class="text-[11px] font-semibold text-ink/70 uppercase">Aduan Utama</div><div class="text-sm">${n.chief_complaint}</div></div>` : ''}
            ${n.hpi ? `<div><div class="text-[11px] font-semibold text-ink/70 uppercase">Sejarah Penyakit</div><div class="text-sm">${n.hpi}</div></div>` : ''}
            ${n.ros_positives ? `<div><div class="text-[11px] font-semibold text-ink/70 uppercase">Simptom Positif</div><div class="text-sm">${n.ros_positives}</div></div>` : ''}
            ${n.meds_adherence ? `<div><div class="text-[11px] font-semibold text-ink/70 uppercase">Kepatuhan Ubat</div><div class="text-sm">${n.meds_adherence}</div></div>` : ''}
            ${n.examination ? `<div><div class="text-[11px] font-semibold text-ink/70 uppercase">Pemeriksaan</div><div class="text-sm">${n.examination}</div></div>` : ''}
            ${n.clinical_reasoning ? `<div><div class="text-[11px] font-semibold text-ink/70 uppercase">Reasoning</div><div class="text-sm">${n.clinical_reasoning}</div></div>` : ''}
            ${Array.isArray(n.diagnoses) && n.diagnoses.length ? `<div><div class="text-[11px] font-semibold text-ink/70 uppercase">Diagnosis</div><div class="text-sm">${n.diagnoses.join(', ')}</div></div>` : ''}
            ${n.follow_up ? `<div><div class="text-[11px] font-semibold text-ink/70 uppercase">Follow-up</div><div class="text-sm">${n.follow_up}</div></div>` : ''}
          </div>`).join('')}</div>`
      : '<p class="text-sm text-ink/40 italic text-center py-6">Tiada catatan doktor untuk minggu ini.</p>';
  } else if (kind === 'sessions') {
    title.textContent = `📝 Sesi Coaching (${weekSessions.length})`;
    body.innerHTML = weekSessions.length
      ? `<div class="space-y-2">${weekSessions.map(s => `
          <div class="border border-ink/10 rounded-lg p-3">
            <div class="flex items-center justify-between flex-wrap gap-1 mb-2">
              <div class="font-semibold text-sm">${s.session_type || 'Session'}</div>
              <div class="text-xs text-ink/60">${s.scheduled_at ? new Date(s.scheduled_at).toLocaleString('ms-MY') : ''}</div>
            </div>
            ${s.notes ? `<div class="text-xs text-ink/70 whitespace-pre-wrap">${s.notes}</div>` : '<div class="text-xs text-ink/40 italic">Tiada nota sesi</div>'}
          </div>`).join('')}</div>`
      : '<p class="text-sm text-ink/40 italic text-center py-6">Tiada sesi coaching untuk minggu ini.</p>';
  }
  modal.classList.remove('hidden');
}

function closeReviewModal() {
  document.getElementById('review-modal').classList.add('hidden');
}

async function loadCheckIns() {
  const rows = await dbQuery('psy_plan_check_ins', {
    eq: { plan_id: activePlan.id, week_number: weekNumber },
  }).catch(() => []);
  checkInState = {};
  rows.forEach(c => { checkInState[`${c.pillar}_${c.goal_index}`] = c.id; });
}

const PILLAR_META = {
  bio: { label: '🧬 BIO · Fizikal', color: 'text-navy', bg: 'bg-navy/5' },
  psycho: { label: '🧠 PSYCHO · Mental', color: 'text-terracotta', bg: 'bg-terracotta/5' },
  social: { label: '👥 SOCIAL · Sosial', color: 'text-gold-dark', bg: 'bg-gold/10' },
  spiritual: { label: '🕌 SPIRITUAL · Rohani', color: 'text-green-dark', bg: 'bg-green/5' },
};

function renderChecklists() {
  let total = 0, done = 0;
  ['bio', 'psycho', 'social', 'spiritual'].forEach(k => {
    const goals = activePlan[k + '_goals'] || [];
    total += goals.length;
    goals.forEach((_, i) => { if (checkInState[`${k}_${i}`]) done++; });

    const meta = PILLAR_META[k];
    const html = goals.length ? `
      <div class="${meta.bg} rounded-lg p-3">
        <div class="text-xs font-semibold ${meta.color} mb-2">${meta.label}</div>
        <ul class="space-y-1.5">
          ${goals.map((g, i) => {
            const goalText = typeof g === 'string' ? g : (g.goal || g.description || '');
            const isChecked = !!checkInState[`${k}_${i}`];
            const safe = goalText.replace(/`/g, '\\`').replace(/'/g, "\\'");
            return `<li class="flex items-start gap-2 cursor-pointer text-xs hover:bg-white/50 -mx-1 px-1 py-0.5 rounded" onclick="toggleCheckIn('${k}',${i},\`${safe}\`)">
              <span class="${meta.color}">${isChecked ? '✅' : '☐'}</span>
              <span class="${isChecked ? 'line-through text-ink/40' : ''}">${goalText}</span>
            </li>`;
          }).join('')}
        </ul>
      </div>` : '';
    document.getElementById('checklist-' + k).innerHTML = html;
  });

  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${done} / ${total} matlamat (${pct}%)`;
}

async function toggleCheckIn(pillar, index, goalText) {
  const key = `${pillar}_${index}`;
  const existingId = checkInState[key];
  try {
    if (existingId) {
      await dbDelete('psy_plan_check_ins', existingId);
      delete checkInState[key];
    } else {
      const row = await dbInsert('psy_plan_check_ins', {
        plan_id: activePlan.id,
        patient_id: patientRecord.id,
        pillar,
        goal_index: index,
        goal_text: goalText,
        week_number: weekNumber,
      });
      checkInState[key] = row.id;
    }
    renderChecklists();
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  }
}

// ==================== WEEKLY FEEDBACK ====================
let weekRating = 0;

function setWeekRating(n) {
  weekRating = n;
  document.querySelectorAll('#feedback-stars span').forEach((s, i) => {
    s.textContent = i < n ? '⭐' : '☆';
  });
}

function renderFeedbackSection() {
  const rating = weekEntry?.feedback_rating;
  const comment = weekEntry?.feedback_comment;
  if (rating) {
    document.getElementById('feedback-form').classList.add('hidden');
    document.getElementById('feedback-done').classList.remove('hidden');
    document.getElementById('feedback-done-stars').textContent = '⭐'.repeat(rating) + '☆'.repeat(5 - rating);
    document.getElementById('feedback-done-comment').textContent = comment || '';
  } else {
    document.getElementById('feedback-form').classList.remove('hidden');
    document.getElementById('feedback-done').classList.add('hidden');
    weekRating = 0;
    document.querySelectorAll('#feedback-stars span').forEach(s => s.textContent = '☆');
    document.getElementById('feedback-comment').value = '';
  }
}

function editFeedback() {
  document.getElementById('feedback-done').classList.add('hidden');
  document.getElementById('feedback-form').classList.remove('hidden');
  setWeekRating(weekEntry?.feedback_rating || 0);
  document.getElementById('feedback-comment').value = weekEntry?.feedback_comment || '';
}

async function submitWeekFeedback() {
  if (!weekRating) { banner('Sila pilih rating bintang', 'error'); return; }
  const comment = document.getElementById('feedback-comment').value.trim();
  try {
    const data = { feedback_rating: weekRating, feedback_comment: comment || null, feedback_at: new Date().toISOString() };
    if (weekEntry?.id) {
      await dbUpdate('psy_plan_weekly_progress', weekEntry.id, data);
      weekEntry = { ...weekEntry, ...data };
    } else {
      const row = await dbInsert('psy_plan_weekly_progress', {
        plan_id: activePlan.id,
        patient_id: patientRecord.id,
        week_number: weekNumber,
        ...data,
      });
      weekEntry = row;
    }
    renderFeedbackSection();
    banner('Terima kasih atas feedback anda!');
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  }
}

window.addEventListener('hashchange', () => loadWeekDetail());

(async () => {
  const user = await initPatient('plan', 'Butiran rawatan mingguan');
  if (!user) return;

  setHeaderBack('plan.html', 'Kembali ke Treatment Plan');

  await loadWeekDetail();
})();
</script>
