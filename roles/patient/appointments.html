<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Appointments</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📅</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div id="content" class="p-4 md:p-8 space-y-6">
        <!-- Booking Form (single page) -->
        <div class="max-w-3xl mx-auto bg-white rounded-2xl border border-ink/10 p-4 md:p-6">
          <!-- Stepper (visual indicator only — all visible) -->
          <div class="flex items-center gap-2 mb-6 overflow-x-auto">
            <div class="flex items-center gap-2 whitespace-nowrap">
              <div class="stepper-dot bg-navy text-white">1</div>
              <span class="text-xs font-semibold text-navy">Service</span>
            </div>
            <div class="flex-1 h-px bg-ink/20 min-w-[20px]"></div>
            <div class="flex items-center gap-2 whitespace-nowrap">
              <div id="dot-2" class="stepper-dot bg-ink/20 text-ink/60">2</div>
              <span id="label-2" class="text-xs text-ink/60">Date &amp; Time</span>
            </div>
            <div class="flex-1 h-px bg-ink/20 min-w-[20px]"></div>
            <div class="flex items-center gap-2 whitespace-nowrap">
              <div id="dot-3" class="stepper-dot bg-ink/20 text-ink/60">3</div>
              <span id="label-3" class="text-xs text-ink/60">Confirm</span>
            </div>
          </div>

          <!-- Service -->
          <h2 class="text-xl font-bold mb-1">Pilih jenis rawatan</h2>
          <p class="text-sm text-ink/70 mb-4">Apa yang anda perlukan hari ini?</p>
          <div id="service-grid" class="grid md:grid-cols-2 gap-3"></div>

          <!-- Date -->
          <div class="flex items-center justify-between mt-7 mb-3">
            <h3 class="font-bold">Pilih tarikh</h3>
            <div class="flex items-center gap-2">
              <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-lg border border-ink/20 hover:bg-cream text-sm">‹</button>
              <span id="month-label" class="text-sm font-semibold min-w-[140px] text-center"></span>
              <button onclick="changeMonth(1)" class="w-8 h-8 rounded-lg border border-ink/20 hover:bg-cream text-sm">›</button>
            </div>
          </div>
          <div class="grid grid-cols-7 gap-1 sm:gap-2 mb-1">
            <div class="text-center text-xs text-ink/60 p-1 sm:p-2">Mon</div>
            <div class="text-center text-xs text-ink/60 p-1 sm:p-2">Tue</div>
            <div class="text-center text-xs text-ink/60 p-1 sm:p-2">Wed</div>
            <div class="text-center text-xs text-ink/60 p-1 sm:p-2">Thu</div>
            <div class="text-center text-xs text-ink/60 p-1 sm:p-2">Fri</div>
            <div class="text-center text-xs text-ink/60 p-1 sm:p-2">Sat</div>
            <div class="text-center text-xs text-ink/60 p-1 sm:p-2">Sun</div>
          </div>
          <div id="date-picker" class="grid grid-cols-7 gap-1 sm:gap-2"></div>

          <!-- Time -->
          <h3 class="font-bold mt-7 mb-3">Pilih masa</h3>
          <div id="time-picker" class="grid grid-cols-3 md:grid-cols-5 gap-2"></div>

          <!-- Summary + Confirm -->
          <div id="summary-box" class="hidden mt-6 bg-cream rounded-xl p-4 space-y-2 text-sm"></div>

          <button onclick="confirmBooking()" id="btn-confirm" disabled class="w-full mt-6 bg-navy text-white py-3 rounded-lg font-semibold hover:bg-navy-dark disabled:opacity-40 disabled:cursor-not-allowed">
            Confirm &amp; Proceed to Payment →
          </button>
        </div>

        <!-- My Appointments List -->
        <div class="pt-4">
          <h3 class="font-bold text-lg mb-3">Appointments Anda</h3>
          <div class="flex gap-2 mb-4 overflow-x-auto">
            <button onclick="filterAppts('upcoming')" id="tab-upcoming" class="px-4 py-2 rounded-full bg-navy text-white text-sm font-semibold whitespace-nowrap">Upcoming</button>
            <button onclick="filterAppts('past')" id="tab-past" class="px-4 py-2 rounded-full bg-white border border-ink/20 text-sm whitespace-nowrap">Past</button>
            <button onclick="filterAppts('cancelled')" id="tab-cancelled" class="px-4 py-2 rounded-full bg-white border border-ink/20 text-sm whitespace-nowrap">Cancelled</button>
          </div>
          <div id="appts-list" class="space-y-3"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const SERVICES = [
  { id:'consultation', name:'Consultation with Doctor', desc:'Dr. Hamzah, Dr. Aziz · Perubatan Alami + BPS-S assessment', price:120, duration:45 },
  { id:'coaching', name:'Coaching Session', desc:'SU · OB · NLC · JS programs', price:80, duration:60 },
  { id:'nurse', name:'Nurse Check-up', desc:'Vital signs, blood pressure, routine monitoring', price:40, duration:20 },
  { id:'nutrition', name:'Nutrition Consultation', desc:'Santapan Fitrah · diet plan · Nutritionist', price:70, duration:30 },
];

const TIME_SLOTS = ['9:00am','9:30am','10:00am','10:30am','11:00am','11:30am','2:00pm','2:30pm','3:00pm','3:30pm','4:00pm','4:30pm'];
const DISABLED_SLOTS = ['2:00pm']; // mock — replaced by real availability check later

let selectedService = null;
let selectedDate = null;
let selectedTime = null;
let allAppts = [];

function renderServices() {
  document.getElementById('service-grid').innerHTML = SERVICES.map(s => {
    const isSelected = selectedService?.id === s.id;
    return `<label class="border-2 ${isSelected ? 'border-navy bg-navy-light' : 'border-ink/10'} rounded-xl p-4 cursor-pointer hover:border-navy transition block">
      <div class="flex items-start gap-3">
        <input type="radio" name="service" value="${s.id}" onchange="selectService('${s.id}')" ${isSelected ? 'checked' : ''} class="mt-1">
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-sm">${s.name}</div>
          <div class="text-xs text-ink/70 mt-1">${s.desc}</div>
          <div class="text-xs text-navy font-semibold mt-2">RM ${s.price} · ${s.duration} min</div>
        </div>
      </div>
    </label>`;
  }).join('');
}

function selectService(id) {
  selectedService = SERVICES.find(s => s.id === id);
  renderServices();
  updateStepper();
  renderSummary();
}

let viewYear = new Date().getFullYear();
let viewMonth = new Date().getMonth(); // 0=Jan

function renderDates() {
  const today = new Date();
  const todayIso = today.toISOString().split('T')[0];
  const firstDay = new Date(viewYear, viewMonth, 1);
  const lastDay = new Date(viewYear, viewMonth + 1, 0);

  // Month label
  document.getElementById('month-label').textContent = firstDay.toLocaleDateString('ms-MY', { month: 'long', year: 'numeric' });

  // Figure out offset for Monday-start (0=Sun, 1=Mon...)
  const dayOfWeek = firstDay.getDay();
  const offset = dayOfWeek === 0 ? 6 : dayOfWeek - 1;

  const html = [];
  // Empty cells before day 1
  for (let i = 0; i < offset; i++) {
    html.push('<div></div>');
  }

  for (let d = 1; d <= lastDay.getDate(); d++) {
    const date = new Date(viewYear, viewMonth, d);
    const iso = date.toISOString().split('T')[0];
    const isPast = iso < todayIso;
    const isToday = iso === todayIso;
    const isSelected = selectedDate === iso;

    let classes = 'aspect-square rounded-lg text-sm flex items-center justify-center ';
    if (isPast) classes += 'text-ink/20 cursor-not-allowed';
    else if (isSelected) classes += 'bg-navy text-white font-semibold';
    else if (isToday) classes += 'bg-navy-light text-navy font-semibold hover:bg-navy hover:text-white';
    else classes += 'hover:bg-navy-light';

    html.push(`<button ${isPast ? 'disabled' : `onclick="selectDate('${iso}')"`}
      class="${classes}">${d}</button>`);
  }
  document.getElementById('date-picker').innerHTML = html.join('');
}

function changeMonth(delta) {
  viewMonth += delta;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  else if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  // Prevent going to past months
  const today = new Date();
  if (viewYear < today.getFullYear() || (viewYear === today.getFullYear() && viewMonth < today.getMonth())) {
    viewMonth = today.getMonth();
    viewYear = today.getFullYear();
  }
  renderDates();
}

function selectDate(date) {
  selectedDate = date;
  renderDates();
  updateStepper();
  renderSummary();
}

function renderTimes() {
  document.getElementById('time-picker').innerHTML = TIME_SLOTS.map(t => {
    const disabled = DISABLED_SLOTS.includes(t);
    const isSelected = selectedTime === t;
    const classes = disabled ? 'border-ink/20 text-ink/30 cursor-not-allowed' :
                    isSelected ? 'border-2 border-navy bg-navy-light text-navy font-semibold' :
                    'border border-ink/20 hover:border-navy';
    return `<button ${disabled ? 'disabled' : `onclick="selectTime('${t}')"`}
      class="${classes} rounded-lg py-2 text-sm">${t}</button>`;
  }).join('');
}

function selectTime(t) {
  selectedTime = t;
  renderTimes();
  updateStepper();
  renderSummary();
}

function updateStepper() {
  // Step 2 active if service chosen
  const s2Active = !!selectedService;
  document.getElementById('dot-2').className = `stepper-dot ${s2Active ? 'bg-navy text-white' : 'bg-ink/20 text-ink/60'}`;
  document.getElementById('label-2').className = `text-xs ${s2Active ? 'font-semibold text-navy' : 'text-ink/60'}`;
  // Step 3 active if service + date + time
  const s3Active = s2Active && selectedDate && selectedTime;
  document.getElementById('dot-3').className = `stepper-dot ${s3Active ? 'bg-navy text-white' : 'bg-ink/20 text-ink/60'}`;
  document.getElementById('label-3').className = `text-xs ${s3Active ? 'font-semibold text-navy' : 'text-ink/60'}`;
  // Confirm button enabled if all selected
  document.getElementById('btn-confirm').disabled = !s3Active;
}

function renderSummary() {
  const box = document.getElementById('summary-box');
  if (!selectedService || !selectedDate || !selectedTime) { box.classList.add('hidden'); return; }
  const d = new Date(selectedDate);
  const dateStr = d.toLocaleDateString('ms-MY', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  box.classList.remove('hidden');
  box.innerHTML = `
    <div class="flex justify-between"><span class="text-ink/70">Perkhidmatan</span><strong>${selectedService.name}</strong></div>
    <div class="flex justify-between"><span class="text-ink/70">Tarikh</span><strong>${dateStr}</strong></div>
    <div class="flex justify-between"><span class="text-ink/70">Masa</span><strong>${selectedTime}</strong></div>
    <div class="flex justify-between pt-2 border-t border-ink/10"><span class="font-semibold">Jumlah</span><strong class="text-navy">RM ${selectedService.price.toFixed(2)}</strong></div>
  `;
}

function parseTimeTo24h(t) {
  const m = t.match(/^(\d+):(\d+)(am|pm)$/i);
  let h = parseInt(m[1]);
  const min = m[2];
  if (m[3].toLowerCase() === 'pm' && h < 12) h += 12;
  if (m[3].toLowerCase() === 'am' && h === 12) h = 0;
  return `${String(h).padStart(2,'0')}:${min}`;
}

async function confirmBooking() {
  if (!patientRecord) { banner('Rekod pesakit belum aktif', 'error'); return; }
  const btn = document.getElementById('btn-confirm');
  btn.disabled = true; btn.textContent = 'Menempah...';

  try {
    const time24 = parseTimeTo24h(selectedTime);
    const apptTime = `${selectedDate}T${time24}:00`;
    const appt = await dbInsert('appointments', {
      patient_id: patientRecord.id,
      patient_name: currentUser.full_name,
      service: selectedService.name,
      appointment_time: apptTime,
      duration_min: selectedService.duration,
      status: 'scheduled',
      notes: `[PENDING PAYMENT] ${selectedService.name} · RM ${selectedService.price}`,
    });
    await auditLog('appointment.booked', appt.id, { service: selectedService.name, price: selectedService.price });

    localStorage.setItem('isw_pending_payment', JSON.stringify({
      type: 'appointment',
      id: appt.id,
      title: selectedService.name,
      date: formatDate(apptTime),
      amount: selectedService.price,
      raw: appt,
    }));

    banner('Appointment ditempah! Redirect ke pembayaran...');
    setTimeout(() => { window.location.href = 'payment.html'; }, 1500);
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
    btn.disabled = false; btn.textContent = 'Confirm & Proceed to Payment →';
  }
}

async function loadAppointments() {
  if (!patientRecord) return;
  allAppts = await dbQuery('appointments', { eq: { patient_id: patientRecord.id }, order: { col: 'appointment_time' } });
  filterAppts('upcoming');
}

function filterAppts(filter) {
  const now = new Date();
  let filtered;
  if (filter === 'upcoming') filtered = allAppts.filter(a => a.status === 'scheduled' && new Date(a.appointment_time) >= now);
  else if (filter === 'past') filtered = allAppts.filter(a => a.status === 'completed' || new Date(a.appointment_time) < now);
  else filtered = allAppts.filter(a => a.status === 'cancelled');

  ['upcoming','past','cancelled'].forEach(t => {
    const btn = document.getElementById('tab-' + t);
    btn.className = t === filter
      ? 'px-4 py-2 rounded-full bg-navy text-white text-sm font-semibold whitespace-nowrap'
      : 'px-4 py-2 rounded-full bg-white border border-ink/20 text-sm whitespace-nowrap';
  });

  document.getElementById('appts-list').innerHTML = filtered.length
    ? filtered.map(a => {
        const isPending = a.notes?.includes('[PENDING PAYMENT]');
        return `<div class="bg-white rounded-xl border border-ink/10 p-4 md:p-5">
          <div class="flex items-start gap-3 md:gap-4 flex-wrap">
            <div class="text-center min-w-[60px]">
              <div class="text-xs text-navy">${new Date(a.appointment_time).toLocaleDateString('en-GB',{weekday:'short'}).toUpperCase()}</div>
              <div class="text-2xl font-bold text-navy">${new Date(a.appointment_time).getDate()}</div>
              <div class="text-xs text-navy">${new Date(a.appointment_time).toLocaleDateString('en-GB',{month:'short'}).toUpperCase()}</div>
            </div>
            <div class="flex-1 min-w-[180px]">
              <div class="font-semibold">${a.service}</div>
              <div class="text-sm text-ink/70 mt-1">${a.staff_name || 'TBA'}</div>
              <div class="text-xs text-ink/60 mt-1">${formatTime(a.appointment_time)} ${a.room ? '· ' + a.room : ''}</div>
            </div>
            <div class="flex flex-col gap-1 items-end">
              <span class="chip ${a.status === 'completed' ? 'bg-green-light text-green-dark' : a.status === 'cancelled' ? 'bg-terracotta/20 text-terracotta' : 'bg-navy-light text-navy'}">${a.status}</span>
              ${isPending ? '<a href="payment.html" class="chip bg-gold text-white">💳 Bayar</a>' : ''}
            </div>
          </div>
        </div>`;
      }).join('')
    : `<div class="bg-white rounded-xl border border-ink/10 p-8 text-center text-ink/60 text-sm">Tiada appointment ${filter}</div>`;
}

(async () => {
  const user = await initPatient('appointments', 'Pilih service, tarikh & masa');
  if (!user) return;
  renderServices();
  renderDates();
  renderTimes();
  loadAppointments();
})();
</script>
</body>
</html>
