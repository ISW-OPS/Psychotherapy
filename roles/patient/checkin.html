<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Daily Check-in</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">✅</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div id="content" class="p-4 md:p-8 space-y-6">
        <!-- Today's check-in -->
        <div class="max-w-2xl mx-auto w-full bg-white rounded-2xl border border-ink/10 p-6 md:p-8">
          <div class="flex items-center justify-between mb-5 flex-wrap gap-2">
            <div>
              <h2 class="text-xl font-bold">Check-in Harian</h2>
              <p id="today-date" class="text-sm text-ink/60 mt-1"></p>
            </div>
            <span id="checkin-status" class="chip bg-gold/30 text-gold-dark">Belum check-in</span>
          </div>

          <!-- Mood -->
          <label class="block text-sm font-semibold mb-2">Perasaan hari ini</label>
          <p class="text-xs text-ink/60 mb-3">Tekan emoji yang paling sesuai (1 = sangat teruk · 10 = sangat baik)</p>
          <div id="mood-scale" class="flex justify-between gap-1 mb-5"></div>

          <!-- Energy -->
          <label class="block text-sm font-semibold mb-2">Tahap tenaga</label>
          <div class="flex items-center gap-3 mb-5">
            <input id="energy-slider" type="range" min="1" max="10" value="5" class="flex-1" oninput="document.getElementById('energy-val').textContent = this.value">
            <span id="energy-val" class="text-lg font-bold w-8 text-center">5</span>
          </div>

          <!-- Sleep -->
          <div class="grid grid-cols-2 gap-3 mb-5">
            <div>
              <label class="block text-xs font-semibold mb-1">Jam tidur malam</label>
              <input id="sleep-hours" type="number" step="0.5" min="0" max="24" placeholder="7.5" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1">Kualiti tidur</label>
              <select id="sleep-quality" class="w-full border border-ink/20 rounded-lg px-3 py-2 text-sm focus:border-navy outline-none">
                <option value="">—</option>
                <option value="9">Sangat nyenyak</option>
                <option value="7">Baik</option>
                <option value="5">Sederhana</option>
                <option value="3">Kurang nyenyak</option>
                <option value="1">Tak dapat tidur</option>
              </select>
            </div>
          </div>

          <!-- Symptoms -->
          <label class="block text-sm font-semibold mb-2">Simptom yang dirasai</label>
          <p class="text-xs text-ink/60 mb-3">Pilih semua yang berkenaan</p>
          <div id="symptoms-grid" class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-5"></div>

          <!-- Activities -->
          <label class="block text-sm font-semibold mb-2">Amalan dilakukan</label>
          <div id="activities-grid" class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-5"></div>

          <!-- Notes -->
          <label class="block text-sm font-semibold mb-2">Catatan (optional)</label>
          <textarea id="checkin-notes" rows="3" placeholder="Apa-apa yang nak kongsi hari ini..." class="w-full border border-ink/20 rounded-lg px-4 py-3 text-sm focus:border-navy outline-none"></textarea>

          <button onclick="submitCheckin()" class="w-full mt-5 bg-navy text-white py-3 rounded-lg font-semibold hover:bg-navy-dark">Simpan Check-in</button>
        </div>

        <!-- History -->
        <div class="max-w-2xl mx-auto w-full">
          <h3 class="font-bold text-lg mb-3">Sejarah Check-in · 7 Hari</h3>
          <div id="checkin-history" class="space-y-2"></div>
        </div>
      </div>
    </main>
  </div>

  <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-navy-dark text-white py-2 justify-around z-20">
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🏠</span>Home</a>
    <a href="checkin.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>✅</span>Check-in</a>
    <a href="plan.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>💊</span>Plan</a>
    <a href="shop.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🛒</span>Shop</a>
    <a href="profile.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>👤</span>Profile</a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const MOODS = [
  { score:1, emoji:'😭', label:'Sangat teruk' },
  { score:2, emoji:'😢', label:'Teruk' },
  { score:3, emoji:'😔', label:'Sedih' },
  { score:4, emoji:'😟', label:'Kurang sihat' },
  { score:5, emoji:'😐', label:'Biasa' },
  { score:6, emoji:'🙂', label:'OK' },
  { score:7, emoji:'😊', label:'Baik' },
  { score:8, emoji:'😁', label:'Gembira' },
  { score:9, emoji:'🤩', label:'Sangat baik' },
  { score:10, emoji:'🌟', label:'Cemerlang' },
];

const SYMPTOMS = [
  '😣 Sakit kepala', '🌀 Pening', '🤢 Loya', '🤕 Sakit perut',
  '😴 Letih / lemah', '😵 Susah fokus', '🥺 Cemas / risau', '😢 Murung',
  '🤯 Stress', '🍽️ Tiada selera', '💔 Sakit dada', '🌡️ Demam',
  '🥶 Sejuk badan', '🤧 Selsema', '🥱 Insomnia', '😤 Marah',
];

const ACTIVITIES = [
  '🧘 Zikir pagi', '🕌 Solat penuh', '🚶 Berjalan / bersenam', '🥗 Santapan Fitrah',
  '🍯 Ambil madu/ubat', '💧 Minum air cukup', '📖 Tadarus', '😊 Journaling',
  '👨‍👩‍👧 Masa dengan keluarga', '🫁 Breathing exercise', '🛌 Tidur awal',
];

let selectedMood = null;
let selectedSymptoms = new Set();
let selectedActivities = new Set();
let todayCheckin = null;

function renderMoodScale() {
  document.getElementById('mood-scale').innerHTML = MOODS.map(m => `
    <button type="button" onclick="selectMood(${m.score})" title="${m.label} (${m.score})"
      class="mood-btn flex-1 p-2 rounded-lg text-2xl hover:bg-cream ${selectedMood === m.score ? 'bg-green-light ring-2 ring-green' : 'bg-white border border-ink/10'}">
      ${m.emoji}
    </button>
  `).join('');
}

function selectMood(n) {
  selectedMood = n;
  renderMoodScale();
}

function renderSymptoms() {
  document.getElementById('symptoms-grid').innerHTML = SYMPTOMS.map(s => {
    const active = selectedSymptoms.has(s);
    return `<button type="button" onclick="toggleSymptom('${s}')"
      class="text-left text-xs p-2 rounded-lg border-2 ${active ? 'border-terracotta bg-terracotta-light' : 'border-ink/10 bg-white hover:border-terracotta'}">${s}</button>`;
  }).join('');
}

function toggleSymptom(s) {
  if (selectedSymptoms.has(s)) selectedSymptoms.delete(s);
  else selectedSymptoms.add(s);
  renderSymptoms();
}

function renderActivities() {
  document.getElementById('activities-grid').innerHTML = ACTIVITIES.map(a => {
    const active = selectedActivities.has(a);
    return `<button type="button" onclick="toggleActivity('${a}')"
      class="text-left text-xs p-2 rounded-lg border-2 ${active ? 'border-green bg-green-light' : 'border-ink/10 bg-white hover:border-green'}">${a}</button>`;
  }).join('');
}

function toggleActivity(a) {
  if (selectedActivities.has(a)) selectedActivities.delete(a);
  else selectedActivities.add(a);
  renderActivities();
}

async function submitCheckin() {
  if (!patientRecord) { banner('Akaun pesakit belum aktif', 'error'); return; }
  if (!selectedMood) { banner('Sila pilih mood hari ini', 'error'); return; }

  const today = new Date().toISOString().split('T')[0];
  const data = {
    patient_id: patientRecord.id,
    checkin_date: today,
    mood_score: selectedMood,
    energy_score: parseInt(document.getElementById('energy-slider').value),
    sleep_hours: parseFloat(document.getElementById('sleep-hours').value) || null,
    sleep_quality: parseInt(document.getElementById('sleep-quality').value) || null,
    symptoms: Array.from(selectedSymptoms),
    activities: Array.from(selectedActivities),
    notes: document.getElementById('checkin-notes').value.trim(),
  };

  try {
    if (todayCheckin) {
      await dbUpdate('daily_checkins', todayCheckin.id, data);
      banner('Check-in dikemaskini');
    } else {
      await dbInsert('daily_checkins', data);
      banner('Check-in disimpan. Syabas! 🌟');
    }
    await loadCheckinData();
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  }
}

async function loadCheckinData() {
  const today = new Date().toISOString().split('T')[0];
  const all = await dbQuery('daily_checkins', { eq: { patient_id: patientRecord.id }, order: { col: 'checkin_date' }, limit: 30 });

  todayCheckin = all.find(c => c.checkin_date === today);

  if (todayCheckin) {
    document.getElementById('checkin-status').textContent = '✓ Sudah check-in hari ini';
    document.getElementById('checkin-status').className = 'chip bg-green-light text-green-dark';
    selectedMood = todayCheckin.mood_score;
    selectedSymptoms = new Set(todayCheckin.symptoms || []);
    selectedActivities = new Set(todayCheckin.activities || []);
    document.getElementById('energy-slider').value = todayCheckin.energy_score || 5;
    document.getElementById('energy-val').textContent = todayCheckin.energy_score || 5;
    document.getElementById('sleep-hours').value = todayCheckin.sleep_hours || '';
    document.getElementById('sleep-quality').value = todayCheckin.sleep_quality || '';
    document.getElementById('checkin-notes').value = todayCheckin.notes || '';
  }
  renderMoodScale();
  renderSymptoms();
  renderActivities();

  const recent = all.slice(0, 7);
  document.getElementById('checkin-history').innerHTML = recent.length
    ? recent.map(c => {
        const mood = MOODS.find(m => m.score === c.mood_score);
        return `<div class="bg-white rounded-xl border border-ink/10 p-4">
          <div class="flex items-center gap-3 flex-wrap">
            <div class="text-3xl">${mood?.emoji || '❓'}</div>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-semibold">${new Date(c.checkin_date).toLocaleDateString('ms-MY', { weekday:'long', day:'2-digit', month:'short' })}</div>
              <div class="text-xs text-ink/60">Mood ${c.mood_score}/10 · Energy ${c.energy_score || '—'}/10 ${c.sleep_hours ? '· Tidur ' + c.sleep_hours + 'j' : ''}</div>
            </div>
          </div>
          ${(c.symptoms?.length || 0) > 0 ? `<div class="mt-2 flex flex-wrap gap-1">${c.symptoms.map(s => `<span class="chip bg-terracotta-light text-terracotta">${s}</span>`).join('')}</div>` : ''}
          ${c.notes ? `<div class="text-xs text-ink/70 mt-2 italic">"${c.notes}"</div>` : ''}
        </div>`;
      }).join('')
    : '<div class="bg-white rounded-xl border border-ink/10 p-8 text-center text-ink/60 text-sm">Tiada sejarah check-in</div>';
}

(async () => {
  const user = await initPatient('checkin', 'Self-report mood, simptom & amalan harian');
  if (!user) return;

  document.getElementById('today-date').textContent = new Date().toLocaleDateString('ms-MY', {
    weekday:'long', day:'2-digit', month:'long', year:'numeric'
  });

  if (!patientRecord) {
    banner('Akaun pesakit belum aktif', 'error');
    return;
  }

  await loadCheckinData();
})();
</script>
</body>
</html>
