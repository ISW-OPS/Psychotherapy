<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — Catatan Harian (Flow Mobile)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#e7eaef; font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  /* Phone frame */
  .phone { width:390px; height:800px; background:#000; border-radius:46px; padding:12px;
    box-shadow:0 30px 70px rgba(0,0,0,.35); position:relative; }
  .phone .screen { width:100%; height:100%; border-radius:36px; overflow:hidden; position:relative; background:#0f2942; }
  .phone .notch { position:absolute; top:12px; left:50%; transform:translateX(-50%); width:130px; height:26px;
    background:#000; border-radius:0 0 16px 16px; z-index:80; }

  /* ===== Flow styles (copy dari kepatuhan.html) ===== */
  #kep-flow { position:absolute; inset:0; z-index:50; display:flex; flex-direction:column;
    background:linear-gradient(165deg,#1f4368 0%,#0f2942 100%); color:#fff; }
  .kf-head { display:flex; align-items:center; justify-content:space-between; padding:30px 16px 6px; }
  .kf-close { width:34px; height:34px; border:0; background:rgba(255,255,255,.12); color:#fff; border-radius:10px; font-size:22px; line-height:1; }
  .kf-count { font-size:13px; font-weight:700; opacity:.8; letter-spacing:.04em; }
  .kf-barwrap { height:6px; margin:6px 16px 0; background:rgba(255,255,255,.14); border-radius:999px; overflow:hidden; }
  .kf-bar-fill { height:100%; width:0; background:#d4af37; border-radius:999px; transition:width .35s ease; }
  .kf-stage { flex:1; position:relative; overflow:hidden; }
  .kf-card { position:absolute; inset:0; display:flex; flex-direction:column; padding:18px 18px 0;
    transition:transform .22s ease, opacity .22s ease; }
  .kf-card.kf-out-left{transform:translateX(-30px);opacity:0}.kf-card.kf-out-right{transform:translateX(30px);opacity:0}
  .kf-card.kf-pre-right{transform:translateX(30px);opacity:0}.kf-card.kf-pre-left{transform:translateX(-30px);opacity:0}
  .kf-card.kf-in{transform:translateX(0);opacity:1}
  .kf-body { flex:1; overflow-y:auto; padding-bottom:8px; }
  .kf-step-emoji { font-size:46px; text-align:center; margin:8px 0 4px; }
  .kf-q h3 { font-size:21px; font-weight:800; line-height:1.3; margin:0 0 4px; text-align:center; }
  .kf-q .kf-nota { font-size:12.5px; opacity:.7; text-align:center; margin:0 0 14px; white-space:pre-line; }
  .kf-hint { font-size:12px; opacity:.65; text-align:center; margin:0 0 14px; }
  .kf-kicker { text-align:center; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#f4d97b; opacity:.9; margin-bottom:2px; }
  .kf-chips.kf-chips-lg { justify-content:center; gap:10px; margin-top:8px; }
  .kf-chips-lg .kf-chip { font-size:14px; padding:12px 18px; }
  .kf-opts { display:flex; flex-direction:column; gap:11px; margin-top:6px; }
  .kf-opt { width:100%; text-align:left; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.14);
    border-radius:16px; padding:16px 18px; color:#fff; font-size:15px; font-weight:600;
    display:flex; align-items:center; gap:10px; }
  .kf-opt.sel { background:#d4af37; color:#1a3a5c; border-color:#d4af37; }
  .kf-pts { margin-left:auto; font-size:12px; font-weight:800; opacity:.75; }
  .kf-opt-wrap { display:flex; flex-direction:column; gap:6px; }
  .kf-group { margin-bottom:12px; }
  .kf-group-t { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; opacity:.55; margin-bottom:7px; }
  .kf-chips { display:flex; flex-wrap:wrap; gap:8px; }
  .kf-chip { background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.16); color:#fff;
    border-radius:999px; padding:9px 14px; font-size:13px; font-weight:600; }
  .kf-chip.sel { background:#d4af37; color:#1a3a5c; border-color:#d4af37; }
  .kf-other { width:100%; margin-top:8px; background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.16);
    border-radius:12px; padding:11px 14px; color:#fff; font-size:14px; box-sizing:border-box; }
  .kf-other::placeholder { color:rgba(255,255,255,.45); }
  .kf-time-row { display:flex; gap:14px; justify-content:center; margin-top:10px; }
  .kf-time-row label { display:flex; flex-direction:column; gap:6px; font-size:12px; opacity:.8; align-items:center; }
  .kf-time-row input { background:rgba(255,255,255,.1); border:1.5px solid rgba(255,255,255,.2); color:#fff; border-radius:12px; padding:12px; font-size:16px; }
  .kf-sleep-calc { text-align:center; opacity:.7; font-size:13px; margin-top:12px; min-height:18px; }
  .kf-center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px; }
  .kf-center .kf-emoji { font-size:64px; }
  .kf-center h2 { font-size:26px; font-weight:800; margin:6px 0 2px; }
  .kf-center p { opacity:.8; font-size:14px; margin:0; }
  .kf-sub { font-size:12.5px !important; opacity:.6 !important; margin-top:8px !important; }
  .kf-streak { background:rgba(212,175,55,.18); border:1px solid rgba(212,175,55,.4); color:#f4d97b; padding:7px 16px; border-radius:999px; font-weight:700; font-size:14px; margin-top:8px; }
  .kf-streak-big { background:rgba(212,175,55,.18); border:1px solid rgba(212,175,55,.4); color:#f4d97b; padding:9px 20px; border-radius:999px; font-weight:800; font-size:16px; margin-top:14px; }
  .kf-ringbox { position:relative; width:150px; height:150px; margin:8px 0; }
  .kf-ring-svg { width:150px; height:150px; }
  #kf-ring-fg { transition:stroke-dasharray .9s cubic-bezier(.34,1.2,.64,1); }
  .kf-ring-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800; }
  .kf-grade { font-size:16px; font-weight:800; }
  .kf-foot { display:flex; gap:10px; align-items:center; padding:12px 0 18px; }
  .kf-foot-center { justify-content:center; }
  .kf-back { background:transparent; border:0; color:rgba(255,255,255,.7); font-size:14px; font-weight:600; padding:14px 8px; }
  .kf-next { flex:1; background:#d4af37; color:#1a3a5c; border:0; border-radius:14px; padding:16px; font-size:16px; font-weight:800; }
  .kf-finish { flex:none; width:100%; }
  .kf-confetti { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:55; }
  .kf-confetti span { position:absolute; top:-24px; animation:kffall linear forwards; }
  @keyframes kffall { to { transform:translateY(900px) rotate(720deg); opacity:.25; } }
  .caption { position:absolute; bottom:-2px; left:0; right:0; text-align:center; color:#1a3a5c; font-size:11px; font-weight:700; opacity:.5; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div id="kep-flow">
      <div class="kf-head">
        <button class="kf-close">&times;</button>
        <span id="kf-count" class="kf-count"></span>
        <span style="width:34px"></span>
      </div>
      <div class="kf-barwrap"><div id="kf-bar-fill" class="kf-bar-fill"></div></div>
      <div class="kf-stage"><div id="kf-card" class="kf-card kf-in"></div></div>
    </div>
  </div>
</div>

<script>
// ===== Mock backing (ganti Supabase) =====
const ICONS = { madu_lth_ib:'🍯', berjemur:'☀️', yogurt:'🥛', zikir_bersanad:'📿' };
const today = '2026-06-12';
let selectedDate = today;
window.__firstName = 'Aisyah';
window.__kfLogDates = new Set(['2026-06-06','2026-06-07','2026-06-08','2026-06-09','2026-06-10','2026-06-11']);
function escAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }
function addDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function isEditable(){ return true; }
function banner(m){ console.log(m); }
function sleepHours(t1,t2){ if(!t1||!t2)return null; const[a,b]=t1.split(':').map(Number),[c,e]=t2.split(':').map(Number);
  let m=(c*60+e)-(a*60+b); if(m<=0)m+=1440; return Math.round(m/60*10)/10; }
function vibrate(){}
function toggleArr(arr,v){ const i=arr.indexOf(v); if(i>=0)arr.splice(i,1); else arr.push(v); }
async function saveChecklist(){ /* mock */ }

const EMOSI = [
  { domain:'Mood Positif', items:['Gembira','Tenang','Bersyukur','Bersemangat','Bermotivasi','Biasa sahaja'] },
  { domain:'Kesedihan / Kemurungan', items:['Sedih','Kecewa','Murung','Kesunyian'] },
  { domain:'Kebimbangan', items:['Risau','Cemas','Gelisah','Takut','Tertekan'] },
  { domain:'Keletihan Emosi', items:['Letih emosi','Burnout','Hilang fokus','Rendah diri'] },
];
const REAKSI = [
  { group:'Pencernaan', items:['Kembung','Banyak angin','Sembelit','Cirit-birit'] },
  { group:'Otot & Saraf', items:['Kejang','Kebas','Sakit badan','Sakit sendi'] },
  { group:'Detoksifikasi', items:['Jerawat keluar','Gatal-gatal','Badan panas'] },
  { group:'Lain-lain', items:['Tiada simptom'] },
];
const AKTIVITI = [
  'Saya dapat menjalankan aktiviti harian seperti biasa',
  'Saya dapat menjalankan aktiviti tetapi perlu lebih banyak rehat',
  'Saya menghadapi kesukaran menjalankan sebahagian aktiviti',
  'Saya banyak berehat dan tidak mampu lakukan kebanyakan aktiviti',
];

const ITEMS = [
  { item_key:'madu_lth_ib', label:'Ambil madu hari ini?', berskor:true, jenis_input:'pilih_satu', meta:{icon:'🍯'}, nota:'2 sudu setiap pagi · sebelum sarapan',
    options:[{value:'2',label:'Ya, 2 sudu',mata:2},{value:'1',label:'Ya, 1 sudu',mata:1},{value:'0',label:'Tidak ambil',mata:0}] },
  { item_key:'berjemur', label:'Berjemur pagi ini?', berskor:true, jenis_input:'pilih_satu', meta:{icon:'☀️'}, nota:'Sekurang-kurangnya 15 minit',
    options:[{value:'gt15',label:'Ya, lebih 15 minit',mata:2},{value:'lt15',label:'Ya, kurang 15 minit',mata:1},{value:'no',label:'Tidak',mata:0}] },
  { item_key:'yogurt', label:'Minum yogurt hari ini?', berskor:true, jenis_input:'pilih_satu', meta:{icon:'🥛'},
    options:[{value:'ya',label:'Ya',mata:2},{value:'tidak',label:'Tidak',mata:0}] },
  { item_key:'zikir_bersanad', label:'Amalan zikir bersanad?', berskor:true, jenis_input:'pilih_satu', meta:{icon:'📿'},
    options:[{value:'ya',label:'Ya, lengkap',mata:2},{value:'sebahagian',label:'Sebahagian',mata:1},{value:'tidak',label:'Tidak',mata:0}] },
];

// Prefill supaya skrin nampak realistik (Gred B ~63%)
let answers = { madu_lth_ib:'2', berjemur:'gt15', yogurt:'tidak', zikir_bersanad:'sebahagian' };
let answersText = {};
let healthData = { emotions:['Tenang','Bersyukur'], emotionOther:'', reaksi:['Tiada simptom'], reaksiOther:'',
  tidur:'23:30', bangun:'06:15', aktiviti:AKTIVITI[0] };

function computeSkor(){
  let earned=0,max=0;
  ITEMS.forEach(it=>{ if(!it.berskor)return; max+=2; const v=answers[it.item_key]; if(v==null)return;
    const o=(it.options||[]).find(x=>x.value===v); if(o&&typeof o.mata==='number')earned+=o.mata; });
  return max>0?Math.round((earned/max)*100):null;
}

// ===== Flow (copy dari kepatuhan.html) =====
let kfSteps=[], kfIdx=0, kfBusy=false;
function computeStreakBase(){ const set=window.__kfLogDates||new Set(); let s=0,d=addDays(today,-1);
  while(set.has(d)){s++;d=addDays(d,-1);} if(set.has(today))s++; return s; }
function kfGrade(skor){ if(skor==null)return null; const cls=skor>=85?'A':skor>=50?'B':'C';
  const m={A:{l:'Cemerlang',c:'#22c55e'},B:{l:'Sederhana',c:'#d4af37'},C:{l:'Perlu usaha',c:'#f87171'}}[cls]; return {cls,...m}; }
function kfBuildSteps(){ const s=[{type:'intro'}];
  EMOSI.forEach((g,i)=>s.push({type:'emogroup',g,last:i===EMOSI.length-1}));
  REAKSI.forEach((g,i)=>s.push({type:'reaksigroup',g,last:i===REAKSI.length-1}));
  s.push({type:'tidur'},{type:'aktiviti'});
  ITEMS.forEach(it=>s.push({type:'item',it})); s.push({type:'final'}); return s; }
function kfFooter(){ return `<div class="kf-foot"><button class="kf-back" ${kfIdx===0?'disabled':''}>‹ Kembali</button><button class="kf-next" onclick="kfNext()">Seterusnya →</button></div>`; }
const EMO_EMOJI={'Mood Positif':'😊','Kesedihan / Kemurungan':'😔','Kebimbangan':'😰','Keletihan Emosi':'😮‍💨'};
const REAKSI_EMOJI={'Pencernaan':'🦠','Otot & Saraf':'💪','Detoksifikasi':'✨','Lain-lain':'📋'};
function kfGroupChips(items,attr,selArr){ return `<div class="kf-chips kf-chips-lg">${items.map(it=>`<button class="kf-chip ${selArr.includes(it)?'sel':''}" data-${attr}="${escAttr(it)}">${it}</button>`).join('')}</div>`; }
function kfStepHtml(step){
  if(step.type==='intro'){ const streak=computeStreakBase(); const d=new Date(selectedDate+'T00:00:00');
    const dl=d.toLocaleDateString('ms-MY',{weekday:'long',day:'numeric',month:'long'});
    return `<div class="kf-body"><div class="kf-center"><div class="kf-emoji">📝</div><h2>Catatan Harian</h2><p>${dl}</p>${streak>0?`<div class="kf-streak">🔥 ${streak} hari berturut</div>`:''}<p class="kf-sub">${kfSteps.length-2} soalan ringkas • jujur itu penting 🌿</p></div></div><div class="kf-foot kf-foot-center"><button class="kf-next" onclick="kfNext()">Mula →</button></div>`; }
  if(step.type==='emogroup'){ const g=step.g; const other=step.last?`<div style="margin-top:18px"><div class="kf-group-t" style="text-align:center">Perasaan lain</div><input class="kf-other" data-kfhother="emo" placeholder="Nyatakan…" value="${escAttr(healthData.emotionOther)}"></div>`:'';
    return `<div class="kf-body kf-q"><div class="kf-step-emoji">${EMO_EMOJI[g.domain]||'💚'}</div><div class="kf-kicker">Perasaan hari ini</div><h3>${g.domain}</h3><p class="kf-hint">Pilih yang berkaitan · boleh skip</p>${kfGroupChips(g.items,'kfemo',healthData.emotions)}${other}</div>${kfFooter()}`; }
  if(step.type==='reaksigroup'){ const g=step.g; const other=step.last?`<div style="margin-top:18px"><div class="kf-group-t" style="text-align:center">Reaksi lain</div><input class="kf-other" data-kfhother="reaksi" placeholder="Nyatakan…" value="${escAttr(healthData.reaksiOther)}"></div>`:'';
    return `<div class="kf-body kf-q"><div class="kf-step-emoji">${REAKSI_EMOJI[g.group]||'💜'}</div><div class="kf-kicker">Reaksi pemulihan</div><h3>${g.group}</h3><p class="kf-hint">Pilih yang berkaitan · boleh skip</p>${kfGroupChips(g.items,'kfreaksi',healthData.reaksi)}${other}</div>${kfFooter()}`; }
  if(step.type==='tidur'){ const h=sleepHours(healthData.tidur,healthData.bangun);
    return `<div class="kf-body kf-q"><div class="kf-step-emoji">🌙</div><h3>Tidur anda</h3><p class="kf-hint">Bila tidur & bangun semalam?</p><div class="kf-time-row"><label>Tidur pukul<input type="time" data-kfsleep="tidur" value="${healthData.tidur}"></label><label>Bangun pukul<input type="time" data-kfsleep="bangun" value="${healthData.bangun}"></label></div><div class="kf-sleep-calc" id="kf-sleep-calc">${h!=null?'≈ '+h+' jam':''}</div></div>${kfFooter()}`; }
  if(step.type==='aktiviti'){ const opts=AKTIVITI.map(a=>`<button class="kf-opt ${healthData.aktiviti===a?'sel':''}" data-kfakt="${escAttr(a)}">${a}</button>`).join('');
    return `<div class="kf-body kf-q"><div class="kf-step-emoji">🏃</div><h3>Tahap aktiviti harian?</h3><p class="kf-hint">Pilih satu</p><div class="kf-opts">${opts}</div></div>${kfFooter()}`; }
  if(step.type==='item'){ const it=step.it; const icon=it.meta?.icon||ICONS[it.item_key]||'📋'; const sel=answers[it.item_key];
    const head=`<div class="kf-step-emoji">${icon}</div><h3>${it.label}${it.berskor?'':' <span style="font-size:12px;opacity:.6;font-weight:600">(tracking)</span>'}</h3>${it.nota?`<p class="kf-nota">${it.nota.replace(/ · /g,'\n')}</p>`:'<p class="kf-hint"></p>'}`;
    let body;
    if(it.jenis_input==='pilih_banyak'){ const arr=Array.isArray(sel)?sel:[];
      body=`<div class="kf-chips">${(it.options||[]).map(o=>`<button class="kf-chip ${arr.includes(o.value)?'sel':''}" data-kfmulti="${it.item_key}" data-kfval="${escAttr(o.value)}">${o.label}</button>`).join('')}</div><input class="kf-other" data-kfotherinput="${it.item_key}" placeholder="Lain-lain…" value="${escAttr(answersText[it.item_key]||'')}">`;
    } else {
      body=`<div class="kf-opts">${(it.options||[]).map(o=>{ const isSel=sel===o.value; const pts=(it.berskor&&o.mata>0)?`<span class="kf-pts">+${o.mata}</span>`:'';
        if(o.value==='other')return `<div class="kf-opt-wrap"><button class="kf-opt ${isSel?'sel':''}" data-kfitem="${it.item_key}" data-kfval="other">Lain-lain ${pts}</button><input class="kf-other" data-kfotherinput="${it.item_key}" placeholder="Nyatakan" value="${escAttr(answersText[it.item_key]||'')}"></div>`;
        return `<button class="kf-opt ${isSel?'sel':''}" data-kfitem="${it.item_key}" data-kfval="${escAttr(o.value)}">${o.label}${pts}</button>`; }).join('')}</div>`;
    }
    return `<div class="kf-body kf-q">${head}${body}</div>${kfFooter()}`; }
  if(step.type==='final'){ const skor=computeSkor(),g=kfGrade(skor);
    const streak=computeStreakBase()+(window.__kfLogDates?.has(today)?0:1); const name=window.__firstName||'';
    const ring=g?`<div class="kf-ringbox"><svg class="kf-ring-svg" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="12"/><circle id="kf-ring-fg" cx="60" cy="60" r="52" fill="none" stroke="${g.c}" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 60 60)"/></svg><div class="kf-ring-num">${skor}%</div></div><div class="kf-grade" style="color:${g.c}">Gred ${g.cls} — ${g.l}</div>`:`<div class="kf-emoji">✅</div><p>Catatan hari ini lengkap</p>`;
    return `<div class="kf-confetti" id="kf-confetti"></div><div class="kf-body"><div class="kf-center"><div class="kf-emoji">🎉</div><h2>Syabas${name?', '+name:''}!</h2>${ring}<div class="kf-streak-big">🔥 ${streak} hari berturut</div></div></div><div class="kf-foot"><button class="kf-finish kf-next">Selesai ✓</button></div>`; }
  return '';
}
function kfRender(idx,dir,first){
  const total=kfSteps.length-2; const step=kfSteps[idx];
  const showCount=step.type!=='intro'&&step.type!=='final';
  document.getElementById('kf-count').textContent=showCount?`${idx}/${total}`:'';
  document.getElementById('kf-bar-fill').style.width=(idx/(kfSteps.length-1)*100)+'%';
  const html=kfStepHtml(step); const card=document.getElementById('kf-card');
  if(first){ card.className='kf-card kf-in'; card.innerHTML=html; }
  else { card.classList.remove('kf-in'); card.classList.add(dir>0?'kf-out-left':'kf-out-right');
    setTimeout(()=>{ card.innerHTML=html; card.classList.remove('kf-out-left','kf-out-right'); card.classList.add(dir>0?'kf-pre-right':'kf-pre-left');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ card.classList.remove('kf-pre-right','kf-pre-left'); card.classList.add('kf-in'); })); },170); }
  if(step.type==='final') setTimeout(()=>{ kfConfetti(); kfAnimateRing(); },first?80:240);
}
function kfAnimateRing(){ const skor=computeSkor(); const fg=document.getElementById('kf-ring-fg'); if(fg&&skor!=null) requestAnimationFrame(()=>fg.setAttribute('stroke-dasharray',`${skor} ${100-skor}`)); }
function kfNext(){ if(kfBusy)return; const step=kfSteps[kfIdx];
  if(step.type==='item'&&step.it.berskor){ const v=answers[step.it.item_key]; if(v==null||v===''){ banner('Sila pilih jawapan'); return; } }
  if(kfIdx<kfSteps.length-1){ kfBusy=true; kfIdx++; kfRender(kfIdx,1); setTimeout(()=>kfBusy=false,230); } }
function kfPrev(){ if(kfBusy||kfIdx===0)return; kfBusy=true; kfIdx--; kfRender(kfIdx,-1); setTimeout(()=>kfBusy=false,230); }
function kfMarkSel(el,group){ document.querySelectorAll(`#kf-card [${group}]`).forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); }
function kfPointPop(el,text){ const r=el.getBoundingClientRect(); const s=document.createElement('div');
  s.className='kf-pop'; s.textContent=text; s.style.cssText=`position:fixed;z-index:60;font-weight:800;color:#f4d97b;font-size:30px;left:${r.right-40}px;top:${r.top-6}px;animation:kfpop .85s ease forwards`;
  document.body.appendChild(s); setTimeout(()=>s.remove(),900); }
function kfPickSingle(key,val,el){ const it=ITEMS.find(i=>i.item_key===key);
  if(val==='other'){ answers[key]='other'; kfMarkSel(el,'data-kfitem'); return; }
  answers[key]=val; kfMarkSel(el,'data-kfitem'); const o=(it.options||[]).find(x=>x.value===val);
  if(o&&o.mata>0)kfPointPop(el,'+'+o.mata); setTimeout(kfNext,380); }
function kfConfetti(){ const host=document.getElementById('kf-confetti'); if(!host)return; const emo=['🎉','✨','🌿','⭐','💚','🍯','🎊'];
  for(let i=0;i<30;i++){ const s=document.createElement('span'); s.textContent=emo[i%emo.length]; s.style.left=(Math.random()*100)+'%';
    s.style.animationDuration=(1.6+Math.random()*1.5)+'s'; s.style.animationDelay=(Math.random()*0.35)+'s'; s.style.fontSize=(14+Math.random()*18)+'px'; host.appendChild(s); }
  setTimeout(()=>{host.innerHTML='';},3400); }
const _style=document.createElement('style'); _style.textContent='@keyframes kfpop{0%{transform:translateY(0) scale(.5);opacity:0}25%{opacity:1;transform:translateY(-14px) scale(1.15)}100%{transform:translateY(-64px) scale(1);opacity:0}}'; document.head.appendChild(_style);

// Delegation
const flow=document.getElementById('kep-flow');
flow.addEventListener('click',(e)=>{
  if(e.target.closest('.kf-back')){ kfPrev(); return; }
  if(e.target.closest('.kf-close')){ location.href='dashboard.html'; return; }
  if(e.target.closest('.kf-finish')){ banner('Selesai (mock)'); return; }
  const emo=e.target.closest('[data-kfemo]'); if(emo){ toggleArr(healthData.emotions,emo.dataset.kfemo); emo.classList.toggle('sel'); return; }
  const rk=e.target.closest('[data-kfreaksi]'); if(rk){ toggleArr(healthData.reaksi,rk.dataset.kfreaksi); rk.classList.toggle('sel'); return; }
  const ak=e.target.closest('[data-kfakt]'); if(ak){ healthData.aktiviti=ak.dataset.kfakt; kfMarkSel(ak,'data-kfakt'); setTimeout(kfNext,320); return; }
  const op=e.target.closest('[data-kfitem]'); if(op){ kfPickSingle(op.dataset.kfitem,op.dataset.kfval,op); return; }
  const mc=e.target.closest('[data-kfmulti]'); if(mc){ const key=mc.dataset.kfmulti; const arr=Array.isArray(answers[key])?answers[key]:(answers[key]=[]); toggleArr(arr,mc.dataset.kfval); mc.classList.toggle('sel'); return; }
});
flow.addEventListener('input',(e)=>{
  const sl=e.target.closest('[data-kfsleep]'); if(sl){ if(sl.dataset.kfsleep==='tidur')healthData.tidur=sl.value; else healthData.bangun=sl.value;
    const c=document.getElementById('kf-sleep-calc'); if(c){const h=sleepHours(healthData.tidur,healthData.bangun); c.textContent=h!=null?'≈ '+h+' jam':'';} return; }
  const ho=e.target.closest('[data-kfhother]'); if(ho){ if(ho.dataset.kfhother==='emo')healthData.emotionOther=ho.value; else healthData.reaksiOther=ho.value; return; }
});

// Start — boleh lompat ke mana-mana step guna ?step=N
kfSteps=kfBuildSteps();
const qp=new URLSearchParams(location.search);
kfIdx=Math.max(0,Math.min(kfSteps.length-1, parseInt(qp.get('step'))||0));
kfRender(kfIdx,1,true);
</script>
