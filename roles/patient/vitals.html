<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Bacaan Saya</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📉</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">

        <!-- Header -->
        <div class="flex items-start justify-between gap-3 flex-wrap">
          <div>
            <h1 class="text-2xl font-bold text-ink">Bacaan Saya</h1>
            <p class="text-sm text-ink/55 mt-0.5">Vitals & ukuran kesihatan anda — direkod oleh staf atau anda sendiri.</p>
          </div>
          <button onclick="openSelfModal()" class="bg-navy text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-navy-dark inline-flex items-center gap-1.5">
            + Catat Bacaan Sendiri
          </button>
        </div>

        <!-- Latest summary cards -->
        <div id="latest-cards" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>

        <!-- Sejarah penuh -->
        <div class="bg-white rounded-2xl border border-ink/10 overflow-hidden">
          <div class="px-5 py-4 border-b border-ink/8 flex items-center justify-between">
            <h3 class="font-bold text-base">📋 Sejarah Bacaan</h3>
            <select id="f-source" onchange="renderTable()" class="border border-ink/15 rounded-lg px-3 py-1.5 text-xs bg-white outline-none">
              <option value="">Semua</option>
              <option value="staff">Staf Klinik</option>
              <option value="patient_self">Rekod Sendiri</option>
            </select>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-cream/40 text-[10px] uppercase tracking-wide text-ink/50">
                <tr>
                  <th class="text-left py-3 px-4">Tarikh</th>
                  <th class="text-left py-3 px-3">BP (mmHg)</th>
                  <th class="text-left py-3 px-3">Nadi</th>
                  <th class="text-left py-3 px-3">Berat (kg)</th>
                  <th class="text-left py-3 px-3">BMI</th>
                  <th class="text-left py-3 px-3">HbA1c</th>
                  <th class="text-left py-3 px-3">Sumber</th>
                  <th class="text-left py-3 px-3">Minggu</th>
                </tr>
              </thead>
              <tbody id="vitals-body"></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- Self-record modal -->
<div id="self-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-bold text-lg">📝 Catat Bacaan Sendiri</h3>
      <button onclick="closeSelfModal()" class="text-ink/50 text-2xl leading-none">×</button>
    </div>
    <p class="text-xs text-ink/55 mb-4">Bacaan yang anda ambil sendiri di rumah (cth: BP, gula darah, berat).</p>
    <div class="space-y-3">
      <div>
        <label class="text-xs font-semibold text-ink/70">Tarikh bacaan</label>
        <input id="s-date" type="date" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-ink/70">BP Sistolik</label>
          <input id="s-sys" type="number" placeholder="120" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
        </div>
        <div>
          <label class="text-xs font-semibold text-ink/70">BP Diastolik</label>
          <input id="s-dia" type="number" placeholder="80" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-ink/70">Nadi (bpm)</label>
          <input id="s-hr" type="number" placeholder="72" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
        </div>
        <div>
          <label class="text-xs font-semibold text-ink/70">Berat (kg)</label>
          <input id="s-weight" type="number" step="0.1" placeholder="65" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-ink/70">Gula Darah (RBS)</label>
          <input id="s-rbs" type="number" step="0.1" placeholder="5.5" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
        </div>
        <div>
          <label class="text-xs font-semibold text-ink/70">HbA1c (%)</label>
          <input id="s-hba1c" type="number" step="0.01" placeholder="6.5" class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm">
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-ink/70">Nota (optional)</label>
        <textarea id="s-notes" rows="2" placeholder="Cth: Selepas senaman, dalam keadaan tenang..." class="w-full mt-1 px-3 py-2 border border-ink/15 rounded-lg text-sm"></textarea>
      </div>
      <p id="s-error" class="hidden text-xs text-terracotta"></p>
    </div>
    <div class="flex gap-2 mt-5">
      <button onclick="closeSelfModal()" class="flex-1 border border-ink/20 rounded-lg py-2.5 text-sm font-semibold">Batal</button>
      <button id="s-save-btn" onclick="saveSelfVitals()" class="flex-1 bg-navy text-white rounded-lg py-2.5 text-sm font-semibold">💾 Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>

let allVitals = [];

function escHtml(s) { const d = document.createElement('div'); d.textContent = String(s||''); return d.innerHTML; }

function bmiOf(weight, heightCm) {
  if (!weight || !heightCm) return null;
  const m = heightCm / 100;
  return (weight / (m * m)).toFixed(1);
}

function renderLatestCards() {
  const latest = allVitals[0] || {};
  const card = (label, value, sub, bg = 'bg-navy-light') => `
    <div class="bg-white rounded-2xl border border-ink/10 p-4">
      <div class="text-[10px] text-ink/55 font-semibold uppercase">${label}</div>
      <div class="text-2xl font-bold text-ink leading-none mt-1">${value || '—'}</div>
      <div class="text-[10px] text-ink/45 mt-1">${sub}</div>
    </div>`;

  const bp = latest.bp_systolic && latest.bp_diastolic ? `${latest.bp_systolic}/${latest.bp_diastolic}` : null;
  const wt = latest.weight ? `${latest.weight} kg` : null;
  const bmi = latest.bmi || bmiOf(latest.weight, latest.height) || null;
  const hba1c = latest.hba1c ? `${latest.hba1c}%` : null;

  document.getElementById('latest-cards').innerHTML = [
    card('Tekanan Darah (BP)', bp, 'mmHg'),
    card('Berat', wt, 'Kilogram'),
    card('BMI', bmi, 'kg/m²'),
    card('HbA1c', hba1c, 'Purata 3 bulan'),
  ].join('');
}

function renderTable() {
  const filter = document.getElementById('f-source').value;
  const list = filter ? allVitals.filter(v => v.source === filter) : allVitals;
  const body = document.getElementById('vitals-body');
  if (!list.length) {
    body.innerHTML = '<tr><td colspan="8" class="text-center py-12 text-ink/40 italic">Tiada bacaan direkod lagi.</td></tr>';
    return;
  }
  body.innerHTML = list.map(v => {
    const dt = new Date(v.reading_date || v.created_at);
    const dateStr = dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
    const bp = (v.bp_systolic && v.bp_diastolic) ? `${v.bp_systolic}/${v.bp_diastolic}` : '—';
    const source = v.source === 'patient_self'
      ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-navy-light text-navy font-semibold">Sendiri</span>'
      : '<span class="text-[10px] px-2 py-0.5 rounded-full bg-green-light text-green-dark font-semibold">Staf</span>';
    return `<tr class="border-b border-ink/5 hover:bg-cream/30">
      <td class="py-3 px-4 text-xs font-semibold">${dateStr}</td>
      <td class="py-3 px-3 text-xs">${bp}</td>
      <td class="py-3 px-3 text-xs">${v.heart_rate || '—'}</td>
      <td class="py-3 px-3 text-xs">${v.weight || '—'}</td>
      <td class="py-3 px-3 text-xs">${v.bmi || bmiOf(v.weight, v.height) || '—'}</td>
      <td class="py-3 px-3 text-xs">${v.hba1c ? v.hba1c + '%' : '—'}</td>
      <td class="py-3 px-3">${source}</td>
      <td class="py-3 px-3 text-xs">${v.week_number ? 'M' + v.week_number : '—'}</td>
    </tr>`;
  }).join('');
}

function openSelfModal() {
  document.getElementById('s-date').value = new Date().toISOString().slice(0, 10);
  ['s-sys','s-dia','s-hr','s-weight','s-rbs','s-hba1c','s-notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('s-error').classList.add('hidden');
  document.getElementById('self-modal').classList.remove('hidden');
}
function closeSelfModal() {
  document.getElementById('self-modal').classList.add('hidden');
}

async function saveSelfVitals() {
  const errEl = document.getElementById('s-error');
  errEl.classList.add('hidden');

  const sys = parseInt(document.getElementById('s-sys').value) || null;
  const dia = parseInt(document.getElementById('s-dia').value) || null;
  const hr  = parseInt(document.getElementById('s-hr').value) || null;
  const wt  = parseFloat(document.getElementById('s-weight').value) || null;
  const rbs = parseFloat(document.getElementById('s-rbs').value) || null;
  const hba1c = parseFloat(document.getElementById('s-hba1c').value) || null;
  const notes = document.getElementById('s-notes').value.trim() || null;
  const date = document.getElementById('s-date').value || new Date().toISOString().slice(0, 10);

  if (!sys && !dia && !hr && !wt && !rbs && !hba1c) {
    errEl.textContent = 'Sila isi sekurang-kurangnya satu bacaan';
    errEl.classList.remove('hidden');
    return;
  }

  const btn = document.getElementById('s-save-btn');
  btn.disabled = true; btn.textContent = 'Menyimpan...';

  try {
    const patientId = window.patientRecord?.id;
    if (!patientId) throw new Error('Rekod pesakit tidak ditemui');

    // Auto-tag plan + week kalau ada plan aktif
    let planId = null, weekNum = null;
    const { data: plans } = await window.db.from('psy_treatment_plans')
      .select('id, current_week').eq('patient_id', patientId).eq('status', 'active').limit(1);
    if (plans?.[0]) { planId = plans[0].id; weekNum = plans[0].current_week; }

    const { error } = await window.db.from('psy_vitals').insert({
      patient_id: patientId,
      plan_id: planId,
      week_number: weekNum,
      reading_date: date,
      source: 'patient_self',
      bp_systolic: sys, bp_diastolic: dia,
      heart_rate: hr, weight: wt,
      rbs, hba1c, notes,
      recorded_by: window.currentUser.id,
      recorded_by_name: window.currentUser.full_name,
    });
    if (error) throw error;

    banner('Bacaan disimpan ✅');
    closeSelfModal();
    await loadVitals();
  } catch (e) {
    errEl.textContent = 'Ralat: ' + e.message;
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = '💾 Simpan';
  }
}

async function loadVitals() {
  const patientId = window.patientRecord?.id;
  if (!patientId) {
    allVitals = [];
    renderLatestCards();
    renderTable();
    return;
  }
  const { data } = await window.db.from('psy_vitals')
    .select('*').eq('patient_id', patientId)
    .order('reading_date', { ascending: false, nullsFirst: false })
    .order('created_at', { ascending: false });
  allVitals = data || [];
  renderLatestCards();
  renderTable();
}

(async () => {
  const user = await initPatient('vitals', 'Bacaan vitals & ukuran kesihatan anda');
  if (!user) return;
  await loadVitals();
})();
</script>
</body>
</html>
