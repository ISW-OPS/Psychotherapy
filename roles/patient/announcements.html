<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Pengumuman</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#f7f8fa]">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📢</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <section class="p-4 md:p-8 space-y-5">
        <div id="cat-pills" class="flex items-center gap-2 flex-wrap"></div>
        <div id="ann-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div class="col-span-full text-center py-16 text-ink/40 text-sm">Memuatkan pengumuman...</div>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- Detail modal -->
<div id="ann-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/55" onclick="closeAnn()"></div>
  <div class="relative bg-white rounded-2xl max-w-xl w-full max-h-[90vh] flex flex-col overflow-hidden">
    <div id="ann-modal-banner" class="relative h-40 flex items-end p-4 shrink-0"></div>
    <button onclick="closeAnn()" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/30 text-white text-lg leading-none hover:bg-black/50">×</button>
    <div class="p-5 md:p-6 overflow-y-auto">
      <div id="ann-modal-meta" class="flex items-center gap-2 text-[11px] text-ink/45 mb-2"></div>
      <h2 id="ann-modal-title" class="text-lg md:text-xl font-extrabold text-ink leading-tight"></h2>
      <div id="ann-modal-body" class="text-[15px] text-ink/70 leading-relaxed mt-3 space-y-2"></div>
      <div id="ann-modal-cta" class="mt-5"></div>
    </div>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let allAnn = [];
let activeCat = '';

function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
function fmtDate(d) { return new Date(d).toLocaleDateString(LCALE(), { day: '2-digit', month: 'short', year: 'numeric' }); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function catOf(a) { return (a.category || a.tag || '').trim(); }

// Warna + gradient ikut kategori
function catMeta(cat) {
  const c = (cat || '').toLowerCase();
  if (/penting|urgent|amaran/.test(c))              return { badge:'bg-terracotta/10 text-terracotta', text:'text-terracotta', grad:'from-[#fdecea] via-[#fff5f4] to-[#fbe4e1]' };
  if (/program|kelas|acara|webinar|manzil/.test(c)) return { badge:'bg-purple-100 text-purple-700',     text:'text-purple-600', grad:'from-[#f1ecfb] via-[#f7f3fe] to-[#ece3fa]' };
  if (/sistem|kemaskini|aplikasi/.test(c))          return { badge:'bg-navy/10 text-navy',               text:'text-navy',       grad:'from-[#e8f0fb] via-[#f1f6fd] to-[#e1ebf8]' };
  if (/kesihatan|health|tidur/.test(c))             return { badge:'bg-teal/10 text-teal',               text:'text-teal',       grad:'from-[#e6f5f4] via-[#f1faf9] to-[#ddf0ee]' };
  if (/komuniti|community/.test(c))                 return { badge:'bg-green/10 text-green-dark',        text:'text-green-dark', grad:'from-[#eaf6ef] via-[#f2faf5] to-[#e4f1ea]' };
  if (/promo/.test(c))                              return { badge:'bg-orange-100 text-orange-700',      text:'text-orange-600', grad:'from-[#fdefe2] via-[#fff7f0] to-[#fbe7d4]' };
  return { badge:'bg-ink/8 text-ink/60', text:'text-ink/45', grad:'from-[#eef1f4] via-[#f5f7f9] to-[#e7ebef]' };
}

// Ikon SVG (garisan) ikut kategori
function iconSvg(cat, sizeCls = 'w-12 h-12') {
  const c = (cat || '').toLowerCase();
  const wrap = inner => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="${sizeCls}">${inner}</svg>`;
  if (/program|kelas|acara|webinar|manzil/.test(c)) return wrap('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>');
  if (/sistem|kemaskini|aplikasi/.test(c))          return wrap('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>');
  if (/kesihatan|health|tidur/.test(c))             return wrap('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>');
  if (/komuniti|community/.test(c))                 return wrap('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>');
  if (/promo/.test(c))                              return wrap('<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><path d="M7 7h.01"/>');
  if (/penting|urgent|amaran/.test(c))              return wrap('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/>');
  return wrap('<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>'); // megafon (default)
}

function gridCard(a) {
  const cat = catOf(a), m = catMeta(cat);
  const cover = a.image_url
    ? `<div class="h-32 bg-cover bg-center" style="background-image:url('${a.image_url}')"></div>`
    : `<div class="h-32 bg-gradient-to-br ${m.grad} flex items-center justify-center ${m.text}">${iconSvg(cat)}</div>`;
  return `<button onclick="openAnn('${a.id}')" class="text-left bg-white rounded-2xl border border-ink/8 shadow-sm overflow-hidden flex flex-col hover:shadow-md hover:-translate-y-0.5 transition-all duration-200">
    <div class="relative">
      ${cover}
      ${cat ? `<span class="absolute top-2.5 left-2.5 text-[9px] font-bold uppercase tracking-wide bg-black/40 text-white px-2.5 py-1 rounded-full backdrop-blur-sm">${esc(cat)}</span>` : ''}
    </div>
    <div class="p-4 flex-1 flex flex-col">
      <h3 class="font-bold text-ink text-[15px] leading-snug line-clamp-2 mb-2">${esc(a.title)}</h3>
      ${a.body ? `<p class="text-[11px] text-ink/55 line-clamp-3 flex-1 mb-3">${esc(a.body)}</p>` : '<div class="flex-1 mb-3"></div>'}
      <div class="flex items-center justify-between gap-2 mt-auto pt-3 border-t border-ink/5">
        <span class="text-[11px] text-ink/45">🗓️ ${fmtDate(a.created_at)}</span>
        <span class="text-[12px] font-bold text-green-dark">Baca →</span>
      </div>
    </div>
  </button>`;
}

function setCat(c) { activeCat = c; render(); }

function render() {
  const cats = [...new Set(allAnn.map(catOf).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  document.getElementById('cat-pills').innerHTML = [['', 'Semua'], ...cats.map(c => [c, c])].map(([key, label]) => {
    const on = activeCat === key;
    return `<button onclick="setCat('${key.replace(/'/g, "\\'")}')" class="px-4 py-2 rounded-full text-[13px] font-semibold transition-colors ${on ? 'bg-green text-white shadow-sm' : 'bg-white border border-ink/15 text-ink/55 hover:bg-ink/5'}">${esc(label)}</button>`;
  }).join('');

  const list = activeCat ? allAnn.filter(a => catOf(a).toLowerCase() === activeCat.toLowerCase()) : allAnn;
  document.getElementById('ann-grid').innerHTML = list.length
    ? list.map(gridCard).join('')
    : `<div class="col-span-full bg-white rounded-2xl border border-ink/8 text-center py-16 text-ink/40 text-sm">${allAnn.length ? 'Tiada pengumuman dalam kategori ini.' : 'Tiada pengumuman buat masa ini.'}</div>`;
}

// ── Modal detail ──
function openAnn(id) {
  const a = allAnn.find(x => x.id === id);
  if (!a) return;
  const cat = catOf(a), m = catMeta(cat), hasImg = !!a.image_url;
  const banner = document.getElementById('ann-modal-banner');
  banner.className = 'relative h-40 flex items-end p-4 shrink-0 ' + (hasImg ? '' : `bg-gradient-to-br ${m.grad}`);
  banner.style.cssText = hasImg ? `background-image:url('${a.image_url}');background-size:cover;background-position:center;` : '';
  banner.innerHTML = (hasImg ? `<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>` : `<div class="absolute inset-0 flex items-center justify-center ${m.text} opacity-60">${iconSvg(cat, 'w-16 h-16')}</div>`) +
    (cat ? `<span class="relative z-10 text-[9px] font-bold px-2.5 py-0.5 rounded-full ${hasImg ? 'bg-white/25 text-white backdrop-blur-sm' : m.badge} uppercase tracking-wide">${esc(cat)}</span>` : '');
  document.getElementById('ann-modal-meta').innerHTML = `🗓️ ${fmtDate(a.created_at)}`;
  document.getElementById('ann-modal-title').textContent = a.title;
  document.getElementById('ann-modal-body').innerHTML = a.content
    ? a.content
    : (a.body ? `<p>${esc(a.body)}</p>` : '<p class="text-ink/40">Tiada butiran tambahan.</p>');
  document.getElementById('ann-modal-cta').innerHTML = a.cta_label
    ? `<a href="${a.cta_url || '#'}" class="inline-flex items-center justify-center w-full bg-navy hover:bg-navy-dark text-white text-sm font-bold py-3 rounded-xl">${esc(a.cta_label)}</a>`
    : '';
  document.getElementById('ann-modal').classList.remove('hidden');
}
function closeAnn() { document.getElementById('ann-modal').classList.add('hidden'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAnn(); });

(async () => {
  const user = await initPatient('announcements', 'Berita & makluman terkini');
  if (!user) return;
  try {
    const now = new Date();
    const rows = await window.db.from('psy_announcements')
      .select('id, title, body, content, tag, category, image_url, cta_label, cta_url, bg, created_at, audience, package_ids, starts_at, expires_at')
      .eq('is_active', true)
      .or('expires_at.is.null,expires_at.gte.' + now.toISOString())
      .or('starts_at.is.null,starts_at.lte.' + now.toISOString())
      .order('created_at', { ascending: false }).limit(200)
      .then(r => r.data || [], () => []);
    const myPkg = window.patientRecord?.active_package_id || null;
    const pkgOk = it => !Array.isArray(it.package_ids) || it.package_ids.length === 0 || (myPkg && it.package_ids.includes(myPkg));
    allAnn = (rows || []).filter(a =>
      (!Array.isArray(a.audience) || a.audience.includes('patient')) && pkgOk(a));
    render();
    // Audit #G-33/34 (Tier 5) — tanda "dibaca" (impression-based), fire-and-forget
    if (allAnn.length && window.patientRecord?.id) {
      window.db.from('psy_announcement_reads')
        .upsert(allAnn.map(a => ({ announcement_id: a.id, patient_id: window.patientRecord.id })), { onConflict: 'announcement_id,patient_id', ignoreDuplicates: true })
        .then(() => {}, () => {});
    }
  } catch (e) {
    document.getElementById('ann-grid').innerHTML =
      `<div class="col-span-full bg-terracotta/10 text-terracotta rounded-xl p-4 text-sm">Ralat: ${e.message}</div>`;
  }
})();
</script>
</body>
</html>
