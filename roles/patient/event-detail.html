<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Detail Acara</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#f7f8fa]">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📅</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <section class="p-4 md:p-6 max-w-[1200px] mx-auto">
        <a href="events.html" class="inline-flex items-center gap-2 text-sm font-semibold text-ink/60 hover:text-navy mb-4">← Kembali ke Acara</a>
        <div id="detail-wrap" class="grid grid-cols-1 lg:grid-cols-3 gap-5 items-start">
          <div class="lg:col-span-3 text-center py-16 text-ink/40 text-sm">Memuatkan acara...</div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const EV_STYLE = {
  kelas:     { grad:'from-navy to-teal',          emoji:'🧘', tag:'Kelas' },
  webinar:   { grad:'from-[#2f7fc8] to-[#54b3cf]', emoji:'🎥', tag:'Webinar' },
  komuniti:  { grad:'from-green to-green-dark',    emoji:'🤝', tag:'Komuniti' },
  manzil:    { grad:'from-[#0e2a4a] to-[#16604a]', emoji:'🕌', tag:'Program Harian' },
  challenge: { grad:'from-gold to-gold-dark',      emoji:'🏆', tag:'Challenge' },
  default:   { grad:'from-navy to-navy-dark',      emoji:'📅', tag:'Acara' },
};
function evStyle(t) { return EV_STYLE[t] || EV_STYLE.default; }
function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
function fmtDate(d) { return new Date(d).toLocaleDateString(LCALE(), { weekday:'long', day:'2-digit', month:'long', year:'numeric' }); }
function fmtTimeRange(s, e) {
  const t1 = new Date(s).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  if (!e) return t1;
  const t2 = new Date(e).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  const mins = Math.round((new Date(e) - new Date(s)) / 60000);
  const dur = mins >= 60 ? `${(mins/60)}j` : `${mins} min`;
  return `${t1} – ${t2} (${dur})`;
}
function audLabel(aud) {
  if (!Array.isArray(aud) || !aud.length) return 'Semua Pengguna';
  if (aud.includes('patient') && aud.length === 1) return 'Semua Pesakit';
  const map = { patient:'Pesakit', staff:'Staff', doctor:'Doktor', coach:'Coach', admin:'Admin' };
  return aud.length >= 5 ? 'Semua Pengguna' : aud.map(x => map[x] || x).join(', ');
}
function gcalUrl(ev) {
  const fmt = d => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const start = fmt(ev.start_at);
  const end = fmt(ev.end_at || new Date(new Date(ev.start_at).getTime() + 3600000));
  const loc = ev.mode === 'online' ? (ev.meet_link || 'Online') : [ev.location, ev.address].filter(Boolean).join(', ');
  const p = new URLSearchParams({ action:'TEMPLATE', text:ev.title, dates:`${start}/${end}`,
    details:(ev.description || '').replace(/<[^>]+>/g, ''), location:loc });
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}

let EV = null, REG = null;

function infoRow(icon, label, value) {
  return `<div class="flex items-start gap-3 py-2.5 border-b border-ink/5 last:border-0">
    <span class="text-ink/40 mt-0.5">${icon}</span>
    <div class="flex-1 min-w-0">
      <div class="text-[11px] text-ink/45">${label}</div>
      <div class="text-sm font-semibold text-ink">${value}</div>
    </div>
  </div>`;
}

function actionHtml() {
  const past = new Date(EV.start_at) < new Date();
  const registered = REG && REG.status !== 'batal';
  if (past) {
    return EV.recording_url
      ? `<a href="${EV.recording_url}" target="_blank" rel="noopener" class="w-full bg-navy text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2">▶️ Lihat Rakaman</a>`
      : `<div class="w-full bg-ink/5 text-ink/50 font-semibold py-3.5 rounded-xl text-center">Acara ini telah tamat</div>`;
  }
  if (registered) {
    if (EV.mode === 'online' && EV.meet_link) {
      return `<a href="${EV.meet_link}" target="_blank" rel="noopener" class="w-full bg-green hover:bg-green-dark text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2">📹 Sertai Google Meet <span>→</span></a>
        <button onclick="toggleReg()" class="w-full text-[11px] text-ink/45 hover:text-terracotta mt-2">Batal pendaftaran</button>`;
    }
    return `<div class="w-full bg-green/10 text-green-dark border border-green/30 font-bold py-3.5 rounded-xl text-center">✓ Anda telah mendaftar</div>
      ${EV.maps_url ? `<a href="${EV.maps_url}" target="_blank" rel="noopener" class="block text-center text-xs text-navy hover:underline mt-2">🗺 Lihat lokasi di peta</a>` : ''}
      <button onclick="toggleReg()" class="w-full text-[11px] text-ink/45 hover:text-terracotta mt-1">Batal pendaftaran</button>`;
  }
  return `<button onclick="toggleReg()" class="w-full bg-navy hover:bg-navy-dark text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2">📝 Daftar Sekarang <span>→</span></button>`;
}

function render() {
  const st = evStyle(EV.type);
  const cover = EV.cover_image
    ? `style="background-image:url('${EV.cover_image}');background-size:cover;background-position:center;"`
    : '';
  const joinSteps = EV.mode === 'online'
    ? ['Klik butang "Sertai Google Meet" / "Daftar Sekarang" di bawah.', 'Pastikan anda log masuk menggunakan akaun Google.', 'Sertai 5 minit lebih awal untuk kelancaran sesi.']
    : ['Daftar untuk menempah tempat anda.', `Hadir di lokasi: ${EV.location || '—'}.`, 'Sampai 10 minit lebih awal untuk pendaftaran.'];

  document.getElementById('detail-wrap').innerHTML = `
    <!-- LEFT -->
    <div class="lg:col-span-2 space-y-5">
      <!-- Hero -->
      <div class="relative rounded-2xl overflow-hidden ${EV.cover_image ? '' : 'bg-gradient-to-br ' + st.grad}" ${cover}>
        ${EV.cover_image ? '<div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent"></div>' : ''}
        <div class="relative z-10 p-6 md:p-8 min-h-[200px] flex flex-col justify-end text-white">
          <span class="self-start text-[11px] font-bold uppercase tracking-wide bg-white/20 px-3 py-1 rounded-full backdrop-blur-sm mb-3">${st.emoji} ${EV.tag || st.tag}</span>
          <h1 class="text-2xl md:text-3xl font-extrabold leading-tight drop-shadow">${EV.title}</h1>
          ${EV.description ? `<p class="text-sm text-white/85 mt-2 max-w-xl line-clamp-2">${String(EV.description).replace(/<[^>]+>/g,'').slice(0,160)}</p>` : ''}
        </div>
      </div>

      <!-- Quick info strip -->
      <div class="bg-white rounded-2xl border border-ink/8 shadow-sm grid grid-cols-2 md:grid-cols-4 divide-x divide-ink/5">
        <div class="p-4"><div class="text-[10px] text-ink/45 mb-0.5">📅 Tarikh</div><div class="text-xs font-bold text-ink">${new Date(EV.start_at).toLocaleDateString(LCALE(),{day:'2-digit',month:'short',year:'numeric'})}</div></div>
        <div class="p-4"><div class="text-[10px] text-ink/45 mb-0.5">🕒 Masa</div><div class="text-xs font-bold text-ink">${new Date(EV.start_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div></div>
        <div class="p-4"><div class="text-[10px] text-ink/45 mb-0.5">📍 Platform</div><div class="text-xs font-bold text-ink">${EV.mode === 'f2f' ? 'Bersemuka' : 'Online'}</div></div>
        <div class="p-4"><div class="text-[10px] text-ink/45 mb-0.5">👤 Penganjur</div><div class="text-xs font-bold text-ink truncate">${EV.host || 'ISW'}</div></div>
      </div>

      <!-- About -->
      <div class="bg-white rounded-2xl border border-ink/8 shadow-sm p-5 md:p-6">
        <h2 class="font-bold text-ink mb-3">Tentang Program</h2>
        <div class="text-sm text-ink/70 leading-relaxed space-y-2">${EV.description || '<span class="text-ink/40">Tiada penerangan.</span>'}</div>

        <h3 class="font-bold text-ink mt-6 mb-2 text-sm">Cara Menyertai</h3>
        <ol class="space-y-2">
          ${joinSteps.map((s, i) => `<li class="flex items-start gap-2.5 text-sm text-ink/70"><span class="w-5 h-5 rounded-full bg-navy text-white text-[11px] font-bold flex items-center justify-center flex-shrink-0">${i+1}</span> ${s}</li>`).join('')}
        </ol>

        <div id="action-box" class="mt-5">${actionHtml()}</div>
        <p class="text-[11px] text-ink/45 text-center mt-2">🔒 Pautan hanya boleh diakses pada masa program bermula.</p>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="space-y-5">
      <div class="bg-white rounded-2xl border border-ink/8 shadow-sm p-5">
        <h3 class="font-bold text-ink mb-2">Maklumat Program</h3>
        ${infoRow('🏷️', 'Kategori', `<span class="inline-block text-[10px] font-semibold px-2 py-0.5 rounded-full bg-navy/8 text-navy">${EV.tag || st.tag}</span>`)}
        ${infoRow('📅', 'Tarikh', fmtDate(EV.start_at))}
        ${infoRow('🕒', 'Masa', fmtTimeRange(EV.start_at, EV.end_at))}
        ${infoRow('💻', 'Platform', EV.mode === 'f2f' ? `Bersemuka${EV.location ? ' · ' + EV.location : ''}` : 'Google Meet (Online)')}
        ${infoRow('👤', 'Penganjur', EV.host || 'Ibnu Sina Wellness')}
        ${infoRow('👥', 'Sasaran', audLabel(EV.audience))}
        ${EV.capacity ? infoRow('🎟️', 'Kapasiti', EV.capacity + ' peserta') : ''}
      </div>

      <div class="bg-white rounded-2xl border border-ink/8 shadow-sm p-5">
        <h3 class="font-bold text-ink mb-1">Simpan ke Kalendar</h3>
        <p class="text-[11px] text-ink/55 mb-3">Tambah acara ini ke kalendar anda supaya tidak terlepas.</p>
        <a href="${gcalUrl(EV)}" target="_blank" rel="noopener" class="w-full border border-navy/30 text-navy font-semibold py-2.5 rounded-xl flex items-center justify-center gap-2 hover:bg-navy hover:text-white transition-colors">📅 Tambah ke Kalendar</a>
      </div>

      <div class="bg-green-50 border border-green/20 rounded-2xl p-5">
        <div class="flex items-center gap-2 font-bold text-green-dark mb-1">💡 Tip</div>
        <p class="text-[12px] text-ink/60 leading-relaxed">Pastikan anda berada di tempat yang selesa dan tenang untuk mendapat manfaat penuh daripada program ini.</p>
      </div>

      <div class="bg-white rounded-2xl border border-ink/8 shadow-sm p-5">
        <div class="flex items-center gap-2 font-bold text-ink mb-1">🎧 Perlukan Bantuan?</div>
        <p class="text-[12px] text-ink/55 mb-2">Jika anda menghadapi masalah untuk menyertai, sila hubungi sokongan kami.</p>
        <a href="https://wa.me/60389663702" target="_blank" rel="noopener" class="text-sm font-semibold text-navy hover:underline">Hubungi Sokongan →</a>
      </div>
    </div>

    <!-- OTHER EVENTS -->
    <div class="lg:col-span-3" id="other-events"></div>
  `;
}

async function toggleReg() {
  if (!window.patientRecord?.id) { (window.banner || alert)('Rekod pesakit tidak ditemui'); return; }
  const registered = REG && REG.status !== 'batal';
  try {
    if (registered) {
      await window.db.from('psy_event_registrations').update({ status:'batal' })
        .eq('event_id', EV.id).eq('patient_id', window.patientRecord.id);
      REG = { ...REG, status:'batal' };
      banner('Pendaftaran dibatalkan');
    } else {
      await window.db.from('psy_event_registrations')
        .upsert({ event_id:EV.id, patient_id:window.patientRecord.id, status:'registered' }, { onConflict:'event_id,patient_id' });
      REG = { status:'registered' };
      banner('Berjaya daftar ✓');
      notify(window.currentUser.id, 'system', 'Pendaftaran acara disahkan', `Anda telah mendaftar: ${EV.title}`, 'event-detail.html?id=' + EV.id).catch(() => {});
    }
    document.getElementById('action-box').innerHTML = actionHtml();
  } catch (e) { (window.banner || alert)('Ralat: ' + e.message); }
}

async function loadOthers() {
  const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
  const { data } = await window.db.from('psy_events').select('id, title, type, start_at, cover_image, tag, mode, audience')
    .eq('status', 'published').neq('id', EV.id).gte('start_at', todayStart.toISOString())
    .order('start_at', { ascending: true }).limit(3);
  const list = (data || []).filter(e => !Array.isArray(e.audience) || e.audience.includes('patient'));
  const box = document.getElementById('other-events');
  if (!list.length) { box.innerHTML = ''; return; }
  box.innerHTML = `
    <div class="flex items-center justify-between mt-2 mb-3">
      <h3 class="font-bold text-ink">Acara Lain</h3>
      <a href="events.html" class="text-xs font-semibold text-navy hover:underline">Lihat Semua →</a>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      ${list.map(e => {
        const s = evStyle(e.type);
        return `<a href="event-detail.html?id=${e.id}" class="bg-white rounded-2xl border border-ink/8 shadow-sm overflow-hidden hover:shadow-md transition-shadow">
          <div class="h-20 ${e.cover_image ? '' : 'bg-gradient-to-br ' + s.grad} flex items-center justify-center text-3xl" ${e.cover_image ? `style="background-image:url('${e.cover_image}');background-size:cover;background-position:center;"` : ''}>${e.cover_image ? '' : s.emoji}</div>
          <div class="p-3">
            <span class="text-[9px] font-bold uppercase text-navy/70">${e.tag || s.tag}</span>
            <div class="text-sm font-bold text-ink leading-snug line-clamp-2 mt-0.5">${e.title}</div>
            <div class="text-[10px] text-ink/45 mt-1">📅 ${new Date(e.start_at).toLocaleDateString(LCALE(),{day:'2-digit',month:'short'})} · ${new Date(e.start_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div>
          </div>
        </a>`;
      }).join('')}
    </div>`;
}

(async () => {
  const user = await initPatient('events', 'Detail acara');
  if (!user) return;
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { document.getElementById('detail-wrap').innerHTML = '<div class="lg:col-span-3 text-center py-16 text-ink/40">Acara tidak dijumpai.</div>'; return; }
  try {
    const { data: ev } = await window.db.from('psy_events').select('*').eq('id', id).maybeSingle();
    if (!ev) { document.getElementById('detail-wrap').innerHTML = '<div class="lg:col-span-3 text-center py-16 text-ink/40">Acara tidak dijumpai.</div>'; return; }
    EV = ev;
    if (window.patientRecord?.id) {
      const { data: reg } = await window.db.from('psy_event_registrations').select('status')
        .eq('event_id', id).eq('patient_id', window.patientRecord.id).maybeSingle();
      REG = reg;
    }
    render();
    loadOthers();
  } catch (e) {
    document.getElementById('detail-wrap').innerHTML = `<div class="lg:col-span-3 bg-terracotta/10 text-terracotta rounded-xl p-4 text-sm">Ralat: ${e.message}</div>`;
  }
})();
</script>
</body>
</html>
