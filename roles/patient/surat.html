<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Surat Rasmi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📄</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-6">

        <!-- Issued letters -->
        <div class="bg-white rounded-xl border border-ink/10 p-5">
          <h3 class="font-semibold text-sm mb-3">Surat Saya</h3>
          <div id="issued-list" class="space-y-2"><div class="text-center text-ink/40 text-sm py-6">Memuatkan...</div></div>
        </div>

        <!-- Request new -->
        <div class="bg-white rounded-xl border border-ink/10 p-5">
          <h3 class="font-semibold text-sm mb-1">Mohon Surat Baru</h3>
          <p class="text-xs text-ink/60 mb-3">Terangkan jenis surat dan tujuan permohonan. Staff akan keluarkan surat dan upload ke akaun anda dalam 1-2 hari bekerja.</p>

          <div class="space-y-3">
            <div>
              <label class="text-xs font-semibold text-ink/70 mb-1 block">Jenis Surat</label>
              <select id="req-tpl" class="w-full border border-ink/20 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-navy bg-white" onchange="onTplChange()">
                <option value="">— Pilih jenis surat —</option>
              </select>
              <p id="tpl-desc" class="text-[11px] text-ink/55 mt-1.5 hidden"></p>
            </div>
            <div id="custom-name-wrap" class="hidden">
              <label class="text-xs font-semibold text-ink/70 mb-1 block">Nama Surat</label>
              <input id="req-name" type="text" placeholder="cth: Surat Permohonan KWSP" class="w-full border border-ink/20 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-navy" oninput="updateBtn()">
            </div>
            <div>
              <label class="text-xs font-semibold text-ink/70 mb-1 block">Sebab / Tujuan Permohonan</label>
              <textarea id="req-reason" rows="4" placeholder="cth: untuk failkan claim KWSP bulan depan" class="w-full border border-ink/20 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-navy resize-none" oninput="updateBtn()"></textarea>
            </div>
            <div>
              <label class="text-xs font-semibold text-ink/70 mb-1 block">Lampiran (Opsyenal)</label>
              <input id="req-file-input" type="file" multiple class="hidden" onchange="onFilesSelected(event)">
              <div onclick="document.getElementById('req-file-input').click()" class="border border-dashed border-ink/25 rounded-lg p-3 text-center cursor-pointer hover:bg-ink/[0.02]">
                <p class="text-xs text-ink/50">📎 <span class="text-navy font-semibold">Klik untuk upload</span> — PDF/JPG/PNG</p>
              </div>
              <div id="req-files-list" class="space-y-1.5 mt-1.5"></div>
            </div>
            <div class="flex items-center gap-2">
              <button id="btn-draft" onclick="saveDraft()" class="border border-ink/20 text-ink/70 px-5 py-2.5 rounded-lg font-semibold text-sm hover:bg-cream">Simpan Draf</button>
              <button id="btn-submit" onclick="submitRequest()" disabled class="bg-navy text-white px-5 py-2.5 rounded-lg font-semibold text-sm hover:bg-navy-dark disabled:opacity-40 disabled:cursor-not-allowed">Hantar Permohonan</button>
              <button id="btn-cancel-edit" onclick="resetForm()" class="hidden text-xs text-ink/50 hover:underline ml-1">Batal edit</button>
            </div>
          </div>
        </div>

        <!-- Draft / pending / rejected requests -->
        <div class="bg-white rounded-xl border border-ink/10 p-5">
          <h3 class="font-semibold text-sm mb-3">Permohonan Saya</h3>
          <div id="requests-list" class="space-y-2"></div>
        </div>

      </div>
    </main>
  </div>

  <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-navy-dark text-white py-2 justify-around z-20">
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🏠</span>Home</a>
    <a href="plan.html"      class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>💊</span>Plan</a>
    <a href="shop.html"      class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🛒</span>Shop</a>
    <a href="profile.html"   class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>👤</span>Profile</a>
  </nav>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/letterTemplates.js"></script>
<script src="_shared.js"></script>
<script>
    function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
const LOGO_URL = '../../image/Logo_ISW.png';

async function logAudit(action, target, meta) {
  try {
    await window.db.from('psy_audit_log').insert({
      actor_id: window.currentUser?.id, actor_name: window.currentUser?.full_name,
      actor_role: 'patient', action, target, meta: meta || {},
    });
  } catch (_) {}
}

async function viewLetter(id) {
  const { data: rows } = await window.db.from('psy_letter_issued').select('*').eq('id', id).limit(1);
  const l = rows?.[0];
  if (!l) { banner('Surat tidak ditemui', 'error'); return; }
  const { data: tplRows } = await window.db.from('psy_letter_templates').select('*').eq('name', l.template_name).limit(1);
  const tpl = tplRows?.[0] || { name: l.template_name, body: '', recipient: '', title: l.template_name };
  const html = renderLetterFull({
    logoUrl: LOGO_URL, template: tpl, values: l.field_values || {},
    refNumber: l.ref_number,
    signerName: l.signed_by_name, signerRole: l.signed_by_role || '',
    signatureDataUrl: l.signature_url || null,
    todayStr: new Date(l.signed_at).toLocaleDateString(LCALE(), { day: '2-digit', month: 'long', year: 'numeric' }),
  });
  openLetterTab(html, l.template_name + ' — ' + l.ref_number);
}

let availableTemplates = [];

function onTplChange() {
  const v = document.getElementById('req-tpl').value;
  const customWrap = document.getElementById('custom-name-wrap');
  const desc = document.getElementById('tpl-desc');
  if (v === '__custom__') {
    customWrap.classList.remove('hidden');
    desc.classList.add('hidden');
  } else {
    customWrap.classList.add('hidden');
    const tpl = availableTemplates.find(t => t.id === v);
    let parts = [];
    if (tpl?.description) parts.push(tpl.description);
    if (tpl?.signer?.full_name) {
      parts.push(`<strong>👤 Perlu kelulusan: ${tpl.signer.full_name}</strong>`);
    }
    if (parts.length) { desc.innerHTML = parts.join('<br>'); desc.classList.remove('hidden'); }
    else desc.classList.add('hidden');
  }
  updateBtn();
}

function updateBtn() {
  const tplVal = document.getElementById('req-tpl').value;
  const reason = document.getElementById('req-reason').value.trim();
  const customName = document.getElementById('req-name')?.value.trim() || '';
  const ok = !!reason && (tplVal && tplVal !== '__custom__' || (tplVal === '__custom__' && customName));
  document.getElementById('btn-submit').disabled = !ok;
}

async function loadTemplates() {
  const { data } = await window.db.from('psy_letter_templates')
    .select('id, name, description, category, is_active, assigned_signer_id, requires_specific_approver, signer:psy_profiles!assigned_signer_id(full_name, staff_role)')
    .eq('category', 'patient')
    .eq('is_active', true)
    .order('name');
  availableTemplates = data || [];
  const sel = document.getElementById('req-tpl');
  sel.innerHTML = '<option value="">— Pilih jenis surat —</option>' +
    availableTemplates.map(t => `<option value="${t.id}">${(t.name||'').replace(/</g,'&lt;')}</option>`).join('') +
    '<option value="__custom__">Lain-lain (taip sendiri)</option>';
}

let editingRequestId = null;
let stagedFiles = [];

function escHtml(str) { return (str || '').replace(/</g,'&lt;'); }

function onFilesSelected(e) {
  stagedFiles.push(...Array.from(e.target.files || []));
  renderFilesList();
  e.target.value = '';
}
window.onFilesSelected = onFilesSelected;

function removeStagedFile(idx) {
  stagedFiles.splice(idx, 1);
  renderFilesList();
}
window.removeStagedFile = removeStagedFile;

function renderFilesList() {
  document.getElementById('req-files-list').innerHTML = stagedFiles.map((f, i) => `
    <div class="flex items-center justify-between px-3 py-2 bg-cream/60 rounded-lg text-xs">
      <span class="truncate">📄 ${escHtml(f.name)} <span class="text-ink/40">(${Math.round(f.size/1024)} KB)</span></span>
      <button onclick="removeStagedFile(${i})" class="text-terracotta hover:text-terracotta/70 flex-shrink-0 ml-2">🗑</button>
    </div>`).join('');
}

async function uploadStagedAttachments(requestId) {
  for (const f of stagedFiles) {
    const path = `${requestId}/${Date.now()}_${f.name}`;
    const { error: upErr } = await window.db.storage.from('letter-attachments').upload(path, f);
    if (!upErr) {
      await window.db.from('psy_letter_request_attachments').insert({
        request_id: requestId, file_name: f.name, file_path: path, file_size: f.size, file_type: f.type,
        uploaded_by: window.currentUser?.id, uploaded_by_name: window.currentUser?.full_name || '',
      });
    }
  }
  stagedFiles = [];
  renderFilesList();
}

function resetForm() {
  editingRequestId = null;
  document.getElementById('req-tpl').value = '';
  document.getElementById('req-name') && (document.getElementById('req-name').value = '');
  document.getElementById('req-reason').value = '';
  document.getElementById('custom-name-wrap').classList.add('hidden');
  document.getElementById('tpl-desc').classList.add('hidden');
  document.getElementById('btn-cancel-edit').classList.add('hidden');
  stagedFiles = [];
  renderFilesList();
  updateBtn();
}
window.resetForm = resetForm;

function editRequest(id) {
  const r = myRequests.find(x => x.id === id);
  if (!r) return;
  editingRequestId = id;
  const matchTpl = availableTemplates.find(t => t.id === r.template_code);
  document.getElementById('req-tpl').value = matchTpl ? matchTpl.id : '__custom__';
  onTplChange();
  if (!matchTpl) document.getElementById('req-name').value = r.template_name || '';
  document.getElementById('req-reason').value = r.reason || '';
  document.getElementById('btn-cancel-edit').classList.remove('hidden');
  updateBtn();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.editRequest = editRequest;

function collectFormValues() {
  const tplVal = document.getElementById('req-tpl').value;
  const reason = document.getElementById('req-reason').value.trim();
  let template_code = 'custom', template_name = '', assigned_signer_id = null, tpl = null;
  if (tplVal === '__custom__') {
    template_name = document.getElementById('req-name').value.trim();
  } else if (tplVal) {
    tpl = availableTemplates.find(t => t.id === tplVal);
    if (!tpl) { banner('Templat tidak sah', 'error'); return null; }
    template_code = tpl.id;
    template_name = tpl.name;
    assigned_signer_id = tpl.assigned_signer_id || null;
  }
  if (!template_name || !reason) return null;
  return { tpl, template_code, template_name, reason, assigned_signer_id };
}

async function saveDraft() {
  const v = collectFormValues();
  if (!v) { banner('Sila lengkapkan borang dulu', 'error'); return; }
  const btn = document.getElementById('btn-draft');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    const payload = {
      patient_id: patientRecord.id, patient_name: window.currentUser.full_name,
      requester_type: 'patient',
      template_code: v.template_code, template_name: v.template_name,
      reason: v.reason, assigned_signer_id: v.assigned_signer_id,
      status: 'draft', updated_at: new Date().toISOString(),
    };
    let draftId = editingRequestId;
    if (editingRequestId) {
      await window.db.from('psy_letter_requests').update(payload).eq('id', editingRequestId);
    } else {
      const { data } = await window.db.from('psy_letter_requests').insert(payload).select('id').single();
      draftId = data?.id;
    }
    if (draftId && stagedFiles.length) await uploadStagedAttachments(draftId);
    banner('Draf disimpan');
    resetForm();
    loadList();
  } catch (e) {
    banner('Ralat: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan Draf';
  }
}
window.saveDraft = saveDraft;

async function submitRequest() {
  const v = collectFormValues();
  if (!v) return;
  const needsApproval = v.tpl ? !!v.tpl.requires_specific_approver : true; // custom (bukan templat) → sentiasa lalu staff
  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = 'Menghantar...';
  try {
    const payload = {
      patient_id: patientRecord.id, patient_name: window.currentUser.full_name,
      requester_type: 'patient',
      template_code: v.template_code, template_name: v.template_name,
      reason: v.reason, assigned_signer_id: v.assigned_signer_id,
      status: needsApproval ? 'pending_approval' : 'submitted',
      updated_at: new Date().toISOString(),
    };
    let reqRow;
    if (editingRequestId) {
      const { data, error } = await window.db.from('psy_letter_requests').update(payload).eq('id', editingRequestId).select().single();
      if (error) throw error;
      reqRow = data;
      await logAudit('letter.request_submitted', reqRow.id, { template: v.template_name });
    } else {
      const { data, error } = await window.db.from('psy_letter_requests').insert(payload).select().single();
      if (error) throw error;
      reqRow = data;
      await logAudit('letter.request_created', reqRow.id, { template: v.template_name });
    }
    if (stagedFiles.length) await uploadStagedAttachments(reqRow.id);

    if (needsApproval) {
      if (v.assigned_signer_id) {
        try { await notify(v.assigned_signer_id, 'system', 'Permohonan Surat Baru',
          `${window.currentUser.full_name} memohon: ${v.template_name}`, 'surat.html'); } catch {}
      }
      banner('Permohonan dihantar');
    } else {
      const result = await window.autoIssueLetterIfNoApproval(reqRow, v.tpl);
      banner(result.issued ? 'Surat anda sedia — lihat di "Surat Saya"' : ('Permohonan dihantar' + (result.error ? ` (auto-terbit gagal: ${result.error}, akan diproses staff)` : '')));
    }
    resetForm();
    loadList();
  } catch (e) {
    banner('Ralat: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Hantar Permohonan';
  }
}

async function cancelRequest(id) {
  if (!confirm('Batalkan permohonan ini?')) return;
  try {
    await window.db.from('psy_letter_requests').update({ status: 'cancelled', updated_at: new Date().toISOString() }).eq('id', id);
    banner('Permohonan dibatalkan');
    loadList();
  } catch (e) { banner('Ralat: ' + e.message, 'error'); }
}
window.cancelRequest = cancelRequest;

let myRequests = [];

async function loadList() {
  if (!patientRecord) return;
  const [issuedRes, reqRes] = await Promise.all([
    window.db.from('psy_letter_issued').select('*').eq('patient_id', patientRecord.id).order('created_at', { ascending: false }),
    window.db.from('psy_letter_requests').select('*').eq('patient_id', patientRecord.id)
      .in('status', ['draft','submitted','pending_approval','revision_requested','rejected'])
      .order('created_at', { ascending: false }),
  ]);

  const issued = issuedRes.data || [];
  const reqs = reqRes.data || [];
  myRequests = reqs;

  const list = document.getElementById('issued-list');
  if (!issued.length) {
    list.innerHTML = '<div class="text-center text-ink/40 text-sm py-6">Belum ada surat dikeluarkan</div>';
  } else {
    list.innerHTML = issued.map(l => `<div class="bg-cream/40 border border-ink/10 rounded-lg p-3 flex items-center gap-3 flex-wrap">
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-sm">${(l.template_name || '').replace(/</g,'&lt;')}</div>
        <div class="text-[11px] text-ink/50">Ruj: <span class="font-mono">${l.ref_number || '—'}</span> · oleh ${l.signed_by_name || '—'} · ${new Date(l.signed_at).toLocaleDateString(LCALE(),{day:'2-digit',month:'short',year:'numeric'})}</div>
      </div>
      <button onclick="viewLetter('${l.id}')" class="bg-navy text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-navy-dark">Buka / Cetak</button>
    </div>`).join('');
  }

  const STATUS_CHIP = {
    draft:              { label: 'Draf',                cls: 'bg-ink/10 text-ink/60' },
    submitted:          { label: 'Menunggu',             cls: 'bg-gold/15 text-gold-dark' },
    pending_approval:   { label: 'Menunggu Kelulusan',   cls: 'bg-gold/15 text-gold-dark' },
    revision_requested: { label: 'Perlu Semakan Anda',   cls: 'bg-teal/15 text-teal' },
    rejected:           { label: 'Ditolak',              cls: 'bg-terracotta/15 text-terracotta' },
  };

  const reqList = document.getElementById('requests-list');
  if (!reqs.length) {
    reqList.innerHTML = '<div class="text-xs text-ink/40 text-center py-3">Tiada permohonan menunggu</div>';
  } else {
    reqList.innerHTML = reqs.map(r => {
      const chip = STATUS_CHIP[r.status] || { label: r.status, cls: 'bg-ink/10 text-ink/60' };
      const editable = r.status === 'draft' || r.status === 'revision_requested';
      const cancellable = ['draft','submitted','pending_approval'].includes(r.status);
      return `
      <div class="bg-cream/50 border border-ink/10 rounded-lg p-3 flex items-center gap-3 flex-wrap">
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-sm">${(r.template_name || '').replace(/</g,'&lt;')}</div>
          <div class="text-xs text-ink/60 truncate">${(r.reason || '').replace(/</g,'&lt;')}</div>
          ${r.status === 'rejected' && r.reject_reason ? `<div class="text-terracotta text-xs mt-1">Ditolak: ${(r.reject_reason || '').replace(/</g,'&lt;')}</div>` : ''}
          ${r.status === 'revision_requested' && r.revision_note ? `<div class="text-teal text-xs mt-1">Perlu disemak: ${(r.revision_note || '').replace(/</g,'&lt;')}</div>` : ''}
        </div>
        <span class="chip text-[10px] px-2 py-0.5 rounded-full ${chip.cls}">${chip.label}</span>
        <a href="surat-detail.html?id=${r.id}" class="text-xs text-navy hover:underline">👁 Lihat</a>
        ${editable ? `<button onclick="editRequest('${r.id}')" class="text-xs text-navy hover:underline">✏️ Edit</button>` : ''}
        ${cancellable ? `<button onclick="cancelRequest('${r.id}')" class="text-xs text-terracotta hover:underline">Batal</button>` : ''}
      </div>`;
    }).join('');
  }
}

(async () => {
  const user = await initPatient('surat', 'Permohonan & muat turun surat rasmi');
  if (!user) return;
  await loadTemplates();
  await loadList();
  const editId = new URLSearchParams(location.search).get('edit');
  if (editId) editRequest(editId);
})();
</script>
</body>
