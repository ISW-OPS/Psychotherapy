<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Session History</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📝</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>
      <div id="content" class="p-4 md:p-8">
        <div id="sessions-list" class="space-y-3"></div>
      </div>
    </main>
  </div>
  <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-navy-dark text-white py-2 justify-around z-20">
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🏠</span>Home</a>
    <a href="appointments.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>📅</span>Book</a>
    <a href="plan.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>💊</span>Plan</a>
    <a href="shop.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🛒</span>Shop</a>
    <a href="profile.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>👤</span>Profile</a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
(async () => {
  const user = await initPatient('sessions', 'Catatan dari doctor / coach');
  if (!user) return;
  if (!patientRecord) {
    document.getElementById('sessions-list').innerHTML = '<div class="bg-gold-light rounded-xl p-4 text-sm">Rekod pesakit belum aktif.</div>';
    return;
  }

  const [notes, sessions] = await Promise.all([
    dbQuery('soap_notes', { eq: { patient_id: patientRecord.id }, order: { col: 'created_at' } }),
    dbQuery('coaching_sessions', { eq: { patient_id: patientRecord.id }, order: { col: 'session_date' } }),
  ]);

  const all = [
    ...notes.map(n => ({ type: 'doctor', date: n.created_at, title: 'Konsultasi Doktor', notes: n.chief_complaint, status: n.status })),
    ...sessions.map(s => ({ type: 'coach', date: s.session_date, title: `Coaching (${s.pillar || 'General'})`, notes: s.notes?.slice(0, 150), status: s.status })),
  ].sort((a, b) => new Date(b.date) - new Date(a.date));

  document.getElementById('sessions-list').innerHTML = all.length
    ? all.map(s => `
      <div class="bg-white rounded-xl border border-ink/10 p-5">
        <div class="flex items-start justify-between gap-3 flex-wrap">
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <span class="chip ${s.type === 'doctor' ? 'bg-navy-light text-navy' : 'bg-teal/10 text-teal'}">${s.type === 'doctor' ? '⚕ Doctor' : '🎯 Coach'}</span>
              <strong>${s.title}</strong>
            </div>
            <p class="text-sm text-ink/70 mt-2">${s.notes || '—'}</p>
            <div class="text-xs text-ink/50 mt-2">${new Date(s.date).toLocaleString('ms-MY')}</div>
          </div>
          <span class="chip bg-green-light text-green-dark">${s.status}</span>
        </div>
      </div>`).join('')
    : '<div class="bg-white rounded-xl border border-ink/10 p-8 text-center text-ink/60 text-sm">Tiada session history</div>';
})();
</script>
</body>
</html>
