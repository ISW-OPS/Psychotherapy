<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ibnu Sina Wellness — KYC Pendaftaran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../shared/theme.js"></script>
  <script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="_styles.css" rel="stylesheet">
</head>

<body class="h-screen overflow-hidden">

  <div id="app-loading" class="h-screen flex items-center justify-center">
    <div class="text-center">
      <div class="text-4xl mb-3">🆔</div>
      <p class="text-ink/60 text-sm">Memuatkan...</p>
    </div>
  </div>

  <div id="app-shell" class="hidden h-screen">
    <div class="flex h-screen">
      <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
      <main class="main-content flex-1 min-w-0 flex flex-col h-screen overflow-hidden">
        <header id="page-header"
          class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4">
        </header>

        <div class="p-3 md:p-4 flex-1 min-h-0 overflow-hidden">
          <div class="max-w-6xl mx-auto h-full flex flex-col">

            <!-- Status banner -->
            <div id="status-banner" class="hidden rounded-xl p-3 mb-2 flex-none"></div>

            <!-- Step indicator -->
            <div id="step-indicator" class="flex items-center justify-center gap-2 mb-3 flex-wrap flex-none"></div>

            <div class="bg-white rounded-2xl border border-ink/10 flex flex-col flex-1 min-h-0 overflow-hidden">
              <div class="flex-1 min-h-0 p-5 md:p-6">
                <!-- STEP 1: Personal Info -->
                <div data-step="1" class="step-panel">
                  <div class="text-center mb-4">
                    <h3 class="font-bold text-base flex items-center justify-center gap-2"><span>👤</span> Maklumat
                      Peribadi</h3>
                  </div>
                  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                    <div class="md:col-span-2">
                      <label class="text-xs font-semibold">Nama Penuh *</label>
                      <input id="f-name" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                        placeholder="Mengikut IC">
                    </div>
                    <div class="md:col-span-1 lg:col-span-2">
                      <label class="text-xs font-semibold">No. IC *</label>
                      <input id="f-ic" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                        placeholder="XXXXXX-XX-XXXX">
                    </div>
                    <div>
                      <label class="text-xs font-semibold">Tarikh Lahir</label>
                      <input id="f-dob" type="date"
                        class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
                    </div>
                    <div>
                      <label class="text-xs font-semibold">Jantina</label>
                      <select id="f-gender" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
                        <option value="">— Pilih —</option>
                        <option value="M">Lelaki</option>
                        <option value="F">Perempuan</option>
                      </select>
                    </div>
                    <div class="col-span-2 md:col-span-1 lg:col-span-2">
                      <label class="text-xs font-semibold">No. Telefon *</label>
                      <input id="f-phone" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                        placeholder="+60 12-345 6789">
                    </div>
                    <div class="col-span-2 md:col-span-3 lg:col-span-4">
                      <label class="text-xs font-semibold">Alamat Penuh *</label>
                      <textarea id="f-address" rows="2"
                        class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                        placeholder="No. rumah, jalan, bandar, poskod, negeri"></textarea>
                    </div>
                  </div>
                </div>

                <!-- STEP 2: Emergency Contact -->
                <div data-step="2" class="step-panel hidden">
                  <div class="text-center mb-4">
                    <h3 class="font-bold text-base flex items-center justify-center gap-2"><span>🆘</span> Maklumat
                      Pewaris</h3>
                    <p class="text-xs text-ink/60 mt-1">Kontak untuk kecemasan / waris terdekat</p>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-3xl mx-auto">
                    <div>
                      <label class="text-xs font-semibold">Nama Pewaris</label>
                      <input id="f-emg-name" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                        placeholder="cth: Ahmad (Bapa)">
                    </div>
                    <div>
                      <label class="text-xs font-semibold">No. Telefon Pewaris</label>
                      <input id="f-emg-phone" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                        placeholder="+60 12-345 6789">
                    </div>
                  </div>
                </div>

                <!-- STEP 3: Medical History -->
                <div data-step="3" class="step-panel hidden">
                  <div class="text-center mb-4">
                    <h3 class="font-bold text-base flex items-center justify-center gap-2"><span>🩺</span> Sejarah
                      Kesihatan</h3>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    <div class="lg:col-span-2">
                      <label class="text-xs font-semibold">Penyakit / Kondisi Semasa *</label>
                      <input id="f-condition" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                        placeholder="cth: Kemurungan, Anxiety, Insomnia">
                    </div>
                    <div>
                      <label class="text-xs font-semibold">Berapa Lama *</label>
                      <select id="f-duration" class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
                        <option value="">— Pilih —</option>
                        <option>Kurang 1 bulan</option>
                        <option>1–3 bulan</option>
                        <option>3–6 bulan</option>
                        <option>6–12 bulan</option>
                        <option>1–2 tahun</option>
                        <option>2–5 tahun</option>
                        <option>Lebih 5 tahun</option>
                      </select>
                    </div>
                    <div class="md:col-span-2 lg:col-span-2">
                      <label class="text-xs font-semibold">Nota / Simptom / Ubat Semasa</label>
                      <textarea id="f-medical-notes" rows="3"
                        class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm"
                        placeholder="cth: Sukar tidur, palpitasi, ambil Sertraline 50mg..."></textarea>
                    </div>
                    <div>
                      <label class="text-xs font-semibold">Upload Laporan Perubatan</label>
                      <input id="f-reports" type="file" multiple accept="image/*,application/pdf"
                        class="w-full mt-1 px-3 py-2 border border-ink/20 rounded-lg text-sm">
                      <p class="text-[10px] text-ink/50 mt-1">PDF/gambar · Max 5MB</p>
                      <div id="existing-reports" class="mt-2 space-y-1"></div>
                    </div>
                  </div>
                </div>

                <!-- STEP 4: PDPA Consent -->
                <div data-step="4" class="step-panel hidden">
                  <div class="text-center mb-4">
                    <h3 class="font-bold text-base flex items-center justify-center gap-2"><span>📋</span> Persetujuan
                      PDPA</h3>
                    <p class="text-xs text-ink/60 mt-1">Baca & tandakan sebelum hantar</p>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                    <label
                      class="flex items-start gap-3 p-3 border border-ink/10 rounded-lg cursor-pointer hover:bg-cream/50">
                      <input id="c-data" type="checkbox" class="mt-1" required>
                      <div class="flex-1">
                        <strong>Pemprosesan Data Peribadi *</strong>
                        <p class="text-[11px] text-ink/70 mt-1">Saya bersetuju ISW mengumpul & memproses data peribadi
                          untuk tujuan rawatan (PDPA Act 709).</p>
                      </div>
                    </label>
                    <label
                      class="flex items-start gap-3 p-3 border border-ink/10 rounded-lg cursor-pointer hover:bg-cream/50">
                      <input id="c-health" type="checkbox" class="mt-1" required>
                      <div class="flex-1">
                        <strong>Rekod Kesihatan *</strong>
                        <p class="text-[11px] text-ink/70 mt-1">Rekod perubatan disimpan & dikongsi secara sulit antara
                          clinicians ISW.</p>
                      </div>
                    </label>
                    <label
                      class="flex items-start gap-3 p-3 border border-ink/10 rounded-lg cursor-pointer hover:bg-cream/50">
                      <input id="c-research" type="checkbox" class="mt-1">
                      <div class="flex-1">
                        <strong>Kajian Penyelidikan</strong>
                        <p class="text-[11px] text-ink/70 mt-1">Data anonymized boleh digunakan dalam kajian perubatan
                          Islam & moden.</p>
                      </div>
                    </label>
                    <label
                      class="flex items-start gap-3 p-3 border border-ink/10 rounded-lg cursor-pointer hover:bg-cream/50">
                      <input id="c-marketing" type="checkbox" class="mt-1">
                      <div class="flex-1">
                        <strong>Komunikasi Promosi</strong>
                        <p class="text-[11px] text-ink/70 mt-1">Terima promosi & kandungan pendidikan via
                          email/WhatsApp.</p>
                      </div>
                    </label>
                  </div>
                </div>

              </div>

              <!-- Footer: error + nav buttons (fixed, outside scroll) -->
              <div class="flex-none border-t border-ink/10 bg-white px-6 md:px-8 py-4">
                <div id="form-error"
                  class="hidden mb-3 text-xs text-terracotta bg-terracotta-light rounded-lg p-2 text-center"></div>
                <div class="flex items-center justify-between gap-3">
                  <button id="btn-back" onclick="wizardBack()"
                    class="px-5 py-2.5 rounded-lg text-sm font-semibold bg-cream hover:bg-ink/10 invisible">←
                    Kembali</button>
                  <p class="text-[11px] text-ink/50 text-center hidden md:block">Admin akan semak dalam 24 jam</p>
                  <div class="flex gap-2">
                    <button id="btn-next" onclick="wizardNext()"
                      class="px-6 py-2.5 rounded-lg text-sm font-semibold bg-navy text-white hover:bg-navy-dark">Seterusnya
                      →</button>
                    <button id="btn-submit" onclick="submitKYC()"
                      class="hidden px-6 py-2.5 rounded-lg text-sm font-semibold bg-green text-white hover:bg-green-dark">Hantar
                      KYC →</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
    </div>
    </main>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../config/supabase.js"></script>
  <script src="../../shared/authGuard.js"></script>
  <script src="../../shared/logout.js"></script>
  <script src="../../shared/navbar.js"></script>
  <script src="_shared.js"></script>
  <script>
    let existingKYC = null;
    let currentStep = 1;
    const TOTAL_STEPS = 4;
    const STEP_LABELS = ['Maklumat Peribadi', 'Pewaris', 'Sejarah Kesihatan', 'Persetujuan'];

    function renderStepIndicator() {
      const host = document.getElementById('step-indicator');
      host.innerHTML = Array.from({ length: TOTAL_STEPS }, (_, i) => {
        const n = i + 1;
        const isDone = n < currentStep;
        const isActive = n === currentStep;
        const circle = isDone
          ? `<div class="w-9 h-9 rounded-full bg-green text-white flex items-center justify-center font-bold text-sm">✓</div>`
          : isActive
            ? `<div class="w-9 h-9 rounded-full bg-navy text-white flex items-center justify-center font-bold text-sm ring-4 ring-navy/20">${n}</div>`
            : `<div class="w-9 h-9 rounded-full bg-ink/10 text-ink/50 flex items-center justify-center font-bold text-sm">${n}</div>`;
        const line = n < TOTAL_STEPS
          ? `<div class="flex-1 h-0.5 ${n < currentStep ? 'bg-green' : 'bg-ink/15'} max-w-[40px]"></div>`
          : '';
        return `<div class="flex items-center gap-2">${circle}${line}</div>`;
      }).join('');
    }

    function showStep(n) {
      document.querySelectorAll('.step-panel').forEach(p => p.classList.add('hidden'));
      document.querySelector(`.step-panel[data-step="${n}"]`).classList.remove('hidden');
      document.getElementById('btn-back').classList.toggle('invisible', n === 1);
      document.getElementById('btn-next').classList.toggle('hidden', n === TOTAL_STEPS);
      document.getElementById('btn-submit').classList.toggle('hidden', n !== TOTAL_STEPS);
      renderStepIndicator();
      document.querySelector('.bg-white.rounded-2xl.border.border-ink\\/10 .overflow-y-auto')?.scrollTo({ top: 0 });
    }

    function validateStep(n) {
      const errEl = document.getElementById('form-error');
      errEl.classList.add('hidden');
      const need = (ids, msg) => {
        for (const id of ids) {
          if (!document.getElementById(id).value.trim()) {
            errEl.textContent = msg; errEl.classList.remove('hidden'); return false;
          }
        }
        return true;
      };
      if (n === 1) return need(['f-name', 'f-ic', 'f-phone', 'f-address'], 'Sila lengkapkan semua medan wajib (*)');
      if (n === 3) return need(['f-condition', 'f-duration'], 'Sila isi kondisi & tempoh penyakit');
      if (n === 4) {
        if (!document.getElementById('c-data').checked || !document.getElementById('c-health').checked) {
          errEl.textContent = 'Anda perlu bersetuju dengan PDPA & Rekod Kesihatan untuk meneruskan';
          errEl.classList.remove('hidden');
          return false;
        }
      }
      return true;
    }

    function wizardNext() {
      if (!validateStep(currentStep)) return;
      if (currentStep < TOTAL_STEPS) { currentStep++; showStep(currentStep); }
    }

    function wizardBack() {
      if (currentStep > 1) { currentStep--; showStep(currentStep); }
    }

    async function loadExistingKYC() {
      if (!currentUser?.id) return;
      const rows = await dbQuery('kyc_submissions', { eq: { user_id: currentUser.id }, order: { col: 'created_at' } }).catch(() => []);
      if (rows.length > 0) {
        existingKYC = rows[0];
        showExistingStatus();
      }
    }

    function showExistingStatus() {
      const banner = document.getElementById('status-banner');
      banner.classList.remove('hidden');

      if (existingKYC.status === 'pending') {
        banner.className = 'bg-gold-light border border-gold rounded-2xl p-5 mb-6';
        banner.innerHTML = `
      <div class="flex items-center gap-4">
        <div class="text-4xl">⏳</div>
        <div class="flex-1">
          <div class="font-bold text-gold-dark">KYC Sedang Disemak</div>
          <p class="text-sm text-ink/70 mt-1">Submission anda pada ${formatDate(existingKYC.created_at)} sedang disemak oleh admin. Anda akan dimaklumkan sebaik sahaja diluluskan.</p>
        </div>
      </div>`;
        document.getElementById('kyc-form').classList.add('opacity-60', 'pointer-events-none');
        fillForm(existingKYC);
      } else if (existingKYC.status === 'approved') {
        banner.className = 'bg-green-light border border-green rounded-2xl p-5 mb-6';
        banner.innerHTML = `
      <div class="flex items-center gap-4">
        <div class="text-4xl">✅</div>
        <div class="flex-1">
          <div class="font-bold text-green-dark">KYC Diluluskan</div>
          <p class="text-sm text-ink/70 mt-1">Akaun anda telah disahkan pada ${formatDate(existingKYC.created_at)}. Anda kini ada akses penuh.</p>
        </div>
        <a href="dashboard.html" class="bg-green text-white px-4 py-2 rounded-lg text-sm font-semibold">Ke Dashboard →</a>
      </div>`;
        document.getElementById('kyc-form').classList.add('hidden');
      } else if (existingKYC.status === 'rejected') {
        banner.className = 'bg-terracotta-light border border-terracotta rounded-2xl p-5 mb-6';
        banner.innerHTML = `
      <div class="flex items-center gap-4">
        <div class="text-4xl">❌</div>
        <div class="flex-1">
          <div class="font-bold text-terracotta">KYC Ditolak</div>
          <p class="text-sm text-ink/70 mt-1">${existingKYC.review_notes || 'Sila kemaskini maklumat dan hantar semula.'}</p>
        </div>
      </div>`;
        fillForm(existingKYC);
      }
    }

    function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }
    function setVal(id, v) { const el = document.getElementById(id); if (el) el.value = v || ''; }

    function fillForm(k) {
      setVal('f-name', k.patient_name);
      setVal('f-ic', k.ic_number);
      setVal('f-dob', k.date_of_birth);
      setVal('f-gender', k.gender);
      setVal('f-phone', k.phone);
      setVal('f-address', k.address);
      setVal('f-emg-name', k.emergency_contact_name);
      setVal('f-emg-phone', k.emergency_contact_phone);
      setVal('f-condition', k.medical_condition);
      setVal('f-duration', k.condition_duration);
      setVal('f-medical-notes', k.medical_notes);
      document.getElementById('c-data').checked = k.consent_data_processing;
      document.getElementById('c-health').checked = k.consent_health_records;
      document.getElementById('c-research').checked = k.consent_research;
      document.getElementById('c-marketing').checked = k.consent_marketing;

      const reports = k.documents?.reports || [];
      const host = document.getElementById('existing-reports');
      if (host && reports.length) {
        host.innerHTML = '<div class="text-[11px] text-ink/60 font-semibold">Fail dimuat naik sebelum ini:</div>' +
          reports.map(r => `<div class="text-xs flex items-center gap-2 bg-cream/50 px-2 py-1 rounded">📎 ${r.name}</div>`).join('');
      }
    }

    async function uploadMedicalReports() {
      const files = document.getElementById('f-reports').files;
      if (!files.length) return existingKYC?.documents?.reports || [];

      const uploaded = [...(existingKYC?.documents?.reports || [])];
      for (const f of files) {
        if (f.size > 5 * 1024 * 1024) throw new Error(`${f.name} melebihi 5MB`);
        const safeName = f.name.replace(/[^a-zA-Z0-9.-]/g, '_');
        const path = `${currentUser.id}/${Date.now()}_${safeName}`;
        const { error } = await window.db.storage.from('medical-reports').upload(path, f);
        if (error) throw new Error(`Upload gagal: ${error.message}`);
        uploaded.push({ name: f.name, path, size: f.size, uploaded_at: new Date().toISOString() });
      }
      return uploaded;
    }

    async function submitKYC() {
      if (!validateStep(4)) return;

      const name = val('f-name').trim();
      const ic = val('f-ic').trim();
      const phone = val('f-phone').trim();
      const address = val('f-address').trim();
      const condition = val('f-condition').trim();
      const duration = val('f-duration');

      const errEl = document.getElementById('form-error');
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.textContent = 'Menghantar...';

      try {
        const reports = await uploadMedicalReports();
        const emgName = val('f-emg-name');
        const emgPhone = val('f-emg-phone');
        const dob = val('f-dob') || null;
        const gender = val('f-gender') || null;
        const medicalNotes = val('f-medical-notes');

        const data = {
          user_id: currentUser.id,
          patient_name: name,
          ic_number: ic,
          date_of_birth: dob,
          gender,
          phone,
          email: currentUser.email,
          address,
          emergency_contact_name: emgName,
          emergency_contact_phone: emgPhone,
          emergency_contact: `${emgName} - ${emgPhone}`,
          medical_condition: condition,
          condition_duration: duration,
          medical_notes: medicalNotes,
          documents: { reports },
          consent_data_processing: document.getElementById('c-data').checked,
          consent_health_records: document.getElementById('c-health').checked,
          consent_research: document.getElementById('c-research').checked,
          consent_marketing: document.getElementById('c-marketing').checked,
          status: 'pending',
        };

        if (existingKYC && existingKYC.status === 'rejected') {
          await dbUpdate('kyc_submissions', existingKYC.id, { ...data, review_notes: null });
        } else {
          const { error } = await window.db.from('kyc_submissions').insert(data);
          if (error) throw error;
        }

        if (patientRecord) {
          await window.db.from('patients').update({
            ic_number: ic,
            date_of_birth: dob,
            gender,
            address,
            emergency_contact_name: emgName,
            emergency_contact_phone: emgPhone,
            medical_condition: condition,
            condition_duration: duration,
            medical_notes: medicalNotes,
          }).eq('id', patientRecord.id);

          await dbUpdate('profiles', currentUser.id, { full_name: name, phone });
        }

        await auditLog('kyc.submitted', currentUser.id, { name });
        banner('KYC dihantar! Admin akan semak dalam 24 jam.');
        setTimeout(() => location.reload(), 1500);
      } catch (err) {
        errEl.textContent = 'Ralat: ' + err.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Hantar KYC →';
      }
    }

    (async () => {
      const user = await initPatient('kyc', 'Lengkapkan pengesahan identiti');
      if (!user) return;

      // Pre-fill from profile if first time
      if (user.full_name) setVal('f-name', user.full_name);
      if (user.phone) setVal('f-phone', user.phone);

      showStep(1);
      await loadExistingKYC();
    })();
  </script>
</body>

</html>
