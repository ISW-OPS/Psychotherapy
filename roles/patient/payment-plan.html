<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Payment Plan</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📅</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8">

        <button onclick="history.back()" class="inline-flex items-center gap-2 text-sm font-semibold text-navy hover:underline mb-3">← Kembali ke Plan Rawatan</button>

        <div class="mb-5 flex items-start justify-between gap-3 flex-wrap">
          <div>
            <h1 class="text-2xl font-bold text-navy-dark">Payment Plan</h1>
            <p class="text-sm text-ink/60 mt-1">Pelan ansuran dan jadual bayaran pakej anda.</p>
          </div>
        </div>

        <div id="pp-loading" class="bg-white rounded-xl border border-ink/10 p-10 text-center text-sm text-ink/50">Memuatkan…</div>
        <div id="pp-empty" class="hidden bg-white rounded-xl border border-ink/10 p-10 text-center">
          <div class="text-4xl mb-2">✅</div>
          <p class="font-semibold text-ink">Tiada Pelan Ansuran Aktif</p>
          <p class="text-sm text-ink/50 mt-1">Pakej anda bayaran penuh, atau semua ansuran telah selesai.</p>
          <a href="payment-overview.html" class="inline-flex items-center gap-2 mt-5 border border-navy/30 text-navy rounded-lg px-4 py-2 text-sm font-semibold hover:bg-navy-light">📊 Lihat Semua Pakej</a>
        </div>
        <div id="pp-content" class="hidden"></div>

      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/utils.js"></script>
<script src="_shared.js"></script>
<script src="../../shared/receipt.js"></script>
<script src="../../shared/invoice.js"></script>
<script>
const money = (n) => 'RM ' + Number(n || 0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// "Pay Now" terus jana pautan HitPay & redirect — tak singgah payment.html dulu.
// Amaun cuma utk paparan/label; payments-initiate abaikan amaun client & derive
// terus dari checkpoint seterusnya (lihat verifiedAmount() kob_installment_topup).
async function payNow(btn, kobSessionId, amount, title) {
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'Memproses…';
  try {
    const returnUrl = new URL('payment.html', location.href).href;
    const { data, error } = await window.db.functions.invoke('payments-initiate', {
      body: {
        items: [{ type: 'kob_installment_topup', kobSessionId, amount, title }],
        patientId: patientRecord.id, returnUrl,
      },
    });
    if (error) {
      let m = error.message;
      try { const c = await error.context?.json(); if (c?.error) m = c.error; } catch (_) {}
      throw new Error(m);
    }
    if (!data?.checkoutUrl) throw new Error(data?.error || 'Gagal memulakan bayaran.');
    banner('Mengalihkan ke halaman bayaran…', 'info');
    window.location.href = data.checkoutUrl; // → HitPay (FPX/kad)
  } catch (e) {
    banner('Ralat: ' + e.message, 'error');
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

async function loadPaymentPlan() {
  const { data: kobSessions } = await window.db.from('psy_kob_sessions')
    .select('id, recommended_package_name, recommended_package_price')
    .eq('patient_id', patientRecord.id).eq('package_payment_mode', 'installment')
    .eq('package_payment_status', 'partial')
    .order('created_at', { ascending: false }).limit(1);
  const kobSession = kobSessions?.[0];

  document.getElementById('pp-loading').classList.add('hidden');
  if (!kobSession) { document.getElementById('pp-empty').classList.remove('hidden'); return; }

  const [{ data: cps }, { data: paidRows }] = await Promise.all([
    window.db.from('psy_kob_installment_checkpoints').select('seq, target_cumulative, due_date, status')
      .eq('kob_session_id', kobSession.id).order('seq', { ascending: true }),
    window.db.from('psy_payments').select('id, total, created_at, receipt_url')
      .eq('status', 'completed').eq('intent->>kob_session_id', kobSession.id).order('created_at', { ascending: true }),
  ]);
  if (!cps || !cps.length) { document.getElementById('pp-empty').classList.remove('hidden'); return; }

  const totalPaid = (paidRows || []).reduce((s, p) => s + Number(p.total || 0), 0);
  // Tiap transaksi (skema baharu) lunaskan TEPAT satu checkpoint sahaja (tiada
  // amaun bebas/gabung lagi) — jadi urutan psy_payments (ikut created_at) padan
  // urutan checkpoint yg dah 'met' secara kedudukan (payment ke-i = checkpoint
  // ke-i yg selesai). Rekod lama (sebelum ciri amaun-tetap) mungkin tak padan
  // 100%, tapi tetap anggaran terbaik yg ada tanpa FK terus checkpoint↔payment.
  const paidPayments = paidRows || [];
  const commitment = Number(cps[cps.length - 1].target_cumulative);
  const remaining = Math.max(0, commitment - totalPaid);
  const nextCp = cps.find(c => Number(c.target_cumulative) > totalPaid + 0.005);
  const paidCount = cps.filter(c => Number(c.target_cumulative) <= totalPaid + 0.005).length;
  const totalCount = cps.length;

  const cpChip = {
    pending: '<span class="text-[10px] font-bold bg-ink/8 text-ink/50 px-2.5 py-1 rounded-full whitespace-nowrap">Akan Datang</span>',
    overdue: '<span class="text-[10px] font-bold bg-terracotta/15 text-terracotta px-2.5 py-1 rounded-full whitespace-nowrap">⚠️ Tertunggak</span>',
    met: '<span class="text-[10px] font-bold bg-green-light text-green-dark px-2.5 py-1 rounded-full whitespace-nowrap">✅ Dibayar</span>',
  };
  const rowChip = cp => nextCp && cp.seq === nextCp.seq
    ? '<span class="text-[10px] font-bold bg-gold/20 text-gold-dark px-2.5 py-1 rounded-full whitespace-nowrap">Due</span>'
    : (cpChip[cp.status] || cp.status);

  const payTitle = `Ansuran Pakej: ${kobSession.recommended_package_name || ''}`;
  const scheduleRows = cps.map((cp, i) => {
    const isPaid = cp.status === 'met';
    const isNext = nextCp && cp.seq === nextCp.seq;
    const payment = isPaid ? paidPayments[i] : null;
    const dueAmt = Math.max(0, Number(cp.target_cumulative) - totalPaid);
    // Amaun TETAP ansuran ni sahaja (bukan kumulatif) — target_cumulative baris ni
    // tolak target_cumulative baris sebelum (0 utk Deposit) — inilah jumlah SEBENAR
    // pesakit kena bayar utk ansuran ni, beza drpd "Jumlah Terkumpul" (running total).
    const prevCum = i === 0 ? 0 : Number(cps[i - 1].target_cumulative);
    const installmentAmt = Number(cp.target_cumulative) - prevCum;
    return `<tr class="border-t border-ink/8 ${isNext ? 'bg-navy/5' : ''}">
      <td class="px-3 py-2.5"><div class="w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-bold ${isPaid ? 'bg-green text-white' : isNext ? 'bg-navy text-white' : 'bg-ink/10 text-ink/40'}">${isPaid ? '✓' : i + 1}</div></td>
      <td class="px-3 py-2.5 text-ink">${cp.seq === 0 ? 'Deposit' : 'Ansuran ' + cp.seq}</td>
      <td class="px-3 py-2.5 text-ink">${formatDate(cp.due_date)}</td>
      <td class="px-3 py-2.5 font-semibold text-ink">${money(installmentAmt)}</td>
      <td class="px-3 py-2.5 text-ink/60">${money(cp.target_cumulative)}</td>
      <td class="px-3 py-2.5">${rowChip(cp)}</td>
      <td class="px-3 py-2.5 text-ink/60">${payment ? formatDate(payment.created_at) : '–'}</td>
      <td class="px-3 py-2.5"><div class="flex items-center gap-1.5 flex-wrap">${isNext && !payment ? `<button type="button" onclick="viewInvoice('${kobSession.id}', null, ${cp.seq}, 'installment')" title="Invois Ansuran" class="text-[11px] font-semibold border border-ink/15 text-navy px-2 py-1 rounded-lg hover:bg-navy-light hover:border-navy/30 whitespace-nowrap">📄 Invois Ansuran</button>` : ''}${payment || isNext ? `<button type="button" onclick="viewInvoice('${kobSession.id}', null, ${cp.seq}, 'plan')" title="Invois Penuh" class="text-[11px] font-semibold border border-ink/15 text-navy px-2 py-1 rounded-lg hover:bg-navy-light hover:border-navy/30 whitespace-nowrap">📑 Invois Penuh</button>` : ''}${payment ? `<a href="resit.html?id=${encodeURIComponent(payment.id)}" title="Muat Turun Resit" class="inline-flex items-center justify-center w-8 h-8 border border-ink/15 rounded-lg text-navy hover:bg-navy-light hover:border-navy/30"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></a>` : ''}${payment || isNext ? '' : '<span class="text-ink/30">–</span>'}</div></td>
      <td class="px-3 py-2.5">${isNext ? `<button type="button" onclick="payNow(this, '${kobSession.id}', ${dueAmt}, '${escapeJsAttr(payTitle)}')" class="inline-block bg-navy text-white text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-navy-dark whitespace-nowrap disabled:opacity-60">Pay Now</button>` : '<span class="text-ink/30">–</span>'}</td>
    </tr>`;
  }).join('');

  document.getElementById('pp-content').innerHTML = `
    <div class="bg-white rounded-xl border border-ink/10 p-5 mb-4">
      <div class="flex items-center justify-between flex-wrap gap-4">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-green-light text-green-dark grid place-items-center text-lg flex-shrink-0">📦</div>
          <div>
            <div class="text-[11px] text-ink/45 uppercase tracking-wide">Pakej Rawatan</div>
            <div class="font-bold text-navy-dark">${escapeHtml(kobSession.recommended_package_name || '')}</div>
          </div>
        </div>
        <div><div class="text-[11px] text-ink/45 uppercase tracking-wide">Jumlah Komitmen</div><div class="font-bold text-navy-dark">${money(commitment)}</div></div>
        <div><div class="text-[11px] text-ink/45 uppercase tracking-wide">Pelan Bayaran</div><div class="font-bold text-navy-dark">${totalCount} Ansuran</div></div>
      </div>
    </div>

    <div class="grid sm:grid-cols-3 gap-3 mb-4">
      <div class="bg-green-light/40 border border-green/20 rounded-xl p-4">
        <div class="text-xs font-semibold text-green-dark/80 mb-1">📅 Bayaran Seterusnya</div>
        ${nextCp ? `
        <div class="text-xl font-extrabold text-ink">${money(Math.max(0, Number(nextCp.target_cumulative) - totalPaid))}</div>
        <div class="text-[11px] text-ink/50 mt-0.5">Due ${formatDate(nextCp.due_date)}</div>
        <button type="button" onclick="payNow(this, '${kobSession.id}', ${Math.max(0, Number(nextCp.target_cumulative) - totalPaid)}, '${escapeJsAttr(payTitle)}')" class="inline-flex items-center gap-1 mt-2 bg-green-dark text-white text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-green disabled:opacity-60">Bayar Sekarang →</button>` : `<div class="text-sm font-bold text-green-dark">Selesai ✅</div>`}
      </div>
      <div class="bg-navy-light/40 border border-navy/15 rounded-xl p-4">
        <div class="text-xs font-semibold text-navy/70 mb-1">💰 Jumlah Dibayar</div>
        <div class="text-xl font-extrabold text-ink">${money(totalPaid)}</div>
        <div class="text-[11px] text-ink/50 mt-0.5">${paidCount} drpd ${totalCount} ansuran</div>
      </div>
      <div class="bg-gold/10 border border-gold/25 rounded-xl p-4">
        <div class="text-xs font-semibold text-gold-dark mb-1">📋 Baki Tertunggak</div>
        <div class="text-xl font-extrabold text-ink">${money(remaining)}</div>
        <div class="text-[11px] text-ink/50 mt-0.5">${totalCount - paidCount} ansuran lagi</div>
      </div>
    </div>

    <div class="bg-white rounded-xl border border-ink/10 overflow-hidden">
      <div class="px-5 py-3.5 border-b border-ink/10 font-bold text-sm text-navy-dark">📅 Jadual Bayaran Penuh</div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="bg-ink/5 text-ink/45 text-[11px] uppercase tracking-wide"><th class="text-left px-3 py-2 font-semibold">#</th><th class="text-left px-3 py-2 font-semibold">Ansuran</th><th class="text-left px-3 py-2 font-semibold">Tarikh Due</th><th class="text-left px-3 py-2 font-semibold">Perlu Dibayar</th><th class="text-left px-3 py-2 font-semibold">Jumlah Terkumpul</th><th class="text-left px-3 py-2 font-semibold">Status</th><th class="text-left px-3 py-2 font-semibold">Tarikh Bayar</th><th class="text-left px-3 py-2 font-semibold">Resit</th><th class="text-left px-3 py-2 font-semibold">Tindakan</th></tr></thead>
          <tbody>${scheduleRows}</tbody>
        </table>
      </div>
    </div>`;

  document.getElementById('pp-content').classList.remove('hidden');
}

(async () => {
  const user = await initPatient('payment_plan', 'Pelan ansuran & jadual bayaran pakej anda');
  if (!user) return;
  await loadPaymentPlan();
})();
</script>
</body>
</html>
