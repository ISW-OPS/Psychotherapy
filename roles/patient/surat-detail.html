<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Butiran Permohonan Surat</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
  .dtab { padding: 8px 4px; font-size: 13px; font-weight: 600; color: rgba(0,0,0,0.45); border-bottom: 2px solid transparent; background: transparent; }
  .dtab.active { color: #1e3a5f; border-bottom-color: #1e3a5f; }
  .preview-frame { background:#e7eaef; overflow:auto; max-height:75vh; min-height:400px; padding:28px; display:flex; justify-content:center; }
  .preview-frame iframe { width:794px; height:1123px; flex-shrink:0; border:0; display:block; background:white; box-shadow:0 2px 16px rgba(0,0,0,0.15); }
</style>
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📄</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-5">
        <div class="text-xs text-ink/40">
          <a href="surat.html" class="hover:text-navy hover:underline">Surat Rasmi</a> <span class="mx-1">›</span>
          <span class="text-ink/70 font-medium">Butiran Permohonan</span>
        </div>

        <div class="flex items-start justify-between gap-4 flex-wrap">
          <div>
            <h2 class="text-xl font-bold text-navy">Butiran Permohonan Surat</h2>
            <p class="text-xs text-ink/50 mt-0.5">Status dan butiran permohonan surat anda.</p>
          </div>
          <div id="header-actions" class="flex items-center gap-2"></div>
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 p-5">
          <div class="flex items-start justify-between flex-wrap gap-3">
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 text-sm flex-1">
              <div><div class="text-[10px] text-ink/40 uppercase">Jenis Surat</div><div id="i-type" class="font-semibold mt-0.5">—</div></div>
              <div><div class="text-[10px] text-ink/40 uppercase">Tarikh Mohon</div><div id="i-submitted" class="font-semibold mt-0.5">—</div></div>
              <div><div class="text-[10px] text-ink/40 uppercase">Kemas Kini Terakhir</div><div id="i-updated" class="font-semibold mt-0.5">—</div></div>
            </div>
            <span id="status-chip" class="text-xs font-semibold px-3 py-1.5 rounded-full flex-shrink-0">—</span>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-ink/10 overflow-hidden">
          <div class="flex items-center gap-1 px-5 border-b border-ink/8">
            <button onclick="setDTab('info')" id="dtab-info" class="dtab active">Maklumat</button>
            <button onclick="setDTab('attach')" id="dtab-attach" class="dtab">Lampiran (<span id="dtab-attach-count">0</span>)</button>
            <button onclick="setDTab('timeline')" id="dtab-timeline" class="dtab">Sejarah Aktiviti</button>
            <button onclick="setDTab('letter')" id="dtab-letter" class="dtab hidden">Surat</button>
          </div>

          <div id="dpane-info" class="p-5 space-y-3 text-sm">
            <div><div class="text-[10px] text-ink/40 uppercase">Sebab / Tujuan</div><div id="info-reason" class="mt-0.5 whitespace-pre-line">—</div></div>
            <div id="info-reject-wrap" class="hidden bg-terracotta-light/40 border border-terracotta/20 rounded-xl p-3">
              <div class="text-[10px] text-terracotta uppercase font-semibold">Sebab Ditolak</div>
              <div id="info-reject" class="mt-0.5 text-sm">—</div>
            </div>
            <div id="info-revision-wrap" class="hidden bg-teal/10 border border-teal/20 rounded-xl p-3">
              <div class="text-[10px] text-teal uppercase font-semibold">Perlu Disemak</div>
              <div id="info-revision" class="mt-0.5 text-sm">—</div>
            </div>
          </div>

          <div id="dpane-attach" class="hidden p-5">
            <div id="attach-list" class="space-y-1.5"></div>
            <div id="attach-empty" class="hidden text-sm text-ink/40 italic text-center py-6">Tiada lampiran</div>
          </div>

          <div id="dpane-timeline" class="hidden p-5">
            <div id="timeline-list" class="space-y-4"></div>
          </div>

          <div id="dpane-letter" class="hidden p-4">
            <div class="preview-frame"><iframe id="preview-iframe" sandbox="allow-same-origin"></iframe></div>
            <button onclick="openLetterView()" class="mt-3 bg-navy text-white px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-navy-dark">📄 Buka / Cetak</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-navy-dark text-white py-2 justify-around z-20">
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🏠</span>Home</a>
    <a href="plan.html"      class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>💊</span>Plan</a>
    <a href="shop.html"      class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🛒</span>Shop</a>
    <a href="profile.html"   class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>👤</span>Profile</a>
  </nav>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="../../shared/letterTemplates.js"></script>
<script src="_shared.js"></script>
<script>
const LOGO_URL = '../../image/Logo_ISW.png';
const reqId = new URLSearchParams(location.search).get('id');
let req = null, issuedRow = null, issuedLetterHtml = null;

function escHtml(s) { return (s || '').replace(/</g,'&lt;'); }
function fmtDate(d) { return d ? new Date(d).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—'; }

const STATUS_CHIP = {
  draft:              { label: 'Draf',              cls: 'bg-ink/10 text-ink/60' },
  submitted:          { label: 'Menunggu Kelulusan', cls: 'bg-gold/30 text-gold-dark' },
  pending_approval:   { label: 'Menunggu Kelulusan', cls: 'bg-gold/30 text-gold-dark' },
  revision_requested: { label: 'Perlu Semakan Anda', cls: 'bg-teal/20 text-teal' },
  rejected:           { label: 'Ditolak',            cls: 'bg-terracotta-light text-terracotta' },
  issued:             { label: 'Selesai',            cls: 'bg-green-light text-green-dark' },
  cancelled:          { label: 'Dibatalkan',         cls: 'bg-ink/10 text-ink/60' },
};

function setDTab(t) {
  ['info','attach','timeline','letter'].forEach(k => {
    document.getElementById('dtab-' + k)?.classList.toggle('active', k === t);
    document.getElementById('dpane-' + k)?.classList.toggle('hidden', k !== t);
  });
}
window.setDTab = setDTab;

function renderRequestInfo() {
  const chip = STATUS_CHIP[req.status] || { label: req.status, cls: 'bg-ink/10 text-ink/60' };
  document.getElementById('status-chip').textContent = chip.label;
  document.getElementById('status-chip').className = 'text-xs font-semibold px-3 py-1.5 rounded-full flex-shrink-0 ' + chip.cls;
  document.getElementById('i-type').textContent = req.template_name || '—';
  document.getElementById('i-submitted').textContent = fmtDate(req.created_at);
  document.getElementById('i-updated').textContent = fmtDate(req.updated_at);
  document.getElementById('info-reason').textContent = req.reason || '—';
  document.getElementById('info-reject-wrap').classList.toggle('hidden', req.status !== 'rejected');
  document.getElementById('info-reject').textContent = req.reject_reason || '—';
  document.getElementById('info-revision-wrap').classList.toggle('hidden', req.status !== 'revision_requested');
  document.getElementById('info-revision').textContent = req.revision_note || '—';

  const wrap = document.getElementById('header-actions');
  wrap.innerHTML = ['draft','revision_requested'].includes(req.status)
    ? `<a href="surat.html?edit=${req.id}" class="border border-ink/20 text-ink/70 px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-cream">✏️ Edit Permohonan</a>`
    : '';

  const isIssued = req.status === 'issued';
  document.getElementById('dtab-letter').classList.toggle('hidden', !isIssued);
  if (isIssued) setDTab('letter');
}

async function loadIssuedInfo() {
  const { data } = await window.db.from('psy_letter_issued').select('*').eq('request_id', req.id).maybeSingle();
  if (!data) return;
  issuedRow = data;
  const { data: tplRows } = await window.db.from('psy_letter_templates').select('*').eq('name', data.template_name).limit(1);
  const t = tplRows?.[0] || { name: data.template_name, body: '', recipient: '', title: data.template_name };
  issuedLetterHtml = renderLetterFull({
    logoUrl: LOGO_URL, template: t, values: data.field_values || {}, refNumber: data.ref_number,
    signerName: data.signed_by_name, signerRole: data.signed_by_role || '', signatureDataUrl: data.signature_url || null,
    todayStr: new Date(data.signed_at).toLocaleDateString('en-GB', { day:'2-digit', month:'long', year:'numeric' }),
  });
  const iframe = document.getElementById('preview-iframe');
  const doc = iframe.contentDocument;
  doc.open(); doc.write(`<html><head><style>html,body{margin:0}</style></head><body>${issuedLetterHtml}</body></html>`); doc.close();
}

function openLetterView() {
  if (!issuedRow || !issuedLetterHtml) return;
  openLetterTab(issuedLetterHtml, issuedRow.template_name + ' — ' + issuedRow.ref_number);
}
window.openLetterView = openLetterView;

async function loadAttachments() {
  const { data } = await window.db.from('psy_letter_request_attachments').select('*').eq('request_id', req.id).order('created_at', { ascending: false });
  const rows = data || [];
  document.getElementById('dtab-attach-count').textContent = rows.length;
  document.getElementById('attach-empty').classList.toggle('hidden', rows.length > 0);
  document.getElementById('attach-list').innerHTML = rows.map(a => `
    <div class="flex items-center justify-between px-3 py-2.5 bg-cream/40 rounded-lg text-sm">
      <div class="flex items-center gap-2 min-w-0">
        <span>📄</span>
        <div class="min-w-0">
          <div class="font-medium truncate">${escHtml(a.file_name)}</div>
          <div class="text-[11px] text-ink/45">${a.file_size ? Math.round(a.file_size/1024) + ' KB · ' : ''}${fmtDate(a.created_at)}</div>
        </div>
      </div>
      <button onclick="downloadAttachment('${a.file_path}')" class="text-navy text-xs font-semibold hover:underline flex-shrink-0 ml-2">⭳ Download</button>
    </div>`).join('');
}

async function downloadAttachment(path) {
  const { data, error } = await window.db.storage.from('letter-attachments').createSignedUrl(path, 300);
  if (error || !data?.signedUrl) { banner('Gagal muat turun', 'error'); return; }
  window.open(data.signedUrl, '_blank');
}
window.downloadAttachment = downloadAttachment;

const TIMELINE_LABEL = {
  'letter.request_created':    { icon: '📝', label: 'Permohonan dicipta' },
  'letter.request_submitted':  { icon: '📤', label: 'Permohonan dihantar semula' },
  'letter.revision_requested': { icon: '🔄', label: 'Diminta semakan semula' },
  'letter.request_rejected':   { icon: '✕',  label: 'Ditolak' },
  'letter.issued':             { icon: '✅', label: 'Surat dikeluarkan' },
  'letter.auto_issued':        { icon: '⚡', label: 'Surat auto-diterbitkan' },
};

async function loadTimeline() {
  const { data } = await window.db.from('psy_audit_log').select('*').eq('target', req.id).order('created_at', { ascending: true });
  const rows = data || [];
  const list = document.getElementById('timeline-list');
  if (!rows.length) { list.innerHTML = '<div class="text-sm text-ink/40 italic text-center py-6">Tiada aktiviti direkod</div>'; return; }
  list.innerHTML = rows.map(r => {
    const meta = TIMELINE_LABEL[r.action] || { icon: '•', label: r.action };
    const reason = r.meta?.reason || r.meta?.note;
    return `<div class="flex gap-3">
      <div class="w-7 h-7 rounded-full bg-navy-light text-navy flex items-center justify-center text-xs flex-shrink-0">${meta.icon}</div>
      <div class="min-w-0 flex-1 pb-3 border-b border-ink/5 last:border-0">
        <div class="text-sm font-semibold text-ink">${meta.label}</div>
        <div class="text-[11px] text-ink/45">${fmtDate(r.created_at)}</div>
        ${reason ? `<div class="text-xs text-ink/60 mt-1">${escHtml(reason)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

(async () => {
  const user = await initPatient('surat', 'Butiran permohonan surat');
  if (!user) return;
  if (!reqId) { banner('Permohonan tidak ditemui', 'error'); setTimeout(() => location.href = 'surat.html', 800); return; }

  const { data } = await window.db.from('psy_letter_requests').select('*').eq('id', reqId).maybeSingle();
  if (!data) { banner('Permohonan tidak ditemui', 'error'); setTimeout(() => location.href = 'surat.html', 800); return; }
  req = data;

  renderRequestInfo();
  await loadAttachments();
  await loadTimeline();
  if (req.status === 'issued') await loadIssuedInfo();
})();
</script>
</body>
</html>
