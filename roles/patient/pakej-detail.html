<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Pakej Detail</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📦</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8 space-y-6">
        <!-- Back link (uses browser history so it returns to wherever user came from) -->
        <button onclick="goBackSmart()" class="text-sm text-navy hover:underline flex items-center gap-1">← Kembali</button>

        <!-- Hero -->
        <div id="detail-hero" class="rounded-2xl p-8 text-center"></div>

        <!-- Info grid -->
        <div class="grid md:grid-cols-3 gap-4">
          <div class="bg-white rounded-xl p-5 border border-ink/10 text-center">
            <div class="text-xs text-ink/60 uppercase font-semibold">Tempoh</div>
            <div id="detail-duration" class="text-xl font-bold mt-1 text-navy"></div>
          </div>
          <div class="bg-white rounded-xl p-5 border border-ink/10 text-center">
            <div class="text-xs text-ink/60 uppercase font-semibold">Jumlah Item</div>
            <div id="detail-items-count" class="text-xl font-bold mt-1 text-navy"></div>
          </div>
          <div class="bg-white rounded-xl p-5 border border-ink/10 text-center">
            <div class="text-xs text-ink/60 uppercase font-semibold">Harga</div>
            <div id="detail-price" class="text-xl font-bold mt-1 text-navy"></div>
          </div>
        </div>

        <!-- Products -->
        <div id="section-products" class="bg-white rounded-xl p-5 border border-ink/10 hidden">
          <h3 class="font-bold mb-3">🎁 Produk yang anda terima</h3>
          <div id="detail-products" class="grid md:grid-cols-2 gap-2"></div>
        </div>

        <!-- Bimbingan -->
        <div id="section-bimbingan" class="bg-white rounded-xl p-5 border border-ink/10 hidden">
          <h3 class="font-bold mb-3">🎯 Bimbingan & Terapi</h3>
          <div id="detail-bimbingan" class="grid md:grid-cols-2 gap-2"></div>
        </div>

        <!-- Treatment Plan Preview (BPS-S) -->
        <div id="plan-preview" class="hidden">
          <h3 class="font-bold mb-3">📋 Treatment Plan yang akan dicipta</h3>
          <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-3">
            <div class="bg-white rounded-xl p-4 border-t-4 border-navy">
              <div class="text-xs text-navy font-semibold mb-2">🧬 BIO · Fizikal</div>
              <ul id="preview-bio" class="text-xs text-ink/70 space-y-1"></ul>
            </div>
            <div class="bg-white rounded-xl p-4 border-t-4 border-terracotta">
              <div class="text-xs text-terracotta font-semibold mb-2">🧠 PSYCHO · Mental</div>
              <ul id="preview-psycho" class="text-xs text-ink/70 space-y-1"></ul>
            </div>
            <div class="bg-white rounded-xl p-4 border-t-4 border-gold-dark">
              <div class="text-xs text-gold-dark font-semibold mb-2">👥 SOCIAL · Komuniti</div>
              <ul id="preview-social" class="text-xs text-ink/70 space-y-1"></ul>
            </div>
            <div class="bg-white rounded-xl p-4 border-t-4 border-green-dark">
              <div class="text-xs text-green-dark font-semibold mb-2">🕌 SPIRITUAL · Rohani</div>
              <ul id="preview-spiritual" class="text-xs text-ink/70 space-y-1"></ul>
            </div>
          </div>
        </div>

        <!-- CTA -->
        <div id="cta-section" class="bg-white rounded-xl p-6 border border-ink/10 sticky bottom-0">
          <div class="flex items-center justify-between gap-4 flex-wrap">
            <div>
              <div id="cta-name" class="font-bold text-lg"></div>
              <div id="cta-price" class="text-navy font-bold text-xl"></div>
            </div>
            <div id="cta-action">
              <span class="bg-cream text-ink/50 px-6 py-3 rounded-xl text-sm italic">Pakej dipilih oleh doktor semasa sesi KOB</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
// Load package from DB
async function loadPackageFromDB(pkgId) {
  const rows = await dbQuery('psy_packages', { eq: { package_id: pkgId } }).catch(() => []);
  if (!rows.length) return null;
  const r = rows[0];
  return {
    id: r.package_id, name: r.name, desc: r.description, price: Number(r.price),
    duration: r.duration, duration_weeks: r.duration_weeks, duration_unit: r.duration_unit || 'week', icon: r.icon,
    image_url: r.image_url || null,
    bg: r.bg_color, tier: r.tier,
    products: r.products || [], bimbingan: r.bimbingan || [],
    inclusions: r.inclusions || [],
    coaching_schedule: r.coaching_schedule || [],
    bio_goals: r.bio_goals || [], psycho_goals: r.psycho_goals || [],
    social_goals: r.social_goals || [], spiritual_goals: r.spiritual_goals || [],
  };
}

// Inline template getter — reads from package data directly
function getPlanTemplate(packageId, packageName, pkg) {
  if (!pkg) return null;
  return {
    name: `${pkg.name} Treatment Plan`,
    duration_weeks: pkg.duration_weeks || 12,
    duration_unit: pkg.duration_unit || 'week',
    bio: pkg.bio_goals,
    psycho: pkg.psycho_goals,
    social: pkg.social_goals,
    spiritual: pkg.spiritual_goals,
    coaching_schedule: pkg.coaching_schedule || [],
  };
}
window.getPlanTemplate = getPlanTemplate;
</script>
<script>
let currentPkg = null;

function renderDetail(p) {
  currentPkg = p;
  const priceDisplay = p.price === 0 ? 'PERCUMA' : `RM ${p.price.toFixed(2)}`;
  const tierBadge = p.tier === 'vip' ? '<span class="chip bg-gold text-white">VIP</span>' :
                    p.tier === 'free' ? '<span class="chip bg-green text-white">FREE</span>' : '';

  if (p.image_url) {
    document.getElementById('detail-hero').className = 'rounded-2xl overflow-hidden relative';
    document.getElementById('detail-hero').innerHTML = `
      <img src="${p.image_url}" class="w-full h-56 object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/65 to-transparent flex flex-col justify-end p-6 text-white">
        ${tierBadge ? `<div class="mb-2">${tierBadge}</div>` : ''}
        <h1 class="text-2xl font-bold">${p.name}</h1>
        <p class="text-sm opacity-80 mt-1">${p.desc}</p>
      </div>`;
  } else {
    document.getElementById('detail-hero').className = `${p.bg} rounded-2xl p-8 text-center`;
    document.getElementById('detail-hero').innerHTML = `
      <div class="text-7xl mb-4">${p.icon || '📦'}</div>
      <div class="flex items-center justify-center gap-2">${tierBadge}</div>
      <h1 class="text-2xl font-bold mt-2">${p.name}</h1>
      <p class="text-sm text-ink/70 mt-1">${p.desc}</p>`;
  }

  document.getElementById('detail-duration').textContent = p.duration || '—';
  document.getElementById('detail-items-count').textContent = p.inclusions.length + ' item';
  document.getElementById('detail-price').textContent = priceDisplay;

  if ((p.products || []).length) {
    document.getElementById('section-products').classList.remove('hidden');
    document.getElementById('detail-products').innerHTML = p.products
      .map(pr => `<div class="flex items-start gap-2 p-2 bg-green-light/30 rounded-lg text-sm"><span class="text-green mt-0.5">✓</span><span>${pr}</span></div>`).join('');
  }

  if ((p.bimbingan || []).length) {
    document.getElementById('section-bimbingan').classList.remove('hidden');
    document.getElementById('detail-bimbingan').innerHTML = p.bimbingan
      .map(b => `<div class="flex items-start gap-2 p-2 bg-navy-light/30 rounded-lg text-sm"><span class="text-navy mt-0.5">●</span><span>${b}</span></div>`).join('');
  }

  // Show treatment plan preview only if goals exist
  const template = getPlanTemplate(p.id, p.name, p);
  const totalGoals = ['bio','psycho','social','spiritual'].reduce((n, k) => n + (template?.[k]?.length || 0), 0);
  if (template && totalGoals > 0) {
    document.getElementById('plan-preview').classList.remove('hidden');
    const cols = { bio:'border-navy', psycho:'border-terracotta', social:'border-gold-dark', spiritual:'border-green-dark' };
    document.getElementById('plan-preview').querySelector('.grid').innerHTML =
      Object.keys(cols).filter(k => (template[k] || []).length > 0).map(k => `
        <div class="bg-white rounded-xl p-4 border-t-4 ${cols[k]}">
          <div class="text-xs font-semibold mb-2 ${{bio:'text-navy',psycho:'text-terracotta',social:'text-gold-dark',spiritual:'text-green-dark'}[k]}">
            ${{bio:'🧬 BIO · Fizikal',psycho:'🧠 PSYCHO · Mental',social:'👥 SOCIAL · Komuniti',spiritual:'🕌 SPIRITUAL · Rohani'}[k]}
          </div>
          <ul class="text-xs text-ink/70 space-y-1">${template[k].map(g => `<li>• ${g}</li>`).join('')}</ul>
        </div>`).join('');
  }

  document.getElementById('cta-name').textContent = p.name;
  document.getElementById('cta-price').textContent = priceDisplay;

  // Check subscription status
  const activeId = patientRecord?.active_package_id;
  const hasActive = !!activeId && (!patientRecord?.package_expires_at || new Date(patientRecord.package_expires_at) >= new Date());
  const isThisActive = activeId === p.id;
  const isDifferentActive = hasActive && !isThisActive;

  const ctaAction = document.getElementById('cta-action');
  const kobDone = patientRecord?.kob_status === 'completed';
  if (isThisActive) {
    ctaAction.innerHTML = '<span class="bg-green text-white px-6 py-3 rounded-xl font-semibold text-sm">✓ Pakej Anda (Aktif)</span>';
  } else if (isDifferentActive) {
    ctaAction.innerHTML = '<span class="bg-cream text-ink/50 px-6 py-3 rounded-xl text-sm italic">Anda sudah ada pakej aktif</span>';
  } else if (!kobDone) {
    // First-time patient — must complete KOB first
    ctaAction.innerHTML = '<span class="bg-cream text-ink/50 px-6 py-3 rounded-xl text-sm italic">Pakej dipilih oleh doktor semasa KOB</span>';
  } else {
    // KOB done, no active package — patient can self-purchase (renewal/continuity)
    const label = p.price === 0 ? 'Aktifkan Pakej' : 'Beli Pakej';
    ctaAction.innerHTML = `<button onclick="tempahPakej()" class="bg-navy text-white px-6 py-3 rounded-xl font-semibold text-sm hover:bg-navy-dark">${label} →</button>`;
  }
}

function tempahPakej() {
  if (!currentPkg) return;

  // Double-check: prevent duplicate subscription
  const activeId = patientRecord?.active_package_id;
  const hasActive = !!activeId && (!patientRecord?.package_expires_at || new Date(patientRecord.package_expires_at) >= new Date());
  if (hasActive && activeId !== currentPkg.id) {
    banner('Anda sudah ada pakej aktif. Selesaikan dulu sebelum tempah baru.', 'error');
    return;
  }

  if (currentPkg.price === 0) {
    // Free — activate immediately (need purchasePackage from pakej.html logic)
    if (!confirm(`Aktifkan pakej ${currentPkg.name} (PERCUMA)?`)) return;
    activateFreePackage();
  } else {
    if (!confirm(`Tempah pakej ${currentPkg.name} (RM ${currentPkg.price.toFixed(2)})? Akan redirect ke payment.`)) return;
    localStorage.setItem('isw_pending_payment', JSON.stringify({
      type: 'package',
      packageId: currentPkg.id,
      packageName: currentPkg.name,
      title: `Pakej: ${currentPkg.name}`,
      amount: currentPkg.price,
    }));
    window.location.href = 'payment.html';
  }
}

async function activateFreePackage() {
  if (!patientRecord) { banner('Rekod pesakit belum aktif', 'error'); return; }
  const expiresAt = new Date();
  expiresAt.setMonth(expiresAt.getMonth() + 3);

  const { error } = await window.db.from('psy_package_purchases').insert({
    patient_id: patientRecord.id,
    package_id: currentPkg.id,
    package_name: currentPkg.name,
    price: 0,
    expires_at: expiresAt.toISOString(),
    status: 'active',
  });
  if (error) { banner('Ralat: ' + error.message, 'error'); return; }

  await window.db.from('psy_patients').update({
    active_package_id: currentPkg.id,
    active_package_name: currentPkg.name,
    package_purchased_at: new Date().toISOString(),
    package_expires_at: expiresAt.toISOString(),
  }).eq('id', patientRecord.id);

  // Auto-create treatment plan (skip if already exists — race guard)
  const existingPlans = await dbQuery('psy_treatment_plans', { eq: { patient_id: patientRecord.id, status: 'active' } }).catch(() => []);
  if (existingPlans.length > 0) {
    banner(`Pakej ${currentPkg.name} diaktifkan!`);
    setTimeout(() => { window.location.href = 'plan.html'; }, 1500);
    return;
  }
  const template = getPlanTemplate(currentPkg.id, currentPkg.name, currentPkg);
  await window.db.from('psy_treatment_plans').insert({
    patient_id: patientRecord.id,
    doctor_id: null,
    name: template.name,
    duration_unit: template.duration_unit,
    duration_weeks: template.duration_weeks,
    current_week: 1,
    bio_goals: template.bio,
    psycho_goals: template.psycho,
    social_goals: template.social,
    spiritual_goals: template.spiritual,
    coaching_schedule: template.coaching_schedule,
    status: 'active',
  });

  banner(`Pakej ${currentPkg.name} diaktifkan!`);
  setTimeout(() => { window.location.href = 'plan.html'; }, 1500);
}

(async () => {
  const user = await initPatient('pakej', 'Detail pakej rawatan');
  if (!user) return;

  // Support both query string (?id=xxx) and hash (#id=xxx) for compatibility
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const pkgId = new URLSearchParams(window.location.search).get('id') || hashParams.get('id');
  if (!pkgId) { window.location.href = 'pakej.html'; return; }

  const pkg = await loadPackageFromDB(pkgId);
  if (!pkg) { window.location.href = 'pakej.html'; return; }

  setHeaderBack('pakej.html', 'Kembali ke Senarai Pakej');
  renderHeader(pkg.name, pkg.desc);
  renderDetail(pkg);
})();

// Smart back: use browser history if there's a referrer from this app, else fall back to pakej.html
function goBackSmart() {
  if (document.referrer && document.referrer.includes(location.host)) {
    history.back();
  } else {
    location.href = 'pakej.html';
  }
}
</script>
</body>
</html>
