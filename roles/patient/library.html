<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Self-Help Library</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📚</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>
      <div id="content" class="p-4 md:p-8 space-y-6">
        <input id="library-search" type="text" placeholder="Cari artikel, video, doa..." oninput="filterLibrary()" class="w-full bg-white border border-ink/20 rounded-lg px-4 py-3 focus:border-navy focus:ring-2 focus:ring-navy/20 outline-none">
        <div id="library-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
    </main>
  </div>
  <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-navy-dark text-white py-2 justify-around z-20">
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🏠</span>Home</a>
    
    <a href="plan.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>💊</span>Plan</a>
    <a href="shop.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🛒</span>Shop</a>
    <a href="profile.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>👤</span>Profile</a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let LIBRARY_ITEMS = [];

async function loadLibraryFromDB() {
  const rows = await dbQuery('library_items', { eq: { is_active: true }, order: { col: 'sort_order', asc: true } }).catch(() => []);
  LIBRARY_ITEMS = rows.map(r => ({
    itemId: r.item_id,
    type: r.content_type,
    cat: r.category,
    title: r.title,
    desc: r.description,
    icon: r.icon,
    grad: r.gradient,
    url: r.content_url,
  }));
}
const catMap = { navy:'bg-navy-light text-navy', green:'bg-green-light text-green-dark', terracotta:'bg-terracotta-light text-terracotta', gold:'bg-gold-light text-gold-dark', teal:'bg-teal/10 text-teal', ink:'bg-ink/10 text-ink' };

function renderLibrary(items) {
  document.getElementById('library-grid').innerHTML = items.length
    ? items.map(it => `
      <div onclick="window.location.href='library-detail.html?id=${it.itemId}'" class="bg-white rounded-xl overflow-hidden border border-ink/10 hover:shadow-md cursor-pointer transition-shadow">
        <div class="aspect-video bg-gradient-to-br ${it.grad} flex items-center justify-center text-5xl">${it.icon}</div>
        <div class="p-4">
          <span class="chip ${catMap[it.cat]}">${it.type}</span>
          <div class="font-semibold text-sm mt-2">${it.title}</div>
          <div class="text-xs text-ink/60 mt-1">${it.desc}</div>
        </div>
      </div>`).join('')
    : '<p class="col-span-3 text-ink/40 text-sm text-center py-8">Tiada kandungan dijumpai</p>';
}

function filterLibrary() {
  const q = document.getElementById('library-search').value.toLowerCase();
  const filtered = LIBRARY_ITEMS.filter(it =>
    it.title.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q) || it.type.toLowerCase().includes(q)
  );
  renderLibrary(filtered);
}

(async () => {
  const user = await initPatient('library', 'Artikel, video, zikir & doa');
  if (!user) return;
  await loadLibraryFromDB();
  renderLibrary(LIBRARY_ITEMS);
})();
</script>
</body>
</html>
