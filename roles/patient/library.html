<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Library Content</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
.lib-tab { padding:10px 2px; border-bottom:2px solid transparent; color:#6b7280; font-weight:600; font-size:14px; cursor:pointer; }
.lib-tab.active { color:#1a3a5c; border-bottom-color:#1a3a5c; }
.cat-row { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:10px; cursor:pointer; font-size:13px; }
.cat-row:hover { background:#f5f3ee; }
.cat-row.active { background:#eef2ff; color:#1a3a5c; font-weight:700; }
</style>
</head>
<body class="min-h-screen bg-cream">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📚</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-6 space-y-5">
        <div>
          <h1 class="text-2xl font-bold text-ink">Library Content</h1>
          <p class="text-sm text-ink/50 mt-0.5">Akses pelbagai video, artikel dan FAQ untuk menyokong kesihatan anda.</p>
        </div>

        <!-- Tabs -->
        <div class="border-b border-ink/10 flex items-center gap-6 overflow-x-auto">
          <button class="lib-tab active" data-type="all" onclick="setTab('all')">Semua Kandungan</button>
          <button class="lib-tab" data-type="video" onclick="setTab('video')">Video</button>
          <button class="lib-tab" data-type="article" onclick="setTab('article')">Artikel</button>
          <button class="lib-tab" data-type="faq" onclick="window.location.href='faq.html'">FAQ</button>
          <button class="lib-tab" data-type="saved" onclick="setTab('saved')">🔖 Disimpan</button>
        </div>

        <div class="grid lg:grid-cols-[1fr_290px] gap-5 items-start">
          <!-- MAIN -->
          <div class="space-y-4">
            <!-- Filters -->
            <div class="flex flex-wrap items-center gap-3">
              <div class="relative flex-1 min-w-[200px]">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink/35">🔍</span>
                <input id="f-search" oninput="applyFilters()" placeholder="Cari kandungan..." class="w-full pl-9 pr-3 py-2.5 bg-white border border-ink/15 rounded-xl text-sm focus:border-navy outline-none">
              </div>
              <select id="f-jenis" onchange="syncJenis()" class="bg-white border border-ink/15 rounded-xl px-3 py-2.5 text-sm">
                <option value="">Semua Jenis</option><option value="video">Video</option><option value="article">Artikel</option><option value="faq">FAQ</option>
              </select>
              <select id="f-sort" onchange="applyFilters()" class="bg-white border border-ink/15 rounded-xl px-3 py-2.5 text-sm">
                <option value="new">Terbaru</option><option value="old">Terlama</option>
              </select>
              <button onclick="resetFilters()" class="bg-white border border-ink/15 rounded-xl px-4 py-2.5 text-sm font-semibold text-ink/70 hover:bg-ink/5">↻ Reset</button>
            </div>

            <!-- List -->
            <div id="lib-list" class="space-y-3"></div>
            <div id="lib-empty" class="hidden text-center text-sm text-ink/40 py-12 bg-white rounded-2xl border border-ink/10">Tiada kandungan dijumpai</div>

            <!-- Pagination -->
            <div class="flex items-center justify-between flex-wrap gap-3 pt-1">
              <span id="page-info" class="text-xs text-ink/55">—</span>
              <div id="pager" class="flex items-center gap-1"></div>
            </div>
          </div>

          <!-- SIDEBAR -->
          <aside class="space-y-5">
            <div class="bg-white rounded-2xl border border-ink/10 p-4">
              <h3 class="font-bold text-ink text-sm mb-2 px-1">Kategori</h3>
              <div id="cat-list" class="space-y-0.5"></div>
              <button onclick="setCat('')" class="w-full text-left px-2 mt-1 text-xs font-semibold text-navy hover:underline">Lihat Semua →</button>
            </div>

            <div class="bg-blue-50 border border-blue-200 rounded-2xl p-4 text-xs text-blue-900 flex items-start gap-2">
              <span class="text-blue-500">ⓘ</span>
              <div><strong>Tip Kesihatan</strong><br>Luangkan masa 10 minit setiap hari untuk membaca atau menonton kandungan kesihatan untuk kehidupan lebih sihat.</div>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>
  <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-navy-dark text-white py-2 justify-around z-20">
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🏠</span>Home</a>
    <a href="plan.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>💊</span>Plan</a>
    <a href="shop.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🛒</span>Shop</a>
    <a href="profile.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>👤</span>Profile</a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const PAGE_SIZE=8;
let ITEMS=[], PKG_MAP={}, ALL_PKG=[], SAVED=new Set(), patientPkg=null;
const state={ tab:'all', cat:'', page:1 };

function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const JENIS={ video:{l:'Video',c:'bg-purple-100 text-purple-700'}, article:{l:'Artikel',c:'bg-emerald-100 text-emerald-700'}, faq:{l:'FAQ',c:'bg-amber-100 text-amber-700'}, pdf:{l:'PDF',c:'bg-rose-100 text-rose-700'}, course:{l:'Course',c:'bg-indigo-100 text-indigo-700'}, image:{l:'Gambar',c:'bg-teal-100 text-teal-700'} };
const ICON={ video:'🎬', article:'📝', faq:'❓', pdf:'📄', course:'🎓', image:'🖼️' };
function typeOf(it){ if(it.media_type) return it.media_type; const u=(it.content_url||'').toLowerCase();
  if((it.content_type||'').toLowerCase().includes('faq'))return'faq';
  if(/\.(mp4|webm|mov)/.test(u)||u.includes('youtu'))return'video';
  if(/\.(jpg|jpeg|png|gif|webp)/.test(u))return'image';
  if(/\.pdf/.test(u)||u.includes('drive.google'))return'pdf'; return'article'; }

function isLocked(it){ const ids=Array.isArray(it.package_ids)?it.package_ids:[]; if(!ids.length) return false; return !(patientPkg && ids.includes(patientPkg)); }
function aksesBadge(it){
  const ids=Array.isArray(it.package_ids)?it.package_ids:[];
  if(!ids.length) return '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-100 text-emerald-700">Semua Pakej</span>';
  const names=ids.map(id=>PKG_MAP[id]||id).join(' & ');
  return `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-indigo-100 text-indigo-700">${escH(names)}</span>`;
}
function thumb(it){
  const t=typeOf(it);
  const dur=(t==='video'&&it.duration)?`<span class="absolute bottom-1 right-1 bg-black/70 text-white text-[9px] font-semibold px-1 rounded">${escH(it.duration)}</span>`:'';
  const lock=isLocked(it)?'<span class="absolute inset-0 bg-black/45 flex items-center justify-center text-white text-2xl">🔒</span>':(t==='video'?'<span class="absolute inset-0 flex items-center justify-center text-white text-2xl drop-shadow">▶️</span>':'');
  const inner=it.thumbnail_url
    ? `<img src="${escH(it.thumbnail_url)}" class="w-full h-full object-cover">`
    : `<div class="w-full h-full bg-gradient-to-br ${it.gradient||'from-navy to-teal'} flex items-center justify-center text-2xl">${it.icon||ICON[t]}</div>`;
  return `<div class="relative w-32 h-20 rounded-lg overflow-hidden flex-shrink-0">${inner}${lock}${dur}</div>`;
}

function getFiltered(){
  const q=(document.getElementById('f-search').value||'').toLowerCase().trim();
  const jenis=document.getElementById('f-jenis').value;
  const sort=document.getElementById('f-sort').value;
  let list=ITEMS.filter(it=>{
    const t=typeOf(it);
    if(state.tab==='saved'){ if(!SAVED.has(it.item_id)) return false; }
    else if(state.tab!=='all' && t!==state.tab) return false;
    if(jenis && t!==jenis) return false;
    if(state.cat && (it.topic||'Lain-lain')!==state.cat) return false;
    if(q && !(`${it.title||''} ${it.description||''} ${it.topic||''} ${(it.tags||[]).join(' ')}`.toLowerCase().includes(q))) return false;
    return true;
  });
  list.sort((a,b)=> sort==='views' ? (b.view_count||0)-(a.view_count||0)
    : sort==='old' ? new Date(a.created_at||0)-new Date(b.created_at||0)
    : new Date(b.created_at||0)-new Date(a.created_at||0));
  return list;
}

function render(){
  const list=getFiltered();
  const totalPages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
  if(state.page>totalPages) state.page=totalPages;
  const start=(state.page-1)*PAGE_SIZE;
  const pageItems=list.slice(start,start+PAGE_SIZE);
  const el=document.getElementById('lib-list'), empty=document.getElementById('lib-empty');
  if(!pageItems.length){ el.innerHTML=''; empty.classList.remove('hidden'); empty.textContent = state.tab==='saved'?'Tiada simpanan lagi. Tekan 🔖 pada kandungan untuk simpan.':'Tiada kandungan dijumpai'; }
  else{
    empty.classList.add('hidden');
    el.innerHTML=pageItems.map(it=>{
      const t=typeOf(it), j=JENIS[t]||JENIS.article; const locked=isLocked(it);
      const saved=SAVED.has(it.item_id);
      return `<div onclick="openItem('${escH(it.item_id)}')" class="bg-white rounded-2xl border border-ink/10 p-3 flex items-start gap-4 hover:shadow-md cursor-pointer transition-shadow">
        ${thumb(it)}
        <div class="flex-1 min-w-0">
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${j.c}">${j.l}</span>
          <div class="font-bold text-ink text-sm mt-1 leading-snug">${escH(it.title||'')}</div>
          <div class="text-xs text-ink/55 mt-0.5 line-clamp-2">${escH(it.description||'')}</div>
          <div class="flex items-center gap-2 mt-2 flex-wrap">
            ${it.topic?`<span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-ink/8 text-ink/65">${escH(it.topic)}</span>`:''}
            ${aksesBadge(it)}
            ${locked?'<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-ink/10 text-ink/55">🔒 Terkunci</span>':''}
          </div>
        </div>
        <div class="flex flex-col items-end gap-2 flex-shrink-0">
          <button onclick="event.stopPropagation();toggleSave('${escH(it.item_id)}')" class="text-base ${saved?'':'opacity-40'} hover:opacity-100" title="${saved?'Buang simpanan':'Simpan'}">🔖</button>
          <div class="text-[11px] text-ink/50 text-right">
            📅 ${it.created_at?new Date(it.created_at).toLocaleDateString('ms-MY',{day:'2-digit',month:'short',year:'numeric'}):'—'}
          </div>
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('page-info').textContent = list.length?`Memaparkan ${start+1} hingga ${Math.min(start+PAGE_SIZE,list.length)} daripada ${list.length} kandungan`:'Tiada kandungan';
  renderPager(totalPages);
}

function renderPager(tp){
  const pager=document.getElementById('pager');
  if(tp<=1){ pager.innerHTML=''; return; }
  const p=state.page;
  const btn=(l,pg,act,dis)=>`<button ${dis?'disabled':''} onclick="goPage(${pg})" class="min-w-8 h-8 px-2 rounded-lg text-xs font-semibold ${act?'bg-navy text-white':'border border-ink/15 text-ink/70 hover:bg-ink/5'} ${dis?'opacity-40 cursor-not-allowed':''}">${l}</button>`;
  let a=[]; a.push(btn('‹',p-1,false,p===1));
  if(tp<=7){ for(let i=1;i<=tp;i++) a.push(btn(i,i,i===p)); }
  else{ a.push(btn(1,1,p===1)); if(p>3)a.push('<span class="px-1 text-ink/40">…</span>');
    for(let i=Math.max(2,p-1);i<=Math.min(tp-1,p+1);i++) a.push(btn(i,i,i===p));
    if(p<tp-2)a.push('<span class="px-1 text-ink/40">…</span>'); a.push(btn(tp,tp,p===tp)); }
  a.push(btn('›',p+1,false,p===tp)); pager.innerHTML=a.join('');
}

function openItem(itemId){
  const it=ITEMS.find(x=>x.item_id===itemId); if(!it) return;
  if(isLocked(it)){
    const names=(Array.isArray(it.package_ids)?it.package_ids:[]).map(id=>PKG_MAP[id]||id).join(' / ');
    banner(`🔒 Kandungan ini memerlukan ${names}. Naik taraf pakej untuk akses.`,'error');
    return;
  }
  window.location.href=`library-detail.html?id=${encodeURIComponent(itemId)}`;
}

async function toggleSave(itemId){
  if(!window.currentUser) return;
  if(SAVED.has(itemId)){ await window.db.from('psy_library_bookmarks').delete().eq('user_id',currentUser.id).eq('item_id',itemId); SAVED.delete(itemId); banner('Dibuang dari simpanan'); }
  else{ await window.db.from('psy_library_bookmarks').insert({user_id:currentUser.id,item_id:itemId}); SAVED.add(itemId); banner('Disimpan ✓'); }
  render();
}

function goPage(n){ state.page=n; render(); }
function applyFilters(){ state.page=1; render(); }
function syncJenis(){ const v=document.getElementById('f-jenis').value; if(v){ state.tab=v; } setTabUI(state.tab); applyFilters(); }
function resetFilters(){ document.getElementById('f-search').value=''; document.getElementById('f-jenis').value=''; document.getElementById('f-sort').value='new'; state.cat=''; renderCats(); applyFilters(); }
function setTabUI(tab){ document.querySelectorAll('.lib-tab').forEach(b=>b.classList.toggle('active',b.dataset.type===tab)); }
function setTab(tab){ state.tab=tab; state.page=1; setTabUI(tab); document.getElementById('f-jenis').value=(['video','article','faq'].includes(tab)?tab:''); render(); }

let CAT_MASTER=[];
function renderCats(){
  const counts={};
  ITEMS.forEach(it=>{ const tp=it.topic||'Lain-lain'; counts[tp]=(counts[tp]||0)+1; });
  // Senarai master (dari table) + mana-mana kategori yang wujud dalam content
  const ordered = CAT_MASTER.length ? [...CAT_MASTER] : Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  Object.keys(counts).forEach(c=>{ if(!ordered.includes(c)) ordered.push(c); });
  const el=document.getElementById('cat-list');
  el.innerHTML = `<div class="cat-row ${state.cat===''?'active':''}" onclick="setCat('')"><span>Semua Kategori</span><span class="text-ink/45">${ITEMS.length}</span></div>` +
    ordered.map(c=>`<div class="cat-row ${state.cat===c?'active':''}" onclick="setCat('${escH(c).replace(/'/g,'')}')"><span>${escH(c)}</span><span class="text-ink/45">${counts[c]||0}</span></div>`).join('');
}
function setCat(c){ state.cat=c; state.page=1; renderCats(); render(); }

async function loadBookmarks(){ if(!window.currentUser) return; const {data}=await window.db.from('psy_library_bookmarks').select('item_id').eq('user_id',currentUser.id); SAVED=new Set((data||[]).map(r=>r.item_id)); }

(async()=>{
  const user=await initPatient('library','Akses video, artikel & FAQ'); if(!user) return;
  patientPkg=window.patientRecord?.active_package_id||null;
  const [items,pkgs,cats]=await Promise.all([
    dbQuery('psy_library_items',{ eq:{ is_active:true }, order:{col:'created_at',asc:false} }).catch(()=>[]),
    window.db.from('psy_packages').select('package_id,name').eq('is_active',true).order('sort_order',{ascending:true}).then(r=>r.data||[]).catch(()=>[]),
    window.db.from('psy_library_categories').select('name').eq('scope','content').eq('is_active',true).order('sort_order',{ascending:true}).then(r=>r.data||[]).catch(()=>[]),
  ]);
  ITEMS=(items||[]).filter(it=>typeOf(it)!=='faq'); // FAQ ada page sendiri (faq.html)
  CAT_MASTER=(cats||[]).map(c=>c.name);
  ALL_PKG=pkgs; PKG_MAP={}; pkgs.forEach(p=>PKG_MAP[p.package_id]=p.name||p.package_id);
  await loadBookmarks();
  const urlTab=new URLSearchParams(location.search).get('tab');
  if(new URLSearchParams(location.search).get('saved')==='1') setTab('saved');
  else if(['video','article'].includes(urlTab)) setTab(urlTab);
  renderCats(); render();
})();
</script>
</body>
</html>
