<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Resit Pembayaran</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
<style>
  @media print {
    body * { visibility: hidden; }
    #receipt-print, #receipt-print * { visibility: visible; }
    #receipt-print {
      position: absolute; left: 0; top: 0; width: 100%;
      max-height: none !important; overflow: visible !important;
      background: white; padding: 40px;
      min-height: 96vh; display: flex; flex-direction: column;
    }
    .no-print { display: none !important; }
  }
</style>
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🧾</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen no-print"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4 no-print"></header>

      <div class="p-4 md:p-8">
        <!-- Toolbar -->
        <div class="no-print flex items-center justify-between gap-3 flex-wrap max-w-4xl mx-auto mb-4">
          <a href="sejarah-pembayaran.html" class="inline-flex items-center gap-2 text-sm font-semibold text-navy hover:underline">← Kembali ke Sejarah Pembayaran</a>
          <button onclick="window.print()" class="inline-flex items-center gap-2 bg-navy text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-navy-dark">🖨 Print / Save PDF</button>
        </div>

        <!-- Kad resit -->
        <div class="max-w-4xl mx-auto bg-white rounded-2xl border border-ink/10 shadow-sm overflow-hidden">
          <div id="receipt-print" class="p-6 md:p-10 text-ink flex flex-col min-h-[80vh]">
            <div class="text-center text-ink/50 py-16">Memuatkan resit…</div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/shared/supabase.js"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script src="../../shared/receipt.js"></script>
<script>
(async () => {
  const user = await initPatient('sejarah_pembayaran', 'Resit pembayaran');
  if (!user) return;

  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const ref = params.get('ref');
  const box = document.getElementById('receipt-print');

  if (!id && !ref) {
    box.innerHTML = '<div class="text-center text-ink/50 py-16">Resit tidak dijumpai.</div>';
    return;
  }

  // Ambil resit — hanya milik pesakit ini (keselamatan)
  let q = window.db.from('psy_payments').select('*');
  q = id ? q.eq('id', id) : q.eq('receipt_ref', ref);
  const { data, error } = await q.limit(1);
  const r = data?.[0];

  if (error || !r || (patientRecord && r.patient_id && r.patient_id !== patientRecord.id)) {
    box.innerHTML = '<div class="text-center text-ink/50 py-16">Resit tidak dijumpai atau anda tiada akses.</div>';
    return;
  }

  window._receipts = [r];
  box.innerHTML = await buildReceiptInner(r);
})();
</script>
</body>
</html>
