                  <label class="group relative border border-ink/15 rounded-xl p-3.5 cursor-pointer hover:border-terracotta hover:bg-terracotta/5 has-[:checked]:border-terracotta has-[:checked]:bg-terracotta/5 transition-all">
                    <input type="radio" name="issue-type" value="tidak_sampai" class="sr-only">

                  </label>
                  <label class="group relative border border-ink/15 rounded-xl p-3.5 cursor-pointer hover:border-terracotta hover:bg-terracotta/5 has-[:checked]:border-terracotta has-[:checked]:bg-terracotta/5 transition-all">
                    <input type="radio" name="issue-type" value="appointment" class="sr-only">

              </div>

              <div class="border-t border-ink/10"></div>

              <div>
                <div class="text-[11px] font-bold uppercase tracking-wider text-ink/40 mb-2">03 — Foto Bukti <span class="normal-case font-normal">(optional)</span></div>
                <label for="issue-photo" class="flex items-center gap-4 border border-dashed border-ink/20 rounded-xl p-4 cursor-pointer hover:border-terracotta hover:bg-terracotta/5 transition-all group">
                  <div class="w-10 h-10 rounded-lg bg-ink/5 group-hover:bg-terracotta/10 flex items-center justify-center text-xl flex-shrink-0">📷</div>
                  <div>

                    <div class="text-xs text-ink/50 mt-0.5">JPG, PNG — max 5MB</div>

                  <input id="issue-photo" type="file" accept="image/*" class="hidden" onchange="previewPhoto(event)">

                <div id="issue-photo-preview" class="hidden mt-3 flex items-start gap-3">
                  <img id="issue-photo-img" class="h-20 w-20 object-cover rounded-lg border border-ink/10" alt="preview">
                  <button onclick="clearPhoto()" class="text-xs text-terracotta mt-1 hover:underline">Buang foto</button>
                </div>
              </div>

              <div class="flex items-center gap-4 pt-2">
                <button onclick="submitIssue()" class="bg-terracotta text-white px-8 py-3 rounded-xl font-semibold text-sm hover:bg-terracotta/90 transition-colors">
                  Hantar Laporan
                </button>
                <span class="text-xs text-ink/50">Admin akan response dalam 24 jam</span>
              </div>

            </div>

            <!-- Info panel -->
            <div class="lg:w-64 xl:w-72 flex-shrink-0 space-y-4">
              <div class="bg-terracotta/8 rounded-xl p-4 border border-terracotta/20">
                <div class="font-semibold text-sm text-terracotta mb-3">Apa yang berlaku selepas?</div>
                <ol class="space-y-2.5 text-xs text-ink/70">
                  <li class="flex gap-2.5">
                    <span class="w-5 h-5 rounded-full bg-terracotta/15 text-terracotta flex items-center justify-center font-bold flex-shrink-0 text-[10px]">1</span>
                    Admin terima & verify laporan
                  </li>
                  <li class="flex gap-2.5">
                    <span class="w-5 h-5 rounded-full bg-terracotta/15 text-terracotta flex items-center justify-center font-bold flex-shrink-0 text-[10px]">2</span>
                    Anda akan dihubungi dalam 24 jam

                  <li class="flex gap-2.5">
                    <span class="w-5 h-5 rounded-full bg-terracotta/15 text-terracotta flex items-center justify-center font-bold flex-shrink-0 text-[10px]">3</span>

  <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-navy-dark text-white py-2 justify-around z-20">

<style>

<script>
    function LCALE() { try { return (window.iswGetLang && window.iswGetLang() === 'ms') ? 'ms-MY' : 'en-GB'; } catch (e) { return 'en-GB'; } }
function openPhotoLightbox(url) {
  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[100] bg-black/85 flex items-center justify-center p-4 cursor-zoom-out';
  overlay.onclick = () => overlay.remove();
  overlay.innerHTML = `
    <button class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white text-xl flex items-center justify-center" onclick="event.stopPropagation(); this.parentElement.remove()">×</button>
    <a href="${url}" target="_blank" onclick="event.stopPropagation()" class="absolute bottom-4 right-4 text-white/70 hover:text-white text-xs underline bg-black/30 px-3 py-1.5 rounded-full">Buka tab baru ↗</a>
    <img src="${url}" alt="foto full" class="max-w-full max-h-full object-contain rounded-lg" onclick="event.stopPropagation()">`;
  document.body.appendChild(overlay);
  const onEsc = e => { if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', onEsc); } };
  document.addEventListener('keydown', onEsc);
}

let issuePhotoFile = null;

const TYPE_LABEL = {
  produk_rosak:  '📦 Produk rosak',
  salah_produk:  '🔄 Salah produk',
  kurang_jumlah: '⚖️ Kurang jumlah',
  tidak_sampai:  '🚚 Tidak sampai',
  appointment:   '📅 Masalah appointment',
  lain_lain:     '💬 Lain-lain',
};

// ── Tab ──────────────────────────────────────────────
function setTab(t) {
  document.getElementById('pane-history').classList.toggle('hidden', t !== 'history');
  document.getElementById('pane-new').classList.toggle('hidden', t !== 'new');
  document.getElementById('tab-history').classList.toggle('active', t === 'history');
  document.getElementById('tab-new').classList.toggle('active', t === 'new');
}

// ── Load history ──────────────────────────────────────
async function loadHistory() {
  const uid = window.currentUser.id;

  const [issueRes, replyRes] = await Promise.all([
    window.db.from('psy_audit_log')
      .select('*').eq('action', 'issue.reported').eq('actor_id', uid)
      .order('created_at', { ascending: false }),
    window.db.from('psy_audit_log')
      .select('*').eq('action', 'issue.responded').eq('target', uid),
  ]);

  const issues  = issueRes.data  || [];
  const replies = replyRes.data  || [];

  // Map replies by issue_id
  const replyMap = {};
  replies.forEach(r => {
    const iid = r.meta?.issue_id;
    if (iid) {
      if (!replyMap[iid]) replyMap[iid] = [];
      replyMap[iid].push(r);
    }
  });

  const el = document.getElementById('history-list');

  if (!issues.length) {
    el.innerHTML = `<div class="bg-white rounded-xl border border-ink/10 p-10 text-center">
      <div class="text-4xl mb-3">📭</div>
      <p class="text-ink/50 text-sm">Anda belum hantar sebarang laporan</p>
      <button onclick="setTab('new')" class="mt-4 bg-terracotta text-white px-5 py-2 rounded-xl text-sm font-semibold">Hantar Isu Pertama</button>
    </div>`;
    return;
  }

  el.innerHTML = issues.map(issue => {
    const reps    = replyMap[issue.id] || [];
    const replied = reps.length > 0;
    const type    = issue.meta?.type || 'lain_lain';
    const desc    = (issue.meta?.description || '').replace(/</g,'&lt;');
    const date    = new Date(issue.created_at).toLocaleDateString(LCALE(), { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });

    const repliesHtml = reps.sort((a,b) => new Date(a.created_at)-new Date(b.created_at)).map(r => {
      const rt = new Date(r.created_at).toLocaleDateString(LCALE(), { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
      return `<div class="bg-navy/5 border border-navy/10 rounded-xl p-3 mt-3">
        <div class="text-[10px] text-navy font-bold mb-1">↩ Jawapan Staff · ${rt}</div>
        <p class="text-sm text-ink leading-relaxed">${(r.meta?.response || '').replace(/</g,'&lt;')}</p>
      </div>`;
    }).join('');

    return `<div class="bg-white rounded-xl border ${replied ? 'border-green/30' : 'border-terracotta/20'} p-4">
      <div class="flex items-start justify-between gap-3 mb-2">
        <div>
          <span class="text-sm font-semibold">${TYPE_LABEL[type] || type}</span>
          <span class="ml-2 chip ${replied ? 'bg-green-light text-green-dark' : 'bg-terracotta/15 text-terracotta'} text-[10px]">
            ${replied ? '✅ Dijawab' : '⏳ Menunggu'}
          </span>
        </div>
        <a href="issue-thread.html?id=${issue.id}"
          class="text-xs font-semibold px-3 py-1.5 rounded-lg flex-shrink-0 ${replied ? 'bg-terracotta text-white' : 'bg-ink/10 text-ink/60'}">
          ${replied ? '↩ Balas' : '👁 Lihat'}
        </a>
      </div>
      <p class="text-sm text-ink/70 leading-relaxed">${desc}</p>
      ${issue.meta?.photo_url ? `<img src="${issue.meta.photo_url}" onclick="openPhotoLightbox('${issue.meta.photo_url}')" class="mt-2 h-24 object-cover rounded-lg border border-ink/10 cursor-zoom-in hover:opacity-90 transition" title="Klik untuk view full size">` : ''}
      ${repliesHtml}
    </div>`;
  }).join('');
}

// ── Submit ────────────────────────────────────────────
function previewPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { banner('Foto melebihi 5MB — sila pilih yang lebih kecil', 'error'); e.target.value = ''; return; }
  issuePhotoFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('issue-photo-img').src = ev.target.result;
    document.getElementById('issue-photo-preview').classList.remove('hidden');
    document.getElementById('issue-photo-label').textContent = '✓ ' + file.name;
  };
  reader.readAsDataURL(file);
}

function clearPhoto() {
  issuePhotoFile = null;
  document.getElementById('issue-photo').value = '';
  document.getElementById('issue-photo-preview').classList.add('hidden');
  document.getElementById('issue-photo-label').textContent = '📷 Klik untuk upload foto';
}

async function submitIssue() {
  const type = document.querySelector('input[name="issue-type"]:checked')?.value;
  const desc = document.getElementById('issue-desc').value.trim();

  if (!type) { banner('Sila pilih jenis isu', 'error'); return; }
  if (!desc) { banner('Sila isi deskripsi masalah', 'error'); return; }

  let photoUrl = null, photoFailed = false;
  if (issuePhotoFile) {
    try {
      const path = `issues/${window.currentUser.id}/${Date.now()}_${issuePhotoFile.name}`;
      const { error } = await window.db.storage.from('issue-photos').upload(path, issuePhotoFile);
      if (!error) {
        const { data } = window.db.storage.from('issue-photos').getPublicUrl(path);
        photoUrl = data.publicUrl;
      } else { photoFailed = true; }
    } catch (e) { photoFailed = true; console.warn('Photo upload skipped:', e.message); }
  }

  // Insert terus (bukan auditLog yg telan ralat) supaya kegagalan disurface, bukan "berjaya" palsu.
  const { error: issueErr } = await window.db.from('psy_audit_log').insert({
    actor_id:   window.currentUser.id,
    actor_name: window.currentUser.full_name,
    actor_role: window.currentUser.role || 'patient',
    action:     'issue.reported',
    target:     window.currentUser.id,
    meta:       { type, description: desc, photo_url: photoUrl },
  });
  if (issueErr) { banner('Gagal hantar laporan: ' + issueErr.message, 'error'); return; }

  banner(photoFailed
    ? 'Laporan dihantar (foto gagal dimuat naik). Admin akan hubungi anda dalam 24 jam.'
    : 'Laporan dihantar. Admin akan hubungi anda dalam 24 jam.');
  document.getElementById('issue-desc').value = '';
  document.querySelectorAll('input[name="issue-type"]').forEach(r => r.checked = false);
  clearPhoto();

  // Switch to history tab and refresh
  setTab('history');
  loadHistory();
}

(async () => {
  const user = await initPatient('issue', 'Produk salah / rosak / appointment masalah');
  if (!user) return;
  loadHistory();
})();
</script>
