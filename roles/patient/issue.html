<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Report Issue</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">⚠️</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8">
        <div class="max-w-xl mx-auto bg-white rounded-2xl border border-ink/10 p-6 md:p-8">
          <h2 class="text-xl font-bold mb-1">Laporkan Masalah</h2>
          <p class="text-sm text-ink/70 mb-6">Produk salah / rosak / tak sampai? Kami akan replace cepat.</p>

          <label class="block text-xs font-semibold mb-1">Rujukan Order / Appointment</label>
          <select id="issue-ref" class="w-full border border-ink/20 rounded-lg px-4 py-3 mb-4 outline-none focus:border-navy text-sm">
            <option value="">— Pilih rujukan —</option>
          </select>

          <label class="block text-xs font-semibold mb-2">Jenis isu</label>
          <div class="grid grid-cols-2 gap-2 mb-4">
            <label class="border-2 border-ink/20 rounded-lg p-3 text-sm cursor-pointer hover:border-terracotta has-[:checked]:border-terracotta has-[:checked]:bg-terracotta-light">
              <input type="radio" name="issue-type" value="produk_rosak" class="mr-2">Produk rosak
            </label>
            <label class="border-2 border-ink/20 rounded-lg p-3 text-sm cursor-pointer hover:border-terracotta has-[:checked]:border-terracotta has-[:checked]:bg-terracotta-light">
              <input type="radio" name="issue-type" value="salah_produk" class="mr-2">Salah produk
            </label>
            <label class="border-2 border-ink/20 rounded-lg p-3 text-sm cursor-pointer hover:border-terracotta has-[:checked]:border-terracotta has-[:checked]:bg-terracotta-light">
              <input type="radio" name="issue-type" value="kurang_jumlah" class="mr-2">Kurang jumlah
            </label>
            <label class="border-2 border-ink/20 rounded-lg p-3 text-sm cursor-pointer hover:border-terracotta has-[:checked]:border-terracotta has-[:checked]:bg-terracotta-light">
              <input type="radio" name="issue-type" value="tidak_sampai" class="mr-2">Tidak sampai
            </label>
            <label class="border-2 border-ink/20 rounded-lg p-3 text-sm cursor-pointer hover:border-terracotta has-[:checked]:border-terracotta has-[:checked]:bg-terracotta-light">
              <input type="radio" name="issue-type" value="appointment" class="mr-2">Masalah appointment
            </label>
            <label class="border-2 border-ink/20 rounded-lg p-3 text-sm cursor-pointer hover:border-terracotta has-[:checked]:border-terracotta has-[:checked]:bg-terracotta-light">
              <input type="radio" name="issue-type" value="lain_lain" class="mr-2">Lain-lain
            </label>
          </div>

          <label class="block text-xs font-semibold mb-1">Deskripsi</label>
          <textarea id="issue-desc" rows="4" placeholder="Terangkan masalah anda..." class="w-full border border-ink/20 rounded-lg px-4 py-3 text-sm outline-none focus:border-terracotta"></textarea>

          <label class="block text-xs font-semibold mb-1 mt-4">Foto bukti (optional)</label>
          <label for="issue-photo" class="block border-2 border-dashed border-ink/20 rounded-lg p-6 text-center text-sm text-ink/60 cursor-pointer hover:border-terracotta">
            <div id="issue-photo-label">📷 Klik untuk upload foto</div>
            <input id="issue-photo" type="file" accept="image/*" class="hidden" onchange="previewPhoto(event)">
          </label>
          <div id="issue-photo-preview" class="hidden mt-3">
            <img id="issue-photo-img" class="max-h-40 rounded-lg border border-ink/10" alt="preview">
            <button onclick="clearPhoto()" class="text-xs text-terracotta mt-1">Buang foto</button>
          </div>

          <button onclick="submitIssue()" class="w-full mt-5 bg-terracotta text-white py-3 rounded-lg font-semibold hover:bg-terracotta/90">Hantar Laporan</button>
          <p class="text-xs text-ink/60 mt-3 text-center">Admin akan validate dalam 24 jam</p>
        </div>
      </div>
    </main>
  </div>

  <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-navy-dark text-white py-2 justify-around z-20">
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🏠</span>Home</a>
    <a href="appointments.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>📅</span>Book</a>
    <a href="plan.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>💊</span>Plan</a>
    <a href="shop.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🛒</span>Shop</a>
    <a href="profile.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>👤</span>Profile</a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
let issuePhotoFile = null;

async function loadIssueRefs() {
  if (!patientRecord) return;
  const [appts, rx] = await Promise.all([
    dbQuery('appointments', { eq: { patient_id: patientRecord.id }, order: { col: 'appointment_time' } }),
    dbQuery('prescriptions', { eq: { patient_id: patientRecord.id } }),
  ]);
  const opts = [
    '<option value="">— Pilih rujukan —</option>',
    ...appts.map(a => `<option value="appt:${a.id}">APPT · ${a.service} · ${new Date(a.appointment_time).toLocaleDateString('en-GB')}</option>`),
    ...rx.map(r => `<option value="rx:${r.id}">RX · ${r.medication}</option>`),
  ];
  document.getElementById('issue-ref').innerHTML = opts.join('');
}

function previewPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  issuePhotoFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('issue-photo-img').src = ev.target.result;
    document.getElementById('issue-photo-preview').classList.remove('hidden');
    document.getElementById('issue-photo-label').textContent = '✓ ' + file.name;
  };
  reader.readAsDataURL(file);
}

function clearPhoto() {
  issuePhotoFile = null;
  document.getElementById('issue-photo').value = '';
  document.getElementById('issue-photo-preview').classList.add('hidden');
  document.getElementById('issue-photo-label').textContent = '📷 Klik untuk upload foto';
}

async function submitIssue() {
  const ref = document.getElementById('issue-ref').value;
  const type = document.querySelector('input[name="issue-type"]:checked')?.value;
  const desc = document.getElementById('issue-desc').value.trim();

  if (!type) { banner('Sila pilih jenis isu', 'error'); return; }
  if (!desc) { banner('Sila isi deskripsi masalah', 'error'); return; }

  let photoUrl = null;
  if (issuePhotoFile) {
    try {
      const path = `issues/${currentUser.id}/${Date.now()}_${issuePhotoFile.name}`;
      const { error } = await window.db.storage.from('issue-photos').upload(path, issuePhotoFile);
      if (!error) {
        const { data } = window.db.storage.from('issue-photos').getPublicUrl(path);
        photoUrl = data.publicUrl;
      }
    } catch (e) { console.warn('Photo upload skipped:', e.message); }
  }

  await auditLog('issue.reported', currentUser.id, {
    reference: ref || null,
    type, description: desc, photo_url: photoUrl,
  });

  banner('Laporan dihantar. Admin akan hubungi anda dalam 24 jam.');
  document.getElementById('issue-desc').value = '';
  document.querySelectorAll('input[name="issue-type"]').forEach(r => r.checked = false);
  clearPhoto();
}

(async () => {
  const user = await initPatient('issue', 'Produk salah / rosak / appointment masalah');
  if (!user) return;
  loadIssueRefs();
})();
</script>
</body>
</html>
