<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🏥</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>

    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <section class="p-4 md:p-8 space-y-6">
        <div id="no-package-banner" class="hidden bg-terracotta text-white rounded-2xl p-5 flex items-center gap-4 flex-wrap">
          <div class="text-3xl">🔒</div>
          <div class="flex-1 min-w-0">
            <div class="font-bold">Anda belum memilih pakej rawatan</div>
            <div class="text-xs opacity-90 mt-1">Untuk akses penuh ke Treatment Plan, Coaching, dan Library — pilih pakej dahulu.</div>
          </div>
          <a href="pakej.html" class="bg-white text-terracotta font-semibold px-4 py-2 rounded-lg text-sm whitespace-nowrap">📦 Pilih Pakej →</a>
        </div>

        <!-- Promo carousel -->
        <div class="relative overflow-hidden rounded-2xl" id="promo-carousel" style="min-height:140px">
          <div id="promo-track" class="flex transition-transform duration-500 ease-in-out h-full"></div>
          <div id="promo-dots" class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5"></div>
        </div>

        <div id="stat-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></div>

        <div id="upcoming-section"></div>

      </section>
    </main>
  </div>

  <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-navy-dark text-white py-2 justify-around z-20">
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🏠</span>Home</a>
    <a href="plan.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>💊</span>Plan</a>
    <a href="shop.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🛒</span>Shop</a>
    <a href="profile.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>👤</span>Profile</a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>

(async () => {
  const user = await initPatient('dashboard', 'Overview rawatan & appointment anda');
  if (!user) return;

  if (!patientRecord) {
    document.getElementById('hero-sub').textContent = 'Akaun anda belum di-link dengan rekod pesakit.';
    document.getElementById('stat-grid').innerHTML = '<div class="col-span-4 bg-gold-light rounded-xl p-4 text-sm">Sila lengkapkan KYC atau hubungi admin.</div>';
    return;
  }

  const today = new Date().toISOString().split('T')[0];

  const [appts, plans, checkinRes, ordersRes] = await Promise.all([
    dbQuery('appointments', { eq: { patient_id: patientRecord.id }, order: { col: 'appointment_time', asc: true } }),
    dbQuery('treatment_plans', { eq: { patient_id: patientRecord.id } }),
    window.db.from('daily_checkins').select('id,mood_score').eq('patient_id', patientRecord.id).eq('checkin_date', today).maybeSingle(),
    window.db.from('orders').select('id,status').eq('patient_id', currentUser.id).not('status', 'in', '("delivered","cancelled")'),
  ]);

  const upcoming = appts.filter(a => a.status === 'scheduled' && new Date(a.appointment_time) > new Date());
  const nextAppt = upcoming[0];
  const dashPlan = plans.find(p => p.status === 'active');
  const checkinToday = checkinRes.data;
  const activeOrders = (ordersRes.data || []).length;

  const hasActivePkg = patientRecord.active_package_id &&
    (!patientRecord.package_expires_at || new Date(patientRecord.package_expires_at) >= new Date());
  const activePackageName = patientRecord.active_package_name;

  // Show no-package banner when no active package
  document.getElementById('no-package-banner').classList.toggle('hidden', !!hasActivePkg);

  // Promo carousel
  const promos = await window.db.from('announcements')
    .select('*').eq('is_active', true).order('sort_order', { ascending: true })
    .then(r => r.data || []).catch(() => []);

  const slides = promos.length ? promos : [
    { title: 'Selamat Datang ke ISW', body: 'Program rawatan holistik BPS-S untuk kesejahteraan anda.', bg: 'from-navy to-green-dark', cta_label: null, cta_url: null },
  ];

  const track = document.getElementById('promo-track');
  const dots = document.getElementById('promo-dots');
  track.innerHTML = slides.map(s => `
    <div class="min-w-full bg-gradient-to-r ${s.bg || 'from-navy to-green-dark'} rounded-2xl p-6 text-white flex items-center justify-between gap-4 flex-wrap">
      <div>
        ${s.tag ? `<div class="text-[10px] font-semibold uppercase tracking-widest opacity-70 mb-1">${s.tag}</div>` : ''}
        <div class="text-xl font-bold leading-snug">${s.title}</div>
        ${s.body ? `<div class="text-sm opacity-80 mt-1 max-w-sm">${s.body}</div>` : ''}
      </div>
      ${s.cta_label && s.cta_url ? `<a href="${s.cta_url}" class="bg-white/20 hover:bg-white/30 text-white font-semibold text-sm px-5 py-2.5 rounded-lg whitespace-nowrap backdrop-blur-sm">${s.cta_label} →</a>` : ''}
    </div>`).join('');

  dots.innerHTML = slides.map((_, i) => `<button onclick="goSlide(${i})" id="dot-${i}" class="w-2 h-2 rounded-full transition-all ${i === 0 ? 'bg-white w-4' : 'bg-white/40'}"></button>`).join('');

  let curSlide = 0;
  window.goSlide = (i) => {
    curSlide = i;
    track.style.transform = `translateX(-${i * 100}%)`;
    dots.querySelectorAll('button').forEach((d, idx) => {
      d.className = `w-2 h-2 rounded-full transition-all ${idx === i ? 'bg-white w-4' : 'bg-white/40'}`;
    });
  };
  if (slides.length > 1) setInterval(() => goSlide((curSlide + 1) % slides.length), 5000);

  let progressScore = 0, progressTrend = '';

  // Update quick-action check-in card
  if (checkinToday) {
    document.getElementById('qa-checkin-label').textContent = '✓ Sudah Check-in';
    document.getElementById('qa-checkin-sub').textContent = `Mood ${checkinToday.mood_score}/10 hari ini`;
  }

  const MOOD_EMOJI = ['','😭','😢','😔','😟','😐','🙂','😊','😁','🤩','🌟'];

  const dashStatCard = (label, value, sub, subColor = 'text-ink/60', href = '#') => `
    <a href="${href}" class="bg-white rounded-xl p-4 border border-ink/10 hover:border-navy hover:shadow-sm transition-all block">
      <div class="text-xs text-ink/60">${label}</div>
      <div class="text-lg font-bold mt-1">${value}</div>
      <div class="text-xs ${subColor} mt-1">${sub || '—'}</div>
    </a>`;

  const weeklyAll = dashPlan
    ? await dbQuery('plan_weekly_progress', { eq: { plan_id: dashPlan.id } }).catch(() => [])
    : [];
  const hadirCount = weeklyAll.filter(w => w.status === 'hadir').length;
  const scores = weeklyAll.filter(w => w.score && w.status === 'hadir').map(w => w.score);
  if (scores.length > 0) {
    progressScore = (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1);
    if (scores.length >= 2) {
      const delta = (scores[scores.length - 1] - scores[scores.length - 2]).toFixed(1);
      progressTrend = delta >= 0 ? `▲ +${delta} minggu ini` : `▼ ${delta} minggu ini`;
    }
  }

  document.getElementById('stat-grid').innerHTML = [
    dashStatCard(
      'Check-in Hari Ini',
      checkinToday ? `${MOOD_EMOJI[checkinToday.mood_score] || '😊'} ${checkinToday.mood_score}/10` : '—',
      checkinToday ? 'Sudah check-in' : 'Belum check-in',
      checkinToday ? 'text-green-dark' : 'text-gold-dark',
      'checkin.html'
    ),
    dashStatCard(
      'Sesi Hadir',
      dashPlan ? `${hadirCount} / ${dashPlan.duration_weeks}` : '—',
      dashPlan ? `Minggu semasa: ${dashPlan.current_week}` : 'Tiada plan aktif',
      hadirCount > 0 ? 'text-teal' : 'text-ink/60',
      'plan.html'
    ),
    dashStatCard(
      'Progress Score',
      progressScore > 0 ? `${progressScore} / 10` : '—',
      progressTrend || 'Belum direkod',
      progressTrend.startsWith('▲') ? 'text-green-dark' : progressTrend.startsWith('▼') ? 'text-terracotta' : 'text-ink/60',
      'plan.html'
    ),
    dashStatCard(
      'Active Orders',
      activeOrders > 0 ? `${activeOrders} order` : '—',
      activeOrders > 0 ? 'Dalam proses' : 'Tiada order aktif',
      activeOrders > 0 ? 'text-navy' : 'text-ink/60',
      'orders.html'
    ),
  ].join('');

  // Upcoming appointment from appointments table
  if (nextAppt) {
    const d = new Date(nextAppt.appointment_time);
    const endTime = new Date(d.getTime() + (nextAppt.duration_min || 60) * 60000);
    const dayName = d.toLocaleDateString('ms-MY', { weekday: 'long' });
    const dateStr = d.toLocaleDateString('ms-MY', { day: '2-digit', month: 'long', year: 'numeric' });
    document.getElementById('upcoming-section').innerHTML = `
      <div class="bg-white rounded-xl border border-ink/10 overflow-hidden">
        <div class="px-5 py-3 border-b border-ink/5 flex items-center justify-between">
          <h3 class="font-bold text-sm">Appointment Seterusnya</h3>
          <a href="plan.html" class="text-xs text-navy hover:underline">Semua sesi →</a>
        </div>
        <div class="p-5 flex items-center gap-5 flex-wrap">
          <div class="bg-navy-light rounded-xl px-5 py-4 text-center min-w-[80px]">
            <div class="text-[10px] font-semibold text-navy uppercase">${d.toLocaleDateString('en-GB',{month:'short'})}</div>
            <div class="text-3xl font-bold text-navy leading-none my-1">${d.getDate()}</div>
            <div class="text-[10px] text-navy/70">${d.getFullYear()}</div>
          </div>
          <div class="flex-1 min-w-0">
            <div class="font-semibold">${nextAppt.service}</div>
            <div class="text-sm text-ink/60 mt-0.5">${nextAppt.staff_name || ''}</div>
            <div class="text-xs text-ink/50 mt-1">${dayName} · ${formatTime(nextAppt.appointment_time)} — ${formatTime(endTime)}${nextAppt.room ? ' · ' + nextAppt.room : ''}</div>
          </div>
          <a href="https://www.google.com/maps/search/Ibnu+Sina+Wellness" target="_blank"
            class="bg-green text-white text-xs px-4 py-2 rounded-lg font-semibold hover:bg-green-dark whitespace-nowrap">
            📍 Get Directions
          </a>
        </div>
      </div>`;
  }

})();
</script>
</body>
</html>
