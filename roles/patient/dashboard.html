<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">🏥</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>

    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <section class="p-4 md:p-8 space-y-6">
        <div id="no-package-banner" class="hidden bg-terracotta text-white rounded-2xl p-5 flex items-center gap-4 flex-wrap">
          <div class="text-3xl">🔒</div>
          <div class="flex-1 min-w-0">
            <div class="font-bold">Anda belum memilih pakej rawatan</div>
            <div class="text-xs opacity-90 mt-1">Untuk akses penuh ke Treatment Plan, Coaching, dan Library — pilih pakej dahulu.</div>
          </div>
          <a href="pakej.html" class="bg-white text-terracotta font-semibold px-4 py-2 rounded-lg text-sm whitespace-nowrap">📦 Pilih Pakej →</a>
        </div>

        <div class="bg-gradient-to-r from-navy to-green-dark rounded-2xl p-6 text-white">
          <div class="flex items-start justify-between flex-wrap gap-4">
            <div>
              <div class="text-sm opacity-80">Assalamualaikum,</div>
              <div class="text-2xl font-bold mt-1"><span id="hero-name">—</span> 🌿</div>
              <div id="hero-sub" class="text-sm opacity-80 mt-2"></div>
            </div>
          </div>
        </div>

        <div id="stat-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></div>

        <div class="grid md:grid-cols-3 gap-6">
          <div class="bg-white rounded-xl p-5 border border-ink/10 md:col-span-2">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-bold">Upcoming Appointment</h3>
              <a href="plan.html" class="text-xs text-navy hover:underline">View plan →</a>
            </div>
            <div id="upcoming-card"></div>
          </div>

          <div class="bg-white rounded-xl p-5 border border-ink/10">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-bold">Treatment Plan</h3>
              <a href="plan.html" class="text-xs text-navy hover:underline">Details →</a>
            </div>
            <div id="plan-summary"></div>
          </div>
        </div>

      </section>
    </main>
  </div>

  <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-navy-dark text-white py-2 justify-around z-20">
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🏠</span>Home</a>
    <a href="plan.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>💊</span>Plan</a>
    <a href="shop.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🛒</span>Shop</a>
    <a href="profile.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>👤</span>Profile</a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
async function rescheduleAppt(id) {
  if (!confirm('Nak reschedule appointment ni? Anda akan dibawa ke Treatment Plan.')) return;
  window.location.href = 'plan.html';
}

async function cancelAppt(id) {
  if (!confirm('Pasti nak batal appointment ni?')) return;
  try {
    await dbUpdate('appointments', id, { status: 'cancelled' });
    await auditLog('appointment.cancelled', id);
    banner('Appointment dibatalkan');
    setTimeout(() => location.reload(), 1000);
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  }
}

function getDirections() {
  window.open('https://www.google.com/maps/search/Ibnu+Sina+Wellness', '_blank');
}

(async () => {
  const user = await initPatient('dashboard', 'Overview rawatan & appointment anda');
  if (!user) return;

  document.getElementById('hero-name').textContent = user.full_name;

  if (!patientRecord) {
    document.getElementById('hero-sub').textContent = 'Akaun anda belum di-link dengan rekod pesakit.';
    document.getElementById('stat-grid').innerHTML = '<div class="col-span-4 bg-gold-light rounded-xl p-4 text-sm">Sila lengkapkan KYC atau hubungi admin.</div>';
    return;
  }

  const today = new Date().toISOString().split('T')[0];

  const [appts, plans, checkinRes, ordersRes] = await Promise.all([
    dbQuery('appointments', { eq: { patient_id: patientRecord.id }, order: { col: 'appointment_time', asc: true } }),
    dbQuery('treatment_plans', { eq: { patient_id: patientRecord.id } }),
    window.db.from('daily_checkins').select('id,mood_score').eq('patient_id', patientRecord.id).eq('checkin_date', today).maybeSingle(),
    window.db.from('orders').select('id,status').eq('patient_id', currentUser.id).not('status', 'in', '("delivered","cancelled")'),
  ]);

  const upcoming = appts.filter(a => a.status === 'scheduled' && new Date(a.appointment_time) > new Date());
  const dashPlan = plans.find(p => p.status === 'active');
  const nextAppt = upcoming[0];
  const checkinToday = checkinRes.data;
  const activeOrders = (ordersRes.data || []).length;

  const hasActivePkg = patientRecord.active_package_id &&
    (!patientRecord.package_expires_at || new Date(patientRecord.package_expires_at) >= new Date());
  const activePackageName = patientRecord.active_package_name;

  // Show no-package banner when no active package
  document.getElementById('no-package-banner').classList.toggle('hidden', !!hasActivePkg);

  if (hasActivePkg) {
    document.getElementById('hero-sub').textContent = dashPlan
      ? `${activePackageName} · Minggu ${dashPlan.current_week}/${dashPlan.duration_weeks}`
      : `${activePackageName} aktif`;
  } else {
    document.getElementById('hero-sub').textContent = 'Tiada pakej aktif · Sila pilih pakej rawatan';
  }

  let progressScore = 0, progressTrend = '';

  // Update quick-action check-in card
  if (checkinToday) {
    document.getElementById('qa-checkin-label').textContent = '✓ Sudah Check-in';
    document.getElementById('qa-checkin-sub').textContent = `Mood ${checkinToday.mood_score}/10 hari ini`;
  }

  const MOOD_EMOJI = ['','😭','😢','😔','😟','😐','🙂','😊','😁','🤩','🌟'];

  const dashStatCard = (label, value, sub, subColor = 'text-ink/60', href = '#') => `
    <a href="${href}" class="bg-white rounded-xl p-4 border border-ink/10 hover:border-navy hover:shadow-sm transition-all block">
      <div class="text-xs text-ink/60">${label}</div>
      <div class="text-lg font-bold mt-1">${value}</div>
      <div class="text-xs ${subColor} mt-1">${sub || '—'}</div>
    </a>`;

  const weeklyAll = dashPlan
    ? await dbQuery('plan_weekly_progress', { eq: { plan_id: dashPlan.id } }).catch(() => [])
    : [];
  const hadirCount = weeklyAll.filter(w => w.status === 'hadir').length;
  const scores = weeklyAll.filter(w => w.score && w.status === 'hadir').map(w => w.score);
  if (scores.length > 0) {
    progressScore = (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1);
    if (scores.length >= 2) {
      const delta = (scores[scores.length - 1] - scores[scores.length - 2]).toFixed(1);
      progressTrend = delta >= 0 ? `▲ +${delta} minggu ini` : `▼ ${delta} minggu ini`;
    }
  }

  document.getElementById('stat-grid').innerHTML = [
    dashStatCard(
      'Check-in Hari Ini',
      checkinToday ? `${MOOD_EMOJI[checkinToday.mood_score] || '😊'} ${checkinToday.mood_score}/10` : '—',
      checkinToday ? 'Sudah check-in' : 'Belum check-in',
      checkinToday ? 'text-green-dark' : 'text-gold-dark',
      'checkin.html'
    ),
    dashStatCard(
      'Sesi Hadir',
      dashPlan ? `${hadirCount} / ${dashPlan.duration_weeks}` : '—',
      dashPlan ? `Minggu semasa: ${dashPlan.current_week}` : 'Tiada plan aktif',
      hadirCount > 0 ? 'text-teal' : 'text-ink/60',
      'plan.html'
    ),
    dashStatCard(
      'Progress Score',
      progressScore > 0 ? `${progressScore} / 10` : '—',
      progressTrend || 'Belum direkod',
      progressTrend.startsWith('▲') ? 'text-green-dark' : progressTrend.startsWith('▼') ? 'text-terracotta' : 'text-ink/60',
      'plan.html'
    ),
    dashStatCard(
      'Active Orders',
      activeOrders > 0 ? `${activeOrders} order` : '—',
      activeOrders > 0 ? 'Dalam proses' : 'Tiada order aktif',
      activeOrders > 0 ? 'text-navy' : 'text-ink/60',
      'orders.html'
    ),
  ].join('');

  document.getElementById('upcoming-card').innerHTML = nextAppt
    ? (() => {
        const d = new Date(nextAppt.appointment_time);
        const endTime = new Date(d.getTime() + (nextAppt.duration_min || 45) * 60000);
        return `<div class="border border-navy/20 bg-navy-light rounded-lg p-4">
          <div class="flex items-start gap-4 flex-wrap">
            <div class="text-center min-w-[48px]">
              <div class="text-xs text-navy">${d.toLocaleDateString('en-GB',{weekday:'short'}).toUpperCase()}</div>
              <div class="text-2xl font-bold text-navy">${d.getDate()}</div>
              <div class="text-xs text-navy">${d.toLocaleDateString('en-GB',{month:'short'}).toUpperCase()}</div>
            </div>
            <div class="flex-1 min-w-[180px]">
              <div class="font-semibold">${nextAppt.service}</div>
              <div class="text-sm text-ink/70 mt-1">${nextAppt.staff_name || 'Practitioner'}</div>
              <div class="text-xs text-ink/60 mt-1">${formatTime(nextAppt.appointment_time)} — ${formatTime(endTime)} ${nextAppt.room ? '· ' + nextAppt.room : ''}</div>
              <div class="flex gap-2 mt-3 flex-wrap">
                <button onclick="rescheduleAppt('${nextAppt.id}')" class="text-xs px-3 py-1.5 rounded-lg border border-navy text-navy hover:bg-navy hover:text-white">Reschedule</button>
                <button onclick="cancelAppt('${nextAppt.id}')" class="text-xs px-3 py-1.5 rounded-lg border border-terracotta text-terracotta hover:bg-terracotta hover:text-white">Cancel</button>
                <button onclick="getDirections()" class="text-xs px-3 py-1.5 rounded-lg bg-green text-white hover:bg-green-dark">Get Directions</button>
              </div>
            </div>
          </div>
        </div>`;
      })()
    : '<p class="text-ink/40 text-sm text-center py-6">Tiada appointment akan datang</p>';

  document.getElementById('plan-summary').innerHTML = dashPlan
    ? `<div class="mb-3">
        <div class="font-semibold text-sm text-navy mb-2">${dashPlan.name}</div>
        <div class="flex justify-between text-xs mb-1">
          <span class="text-ink/60">Progress</span>
          <span class="font-semibold">Week ${dashPlan.current_week} / ${dashPlan.duration_weeks}</span>
        </div>
        <div class="h-2 bg-ink/10 rounded-full overflow-hidden"><div class="h-full bg-green transition-all" style="width:${Math.round(dashPlan.current_week / dashPlan.duration_weeks * 100)}%"></div></div>
      </div>
      <a href="plan.html" class="block w-full bg-cream hover:bg-green-light text-sm font-semibold py-2 rounded-lg text-center">Buka Checklist →</a>`
    : (hasActivePkg
        ? `<div class="text-center py-3">
             <p class="text-sm text-ink/70 mb-2">Plan akan dicipta untuk pakej <strong>${activePackageName}</strong></p>
             <p class="text-xs text-ink/50">Sila refresh atau hubungi coach</p>
           </div>`
        : `<div class="text-center py-3">
             <p class="text-sm text-ink/70 mb-3">Tiada pakej aktif</p>
             <a href="pakej.html" class="block w-full bg-navy text-white text-sm font-semibold py-2 rounded-lg">📦 Pilih Pakej →</a>
           </div>`);
})();
</script>
</body>
</html>
