<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Library</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">📚</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div id="content" class="p-4 md:p-6 max-w-3xl mx-auto">
        <div id="detail-loading" class="flex items-center justify-center h-64 text-ink/40 text-sm">Memuatkan kandungan...</div>

        <!-- VIDEO layout -->
        <div id="layout-video" class="hidden space-y-4">
          <div class="rounded-2xl overflow-hidden shadow bg-black aspect-video">
            <iframe id="video-frame" class="w-full h-full"
              frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div class="space-y-1">
            <span id="v-type" class="chip bg-navy-light text-navy text-xs"></span>
            <h1 id="v-title" class="font-bold text-xl text-ink"></h1>
            <p id="v-desc" class="text-ink/60 text-sm"></p>
          </div>
          <div id="v-body-wrap" class="hidden bg-white rounded-2xl border border-ink/10 p-5">
            <div id="v-body" class="text-sm text-ink leading-relaxed whitespace-pre-wrap"></div>
          </div>
        </div>

        <!-- ARTICLE / DOA / EXERCISE layout -->
        <div id="layout-article" class="hidden">
          <!-- Header strip -->
          <div id="a-hero" class="rounded-2xl flex items-center gap-5 px-6 py-5 mb-5">
            <div id="a-icon" class="text-5xl flex-shrink-0"></div>
            <div>
              <span id="a-type" class="chip bg-white/30 text-white text-xs mb-2 inline-block"></span>
              <h1 id="a-title" class="font-bold text-xl text-white leading-snug"></h1>
              <p id="a-desc" class="text-white/70 text-sm mt-1"></p>
            </div>
          </div>
          <!-- Body -->
          <div id="a-body-wrap" class="hidden bg-white rounded-2xl border border-ink/10 p-6 md:p-8">
            <div id="a-body" class="text-sm text-ink leading-relaxed whitespace-pre-wrap"></div>
          </div>
          <!-- External link -->
          <div id="a-link-wrap" class="hidden mt-4">
            <a id="a-link" href="#" target="_blank" rel="noopener"
               class="inline-flex items-center gap-2 bg-navy text-white px-5 py-3 rounded-xl font-semibold text-sm hover:bg-navy-dark">
              🔗 Buka Kandungan
            </a>
          </div>
          <!-- Empty -->
          <div id="a-empty" class="hidden bg-cream rounded-2xl p-10 text-center">
            <div class="text-5xl mb-3">📭</div>
            <p class="text-ink/60 text-sm">Kandungan belum ditambah. Sila hubungi konsultasi anda.</p>
          </div>
        </div>

        <!-- PDF layout -->
        <div id="layout-pdf" class="hidden space-y-3">
          <div class="rounded-2xl overflow-hidden border border-ink/10 shadow" style="height:70vh">
            <iframe id="pdf-frame" class="w-full h-full" frameborder="0"></iframe>
          </div>
          <div class="flex items-center justify-between flex-wrap gap-3">
            <div>
              <span id="p-type" class="chip bg-navy-light text-navy text-xs"></span>
              <h1 id="p-title" class="font-bold text-lg text-ink mt-1"></h1>
            </div>
            <a id="pdf-download" href="#" target="_blank"
               class="inline-flex items-center gap-2 border border-navy text-navy px-4 py-2 rounded-xl text-sm font-semibold hover:bg-navy-light">
              ⬇ Muat Turun
            </a>
          </div>
        </div>

      </div>
    </main>
  </div>
  <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-navy-dark text-white py-2 justify-around z-20">
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🏠</span>Home</a>
    <a href="plan.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>💊</span>Plan</a>
    <a href="shop.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🛒</span>Shop</a>
    <a href="profile.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>👤</span>Profile</a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
function getYouTubeId(url) {
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function isImage(url) { return url && /\.(jpg|jpeg|png|gif|webp)/i.test(url); }
function isVideoFile(url) { return url && /\.(mp4|webm|mov)/i.test(url); }
function isPdf(url) { return url && (/\.pdf/i.test(url) || url.includes('drive.google.com/file')); }

function renderDetail(item) {
  document.getElementById('detail-loading').classList.add('hidden');

  const url  = item.content_url || '';
  const body = item.content_body || '';
  const ytId = url ? getYouTubeId(url) : null;

  if (ytId) {
    // YouTube embed
    document.getElementById('video-frame').src = `https://www.youtube.com/embed/${ytId}?rel=0`;
    document.getElementById('v-type').textContent  = item.content_type || '';
    document.getElementById('v-title').textContent = item.title || '';
    document.getElementById('v-desc').textContent  = item.description || '';
    if (body) { document.getElementById('v-body').textContent = body; document.getElementById('v-body-wrap').classList.remove('hidden'); }
    document.getElementById('layout-video').classList.remove('hidden');

  } else if (isVideoFile(url)) {
    // Uploaded video file — replace iframe with <video> tag
    const vWrap = document.getElementById('layout-video');
    const iframeWrap = vWrap.querySelector('.aspect-video');
    iframeWrap.innerHTML = `<video src="${url}" controls class="w-full h-full rounded-2xl bg-black" style="max-height:360px"></video>`;
    document.getElementById('v-type').textContent  = item.content_type || '';
    document.getElementById('v-title').textContent = item.title || '';
    document.getElementById('v-desc').textContent  = item.description || '';
    if (body) { document.getElementById('v-body').textContent = body; document.getElementById('v-body-wrap').classList.remove('hidden'); }
    vWrap.classList.remove('hidden');

  } else if (isImage(url)) {
    // Uploaded image — show in article layout with big image on top
    const hero = document.getElementById('a-hero');
    hero.className = 'rounded-2xl overflow-hidden mb-5';
    hero.innerHTML = `<img src="${url}" class="w-full max-h-96 object-contain bg-black/5" alt="${item.title}">`;
    document.getElementById('a-type').textContent  = item.content_type || '';
    document.getElementById('a-title').textContent = item.title || '';
    document.getElementById('a-desc').textContent  = item.description || '';
    if (body) { document.getElementById('a-body').textContent = body; document.getElementById('a-body-wrap').classList.remove('hidden'); }
    document.getElementById('layout-article').classList.remove('hidden');

  } else if (isPdf(url)) {
    // PDF viewer
    const embedUrl = url.includes('drive.google.com/file') ? url.replace('/view', '/preview') : url;
    document.getElementById('pdf-frame').src       = embedUrl;
    document.getElementById('pdf-download').href   = url;
    document.getElementById('p-type').textContent  = item.content_type || '';
    document.getElementById('p-title').textContent = item.title || '';
    document.getElementById('layout-pdf').classList.remove('hidden');

  } else {
    // Article / Doa / Exercise / Link layout
    const hero = document.getElementById('a-hero');
    hero.className = `rounded-2xl flex items-center gap-5 px-6 py-5 mb-5 bg-gradient-to-br ${item.gradient || 'from-navy to-teal'}`;
    hero.innerHTML = `<div id="a-icon" class="text-5xl flex-shrink-0">${item.icon || '📄'}</div>
      <div>
        <span id="a-type" class="chip bg-white/30 text-white text-xs mb-2 inline-block">${item.content_type || ''}</span>
        <h1 id="a-title" class="font-bold text-xl text-white leading-snug">${item.title || ''}</h1>
        <p id="a-desc" class="text-white/70 text-sm mt-1">${item.description || ''}</p>
      </div>`;
    if (body) { document.getElementById('a-body').textContent = body; document.getElementById('a-body-wrap').classList.remove('hidden'); }
    if (url)  { document.getElementById('a-link').href = url;  document.getElementById('a-link-wrap').classList.remove('hidden'); }
    if (!body && !url) document.getElementById('a-empty').classList.remove('hidden');
    document.getElementById('layout-article').classList.remove('hidden');
  }
}

(async () => {
  const user = await initPatient('library', 'Kandungan Library');
  if (!user) return;

  setHeaderBack('library.html', 'Kembali ke Library');

  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { window.location.href = 'library.html'; return; }

  const rows = await dbQuery('psy_library_items', { eq: { item_id: id, is_active: true }, limit: 1 }).catch(() => []);
  if (!rows.length) {
    document.getElementById('detail-loading').textContent = 'Kandungan tidak dijumpai.';
    return;
  }
  renderDetail(rows[0]);
})();
</script>
</body>
</html>
