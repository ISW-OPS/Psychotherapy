<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Feedback</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="_styles.css" rel="stylesheet">
</head>
<body class="min-h-screen">

<div id="app-loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center"><div class="text-4xl mb-3">⭐</div><p class="text-ink/60 text-sm">Memuatkan...</p></div>
</div>

<div id="app-shell" class="hidden">
  <div class="flex min-h-screen">
    <aside id="sidebar" class="sidebar w-64 bg-navy-dark text-white flex-col sticky top-0 h-screen"></aside>
    <main class="main-content flex-1 min-w-0">
      <header id="page-header" class="bg-white border-b border-ink/10 px-4 md:px-8 py-4 sticky top-0 z-10 flex items-center justify-between gap-4"></header>

      <div class="p-4 md:p-8">
        <div class="max-w-xl mx-auto bg-white rounded-2xl border border-ink/10 p-6 md:p-8">
          <h2 class="text-xl font-bold mb-1">Bagaimana pengalaman anda?</h2>
          <p class="text-sm text-ink/70 mb-6">Feedback anda membantu kami memperbaiki rawatan</p>

          <div class="text-center mb-6">
            <div class="text-sm text-ink/70 mb-3">Rating pengalaman keseluruhan</div>
            <div id="rating-stars" class="flex justify-center gap-2 text-4xl">
              <span class="cursor-pointer" onclick="setRating(1)">⭐</span>
              <span class="cursor-pointer" onclick="setRating(2)">⭐</span>
              <span class="cursor-pointer" onclick="setRating(3)">⭐</span>
              <span class="cursor-pointer" onclick="setRating(4)">⭐</span>
              <span class="cursor-pointer opacity-40" onclick="setRating(5)">⭐</span>
            </div>
          </div>

          <label class="block text-xs font-semibold mb-2">Yang paling membantu</label>
          <div id="helpful-chips" class="flex flex-wrap gap-2 mb-4"></div>

          <label class="block text-xs font-semibold mb-1">Komen / cadangan (optional)</label>
          <textarea id="feedback-comment" rows="5" placeholder="Tulis pengalaman anda..." class="w-full border border-ink/20 rounded-lg px-4 py-3 text-sm outline-none focus:border-navy"></textarea>
          <button onclick="submitFeedback()" class="w-full mt-5 bg-navy text-white py-3 rounded-lg font-semibold">Hantar Feedback</button>
        </div>
      </div>
    </main>
  </div>

  <nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-navy-dark text-white py-2 justify-around z-20">
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🏠</span>Home</a>
    
    <a href="plan.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>💊</span>Plan</a>
    <a href="shop.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>🛒</span>Shop</a>
    <a href="profile.html" class="flex flex-col items-center text-[10px] gap-0.5 p-2"><span>👤</span>Profile</a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config/supabase.js"></script>
<script src="../../shared/authGuard.js"></script>
<script src="../../shared/logout.js"></script>
<script src="../../shared/navbar.js"></script>
<script src="_shared.js"></script>
<script>
const HELPFUL_OPTIONS = ['Dr. Hamzah','Coach Amirah','Santapan Fitrah','BPS-S approach','Self-Help Library','Fast delivery'];
let selectedHelpful = new Set();
let currentRating = 4;

function renderHelpfulChips() {
  document.getElementById('helpful-chips').innerHTML = HELPFUL_OPTIONS.map(opt => {
    const active = selectedHelpful.has(opt);
    const cls = active
      ? 'chip bg-green-light text-green-dark border border-green cursor-pointer'
      : 'chip bg-cream border border-ink/20 cursor-pointer hover:border-green';
    return `<button type="button" onclick="toggleHelpful('${opt}')" class="${cls}">${opt}</button>`;
  }).join('');
}

function toggleHelpful(opt) {
  if (selectedHelpful.has(opt)) selectedHelpful.delete(opt);
  else selectedHelpful.add(opt);
  renderHelpfulChips();
}

function setRating(n) {
  currentRating = n;
  document.querySelectorAll('#rating-stars span').forEach((s, i) => s.className = i < n ? 'cursor-pointer' : 'cursor-pointer opacity-40');
}

async function submitFeedback() {
  const comment = document.getElementById('feedback-comment').value.trim();
  const btn = document.querySelector('button[onclick="submitFeedback()"]');
  btn.disabled = true; btn.textContent = 'Menghantar...';
  try {
    const { error } = await window.db.from('psy_feedback').insert({
      patient_id:   window.patientRecord?.id || null,
      user_id:      currentUser.id,
      patient_name: currentUser.full_name || null,
      rating:       currentRating,
      helpful:      Array.from(selectedHelpful),
      comment:      comment || null,
    });
    if (error) throw error;
    banner('Terima kasih atas feedback anda! ⭐');
    document.getElementById('feedback-comment').value = '';
    selectedHelpful.clear();
    currentRating = 4;
    renderHelpfulChips();
    setRating(4);
  } catch (err) {
    banner('Ralat: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Hantar Feedback';
  }
}

(async () => {
  const user = await initPatient('feedback', 'Kongsi pengalaman anda');
  if (!user) return;
  renderHelpfulChips();
})();
</script>
</body>
</html>
