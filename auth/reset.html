<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibnu Sina Wellness — Reset Kata Laluan</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../shared/theme.js"></script>
<script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
<script src="../shared/pwa.js" defer></script>
<script src="../shared/i18n-dict.js" defer></script>
<script src="../shared/i18n.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen bg-cream flex items-center justify-center p-4">

  <button onclick="iswToggleLang && iswToggleLang()" data-isw-lang-btn
    class="fixed top-4 right-4 z-50 px-3 h-9 min-w-[44px] rounded-full bg-white shadow-md border border-ink/10 text-xs font-bold text-navy"
    title="Bahasa / Language">EN</button>

  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
      <div class="bg-gradient-to-br from-navy-dark to-navy p-8 text-center text-white">
        <div class="w-20 h-20 mx-auto mb-4 bg-white rounded-2xl p-2 flex items-center justify-center">
          <img src="../image/Logo_ISW.png" alt="ISW" class="w-full h-full object-contain" onerror="this.outerHTML='<div class=\'text-3xl\'>🔐</div>'">
        </div>
        <h1 class="text-xl font-bold">Reset Kata Laluan</h1>
        <p class="text-white/70 text-xs mt-1">Tetapkan kata laluan baru</p>
      </div>

      <div class="p-8">
        <div id="reset-form">
          <form onsubmit="handleReset(event)">
            <label class="block text-xs font-semibold text-ink/70 mb-1">Kata Laluan Baru</label>
            <input id="new-password" type="password" placeholder="Minimum 6 aksara"
              class="w-full border border-ink/20 rounded-lg px-4 py-3 mb-3 text-sm focus:border-navy focus:ring-2 focus:ring-navy/20 outline-none">

            <label class="block text-xs font-semibold text-ink/70 mb-1">Sahkan Kata Laluan</label>
            <input id="confirm-password" type="password" placeholder="Ulang kata laluan baru"
              class="w-full border border-ink/20 rounded-lg px-4 py-3 mb-4 text-sm focus:border-navy focus:ring-2 focus:ring-navy/20 outline-none">

            <div id="reset-error" class="hidden mb-3 text-xs text-terracotta bg-terracotta-light rounded-lg p-3 text-center"></div>

            <button id="reset-btn" type="submit"
              class="w-full bg-navy text-white rounded-lg py-3 font-semibold hover:bg-navy-dark transition">
              Tetapkan Kata Laluan
            </button>
          </form>
        </div>

        <div id="reset-success" class="hidden text-center py-6">
          <div class="text-4xl mb-3">✅</div>
          <h3 class="font-bold text-lg text-green-dark">Kata Laluan Dikemaskini!</h3>
          <p class="text-sm text-ink/70 mt-2">Anda akan dialihkan ke halaman log masuk.</p>
        </div>

        <div id="reset-invalid" class="hidden text-center py-6">
          <div class="text-4xl mb-3">⚠</div>
          <h3 class="font-bold text-lg text-terracotta">Link Tidak Sah</h3>
          <p class="text-sm text-ink/70 mt-2">Link reset telah tamat tempoh atau tidak sah. Sila minta link baru.</p>
          <a href="login.html" class="mt-4 inline-block bg-navy text-white rounded-lg px-6 py-2 text-sm font-semibold">Kembali ke Log Masuk</a>
        </div>
      </div>
    </div>
  </div>

<script src="/shared/supabase.js"></script>
<script src="../config/supabase.js"></script>
<script>
async function handleReset(e) {
  e.preventDefault();
  const pwd = document.getElementById('new-password').value;
  const confirm = document.getElementById('confirm-password').value;
  const errEl = document.getElementById('reset-error');
  errEl.classList.add('hidden');

  if (pwd.length < 6) {
    errEl.textContent = 'Kata laluan mestilah sekurang-kurangnya 6 aksara';
    errEl.classList.remove('hidden');
    return;
  }
  if (pwd !== confirm) {
    errEl.textContent = 'Kata laluan tidak sepadan';
    errEl.classList.remove('hidden');
    return;
  }

  const btn = document.getElementById('reset-btn');
  btn.disabled = true;
  btn.textContent = 'Mengemaskini...';

  try {
    const { error } = await window.db.auth.updateUser({ password: pwd });
    if (error) throw error;

    document.getElementById('reset-form').classList.add('hidden');
    document.getElementById('reset-success').classList.remove('hidden');

    await window.db.auth.signOut();
    setTimeout(() => { window.location.href = 'login.html'; }, 2500);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Tetapkan Kata Laluan';
  }
}

(async () => {
  const { data: { session } } = await window.db.auth.getSession();
  if (!session) {
    document.getElementById('reset-form').classList.add('hidden');
    document.getElementById('reset-invalid').classList.remove('hidden');
  }
})();
</script>
</body>
</html>
