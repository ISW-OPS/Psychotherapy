<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ibnu Sina Wellness — Log Masuk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../shared/theme.js"></script>
  <script>tailwind.config = window.ISW_TAILWIND_CONFIG;</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
    }
  </style>
</head>

<body class="min-h-screen bg-cream flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Login Card -->
    <div id="login-card" class="bg-white rounded-2xl shadow-xl overflow-hidden">
      <div class="bg-gradient-to-br from-navy-dark to-navy p-8 text-center text-white">
        <div class="w-20 h-20 mx-auto mb-4 bg-white rounded-2xl p-2 flex items-center justify-center">
          <img src="../image/Logo_ISW.png" alt="ISW" class="w-full h-full object-contain" onerror="this.outerHTML='<div class=\'text-3xl\'>🏥</div>'">
        </div>
        <h1 class="text-xl font-bold">Ibnu Sina Wellness</h1>
        <p class="text-white/70 text-xs mt-1">Ibnu Sina Wellness · Psychotherapy System</p>
      </div>

      <div class="p-8">
        <!-- Login Form -->
        <div id="login-form">
          <h2 class="font-bold text-lg mb-4 text-ink">Log Masuk</h2>

          <form onsubmit="handleLogin(event)">
            <label class="block text-xs font-semibold text-ink/70 mb-1">Email</label>
            <input id="login-email" type="email" placeholder="email@ibnusinawellness.com"
              class="w-full border border-ink/20 rounded-lg px-4 py-3 mb-3 text-sm focus:border-navy focus:ring-2 focus:ring-navy/20 outline-none">

            <label class="block text-xs font-semibold text-ink/70 mb-1">Kata Laluan</label>
            <input id="login-password" type="password" placeholder="Masukkan kata laluan"
              class="w-full border border-ink/20 rounded-lg px-4 py-3 mb-4 text-sm focus:border-navy focus:ring-2 focus:ring-navy/20 outline-none">

            <div id="login-error"
              class="hidden mb-3 text-xs text-terracotta bg-terracotta-light rounded-lg p-3 text-center"></div>

            <button id="login-btn" type="submit"
              class="w-full bg-navy text-white rounded-lg py-3 font-semibold hover:bg-navy-dark transition">
              Log Masuk
            </button>
          </form>

          <div class="mt-4 text-center space-y-2">
            <button onclick="showForgot()" class="block w-full text-xs text-ink/60 hover:text-navy hover:underline">
              Lupa kata laluan?
            </button>
            <button onclick="showSignup()" class="text-xs text-navy font-semibold hover:underline">
              Belum ada akaun? Daftar di sini
            </button>
          </div>
        </div>

        <!-- Forgot Password Form -->
        <div id="forgot-form" class="hidden">
          <h2 class="font-bold text-lg mb-2 text-ink">Reset Kata Laluan</h2>
          <p class="text-xs text-ink/60 mb-4">Masukkan email anda. Link reset akan dihantar ke email tersebut.</p>

          <form onsubmit="handleForgot(event)">
            <label class="block text-xs font-semibold text-ink/70 mb-1">Email</label>
            <input id="forgot-email" type="email" placeholder="email@contoh.com"
              class="w-full border border-ink/20 rounded-lg px-4 py-3 mb-4 text-sm focus:border-navy focus:ring-2 focus:ring-navy/20 outline-none">

            <div id="forgot-error"
              class="hidden mb-3 text-xs text-terracotta bg-terracotta-light rounded-lg p-3 text-center"></div>
            <div id="forgot-success"
              class="hidden mb-3 text-xs text-green-dark bg-green-light rounded-lg p-3 text-center"></div>

            <button id="forgot-btn" type="submit"
              class="w-full bg-gold-dark text-white rounded-lg py-3 font-semibold hover:bg-gold transition">
              Hantar Link Reset
            </button>
          </form>

          <div class="mt-4 text-center">
            <button onclick="showLogin()" class="text-xs text-navy font-semibold hover:underline">
              Kembali ke Log Masuk
            </button>
          </div>
        </div>

        <!-- Signup Form -->
        <div id="signup-form" class="hidden">
          <h2 class="font-bold text-lg mb-4 text-ink">Daftar Akaun Baru</h2>

          <form onsubmit="handleSignup(event)">
            <label class="block text-xs font-semibold text-ink/70 mb-1">Nama Penuh</label>
            <input id="signup-name" type="text" placeholder="Nama penuh anda"
              class="w-full border border-ink/20 rounded-lg px-4 py-3 mb-3 text-sm focus:border-navy focus:ring-2 focus:ring-navy/20 outline-none">

            <label class="block text-xs font-semibold text-ink/70 mb-1">Email</label>
            <input id="signup-email" type="email" placeholder="email@contoh.com"
              class="w-full border border-ink/20 rounded-lg px-4 py-3 mb-3 text-sm focus:border-navy focus:ring-2 focus:ring-navy/20 outline-none">

            <label class="block text-xs font-semibold text-ink/70 mb-1">Kata Laluan</label>
            <input id="signup-password" type="password" placeholder="Minimum 6 aksara"
              class="w-full border border-ink/20 rounded-lg px-4 py-3 mb-4 text-sm focus:border-navy focus:ring-2 focus:ring-navy/20 outline-none">

            <input id="signup-role" type="hidden" value="patient">

            <div id="signup-error"
              class="hidden mb-3 text-xs text-terracotta bg-terracotta-light rounded-lg p-3 text-center"></div>

            <button id="signup-btn" type="submit"
              class="w-full bg-green text-white rounded-lg py-3 font-semibold hover:bg-green-dark transition">
              Daftar Akaun
            </button>
          </form>

          <div class="mt-4 text-center">
            <button onclick="showLogin()" class="text-xs text-navy font-semibold hover:underline">
              Sudah ada akaun? Log masuk
            </button>
          </div>
        </div>

        <!-- Signup Success -->
        <div id="signup-success" class="hidden text-center py-6">
          <div class="text-4xl mb-3">✅</div>
          <h3 class="font-bold text-lg text-green-dark">Pendaftaran Berjaya!</h3>
          <p class="text-sm text-ink/70 mt-2">Sila semak email untuk pengesahan akaun.</p>
          <button onclick="showLogin()" class="mt-4 bg-navy text-white rounded-lg px-6 py-2 text-sm font-semibold">
            Kembali ke Log Masuk
          </button>
        </div>

        <div class="mt-5 text-[11px] text-ink/50 border-t border-ink/10 pt-3 text-center">
          PDPA compliant · Data dilindungi · Ibnu Sina Wellness
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase.js"></script>
  <script src="auth.js"></script>
  <script>
    function showSignup() {
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('signup-form').classList.remove('hidden');
      document.getElementById('signup-success').classList.add('hidden');
      document.getElementById('forgot-form').classList.add('hidden');
    }
    function showLogin() {
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('signup-form').classList.add('hidden');
      document.getElementById('signup-success').classList.add('hidden');
      document.getElementById('forgot-form').classList.add('hidden');
    }
    function showForgot() {
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('signup-form').classList.add('hidden');
      document.getElementById('signup-success').classList.add('hidden');
      document.getElementById('forgot-form').classList.remove('hidden');
    }

    (async () => {
      const { data: { session } } = await window.db.auth.getSession();
      if (!session) return;

      const { data: profile } = await window.db
        .from('psy_profiles')
        .select('role, full_name')
        .eq('id', session.user.id)
        .maybeSingle();

      if (profile?.role) {
        localStorage.setItem('isw_role', profile.role);
        localStorage.setItem('isw_name', profile.full_name);
        window.location.href = `../roles/${profile.role}/dashboard.html`;
      }
    })();
  </script>
</body>

</html>
